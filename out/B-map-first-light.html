<script>
const D = {"crux": {"id": "first-light", "question": {"en": "What was the light of day one, before sun and moon?", "la": "Quae lux ante solem?", "he": "מַה הָיָה הָאוֹר שֶׁל יוֹם רִאשׁוֹן?"}, "summary": "Both benches agree the light is not the sun's; they disagree on what it is.", "finding": "The two benches ask the same question and each is shut out of the other's answer by a ruling it made somewhere else. The Latin bench's dominant answer, Augustine's, is that the light is the angelic creation, made and formed on the first day; the rabbinic bench cannot reach for it, because Bereshit Rabbah has already ruled — twice, at 1:3 and again at 3:8, which is K10's witness — that nothing whatever was created on the first day besides God, precisely so that nobody could say Michael held the sky at the south and Gabriel at the north while God measured in the middle. And the rabbinic answer, that the light was too good for the wicked and was stored away for the righteous in the time to come, has no Latin counterpart at all: the Latin either turns the light into angels or turns it into a proto-sun, and the one thing it never does is take the light out of the world and keep it. Where the two do meet, they meet on the compromise nobody on either side prefers. Augustine reports, at De Genesi ad litteram I.11, that 'this too I know to have been said by someone' — that the nature of light was made on the first day and the luminaries were afterwards made out of it — and he cannot say whose opinion it is; b. Chagigah 12a gives it as the sages' answer against R. Yaakov, in the same words and to the same objection from Gen 1:17. On the Latin side alone, the crux is decided twice and each time by weight rather than by argument. Bede does not refute the angelic light, he steps round it in a single sentence by naming three lights instead of two and leaving the angels already made and elsewhere; and Bonaventure, closing the question in the schools eight hundred years after Augustine opened it, grants that Augustine's position is 'multum rationabilis' and declines it because the expositors more generally follow the other. In between, the twelfth century simply builds a physics for the light it has decided on — a body of fire in the sun's stead (Hugh), a brightness like the sky before sunrise on a twelve-hour circuit (Honorius), a luminous cloud thin as the dawn (Comestor) — while Rupert of Deutz, in the same decade, argues that a light of that kind would make the first day the poorest of the six, an unstable accident snuffed out after three days by a God who changed his mind."}, "witnesses": [{"id": "lxx-1-3", "short": "lxx-1-3", "author": "The Seventy", "tradition": "greek-jewish", "date": -250, "datelabel": "c. 250 BCE", "place": "Alexandria", "lat": 31.2, "lon": 29.92, "answers": ["fiat-is-instantaneous"], "senses": ["translation"], "lemma": {"el": "γενηθήτω φῶς", "en": "let there be light"}, "en": "And God said, Let light be made. And light was made.", "translator": "claude-draft", "orig": "καὶ εἶπεν ὁ θεός Γενηθήτω φῶς. καὶ ἐγένετο φῶς.", "olang": "el", "source": "LXX Gen 1:3 (Rahlfs)", "notes": "The Greek uses one verb twice, γενηθήτω and ἐγένετο, so that the command and the thing commanded are the same word — which is the whole of the Latin argument about how God speaks, transplanted from a feature of the Greek that Latin's fiat / facta est reproduces exactly. Abelard is the only Latin on this crux who knows that the Hebrew does something different again.", "slot": false}, {"id": "vulgate-1-3", "short": "vulgate-1-3", "author": "Jerome", "tradition": "latin", "date": 392, "datelabel": "c. 392", "place": "Bethlehem", "lat": 31.7, "lon": 35.2, "answers": ["fiat-is-instantaneous"], "senses": ["translation"], "lemma": {"la": "Fiat lux", "en": "Let there be light"}, "en": "And God said: Let there be light. And light was made.", "translator": "claude-draft", "orig": "Dixitque Deus: Fiat lux. Et facta est lux.", "olang": "la", "source": "PL 28, col. 163C", "notes": "Four words that carry the crux: the light is made on the first day, the sun on the fourth, and Scripture never says what this light is. Every witness on both benches is answering a question the verse creates by silence.", "slot": false}, {"id": "br-3-4", "short": "br-3-4", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["lux-garment", "lux-from-temple"], "senses": ["allegorical", "literal"], "lemma": {"he": "מֵהֵיכָן נִבְרֵאת הָאוֹרָה", "en": "from what was the light created"}, "en": "Rabbi Shimon ben Yehotzadak asked Rabbi Shmuel bar Naḥman, saying to him: ‘Since I have about you that you are a master of aggada, [I ask you:] from what was the light created?’ He said to him: ‘It [the verse] teaches that the Holy One blessed be He wrapped himself in it like a garment, and the aura of its radiance shone from the end of the world to its end.’ He said it to him in a whisper. He said to him: ‘It is an explicit verse: “Wrapped in light as if with a garment” (Psalms 104:2), and you say it to me in a whisper? This is bewildering.’ He said to him: ‘Just as I heard it in a whisper, so I said it to you in a whisper.’ Rabbi Berekhya said: Had Rabbi Yitzḥak not expounded this in public, it would not have been possible to say it. Beforehand, what would they say? Rabbi Berekhya said in the name of Rabbi Yitzḥak: It is from the site of the Temple that the light was created. That is what is written: “And behold, the glory of the God of Israel was coming from the direction of the east…[and the earth shone with His glory]” (Ezekiel 43:2). And his glory is nothing other than the Temple, just as it says: “Throne of glory, exalted from the first, the place of our Temple…” (Jeremiah 17:12).", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "רַבִּי שִׁמְעוֹן בֶּן יְהוֹצָדָק שָׁאַל לְרַבִּי שְׁמוּאֵל בַּר נַחְמָן, אָמַר לוֹ מִפְּנֵי שֶׁשָּׁמַעְתִּי עָלֶיךָ שֶׁאַתָּה בַּעַל אַגָּדָה, מֵהֵיכָן נִבְרֵאת הָאוֹרָה, אָמַר לוֹ מְלַמֵּד שֶׁנִּתְעַטֵּף בָּהּ הַקָּדוֹשׁ בָּרוּךְ הוּא כַּשַּׂלְמָה וְהִבְהִיק זִיו הֲדָרוֹ מִסּוֹף הָעוֹלָם וְעַד סוֹפוֹ. אֲמָרָהּ לֵיהּ בִּלְחִישָׁה, אָמַר לוֹ מִקְרָא מָלֵא הוּא (תהלים קד, ב): עוֹטֶה אוֹר כַּשַּׂלְמָה, וְאַתְּ אֲמַרְתְּ לִי בִּלְחִישָׁה, אֶתְמְהָא. אָמַר לוֹ כְּשֵׁם שֶׁשְּׁמַעְתִּיהָ בִּלְחִישָׁה כָּךְ אֲמַרְתִּיהָ לָךְ בִּלְחִישָׁה. אָמַר רַבִּי בֶּרֶכְיָה, אִלּוּלֵי שֶׁדְּרָשָׁהּ רַבִּי יִצְחָק בָּרַבִּים לֹא הָיָה אֶפְשָׁר לְאָמְרָהּ, מִקַּמֵּי כֵּן מָה הָיוּ אָמְרִין. רַבִּי בֶּרֶכְיָה בְּשֵׁם רַבִּי יִצְחָק אָמַר מִמָּקוֹם בֵּית הַמִּקְדָּשׁ נִבְרֵאת הָאוֹרָה, הֲדָא הוּא דִכְתִיב (יחזקאל מג, ב): וְהִנֵּה כְּבוֹד אֱלֹהֵי יִשְׂרָאֵל בָּא מִדֶּרֶךְ הַקָּדִים, וְאֵין כְּבוֹדוֹ אֶלָּא בֵּית הַמִּקְדָּשׁ, כְּמָה דְאַתְּ אָמַר (ירמיה יז, יב): כִּסֵּא כָבוֹד מָרוֹם מֵרִאשׁוֹן מְקוֹם מִקְדָּשֵׁנוּ וגו'.", "olang": "he", "source": "Bereshit Rabbah 3:4 (Vilna numbering)", "notes": "The question of this crux asked in the rabbinic idiom — not what the light was but what it was made from — and answered in a whisper. R. Shmuel bar Naḥman says the Holy One wrapped himself in it like a garment and the radiance shone from one end of the world to the other, and he says it under his breath even though Ps 104:2 says it outright; when challenged he answers only that he heard it whispered and so passes it on whispered. Then a second answer that no Latin witness could have imagined: R. Berekhya in the name of R. Yitzḥak, that the light was created from the site of the Temple. The Latin bench asks where the light shone (Bede: in the upper parts of the earth, where the sun's daylight falls now); this bench asks where it came from, and answers with a place in Jerusalem.", "slot": false}, {"id": "br-3-6", "short": "br-3-6", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["lux-hidden"], "senses": ["literal", "allegorical"], "lemma": {"he": "גְּנָזוֹ לַצַּדִּיקִים לֶעָתִיד לָבוֹא", "en": "he stored it away for the righteous in the time to come"}, "en": "“God called the light, Day” – are “light” and “day” not the same thing? This is bewildering. It is taught: The light that was created during the six days of Creation cannot illuminate by day, because it would make the orb of the sun seem dim [by comparison], nor can it [illuminate] at night, as it was created to illuminate only during the day. Where is it, then? It was stored away, and is designated for the righteous for the future, as it is stated: “The light of the moon will be like the light of the sun and the light of the sun will be sevenfold, like the light of the seven days” (Isaiah 30:26). This is bewildering: “Seven [days]”? Are they not three? Is it not so, that the lights were created only on the fourth day? It is, rather, like a person who says: This and that I am preparing for the seven days of the wedding feast. Rabbi Neḥemya said: These are the seven days of mourning for the righteous Methuselah, during which the Holy One blessed be He conferred extra light upon them. “God saw the light, that it was good, and God distinguished between the light and the darkness” (Genesis 1:4). “God saw the light, that it was good” – Rabbi Ze’eira son of Rabbi Abahu preached in Caesarea: From where is it derived that someone does not recite a blessing on the candle [at havdala on Saturday night] until he avails himself of its light? It is from here: “[God] saw…and [God] distinguished [vayavdel].” Rabbi Yehuda bar Rabbi Simon said: He set it aside for Himself. The Rabbis say: He set it aside for the righteous in the World to Come. This is analogous to a king who had a fine portion of food and set it aside for his son. “God called the light, Day, and to the darkness He called Night. It was evening and it was morning, one day” (Genesis 1:5). Rabbi Berekhya said: This is what two eminent men of the world, Rabbi Yoḥanan and Rabbi Shimon ben Lakish, expounded: “[God] distinguished” – this refers to distinguishing in the literal sense. This is analogous to a king who had two commanders, one to be in charge by day and one to be in charge by night. They were arguing with one another. This one said: ‘I will be in charge by day,’ and that one said: ‘I will be in charge by day.’ The king summoned the first one and said to him: ‘So-and-so, the day will be your realm.’ Likewise for the second one, he said to him: ‘So-and-so, the night will be your realm.’ So, too, “God called the light, Day” – He said to it: ‘The day will be your realm.’ “And to the darkness He called Night” – He said to it: ‘The night will be your realm.’ Rabbi Yoḥanan said: That is what the Holy One blessed be He says to Job: “In all your days, have you commanded the morning and apprised darkness of its place?” (Job 38:12) – have you informed it of its place, where it is? This was a rhetorical question. Rabbi Tanḥuma said: I will say the source for this: “He forms light and creates darkness, He makes peace” (Isaiah 45:7) – after they were created, He made peace [between them]. “God called the light, Day” – Rabbi Elazar said: The Holy One blessed be He never associates His name with the bad, but only with the good. “God called the light, Day and to the darkness God called night” is not written here, but rather, “to the darkness He called night.”", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "וַיִּקְרָא אֱלֹהִים לָאוֹר יוֹם, לֹא הוּא אוֹר וְלֹא הוּא יוֹם, אֶתְמְהָא. תְּנִי אוֹרָה שֶׁנִּבְרֵאת בְּשֵׁשֶׁת יְמֵי בְרֵאשִׁית, לְהָאִיר בַּיּוֹם אֵינָה יְכוֹלָה, שֶׁהִיא מַכְּהָהּ גַּלְגַּל הַחַמָּה, וּבַלַּיְלָה אֵינָה יְכוֹלָה, שֶׁלֹא נִבְרֵאת לְהָאִיר אֶלָּא בַּיּוֹם, וְהֵיכָן הִיא, נִגְנְזָה, וְהִיא מְתֻקֶּנֶת לַצַּדִּיקִים לֶעָתִיד לָבוֹא, שֶׁנֶּאֱמַר (ישעיה ל, כו): וְהָיָה אוֹר הַלְּבָנָה כְּאוֹר הַחַמָּה וְאוֹר הַחַמָּה יִהְיֶה שִׁבְעָתַיִם כְּאוֹר שִׁבְעַת הַיָּמִים, אֶתְמְהָא, שִׁבְעַת, וְלֹא שְׁלשָׁה הֵן, וַהֲלֹא בָּרְבִיעִי נִבְרְאוּ הַמְאוֹרוֹת. אֶלָּא כְּאֵינַשׁ דַּאֲמַר כֵּן וְכֵן אֲנָא מְפַקֵּד לְשִׁבְעַת יוֹמַיָא דְּמִשְׁתּוֹתֵי. רַבִּי נְחֶמְיָה אָמַר אֵלּוּ שִׁבְעַת יְמֵי אֲבֵלוּת שֶׁל מְתוּשֶׁלַח הַצַּדִּיק, שֶׁהִשְׁפִּיעַ לָהֶן הַקָּדוֹשׁ בָּרוּךְ הוּא אוֹרָה. וַיַּרְא אֱלֹהִים אֶת הָאוֹר כִּי טוֹב, רַבִּי זְעֵירָא בְּרֵיהּ דְּרַבִּי אַבָּהוּ דָּרַשׁ בְּקֵיסָרִין, מִנַּיִן שֶׁאֵין מְבָרְכִין עַל הַנֵּר עַד שֶׁיֵּאוֹתוּ לְאוֹרוֹ, מִן הָכָא, וַיַּרְא, וַיַּבְדֵּל. רַבִּי יְהוּדָה בְּרַבִּי סִימוֹן אָמַר הִבְדִּילוֹ לוֹ. רַבָּנָן אָמְרֵי הִבְדִּילוֹ לַצַּדִּיקִים לֶעָתִיד לָבוֹא, מָשָׁל לְמֶלֶךְ שֶׁהָיָה לוֹ מָנָה יָפָה וְהִפְרִישָׁהּ לִבְנוֹ. אָמַר רַבִּי בֶּרֶכְיָה כָּךְ דָּרְשׁוּ שְׁנֵי גְדוֹלֵי עוֹלָם, רַבִּי יוֹחָנָן וְרַבִּי שִׁמְעוֹן בֶּן לָקִישׁ, וַיַּבְדֵּל הַבְדָּלָה מַמָּשׁ, מָשָׁל לְמֶלֶךְ שֶׁהָיָה לוֹ שְׁנֵי אִיסְטַרְטִיגִין, אֶחָד שַׁלִּיט בַּיּוֹם וְאֶחָד שַׁלִּיט בַּלַּיְלָה, וְהָיוּ שְׁנֵיהֶם מִדַּיְינִין זֶה עִם זֶה, זֶה אוֹמֵר בַּיּוֹם אֲנִי שׁוֹלֵט, וְזֶה אוֹמֵר בַּיּוֹם אֲנִי שׁוֹלֵט. קָרָא הַמֶּלֶךְ לָרִאשׁוֹן אָמַר לוֹ פְּלוֹנִי יוֹם יְהֵא תְּחוּמָךְ, וְכֵן לַשֵׁנִי אָמַר לוֹ פְּלוֹנִי לַיְלָה יְהֵא תְּחוּמָךְ. כָּךְ וַיִּקְרָא אֱלֹהִים לָאוֹר יוֹם, אָמַר לוֹ יוֹם יְהֵא תְּחוּמָךְ, וְלַחשֶׁךְ קָרָא לָיְלָה, אָמַר לוֹ לַיְלָה יְהֵא תְּחוּמָךְ. אָמַר רַבִּי יוֹחָנָן הוּא שֶׁהַקָּדוֹשׁ בָּרוּךְ הוּא אוֹמֵר לְאִיּוֹב (איוב לח, יב): הֲמִיָּמֶיךָ צִוִּיתָ בֹּקֶר יִדַּעְתָּ הַשַּׁחַר מְקֹמוֹ, הֲיָדַעְתָּ מְקוֹמוֹ אֵי זֶה הוּא, אֶתְמְהָא. אָמַר רַבִּי תַּנְחוּמָא אֲנָא אָמְרֵי טַעֲמָא (ישעיה מה, ז): יוֹצֵר אוֹר וּבוֹרֵא חשֶׁךְ עֹשֶׂה שָׁלוֹם, מִשֶּׁנִּבְרְאוּ עֹשֶׂה שָׁלוֹם. וַיִּקְרָא אֱלֹהִים לָאוֹר יוֹם, אָמַר רַבִּי אֶלְעָזָר לְעוֹלָם אֵין הַקָּדוֹשׁ בָּרוּךְ הוּא מְיַחֵד שְׁמוֹ עַל הָרָעָה אֶלָא עַל הַטּוֹבָה, וַיִּקְרָא אֱלֹהִים לָאוֹר יוֹם וְלַחשֶׁךְ קָרָא אֱלֹהִים לַיְלָה אֵין כְּתִיב כָּאן, אֶלָּא וְלַחשֶׁךְ קָרָא לַיְלָה.", "olang": "he", "source": "Bereshit Rabbah 3:6 (Vilna numbering)", "notes": "The rabbinic answer proper, and it has no Latin counterpart at all. The light of the six days cannot shine by day, because it would make the sun's disc look dim, and it was not made to shine by night: so where is it? It was stored away, designated for the righteous in the time to come (Isa 30:26). The section then has to explain why Isaiah says seven days when the luminaries were made on the fourth, and answers with a wedding feast and, in R. Neḥemya's name, with the seven days of mourning for Methuselah. The Latin bench never hides the light: it either turns it into the angels or turns it into a proto-sun, and the one thing it never does is take it out of the world and keep it.", "slot": false}, {"id": "b-chag-12a-light", "short": "b-chag-12a-light", "author": "Babylonian Talmud", "tradition": "rabbinic", "date": 550, "datelabel": "redaction 500–600", "place": "Babylonia (Sura / Pumbedita)", "lat": 32.5, "lon": 44.4, "answers": ["lux-hidden", "lux-becomes-luminaries"], "senses": ["literal"], "lemma": {"he": "אוֹר שֶׁבָּרָא הַקָּדוֹשׁ בָּרוּךְ הוּא בַּיּוֹם רִאשׁוֹן", "en": "the light the Holy One created on the first day"}, "en": "And was light created on the first day? But it is written, (Genesis 1:17) \"and God set them in the firmament of the heaven,\" and it is written, (Genesis 1:19) \"and there was evening and there was morning, a fourth day.\" It is like R. Elazar. For R. Elazar said, The light which the Holy One, blessed be He, created on the first day, Adam saw through it from one end of the world to the other. When the Holy One, blessed be He, peered at the generation of the Flood and the generation of the Dispersion, and saw that their actions were destructive, He stood up and hid it from them, as it is said, (Job 38:15) \"And from the wicked their light is withheld.\" And for whom did He take it away? For the righteous of the time to come, as it is said, (Genesis 1:4) \"And God saw the light, that it was good,\" and \"good\" only refers to the righteous, as it is said, (Isaiah 3:10) \" Say of the righteous, that he is good.\" Once He saw the light He hid away for the righteous, He rejoiced, as it is said, (Proverbs 13:9) \"He rejoices at the light of the righteous.\" Like [the following] Tannaic argument: The light which the Holy One, blessed be He, created on the first day, Adam observed and peered through it from one end of the world to the other. These are the words of R. Yaakov. And the sages say, These are the lights which were created on the first day, but were not hung up until the fourth day.", "translator": "Sefaria Community Translation", "orig": "ואור ביום ראשון איברי והכתיב ויתן אותם אלהים ברקיע השמים וכתיב ויהי ערב ויהי בקר יום רביעי כדר' אלעזר דא\"ר אלעזר אור שברא הקב\"ה ביום ראשון אדם צופה בו מסוף העולם ועד סופו כיון שנסתכל הקב\"ה בדור המבול ובדור הפלגה וראה שמעשיהם מקולקלים עמד וגנזו מהן שנאמר (איוב לח, טו) וימנע מרשעים אורם ולמי גנזו לצדיקים לעתיד לבא שנאמר וירא אלהים את האור כי טוב ואין טוב אלא צדיק שנאמר (ישעיהו ג, י) אמרו צדיק כי טוב כיון שראה אור שגנזו לצדיקים שמח שנאמר (משלי יג, ט) אור צדיקים ישמח כתנאי אור שברא הקב\"ה ביום ראשון אדם צופה ומביט בו מסוף העולם ועד סופו דברי רבי יעקב וחכ\"א הן הן מאורות שנבראו ביום ראשון ולא נתלו עד יום רביעי", "olang": "arc", "source": "b. Chagigah 12a (Vilna)", "notes": "The whole crux in five short segments, and it opens with the objection in the same form the Latin bench uses: was light created on the first day? But it is written that God set them in the firmament, and that was the fourth day. Two answers follow. R. Elazar's: by that light Adam saw from one end of the world to the other, and when God looked at the generations of the Flood and the Dispersion he hid it, storing it for the righteous. And then a tannaitic dispute — R. Yaakov holds the seeing-light, and the sages say 'these are the lights that were created on the first day but were not hung up until the fourth.' That second answer is exactly the one Augustine reports as having been said 'by someone' at De Genesi ad litteram I.11, without a name.", "slot": false}, {"id": "rashi-1-4", "short": "rashi-1-4", "author": "Rashi", "tradition": "rabbinic", "date": 1090, "datelabel": "1080–1105", "place": "Troyes", "lat": 48.3, "lon": 4.08, "answers": ["lux-hidden"], "senses": ["literal", "allegorical"], "lemma": {"he": "וַיַּרְא … וַיַּבְדֵּל", "en": "and he saw … and he divided"}, "en": "וירא אלהים את האור כי טוב ויבדל AND GOD SAW THE LIGHT THAT IT WAS GOOD, AND GOD CAUSED A DIVISION — Here, also, we must depend upon the statement of the Agada: He saw that the wicked were unworthy of using it (the light); He, therefore, set it apart (ויבדל), reserving it for the righteous in the world to come (Chagigah 12a). But according to the plain sense explain it thus: He saw that it was good, and that it was not seemly that light and darkness should function together in a confused manner. He therefore limited this one’s sphere of activity to the daytime, and this one’s sphere of activity to the nighttime (see Genesis Rabbah 3:6).", "translator": "Rosenbaum–Silbermann 1929–34", "orig": "וירא אלהים את האור כי טוב ויבדל. אַף בָּזֶה אָנוּ צְרִיכִין לְדִבְרֵי אַגַּדָה, רָאָהוּ שֶׁאֵינוֹ כְדַאי לְהִשְׁתַּמֵשׁ בּוֹ רְשָׁעִים, וְהִבְדִּילוֹ לַצַּדִּיקִים לֶעָתִיד לָבֹא. וּלְפִי פְּשׁוּטוֹ כָּךְ פָּרְשֵׁהוּ, רָאָהוּ כִּי טוֹב, וְאֵין נָאֶה לוֹ וְלַחֹשֶׁךְ שֶׁיִּהְיוּ מִשְׁתַּמְּשִׁים בְּעִרְבּוּבְיָא, וְקָבַע לָזֶה תְחוּמוֹ בַּיּוֹם, וְלָזֶה תְחוּמוֹ בַּלַּיְלָה:", "olang": "he", "source": "Rashi on Gen 1:4, s.v. וירא אלהים את האור כי טוב ויבדל", "notes": "Rashi puts the two rabbinic answers in his usual order and names both sources. First 'here too we must depend on the statement of the Agada': God saw that the wicked were unworthy of the light, so he set it apart for the righteous in the world to come — and he cites Chagigah 12a for it. Then the plain sense, from Bereshit Rabbah 3:6: it was not seemly that light and darkness should work in confusion, so he gave each its own hours. The hiding is aggada and the division is peshat, and Rashi does not merge them. Note that the hiding is derived from the word va-yavdel, 'and he divided' — the same word K9 is built on.", "slot": false}, {"id": "pdre-3-6", "short": "pdre-3-6", "author": "Pirkei de-Rabbi Eliezer", "tradition": "rabbinic", "date": 800, "datelabel": "750–850", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["lux-garment"], "senses": ["literal"], "lemma": {"he": "מֵאוֹר לְבוּשׁוֹ", "en": "from the light of his garment"}, "en": "Whence were the heavens created? From the light of the garment with which He was robed. He took (of this light) and stretched it like a garment and (the heavens) began to extend continually until He caused them to hear, \"It is sufficient.\" Therefore is He called God Almighty (El Shaddai), who said to the world: \"It is sufficient,\" and it stood (firm). Whence do we know that the heavens were created from the light of His garment? Because it is said, \"Who coverest thyself with light as with a garment; who stretchest out the heavens like a curtain\" (Ps. 104:2).", "translator": "Gerald Friedlander, 1916", "orig": "שָׁמַיִם מֵאֵיזֶה מָקוֹם נִבְרְאוּ? מֵאוֹר לְבוּשׁוֹ שֶׁל הַקָּדוֹשׁ בָּרוּךְ הוּא שֶׁהוּא לָבוּשׁ. לָקַח מִמֶּנּוּ וּפָרַשׂ כַּשַּׂלְמָה וְהָיוּ מוֹתְחִין וְהוֹלְכִין עַד שֶׁאָמַר לָהֶם: דַּי, וְעַל כֵּן נִקְרָא שְׁמוֹ שַׁדַּי, שֶׁאָמַר לַשָּׁמַיִם דַּי וְעָמְדוּ. וּמִנַּיִן שֶׁמֵּאוֹר לְבוּשׁוֹ נִבְרָא? שֶׁנֶּאֱמַר (תהלים קד, ב): ״עֹטֶה אוֹר כַּשַּׂלְמָה נוֹטֶה שָׁמַיִם כַּיְרִיעָה״.", "olang": "he", "source": "Pirkei de-Rabbi Eliezer 3", "notes": "The garment of Bereshit Rabbah 3:4, no longer whispered and turned into cosmogony: the heavens were made out of the light of the garment God wraps himself in, taken and stretched like a curtain until he said Dai, enough — which is why he is called El Shaddai. Ps 104:2 supplies both halves in one verse, 'who covers himself with light as with a garment, who stretches out the heavens like a curtain'. The first light is thus not merely prior to the luminaries but prior to the sky and the material of it. Nothing on the Latin bench makes the light the stuff of anything; the nearest is Augustine's report at De Gen. ad litt. I.11 that someone held the luminaries were made out of it.", "slot": false}, {"id": "basil-hex-2-7", "short": "basil-hex-2-7", "author": "Basil of Caesarea", "tradition": "latin", "date": 550, "datelabel": "500–600", "place": "Caesarea in Cappadocia", "lat": 38.72, "lon": 35.49, "answers": ["lux-corporalis"], "senses": ["literal"], "lemma": {"la": "Prima vox Dei naturam luminis fabricavit", "en": "The first voice of God fashioned the nature of light"}, "en": "And God said, Let there be light. The first voice of God fashioned the nature of light, and drove away the darkness, and dissolved gloom, and suddenly brought forth every glad and pleasant appearance. Then the vault appeared, which had until then been hidden by the Lord; and so great a beauty of it shone out as the sight bears witness to even now. And the air was lit up by that light which had been mingled with it, and it stretched the sharp penetration of its own brightness everywhere through all its bounds.", "translator": "claude-draft", "orig": "Et dixit Deus, Fiat lux. Prima vox Dei naturam luminis fabricavit, ac tenebras dispulit, moeroremque dissolvit, et omnem subito laetam speciem jucundamque produxit. Polus tunc apparuit, qui erat interim celatus a Domino; tantaque ejus pulchritudo perclaruit, quantam nunc etiam testificatur aspectus. Aer autem illustrabatur ex ea luce quae sibi erat admixta, acutamque penetrationem proprii fulgoris, ubique per omnes suos terminos intendebat", "olang": "la", "source": "PL 53, col. 887A", "notes": "The Greek tradition entering Latin, and it has no doubt at all: the light is a nature that God's voice fashioned, and what it does is physical — the air takes it up and carries it to its limits, the water throws it back, the sky becomes visible. Basil is the only Father on this bench who describes the light as a phenomenon rather than as a question, and Eustathius' Latin keeps that. The twelfth-century schoolmen — Hugh, Honorius, Comestor — end up where Basil starts, and they get there without citing him.", "slot": false}, {"id": "ambrose-hex-1-9", "short": "ambrose-hex-1-9", "author": "Ambrose", "tradition": "latin", "date": 387, "datelabel": "c. 387", "place": "Milan", "lat": 45.46, "lon": 9.19, "answers": ["lux-corporalis", "fiat-is-instantaneous"], "senses": ["literal"], "lemma": {"la": "Naturae opifex lucem locutus est, et creavit", "en": "The maker of nature spoke light, and created it"}, "en": "'Let there be light,' he says. Where should the voice of God in divine Scripture begin, if not from light? Whence should the adorning of the world take its start, if not from light? For it would be in vain, if it were not seen. God himself was indeed in light, for he dwells in light inaccessible, and he was the true light, which enlightens every man coming into this world; but he made that light which we see. […] Where the builder lays the foundations he looks out from where he may pour light into it, and that is the first grace, and if it is wanting the whole house bristles with an unlovely neglect. It is light that commends the rest of the house's ornament. 'Let there be light,' he says. A full utterance of light — it does not signify the apparatus of an arrangement, but shines out with the effect of an operation. The maker of nature spoke light, and created it.", "translator": "claude-draft", "orig": "Fiat, inquit, lux. Unde vox Dei in Scriptura divina debuit inchoare, nisi a lumine? unde mundi ornatus, nisi a luce exordium sumere? Frustra enim esset, si non videretur. Erat quidem Deus ipse in lumine, quia lucem habitat inaccessibilem, et erat lumen verum, quod illuminat omnem hominem venientem in hunc mundum: sed eam lucem fieri voluit, quae oculis corporalibus comprehenderetur. Qui aedificium aliquod dignum habitaculo patrisfamilias struere desiderat, antequam fundamenta ponat, unde lucem ei infundat explorat, et ea prima est gratia, quae si desit, tota domus deformi horret incultu. Lux est quae reliquos domus commendat ornatus. Fiat, inquit, lux. Plena vox luminis non dispositionis apparatum significat, sed operationis resplendet effectu. Naturae opifex lucem locutus est, et creavit.", "olang": "la", "source": "PL 14, col. 141D", "notes": "Ambrose keeps two lights apart in one paragraph and the distinction is the whole crux in miniature: God dwells in light inaccessible and is himself the true light of John 1:9, 'but he made that light' — hanc, this one, the one under discussion. The rest is the ornament argument, that a world had to be lit before it could be seen at all, with the builder's house for an image. Nothing here is angelic. Elided at […]: the sentence on the darkness fleeing and the intervening image of the householder choosing where his windows go.", "slot": false}, {"id": "aug-gnl-1-3", "short": "aug-gnl-1-3", "author": "Augustine", "tradition": "latin", "date": 410, "datelabel": "401–415", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["lux-angelica"], "senses": ["literal"], "lemma": {"la": "utrum spirituale quid, an corporale?", "en": "whether something spiritual or something bodily?"}, "en": "And what is that light itself which was made? Is it something spiritual, or something bodily? For if spiritual, it can itself be the first creature, already made perfect by this saying, which was first called heaven when it was said, 'In the beginning God made heaven and earth' — so that what God said, 'Let there be light, and light was made', may be understood as its conversion and illumination, the Creator calling it back to himself.", "translator": "claude-draft", "orig": "Et quid est lux ipsa quae facta est? utrum spirituale quid, an corporale? Si enim spirituale, potest ipsa esse prima creatura, jam hoc dicto perfecta, quae primo coelum appellata est, cum dictum est, In principio fecit Deus coelum et terram: ut quod dixit Deus, Fiat lux; et facta est lux, eam revocante ad se Creatore, conversio ejus facta atque illuminata intelligatur.", "olang": "la", "source": "PL 34, col. 248", "notes": "The crux as a disjunction, in the sentence that decided the Latin question for eight centuries: spiritual or bodily? Augustine leaves the alternative open here in form, but the whole of his exposition follows the first limb, and the doctrine is already complete in the second half of the sentence — the light is the spiritual creature that was called 'heaven' in verse 1, and 'let there be light' is not its making but its conversion, its turning back to the Creator and being illuminated by him. Bonaventure will state this position fairly and decline it, and give the reason: not that it is unreasonable, but that the text more readily intimates the other.", "slot": false}, {"id": "aug-gnl-1-11", "short": "aug-gnl-1-11", "author": "Augustine", "tradition": "latin", "date": 410, "datelabel": "401–415", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["lux-becomes-luminaries", "lux-corporalis"], "senses": ["literal"], "lemma": {"la": "Utquid ergo factus est sol", "en": "Why then was the sun made"}, "en": "Why then was the sun made 'to rule the day' (Ps 136:8), to shine over the earth, if that light was sufficient for making a day — the light that was itself called Day? Or did that earlier light illuminate regions high and far from the earth, so that it could not be felt on earth, and so the sun had to be made, through which day might appear to the lower parts of the world? This too can be said: that the brightness was increased by the addition of the sun, so that the day is believed to have been less bright by that earlier light than it is now. This too I know to have been said by someone: that the nature of light was first brought in in the Creator's work, when it was said 'Let there be light, and light was made'; but afterwards, when the luminaries are spoken of, it was recorded what was made out of that same light, in the order of the days in which it seemed good to the Creator that all things should be made.", "translator": "claude-draft", "orig": "Utquid ergo factus est sol in potestatem diei (Psal. CXXXV, 8) , qui luceret super terram, si lux illa diei faciendo suffecerat, quae dies etiam vocata est? An illa prior regiones superiores a terra longinquas illustrabat, ut sentiri non posset in terris; atque ita oportebat solem fieri, per quem dies inferioribus mundi partibus appareret? Potest et hoc dici, auctum esse fulgorem dici sole addito, ut per illam lucem minus fulgens dies quam nunc est fuisse credatur. Etiam hoc a quodam dictum scio, primum naturam lucis inductam in opere Creatoris, cum dictum est, Fiat lux, et facta est lux; postea vero cum de luminaribus dicitur, quid ex ipsa luce factum sit fuisse commemoratum, ordine dierum, quo visum est Creatori cuncta esse facienda", "olang": "la", "source": "PL 34, col. 254", "notes": "The crux's hardest question, asked plainly: if that light already made a day, what is the sun for? Augustine offers three answers and holds none of them. The third is the one that matters here — 'this too I know to have been said by someone', a quodam dictum scio: that the nature of light was made on the first day and the luminaries were afterwards made out of it. That anonymous opinion is, word for word in substance, what b. Chagigah 12a attributes to the sages against R. Yaakov: 'these are the lights that were created on the first day but were not hung up until the fourth.' Augustine does not know whose it is, and the Talmud names the party that holds it.", "slot": false}, {"id": "bede-gen-1-3", "short": "bede-gen-1-3", "author": "Bede", "tradition": "latin", "date": 720, "datelabel": "717–725", "place": "Jarrow", "lat": 54.98, "lon": -1.49, "answers": ["lux-corporalis"], "senses": ["literal"], "lemma": {"la": "primam materialis gratiam lucis donavit", "en": "he gave the first grace of material light"}, "en": "It befits the works of God that he should begin the adorning of the world from light: he who, being himself the true light and dwelling in light inaccessible, in the beholding of which the angels, newly created in the heaven of heavens, had already begun to rejoice, fittingly gave to this world too, for its adorning, the first grace of material light, so that there might be something from which the rest that he would create could appear.", "translator": "claude-draft", "orig": "Congruit operibus Dei, ut mundi ornatum a luce incipiat: qui cum ipse sit lux vera, lucemque habitet inaccessibilem, cujus beatissima visione mox creati in coelis coelorum angeli jam perfrui coeperant, apte huic quoque saeculo ornando primam materialis gratiam lucis donavit, ut esset unde caetera quae crearet apparerent.", "olang": "la", "source": "PL 91, col. 16C", "notes": "Bede does the thing that decides the crux for the whole Carolingian line, and does it in one sentence without argument: he distinguishes three lights — God who is the true light, the inaccessible light the angels were already enjoying in the heaven of heavens, and 'the first grace of material light' given to this world. The angels are on the page and are not the light; they were made earlier and elsewhere. Augustine's identification is not refuted here, it is quietly stepped around, and Alcuin, Rabanus and the Glossa all inherit the step.", "slot": false}, {"id": "bede-gen-1-3b", "short": "bede-gen-1-3b", "author": "Bede", "tradition": "latin", "date": 720, "datelabel": "717–725", "place": "Jarrow", "lat": 54.98, "lon": -1.49, "answers": ["lux-corporalis"], "senses": ["literal"], "lemma": {"la": "quibus in locis facta sit lux", "en": "in what places the light was made"}, "en": "But if it is asked in what places, at God's bidding, the light was made, since the abyss still covered the whole breadth of the earth — it is quite plain that that first light shone in the upper parts of that same earth, the parts which the daily light of the sun is now accustomed to illumine. Nor should we wonder that by a divine working light can shine in the waters, since it is agreed that they are often lit by a human working too: by sailors, that is, who, sunk in the deep of the sea, make it clear and bright for themselves by letting oil out of their mouths. For if a man can do such things by the oil of his mouth, how much must God be believed able to create by the Spirit of his mouth.", "translator": "claude-draft", "orig": "Si autem quaeritur quibus in locis, jubente Deo, facta sit lux, cum adhuc abyssus omnem terrae amplitudinem contegeret, patet profecto quia in superioribus ejusdem terrae partibus, quas et nunc diurna solis lux illustrare consuevit, tunc principalis illa lux emicuit. Nec mirandum nobis divina operatione lucem in aquis posse resplendere, cum et hominum operatione constet eas saepius illustrari, nautarum videlicet, qui in profundo maris demersi, emisso ex ore oleo, perspicuum sibi hoc ac lucidum reddunt. Si enim homo talia per oleum sui oris potest, quantum Deus per Spiritum oris sui creare posse credendus est", "olang": "la", "source": "PL 91, col. 17A", "notes": "Once the light is material it acquires a location, and Bede supplies one: in the upper parts of the earth, where the sun's daylight falls now. The objection that the abyss covered everything he answers with an observed fact about divers, who let oil out of their mouths to see under water, and a pun that carries the argument — if a man can do it by the oil of his mouth, what can God do by the Spirit of his mouth. The Glossa keeps both the location and the divers and cuts the pun.", "slot": false}, {"id": "alcuin-int-33", "short": "alcuin-int-33", "author": "Alcuin", "tradition": "latin", "date": 800, "datelabel": "c. 800", "place": "Tours", "lat": 47.39, "lon": 0.69, "answers": ["lux-corporalis"], "senses": ["literal"], "lemma": {"la": "a luce aeterna lux temporalis", "en": "from the eternal light, a temporal light"}, "en": "Question 33. Why is light read to have been created on the first day? — Answer. It befits the works of God that on the first day a temporal light should first be made from the eternal light, so that there might be something from which the rest that he would create could appear.", "translator": "claude-draft", "orig": "Inter. 33. Quare prima die lux creata legitur?-- Resp. Congruit operibus Dei, ut prima die a [ Ms., de] luce aeterna lux temporalis primo fieret, ut esset unde caetera quae crearet, apparerent.", "olang": "la", "source": "PL 100, col. 520A", "notes": "Bede's sentence reduced to a schoolroom answer, with one word added that is not Bede's and that does the work: a luce aeterna, from the eternal light. Bede had set the eternal light beside the material one; Alcuin makes the temporal light come out of it, which is a claim about derivation and not merely about order. Compare Pirkei de-Rabbi Eliezer, where the heavens are made out of the light of God's garment: on both benches the first light acquires a source in God himself, and on neither is that reading argued for.", "slot": false}, {"id": "rabanus-gen-1-3", "short": "rabanus-gen-1-3", "author": "Rabanus Maurus", "tradition": "latin", "date": 822, "datelabel": "819–822", "place": "Fulda", "lat": 50.55, "lon": 9.68, "answers": ["lux-corporalis"], "senses": ["literal"], "lemma": {"la": "CAPUT II. Ubi lux primum fieri jubetur", "en": "Chapter II. Where light is first commanded to be made"}, "en": "It befits the works of God that he should begin the adorning of the world from light, since he himself is the true light and dwells in light inaccessible (1 Tim 6:16); in the most blessed beholding of which the angels, newly created in the heaven of heavens, had already begun to rejoice. Fittingly he gave to this world too, for its adorning, the first grace of material light, so that there might be something from which the rest that he would create could appear. […] But if it is asked in what places, at God's bidding, the light was made, since the abyss still covered the whole breadth of the earth — it is quite plain that it was in the upper parts of that same earth.", "translator": "claude-draft", "orig": "Congruit operibus Dei ut mundi ornatum a luce incipiat, cum ipse sit lux vera, lucemque habitet inaccessibilem (I Tim. VI) ; cujus beatissima visione mox creati in coelis coelorum angeli jam perfrui coeperant. Apte huic quoque saeculo ornando primam materialis gratiam lucis donavit, ut esset unde caetera quae crearet apparerent. Quod autem dixisse Deus, sive ut lux fieret, sive alia quaeque perhibetur, non nostro more per sonum vocis corporeum fecisse credendus est, sed altius intelligendum dixisse Deum ut fieret creatura, quia per Verbum suum omnia, id est, per unigenitum Filium fecit. De quo manifestius evangelista Joannes: In principio, inquit, erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum. Hoc erat in principio apud Deum; omnia per ipsum facta sunt (Joan. I) . Quod ergo ait, omnia facta per Verbum Dei Joannes, hoc est, quod Moyses ait, quia dixit Deus, Fiat lux; dixit, Fiat firmamentum; dixit, Fiat caetera creatura. Hoc quod psalmus adjuncta et Spiritus sancti persona dicit: Verbo Domini coeli firmati sunt, et Spiritu oris ejus omnis virtus eorum (Psal. XXXII) . Si autem quaeritur quibus in locis jubente Deo facta sit lux, cum adhuc abyssus omnem terrae amplitudinem contegeret, patet profecto quia in superioribus ejusdem terrae partibus", "olang": "la", "source": "PL 107, col. 447C", "notes": "Bede again, verbatim and unattributed, as at K1 and K7 and K10; the only visible editorial act is the chapter heading Rabanus puts over it, 'Where light is first commanded to be made', which turns Bede's continuous exposition into a lemma. Elided at […] is the long passage on how God speaks — that Moses' 'God said' and John's 'all things were made through the Word' are one statement — which Rabanus also takes from Bede entire.", "slot": false}, {"id": "angelom-gen-1-3", "short": "angelom-gen-1-3", "author": "Angelomus of Luxeuil", "tradition": "latin", "date": 845, "datelabel": "c. 845", "place": "Luxeuil", "lat": 47.82, "lon": 6.38, "answers": ["lux-angelica"], "senses": ["literal", "allegorical"], "lemma": {"la": "nomine lucis angelica dignitas figuratur", "en": "by the name of light the angelic dignity is figured"}, "en": "As for his saying 'let there be light', it is said on account of the swiftness of the divine power. For if the luminaries which supply light are described as made on the fourth day, what is it that he said, 'Let there be light'? Was there perhaps already some light created above the firmament, by whose illumination the sun was lit? Rather, by the name of light the angelic dignity is figured, which is signified by the higher heaven and is here called light. It was founded first, then, but was afterwards made light by turning to behold the glory of its creator. And therefore it was said, 'Let there be light, and light was made' — as if it were plainly being said: Let it turn to contemplate me unceasingly.", "translator": "claude-draft", "orig": "Caeterum quod ait, fiat lux, ob celeritatem divinae potentiae dicitur. Si enim quarta die describuntur luminaria facta, quae lucem administrant, quid est quod dixit, Fiat lux? An forsitan jam erat aliqua lux creata supra firmamentum, quo lumine sol illuminaretur? Sed nomine lucis angelica dignitas figuratur, quae profecto per superius coelum significatur, nunc lux dicitur. Prius itaque condita est, sed postea convertendo ad contuendam gloriam sui creatoris lux effecta. Et ideo dictum est: Fiat lux, et facta est lux. Ac si manifeste diceretur: Convertatur ad contemplandum incessabiliter me", "olang": "la", "source": "PL 115, col. 116D", "notes": "The one Carolingian on this bench who takes Augustine's side rather than Bede's, and he states the doctrine more sharply than Augustine does: the angelic nature was founded first and became light afterwards, by turning to behold its creator, so that 'let there be light' is a command to contemplate. He reaches it by the same route the Talmud's objectors take — if the luminaries are made on the fourth day, what is this? — and he even floats the physical answer (a light above the firmament from which the sun was lit) before rejecting it. K7 found Angelomus splicing Augustine onto Jerome without naming either; here he does the same with Augustine's angelic light.", "slot": false}, {"id": "remigius-gen-1-3", "short": "remigius-gen-1-3", "author": "Remigius of Auxerre", "tradition": "latin", "date": 900, "datelabel": "c. 900", "place": "Auxerre", "lat": 47.8, "lon": 3.57, "answers": ["lux-corporalis", "lux-twilight"], "senses": ["literal"], "lemma": {"la": "qualis esse solet vel ante solis ortum, vel post ejus occubitum", "en": "such as it is wont to be before sunrise or after sunset"}, "en": "'Let there be light.' Light (lux) is so called from cleansing (luendo), that is, from purging away the darkness. But that light was not of the kind that now is, with the sun set above; rather it was such as it is wont to be before the rising of the sun, or after its setting.", "translator": "claude-draft", "orig": "Fiat lux. Lux dicitur a luendo, id est a purgando tenebras. Lux autem illa non ejusmodi erat quae nunc est sole superposito, sed qualis esse solet vel ante solis ortum, vel post ejus occubitum.", "olang": "la", "source": "PL 131, col. 55B", "notes": "Two sentences, and the second is the answer the twelfth century will build a physics on: the light was twilight — what the sky is like before sunrise or after sunset. Honorius says the same (a brightness such as there is now before sunrise), Comestor calls it a luminous cloud thin as the dawn, and Hugh gives it a body and an orbit. The etymology in the first sentence is Isidore's manner and is false; it is kept because Remigius is arguing from it.", "slot": false}, {"id": "glossa-1-3", "short": "glossa-1-3", "author": "Glossa ordinaria (school of Laon)", "tradition": "latin", "date": 1120, "datelabel": "compilation 1110–1130", "place": "Laon", "lat": 49.56, "lon": 3.62, "answers": ["lux-angelica", "lux-corporalis"], "senses": ["literal", "allegorical"], "lemma": {"la": "Lux primo die facta spiritualis vel corporalis intelligitur", "en": "The light made on the first day is understood as spiritual or bodily"}, "en": "Verse 3. 'And God said: Let there be light.' (AUGUSTINE, on Genesis to the letter, book I, ch. 17, vol. III.) The light made on the first day is understood as spiritual or bodily, etc., down to: morning, the beginning of what is to come. (BEDE, Hexaemeron.) But if bodily light was made on the first day, fittingly is the adorning of the world begun from light, whence the rest that were to be created might be seen. And if it is asked where it was made, since the abyss covered the whole height of the earth — it is plain that it was in those parts which the daily light of the sun now illumines. Nor is it a wonder that light can shine in the waters, since they are often lit even by the working of sailors, who, sunk in the deep, let oil out of their mouths and light the waters for themselves: which waters were then much thinner than they now are, in the beginning, because they were not yet gathered into one place. 'And God said: Let there be light.' (AUGUSTINE, ibid., ch. 2.) Not temporally: for if temporally, then changeably; if changeably, then through a creature subject to him, and light is not the first creature. But perhaps, etc., down to: that it may be and may abide. 'Let there be light.' (AUGUSTINE, ibid., ch. 4, 5, 9.) On that condition, namely, by which all things subsist timelessly in the wisdom of God before they subsist in themselves. 'And light was made', that is, the angelic and heavenly substance, in itself temporally; as it was in wisdom, so far as concerns its unchangeableness, eternally. Or the unformedness of this creature is noted, that is, its imperfection before it was formed in the love of its Maker: for it is formed when it is turned to the unchangeable light of the Word. 'Let there be light.' (AUGUSTINE, ibid., ch. 10, 11, 16.) If light was made bodily, etc., down to: for there were not yet animals to whom this alternation might be exhibited.", "translator": "claude-draft", "orig": "VERS. 3.-- « Dixitque Deus: Fiat lux. » (AUG., de Gen. ad litt., lib. I, c. 17, tom. III.) Lux primo die facta spiritualis vel corporalis intelligitur, etc., usque ad mane futuri inchoatio. (BEDA, Hexaem. ) Si autem primo die corporalis lux facta est, congrue mundi ornatus a luce inchoatur, unde caetera, quae creanda erant, videbantur. Si autem quaeritur, ubi est facta, cum abyssus omnem terrae altitudinem tegeret? patet quod in illis partibus, quas nunc illustrat solis diurna lux. Nec mirum lucem in aquis posse lucere, cum etiam nautarum operatione saepius illustrentur, qui in profundo mersi, misso ex ore oleo, aquas sibi illustrant: quae tunc multo rariores quam sint modo, fuere in principio, quia nondum congregatae in uno loco. « Dixitque Deus: Fiat lux. » (AUG. ibid., c. 2.) Non temporaliter: si enim temporaliter, et mutabiliter; si mutabiliter, et per subjectam creaturam, non est lux prima creatura. Sed forsitan, etc., usque ad ut sit et ut maneat. « Fiat lux. » (AUG. ibid., c. 4, 5, 9.) Ea conditione scilicet qua cuncta subsistunt intemporaliter in Dei sapientia, priusquam in seipsis. « Et facta est lux, » id est angelica et coelestis substantia, in se temporaliter; sicut erat in sapientia, quantum ad ejus incommutabilitatem, aeternaliter. Vel notatur hujus creaturae informitas scilicet et imperfectio antequam formaretur in amore Conditoris: formatur enim cum convertitur ad incommutabile lumen Verbi. « Fiat lux. » (AUG. ibid., c. 10, 11, 16.) Si corporaliter lux facta est, etc., usque ad nondum enim erant animalia quibus haec vicissitudo exhiberetur.", "olang": "la", "source": "PL 113, col. 71A", "notes": "The margin refuses to decide, and it does so by putting four glosses on one verse of which three are Augustine and one is Bede. The first Augustine gloss states the disjunction and abbreviates the discussion with the Glossa's 'etc., usque ad'; Bede's supplies the bodily answer with its location and its divers; then two more Augustine glosses give the angelic answer in full, 'et facta est lux, id est angelica et coelestis substantia'. A reader of this page is told what both parties hold and given no verdict, which is the opposite of what the same margin does at Gen 1:1, where Alcuin's one-word Filio stands unopposed. Note that the Bede gloss cuts his oil-of-the-mouth / Spirit-of-the-mouth pun and keeps the divers.", "slot": false}, {"id": "bruno-gen-1-3", "short": "bruno-gen-1-3", "author": "Bruno of Segni", "tradition": "latin", "date": 1090, "datelabel": "1079–1123", "place": "Segni", "lat": 41.69, "lon": 13.02, "answers": ["lux-is-day"], "senses": ["literal"], "lemma": {"la": "Lux igitur pro die ponitur", "en": "Light, therefore, is put for day"}, "en": "But what is that light, which is said to be prior to the sun, the moon and the stars? Hear what follows: 'He called the light Day, and the darkness Night.' Light, therefore, is put for day.", "translator": "claude-draft", "orig": "Sed quae est ista lux, quae prior sole, luna, et stellis esse perhibetur? Audi quod sequitur: « Vocavit lucem diem, et tenebras noctem. » Lux igitur pro die ponitur.", "olang": "la", "source": "PL 164, col. 149B", "notes": "The crux asked in the Latin bench's own words — quae est ista lux, quae prior sole, luna et stellis esse perhibetur? — and then dismissed in six. Bruno's answer is that the verse answers itself two clauses later: God called the light Day, so 'light' here simply means the day, and there is nothing further to look for. Of every witness on this crux he is the only one who declines the question rather than answering it, and he does it by the same appeal to the text's own next words that he uses at K10 to settle dies unus.", "slot": false}, {"id": "abelard-hex-1-3", "short": "abelard-hex-1-3", "author": "Peter Abelard", "tradition": "latin", "date": 1133, "datelabel": "1130–1135", "place": "The Paraclete (Nogent-sur-Seine)", "lat": 48.49, "lon": 3.5, "answers": ["lux-is-distinction"], "senses": ["literal"], "lemma": {"la": "ipsam sequentium operum distinctionem", "en": "the distinction of the works that follow"}, "en": "But that light which removed the aforesaid darkness we take to be the distinction itself of the works that follow — that distinction, namely, by which that confused heap, which did not yet present itself as visible, nor could be known as fit for any use, nor could yet be perceived from itself for what it had been created…", "translator": "claude-draft", "orig": "Lucem vero istam quae praedictas tenebras removit, ipsam sequentium operum distinctionem accipimus, qua videlicet confusa illa congeries, quae se nondum visibilem praebebat nec usui apta alicui cognosci poterat, vel ad quid creata esset ex ipsa adhuc percipi valebat", "olang": "la", "source": "PL 178, col. 738B", "notes": "An answer nobody else on either bench gives: the light is neither a body nor an angel but the ordering of the works themselves — the coming-into-distinctness of the confused heap, so that it could be seen and known for what it was made for. Abelard reaches it by taking 'darkness' as unintelligibility rather than as absence of illumination, which is Augustine's privation doctrine turned from optics to knowledge. It is also the only reading on the crux that makes the first light not a thing at all, and so the only one for which the sun on the fourth day raises no difficulty whatever.", "slot": false}, {"id": "abelard-hex-1-3b", "short": "abelard-hex-1-3b", "author": "Peter Abelard", "tradition": "latin", "date": 1133, "datelabel": "1130–1135", "place": "The Paraclete (Nogent-sur-Seine)", "lat": 48.49, "lon": 3.5, "answers": ["fiat-is-instantaneous"], "senses": ["translation", "literal"], "lemma": {"la": "in Hebraeo haberi: Sit lux, et fuit lux", "en": "in the Hebrew it is: Let light be, and light was"}, "en": "It is to be noted that, where we say 'Let there be light, and light was made', in the Hebrew it is: 'Let light be, and light was'; and likewise in the rest that follow, wherever we have 'God said, Let this be made, and it was made so', in the Hebrew it is 'Let this be, and it was so'. By which words perhaps the greatest swiftness of the divine working is expressed. For while something is being made which is not yet, there can be some delay in the making. But when it is said 'let it be' and 'it was', with no delay interposed the perfecting of the thing…", "translator": "claude-draft", "orig": "Notandum vero pro eo quod dicimus: Fiat lux, et facta est lux, in Hebraeo haberi: Sit lux, et fuit lux; et similiter in caeteris quae sequuntur ubicunque nos habemus: Dixit Deus, Fiat hoc, et factum est ita, in Hebraeo est: Sit hoc, et fuit ita. Quibus fortasse verbis maxima celeritas divinae operationis exprimitur. Quippe dum aliquid fit quod nondum est, aliqua mora in faciendo esse potest. Cum vero dicitur, sit et fuit, nulla interposita mora perfectio rei", "olang": "la", "source": "PL 178, col. 739D", "notes": "Abelard reporting the Hebrew against the Latin, exactly as K7 found him doing at PL 178:735B with volitabat. The observation is correct — yehi or va-yehi or is one verb twice, as the Greek's γενηθήτω / ἐγένετο is, while the Latin's fiat / facta est is two — and he draws a conclusion from it that the whole bench had been reaching for by other means: no delay is interposed, because a thing that is merely told to be is not first made and then finished. Where he got the Hebrew is unknown, as at K7. He is the only Latin on this crux who looks at the other language at all.", "slot": false}, {"id": "hugh-adnot-1-3", "short": "hugh-adnot-1-3", "author": "Hugh of St Victor", "tradition": "latin", "date": 1130, "datelabel": "1125–1135", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["lux-corporalis", "lux-twilight"], "senses": ["literal"], "lemma": {"la": "quasi quaedam lucida nubes circumferebatur, sicut modo sol", "en": "it was carried round like a kind of luminous cloud, as the sun is now"}, "en": "But fire, once distinguished, furnished light of some kind to the lower world, and had a circular motion: it was carried round like a kind of luminous cloud, as the sun is now.", "translator": "claude-draft", "orig": "Ignis vero distinctus lumen praebuit mundo inferiori qualecunque et motum habens circularem; quasi quaedam lucida nubes circumferebatur, sicut modo sol.", "olang": "la", "source": "PL 175, col. 34C", "notes": "One sentence of physics, and it names the material: the first light is the element of fire, separated out and carried round the world in a circuit. Honorius says the same in the same decade — this bodily light he brought forth from the element of fire — and Comestor's luminous cloud is the same image. Hugh's fuller treatment is in De sacramentis and is built separately; the Adnotationes give the picture without the argument.", "slot": false}, {"id": "hugh-sacr-1-3", "short": "hugh-sacr-1-3", "author": "Hugh of St Victor", "tradition": "latin", "date": 1134, "datelabel": "1130–1137", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["lux-corporalis"], "senses": ["literal"], "lemma": {"la": "ipsamque vice et loco solis factam", "en": "and that it was made in the sun's stead and place"}, "en": "…for the lighting of bodily and visible things, nothing but a bodily light could have been suitable. And every body, however fine and however near it comes to a spiritual nature, must be circumscribed by place. And again, unless that light had been mobile, it could in no way have distinguished day and night by their alternating turns, nor traversed any space of time at all without motion. According to this consideration, then, I think it more fitting that we believe that light, made in the beginning for the lighting of bodily things, to have been beyond doubt bodily — such as some luminous body might perhaps have been, by whose presence all things were lit, as can now be seen in the sun — and that it was made in the sun's stead and place, so that for the time being it was carried round by its own motion, and marked off night and day.", "translator": "claude-draft", "orig": "corporalibus rebus et visibilibus illuminandis, non nisi lucem corpoream congruere potuisse. Omne autem corpus quantumlibet subtile et spirituali naturae approximans, loco circumscribi necesse est. Rursumque nisi mobilis fuisset lux illa, nequaquam alterna vicissitudine diem ac noctem distinguere, nec temporis spatium ullatenus sine motu peragere valuisset. Secundum hanc itaque considerationem, convenientius puto ut credamus lucem illam in principio factam ad illuminanda corporea sine dubio corpoream fuisse, quale fortasse esse potuisset corpus aliquod lucidum, cujus praesentia cuncta illustrarentur, quemadmodum nunc in sole videri potest, ipsamque vice et loco solis factam, ut interim motu suo circumagitaretur, et noctem diemque discerneret.", "olang": "la", "source": "PL 176, col. 194A", "notes": "The argument the Victorines put under the twelfth century's physical answer, and it is an argument from fitness of means: bodily things can only be lit by a bodily light; every body is in a place; and a light that made evening and morning must have moved, since without motion no span of time is traversed. From which the first light was a luminous body standing in the sun's stead and turning as the sun turns. The chapter headings of De sacramentis announce the whole programme — 'why light was made first', 'of what kind that light was made, and where', 'that light illumined three days, and why it was made before the sun' — which is the crux set out as a syllabus.", "slot": false}, {"id": "honorius-hex-1-3", "short": "honorius-hex-1-3", "author": "Honorius Augustodunensis", "tradition": "latin", "date": 1120, "datelabel": "1110–1130", "place": "Regensburg", "lat": 49.02, "lon": 12.1, "answers": ["lux-corporalis", "lux-twilight"], "senses": ["literal"], "lemma": {"la": "hanc corporalem lucem de elemento ignis protulit", "en": "he brought forth this bodily light from the element of fire"}, "en": "And God said: Let there be light. When 'he said' is written of God, it is said after our manner, and the efficacy of the one commanding is expressed. But for God to speak is nothing other than to found all things through his Word. Through this Word he brought forth this bodily light from the element of fire, and brought it into this world. Which light then showed such a brightness as there now is before the rising of the sun; and it lit the waters, then thin, as it now lights the air. For twelve hours it remained above the earth, as the sun does now; and for twelve it lit the lower parts of the globe.", "translator": "claude-draft", "orig": "Et dixit Deus: Fiat lux. Cum de Deo, dixit, scribitur, nostro more dicitur, et efficacia jubentis exprimitur. Dei autem dicere nihil est aliud, quam per verbum suum omnia condere. Per hoc verbum hanc corporalem lucem de elemento ignis protulit, et eam huic mundo intulit. Quae lux tunc talem claritatem, qualem nunc ante solis exortum, exhibuit: et tenues tunc aquas, ut nunc aerem, illustravit. Per duodecim autem horas super terram, ut nunc sol mansit: per duodecim vero, inferiora orbis illuminavit.", "olang": "la", "source": "PL 172, col. 255C", "notes": "The physical answer at its most confident and most specific: the light is drawn from the element of fire, its brightness is that of the sky before sunrise, it lights the waters as light now lights the air, and it keeps a twelve-hour circuit above and below. Honorius gives no argument for any of it. Rupert, writing in the same years, describes precisely this opinion — that the light was nothing but an illumination of the air, alternating over twelve hours through three days — in order to demolish it.", "slot": false}, {"id": "rupert-gen-1-3", "short": "rupert-gen-1-3", "author": "Rupert of Deutz", "tradition": "latin", "date": 1117, "datelabel": "1112–1117", "place": "Liège", "lat": 50.63, "lon": 5.57, "answers": ["lux-angelica"], "senses": ["literal", "allegorical"], "lemma": {"la": "Quaenam est ista lux?", "en": "What kind of light is that?"}, "en": "But what is this very thing that he said, 'Let there be light'? What kind of light is that? For it seems to some that the light then made was nothing other than an illumination of the air, and that those darknesses which were over the face of the abyss were divided by night and day so alternating that, when the space of daytime — twelve hours, that is — was passed, the light was put out and darkness succeeded; and again, when the space of nighttime was over, the light shone out; and so for three days, day and night, without these bodily luminaries, that is without sun and moon and stars, gave way and succeeded to one another of their own accord. But on this reading this one day is the poorest of all days: for whereas each of the other days is made illustrious by the creation or forming of substances, this day is dismissed with nothing but an unstable colour of some accident thrown over it, when it is said 'let there be light'. For whatever was made on the other days is substantial and abides; but that accidental light, once relit on the third day, thereafter perished utterly. And see whether it be worthy of so great a majesty that the works of the other days — the sun, for instance, and moon and stars that were made on the fourth day, and the division of the waters that was made on the second — he should establish for ever and ever, and lay upon them a decree that shall not pass away (Ps 148:6), but should make the work of the first light such that, changing his counsel, he should utterly put it out after a scant three days. What then? Was it for this that the Spirit of God was borne over the waters, and that he said 'let it be' — a saying that holy Scripture wonders at and celebrates as the uttering of a truly good word — that only such a light should come to be, an accident of the air soon to perish, and no substance be created? The great and most renowned Fathers understood better: the angelic nature, signified by the name of light. Their view we approve as the more reasonable and follow it, that the angelic creature is rightly called light — an intellectual light; light, I say, not only as having the power of discerning, but also as shining with the grace of the true and uncircumscribed light.", "translator": "claude-draft", "orig": "Quid autem est hoc ipsum quod dixit: Fiat lux? Quaenam est ista lux? Videtur enim nonnullis lucem tunc esse factam, non aliam quam aeris illustrationem, et tenebras illas quae erant super faciem abyssi, sic alterantibus nocte et die divisas, ut, peracto diurni temporis spatio, duodecim horarum scilicet, lux exstingueretur et tenebrae succederent, et itidem transacto nocturni temporis spatio, lux refulgeret, atque ita, per triduum, dies et nox, absque luminaribus istis corporeis, sole scilicet et luna et stellis, ultro sibi invicem cesserint atque successerint. Sed hoc sensu unus hic dies omnium dierum pauperrimus est, quippe cum singuli dierum caeterarum substantiarum creatione vel formatione illustrati sint, hic dies non nisi accidentis cujusdam colore instabili injecto dimissus sit, cum dictum sit, fiat lux. Nam quaecunque caeteris diebus facta sunt, substantialia sunt et permanent, illa autem accidentalis lux tertio reaccensa deinceps omnino deperiit. Et vide utrum condignum sit tantae majestati ut caeterorum dierum opera, verbi gratia, solem, lunam et stellas quae quarto die facta sunt, et aquarum divisionem quae secundo die facta est, statuerit in saeculum et in saeculum saeculi, praeceptumque poneret illis quod non praeteribit (Psal. CXLVIII) , opus autem primae lucis tale faceret, quod mutato consilio post exiguum triduum funditus exstingueret. Quid ergo? An idcirco Spiritus Dei ferebatur super aquas, et dixit, fiat, quod dictum, ut vere boni verbi eructationem, sancta miratur et concelebrat Scriptura, ut talis tantummodo lux fieret accidens aeri mox interitura et nulla crearetur substantia? Melius magni et nominatissimi Patres intellexerunt naturam angelicam, lucis nomine significatam. Eorum sensum rationabilem magis approbamus et sequimur, angelicam creaturam recte lucem esse appellatam, lucem intellectualem, lucem, inquam, non solum quia vim discernendi habentem, verum etiam quia veri et incircumscripti luminis gratia refulgentem.", "olang": "la", "source": "PL 167, col. 207A", "notes": "The best argument on the crux, and it is an argument from what would be unworthy. Rupert states the physical reading in full and with its details — twelve hours, three days, no luminaries — and then asks what it would make of the first day: every other day makes a substance that abides, and this one would make an unstable accident, a colour thrown over the air, snuffed out after three days when God changed his mind. Would the majesty that laid on sun and moon a decree that shall not pass away do that? Therefore the light is the angelic nature. He then adds, in the next chapter, that this is not said by likeness but of the thing itself: the visible light and the stars were made in the likeness of that light, not the other way about. Written in the same decade as Honorius' twelve-hour circuit and Hugh's luminous body.", "slot": false}, {"id": "comestor-hs-1-3", "short": "comestor-hs-1-3", "author": "Peter Comestor", "tradition": "latin", "date": 1170, "datelabel": "1169–1173", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["lux-corporalis", "lux-twilight"], "senses": ["literal"], "lemma": {"la": "quamdam nubem lucidam", "en": "a kind of luminous cloud"}, "en": "And God said: Let there be light. And light was made (Gen 1) — that is, he begot the Word in whom it was that light should be made; that is, as easily as if someone were to say it in a word. By 'light' he means a kind of luminous cloud, lighting the upper parts of the world, but with a thin brightness, such as comes about at dawn; and this driven round much as the sun is. By its presence it lights the upper hemisphere and in turn the lower.", "translator": "claude-draft", "orig": "Dixitque Deus: Fiat lux. Et facta est lux (Gen. I) , id est verbum genuit in quo erat, ut fieret lux, id est tam facile, ut si quis diceret verbo. Lucem vocat quamdam nubem lucidam, illuminantem superiores mundi partes, claritate tamen tenui, ut fieri solet diluculo! et hoc admodum solis circumagitata. Praesentia sui superius hemisphaerium, et inferius vicissim illuminat.", "olang": "la", "source": "PL 198, col. 1057B", "notes": "The settlement, and it is the physical answer, stated as fact in a handbook with no mention that anybody ever thought otherwise. A luminous cloud, thin as the dawn, driven round like the sun, lighting one hemisphere and then the other. Rupert had argued at length that this cannot be right and Bonaventure will say Augustine's view is the subtler; the Historia scholastica simply prints the cloud, and that is what most of Europe learned. Comestor's angelic-light material, where he has it, is elsewhere and not on this verse.", "slot": false}, {"id": "bonaventure-sent-2-13-1-1", "short": "bonaventure-sent-2-13-1-1", "author": "Bonaventure", "tradition": "latin", "date": 1252, "datelabel": "1250–1252", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["lux-corporalis", "lux-angelica"], "senses": ["literal", "spiritual"], "lemma": {"la": "Utrum lux primo die facta fuerit corporalis, an spiritualis", "en": "Whether the light made on the first day was corporeal or spiritual"}, "en": "I respond: It must be said that in this question Augustine and the other doctors thought differently, just as also in the question concerning the production of unformed matter.\n\nAugustine's exposition. For Augustine[^9] wished that by heaven be understood unformed spiritual nature; and because light corresponded to heaven, consequently by light itself he said the angelic nature formed was to be understood according to the letter; but by day he said is understood the angelic consideration itself; by the seven days, sevenfold consideration; and by the evening of the day, consideration of the creature in itself, because the creature is as it were a darkness; but by morning, the reduction of that knowledge of the creature in its proper genus to the knowledge which is in the supreme light, and to the praise of God Himself. And because, after perfect conversion, it does not cease from the praise of God, therefore he said that the seventh day, in which is the rest of contemplation, does not have evening.\n\nReasons of the same [Augustine]. For the manifesting of this position, he sufficiently conforms Scripture [to it] in On Genesis according to the Letter[^10], where he shows that many things are said in that enumeration of the six days which more befit spiritual days and spiritual light than material light. On account of which, in the production of all corporeal things it is said let it be, He made, and it was done; but in the production of light it is not said except let it be, and it was done. — And the reason of this is, that all other things, [as distinguished] from spiritual creation, have a threefold mode of being, namely in the cause producing them, and in the rational mind, and in the corporeal matter sustaining them. But rational creation has only a twofold mode of being, namely in the Word, and in itself. — He also adduces many [things] to this [point] which show that the position itself is consonant both with faith and with Scripture and also with reason; and through this he shows that the truth of faith and Scripture in no way deviates from the straight path of reason. Hence the same [Augustine] On Genesis according to the Letter, book one[^11]: «We have what is to be answered, according to faith, to all who attempt to slander the books of our salvation — that whatever they themselves shall have been able to demonstrate concerning the nature of things by true documents, we should show is not contrary to our letters; but whatever they shall bring forward from any of their volumes contrary to these our letters, that is, to the Catholic faith, either we should show [it false] by some faculty, or with no doubt should believe it to be most false».\n\nOpinion of others. But however probable and reasonable this position was, nevertheless the Catholic treatise-writers who have followed Augustine[^12] have approved another way more — namely that the distinction of days was material or sensible, and the operation of the first day was the formation of corporeal light, which made three days before the production of the sun. — And because this position the text of Scripture more intimates, and the expositors more follow, even those who have willingly followed Augustine, on this account this position is more safely and usefully to be maintained.\n\nConclusion. According to this position, then, it must be said that Scripture by that light which it says was first made intimates corporeal light; and the reasons which prove it are to be conceded.", "translator": "wilson-pruitt", "orig": "Respondeo: Dicendum, quod in hac quaestione differenter senserunt Augustinus et alii doctores, sicut et in quaestione de informis materiae productione.\n\nExpositio Augustini. Augustinus[^9] enim voluit, quod per caelum intelligeretur natura spiritualis informis; et quia lux respondebat caelo, per consequens per ipsam lucem spiritualem angelicam naturam formatam dixit intelligi ad litteram; per diem vero dixit intelligi ipsam considerationem angelicam; per septenarium dierum, septemplicem considerationem; et per vesperam diei, considerationem creaturae in se ipsam, quia creatura est sicut tenebra; per mane vero, reductionem ipsius cognitionis creaturae in genere proprio ad cognitionem, quae est in summa luce, et ad laudem ipsius Dei. Et quia post perfectam conversionem a laude Dei non cessat, ideo septimum diem, in quo est requies contemplationis, dixit non habere vesperam.\n\nRationes eiusdem. Ad hanc autem positionem manifestandam, satis Scripturam conformat super Genesim ad litteram[^10], ubi ostendit, quod multa dicuntur de illa sex dierum enumeratione, quae magis competunt diebus spiritualibus et luci spirituali quam luci materiali. Propter quod in productione omnium rerum corporalium dicitur fiat, fecit, et factum est; in productione vero lucis non dicitur nisi fiat, et factum est. — Et huius ratio est, quia omnes aliae res a creatura spirituali habent triplicem modum essendi, videlicet in sua causa producente, et in mente rationali, et in corporali materia sustinente. Creatura autem rationalis non habet nisi duplicem modum essendi, videlicet in Verbo, et in se. — Multa etiam ad hoc adducit, quae ostendunt, ipsam positionem esse consonam tam fidei quam Scripturae quam etiam rationi; et per hoc veritatem fidei et Scripturae a recto rationis tramite nullatenus etiam deviare ostendit. Unde idem super Genesim ad litteram libro primo[^11]: « Habemus quod secundum fidem respondendum est omnibus, qui calumniari libris nostrae salutis affectant, ut quidquid ipsi de rerum natura veracibus documentis demonstrare potuerint, ostendamus, litteris nostris non esse contrarium; quidquid autem de quibuslibet suis voluminibus his nostris litteris, id est catholicae fidei, contrarium protulerint, aut aliqua facultate ostendamus, aut nulla dubitatione credamus ipsum esse falsissimum ».\n\nOpinio aliorum. Quantumcumque autem haec positio probabilis esset et rationabilis, catholici tamen tractatores, qui Augustinum secuti sunt[^12], viam aliam magis approbaverunt, scilicet quod dierum distinctio esset materialis sive sensibilis, et primae diei operatio esset formatio lucis corporalis, quae tres dies fecit ante productionem solis. — Et quia istam positionem magis insinuat textus Scripturae, et magis sequuntur expositores, etiam illi qui Augustinum libenter secuti sunt; ideo positio ista securius et utilius est sustinenda.\n\nConclusio. Secundum hanc igitur positionem dicendum est, quod Scriptura per lucem illam, quam dicit primo esse factam, corporalem lucem insinuat; et concedendae sunt rationes, quae illud probant.", "olang": "la", "source": "In II Sent., d. XIII, a. 1, q. 1 (Quaracchi 1885, II.312–313)", "notes": "The crux put as a disputed question and closed, eight hundred years after Augustine opened it — and closed the same way K10's d.12 a.1 q.2 closes the question of the days. Bonaventure sets out Augustine's position at length and fairly: by 'heaven' unformed spiritual nature, by 'light' the angelic nature formed, by 'day' the angelic consideration, by the seven days a sevenfold consideration; and he grants that Augustine conforms Scripture to it well enough, noting the argument that the text does not say fiat and fecit and factum est of the light as it does of bodily things. Then: however probable and reasonable that position was, the Catholic treatise-writers who followed Augustine approved another way — a material distinction of days and a corporeal light making three days before the sun — and because the text more readily intimates this and the expositors more generally follow it, this position is the safer and more useful to hold. The question is decided by weight of exposition, not by exegesis.", "slot": false}, {"id": "alcuin-int-34", "short": "alcuin-int-34", "author": "Alcuin", "tradition": "latin", "date": 796, "datelabel": "c. 796", "place": "Tours", "lat": 47.39, "lon": 0.69, "answers": ["evening-is-completion"], "senses": ["literal"], "lemma": {"la": "finis operis perfecti, et initium operis incoepti", "en": "the end of a work completed, and the beginning of a work begun"}, "en": "Question 33. Why is the light read as created on the first day? — Answer: It suits the works of God that on the first day a temporal light should first be made from the eternal light, so that there might be something by which the rest he would create could appear. Question 34. What is 'there was evening and morning, one day'? — Answer: That is, the end of a work completed, and the beginning of a work begun.", "translator": "claude-draft", "orig": "Inter. 33. Quare prima die lux creata legitur?-- Resp. Congruit operibus Dei, ut prima die a [ Ms., de] luce aeterna lux temporalis primo fieret, ut esset unde caetera quae crearet, apparerent. Inter. 34. Quid est: Factum est vespere et mane dies unus (vers. 5) ?-- Resp. Id est finis operis perfecti, et initium operis incoepti.", "olang": "la", "source": "PL 100, col. 520A", "notes": "Augustine's angelic evening and morning stripped of the angels and reduced to a schoolroom formula: evening is a finished work, morning is a work beginning. Everything that made the doctrine difficult is gone, and what is left will be copied by Wigbod and Angelomus and, through them, become the standard Carolingian gloss on the verse.", "slot": false}, {"id": "aug-gnl-4-22", "short": "aug-gnl-4-22", "author": "Augustine", "tradition": "latin", "date": 410, "datelabel": "401–415", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["unus-repeated", "evening-is-self-knowledge"], "senses": ["spiritual", "literal"], "lemma": {"la": "idem dies ubique repetitur", "en": "the same day is repeated throughout"}, "en": "And because the other creatures, which are made below it, are not made without its knowledge, therefore of course the same day is repeated throughout, so that by its repetition there come to be as many days as there are kinds of created things to be distinguished, to be brought to an end by the perfection of the number six: so that the evening of the first day is its knowledge of itself, that it is not what God is; a
