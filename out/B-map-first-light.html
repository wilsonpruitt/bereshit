nd the morning after this evening, by which the one day is closed and the second begun, is its turning, by which it refers what it has been created to the praise of the Creator, and receives from the Word of God the knowledge of the creature that is made after it, that is, of the firmament.", "translator": "claude-draft", "orig": "Et quia caeterae creaturae, quae infra ipsam fiunt, sine cognitione ejus non fiunt, propterea nimirum idem dies ubique repetitur, ut ejus repetitione fiant tot dies, quoties distinguuntur rerum genera creatarum, perfectione senarii numeri terminanda: ut vespera primi diei sit etiam sui cognitio, non se esse quod Deus est; mane autem post hanc vesperam, quo concluditur dies unus, et inchoatur secundus, conversio sit ejus, qua id quod creata est, ad laudem referat Creatoris, et percipiat de Verbo Dei cognitionem creaturae quae post ipsam fit, hoc est firmamenti", "olang": "la", "source": "PL 34, col. 312", "notes": "Augustine's mature answer, and the one the Glossa puts in the margin of 1:5 by book, chapter and column. There is only one day: the angelic light itself. Its evening is its knowledge of itself as not-God; its morning is that knowledge referred back in praise; and the six days are that one day presented six times over, once for each kind of thing made. On this reading 'one day' is not a counting word at all, which is why the sixfold repetition does not make it 'first'. Two chapters on (I.25, PL 34:313) he draws the corollary the City of God will state more compactly: this is why no night is ever named.", "slot": false}], "threads": [{"id": "t-k8-01", "from": "pdre-3-6", "to": "br-3-4", "type": "echoes", "evidence": "The garment of Ps 104:2, no longer whispered: Bereshit Rabbah has the Holy One wrap himself in the light like a garment; Pirkei de-Rabbi Eliezer takes the next clause of the same verse — 'who stretches out the heavens like a curtain' — and makes the heavens out of that light.", "crux": "first-light"}, {"id": "t-k8-02", "from": "br-3-4", "to": "br-3-6", "type": "parallel", "evidence": "Two sections of one compilation asking the crux from opposite ends: 3:4 asks what the light was made from and answers with God's garment and the site of the Temple; 3:6 asks where it is now and answers that it was stored away for the righteous.", "crux": "first-light"}, {"id": "t-k8-03", "from": "b-chag-12a-light", "to": "br-3-6", "type": "parallel", "evidence": "The same doctrine on two proof texts and neither cites the other: the midrash hides the light because it would dim the sun's disc, and proves the storing from Isa 30:26; the Talmud hides it from the generations of the Flood and the Dispersion, and proves it from Job 38:15 and from 'God saw the light, that it was good' read through Isa 3:10, since 'good' means the righteous.", "crux": "first-light"}, {"id": "t-k8-04", "from": "rashi-1-4", "to": "b-chag-12a-light", "type": "cites", "evidence": "Rashi names his source — 'here too we must depend upon the statement of the Agada' — and gives R. Elazar's answer: God saw the wicked were unworthy of the light and set it apart for the righteous in the world to come. Silbermann's note supplies the reference to Chagigah 12a.", "crux": "first-light"}, {"id": "t-k8-05", "from": "rashi-1-4", "to": "br-3-6", "type": "cites", "evidence": "The plain sense, taken from Bereshit Rabbah: it was not seemly that light and darkness should work in confusion, so he assigned each its own hours. Rashi keeps the aggadic hiding and the peshat division side by side and does not merge them.", "crux": "first-light"}, {"id": "t-k8-06", "from": "aug-gnl-1-11", "to": "b-chag-12a-light", "type": "parallel", "evidence": "The one place on this crux where the benches hold the same opinion in the same words. Augustine: 'this too I know to have been said by someone, that the nature of light was first brought in when it was said Let there be light, but afterwards, when the luminaries are spoken of, it was recorded what was made out of that same light.' The Bavli: 'the sages say, these are the lights that were created on the first day but were not hung up until the fourth.' Augustine cannot name whose opinion it is; the Talmud names the party that holds it, against R. Yaakov.", "crux": "first-light"}, {"id": "t-k8-07", "from": "alcuin-int-33", "to": "pdre-3-6", "type": "parallel", "evidence": "Both make the first light derive from God himself rather than merely follow him: Alcuin adds to Bede's sentence the words a luce aeterna, so that the temporal light is made out of the eternal one, and Pirkei de-Rabbi Eliezer makes the heavens out of the light of the garment God wears. Neither argues for it; both state it as though it needed none.", "crux": "first-light"}, {"id": "t-k8-08", "from": "bede-gen-1-3b", "to": "br-3-4", "type": "parallel", "evidence": "The same question — where — and two answers that could not be further apart. Bede: in the upper parts of the earth, the parts the sun's daylight now falls on, and he defends it with the divers who let oil from their mouths. R. Berekhya in the name of R. Yitzḥak: the light was created from the site of the Temple, proved from Ezek 43:2 and Jer 17:12.", "crux": "first-light"}, {"id": "t-k8-09", "from": "hugh-sacr-1-3", "to": "b-chag-12a-light", "type": "parallel", "evidence": "Both make the first light continuous with the sun rather than replaced by it: the sages hold that the lights were created on the first day and hung on the fourth; Hugh holds that a luminous body was made in the sun's stead and place, turning as the sun turns, until the sun came. The Latin argument is from the fitness of means, the rabbinic from the wording of Gen 1:17.", "crux": "first-light"}, {"id": "t-k8-10", "from": "pdre-3-6", "to": "aug-gnl-1-11", "type": "parallel", "evidence": "Both make the first light the material of something later: Augustine's unnamed authority has the luminaries made out of it, and Pirkei de-Rabbi Eliezer has the heavens made out of it. On the Latin side this is one option among three and is not adopted; on the rabbinic side it is stated as cosmogony.", "crux": "first-light"}, {"id": "t-k8-11", "from": "ambrose-hex-1-9", "to": "basil-hex-2-7", "type": "parallel", "evidence": "Ambrose's Hexaemeron follows Basil's Greek homilies closely and this passage is no exception — the light as the world's first ornament, the air taking it up, the suddenness. The witness date here is that of Eustathius' Latin version, which is later than Ambrose; Basil's Greek (378) precedes him and is his source, so the dependence runs the other way from what the dates on this page suggest.", "crux": "first-light"}, {"id": "t-k8-12", "from": "aug-gnl-1-3", "to": "ambrose-hex-1-9", "type": "contests", "evidence": "Ambrose says God dwells in inaccessible light and is the true light of John 1:9, 'but he made that light' — hanc, the one in the verse, a thing among things. Augustine asks whether the light is spiritual or bodily and answers that it can be the first creature, the spiritual nature called heaven in verse 1, and that 'let there be light' is its conversion. The two positions the rest of the bench divides between are already both in place by 410.", "crux": "first-light"}, {"id": "t-k8-13", "from": "aug-gnl-1-11", "to": "aug-gnl-1-3", "type": "echoes", "evidence": "Book I asks what the light is; eight chapters later the same book asks what the sun can be for if that light already made a day. The second question is the pressure that produces every physical answer on this crux, and Augustine raises it against himself.", "crux": "first-light"}, {"id": "t-k8-14", "from": "bede-gen-1-3", "to": "aug-gnl-1-3", "type": "contests", "evidence": "Bede does not refute the angelic light; he steps round it, and the step is in one sentence. He names three lights — God who is the true light, the inaccessible light the angels already enjoyed in the heaven of heavens, and 'the first grace of material light' given to this world — so that the angels are on the page, already made, and are not the light. Alcuin, Rabanus and the Glossa's Bede gloss all inherit the step.", "crux": "first-light"}, {"id": "t-k8-15", "from": "bede-gen-1-3b", "to": "bede-gen-1-3", "type": "parallel", "evidence": "The same exposition a page later, asking the question a material light forces: where was it, since the abyss covered everything? Bede's answer, the upper parts of the earth, only makes sense because he has already declined to make the light angelic.", "crux": "first-light"}, {"id": "t-k8-16", "from": "alcuin-int-33", "to": "bede-gen-1-3", "type": "cites", "evidence": "'Congruit operibus Dei … ut esset unde caetera quae crearet apparerent' is Bede word for word, compressed into a schoolroom answer, with a luce aeterna added and the angels of the heaven of heavens dropped.", "crux": "first-light"}, {"id": "t-k8-17", "from": "rabanus-gen-1-3", "to": "bede-gen-1-3", "type": "cites", "evidence": "Bede reproduced verbatim and unattributed, as at K1, K7 and K10; the only visible editorial act is the chapter heading Rabanus sets over it, 'Ubi lux primum fieri jubetur', which turns a continuous exposition into a lemma.", "crux": "first-light"}, {"id": "t-k8-18", "from": "angelom-gen-1-3", "to": "aug-gnl-1-3", "type": "echoes", "evidence": "Angelomus takes the side of the bench Bede stepped away from, and states it more sharply than Augustine: the angelic dignity was founded first and was made light afterwards by turning to behold its creator, so that 'let there be light' means 'let it turn to contemplate me unceasingly'.", "crux": "first-light"}, {"id": "t-k8-19", "from": "angelom-gen-1-3", "to": "b-chag-12a-light", "type": "parallel", "evidence": "The same objection in the same form on both benches: if the luminaries are made on the fourth day, what is this light? The Talmud raises it from Gen 1:17 and answers with R. Elazar's hidden light; Angelomus raises it, floats a light above the firmament from which the sun was lit, and answers with the angels.", "crux": "first-light"}, {"id": "t-k8-20", "from": "glossa-1-3", "to": "aug-gnl-1-3", "type": "cites", "evidence": "Three of the four glosses on this verse are Augustine, cited by book and chapter, and between them they give the angelic reading entire: 'et facta est lux, id est angelica et coelestis substantia, in se temporaliter', with the doctrine that the creature is formed when it turns to the unchangeable light of the Word.", "crux": "first-light"}, {"id": "t-k8-21", "from": "glossa-1-3", "to": "bede-gen-1-3b", "type": "cites", "evidence": "The Bede gloss keeps the bodily light with its location and its divers letting oil from their mouths, and cuts the pun that carried Bede's argument — if a man can do it by the oil of his mouth, what can God do by the Spirit of his mouth. What is left is the observation without the reason for making it.", "crux": "first-light"}, {"id": "t-k8-22", "from": "bruno-gen-1-3", "to": "aug-gnl-1-3", "type": "contests", "evidence": "Bruno asks Augustine's question in Augustine's terms — what is that light, said to be prior to sun and moon and stars? — and then refuses to answer it: God called the light Day, so light here is put for day, and there is nothing further to look for.", "crux": "first-light"}, {"id": "t-k8-23", "from": "abelard-hex-1-3", "to": "aug-gnl-1-3", "type": "contests", "evidence": "Neither limb of Augustine's disjunction. Abelard makes the light the distinction of the works themselves, the coming-into-distinctness of the confused heap so that it could be seen and known for what it was made for — which is Augustine's own doctrine that darkness is privation, moved from optics to knowledge, and used against him.", "crux": "first-light"}, {"id": "t-k8-24", "from": "abelard-hex-1-3b", "to": "vulgate-1-3", "type": "contests", "evidence": "'Notandum vero pro eo quod dicimus: Fiat lux, et facta est lux, in Hebraeo haberi: Sit lux, et fuit lux.' Abelard reports the Hebrew against the Latin he is expounding, as K7 found him doing with volitabat at PL 178:735B; the observation is right, and where he got it is unknown.", "crux": "first-light"}, {"id": "t-k8-25", "from": "abelard-hex-1-3b", "to": "lxx-1-3", "type": "parallel", "evidence": "The feature Abelard finds in the Hebrew — one verb twice, 'let it be' and 'it was' — is exactly what the Greek does with γενηθήτω and ἐγένετο, and exactly what the Latin's fiat / facta est does not. He draws from it the conclusion the whole bench had been reaching for by other means: no delay is interposed.", "crux": "first-light"}, {"id": "t-k8-26", "from": "honorius-hex-1-3", "to": "remigius-gen-1-3", "type": "echoes", "evidence": "Remigius' twilight — 'not of the kind that now is, with the sun set above, but such as is wont to be before sunrise or after sunset' — becomes Honorius' 'such a brightness as there now is before the rising of the sun', with twelve hours above the earth and twelve below added.", "crux": "first-light"}, {"id": "t-k8-27", "from": "hugh-adnot-1-3", "to": "honorius-hex-1-3", "type": "parallel", "evidence": "Two Paris and Regensburg sentences of the same decade with the same physics: the light is the element of fire, separated out, carried round the world in a circuit like a luminous cloud, as the sun is now.", "crux": "first-light"}, {"id": "t-k8-28", "from": "hugh-sacr-1-3", "to": "hugh-adnot-1-3", "type": "echoes", "evidence": "The same author giving the picture in the Adnotationes and the argument in De sacramentis: bodily things can only be lit by a bodily light, every body is in a place, and a light that made evening and morning must have moved, since without motion no span of time is traversed.", "crux": "first-light"}, {"id": "t-k8-29", "from": "hugh-sacr-1-3", "to": "aug-gnl-1-11", "type": "echoes", "evidence": "Augustine's question — what is the sun for, if that light already made a day — answered by making the first light the sun's placeholder: made vice et loco solis, turning by its own motion until the sun came.", "crux": "first-light"}, {"id": "t-k8-30", "from": "rupert-gen-1-3", "to": "honorius-hex-1-3", "type": "contests", "evidence": "Rupert states the physical reading with its details — an illumination of the air, twelve hours, three days, no luminaries — and demolishes it on a ground nobody else uses: every other day makes a substance that abides, and this one would make an unstable accident thrown over the air and snuffed out after three days, which is unworthy of the majesty that laid on sun and moon a decree that shall not pass away.", "crux": "first-light"}, {"id": "t-k8-31", "from": "rupert-gen-1-3", "to": "angelom-gen-1-3", "type": "echoes", "evidence": "'Melius magni et nominatissimi Patres intellexerunt naturam angelicam, lucis nomine significatam' — Rupert appeals to the Fathers for the angelic light and then goes further than they do, insisting in the next chapter that it is said not by likeness but of the thing itself: the visible light and the stars were made in the likeness of that light, not the other way about.", "crux": "first-light"}, {"id": "t-k8-32", "from": "comestor-hs-1-3", "to": "hugh-adnot-1-3", "type": "echoes", "evidence": "The luminous cloud verbatim — nubes lucida, driven round much as the sun is — with Hugh's element of fire dropped and the dawn brightness of Remigius and Honorius kept.", "crux": "first-light"}, {"id": "t-k8-33", "from": "comestor-hs-1-3", "to": "remigius-gen-1-3", "type": "echoes", "evidence": "'Claritate tamen tenui, ut fieri solet diluculo' is Remigius' before-sunrise light, two hundred and seventy years on, stated in a handbook as fact rather than as opinion.", "crux": "first-light"}, {"id": "t-k8-34", "from": "bonaventure-sent-2-13-1-1", "to": "aug-gnl-1-3", "type": "contests", "evidence": "Augustine's position set out at length and fairly — heaven the unformed spiritual nature, light the angelic nature formed, day the angelic consideration — granted to be probable and reasonable, and then declined: the Catholic treatise-writers approved another way, the text more readily intimates it, and the expositors more generally follow it, so it is the safer and more useful to hold.", "crux": "first-light"}, {"id": "t-k8-35", "from": "bonaventure-sent-2-13-1-1", "to": "comestor-hs-1-3", "type": "parallel", "evidence": "The schools' settled answer in its two registers, as at K10: Comestor prints the luminous cloud in a handbook without noticing that anyone ever thought otherwise, and Bonaventure raises the question in a disputation in order to rule the same way. The corporeal light wins by handbook and by quaestio at once.", "crux": "first-light"}], "answers": {"borne-over": {"label": "Borne over", "gloss": "The verb is motion: a spirit carried above the water (LXX ἐπεφέρετο, Vulgate ferebatur)."}, "wind": {"label": "A wind", "gloss": "Ruach is weather, not a person; Onkelos keeps God at a remove."}, "spirit-of-mercy": {"label": "Spirit of mercy", "gloss": "A divine disposition blowing over the waters (Palestinian targums)."}, "messiah": {"label": "Spirit of the Messiah", "gloss": "Resh Lakish: the ruach of Isa 11:2, brought by repentance-as-water."}, "bird-hovering": {"label": "Dove hovering, not touching", "gloss": "Ben Zoma and Rashi: the bird measures a gap; it does not land."}, "fluttering": {"label": "Fluttering", "gloss": "Abelard's report of the Hebrew: volitabat, as the eagle of Deut 32:11."}, "brooding-warmth": {"label": "Bird brooding, warming", "gloss": "Jerome from the Hebrew, Basil's Syrian, then the Latin schools: the Spirit quickens matter like a hen on eggs."}, "power-not-place": {"label": "Power, not place", "gloss": "Augustine: 'above' means sovereignty, not position; the Manichees misread it."}, "craftsman": {"label": "The craftsman's will", "gloss": "The Spirit over the waters as the maker's intention over the wood."}, "love-gift": {"label": "Love, gift, weight", "gloss": "Confessions XIII: why the Spirit alone is said to be above; pondus meum amor meus."}, "trinity": {"label": "The Trinity named", "gloss": "The verse completes Father (in principio), Son (principium), Spirit."}, "heart": {"label": "Over the heart", "gloss": "Isidore's moral reading: the waters are our fluid, dark heart."}, "throne": {"label": "Throne of Glory", "gloss": "Rashi: the throne stands in the air, held by the breath of God's mouth."}, "unus-cardinal": {"label": "The versions keep the cardinal", "gloss": "ἡμέρα μία, dies unus, yoma chad: 'one', not 'first', in every ancient version."}, "unus-grammatical": {"label": "'First' needs a second", "gloss": "The series 'one, second, third' is improper (Bereshit Rabbah); or, first and second are relatives and there was no second yet (Bruno)."}, "unus-alone": {"label": "God was alone that day", "gloss": "Yachid in his world: no angels were made on the first day, so there was no second anything (Bereshit Rabbah, Rashi)."}, "unus-yom-kippur": {"label": "The one day given to Israel", "gloss": "'One day' is the Day of Atonement, the day the Holy One gave them."}, "unus-24-hours": {"label": "One circuit, twenty-four hours", "gloss": "Day and night together make one revolution, and the whole is named from the day alone."}, "unus-repeated": {"label": "The same day repeated", "gloss": "There is one day only — the angelic light — presented once for each kind of thing made (Augustine)."}, "unus-all-time": {"label": "One day = all time", "gloss": "The word holds the whole span of the ages, or the whole work of the six days (Augustine's set-aside reading; Abelard's own)."}, "unus-angelic-unity": {"label": "The unity of angelic dignity", "gloss": "'One' names the undivided attention of the angelic mind, not a place in a series (Angelomus)."}, "unus-eternal-day": {"label": "The true first day is eternal", "gloss": "This day is first only by number and order of creation; the day that is first by nature is uncreated light (Rupert)."}, "day-precedes-night": {"label": "Day before night", "gloss": "Evening is the end of a finished day, morning the end of the night; days are counted from morning to morning."}, "day-follows-night": {"label": "Night before day", "gloss": "'One day' rules that reckoning begins at evening (Ben Zoma, b. Chullin 83a)."}, "night-for-rest": {"label": "Night made for rest", "gloss": "Day is for labour and night for rest, so only the day's bounds are counted."}, "day-is-a-measure": {"label": "The day's measure is a creature", "gloss": "The measure of day and of night was itself made on day one (b. Chagigah 12a)."}, "evening-is-completion": {"label": "Evening completes a work", "gloss": "Vespera is a work perfected, mane the beginning of the next — the Carolingian formula."}, "evening-is-self-knowledge": {"label": "Evening and morning knowledge", "gloss": "The creature known in itself is evening; known in the Word and referred back in praise, morning (Augustine)."}, "evening-moral": {"label": "Evening as sin or temptation", "gloss": "Evening and morning are the deeds of the wicked and the righteous, or sin and renewal, or temptation and the light of justice."}, "simul": {"label": "All things made at once", "gloss": "Creavit omnia simul (Sir 18:1): the days are not successive."}, "six-days-literal": {"label": "Six real days", "gloss": "Created at once in matter, distinguished in form through six successive days (the common doctors, Bonaventure)."}, "principio-temporis": {"label": "In the beginning of time", "gloss": "The word dates the making: time began with the world, and there was no before (Onkelos, Bede, Rabanus, Remigius, Hugh)."}, "principio-in-filio": {"label": "In the Son", "gloss": "Principium is a proper name of the Word, on the strength of John 8:25 and Ps 104:24 (Ambrose, Augustine, Isidore, Alcuin, the Glossa, Rupert, Honorius)."}, "principio-first-of-all": {"label": "First of all things", "gloss": "'In the beginning' means before everything else that follows — in the beginning of the creatures, or on the first day (Augustine's second reading; Bruno, Abelard)."}, "principio-is-first-creature": {"label": "The first creature is a beginning", "gloss": "The first intellectual creature may be called a beginning to the things it heads (Augustine, De Genesi imperfectus)."}, "beginning-is-wisdom": {"label": "In Wisdom", "gloss": "The beginning is Wisdom — which is the Torah on one bench (Prov 8:22, Prov 3:19, Neofiti) and the Son on the other (Ps 104:24)."}, "reshit-is-torah": {"label": "The beginning is the Torah", "gloss": "Reshit is the Torah, called reshit darko: God looked into it as an architect into his plans and created the world (Bereshit Rabbah, Rashi)."}, "reshit-is-israel": {"label": "For the sake of Israel", "gloss": "Reshit is Israel, called reshit tevu'ato (Jer 2:3); the world was made for their sake."}, "reshit-construct": {"label": "'When God began to create'", "gloss": "Bereshit is a construct and the verse a subordinate clause: at the beginning of God's creating (Rashi's plain sense, Ibn Ezra; contested by Ramban)."}, "world-has-a-beginning": {"label": "The world is not eternal", "gloss": "The point of saying 'in the beginning' at all is that the world had one, against the philosophers (Ambrose, Remigius, Hugh, Ramban)."}, "bereshit-book-name": {"label": "It is the book's name", "gloss": "The Hebrews name volumes from their opening words, so bresith is the title of Genesis (Jerome, Wigbod, Angelomus)."}, "six-preceded": {"label": "Six things preceded the world", "gloss": "Torah and the Throne of Glory were made before it; the patriarchs, Israel, the Temple and the Messiah's name were contemplated (Bereshit Rabbah 1:4)."}, "read-it-twice": {"label": "Say the phrase twice", "gloss": "In principio is to be repeated — once in the Son, once at the beginning of time — rather than decided (Comestor)."}, "lux-corporalis": {"label": "A bodily light", "gloss": "A material light made to light material things, standing in the sun's place until the fourth day (Basil, Ambrose, Bede, Hugh, Honorius, Comestor, Bonaventure)."}, "lux-angelica": {"label": "The angelic creation", "gloss": "The light is the spiritual creature called 'heaven' in v. 1, made light by turning to its Creator (Augustine, Angelomus, Rupert)."}, "lux-hidden": {"label": "Stored for the righteous", "gloss": "Too good for the wicked, it was hidden away and is kept for the righteous in the time to come (Bereshit Rabbah, b. Chagigah, Rashi)."}, "lux-garment": {"label": "From the light of his garment", "gloss": "God wrapped himself in it like a garment (Ps 104:2); the heavens were stretched out of it (Bereshit Rabbah, Pirkei de-Rabbi Eliezer)."}, "lux-from-temple": {"label": "From the site of the Temple", "gloss": "The light was created from the place of the sanctuary (Ezek 43:2; Jer 17:12)."}, "lux-becomes-luminaries": {"label": "The luminaries were made from it", "gloss": "The nature of light was made on day one and hung in the firmament on day four (the sages in b. Chagigah 12a; an unnamed opinion in Augustine)."}, "lux-twilight": {"label": "A light like the dawn", "gloss": "Not the sun's brightness but what the sky is before sunrise or after sunset (Remigius, Honorius, Comestor, Hugh)."}, "lux-is-day": {"label": "'Light' just means day", "gloss": "The verse answers itself: he called the light Day, so light here is put for day (Bruno)."}, "lux-is-distinction": {"label": "The distinguishing of the works", "gloss": "The light is the confused heap becoming distinct and knowable, not a thing at all (Abelard)."}, "fiat-is-instantaneous": {"label": "Speaking is making", "gloss": "No interval between the command and the thing: the Hebrew says only 'let it be, and it was' (Ambrose, Basil, Angelomus, Abelard)."}}, "senses": {"literal": "Literal", "allegorical": "Allegorical", "spiritual": "Spiritual", "translation": "Translation"}};
const svg = d3.select('#map'), panel = document.getElementById('panel');
const g = svg.append('g');
const gRings = g.append('g'), gHubLinks = g.append('g'), gEdges = g.append('g'), gHubs = g.append('g'), gNodes = g.append('g'), gLabels = g.append('g');
let W = 800, H = 600, mode = 'answers';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const wn = D.witnesses.map(w => ({...w, kind: 'w'}));
const byId = Object.fromEntries(wn.map(n => [n.id, n]));
const ansKeys = Object.keys(D.answers), senseKeys = Object.keys(D.senses);
const hubsA = ansKeys.map(k => ({id: 'hub:' + k, kind: 'hub', key: k, label: D.answers[k].label, gloss: D.answers[k].gloss, facet: 'answers'}));
const hubsS = senseKeys.map(k => ({id: 'hub:' + k, kind: 'hub', key: k, label: D.senses[k], gloss: '', facet: 'sense'}));
const hubById = Object.fromEntries([...hubsA, ...hubsS].map(h => [h.id, h]));
const threads = D.threads.map(t => ({...t, source: byId[t.from], target: byId[t.to]})).filter(t => t.source && t.target);
const hubLinksA = wn.flatMap(w => w.answers.map(a => ({source: w, target: hubById['hub:' + a]})));
const hubLinksS = wn.flatMap(w => w.senses.map(s => ({source: w, target: hubById['hub:' + s]})));

let k = 1;
function applyScale() {
  nodeSel.attr('r', d => (d.slot ? 6 : 7) / k).attr('stroke-width', 2 / k);
  labelSel.attr('font-size', 11 / k + 'px').attr('dx', 10 / k).attr('dy', 4 / k);
  edgeSel.attr('stroke-width', d => (d.type === 'contests' ? 1.8 : d.type === 'parallel' ? 2 : 1.4) / k).attr('stroke-dasharray', d => d.type === 'echoes' ? `${5/k} ${4/k}` : d.type === 'parallel' ? `${2/k} ${4/k}` : null);
  if (hubSel) { hubSel.attr('r', 13 / k).attr('stroke-width', 1.5 / k); hubLblSel.selectAll('.hublbl').attr('font-size', 12 / k + 'px').attr('y', 30 / k); hubLblSel.selectAll('.hubsub').attr('font-size', 10.5 / k + 'px').attr('y', 43 / k); hubLinkSel.attr('stroke-width', 1 / k).attr('stroke-dasharray', `${1/k} ${3/k}`); }
  gRings.selectAll('text').attr('font-size', 10 / k + 'px'); gRings.selectAll('circle').attr('stroke-width', 1 / k);
}
svg.call(d3.zoom().scaleExtent([.5, 6]).on('zoom', e => { g.attr('transform', e.transform); if (e.transform.k !== k) { k = e.transform.k; applyScale(); } }));

// ---------- drawing
const edgeSel = gEdges.selectAll('path').data(threads).join('path').attr('class', d => 'edge ' + d.type)
  .on('mouseenter', (e, d) => showEdge(d, true)).on('mouseleave', (e, d) => showEdge(d, false)).on('click', (e, d) => { showEdge(d, true); e.stopPropagation(); });
const nodeSel = gNodes.selectAll('circle').data(wn).join('circle').attr('class', d => 'node ' + d.tradition + (d.slot ? ' slot' : '')).attr('r', d => d.slot ? 6 : 7)
  .on('click', (e, d) => { showWitness(d); e.stopPropagation(); }).on('mouseenter', (e, d) => focusNode(d, true)).on('mouseleave', (e, d) => focusNode(d, false))
  .call(d3.drag().on('start', (e, d) => { d.fx = d.x; d.fy = d.y; }).on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; sim.alpha(.3).restart(); }).on('end', (e, d) => { d.fx = null; d.fy = null; }));
const labelSel = gLabels.selectAll('text').data(wn).join('text').attr('class', 'lbl').text(d => d.short);
let hubSel, hubLblSel, hubLinkSel;

const sim = d3.forceSimulation().on('tick', tick);
function tick() {
  edgeSel.attr('d', d => { const {source: s, target: t} = d; const dx = t.x - s.x, dy = t.y - s.y, dr = Math.hypot(dx, dy) * 1.4; return `M${s.x},${s.y}A${dr},${dr} 0 0,1 ${t.x},${t.y}`; });
  nodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
  labelSel.attr('x', d => d.x).attr('y', d => d.y);
  if (hubSel) { hubSel.attr('cx', d => d.x).attr('cy', d => d.y); hubLblSel.attr('transform', d => `translate(${d.x},${d.y})`); hubLinkSel.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y); }
}

function size() { const r = svg.node().getBoundingClientRect(); W = r.width; H = r.height; }

function layout() {
  size(); const cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 40;
  gRings.selectAll('*').remove(); gHubs.selectAll('*').remove(); gHubLinks.selectAll('*').remove(); hubSel = null;
  const labelR = d => d.kind === 'hub' ? 46 : 12 + d.short.length * 2.4;
  sim.nodes(wn).force('charge', null).force('link', null).force('x', null).force('y', null).force('hublink', null).force('collide', d3.forceCollide(labelR).strength(.9));
  if (mode === 'answers' || mode === 'sense') {
    const hubs = mode === 'answers' ? hubsA : hubsS, links = mode === 'answers' ? hubLinksA : hubLinksS;
    hubs.forEach((h, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / hubs.length; h.fx = cx + Math.cos(a) * R * .9; h.fy = cy + Math.sin(a) * R * .9; h.x = h.fx; h.y = h.fy; });
    sim.nodes([...wn, ...hubs]);
    sim.force('charge', d3.forceManyBody().strength(d => d.kind === 'hub' ? -80 : -320))
       .force('hublink', d3.forceLink(links).distance(mode === 'answers' ? 120 : 150).strength(.6))
       .force('link', d3.forceLink(threads).distance(120).strength(.04))
       .force('x', d3.forceX(cx).strength(.03)).force('y', d3.forceY(cy).strength(.03));
    hubLinkSel = gHubLinks.selectAll('line').data(links).join('line').attr('class', 'hublink');
    hubSel = gHubs.selectAll('circle').data(hubs).join('circle').attr('class', 'hub').attr('r', 13).on('click', (e, d) => { showHub(d); e.stopPropagation(); });
    hubLblSel = gHubs.selectAll('g').data(hubs).join('g');
    hubLblSel.append('text').attr('class', 'hublbl').attr('text-anchor', 'middle').attr('y', 30).text(d => d.label);
    hubLblSel.append('text').attr('class', 'hubsub').attr('text-anchor', 'middle').attr('y', 43).text(d => (mode === 'answers' ? hubLinksA : hubLinksS).filter(l => l.target === d).length + ' witnesses');
  } else if (mode === 'time') {
    const dates = wn.map(d => d.date), d0 = Math.min(...dates), d1 = Math.max(...dates);
    const rOf = d => 50 + (d - d0) / (d1 - d0) * (R - 50);
    [0, 500, 1000].forEach(y => { gRings.append('circle').attr('class', 'ring').attr('cx', cx).attr('cy', cy).attr('r', rOf(y)); gRings.append('text').attr('class', 'ringlbl').attr('x', cx + 4).attr('y', cy - rOf(y) - 4).text(y === 0 ? 'year 1' : y); });
    gRings.append('text').attr('class', 'ringlbl').attr('x', cx + R * .7).attr('y', cy + R + 26).text('LATIN →').attr('text-anchor', 'middle');
    gRings.append('text').attr('class', 'ringlbl').attr('x', cx - R * .7).attr('y', cy + R + 26).text('← RABBINIC').attr('text-anchor', 'middle');
    const groups = {'greek-jewish': [], latin: [], rabbinic: []}; wn.forEach(w => groups[w.tradition].push(w));
    Object.values(groups).forEach(a => a.sort((p, q) => p.date - q.date));
    groups['greek-jewish'].forEach(w => { w.tx = cx; w.ty = cy - rOf(w.date); });
    groups.latin.forEach((w, i, a) => { const t = -Math.PI * .42 + (i / Math.max(1, a.length - 1)) * Math.PI * .84; w.tx = cx + Math.cos(t) * rOf(w.date); w.ty = cy + Math.sin(t) * rOf(w.date); });
    groups.rabbinic.forEach((w, i, a) => { const t = Math.PI + Math.PI * .42 - (i / Math.max(1, a.length - 1)) * Math.PI * .84; w.tx = cx + Math.cos(t) * rOf(w.date); w.ty = cy + Math.sin(t) * rOf(w.date); });
    sim.force('x', d3.forceX(d => d.tx).strength(.6)).force('y', d3.forceY(d => d.ty).strength(.6)).force('collide', d3.forceCollide(d => 8 + d.short.length * 1.6).strength(.8));
  } else if (mode === 'place') {
    const lons = wn.map(d => d.lon).filter(Number.isFinite), lats = wn.map(d => d.lat).filter(Number.isFinite);
    const sx = d3.scaleLinear().domain([Math.min(...lons) - 2, Math.max(...lons) + 2]).range([60, W - 120]);
    const sy = d3.scaleLinear().domain([Math.min(...lats) - 1, Math.max(...lats) + 1]).range([H - 50, 50]);
    const seen = new Set();
    wn.forEach(w => { w.tx = sx(w.lon); w.ty = sy(w.lat); if (!seen.has(w.place)) { seen.add(w.place); gRings.append('text').attr('class', 'placelbl').attr('x', w.tx + 12).attr('y', w.ty - 12).text(w.place); } });
    sim.force('x', d3.forceX(d => d.tx).strength(.5)).force('y', d3.forceY(d => d.ty).strength(.5)).force('collide', d3.forceCollide(d => 8 + d.short.length * 1.6).strength(.8));
  }
  applyScale();
  sim.alpha(1).restart();
}

// ---------- panel
function showHome() {
  const q = D.crux.question;
  panel.innerHTML = `<p class="eyebrow">Crux · Genesis 1:3</p><h2>${esc(q.en)}</h2><p class="la-q">${esc(q.la)}</p><p class="heb-q">${esc(q.he)}</p>
  <p>${esc(D.crux.summary)}</p><p>${esc(D.crux.finding)}</p>
  <p class="hint"><b>Answers</b> gathers witnesses around the reading they give; a witness between two hubs holds both. <b>Time</b> is a clock: distance from the centre is the date, Latin to the right, rabbinic to the left. <b>Places</b> is a map. <b>Senses</b> sorts by literal, allegorical, spiritual, translation. Threads keep their meaning in every arrangement. Click a node or a hub; hover a line; drag to pull the graph apart; scroll to zoom: zooming spreads the graph while dots and labels keep their size.</p>`;
}
function showWitness(w) {
  const lem = Object.entries(w.lemma || {}).filter(([k]) => k !== 'en').map(([k, v]) => `<span class="${k === 'he' || k === 'arc' ? 'heb' : 'lat'}" dir="${k === 'he' || k === 'arc' ? 'rtl' : 'ltr'}">${esc(v)}</span>`).join(' ');
  const ocls = (w.olang === 'he' || w.olang === 'arc') ? 'heb' : 'lat';
  const ans = (w.answers || []).map(a => `<span>${esc(D.answers[a]?.label || a)}</span>`).join('');
  const ins = threads.filter(t => t.target === w), outs = threads.filter(t => t.source === w);
  const rel = [...outs.map(t => `→ ${t.type} · ${esc(t.target.short)}`), ...ins.map(t => `← ${t.type} · ${esc(t.source.short)}`)].join('<br>');
  panel.innerHTML = `<p class="eyebrow">${esc(w.tradition.replace('-', ' '))} · ${esc(w.datelabel)} · ${esc(w.place)}</p><h2>${esc(w.author)}</h2><p class="meta">${esc(w.source)}</p>
  <p class="lem">${lem}</p><p>${esc(w.en)}</p><div class="orig ${ocls}">${esc(w.orig)}</div><div class="ans">${ans}</div><p class="note">${esc(w.notes)}</p>
  <p class="cred">${w.translator === 'claude-draft' ? 'Draft English (Claude), awaiting Wilson' : 'English: ' + esc(w.translator)}</p>${rel ? `<p class="cred">${rel}</p>` : ''}`;
  panel.scrollTop = 0;
}
function showHub(h) {
  const links = (h.facet === 'answers' ? hubLinksA : hubLinksS).filter(l => l.target === h);
  panel.innerHTML = `<p class="eyebrow">${h.facet === 'answers' ? 'Answer family' : 'Sense'}</p><h2>${esc(h.label)}</h2><p>${esc(h.gloss)}</p>
  <p class="cred">${links.map(l => esc(l.source.short) + ' · ' + esc(l.source.datelabel)).join('<br>')}</p>`;
  nodeSel.classed('dim', d => !links.some(l => l.source === d)); labelSel.classed('dim', d => !links.some(l => l.source === d));
}
function showEdge(t, on) {
  edgeSel.classed('on', d => on && d === t);
  nodeSel.classed('on', d => on && (d === t.source || d === t.target));
  if (on) { panel.innerHTML = `<p class="eyebrow">${esc(t.type)} · ${esc(t.source.short)} → ${esc(t.target.short)}</p><div class="ev">${esc(t.evidence)}</div>`; }
}
function focusNode(w, on) {
  edgeSel.classed('dim', d => on && d.source !== w && d.target !== w);
  nodeSel.classed('dim', d => on && d !== w && !threads.some(t => (t.source === w && t.target === d) || (t.target === w && t.source === d)));
  labelSel.classed('dim', d => on && d !== w && !threads.some(t => (t.source === w && t.target === d) || (t.target === w && t.source === d)));
}
svg.on('click', () => { nodeSel.classed('dim', false).classed('on', false); labelSel.classed('dim', false); edgeSel.classed('dim', false).classed('on', false); showHome(); });
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; document.querySelectorAll('.modes button').forEach(x => x.setAttribute('aria-pressed', x === b)); layout(); }));
document.querySelectorAll('#filters input').forEach(c => c.addEventListener('change', () => { const off = new Set([...document.querySelectorAll('#filters input')].filter(i => !i.checked).map(i => i.dataset.type)); edgeSel.classed('hidden', d => off.has(d.type)); }));
window.addEventListener('resize', () => layout());
size(); wn.forEach(w => { w.x = W / 2 + (Math.random() - .5) * 200; w.y = H / 2 + (Math.random() - .5) * 200; });
showHome(); layout();
</script>
