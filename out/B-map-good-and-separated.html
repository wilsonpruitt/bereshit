<script>
const D = {"crux": {"id": "good-and-separated", "question": {"en": "Why separate light from darkness, and is darkness a creature, an evil, or the wicked?", "la": "Cur divisit lucem a tenebris?", "he": "לָמָּה הִבְדִּיל בֵּין הָאוֹר וּבֵין הַחֹשֶׁךְ?"}, "summary": "Both traditions allegorize the same verse the same way (light/dark = righteous/wicked); test whether Bede or the Glossa show any Hebrew mediation.", "finding": "Both benches decide this crux by reading a silence, and they find the same silence at consecutive clauses of the same verse. Augustine notices that on the first day 'and God saw that it was good' stands before the division and not after it, whereas on the fourth day, where the darkness is blameless, it stands after — and concludes that the placing is deliberate: God does not repeat his approval once the darkness is in view, 'lest both should be called good, when one of them was evil'. Bereshit Rabbah reads the next clause the same way and gets the same answer: it is not written 'and to the darkness God called night' but 'and to the darkness he called night', because the Holy One never joins his name to the bad but only to the good. And R. Abahu, at Bereshit Rabbah 2:5, argues from the identical omission at the identical clause that God desires the deeds of the righteous and not those of the wicked. Three arguments from what the verse declines to say, on two benches, with no contact — and it is the only place on this site where the two traditions use the same technique on the same words to reach the same conclusion.\n\nWhat they do not share is the question underneath. The Latin bench cannot get past whether darkness is anything, because Augustine settled that it is not — it is the absence of light, as silence is the ceasing of voice and nakedness the absence of a garment — and then had to explain how a nothing can be divided, which he did with the finest thing said on this crux in either language: God did not make the darkness, he ordered it, as a singer orders the rests in his song and a painter the shadows that set off what is prominent. Every Latin witness after him is placed by that doctrine, including the ones who reject it. And they do reject it, in the schoolroom rather than in the controversy: Wigbod's dialogue puts under the rubric AUGUSTINUS the inference that everything divided can also be, so that as there is an essence of light there is an essence of darkness; Remigius says God made both and proves it from the Benedicite, where light and darkness are called together to bless the Lord, which a privation cannot be; and the Glossa prints Remigius' sentence as the standard gloss on Gen 1:4 three columns after printing Augustine's privation as the standard gloss on Gen 1:2. The twelfth century then argues from Augustine's doctrine on a page that no longer teaches it.\n\nThe rabbinic bench never asks the question at all, and its answers are correspondingly unembarrassed. Pirkei de-Rabbi Eliezer lists darkness fourth among the eight things created on the first day, with no proof text and no defence. R. Tanḥuma quotes Isaiah's 'who forms light and creates darkness, who makes peace' and says that after they were created he made peace between them. Ramban says the darkness is the element of fire, which is dark, and that were it red it would redden the night for us. Comestor, who knows perfectly well that shadow is what bodies cast, has to introduce the same thought with a quasi. What the rabbinic bench has instead of the metaphysical question is a liturgical one: R. Ze'eira derives from 'he saw … and he divided' the rule that one does not bless the lamp at havdala until he has used its light, so that the verse ends as the source of a benediction still said every week — and nothing on the Latin bench has that shape, because nothing on the Latin bench is looking for a practice."}, "witnesses": [{"id": "lxx-1-4", "short": "lxx-1-4", "author": "The Seventy", "tradition": "greek-jewish", "date": -250, "datelabel": "c. 250 BCE", "place": "Alexandria", "lat": 31.2, "lon": 29.92, "answers": ["divisio-loci", "bonum-approbatio"], "senses": ["translation"], "lemma": {"el": "διεχώρισεν ἀνὰ μέσον", "en": "he separated between"}, "en": "And God saw the light, that it was beautiful. And God separated between the light and between the darkness.", "translator": "claude-draft", "orig": "καὶ εἶδεν ὁ θεὸς τὸ φῶς ὅτι καλόν. καὶ διεχώρισεν ὁ θεὸς ἀνὰ μέσον τοῦ φωτὸς καὶ ἀνὰ μέσον τοῦ σκότους.", "olang": "el", "source": "LXX Gen 1:4 (Rahlfs)", "notes": "Two features of the Greek decide most of what the Latin bench can say. First, the Hebrew ki tov is rendered kalon, 'beautiful' rather than 'good' — so that the approval reads as an aesthetic verdict, which is what Ambrose then expounds at length and what Augustine has to argue is not a verdict reached after the event. Second, the Hebrew's bein … u-vein is carried over word for word as ana meson … kai ana meson, 'between … and between', and the Old Latin that Augustine and his Carolingian copyists read reproduces it as divisit inter lucem et tenebras. Jerome does not: he writes divisit lucem a tenebris. Which of the two a Latin witness quotes is the cleanest single indication of which Latin text lay in front of him, and on this verse the two texts sort the bench almost perfectly.", "slot": false}, {"id": "vulgate-1-4", "short": "vulgate-1-4", "author": "Jerome", "tradition": "latin", "date": 392, "datelabel": "c. 392", "place": "Bethlehem", "lat": 31.7, "lon": 35.2, "answers": ["divisio-loci", "bonum-approbatio"], "senses": ["translation"], "lemma": {"la": "divisit lucem a tenebris", "en": "he divided the light from the darkness"}, "en": "And God saw the light, that it was good: and he divided the light from the darkness.", "translator": "claude-draft", "orig": "Et vidit Deus lucem quod esset bona: et divisit lucem a tenebris.", "olang": "la", "source": "PL 28, col. 163C", "notes": "Jerome drops the Greek's doubled preposition and writes an ordinary Latin sentence: he divided the light from the darkness. The change is small and its consequences are not. Where the Old Latin's inter lucem et tenebras leaves the two terms standing side by side as a pair between which a distinction is drawn, a tenebris makes the darkness the thing the light is taken away from — an ablative of separation, with something there to be separated from. Augustine, Angelomus and Alcuin quote the older form and argue that no darkness was made; Bede, Remigius, the Glossa and Comestor quote Jerome's and hold that both were made. The correlation is not perfect — Hugh and Rupert quote Jerome and follow Augustine — but it is close enough to be visible on the page.", "slot": false}, {"id": "targ-onk-1-4", "short": "targ-onk-1-4", "author": "Targum Onkelos", "tradition": "rabbinic", "date": 150, "datelabel": "c. 150", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["divisio-loci"], "senses": ["translation"], "lemma": {"arc": "וְאַפְרֵשׁ", "en": "and he set apart"}, "en": "And the LORD saw the light, that it was good; and the LORD set apart between the light and between the darkness.", "translator": "claude-draft", "orig": "וַחֲזָא יְיָ יָת נְהוֹרָא אֲרֵי טָב וְאַפְרֵשׁ יְיָ בֵּין נְהוֹרָא וּבֵין חֲשׁוֹכָא", "olang": "arc", "source": "Targum Onkelos Gen 1:4", "notes": "Onkelos renders the verse word for word and adds nothing — afresh for hivdil, the same doubled 'between' as the Hebrew. This is worth recording rather than passing over, because Onkelos is not usually so quiet: he will paraphrase to protect the divine name and to remove anthropomorphism, and here, where God is said to see and to judge, he leaves both standing.", "slot": false}, {"id": "targ-psj-1-4", "short": "targ-psj-1-4", "author": "Targum Pseudo-Jonathan", "tradition": "rabbinic", "date": 650, "datelabel": "400–800", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["divisio-loci"], "senses": ["translation"], "lemma": {"arc": "וְאַפְרֵישׁ", "en": "and he set apart"}, "en": "And the Lord beheld the light, that it was good; and the Lord divided between the light and the darkness.", "translator": "J. W. Etheridge, 1862", "orig": "וַחֲזָא יְיָ יַת נְהוֹרָא אֲרוּם טַב וְאַפְרֵישׁ יְיָ בֵּין נְהוֹרָא וּבֵין חֲשׁוֹכָא", "olang": "arc", "source": "Targum Pseudo-Jonathan Gen 1:4", "notes": "The expansive targum, and on this verse it expands nothing: its Gen 1:4 is Onkelos letter for letter. One verse later it is at work again — the light was made so that the inhabitants of the world might labour by it, the darkness so that the creatures might rest in it — which is Remigius' reason for the division, arrived at in Aramaic. That the expansion attaches to the naming in v. 5 and not to the dividing in v. 4 is itself evidence about where the rabbinic bench thought the difficulty lay.", "slot": false}, {"id": "br-2-5", "short": "br-2-5", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["tenebrae-peccatores", "bonum-approbatio"], "senses": ["allegorical"], "lemma": {"he": "אֲבָל אֵינִי יוֹדֵעַ בְּאֵיזֶה מֵהֶם חָפֵץ", "en": "but I do not know which of them he desires"}, "en": "Rabbi Abahu and Rabbi Ḥiyya the Great, Rabbi Abahu said: Right from the beginning of the creation of the world, the Holy One blessed be He foresaw the actions of the righteous and the actions of the wicked. That is what is written: “For the Lord knows the way of the righteous, but the way of the wicked will perish” (Psalms 1:6). “The earth was emptiness and disorder” – these are the actions of the wicked. “God said: Let there be light” – these are the actions of the righteous. But I do not know which He desires, whether it is the actions of these, or the actions of those. When it is written: “God saw the light, that it was good” (Genesis 1:4) – this shows that He desires the actions of the righteous, and does not desire the actions of the wicked.", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "רַבִּי אַבָּהוּ וְרַבִּי חִיָּא רַבָּה, רַבִּי אַבָּהוּ אָמַר מִתְּחִלַּת בְּרִיָּתוֹ שֶׁל עוֹלָם צָפָה הַקָּדוֹשׁ בָּרוּךְ הוּא בְּמַעֲשֵׂיהֶן שֶׁל צַדִּיקִים וּמַעֲשֵׂיהֶן שֶׁל רְשָׁעִים, הֲדָא הוּא דִּכְתִיב (תהלים א, ו): כִּי יוֹדֵעַ ה' דֶּרֶךְ צַדִּיקִים וְדֶרֶךְ רְשָׁעִים תֹּאבֵד. וְהָאָרֶץ הָיְתָה תֹהוּ וָבֹהוּ, אֵלּוּ מַעֲשֵׂיהֶן שֶׁל רְשָׁעִים, וַיֹּאמֶר אֱלֹהִים יְהִי אוֹר, אֵלּוּ מַעֲשֵׂיהֶן שֶׁל צַדִּיקִים, אֲבָל אֵינִי יוֹדֵעַ בְּאֵיזֶה מֵהֶם חָפֵץ, אִם בְּמַעֲשֵׂה אֵלּוּ אִם בְּמַעֲשֵׂה אֵלּוּ, כֵּיוָן דִּכְתִיב וַיַּרְא אֱלֹהִים אֶת הָאוֹר כִּי טוֹב, הֱוֵי בְּמַעֲשֵׂיהֶן שֶׁל צַדִּיקִים חָפֵץ, וְאֵינוֹ חָפֵץ בְּמַעֲשֵׂיהֶן שֶׁל רְשָׁעִים.", "olang": "he", "source": "Bereshit Rabbah 2:5 (Vilna numbering)", "notes": "The moral reading built as an argument rather than asserted. R. Abahu takes the opening verses as a foresight of the deeds of the righteous and of the wicked — tohu va-vohu the deeds of the wicked, 'let there be light' the deeds of the righteous — and then stops on the difficulty: 'but I do not know which of them he desires.' The verse that settles it is Gen 1:4. Because it is written 'and God saw the light, that it was good', and not written of the darkness, he desires the deeds of the righteous and does not desire the deeds of the wicked. The whole weight falls on what the verse omits to say, which is precisely Augustine's argument in City of God XI.20 and the question Wigbod's pupil asks in his master's face.", "slot": false}, {"id": "br-3-6b", "short": "br-3-6b", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["havdala-derived", "lux-hivdil-set-aside", "divisio-loci", "tenebrae-creatura", "bonum-withheld"], "senses": ["literal", "allegorical"], "lemma": {"he": "וַיַּבְדֵּל הַבְדָּלָה מַמָּשׁ", "en": "va-yavdel — a real separating"}, "en": "Rabbi Ze’eira son of Rabbi Abahu preached in Caesarea: From where is it derived that someone does not recite a blessing on the candle [at havdala on Saturday night] until he avails himself of its light? It is from here: “[God] saw…and [God] distinguished [vayavdel].” Rabbi Yehuda bar Rabbi Simon said: He set it aside for Himself. The Rabbis say: He set it aside for the righteous in the World to Come. This is analogous to a king who had a fine portion of food and set it aside for his son. “God called the light, Day, and to the darkness He called Night. It was evening and it was morning, one day” (Genesis 1:5). Rabbi Berekhya said: This is what two eminent men of the world, Rabbi Yoḥanan and Rabbi Shimon ben Lakish, expounded: “[God] distinguished” – this refers to distinguishing in the literal sense. This is analogous to a king who had two commanders, one to be in charge by day and one to be in charge by night. They were arguing with one another. This one said: ‘I will be in charge by day,’ and that one said: ‘I will be in charge by day.’ The king summoned the first one and said to him: ‘So-and-so, the day will be your realm.’ Likewise for the second one, he said to him: ‘So-and-so, the night will be your realm.’ So, too, “God called the light, Day” – He said to it: ‘The day will be your realm.’ “And to the darkness He called Night” – He said to it: ‘The night will be your realm.’ Rabbi Yoḥanan said: That is what the Holy One blessed be He says to Job: “In all your days, have you commanded the morning and apprised darkness of its place?” (Job 38:12) – have you informed it of its place, where it is? This was a rhetorical question. Rabbi Tanḥuma said: I will say the source for this: “He forms light and creates darkness, He makes peace” (Isaiah 45:7) – after they were created, He made peace [between them]. “God called the light, Day” – Rabbi Elazar said: The Holy One blessed be He never associates His name with the bad, but only with the good. “God called the light, Day and to the darkness God called night” is not written here, but rather, “to the darkness He called night.”", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "רַבִּי זְעֵירָא בְּרֵיהּ דְּרַבִּי אַבָּהוּ דָּרַשׁ בְּקֵיסָרִין, מִנַּיִן שֶׁאֵין מְבָרְכִין עַל הַנֵּר עַד שֶׁיֵּאוֹתוּ לְאוֹרוֹ, מִן הָכָא, וַיַּרְא, וַיַּבְדֵּל. רַבִּי יְהוּדָה בְּרַבִּי סִימוֹן אָמַר הִבְדִּילוֹ לוֹ. רַבָּנָן אָמְרֵי הִבְדִּילוֹ לַצַּדִּיקִים לֶעָתִיד לָבוֹא, מָשָׁל לְמֶלֶךְ שֶׁהָיָה לוֹ מָנָה יָפָה וְהִפְרִישָׁהּ לִבְנוֹ. אָמַר רַבִּי בֶּרֶכְיָה כָּךְ דָּרְשׁוּ שְׁנֵי גְדוֹלֵי עוֹלָם, רַבִּי יוֹחָנָן וְרַבִּי שִׁמְעוֹן בֶּן לָקִישׁ, וַיַּבְדֵּל הַבְדָּלָה מַמָּשׁ, מָשָׁל לְמֶלֶךְ שֶׁהָיָה לוֹ שְׁנֵי אִיסְטַרְטִיגִין, אֶחָד שַׁלִּיט בַּיּוֹם וְאֶחָד שַׁלִּיט בַּלַּיְלָה, וְהָיוּ שְׁנֵיהֶם מִדַּיְינִין זֶה עִם זֶה, זֶה אוֹמֵר בַּיּוֹם אֲנִי שׁוֹלֵט, וְזֶה אוֹמֵר בַּיּוֹם אֲנִי שׁוֹלֵט. קָרָא הַמֶּלֶךְ לָרִאשׁוֹן אָמַר לוֹ פְּלוֹנִי יוֹם יְהֵא תְּחוּמָךְ, וְכֵן לַשֵׁנִי אָמַר לוֹ פְּלוֹנִי לַיְלָה יְהֵא תְּחוּמָךְ. כָּךְ וַיִּקְרָא אֱלֹהִים לָאוֹר יוֹם, אָמַר לוֹ יוֹם יְהֵא תְּחוּמָךְ, וְלַחשֶׁךְ קָרָא לָיְלָה, אָמַר לוֹ לַיְלָה יְהֵא תְּחוּמָךְ. אָמַר רַבִּי יוֹחָנָן הוּא שֶׁהַקָּדוֹשׁ בָּרוּךְ הוּא אוֹמֵר לְאִיּוֹב (איוב לח, יב): הֲמִיָּמֶיךָ צִוִּיתָ בֹּקֶר יִדַּעְתָּ הַשַּׁחַר מְקֹמוֹ, הֲיָדַעְתָּ מְקוֹמוֹ אֵי זֶה הוּא, אֶתְמְהָא. אָמַר רַבִּי תַּנְחוּמָא אֲנָא אָמְרֵי טַעֲמָא (ישעיה מה, ז): יוֹצֵר אוֹר וּבוֹרֵא חשֶׁךְ עֹשֶׂה שָׁלוֹם, מִשֶּׁנִּבְרְאוּ עֹשֶׂה שָׁלוֹם. וַיִּקְרָא אֱלֹהִים לָאוֹר יוֹם, אָמַר רַבִּי אֶלְעָזָר לְעוֹלָם אֵין הַקָּדוֹשׁ בָּרוּךְ הוּא מְיַחֵד שְׁמוֹ עַל הָרָעָה אֶלָא עַל הַטּוֹבָה, וַיִּקְרָא אֱלֹהִים לָאוֹר יוֹם וְלַחשֶׁךְ קָרָא אֱלֹהִים לַיְלָה אֵין כְּתִיב כָּאן, אֶלָּא וְלַחשֶׁךְ קָרָא לַיְלָה.", "olang": "he", "source": "Bereshit Rabbah 3:6, second half (Vilna numbering)", "notes": "Five answers to va-yavdel in one block, and between them they cover the whole ground the Latin bench covers, in a different order and with a liturgical question in front. R. Ze'eira of Caesarea asks from where we know that one does not bless the lamp at havdala until he has used its light, and answers 'from here: he saw … and he separated' — the seeing must come before the separating, so the verse becomes the source of a benediction. R. Yehuda bar Simon: he separated it for himself. The Rabbis: he separated it for the righteous in the time to come, like a king who had a fine portion and set it aside for his son. Then R. Yoḥanan and Resh Lakish, 'two eminent men of the world': va-yavdel means a real separating — a king with two generals, each claiming the day, told one 'day shall be your bound' and the other 'night shall be your bound'. Then R. Tanḥuma brings Isa 45:7, 'who forms light and creates darkness, who makes peace' — after they were created, he made peace between them, which grants outright that the darkness was created. And last R. Elazar, on the syntax: the Holy One never joins his name to the bad but only to the good, for it is not written 'and to the darkness God called night' but 'and to the darkness he called night'. **Slice note**: K8 built this Sefaria segment whole as `br-3-6` for its first half (the stored light). This witness is its second half, on a different lemma; Phase 4 should trim K8's slice rather than delete this one.", "slot": false}, {"id": "br-3-8-yanai", "short": "br-3-8-yanai", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["tenebrae-peccatores"], "senses": ["allegorical"], "lemma": {"he": "בֵּין מַעֲשֵׂיהֶן שֶׁל צַדִּיקִים לְמַעֲשֵׂיהֶן שֶׁל רְשָׁעִים", "en": "between the deeds of the righteous and the deeds of the wicked"}, "en": "Rabbi Yanai said: Right from the beginning of the creation of the world, the Holy One blessed be He foresaw the actions of the righteous and the actions of the wicked. “The earth was emptiness” (Genesis 1:2) – these are the actions of the wicked. “God said: Let there be light” (Genesis 1:3) – these are the actions of the righteous. “God distinguished between the light and the darkness” (Genesis 1:4) – between the actions of the righteous and the actions of the wicked. “God called the light, Day” (Genesis 1:5) – these are the actions of the righteous. “And to the darkness He called Night” (Genesis 1:5) – these are the actions of the wicked.", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "אָמַר רַבִּי יַנַּאי מִתְּחִלַּת בְּרִיָּתוֹ שֶׁל עוֹלָם צָפָה הַקָּדוֹשׁ בָּרוּךְ הוּא מַעֲשֵׂיהֶן שֶׁל צַדִּיקִים וּמַעֲשֵׂיהֶם שֶׁל רְשָׁעִים, וְהָאָרֶץ הָיְתָה תֹהוּ, אֵלּוּ מַעֲשֵׂיהֶם שֶׁל רְשָׁעִים. וַיֹּאמֶר אֱלֹהִים יְהִי אוֹר, אֵלּוּ מַעֲשֵׂיהֶן שֶׁל צַדִּיקִים. וַיַּבְדֵּל אֱלֹהִים בֵּין הָאוֹר וּבֵין הַחשֶׁךְ, בֵּין מַעֲשֵׂיהֶן שֶׁל צַדִּיקִים לְמַעֲשֵׂיהֶן שֶׁל רְשָׁעִים. וַיִּקְרָא אֱלֹהִים לָאוֹר יוֹם, אֵלּוּ מַעֲשֵׂיהֶן שֶׁל צַדִּיקִים. וְלַחשֶׁךְ קָרָא לָיְלָה, אֵלּוּ מַעֲשֵׂיהֶן שֶׁל רְשָׁעִים.", "olang": "he", "source": "Bereshit Rabbah 3:8, opening (Vilna numbering)", "notes": "R. Yanai runs the moral reading through the verses one clause at a time, so that nothing in Gen 1:2–5 is about light and darkness at all. The earth was tohu — the deeds of the wicked. Let there be light — the deeds of the righteous. And God divided between the light and the darkness — between the deeds of the righteous and the deeds of the wicked. He called the light day — the deeds of the righteous; and to the darkness he called night — the deeds of the wicked. It is the same reading as R. Abahu's at 2:5 with the argument taken out and the verse-by-verse mapping put in its place, and it is what Isidore, Rabanus, Remigius and the Glossa do in Latin with the same clauses, four hundred years later and to the same effect. **Slice note**: K10 built the continuation of this section as `br-3-8`, beginning at 'it was evening'; this is the part before it.", "slot": false}, {"id": "ibn-ezra-1-4", "short": "ibn-ezra-1-4", "author": "Abraham ibn Ezra", "tradition": "rabbinic", "date": 1155, "datelabel": "c. 1155", "place": "Lucca", "lat": 43.84, "lon": 10.5, "answers": ["divisio-nominis", "bonum-approbatio"], "senses": ["literal"], "lemma": {"he": "וְטַעַם וַיַּבְדֵּל בִּקְרִיאַת הַשֵּׁמוֹת", "en": "the meaning of 'and he divided' is by the calling of names"}, "en": "And He saw: Like “I myself saw…” Ecclesiastes 2:13; Daniel 10:7, it is [seeing] in [one’s] thought. And the meaning of “and He separated” – through calling of names.", "translator": "Sefaria Community Translation", "orig": "וירא כמו וראיתי אני (קהלת ב יג, דניאל יו\"ד ז) והוא במחשבה, וטעם ויבדל בקריאת השמות,", "olang": "he", "source": "Ibn Ezra on Gen 1:4", "notes": "Two clauses, and each disposes of half the crux. 'And he saw' is like Qohelet's 'I myself saw' — it is in the thought, so nothing happened at that moment and there is no inspection to explain. 'And the meaning of and he divided is by the calling of names' — the dividing of v. 4 simply is the naming of v. 5, so there is no separate act of separation to be located in space, in time, or among the angels. Every Latin answer on this crux presupposes that va-yavdel reports a distinct work; Ibn Ezra denies the premise in nine Hebrew words. Nobody on the Latin bench considers it, and the grammarian's solution has no counterpart there — although Augustine at De Genesi contra Manichaeos comes within a sentence of it when he wonders whether to have divided just is to have named.", "slot": false}, {"id": "ramban-1-2-choshech", "short": "ramban-1-2-choshech", "author": "Moses ben Naḥman (Naḥmanides)", "tradition": "rabbinic", "date": 1267, "datelabel": "1263–1270", "place": "Girona", "lat": 41.98, "lon": 2.82, "answers": ["tenebrae-ignis", "tenebrae-creatura"], "senses": ["literal"], "lemma": {"he": "וְהָאֵשׁ נִקְרֵאת חֹשֶׁךְ", "en": "and the fire is called 'darkness'"}, "en": "In this verse, the element of fire is called “darkness” because the elemental fire is dark. Were it red, it would redden the night for us. The element of water with which the dust was kneaded is here called “deep.” This is why the waters of the oceans are called “the deeps,” as it is written, The deeps cover them; The deeps were congealed; The deep was round about me. The bottom of the ocean is also referred to as “deep:” And He rebuked the Red Sea, and it was dried up, and He led them through the depths, as a wilderness; He led them through the deep as a horse in the wilderness. And the element air is here called “spirit.” Now it is already known that the four elements fill up the whole space with matter. That which stands still is the sphere of earth. The waters surround the earth, the air encompasses the waters, and the fire envelopes the air. Scripture thus states that the earth took on form, and the fire above enveloped the intermingled waters and dust, and the wind blew and rose in the darkness and hovered over the waters.", "translator": "Charles B. Chavel, 1971–76", "orig": "וְהָאֵשׁ נִקְרֵאת \"חֹשֶׁךְ\", מִפְּנֵי שֶׁהָאֵשׁ הַיְּסוֹדִית חֲשׁוּכָה; וְאִלּוּ הָיְתָה אֲדֻמָּה, הָיְתָה מַאֲדִימָה לָנוּ הַלַּיְלָה. וְהַמַּיִם שֶׁנִּגְבַּל בָּהֶם הֶעָפָר יִקָּרֵא \"תְּהוֹם\", וְלָכֵן יִקָּרְאוּ מֵי הַיָּם \"תְּהֹמוֹת\", כְּדִכְתִיב (שמות טו ה): \"תְּהֹמֹת יְכַסְיֻמוּ\"; \"קָפְאוּ תְּהֹמֹת\" (שם ח); \"תְּהוֹם יְסֹבְבֵנִי\" (יונה ב ו). וְיִקָּרֵא קַרְקַע הַיָּם \"תְּהוֹם\": \"וַיִּגְעַר בְּיַם סוּף וַיֶּחֱרָב וַיּוֹלִיכֵם בַּתְּהֹמוֹת כַּמִּדְבָּר\" (תהלים קו ט); \"מוֹלִיכָם בַּתְּהֹמוֹת כַּסּוּס בַּמִּדְבָּר\" (ישעיהו סג יג). וְהָאֲוִיר יִקָּרֵא \"רוּחַ\". וּכְבָר נוֹדַע כִּי הַיְּסוֹדוֹת הָאַרְבָּעָה – מִקְשָׁה אַחַת, וְהָעַמּוּד שֶׁלָּהּ הוּא עִגּוּל הָאָרֶץ. וְהַמַּיִם מַקִּיפִין עַל הָאָרֶץ, וְהָאֲוִיר מַקִּיף עַל הַמַּיִם, וְהָאֵשׁ מַקִּיף עַל הָאֲוִיר. וְאָמַר הַכָּתוּב כִּי הָאָרֶץ לָבְשָׁה צוּרָה, וְהָיָה הָאֵשׁ מַקִּיף לְמַעְלָה עַל הַמַּיִם וְהֶעָפָר הַמְעֹרָבִים, וְהָרוּחַ מְנַשֶּׁבֶת וְתִכָּנֵס בַּחֹשֶׁךְ וּתְרַחֵף עַל הַמַּיִם.", "olang": "he", "source": "Ramban on Gen 1:1–2, s.v. בראשית (the four elements under the words of v. 2)", "notes": "The flattest possible answer to 'is darkness a creature': it is one of the four elements, and it is fire. Ramban reads the whole of v. 2 as an inventory of the elements under other names — darkness is elemental fire, which is dark, 'and were it red, it would redden the night for us'; the deep is water; the spirit is air; the earth is dust — and then arranges them in their spheres, fire enveloping air, air the water, water the earth. The Latin bench has the same physics and never uses it here: Comestor knows perfectly well that shadow is cast by bodies, and even he will not say that the darkness of v. 2 is an element, because Augustine has made the privation of light the orthodox answer and an element is not a privation. Ramban is under no such constraint, and the sentence costs him nothing.", "slot": false}, {"id": "pdre-3-5", "short": "pdre-3-5", "author": "Pirkei de-Rabbi Eliezer", "tradition": "rabbinic", "date": 800, "datelabel": "750–850", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["tenebrae-creatura"], "senses": ["literal"], "lemma": {"he": "אוֹר וְחשֶׁךְ", "en": "light and darkness"}, "en": "Eight things were created on the first day, namely, Heaven, Earth, Light, Darkness, Tohu (Chaos), Bohu (Void), Wind (or Spirit), and Water, as it is said, \"And the wind of God was moving upon the face of the waters\" (Gen. 1:2). Some (wise men) say that day and night also, as it is said, And there was evening and morning, one day (Gen. 1:5). Eight things were created on the second day, namely, the Well, the Manna, the Rod, the Rainbow, the art of writing, the written characters, the Garments, and the destroying spirits. Ten things arose in the thought (of the Creator), namely, Jerusalem,\" the spirits of the patriarchs, the paths of the righteous, Hell (Gehenom), the waters of the flood, the second tables, the shabbat, the temple and the light of the world to come.", "translator": "Gerald Friedlander, 1916", "orig": "שְׁמוֹנָה דְבָרִים נִבְרְאוּ בַּיּוֹם רִאשׁוֹן, וְאֵלּוּ הֵן: שָׁמַיִם וָאָרֶץ, וְאוֹר, וְחֹשֶׁךְ, וְתֹהוּ וָבֹהוּ, וְרוּחַ וּמַיִם, שֶׁנֶּאֱמַר ״וְרוּחַ אֱלֹהִים מְרַחֶפֶת עַל פְּנֵי הַמָּיִם״. וְיֵשׁ אוֹמְרִים אַף יוֹם וָלַיְלָה, שֶׁנֶּאֱמַר ״וַיְהִי עֶרֶב וַיְהִי בֹקֶר יוֹם אֶחָד״. וּשְׁמוֹנָה בַּיּוֹם הַשֵּׁנִי, וְאֵלּוּ הֵן: הַבְּאֵר וְהַמָּן וְהַמַּטֶּה וְהַקֶּשֶׁת וְהַכְּתָב וְהַמִּכְתָּב וְהַכְּתֹנֶת וְהַמַּזִּיקִין. וַעֲשָׂרָה דְבָרִים עָלוּ בַמַּחֲשָׁבָה: יְרוּשָׁלַיִם וְרוּחוֹת אָבוֹת וְאָרְחוֹת הַצַּדִּיקִים וְגֵיהִנֹּם וּמֵי הַמַּבּוּל וְלוּחוֹת הַשְּׁנִיִּים, וְהַשַּׁבָּת וְהַמִּקְדָּשׁ וְהָאָרוֹן וְאוֹר לָעוֹלָם הַבָּא.", "olang": "he", "source": "Pirkei de-Rabbi Eliezer 3", "notes": "An inventory, and the darkness is on it. Eight things were created on the first day: heaven, earth, light, darkness, tohu, bohu, wind and water. There is no argument, no proof text for the darkness in particular, and no sense that anything needs defending — the list simply has light and darkness next to each other as two of the eight. Set beside Alcuin's answer to the same question, 'which creatures were made out of nothing? — heaven, earth, angels, light, air, water and the soul of man', the two lists are the same kind of thing with the contested items swapped: Alcuin has the angels and the soul and no darkness, Pirkei de-Rabbi Eliezer has the darkness and the tohu and no angels. Neither list argues; each is the settled answer of a bench.", "slot": false}, {"id": "basil-hex-2-8", "short": "basil-hex-2-8", "author": "Basil of Caesarea", "tradition": "greek", "date": 380, "datelabel": "370–380", "place": "Caesarea in Cappadocia", "lat": 38.72, "lon": 35.49, "answers": ["divisio-loci"], "senses": ["literal"], "lemma": {"la": "incommixtam naturam", "en": "their nature unmingled"}, "en": "And God separated between the light and the darkness — that is, he fashioned their nature unmingled, and unlike itself by contrariety; for he both set them apart from one another by long spaces and distinguished them, as it is said: And God called the light day, and the darkness he called night.", "translator": "claude-draft", "orig": "Et separavit Deus inter lucem et tenebras, id est incommixtam naturam illarum, sibique ex contrarietate disparem fabricavit; quippe quas prolixis a se spatiis et destituit et discrevit, sicut dictum est: Et vocavit Deus lucem diem, et tenebras vocavit noctem.", "olang": "la", "source": "PL 53, col. 888A", "notes": "The Greek bench's answer, in the Latin Eustathius made of it, and it is entirely physical: the division is a fashioning of the two natures so that they cannot mix, and a placing of them at long distances from each other. What Basil will not do is make the darkness nothing. He has just said, a few columns earlier, that night is the shadowing of the air which the sun's setting produces; here the darkness is a nature with a contrary, and the separating is a work on both. Bede's 'not only by a difference of quality but of place' is this sentence in another language, and Bede did not need to be reading it to arrive there — but Angelomus, who did read something like it, attributes it to Clement.", "slot": false}, {"id": "ambrose-hex-1-9b", "short": "ambrose-hex-1-9b", "author": "Ambrose", "tradition": "latin", "date": 387, "datelabel": "c. 387", "place": "Milan", "lat": 45.46, "lon": 9.19, "answers": ["bonum-approbatio", "divisio-loci"], "senses": ["literal"], "lemma": {"la": "nihil videatur intra se habere confusum", "en": "nothing may be seen to have anything confused within it"}, "en": "And he distinguished between the light and the darkness; and God saw the light, that it was good (Gen 1:4). He spoke, and no one heard the sound of a voice; he distinguished, and no one caught the labour of the working; he saw, and no one beheld the straining of his eyes. And God saw, it says, the light, that it was good. He did not see what he did not know; nor did he approve what he had not known before, or had not seen: but it is the property of good works that they need no one else to commend them, but attest their own grace when they are seen. What is proved by the sight is more than what is praised by speech. For it uses its own testimony, not another's suffrage. And if among us judgement is issued through the eyes, by which both the grace of beauty and the measure of things is grasped at once, how much more does God see all that he approves, and approve what he sees, according to what is written: The eyes of the Lord are upon the just (Ps 34:16 [Vg 33:16])? Such is the nature of light, that its grace lies not in number, not in measure, not in weight, as other things do, but wholly in the beholding. In its own words, then, he expressed the nature of light, which pleases by being seen, since it is light itself that supplies the office of seeing. Nor was it without cause that it could find so great a herald, by whom it is rightly praised first, since it is light that made the other members of the world worthy of praise too. God therefore saw the light, and lit it with his own face, and saw that it was good. This is not a judgement on God's part, but a general one. And so the grace of light is proved not only in its splendour but in its whole usefulness. And hence the distinction is made between the light and the darkness, so that, the nature of light and of darkness being separated, nothing may be seen to have anything confused within it.", "translator": "claude-draft", "orig": "Et discrevit inter lucem et tenebras; et vidit Deus lucem quia bona est (Gen. I, 4) . Dixit et sonum vocis nullus audivit: discrevit, et operationis molimina nemo deprehendit: vidit et oculorum ejus intentionem nullus aspexit. Et vidit, inquit, Deus lucem quia bona est. Nec quod ignorabat, vidit; nec id quod nesciebat ante, aut non viderat, comprobavit: sed bonorum operum proprium est, ut externo commendatore non egeant, sed gratiam suam, cum videntur, ipsa testentur. Plus est quod probatur aspectu, quam quod sermone laudatur. Suo enim utitur testimonio, non alieno suffragio. Quod si apud nos oculis judicium emittitur, quibus simul et gratia venustatis, et rerum mensura comprehenditur: quanto magis Deus omnia quae probat, videt, et quae videt, probat, secundum quod scriptum est, quia Oculi Domini super justos (Ps. XXXIII, 16) ? Lucis natura hujusmodi est, ut non in numero, non in mensura, non in pondere, ut alia, sed omnis ejus in aspectu gratia sit. Propriis itaque sermonibus naturam lucis expressit, quae videndo complacet, quoniam ipsa videndi officium subministrat. Nec immerito tantum sibi praedicatorem potuit invenire, a quo jure prima laudatur; quoniam ipsa fecit, ut etiam caetera mundi membra digna sint laudibus. Vidit ergo Deus lucem, et vultu suo illuminavit, et vidit quia bona est. Non ex parte Dei, sed generale judicium est. Itaque non in splendore tantummodo, sed in omni utilitate gratia lucis probatur. Unde et discretio fit inter lucem et tenebras; ut separata lucis natura atque tenebrarum, nihil videatur intra se habere confusum.", "olang": "la", "source": "PL 14, col. 142C", "notes": "The one witness on either bench who takes 'and God saw that it was good' as a statement about the nature of light rather than about the nature of God's knowledge. Ambrose's problem is not how God can be said to see; he disposes of that in a clause — he did not see what he did not know. His interest is that light is the one thing whose whole grace is in the beholding, so that it is the only creature that could have been praised first, and that a good work needs no external commender but attests itself when it is seen. Only then does he reach the division, and it comes out in a single purpose clause: so that nothing may be seen to have anything confused within it. That is Rashi's plain sense at Gen 1:4 — that it was not seemly that light and darkness should function in confusion — in Milan, and neither could have known the other.", "slot": false}, {"id": "aug-gnm-1-9", "short": "aug-gnm-1-9", "author": "Augustine", "tradition": "latin", "date": 389, "datelabel": "388–390", "place": "Thagaste", "lat": 36.29, "lon": 7.95, "answers": ["tenebrae-privatio", "divisio-est-ordinatio"], "senses": ["literal"], "lemma": {"la": "tenebrae lucis absentia est", "en": "darkness is the absence of light"}, "en": "And God divided between the light and the darkness, and God called the light day, and the darkness he called night. It is not said here, God made the darkness; because the darkness, as was said above, is the absence of light: yet a distinction was made between light and darkness. Just as we make a voice by crying out, but make silence by not sounding, because the ceasing of the voice is silence — yet we distinguish by a kind of sense between voice and silence, and call the one voice and the other silence: as therefore we are rightly said to make silence, so in many places of the divine Scriptures God is rightly said to make darkness, because he either does not give light, or withdraws it, at what times and in what places he wills.", "translator": "claude-draft", "orig": "Et divisit Deus inter lucem et tenebras, et vocavit Deus diem lucem, et tenebras vocavit noctem. Hic non dictum est, Fecit Deus tenebras; quia tenebrae, sicut superius dictum est, lucis absentia est: distinctio tamen facta est inter lucem et tenebras. Quemadmodum nos clamando vocem facimus; silentium autem non sonando facimus, quia cessatio vocis silentium est: distinguimus tamen sensu quodam inter vocem et silentium, et illud vocamus vocem, illud silentium; quemadmodum ergo recte dicimur facere silentium, sic recte multis divinarum Scripturarum locis Deus dicitur facere tenebras, quia lucem quibus vult temporibus et locis vel non dat, vel detrahit.", "olang": "la", "source": "PL 34, col. 180", "notes": "The sentence that decided the question for eight hundred years, and the analogy that carried it. Scripture does not say God made the darkness, because darkness is the absence of light; but a distinction was nevertheless made — as we make a voice by crying out and make silence by not sounding, and yet distinguish the two and name them. The care of the argument is in the last clause, which concedes the whole difficulty: Scripture does in many places say that God makes darkness, and Augustine will not deny it, so he redefines the making — God makes darkness by not giving light, or by taking it away, where and when he chooses. Angelomus copies the analogy verbatim without the concession and with 'gives or withdraws' in place of 'does not give or withdraws'; Wigbod's compiler puts the opposite doctrine into Augustine's mouth on the same page.", "slot": false}, {"id": "aug-gnl-imp-5-23", "short": "aug-gnl-imp-5-23", "author": "Augustine", "tradition": "latin", "date": 393, "datelabel": "c. 393", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["tenebrae-privatio", "divisio-est-instantanea"], "senses": ["literal"], "lemma": {"la": "quae enim societas lucis cum tenebris", "en": "for what fellowship has light with darkness?"}, "en": "And God divided between the light and the darkness. From this it may be understood with how great an ease of divine working these things are said to have been effected. For there is no one who so supposes the light to have been made that it was confused with the darkness, and for that reason needed a separation afterwards; but by the very fact that the light was made, the division between light and darkness also followed. For what fellowship has light with darkness (2 Cor 6:14)? God therefore divided between light and darkness, because he made the light, whose absence is called darkness. And there is a difference between light and darkness such as there is between a garment and nakedness, or the full and the empty, and the like.", "translator": "claude-draft", "orig": "Et divisit Deus inter lucem et tenebras. Hinc intelligi licet quanta divini operis facilitate ista dicantur effecta. Non enim quisquam est qui sic existimet lucem factam, ut esset confusa cum tenebris, et ob hoc postea separationis indigeret; sed eo ipso quo lux facta est, consecuta est etiam divisio inter lucem et tenebras. Quae enim societas lucis cum tenebris (II Cor. VI, 14) ? Deus ergo divisit inter lucem et tenebras, quia lucem fecit, cujus absentia tenebrae vocantur. Interest autem inter lucem et tenebras, sicut interest inter vestimentum et nuditatem, aut plenum et inane, et similia.", "olang": "la", "source": "PL 34, col. 228", "notes": "The objection Augustine is answering is never stated on the rabbinic bench and is the obvious one: if God had to divide them, they must first have been mixed. His answer is that no separate act is needed — the division followed on the making, because the making of light is the not-being of darkness, as putting on a garment is the ending of nakedness and filling a vessel the ending of its emptiness. Hugh of St Victor takes over the instantaneity and applies it to the angels; and the same instinct, that the two were never confused and needed no unmixing, is what Ambrose gets from the other end when he says the division exists so that nothing should have anything confused within it.", "slot": false}, {"id": "aug-gnl-imp-5-25", "short": "aug-gnl-imp-5-25", "author": "Augustine", "tradition": "latin", "date": 393, "datelabel": "c. 393", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["tenebrae-privatio", "divisio-est-ordinatio", "tenebrae-peccatores"], "senses": ["literal", "allegorical"], "lemma": {"la": "quaedam et facit Deus, et ordinat; quaedam vero tantum ordinat", "en": "some things God both makes and orders; some he only orders"}, "en": "Whether, then, this sentence would have us understand the ethereal light, or the sensitive light in which animals share, or the rational light which angels and men have, to have been made by God first in the nature of things — that God divided between light and darkness, by the very fact that light was made, must be taken to mean that light is one thing and those privations of light another, which God set in order under the name of their contrary, darkness. For it is not said that God made the darkness: since God made the forms themselves, not the privations, which belong to nothing, whence all things were made by God the craftsman; yet we understand that they were set in order by him, when it is said, And God divided between light and darkness — lest even those privations should not have their own order, God ruling and administering all things. As in singing, the interpositions of silences at fixed and measured intervals, although they are privations of sound, are nevertheless well ordered by those who know how to sing, and contribute something to the sweetness of the whole song. And the shadows in paintings set off whatever is more prominent, and please not by their form but by their order. For God is not the author of our vices either; yet he is their orderer, when he sets sinners in that place and compels them to suffer what they deserve. To this belongs it that the sheep are set on the right hand and the goats on the left (Matt 25:33). Some things, then, God both makes and orders; some he only orders. The just he both makes and orders; sinners, in so far as they are sinners, he does not make but only orders. Since when he sets these on the right and those on the left, and bids them go into eternal fire, it belongs to the order of their deserts. So he both makes and orders the forms and natures themselves; but the privations of forms and the defects of natures he does not make, but only orders. And so he said, Let there be light; and light was made. He did not say, Let there be darkness; and darkness was made. Of these, then, he made one and did not make the other, yet ordered both, when God divided between light and darkness. And so, by his making, the several things are beautiful; and by his ordering, all things are beautiful.", "translator": "claude-draft", "orig": "Sive ergo lucem aetheream, sive sensualem cujus animalia participant, sive rationalem quam Angeli et homines habent, a Deo factam primitus in rerum natura haec sententia vult intelligi; divisisse Deum inter lucem et tenebras, eo ipso quo lux facta est, oportet accipi, quod aliud est lux, aliud illae privationes lucis, quas in contrariis tenebris ordinavit Deus. Non enim Deum fecisse tenebras dictum est: quoniam species ipsas Deus fecit, non privationes quae ad nihilum pertinent, unde ab artifice Deo facta sunt omnia; quas tamen ab eo ordinatas intelligimus, cum dicitur, Et divisit Deus inter lucem et tenebras, ne vel ipsae privationes non haberent ordinem suum, Deo cuncta regente atque administrante. Sicut in cantando interpositiones silentiorum certis moderatisque intervallis, quamvis vocum privationes sint, bene tamen ordinantur ab iis qui cantare sciunt, et suavitati universae cantilenae aliquid conferunt. Et umbrae in picturis eminentiora quaeque distinguunt, ac non specie, sed ordine placent. Nam et vitiorum nostrorum non est auctor Deus; sed tamen ordinator est, cum eo loco peccatores constituit, et ea perpeti cogit quae merentur. Ad hoc valet quod oves ponuntur ad dexteram, haedi autem ad sinistram (Matth. XXV, 33) . Quaedam ergo et facit Deus, et ordinat; quaedam vero tantum ordinat. Justos et facit, et ordinat; peccatores autem in quantum peccatores sunt, non facit, sed ordinat tantum. Quippe cum illos ad dexteram, illos ad sinistram constituit, et quod in ignem aeternum jubet ire, ad meritorum ordinem valet. Ita species naturasque ipsas et facit, et ordinat; privationes autem specierum defectusque naturarum non facit, sed ordinat tantum. Dixit itaque, Fiat lux; et facta est lux. Non dixit, Fiant tenebrae; et factae sunt tenebrae. Horum ergo unum fecit, alterum non fecit, utrumque tamen ordinavit, cum divisit Deus inter lucem et tenebras. Ita et ipso faciente pulchra sunt singula, et ipso ordinante pulchra sunt omnia.", "olang": "la", "source": "PL 34, col. 229", "notes": "The best thing said on this crux in Latin, and the one place where Augustine's privation doctrine stops being a piece of metaphysics and becomes an aesthetic. God did not make the darkness; but he ordered it, and the dividing is the ordering — 'lest even those privations should not have their own order'. Then the two analogies, which are not decoration but the argument: the rests in a song, which are privations of sound and are nevertheless placed at measured intervals by anyone who knows how to sing and add to the sweetness of the whole; and the shadows in a painting, which set off what is prominent and 'please not by their form but by their order'. And then the step that makes the reading moral without making the darkness a substance: God is not the author of our vices, but he is their orderer, when he puts sinners in the place they deserve — sheep on the right and goats on the left. The rabbinic bench's moral reading of this verse (R. Yanai, R. Abahu) reaches the same pairing of righteous and wicked at the same clause and never has to make the darkness nothing to do it, because it never took up the question of whether darkness is a thing.", "slot": false}, {"id": "aug-civ-11-19", "short": "aug-civ-11-19", "author": "Augustine", "tradition": "latin", "date": 417, "datelabel": "413–427", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["tenebrae-angeli", "divisio-est-judicium"], "senses": ["allegorical"], "lemma": {"la": "inter sanctos Angelos et immundos fuisse discretum", "en": "that a distinction was made between the holy angels and the unclean"}, "en": "Although, then, the obscurity of the divine speech is useful even for this, that it brings forth many opinions of the truth and produces them into the light of knowledge, while one man understands it this way and another that — provided always that what is understood in an obscure place is confirmed either by the attestation of manifest things, or by other passages not at all doubtful; and provided that, when many things are handled, one arrives also at what the writer meant, or, if that lies hidden, that on occasion of handling a deep obscurity some other true things are said: it does not seem to me an opinion at odds with the works of God, if, when that first light was made, the angels are understood to have been created, and a distinction to have been made between the holy angels and the unclean, where it is said, And God divided between the light and the darkness; and God called the light day, and the darkness he called night. For he alone could distinguish these, who could also foreknow, before they fell, that they would fall, and that, deprived of the light of truth, they would remain in darksome pride. For between this day and night best known to us — that is, between this light and these darknesses — he commanded the luminaries of heaven most familiar to our senses to divide: Let there be, he said, luminaries in the firmament of heaven, that they may shine upon the earth, and divide between the day and the night. And a little after: And God made, he says, two great luminaries; the greater luminary for the beginning of the day, and the lesser luminary for the beginning of the night; and the stars: and God set them in the firmament of heaven, to shine upon the earth, and to preside over the day and the night, and to divide between the light and the darkness (Gen 1:4, 5, 14, 16–18). But between that light, which is the holy fellowship of the angels shining intelligibly with the illumination of truth, and the darkness contrary to it — that is, the most foul minds of the evil angels turned away from the light of justice — he alone could divide, to whom even a future evil, not of nature but of will, could not be hidden or uncertain.", "translator": "claude-draft", "orig": "Quamvis itaque divini sermonis obscuritas etiam ad hoc sit utilis, quod plures sententias veritatis parit et in lucem notitiae producit, dum alius eum sic, alius sic intelligit; ita tamen ut quod in obscuro loco intelligitur, vel attestatione rerum manifestarum, vel aliis locis minime dubiis asseratur; sive cum multa tractantur, ad id quoque perveniatur, quod sensit ille qui scripsit; sive id quidem lateat, sed ex occasione tractandae profundae obscuritatis alia quaedam vera dicantur: non mihi videtur ab operibus Dei absurda sententia, si cum lux illa prima facta est, Angeli creati intelliguntur, et inter sanctos Angelos et immundos fuisse discretum, ubi dictum est, Et divisit Deus inter lucem et tenebras; et vocavit Deus lucem diem, et tenebras vocavit noctem. Solus quippe ille ista discernere potuit, qui potuit etiam priusquam caderent praescire casuros, et lumine privatos veritatis in tenebrosa superbia remansuros. Nam inter istum nobis notissimum diem et noctem, id est inter hanc lucem et has tenebras, vulgatissima sensibus nostris luminaria coeli ut dividerent, imperavit: Fiant, inquit, luminaria in firmamento coeli, ut luceant super terram, et dividant inter diem et noctem. Et Paulo post: Et fecit, inquit, Deus duo luminaria magna; luminare majus in principia diei, et luminare minus in principia noctis; et stellas: et posuit illa Deus in firmamento coeli, lucere super terram, et praeesse diei et nocti, et dividere inter lucem et tenebras (Gen. I, 4, 5, 14, 16-18) . Inter illam vero lucem, quae sancta societas Angelorum est illustratione veritatis intelligibiliter fulgens, et ei contrarias tenebras, id est malorum angelorum aversorum a luce justitiae teterrimas mentes, ipse dividere potuit, cui etiam futurum, non naturae, sed voluntatis malum, occultum aut incertum esse non potuit.", "olang": "la", "source": "PL 41, col. 332", "notes": "Augustine's angelic reading, and it is offered with more hedging than anything else he says about this verse: the obscurity of Scripture is useful because it breeds many true readings, and 'it does not seem to me an opinion at odds with the works of God' if the light is the angels and the division is between the holy and the unclean. The argument for it is a philological one — the luminaries of the fourth day are commanded to divide light from darkness in the ordinary sense, so the division of the first day must be another division — and it depends on nobody but God being able to make it, since it separates by foreknowledge of a fall that has not happened. This is the reading Wigbod, Angelomus, Hugh, Rupert and Comestor all take up, and none of them keeps the hedge.", "slot": false}, {"id": "aug-civ-11-20", "short": "aug-civ-11-20", "author": "Augustine", "tradition": "latin", "date": 417, "datelabel": "413–427", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["bonum-withheld", "tenebrae-angeli"], "senses": ["allegorical"], "lemma": {"la": "ne utrumque appellaretur bonum", "en": "lest both should be called good"}, "en": "And this too is not to be passed over in silence, that where God said, Let there be light, and light was made, there was at once added, And God saw the light, that it was good — not after he had separated between the light and the darkness, and called the light day and the darkness night, lest he should seem to have borne the testimony of his approval to such darkness along with the light. For where the darkness is blameless, between which and this light visible to our eyes the luminaries of heaven divide, it is put not before but after: And God saw that it was good. And he set them, it says, in the firmament of heaven, to shine upon the earth, and to preside over the day and the night, and to separate between the light and the darkness. And God saw that it was good. For both pleased him, because both are without sin. But where God said, Let there be light, and light was made, and God saw the light, that it was good; and afterwards it is added, And God separated between the light and the darkness; and God called the light day, and the darkness he called night (Gen 1:3–5, 17, 18) — in this place it is not added, And God saw that it was good; lest both should be called good, when one of them was evil, by its own vice and not by nature. And therefore the light alone pleased the Creator there: but the angelic darkness, though it had to be ordered, did not have to be approved.", "translator": "claude-draft", "orig": "Denique nec illud est praetereundum silentio, quod ubi dixit Deus, Fiat lux, et facta est lux; continuo subjunctum est, Et vidit Deus lucem quia bona est: non posteaquam separavit inter lucem et tenebras; et vocavit lucem diem, et tenebras noctem, ne simul cum luce etiam talibus tenebris testimonium placiti sui perhibuisse videretur. Nam ubi tenebrae inculpabiles sunt, inter quas et lucem istam his oculis conspicuam luminaria coeli dividunt, non ante, sed post infertur, Et vidit Deus quia bonum est. Et posuit illa, inquit, in firmamento coeli, lucere super terram, et praeesse diei et nocti, et separare inter lucem et tenebras. Et vidit Deus quia bonum est. Utrumque enim placuit, quia utrumque sine peccato est. Ubi autem dixit Deus, Fiat lux, et facta est lux. Et vidit Deus lucem, quia bona est; et postmodum infertur, Et separavit Deus inter lucem et tenebras; vocavitque Deus lucem diem, et tenebras vocavit noctem (Gen. I, 3-5, 17, 18) : non hoc loco additum est, Et vidit Deus quia bonum est; ne utrumque appellaretur bonum, cum esset horum alterum malum, vitio proprio, non natura. Et ideo sola ibi lux placuit Conditori: tenebrae autem angelicae, etsi fuerant ordinandae, non tamen fuerant approbandae.", "olang": "la", "source": "PL 41, col. 333", "notes": "The star witness of this crux, and the argument is made entirely out of where a clause stands. On the first day the approval comes immediately after the making and before the division; on the fourth day, where the darkness is blameless, it comes after the division. So the placing is deliberate: on day one God does not say 'it was good' after separating light from darkness, lest he seem to approve such darkness along with the light. The reason is given in five words — 'lest both should be called good, when one of them was evil' — and the last sentence keeps the distinction the whole Augustinian doctrine rests on: the angelic darkness had to be ordered, but did not have to be approved. Bereshit Rabbah 3:6 reads the same silence out of the next verse by exactly the same method — 'and to the darkness God called night' is not written here, but 'and to the darkness he called night' — and R. Abahu at 2:5 argues the identical point from the identical omission at the identical clause.", "slot": false}, {"id": "isidore-quaest-1-4", "short": "isidore-quaest-1-4", "author": "Isidore of Seville", "tradition": "latin", "date": 630, "datelabel": "c. 630", "place": "Seville", "lat": 37.39, "lon": -5.99, "answers": ["tenebrae-peccatores", "divisio-est-judicium"], "senses": ["allegorical"], "lemma": {"la": "divisit justos a peccatoribus, tanquam a tenebris", "en": "he divided the just from sinners, as from darkness"}, "en": "And he divided the light from the darkness; for then God, according to the favour of his foreknowledge, divided the just — that is, the sons of God and of light — from sinners, as from darkness; calling the just day, and those others night. For that in the Church the just are called by the name of light, hear the Apostle: You were once, he says, darkness, but now light in the Lord (Eph 5:8).", "translator": "claude-draft", "orig": "Et divisit lucem a tenebris; nam tunc Deus juxta praescientiae suae gratiam divisit justos, id est, filios Dei et lucis, a peccatoribus, tanquam a tenebris; justos vocans diem, et illos noctem; nam quod in Ecclesia lucis nomine justi appellentur, audi Apostolum: Fuistis, inquit, aliquando tenebrae, nunc autem lux in Domino (Ephes. V, 8) .", "olang": "la", "source": "PL 83, col. 210A", "notes": "Isidore takes the verse straight into the Church, and the sequence he is running is a reading of the six days as the six ages of the Christian life, so that the division of light from darkness is the first thing that happens to a believer and the firmament on the second day is the solidity of Scripture. What matters for this crux is that the division is God's foreknowledge sorting the just from sinners: the same act Augustine locates among the angels, moved down to human beings, with Eph 5:8 doing for Isidore what Ps 75 does for Rupert. The rabbinic bench reaches the identical pairing at the identical clause, and reaches it by reading the darkness as the deeds of the wicked rather than the wicked themselves — a difference that runs through every allegory on both benches and is never once discussed.", "slot": false}, {"id": "bede-gen-1-4", "short": "bede-gen-1-4", "author": "Bede", "tradition": "latin", "date": 720, "datelabel": "703–725", "place": "Jarrow", "lat": 54.98, "lon": -1.49, "answers": ["divisio-loci"], "senses": ["literal"], "lemma": {"la": "non solum qualitatis, sed et locorum distantia", "en": "not only by a difference of quality, but of places"}, "en": "And he divided the light and the darkness. For he divided them not only by a difference of quality, but of places: namely by spreading the light over the upper part of the world, in which the human way of life was to be, and by allowing the lower parts of it to remain in their ancient darkness.", "translator": "claude-draft", "orig": "Et divisit lucem ac teneoras. Divisit namque eas non solum qualitatis, sed et locorum distantia, lucem videlicet in superiore orbis parte diffundendo, in qua humana erat conversatio futura, inferiora vero ejus priscis in tenebris remanere sinendo.", "olang": "la", "source": "PL 91, col. 17C", "notes": "Two clauses, and they set the Latin bench's literal answer for the next five hundred years: the division is by quality and by place, the light spread over the upper part of the world where men were going to live and the lower part left in the darkness it already had. Bede does not argue with Augustine; he simply does not raise the question whether darkness is a thing, and answers a question about where. The sentence is copied verbatim by Rabanus, taken over by Angelomus with an attribution to Clement, and reappears in Comestor as 'he divided the created things by distance of places and by quality'. It is also, without any contact, the same answer as Basil's long distances and the same answer as R. Yoḥanan and Resh Lakish's two generals, each given his bound.", "slot": false}, {"id": "wigbod-gen-1-4", "short": "wigbod-gen-1-4", "author": "Wigbod", "tradition": "latin", "date": 790, "datelabel": "c. 790", "place": "Tours", "lat": 47.39, "lon": 0.69, "answers": ["tenebrae-creatura", "bonum-withheld", "formatum-ab-informi"], "senses": ["literal", "allegorical"], "lemma": {"la": "sicut est essentia lucis, ita essentia tenebrarum", "en": "as there is an essence of light, so an essence of darkness"}, "en": "AUGUSTINE. D[isciple]. And he divided the light from the darkness. Scripture says he divided the light from the darkness: for everything that is divided can also be. As therefore there is an essence of light, so there is an essence of darkness. And why does Scripture not say, God saw the darkness, that it was good, as was said of the light? M[aster]. God with a good and unchangeable will created all the angels good, but because he foreknew that some of them would fall through pride, by the unchangeableness of his foreknowledge he divided between the good and the evil. Calling the evil darkness, then, and the good light, he says of these that they are good, and of those he says it not at all, lest he should seem to approve the sins which were the darkness. ELSEWHERE AGAIN. D. He divided the light from the darkness. What is it to divide the light from the darkness? M. It is the distinction of the formed thing from the unformed.", "translator": "claude-draft", "orig": "AUGUSTINUS. D. Et divisit lucem a tenebris (Ibid.) . Divisit, inquit scriptura, lucem a tenebris: omne enim quod dividitur, et esse potest. Sicut ergo est essentia lucis, ita essentia tenebrarum. Et cur non dicit Scriptura, vidit Deus tenebras quod essent bonae, sicut de luce dictum est? M. Deus bona et incommutabili voluntate creavit omnes angelos bonos, sed quia ex his quosdam per superbiam praesciebat casuros, per incommutabilitatem praescientiae suae divisit inter bonos et malos. Malos igitur appellans tenebras, bonos appellans lucem, in his dicens quia boni sunt, in illis nullatenus dicens, ne peccata quae erant tenebrae adprobare videretur. ITEM ALIBI. D. Divisit lucem a tenebris. Quid est lucem a tenebris dividere? M. Id est, distinctio rei formatae ab informi.", "olang": "la", "source": "PL 96, col. 1120A", "notes": "A Carolingian compilation putting under the rubric AUGUSTINUS the one proposition Augustine spent three works denying. The pupil's inference is a good one and it is not Augustine's: everything that is divided can also be, therefore as there is an essence of light so there is an essence of darkness. The pupil then asks the right question — why does Scripture not say God saw the darkness that it was good? — and the master's answer is Augustine's own from City of God XI.20, almost word for word, down to 'lest he should seem to approve'. So the transmission carries the answer and loses the doctrine it was an answer to: within two sentences the darkness has an essence and is being withheld from approval because it is sin. The third exchange then gives a third answer, the distinction of the formed from the unformed, which is Honorius' and Abelard's and belongs to a different question again.", "slot": false}, {"id": "rabanus-gen-1-4", "short": "rabanus-gen-1-4", "author": "Rabanus Maurus", "tradition": "latin", "date": 825, "datelabel": "820–830", "place": "Fulda", "lat": 50.55, "lon": 9.68, "answers": ["divisio-loci"], "senses": ["literal"], "lemma": {"la": "non solum qualitatis, sed et locorum distantia", "en": "not only by a difference of quality, but of places"}, "en": "And he divided the light and the darkness. For he divided them not only by a difference of quality, but of places: namely by spreading the light over the upper part of the world, in which the human way of life was to be, and by allowing the lower parts of it to remain in their ancient darkness.", "translator": "claude-draft", "orig": "Et divisit lucem ac tenebras. Divisit namque eas, non solum qualitatis, sed et locorum distantia: lucem videlicet in superiore orbis parte diffundendo, in qua humana erat conversatio futura; inferiora vero ejus priscis in tenebris remanere sinendo.", "olang": "la", "source": "PL 107, col. 448C", "notes": "Bede's two clauses reproduced without a word changed and without a name — the commonest event on the Carolingian bench and worth one card, because it is what makes the difference of quality and of place the standing Latin answer rather than one Northumbrian's opinion. Rabanus is compiling a commentary for the schools out of the fathers, and Bede is by now among the fathers.", "slot": false}, {"id": "angelom-gen-1-4", "short": "angelom-gen-1-4", "author": "Angelomus of Luxeuil", "tradition": "latin", "date": 850, "datelabel": "c. 850", "place": "Luxeuil", "lat": 47.82, "lon": 6.38, "answers": ["tenebrae-privatio", "divisio-loci", "tenebrae-angeli"], "senses": ["literal", "allegorical"], "lemma": {"la": "distinctio facta est inter lucem et tenebras, non tenebrae factae", "en": "a distinction was made between light and darkness, not darkness made"}, "en": "But when he says, and he divided the light from the darkness, he shows that a distinction was made between light and darkness, not that darkness was made; as we say we make a voice by crying out, and silence by not crying out, because the ceasing of the voice is silence. Yet we distinguish between them by a kind of sense, and call the one voice and the other silence. As therefore we rightly say that we make silence, so God is rightly said to make darkness; because he either gives or withdraws light, at what times and places he wills. Because, as Clement says: Lighting up one part of the world, he left the other dark — namely by spreading the light over the upper part of the world, in which the human way of life was to be, and the lower parts of it remaining in their ancient darkness. If anyone chooses to take it so, we, as we began, have striven to follow blessed Augustine and the exposition of the master. And God divided the light and the darkness, and the rest. That is, the heavenly citizens of the angels from the unclean spirits, when Lucifer, turning away from the Creator and turning to himself, reckoning that he sufficed to himself, swollen with pride, was cast out from the heavenly places with his followers, without the help of his maker, and the rest remained in their stability — calling these day and those night, according to what follows: and he called the light day, and the darkness night. For the ruin of those who fell became the eternal stability of those who remained.", "translator": "claude-draft", "orig": "Caeterum dum dicit, divisitque lucem a tenebris, ostendit quia distinctio facta est inter lucem et tenebras, non tenebrae factae; quemadmodum clamando vocem, silentium autem non clamando dicimus, quia cessatio vocis silentium est. Distinguimus tamen sensu quodam inter ea, et illud vocamus vocem, istud silentium. Quemadmodum ergo recte dicimus facere silentium, sic recte Deus dicitur facere tenebras; quia lucem, quibus vult, temporibus et locis vel dat, vel detrahit. Quia, ut Clemens ait: Unam [ Z., imam], inquit, mundi partem illustrans aliam reliquit obscuram. Lucem videlicet in superiore orbis parte diffundendo, in qua humana erat conversatio futura, inferiora vero ejus priscis in tenebris remanendo. Si cui hoc accipere placuerit, nos, ut coepimus, B. Augustini [Suppl. ex Z., dicta] sequi, et expositionem magistri nisi sumus. Et divisit Deus lucem ac tenebras [ Z., a tenebris ], et reliqua. Id est, coelestes angelorum cives ab inmundis spiritibus, quando Lucifer avertendo a Creatore, et convertendo ad se, aestimans sibi sufficere, superbia tumidus, sine auxilio sui conditoris, ejectus est cum suis sequacibus a coelestibus, et caeteri in sua stabilitate permanserunt, hos nuncupans diem, illos noctem, juxta quod sequitur, appellavitque lucem diem, et tenebras noctem. Quia ruina ruentium aeterna facta est stabilitas permanentium", "olang": "la", "source": "PL 115, col. 117C", "notes": "Three answers laid end to end with a hinge sentence between them, and the hinge is the most honest thing in the Carolingian bench: 'if anyone chooses to take it so, we, as we began, have striven to follow blessed Augustine.' First Augustine's privation with the silence analogy, copied close enough to be recognised and altered in one word — Augustine wrote that God either does not give light or withdraws it, Angelomus writes that he gives or withdraws it, which quietly makes the darkness something conferred. Then Bede's upper and lower parts of the world, attributed to Clement. Then the angelic reading, with Lucifer named and the fall narrated, and a sentence that is not in Augustine at all: the ruin of those who fell became the eternal stability of those who remained. A compiler who cannot choose is not thereby a bad witness; the three answers are the three the twelfth century will still be sorting.", "slot": false}, {"id": "remigius-gen-1-4", "short": "remigius-gen-1-4", "author": "Remigius of Auxerre", "tradition": "latin", "date": 890, "datelabel": "c. 890", "place": "Auxerre", "lat": 47.8, "lon": 3.57, "answers": ["tenebrae-creatura", "night-for-rest"], "senses": ["literal"], "lemma": {"la": "utrumque autem fecit Deus et lucem et tenebras", "en": "but God made both, the light and the darkness"}, "en": "And he divided the light from the darkness. Darkness (tenebrae) is so called from holding (tenendo), because it holds the eyes so that they may not see. But God made both, the light and the darkness — namely, that men might work in the light and rest in the night. Therefore the darkness too is a work of God. Whence in the hymn of the three young men, in which every creature is invited to bless God, the darkness also is set down along with the light.", "translator": "claude-draft", "orig": "Et divisit lucem a tenebris. Tenebrae a tenendo dictae sunt, quia tenent oculos ne videant. Utrumque autem fecit Deus et lucem et tenebras, scilicet ut in luce operarentur homines, et in nocte requiescerent. Ergo et tenebrae opus Dei sunt. Unde in hymno trium puerorum in quo omnis creatura ad benedicendum Deum invitatur, etiam tenebrae cum luce ponuntur.", "olang": "la", "source": "PL 131, col. 55C", "notes": "The flat contradiction of Augustine, stated in four sentences and with a proof text, in a school commentary written for teaching. God made both, and the reason is a reason from use: that men should work in the light and rest at night. Then the sentence Augustine's whole argument exists to prevent — therefore the darkness too is a work of God — and then the evidence, which is liturgical rather than philosophical: in the Benedicite, where every creature is called to bless the Lord, light and darkness are called together (Dan 3:72). It is a good argument. If the darkness is a privation it cannot be summoned to praise, and the canticle summons it. Remigius does not mention Augustine, and the Glossa will print this gloss over the name of Strabo on the same page as glosses that assume the opposite.", "slot": false}, {"id": "remigius-gen-1-4b", "short": "remigius-gen-1-4b", "author": "Remigius of Auxerre", "tradition": "latin", "date": 890, "datelabel": "c. 890", "place": "Auxerre", "lat": 47.8, "lon": 3.57, "answers": ["tenebrae-peccatores", "divisio-est-judicium"], "senses": ["allegorical"], "lemma": {"la": "filii Seth separati sunt ab impia generatione Cain", "en": "the sons of Seth were separated from the impious generation of Cain"}, "en": "He divided the light from the darkness on this day: because in this age the sons of God, that is, the sons of Seth, were separated from the impious generation of Cain, whose evening was the multiplied iniquity of men, that God might bring on the flood.", "translator": "claude-draft", "orig": "Divisit lucem a tenebris in hac die: quia hac aetate filii Dei, id est, filii Seth separati sunt ab impia generatione Cain, cujus vespera fuit multiplicata iniquitas hominum ideo ut induceret Deus diluvium.", "olang": "la", "source": "PL 131, col. 58C", "notes": "The same commentator, the same verse, and a wholly different reading a few columns later, because Remigius runs the six days a second time as the six ages of the world. On the second pass the division of light from darkness is a datable event in Genesis: the separation of the sons of Seth from the line of Cain, with the multiplied iniquity of men as its evening and the flood following. It is the most concrete form the moral reading takes anywhere on the Latin bench — not the just in general, but two named genealogies — and it is exactly the move Bereshit Rabbah does not make, since for R. Yanai and R. Abahu the light and the darkness are deeds and not families.", "slot": false}, {"id": "alcuin-int-35", "short": "alcuin-int-35", "author": "Alcuin", "tradition": "latin", "date": 800, "datelabel": "c. 800", "place": "Tours", "lat": 47.39, "lon": 0.69, "answers": ["bonum-approbatio"], "senses": ["literal"], "lemma": {"la": "in ea bonitate placuit ut maneret, in qua placuit ut fieret", "en": "it pleased him to remain in that goodness in which it pleased him to be made"}, "en": "Question 35. What is: God saw that it was good? — Answer. That is: what he made pleased him to remain in that goodness in which it pleased him to be made.", "translator": "claude-draft", "orig": "Inter. 35. Quid est: Vidit Deus, quod esset bonum?--Resp. Id est, in ea bonitate placuit ut maneret, in qua placuit ut fieret, quod fecit.", "olang": "la", "source": "PL 100, col. 520B", "notes": "One sentence, and it removes the difficulty the whole Latin bench is worrying at. If 'God saw that it was good' were an inspection, God would be learning something; Alcuin makes it a persistence of the same pleasure — what pleased him to be made pleased him to remain. Augustine puts the same thing at City of God XI.21 with more machinery ('he teaches that it is good, he does not learn it') and Comestor will divide the moment in two, pleasing in foreknowledge that it should be made and pleasing in being that it should stay. The Carolingian schoolbook has it in twenty words and does not notice that it is an answer to anything.", "slot": false}, {"id": "glossa-1-4", "short": "glossa-1-4", "author": "Glossa ordinaria (school of Laon)", "tradition": "latin", "date": 1120, "datelabel": "compilation 1110–1130", "place": "Laon", "lat": 49.56, "lon": 3.62, "answers": ["tenebrae-creatura", "tenebrae-peccatores"], "senses": ["literal", "allegorical"], "lemma": {"la": "Lucem et tenebras fecit Deus", "en": "God made both the light and the darkness"}, "en": "VERSE 4. 'And God saw the light,' etc. (STRABO.) God made both the light and the darkness, whence Daniel 3: 'Bless the Lord, light and darkness,' since every creature is invited to bless. (ISIDORE, on Genesis, ch. 2.) Everyone has in his works and upright life six distinct days, after which he may hope for rest: on the first day, the light of faith, since he first believes in things invisible, for which faith the Lord deigned to appear.", "translator": "claude-draft", "orig": "VERS. 4.-- « Et vidit Deus lucem, » etc. (STRAB.) Lucem et tenebras fecit Deus, unde Dan. III. « Benedicite, lux et tenebrae, Domino, » cum omnis creatura ad benedicendum invitatur. (ISID., in Gen., c. 2.) Habet quisque in operibus et recta vita, distinctos sex dies, post quos requiem speret: primo die, lucem fidei, quoniam primo invisibilibus credit propter quam fidem Dominus apparere dignatus est.", "olang": "la", "source": "PL 113, col. 71C", "notes": "The whole of the standard gloss on this verse is two sentences, and what they select is the answer to the crux. Of everything the Latin bench had said about Gen 1:4 — Augustine's privation, his angels, his order without making, Bede's places, Ambrose on the nature of light — the Glossa prints Remigius' 'God made both the light and the darkness' with the Benedicite behind it, and Isidore's light of faith. So the twelfth-century schoolroom's default reading of this verse is the anti-Augustinian one on the literal side and the moral one on the allegorical, and Augustine's answer, which every twelfth-century witness on this crux still argues from, has to be fetched from elsewhere. Note also that the gloss on 1:2 in the same chapter carries the opposite doctrine — 'darkness was there, namely the privation of true light' — three columns earlier.", "slot": false}, {"id": "abelard-hex-1-4", "short": "abelard-hex-1-4", "author": "Peter Abelard", "tradition": "latin", "date": 1133, "datelabel": "c. 1133", "place": "The Paraclete (Nogent-sur-Seine)", "lat": 48.49, "lon": 3.5, "answers": ["formatum-ab-informi", "divisio-est-ordinatio"], "senses": ["literal"], "lemma": {"la": "perfectum discrevit ab imperfecto et distinctum a confuso", "en": "he distinguished the perfect from the imperfect and the distinct from the confused"}, "en": "And he divided the light from the darkness. That is, by his working he distinguished the perfect from the imperfect and the distinct from the confused. Above, where he says, And God said: Let there be light, and light was made, he showed that the light was made at God's command. But here, when he says, And he divided the light from the darkness, he shows that this distinction of works also, which he calls light, was made by him; so that one and the same is understood to be both the Creator of the matter and the former of it, and the whole praise, both for the creation of the matter and for the forming of the works, is attributed to him.", "translator": "claude-draft", "orig": "Et divisit lucem a tenebris. Hoc est operatione sua perfectum discrevit ab imperfecto et distinctum a confuso. Superius autem ubi ait: Dixitque Deus: Fiat lux, et facta est lux, ad imperium quidem Dei lucem esse factam monstravit. Hic vero cum ait: Et divisit lucem a tenebris, per ipsum quoque hanc distinctionem operum, quam lucem appellat, factam esse demonstrat, ut idem ipse materiae Creator pariter et formator intelligatur, eique tota laus tam de creatione materiae quam de operum formatione tribuatur.", "olang": "la", "source": "PL 178, col. 740B", "notes": "Abelard makes the verse do a piece of work nobody else asks of it. The light is the distinction of the works and the darkness is the confusion out of which they were distinguished — so that Gen 1:3 attributes the creating of matter to God and Gen 1:4 attributes the forming of it to the same God, and the whole praise falls in one place. The point is directed against a reading in which matter is one thing and its forming another, and it is the argument he needed at Gen 1:1 (see K4); here he gets it out of the dividing. It also means that on this crux the darkness is neither a privation nor an element nor an angel, but a state of the world before it was ordered — which is Honorius' and Wigbod's third answer as well, arrived at from the other end.", "slot": false}, {"id": "hugh-sacr-1-4", "short": "hugh-sacr-1-4", "author": "Hugh of St Victor", "tradition": "latin", "date": 1134, "datelabel": "1130–1137", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["tenebrae-angeli", "tenebrae-privatio", "divisio-est-judicium", "divisio-est-instantanea"], "senses": ["literal", "allegorical"], "lemma": {"la": "divisit per judicium; et per meritum nominavit", "en": "he divided by judgement, and named by merit"}, "en": "And as it seems to me, at precisely the same moment of time at which the light was
