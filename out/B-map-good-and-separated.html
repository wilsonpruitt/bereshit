visibly and bodily divided from the darkness, invisibly also the good angels were distinguished from those evil ones falling into the darkness of sin, these being turned to the light of justice and illuminated by the light, so that they should be light and not darkness. For thus the patterns of God's works had to agree, that the outcome of invisible things should follow the works of wisdom which were visible, according as that same wisdom which was working in both places here exercised judgement and there formed the pattern. The light, then, was divided from the darkness; and there was visible light and there were visible darknesses; likewise there was invisible light, and there were invisible darknesses; and a division of both was made, and the division of the darknesses and of the light was made at once. And the light was called day and the darkness night. God indeed divided both, and named both; but he did not make both. For God is not the author of darkness but of light; because sin is darkness and sin is nothing: And without him was made nothing (John 1:3). Light was made by him; because justice and truth are light, and of light we have heard what God said: Let there be light, and at once light was made (Gen 1). Nowhere did God say: Let there be darkness. But of light he said: Let there be light, and he divided the light from the darkness; and he called the light day, and the darkness night. Therefore he did not make both; yet he divided both, and named both. He divided by judgement; and by merit he named, judged and disposed. For since not even that could be disordered in his judging which was disordered among the offenders, he called the light day, and the darkness night.", "translator": "claude-draft", "orig": "Et ut mihi videtur eodem prorsus temporis momento quo visibiliter et corporaliter divisa est lux a tenebris; invisibiliter quoque boni angeli discreti sunt a malis illis in tenebras peccati cadentibus: et istis ad lucem justitiae conversis illuminatisque a luce, ut lux essent et non tenebrae. Sic enim consonare debuerunt exemplaria operum Dei, ut quae visibilia erant opera sapientiae, invisibilium proventus sequerentur, secundum quod ipsa quae utrobique operabatur sapientia, ibi judicium exercuit, hic formavit exemplum. Divisa est lux ergo a tenebris; et erat lux visibilis et visibiles tenebrae erant; similiter et lux invisibilis erat, et tenebrae invisibiles erant; et utrorumque divisio facta est; et simul facta est divisio tenebrarum et lucis. Et vocata est lux dies et tenebrae nox. Utrumque quidem Deus divisit, et utrumque nominavit; sed et utrumque non fecit. Deus enim auctor tenebrarum non est sed lucis; quia peccatum est tenebrae et peccatum nihil est: Et sine ipso nihil factum est (Joan. III) . Lux ab ipso facta est; quia justitia et veritas lux est, et de luce audivimus quod dixit Deus: Fiat lux, et statim lux facta est (Gen. I) . Nusquam dixit Deus: Fiant tenebrae. Sed de luce dixit: Fiat lux, et divisit lucem a tenebris; et vocavit lucem diem, et tenebras noctem (ibid.) . Ergo non fecit utrumque; tamen utrumque divisit, et utrumque nominavit. Divisit per judicium; et per meritum nominavit, judicavit et disposuit. Quia nec hoc apud eum judicantem inordinatum esse potuit, quod apud delinquentes inordinatum fuit, vocavit lucem diem, et tenebras noctem.", "olang": "la", "source": "PL 176, col. 194D", "notes": "The most carefully joined statement of the Latin answer, and the join is the point. Hugh will not choose between the physical and the angelic reading: both happened, and they happened at the same moment of time, because the visible works of wisdom and the invisible outcomes had to match — 'here it exercised judgement, there it formed the pattern'. So there was visible light and visible darkness, invisible light and invisible darkness, and one division of both at once. Then he states Augustine's doctrine in its sharpest Latin — God divided both and named both, but did not make both, for sin is darkness and sin is nothing — and closes with the distinction the crux has been waiting for: he divided by judgement and named by merit. That the naming is by merit is Hugh's own, and it answers the question the rabbinic bench answers with R. Elazar's 'he never joins his name to the bad': what a thing is called follows what it deserves.", "slot": false}, {"id": "hugh-sacr-1-4b", "short": "hugh-sacr-1-4b", "author": "Hugh of St Victor", "tradition": "latin", "date": 1134, "datelabel": "1130–1137", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["bonum-approbatio"], "senses": ["literal"], "lemma": {"la": "per lucem ergo probavit lucem", "en": "by light, therefore, he proved light"}, "en": "CHAPTER XIII. Why Scripture says: 'God saw the light.' But perhaps it occurs to someone: how did God see the light, that it was good, and divide the light from the darkness, and call the light day and the darkness night (Gen 1)? For if he saw his other works in the light, that they were good, in what light did he see the light, that it was good, and divide the light from the darkness, and call the light day and the darkness night? For nothing can be seen without light; but neither are darknesses seen without light — how much more is light not seen without light? What, then, was that light through which God saw the light, that it was good, and divided the light from the darkness? Did he see by that same light that it was good, or by another light? But how could he have seen through it that it was good, if he had not had another light through which and in which he saw that light, that it was good? For if he saw that this light was good, and truly saw it, he saw it in something of whose goodness there could be no doubt. Therefore there was another light, uncreated, in which this created light was seen to be good; because it imitated that light which is always good. For in that light, since it alone is good, both evils and goods are seen; and not only are evils and goods seen in it, but evils are seen to be evil and goods to be good in it, for the reason that it is truly and supremely good. For what is seen to disagree with it is seen to be evil; and what is seen to be like it is seen to be good; and both are seen only in it and through it. By light, therefore, he proved light: because in the unchangeable light he saw that this changeable light was good in its own mode and order.", "translator": "claude-draft", "orig": "CAP. XIII. Quare dicit Scriptura: « Vidit Deus lucem. » Sed occurrit fortassis quomodo vidit Deus lucem quod esset bona et divisit lucem a tenebris et vocavit lucem diem, et tenebras noctem (Gen. I) . Nam si caetera opera sua in luce vidit quod essent bona, in qua luce vidit lucem quod esset bona et divisit lucem a tenebris vocavitque lucem diem et tenebras noctem? Nihil enim videri potest sine luce; sed nec tenebrae sine luce videntur, quanto magis lux non videtur sine luce? Quae fuit ergo illa lux per quam Deus vidit lucem quod esset bona, et divisit lucem a tenebris? An per ipsam eam vidit quod esset bona, an per aliam lucem vidit quod esset bona? Sed quomodo per ipsam videre potuisset quod esset bona, si aliam lucem non habuisset per quam et in qua ipsam lucem vidisset quod esset bona? Nam, si vidit quod esset bona lux ista et vere vidit, in aliquo vidit de cujus bonitate dubitari non potuit. Ergo, alia lux increata, in qua ista lux creata videbatur quod esset bona; quia illam imitabatur quae semper est bona. In illa enim luce cum ipsa solum sit bona, videntur et mala et bona; et non solum mala et bona in ea videntur, sed mala etiam esse mala, bona esse bona in ea videntur: propterea quod ipsa vere et summe est bona. Quod enim ab ipsa discordare videtur, malum esse videtur; et quod ei simile esse videtur, bonum esse videtur; et utrumque non nisi in ipsa et per ipsam videtur. Per lucem ergo probavit lucem: quia in luce incommutabili vidit quod lux ista commutabilis suo modo et ordine bona esset.", "olang": "la", "source": "PL 176, col. 197B", "notes": "A schoolman's difficulty made out of the order of the clauses, and worth the card because it is the only place on this crux where the *seeing* is treated as a problem in its own right rather than as a manner of speaking. If God saw the other works in the light of day one, in what light did he see that light? He cannot have seen it by itself, since nothing sees itself; so there was another and unchangeable light, and in that light he saw that this changeable one was good 'in its own mode and order'. Ambrose had refused the question by saying the seeing is not an inspection, Alcuin by making it a persistence of pleasure, Ibn Ezra by saying it is in the thought. Hugh alone answers it by positing a second light — uncreated, in which this changeable light was seen to be good because it imitated one that is always good — and then draws out what that light is for: in it not only are goods and evils seen, but goods are seen to be good and evils to be evil. The answer costs him a second light and buys him a criterion.", "slot": false}, {"id": "rupert-gen-1-4", "short": "rupert-gen-1-4", "author": "Rupert of Deutz", "tradition": "latin", "date": 1117, "datelabel": "1112–1117", "place": "Liège", "lat": 50.63, "lon": 5.57, "answers": ["tenebrae-angeli", "divisio-est-judicium", "bonum-approbatio"], "senses": ["allegorical"], "lemma": {"la": "terribile Dei judicium super diabolum", "en": "the terrible judgement of God upon the devil"}, "en": "It is to be noted first of all that it is said: God saw the light, that it was good. (For none is good but one, God — Matt 19:17.) Further, whoever is called good, whether man or angel, is rightly called good only in respect of the good God, since, as none is good but one, God, whoever is good, or is said to be good, is good only in so far as he partakes of the good God. Accordingly it is not said: God saw the earth, that it was good, or the luminaries, that they were good, because they are not capable of goodness. But it is said of each: God saw that it was good — that is, a good thing, good, I say, that is, a useful thing. For the rational creature alone is capable of the divine goodness, that is, of the Spirit of God; and therefore man or angel alone is to be called good absolutely, namely in so far as man or angel has been made a partaker of the good God. Therefore this very judgement by which God saw the light, that it was good, compels that light to be understood which is capable of the divine goodness: a rational light, an intellectual light, the shining dignity of the angelic creature. But how is it said, And God saw the light, that it was good? Had he not seen, before he made it, that to make it was good? Does not the evangelist say of that Word in which he said 'let it be', that what was made, in him was life (John 1:3–4)? Therefore what he saw, he weighed with a just judgement and reckoned worthy of his regard. For there follows: And he divided the light and the darkness. This division of light and darkness intimates that a terrible judgement of God was made upon the devil. Of which the psalmist says: You are terrible, and who shall resist you? From then your anger (Ps 76:8 [Vg 75:8]). […] For since the devil resisted — that is, willed to resist you — you were angry, and he could not resist; for the angel fell and was made a devil. This terrible judgement is intimated by the division of light and darkness. For what are those darknesses, unless all the angels of Satan with their prince? These darknesses, surely, God divided from the light, because he separated the evil angels from the good. He divided them, I say, by an unchangeable separation, so that neither can those who fell rise again, nor can those who, though they could have sinned, refused to fall by sinning, ever fall by sinning any more. […] But whence those darknesses came has already been said: namely, from where the aforesaid light came, thence came those darknesses also; for they were shining angels, and by their own vice were made darksome demons.", "translator": "claude-draft", "orig": "Notandum in primis quod dictum est: Vidit Deus lucem quod esset bona. (Nemo enim bonus, nisi unus Deus [Matth. X] ). Porro quicunque bonus praedicatur, sive homo, sive angelus, nonnisi respectu boni Dei recte bonus praedicatur, quia cum nemo sit bonus nisi unus Deus, quicunque bonus est, vel esse dicitur, nonnisi in tantum bonus est in quantum bono Deo participatur. Proinde non dictum est: Vidit Deus terram quod esset bona, vel luminaria quod essent bona, quia videlicet bonitatis capacia non sunt. Dictum est autem de singulis, vidit Deus quod esset bonum, id est, bona res, bona, inquam, id est, utilis res. Sola namque rationalis creatura divinae bonitatis, id est spiritus Dei, capax est; et ideo homo vel angelus tantummodo bonus absolute dicendus est, videlicet in quantum homo vel angelus boni Dei particeps factus est. Igitur et hoc ipsum judicium quo vidit Deus lucem quod esset bona, lucem illam cogit intelligi quae capax divinae est bonitatis, lucem rationalem, lucem intellectualem, angelicae creaturae splendidam dignitatem. Quomodo autem dictum est, et vidit Deus lucem quod esset bona? Nonne antequam faceret, hoc ipsum viderat quia facere bonum erat? Nonne et evangelista sic dicit de Verbo isto in quo dixit, fiat, quia quod factum est, in ipso vita erat? (Joan. I.) Ergo quod vidit, id est, justo judicio ponderavit et conspectu suo dignum duxit. Sequitur enim: Et divisit lucem et tenebras. Divisio ista lucis et tenebrarum terribile Dei judicium super diabolum esse factum insinuat. De quo Psalmista: Tu terribilis es, inquit, et quis resistet tibi? Extunc ira tua (Psal. LXXV) . Tanquam diceret: Quis tibi resistere 6 potest, cum ex quo tibi quis resistit, extunc terribilis exardescat ira tua? Nam ex quo diabolus resistit, id est, resistere voluit tibi, tu iratus es, et resistere non potuit; cecidit enim angelus et factus est diabolus. Hoc terribile judicium per divisionem insinuatur lucis et tenebrarum. Quae enim sunt istae tenebrae, nisi omnes angeli Satanae cum eodem suo principe? Has utique tenebras Deus lucemque divisit, quia malos angelos a bonis separavit. Divisit, inquam, separatione immutabili, ita ut nec isti qui ceciderunt, resurgere, nec illi qui, cum peccare possent, peccando cadere noluerunt, ulterius unquam habeant vel possint peccando cadere. Verbo namque Dei coeli firmati sunt, et spiritu oris ejus omnis virtus eorum (Psal. XXXII) . Ista lux, isti sunt coeli. Lux, inquam, quam Deus a tenebris divisit, et coeli quos Verbo suo, quos Spiritu, id est amore suo: Deus firmavit, ut jam obscurari vel dissolvi non possint: congregans sicut in utre aquas maris, ponens in thesauris abyssos (ibid.) : quae omnia secundum litteram jam in illo exordio facta esse dubium non est. Timeat ergo Dominum omnis terra, ab eo autem commoveantur omnes inhabitantes orbem (ibid.) , quia profecto qualis tunc destruxit consilia superborum spirituum, talis et usque in finem Dominus dissipat consilia gentium; reprobat autem cogitationes populorum, et reprobat consilia principium (ibid.) . Unde autem venerint istae tenebrae, jam dictum est, videlicet unde venit praedicta lux, inde venerunt et istae tenebrae; fuerunt enim lucentes angeli, et proprio vitio facti sunt daemones tenebrosi.", "olang": "la", "source": "PL 167, col. 210A", "notes": "Rupert argues to the angelic reading from the word 'good' rather than assuming it, and the argument is his own. None is good but God; whatever else is called good is good by partaking of him; only a rational creature can partake of him — therefore only a rational creature can be called good absolutely, and the fact that the text says of this light that it was good, and not merely that it was a good thing, forces the light to be intellectual. That is why, he notes, it is not said of the earth or of the luminaries that they were good. Then the division becomes a sentence passed: 'a terrible judgement of God upon the devil', unchangeable in both directions, so that the fallen cannot rise and the standing can no longer fall. And the answer to where the darkness came from is the one answer that makes it neither a privation nor a creature: it came from where the light came from — they were shining angels and made themselves dark. Elided: two psalm citations expounded at length. Rupert reads divisit lucem et tenebras without a preposition, which is neither Jerome's text nor the Old Latin's.", "slot": false}, {"id": "honorius-hex-1-4", "short": "honorius-hex-1-4", "author": "Honorius Augustodunensis", "tradition": "latin", "date": 1130, "datelabel": "c. 1130", "place": "Regensburg", "lat": 49.02, "lon": 12.1, "answers": ["divisio-loci"], "senses": ["literal"], "lemma": {"la": "duodecim horas super terram, et duodecim sub terra", "en": "twelve hours above the earth and twelve below"}, "en": "And God saw the light, that it was good. That is, he gave the rational creature to understand how good are all the things it discerns by the light. And he divided the light and the darkness: namely, so that the light should shine twelve hours above the earth and twelve below the earth; and the darkness, put to flight by the light, should lie hidden twelve hours below the earth and as many above it.", "translator": "claude-draft", "orig": "Et vidit Deus lucem, quod esset bona. Hoc est, rationali creaturae intelligere dedit: quam bona sint cuncta, quae per lucem cernit. Et divisit lucem ac tenebras: scilicet ut lux duodecim horas super terram, et duodecim sub terra splendesceret: tenebrae quoque a luce fugatae duodecim horas sub terra totidemque super terram delitescerent.", "olang": "la", "source": "PL 172, col. 255D", "notes": "The literal answer taken as far as it will go: the division is a timetable. The light of the first day travels on a twelve-hour circuit above the earth and twelve below, and the darkness does the reverse, hiding below while the light is above. Bede's difference of place has become a mechanism with hours in it, and there is no privation anywhere in the sentence — the darkness is put to flight by the light and lies hidden, which are things only a body does. On the *ki tov* half Honorius takes the seeing out of God altogether: 'he gave the rational creature to understand how good are all the things it discerns by the light', so the goodness is what we see by the light, not what God saw in it. Nobody else on either bench makes the approval a gift to the beholder.", "slot": false}, {"id": "comestor-hs-1-4", "short": "comestor-hs-1-4", "author": "Peter Comestor", "tradition": "latin", "date": 1170, "datelabel": "c. 1170", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["tenebrae-creatura", "divisio-loci", "tenebrae-angeli", "bonum-approbatio"], "senses": ["literal", "allegorical"], "lemma": {"la": "umbram ex objectione corporum luci", "en": "the shadow made by bodies set against the light"}, "en": "And God saw the light, that it was good — that is, which had pleased him in his presence, or in his foreknowledge, that it should be made; it pleased him in its being, that it should remain. Or figuratively, he saw, that is, he made to be seen. And he divided the light and the darkness; here the disposing begins. And yet he says something of creation too, as though he created the darkness together with the light — that is, the shadow made by bodies set against the light; and he divided the created things by distance of place, and by quality, so that they should never be together, but always claim opposite hemispheres in turn. Here too the division of the angels is understood: those who stood were called light, those who fell darkness.", "translator": "claude-draft", "orig": "Et vidit Deus lucem, quod esset bona, id est quae placuerat in praesentia, vel praescientia, ut fieret; placuit in essentia, ut maneret. Vel tropice, vidit. id est videre fecit. Et divisit lucem, ac tenebras; hic incipit dispositio. Et tamen aliquid dicit de creatione, quasi cum luce tenebras creavit, id est umbram ex objectione corporum luci; et creatas divisit locorum distantia, et qualitate, ut scilicet nunquam simul, sed semper e regione diversa hemisphaeria vicissim sibi vindicarent. Intelligitur etiam hic angelorum facta divisio: stantes lux, cadentes tenebrae dicti sunt.", "olang": "la", "source": "PL 198, col. 1057B", "notes": "The twelfth-century summary, and the sentence in it that nobody else on the Latin bench writes: 'as though he created the darkness together with the light — that is, the shadow made by bodies set against the light.' It is a physical account of what darkness is that makes it a real effect of a real cause and not a privation, and Comestor slips it in with quasi and moves on to Bede's distance of place and the angels, keeping all three answers as Angelomus did three hundred years earlier. On the approval he splits the moment cleanly in two — it pleased God in his foreknowledge that it should be made, and pleased him in its being that it should remain — which is Alcuin's answer with a distinction added, and then offers 'he saw, that is, he made to be seen' as a figurative alternative, which is Remigius'. The Historia scholastica is at its most useful here: not a position, a map.", "slot": false}], "threads": [{"id": "t-k9-01", "from": "aug-civ-11-20", "to": "br-3-6b", "type": "parallel", "evidence": "The star thread of this crux, and both benches reach it by reading a silence in the syntax. Augustine: on day one 'and God saw that it was good' is placed before the division and not after it, 'lest he should seem to have borne the testimony of his approval to such darkness along with the light' — and on day four, where the darkness is blameless, it is placed after. R. Elazar: 'the Holy One never joins his name to the bad but only to the good, for it is not written and to the darkness GOD called night, but and to the darkness he called night.' One argues from where a clause of approval stands, the other from where the divine name is dropped, at consecutive verses, with no contact of any kind.", "crux": "good-and-separated"}, {"id": "t-k9-02", "from": "aug-civ-11-20", "to": "br-2-5", "type": "parallel", "evidence": "The same inference from the same omission at the same clause. R. Abahu: 'but I do not know which of them he desires — since it is written and God saw the light that it was good, he desires the deeds of the righteous and does not desire the deeds of the wicked.' Augustine: 'lest both should be called good, when one of them was evil.' Both take the absence of an approval of the darkness to be a deliberate withholding, and both make it decisive.", "crux": "good-and-separated"}, {"id": "t-k9-03", "from": "br-3-8-yanai", "to": "br-2-5", "type": "echoes", "evidence": "The same reading twice in the same midrash, once as an argument and once as a mapping. R. Abahu at 2:5 states the difficulty ('I do not know which of them he desires') and resolves it from Gen 1:4; R. Yanai at 3:8 runs the same identifications through every clause of 1:2–1:5 without raising a difficulty at all. The mapping is identical: tohu the deeds of the wicked, 'let there be light' the deeds of the righteous.", "crux": "good-and-separated"}, {"id": "t-k9-04", "from": "isidore-quaest-1-4", "to": "br-3-8-yanai", "type": "parallel", "evidence": "The moral reading on both benches at the same clause, and the difference between them is exact. R. Yanai: 'and God divided between the light and the darkness — between the deeds of the righteous and the deeds of the wicked.' Isidore: 'then God, according to the favour of his foreknowledge, divided the just, that is, the sons of God and of light, from sinners, as from darkness; calling the just day and those others night.' The rabbinic bench divides deeds, the Latin bench divides people. Neither ever discusses the difference, and it holds across every allegory on this verse.", "crux": "good-and-separated"}, {"id": "t-k9-05", "from": "aug-gnl-imp-5-25", "to": "br-3-8-yanai", "type": "parallel", "evidence": "Augustine reaches the righteous and the wicked at this clause too, and gets there by a route the rabbinic bench does not need: God is not the author of our vices but is their orderer, when he sets sinners in the place they deserve — sheep on the right, goats on the left. Because he has made the darkness a privation he cannot let the wicked be the darkness outright, only be ordered under it; R. Yanai, under no such constraint, simply says the darkness is their deeds.", "crux": "good-and-separated"}, {"id": "t-k9-06", "from": "aug-gnm-1-9", "to": "aug-gnl-imp-5-23", "type": "echoes", "evidence": "Four years apart, the same doctrine argued from two different angles: at De Genesi contra Manichaeos from the analogy of silence, which explains how Scripture can say God makes darkness; at De Genesi ad litteram imperfectus from the analogy of the garment and nakedness, which explains why no separate act of dividing was needed.", "crux": "good-and-separated"}, {"id": "t-k9-07", "from": "aug-gnl-imp-5-25", "to": "aug-gnm-1-9", "type": "echoes", "evidence": "The privation doctrine completed. The earlier work says God does not make the darkness but is rightly said to make it by withholding light; the later adds the term that the whole tradition will use — he does not make it, but he orders it, 'lest even those privations should not have their own order' — and supplies the rests in music and the shadows in painting to show what ordering a nothing can mean.", "crux": "good-and-separated"}, {"id": "t-k9-08", "from": "aug-civ-11-19", "to": "aug-gnl-imp-5-25", "type": "contests", "evidence": "Augustine against Augustine, and he knows it: the earlier work takes the light of day one as possibly ethereal, sensitive or rational and the darkness as the privation of whichever it is; the City of God offers the reading in which the light is the angels and the darkness the apostate spirits, and hedges it — 'it does not seem to me an opinion at odds with the works of God'. Every later Latin witness on this crux has to hold both, and Hugh's solution is to say that both divisions happened at the same instant.", "crux": "good-and-separated"}, {"id": "t-k9-09", "from": "wigbod-gen-1-4", "to": "aug-civ-11-20", "type": "cites", "evidence": "'Et cur non dicit Scriptura, vidit Deus tenebras quod essent bonae, sicut de luce dictum est? … in his dicens quia boni sunt, in illis nullatenus dicens, ne peccata quae erant tenebrae adprobare videretur' reproduces City of God XI.20's argument and its reason almost word for word, under the rubric AUGUSTINUS — on the same page as the proposition that there is an essence of darkness, which Augustine denies everywhere.", "crux": "good-and-separated"}, {"id": "t-k9-10", "from": "wigbod-gen-1-4", "to": "aug-gnm-1-9", "type": "contests", "evidence": "The sharpest disagreement on the Latin bench, and it is invisible because it is filed under Augustine's name. Augustine: Scripture does not say God made the darkness, because darkness is the absence of light. Wigbod's pupil: everything that is divided can also be, so as there is an essence of light, so there is an essence of darkness. The inference is valid on its own terms and it destroys the doctrine the same compilation is transmitting.", "crux": "good-and-separated"}, {"id": "t-k9-11", "from": "angelom-gen-1-4", "to": "aug-gnm-1-9", "type": "cites", "evidence": "The silence analogy copied close enough to be certain — clamando vocem, silentium autem non clamando, cessatio vocis silentium est — with one word altered: Augustine writes that God makes darkness because he 'either does not give light or withdraws it', Angelomus that he 'either gives or withdraws light'. The change turns a withholding into a conferring, and Angelomus names Augustine two sentences later as the authority he is following.", "crux": "good-and-separated"}, {"id": "t-k9-12", "from": "angelom-gen-1-4", "to": "bede-gen-1-4", "type": "cites", "evidence": "'Lucem videlicet in superiore orbis parte diffundendo, in qua humana erat conversatio futura, inferiora vero ejus priscis in tenebris remanendo' is Bede's sentence with one verb changed, introduced by 'as Clement says: lighting up one part of the world, he left the other dark.' Angelomus has the words from Bede and the attribution from somewhere else.", "crux": "good-and-separated"}, {"id": "t-k9-13", "from": "rabanus-gen-1-4", "to": "bede-gen-1-4", "type": "transmits", "evidence": "Verbatim and unnamed, from 'Divisit namque eas non solum qualitatis, sed et locorum distantia' to the end of the sentence. The transmission is what makes 'by quality and by place' the standing literal answer of the Latin bench.", "crux": "good-and-separated"}, {"id": "t-k9-14", "from": "comestor-hs-1-4", "to": "bede-gen-1-4", "type": "echoes", "evidence": "'Et creatas divisit locorum distantia, et qualitate' is Bede's pair of terms four centuries on, with the mechanism supplied — 'so that they should never be together, but always claim opposite hemispheres in turn' — and with the darkness made a created shadow rather than an ancient dark left in place.", "crux": "good-and-separated"}, {"id": "t-k9-15", "from": "honorius-hex-1-4", "to": "bede-gen-1-4", "type": "echoes", "evidence": "The same answer turned into a timetable: twelve hours above the earth and twelve below, the darkness put to flight and lying hidden. Bede's 'difference of places' has become a circuit with a count of hours, and the darkness has become the kind of thing that can be driven off and can hide.", "crux": "good-and-separated"}, {"id": "t-k9-16", "from": "basil-hex-2-8", "to": "bede-gen-1-4", "type": "parallel", "evidence": "Both answer 'why divide them?' with distance, and neither could have got it from the other in this form: Basil, that God fashioned their natures unmingled and set them apart from one another by long spaces; Bede, that he divided them not only by quality but by place, the light over the upper part of the world. Basil's Latin was available in Northumbria, but the shared term is the commonplace, not a phrase.", "crux": "good-and-separated"}, {"id": "t-k9-17", "from": "remigius-gen-1-4", "to": "aug-gnm-1-9", "type": "contests", "evidence": "The flattest contradiction of Augustine on this crux, without naming him and without argument from authority: 'God made both, the light and the darkness … therefore the darkness too is a work of God', proved from the Benedicite, where light and darkness are called together to bless the Lord (Dan 3:72). If darkness is the absence of light it cannot be summoned to praise; the canticle summons it.", "crux": "good-and-separated"}, {"id": "t-k9-18", "from": "glossa-1-4", "to": "remigius-gen-1-4", "type": "cites", "evidence": "The Glossa's whole literal gloss on this verse is Remigius' sentence with its proof text — 'Lucem et tenebras fecit Deus, unde Dan. III: Benedicite, lux et tenebrae, Domino, cum omnis creatura ad benedicendum invitatur' — printed under the name of Strabo. What the twelfth-century schoolroom reads on Gen 1:4 is therefore the anti-Augustinian answer.", "crux": "good-and-separated"}, {"id": "t-k9-19", "from": "glossa-1-4", "to": "isidore-quaest-1-4", "type": "cites", "evidence": "'Habet quisque in operibus et recta vita, distinctos sex dies, post quos requiem speret: primo die, lucem fidei' is Isidore's six ages of the Christian life, named as such, reduced to its first day. The Glossa keeps the moral reading and drops the division of the just from sinners that was its content.", "crux": "good-and-separated"}, {"id": "t-k9-20", "from": "remigius-gen-1-4b", "to": "isidore-quaest-1-4", "type": "echoes", "evidence": "The same six-day allegory carried from the individual life to the history of the world: Isidore's first day is the light of faith and the dividing of the just from sinners, Remigius' is the separation of the sons of Seth from the generation of Cain, with the flood as its evening. The scheme is Isidore's, the datable content is not.", "crux": "good-and-separated"}, {"id": "t-k9-21", "from": "remigius-gen-1-4b", "to": "remigius-gen-1-4", "type": "contests", "evidence": "One commentator, one verse, two incompatible readings a few columns apart, and no attempt to reconcile them: on the literal pass the darkness is a work of God made so that men might rest, and on the allegorical pass the darkness is the impious line of Cain that God drowned. The Latin bench's habit of running the six days twice is what allows the same writer to hold both.", "crux": "good-and-separated"}, {"id": "t-k9-22", "from": "hugh-sacr-1-4", "to": "aug-civ-11-19", "type": "echoes", "evidence": "Hugh takes over the angelic division and removes Augustine's hedge, then adds what Augustine does not say: that the visible division and the invisible one happened at precisely the same moment of time, because the visible works of wisdom and the invisible outcomes had to correspond.", "crux": "good-and-separated"}, {"id": "t-k9-23", "from": "hugh-sacr-1-4", "to": "aug-gnl-imp-5-23", "type": "echoes", "evidence": "The instantaneity argument transferred. Augustine: no separate act of separation was needed, because the division followed by the very fact that the light was made. Hugh: the division of the darknesses and of the light was made at once — and applies it to the angels, so that the fall and the confirmation are one instant with the making of light.", "crux": "good-and-separated"}, {"id": "t-k9-24", "from": "hugh-sacr-1-4", "to": "br-3-6b", "type": "parallel", "evidence": "'He divided by judgement, and by merit he named' and R. Elazar's 'the Holy One never joins his name to the bad but only to the good' are the same doctrine of naming: what a thing is called follows what it deserves, and the naming is therefore a second act after the judging, not a label. Hugh gets it from the order divisit … vocavit, R. Elazar from a missing subject in the second half of the verse.", "crux": "good-and-separated"}, {"id": "t-k9-25", "from": "rupert-gen-1-4", "to": "aug-civ-11-19", "type": "echoes", "evidence": "The angelic reading with a new argument under it. Augustine offers it as one true reading among several; Rupert derives it from the word 'good' — none is good but God, only a rational creature can partake of him, therefore the light of which it is said 'that it was good' must be intellectual — and then makes the division a sentence pronounced on the devil, unchangeable in both directions.", "crux": "good-and-separated"}, {"id": "t-k9-26", "from": "rupert-gen-1-4", "to": "aug-civ-11-20", "type": "contests", "evidence": "Both build on the placing of 'God saw that it was good', and they build opposite things. Augustine: the approval is put before the division so that God should not seem to approve the darkness. Rupert: the approval is put where it is because it is a judgement passed on a rational light — and the division that follows is the judgement passed on the rest. Where Augustine finds a refusal to approve, Rupert finds a verdict delivered.", "crux": "good-and-separated"}, {"id": "t-k9-27", "from": "hugh-sacr-1-4b", "to": "ambrose-hex-1-9b", "type": "parallel", "evidence": "The same difficulty and two refusals to let it become a problem about God's knowledge. Ambrose: 'he did not see what he did not know; nor did he approve what he had not known before' — the seeing is the self-attestation of a good work. Hugh takes the question seriously and answers it with a second light: in the unchangeable light he saw that this changeable light was good in its own mode and order.", "crux": "good-and-separated"}, {"id": "t-k9-28", "from": "hugh-sacr-1-4b", "to": "alcuin-int-35", "type": "echoes", "evidence": "Alcuin dissolves the difficulty — what pleased him to be made pleased him to remain — and Hugh reopens it as a question about the medium of the seeing. Both are answering the objection that if God saw the light was good he learned something; the Carolingian schoolbook answers in one sentence what the Paris schoolroom takes a chapter over.", "crux": "good-and-separated"}, {"id": "t-k9-29", "from": "comestor-hs-1-4", "to": "alcuin-int-35", "type": "echoes", "evidence": "'Quae placuerat in praesentia, vel praescientia, ut fieret; placuit in essentia, ut maneret' is Alcuin's answer with the moment divided in two, foreknowledge and being; the doubling is Comestor's and the pattern — what pleased to be made pleased to remain — is Alcuin's.", "crux": "good-and-separated"}, {"id": "t-k9-30", "from": "ibn-ezra-1-4", "to": "aug-gnm-1-9", "type": "parallel", "evidence": "Both come to the possibility that the dividing and the naming are one act, and only one of them takes it. Augustine: 'perhaps, then, the dividing between light and darkness just is the calling of the light day and the darkness night, so that to have ordered these is to have named them' — and he leaves it as a perhaps and goes on. Ibn Ezra states it flatly as the meaning of the word: 'and the sense of and he divided is by the calling of names.' Nothing else on the Latin bench even entertains it.", "crux": "good-and-separated"}, {"id": "t-k9-31", "from": "ibn-ezra-1-4", "to": "ambrose-hex-1-9b", "type": "parallel", "evidence": "The seeing removed from the world in two ways. Ibn Ezra: 'and he saw' is like Qohelet's 'I myself saw' — it is in the thought, so no act is reported. Ambrose: God did not see what he did not know, and the seeing is the good work attesting itself. Both refuse to let the verse describe an inspection, and neither has to posit anything to do it, which is what separates them from Hugh's second light.", "crux": "good-and-separated"}, {"id": "t-k9-32", "from": "ramban-1-2-choshech", "to": "comestor-hs-1-4", "type": "parallel", "evidence": "The two most physical accounts of what the darkness is, from benches that cannot borrow. Ramban: the darkness is elemental fire, which is dark, 'and were it red, it would redden the night for us'. Comestor: God created the darkness with the light, that is, the shadow made by bodies set against the light. Both make the darkness a real thing with a cause, and Comestor has to introduce his with quasi because Augustine stands behind him; Ramban states his as the plain sense.", "crux": "good-and-separated"}, {"id": "t-k9-33", "from": "pdre-3-5", "to": "remigius-gen-1-4", "type": "parallel", "evidence": "Darkness as a creature, stated without argument on both benches. Pirkei de-Rabbi Eliezer puts it fourth in a list of eight things created on the first day, between light and tohu, with no proof text and no defence. Remigius says God made both and proves it from the Benedicite. Neither is arguing with anybody; each is the settled answer of a tradition, and they are the same answer.", "crux": "good-and-separated"}, {"id": "t-k9-34", "from": "pdre-3-5", "to": "alcuin-int-35", "type": "parallel", "evidence": "Two enumerations of what was made at the beginning, answering the same question with incompatible inventories. Alcuin, at the question next but one to this: heaven, earth, angels, light, air, water and the soul of man. Pirkei de-Rabbi Eliezer: heaven, earth, light, darkness, tohu, bohu, wind and water. The Latin list has the angels and the soul and no darkness; the rabbinic list has the darkness and the tohu and no angels. Neither list argues, and between them they contain the whole disagreement of this crux.", "crux": "good-and-separated"}, {"id": "t-k9-35", "from": "abelard-hex-1-4", "to": "wigbod-gen-1-4", "type": "parallel", "evidence": "'Distinctio rei formatae ab informi', given as a third answer in a Carolingian dialogue, and 'operatione sua perfectum discrevit ab imperfecto et distinctum a confuso', argued at the Paraclete three hundred years later to prove that the creator of the matter and the former of the works are one and the same. The same reading of the darkness — not a privation, not a creature, but the unordered state of the world — put to two entirely different uses.", "crux": "good-and-separated"}, {"id": "t-k9-36", "from": "abelard-hex-1-4", "to": "aug-gnl-imp-5-25", "type": "contests", "evidence": "Both make the division an ordering rather than a making, and they mean opposite things by it. Augustine orders privations, so that even a nothing has its place. Abelard orders works, so that the distinction of the works just is the light and the confusion before them is the darkness — which leaves nothing for the privation doctrine to be about.", "crux": "good-and-separated"}, {"id": "t-k9-37", "from": "vulgate-1-4", "to": "lxx-1-4", "type": "transmits", "evidence": "The Greek keeps the Hebrew's doubled preposition, ana meson tou photos kai ana meson tou skotous, and the Old Latin behind Augustine keeps it too: divisit inter lucem et tenebras. Jerome writes divisit lucem a tenebris. Which form a Latin witness quotes tracks his text closely enough to be visible on this daf: Augustine, Angelomus and Alcuin have the older form, Bede, Remigius, the Glossa and Comestor Jerome's, and Rupert has neither.", "crux": "good-and-separated"}, {"id": "t-k9-38", "from": "targ-psj-1-4", "to": "targ-onk-1-4", "type": "echoes", "evidence": "Pseudo-Jonathan reproduces Onkelos word for word at Gen 1:4 and expands freely at Gen 1:5 — the light made so that the inhabitants of the world might labour by it, the darkness so that the creatures might rest in it. The expansive targum finds nothing to expand in the dividing, which is the whole of the Latin bench's difficulty.", "crux": "good-and-separated"}, {"id": "t-k9-39", "from": "remigius-gen-1-4", "to": "targ-psj-1-4", "type": "parallel", "evidence": "The same reason for the division, given in Aramaic and in Latin with no possible contact: Pseudo-Jonathan, that God made the day so that the inhabitants of the world might labour by it and the night so that the creatures might rest in it; Remigius, that God made both the light and the darkness 'that men might work in the light and rest in the night'. Remigius uses it to prove the darkness is a creature; the targum draws no conclusion from it at all.", "crux": "good-and-separated"}, {"id": "t-k9-40", "from": "br-3-6b", "to": "bede-gen-1-4", "type": "parallel", "evidence": "R. Yoḥanan and Resh Lakish's king with two generals, each claiming the day, told 'day shall be your bound' and 'night shall be your bound', and Bede's division 'not only by quality but by place', with the light over the upper part of the world and the lower left dark. Both make va-yavdel an assignment of territory, and the midrash says outright what Bede assumes: havdala mamash, a real separating and not a figure.", "crux": "good-and-separated"}, {"id": "t-k9-41", "from": "br-3-6b", "to": "aug-gnl-imp-5-25", "type": "contests", "evidence": "The two benches at their furthest apart on the same clause. Augustine: God did not make the darkness, he ordered it, as a singer orders his silences. R. Tanḥuma, on Isa 45:7, 'who forms light and creates darkness, who makes peace': after they were created he made peace between them — the darkness is created, the making of peace is the dividing, and both are works. The rabbinic text has no term for a privation and never needs one.", "crux": "good-and-separated"}, {"id": "t-k9-42", "from": "rupert-gen-1-4", "to": "br-3-6b", "type": "parallel", "evidence": "The division as a judicial sentence, on both benches, with the same insistence that it is irreversible. Rupert: a terrible judgement of God upon the devil, 'by an unchangeable separation, so that neither can those who fell rise again, nor can those who refused to fall ever fall'. The midrash: the king calls each general and fixes his bound, and R. Berekhya introduces it as havdala mamash. The Latin makes it a verdict on persons and the rabbinic a decree about times, and both are about what may never be crossed again.", "crux": "good-and-separated"}, {"id": "t-k9-43", "from": "ibn-ezra-1-4", "to": "br-3-6b", "type": "contests", "evidence": "Ibn Ezra's 'the sense of and he divided is by the calling of names' is the flat denial of R. Yoḥanan and Resh Lakish's havdala mamash, a real separating, and he does not name them. He is also refusing R. Ze'eira's derivation, since a naming cannot be the source of a rule about looking at a flame. The grammarian dismantles in one clause the two things the midrash builds on this word.", "crux": "good-and-separated"}, {"id": "t-k9-44", "from": "aug-civ-11-19", "to": "br-3-6b", "type": "contests", "evidence": "Both benches read the darkness of this verse as something set aside, and the thing set aside is not the same. For Augustine it is the apostate angels, ordered but not approved; for R. Yehuda bar Simon and the Rabbis it is the light that is set aside — hivdilo lo, he separated it for himself, or for the righteous in the time to come. One tradition takes the division to be a removal of the darkness from fellowship, the other a reservation of the light from use, and each is unavailable to the other.", "crux": "good-and-separated"}, {"id": "t-k9-45", "from": "glossa-1-4", "to": "aug-gnm-1-9", "type": "contests", "evidence": "The Glossa's own gloss on Gen 1:2, three columns earlier, is 'and there were darknesses, namely the privation of true light'; its gloss on Gen 1:4 is 'God made both the light and the darkness'. The standard schoolbook prints Augustine's doctrine on one verse and its contradiction on the next, and marks neither as disputed.", "crux": "good-and-separated"}], "answers": {"borne-over": {"label": "Borne over", "gloss": "The verb is motion: a spirit carried above the water (LXX ἐπεφέρετο, Vulgate ferebatur)."}, "wind": {"label": "A wind", "gloss": "Ruach is weather, not a person; Onkelos keeps God at a remove."}, "spirit-of-mercy": {"label": "Spirit of mercy", "gloss": "A divine disposition blowing over the waters (Palestinian targums)."}, "messiah": {"label": "Spirit of the Messiah", "gloss": "Resh Lakish: the ruach of Isa 11:2, brought by repentance-as-water."}, "bird-hovering": {"label": "Dove hovering, not touching", "gloss": "Ben Zoma and Rashi: the bird measures a gap; it does not land."}, "fluttering": {"label": "Fluttering", "gloss": "Abelard's report of the Hebrew: volitabat, as the eagle of Deut 32:11."}, "brooding-warmth": {"label": "Bird brooding, warming", "gloss": "Jerome from the Hebrew, Basil's Syrian, then the Latin schools: the Spirit quickens matter like a hen on eggs."}, "power-not-place": {"label": "Power, not place", "gloss": "Augustine: 'above' means sovereignty, not position; the Manichees misread it."}, "craftsman": {"label": "The craftsman's will", "gloss": "The Spirit over the waters as the maker's intention over the wood."}, "love-gift": {"label": "Love, gift, weight", "gloss": "Confessions XIII: why the Spirit alone is said to be above; pondus meum amor meus."}, "trinity": {"label": "The Trinity named", "gloss": "The verse completes Father (in principio), Son (principium), Spirit."}, "heart": {"label": "Over the heart", "gloss": "Isidore's moral reading: the waters are our fluid, dark heart."}, "throne": {"label": "Throne of Glory", "gloss": "Rashi: the throne stands in the air, held by the breath of God's mouth."}, "unus-cardinal": {"label": "The versions keep the cardinal", "gloss": "ἡμέρα μία, dies unus, yoma chad: 'one', not 'first', in every ancient version."}, "unus-grammatical": {"label": "'First' needs a second", "gloss": "The series 'one, second, third' is improper (Bereshit Rabbah); or, first and second are relatives and there was no second yet (Bruno)."}, "unus-alone": {"label": "God was alone that day", "gloss": "Yachid in his world: no angels were made on the first day, so there was no second anything (Bereshit Rabbah, Rashi)."}, "unus-yom-kippur": {"label": "The one day given to Israel", "gloss": "'One day' is the Day of Atonement, the day the Holy One gave them."}, "unus-24-hours": {"label": "One circuit, twenty-four hours", "gloss": "Day and night together make one revolution, and the whole is named from the day alone."}, "unus-repeated": {"label": "The same day repeated", "gloss": "There is one day only — the angelic light — presented once for each kind of thing made (Augustine)."}, "unus-all-time": {"label": "One day = all time", "gloss": "The word holds the whole span of the ages, or the whole work of the six days (Augustine's set-aside reading; Abelard's own)."}, "unus-angelic-unity": {"label": "The unity of angelic dignity", "gloss": "'One' names the undivided attention of the angelic mind, not a place in a series (Angelomus)."}, "unus-eternal-day": {"label": "The true first day is eternal", "gloss": "This day is first only by number and order of creation; the day that is first by nature is uncreated light (Rupert)."}, "day-precedes-night": {"label": "Day before night", "gloss": "Evening is the end of a finished day, morning the end of the night; days are counted from morning to morning."}, "day-follows-night": {"label": "Night before day", "gloss": "'One day' rules that reckoning begins at evening (Ben Zoma, b. Chullin 83a)."}, "night-for-rest": {"label": "Night made for rest", "gloss": "Day is for labour and night for rest, so only the day's bounds are counted."}, "day-is-a-measure": {"label": "The day's measure is a creature", "gloss": "The measure of day and of night was itself made on day one (b. Chagigah 12a)."}, "evening-is-completion": {"label": "Evening completes a work", "gloss": "Vespera is a work perfected, mane the beginning of the next — the Carolingian formula."}, "evening-is-self-knowledge": {"label": "Evening and morning knowledge", "gloss": "The creature known in itself is evening; known in the Word and referred back in praise, morning (Augustine)."}, "evening-moral": {"label": "Evening as sin or temptation", "gloss": "Evening and morning are the deeds of the wicked and the righteous, or sin and renewal, or temptation and the light of justice."}, "simul": {"label": "All things made at once", "gloss": "Creavit omnia simul (Sir 18:1): the days are not successive."}, "six-days-literal": {"label": "Six real days", "gloss": "Created at once in matter, distinguished in form through six successive days (the common doctors, Bonaventure)."}, "principio-temporis": {"label": "In the beginning of time", "gloss": "The word dates the making: time began with the world, and there was no before (Onkelos, Bede, Rabanus, Remigius, Hugh)."}, "principio-in-filio": {"label": "In the Son", "gloss": "Principium is a proper name of the Word, on the strength of John 8:25 and Ps 104:24 (Ambrose, Augustine, Isidore, Alcuin, the Glossa, Rupert, Honorius)."}, "principio-first-of-all": {"label": "First of all things", "gloss": "'In the beginning' means before everything else that follows — in the beginning of the creatures, or on the first day (Augustine's second reading; Bruno, Abelard)."}, "principio-is-first-creature": {"label": "The first creature is a beginning", "gloss": "The first intellectual creature may be called a beginning to the things it heads (Augustine, De Genesi imperfectus)."}, "beginning-is-wisdom": {"label": "In Wisdom", "gloss": "The beginning is Wisdom — which is the Torah on one bench (Prov 8:22, Prov 3:19, Neofiti) and the Son on the other (Ps 104:24)."}, "reshit-is-torah": {"label": "The beginning is the Torah", "gloss": "Reshit is the Torah, called reshit darko: God looked into it as an architect into his plans and created the world (Bereshit Rabbah, Rashi)."}, "reshit-is-israel": {"label": "For the sake of Israel", "gloss": "Reshit is Israel, called reshit tevu'ato (Jer 2:3); the world was made for their sake."}, "reshit-construct": {"label": "'When God began to create'", "gloss": "Bereshit is a construct and the verse a subordinate clause: at the beginning of God's creating (Rashi's plain sense, Ibn Ezra; contested by Ramban)."}, "world-has-a-beginning": {"label": "The world is not eternal", "gloss": "The point of saying 'in the beginning' at all is that the world had one, against the philosophers (Ambrose, Remigius, Hugh, Ramban)."}, "bereshit-book-name": {"label": "It is the book's name", "gloss": "The Hebrews name volumes from their opening words, so bresith is the title of Genesis (Jerome, Wigbod, Angelomus)."}, "six-preceded": {"label": "Six things preceded the world", "gloss": "Torah and the Throne of Glory were made before it; the patriarchs, Israel, the Temple and the Messiah's name were contemplated (Bereshit Rabbah 1:4)."}, "read-it-twice": {"label": "Say the phrase twice", "gloss": "In principio is to be repeated — once in the Son, once at the beginning of time — rather than decided (Comestor)."}, "lux-corporalis": {"label": "A bodily light", "gloss": "A material light made to light material things, standing in the sun's place until the fourth day (Basil, Ambrose, Bede, Hugh, Honorius, Comestor, Bonaventure)."}, "lux-angelica": {"label": "The angelic creation", "gloss": "The light is the spiritual creature called 'heaven' in v. 1, made light by turning to its Creator (Augustine, Angelomus, Rupert)."}, "lux-hidden": {"label": "Stored for the righteous", "gloss": "Too good for the wicked, it was hidden away and is kept for the righteous in the time to come (Bereshit Rabbah, b. Chagigah, Rashi)."}, "lux-garment": {"label": "From the light of his garment", "gloss": "God wrapped himself in it like a garment (Ps 104:2); the heavens were stretched out of it (Bereshit Rabbah, Pirkei de-Rabbi Eliezer)."}, "lux-from-temple": {"label": "From the site of the Temple", "gloss": "The light was created from the place of the sanctuary (Ezek 43:2; Jer 17:12)."}, "lux-becomes-luminaries": {"label": "The luminaries were made from it", "gloss": "The nature of light was made on day one and hung in the firmament on day four (the sages in b. Chagigah 12a; an unnamed opinion in Augustine)."}, "lux-twilight": {"label": "A light like the dawn", "gloss": "Not the sun's brightness but what the sky is before sunrise or after sunset (Remigius, Honorius, Comestor, Hugh)."}, "lux-is-day": {"label": "'Light' just means day", "gloss": "The verse answers itself: he called the light Day, so light here is put for day (Bruno)."}, "lux-is-distinction": {"label": "The distinguishing of the works", "gloss": "The light is the confused heap becoming distinct and knowable, not a thing at all (Abelard)."}, "fiat-is-instantaneous": {"label": "Speaking is making", "gloss": "No interval between the command and the thing: the Hebrew says only 'let it be, and it was' (Ambrose, Basil, Angelomus, Abelard)."}, "pair-is-formless-matter": {"label": "Unformed matter", "gloss": "The pair names the matter God had made and not yet given form to (Augustine, Angelomus, Hugh, Comestor)."}, "pair-is-under-water": {"label": "Hidden under the waters", "gloss": "Invisible because the waters covered it, and because there was neither light nor anyone to see (Basil, Alcuin, Angelomus, Ibn Ezra)."}, "pair-is-unfurnished": {"label": "No seed, no living thing", "gloss": "Empty of shoots and void of animals: a list of what was not there yet (Bede, Remigius, Rupert, Abelard, Hugh, Comestor, the targums)."}, "pair-is-a-name-for-us": {"label": "A name fitted to slow minds", "gloss": "Not a description but the most serviceable word for formlessness, since earth and the deep are the least comely things men know (Augustine, Confessions XII)."}, "pair-many-senses": {"label": "More than one true reading", "gloss": "Five readings of the clause are all true and none can be shown to be Moses' own (Augustine, Confessions XII.21)."}, "pair-is-two-things": {"label": "A green line and slimy stones", "gloss": "Tohu and bohu are two creatures made on the first day: a line encircling the world, and stones sunk in the deep (b. Chagigah 12a, Sefer Yetzirah)."}, "pair-is-matter-and-form": {"label": "Matter and its form", "gloss": "Tohu is the hyle, which can hold no name; bohu is bo hu, the form it puts on (Ramban)."}, "pair-is-astonishment": {"label": "Astonishment", "gloss": "Tohu is what astonishes whoever looks at it — the earth bewildered at her lot, or the reader appalled at the emptiness (Bereshit Rabbah 2:2, Rashi, the Bahir)."}, "pair-is-history": {"label": "The verse tells history", "gloss": "The clause is the first term of a periodization: the generations from Adam, the four kingdoms, or the Church before her children (Bereshit Rabbah 2:1, 2:3, 2:4; Bruno)."}, "pair-is-our-flesh": {"label": "The earth of our flesh", "gloss": "The soul before it has taken the form of doctrine (Isidore, Wigbod, Rabanus, Remigius, Bruno)."}, "pair-is-not-of-heaven": {"label": "Said of earth, not of heaven", "gloss": "The phrase is withheld from heaven, which was filled with angels as soon as it was made (Bede, the Glossa, Angelomus, Abelard)."}, "heaven-first": {"label": "Heaven first", "gloss": "Beit Shammai: the word order is the order of the acts, and a king has his throne made before its footstool (Isa 66:1)."}, "earth-first": {"label": "Earth first", "gloss": "Beit Hillel: a builder raises the lower storey first (Amos 9:6), and Gen 2:4 and Ps 102:26 name the earth before the heavens."}, "both-at-once": {"label": "Both together", "gloss": "The sages, and R. Shimon ben Yoḥai's stewpot and its lid (Isa 48:13); Ambrose, that the order of naming gives heaven no privilege of the firstborn."}, "order-of-dignity": {"label": "Named for dignity, not order", "gloss": "Heaven stands first because it is worthier, or because the account is about to turn to the earth (Hugh of St Victor; R. Yoḥanan's creation-and-completion)."}, "created-then-stretched": {"label": "Created in one order, stretched in the other", "gloss": "Resh Lakish: heaven was created first, the earth was stretched out first — so both proof-texts stand."}, "heaven-earth-is-everything": {"label": "A name for the whole creation", "gloss": "Two visible words standing for all that God made, given so for the weakness of little ones (Augustine, Alcuin, Angelomus, Comestor)."}, "heaven-is-empyrean": {"label": "The empyrean heaven", "gloss": "Not the visible firmament but a fiery — from brightness, not heat — and intellectual heaven, filled with angels as soon as it was made (Remigius, the Glossa, Comestor)."}, "heaven-earth-four-elements": {"label": "The four elements", "gloss": "Heaven names fire and air, earth names earth and water; the verse announces the material first principles of bodies (Ambrose, Abelard, Ramban, Comestor)."}, "et-includes": {"label": "The particle includes", "gloss": "Et ha-shamayim brings in the sun, moon and constellations; ve-et ha-aretz the trees, the plants and the Garden of Eden (Bereshit Rabbah 1:14, b. Chagigah 12a, Ramban)."}, "shamayim-is-water": {"label": "Sham mayim — 'there is water'", "gloss": "The name itself says what heaven is made of: water, or fire and water mingled into the firmament (b. Chagigah 12a)."}, "one-earth-only": {"label": "One earth, and no heaven of heavens here", "gloss": "If the heavens of v. 1 were the intelligible heaven, the earth beside it could not be the ground; the seven earths are seven regions of the one (Ibn Ezra; Abelard, from the other end)."}, "whole-then-parts": {"label": "The whole first, then the parts", "gloss": "V. 1 is a heading: Scripture commends everything God made in two words before going through it with 'God said' (Augustine, Angelomus, the Glossa)."}, "de-nihilo": {"label": "Out of nothing", "gloss": "God made the world, and the matter of the world, from nothing whatever."}, "matter-then-formed": {"label": "Matter first, then formed", "gloss": "Formless matter was created first — first in origin, not in time — and everything else made out of it."}, "matter-is-coeval": {"label": "Matter was already there", "gloss": "God is a craftsman working on a material he did not make. Reported on both benches, held by neither."}, "three-principles": {"label": "God, exemplar, matter", "gloss": "The philosophers' three principles without a principle, named as the position to be refuted."}, "all-of-them-created": {"label": "Of every one of them, creation is written", "gloss": "Each thing the objector calls a pre-existing material has its own verse saying God created it."}, "bara-is-not-ex-nihilo": {"label": "'Created' does not mean from nothing", "gloss": "The verb bara is used of the sea-creatures and of man, who were made from something."}, "creare-vs-formare": {"label": "Created, not formed", "gloss": "Scripture keeps two verbs apart: what has no pre-existing matter is created, what is shaped out of matter is formed."}, "hyle-is-tohu": {"label": "The hyle is tohu", "gloss": "The one created thing is a substance without form, which the Greeks call hyle and Scripture calls tohu."}, "made-from-something-of-god": {"label": "From the light and the snow", "gloss": "Heaven from the light of his garment, earth from the snow beneath the Throne of Glory."}, "craftsman-needs-matter": {"label": "A craftsman needs a material", "gloss": "Wood helps the carpenter, silver the silversmith — the analogy that makes creation from nothing unthinkable."}, "silence-proves-nothing": {"label": "Scripture's silence proves nothing", "gloss": "That Genesis does not say when a thing was made does not make it coeternal with God."}, "world-from-tohu": {"label": "The world was made out of tohu va-vohu", "gloss": "Said with embarrassment, and only because the verse says it."}, "tenebrae-privatio": {"label": "Darkness is not a thing", "gloss": "Darkness is the absence of light, as silence is the ceasing of voice and nakedness the absence of a garment; Scripture never says God made it (Augustine, Angelomus, Hugh)."}, "tenebrae-creatura": {"label": "God made the darkness too", "gloss": "The darkness is a work of God like the light — it is called with the light to bless the Lord in Dan 3, and it is on the rabbinic lists of what was made on the first day (Remigius, the Glossa, Wigbod's pupil; Pirkei de-Rabbi Eliezer, R. Tanḥuma)."}, "tenebrae-angeli": {"label": "The darkness is the apostate angels", "gloss": "The light of day one is the angelic creation and the division is between the holy angels and the unclean (Augustine, City of God XI.19; Angelomus, Hugh, Rupert, Comestor)."}, "tenebrae-peccatores": {"label": "The wicked, or their deeds", "gloss": "The division is moral: the just from sinners (Isidore, Remigius, the Glossa), or the deeds of the righteous from the deeds of the wicked (R. Yanai, R. Abahu)."}, "tenebrae-ignis": {"label": "Darkness names the element of fire", "gloss": "'Darkness' in v. 2 is elemental fire, which is dark; the deep is water and the spirit is air (Ramban)."}, "divisio-loci": {"label": "Divided by place and quality", "gloss": "The two were set apart in space and time — light over the upper part of the world, twelve hours above and twelve below, opposite hemispheres in turn (Basil, Bede, Rabanus, Honorius, Comestor; and R. Yoḥanan's two generals, each given his bound)."}, "divisio-nominis": {"label": "The dividing is the naming", "gloss": "There is no separate act of separation: 'and he divided' means by the calling of names (Ibn Ezra; entertained once by Augustine and dropped)."}, "divisio-est-ordinatio": {"label": "He did not make it but ordered it", "gloss": "God makes the forms and orders the privations, as a singer orders his rests and a painter his shadows, so that even a nothing has its place (Augustine)."}, "divisio-est-judicium": {"label": "The division is a judgement", "gloss": "A sentence passed, and irreversible: on the devil and his angels (Rupert, Hugh), or on the just and sinners by foreknowledge (Isidore)."}, "divisio-est-instantanea": {"label": "The division needed no second act", "gloss": "The two were never mixed: by the very fact that light was made, the division followed, as putting on a garment ends nakedness (Augustine, Hugh)."}, "formatum-ab-informi": {"label": "The formed from the unformed", "gloss": "The dividing is the distinction of the formed thing from the unformed, of the perfect from the imperfect and the distinct from the confused (Wigbod, Abelard, Honorius)."}, "bonum-approbatio": {"label": "'He saw' is approval, not discovery", "gloss": "God did not learn that the light was good: what pleased him to be made pleased him to remain (Alcuin, Comestor), or the seeing is in the thought (Ibn Ezra), or a good work attests itself when seen (Ambrose)."}, "bonum-withheld": {"label": "The approval is deliberately withheld", "gloss": "'It was good' is not repeated after the division, and the divine name is dropped from the naming of the night, so that the darkness should not be approved along with the light (Augustine, Wigbod; R. Elazar, R. Abahu)."}, "havdala-derived": {"label": "The verse is the source of the havdala rule", "gloss": "'He saw … and he divided' — one does not bless over the lamp until he has used its light (R. Ze'eira of Caesarea)."}, "lux-hivdil-set-aside": {"label": "He set the light aside", "gloss": "Va-yavdel means he separated it off — for himself (R. Yehuda bar Simon), or for the righteous in the time to come, like a king setting aside a fine portion for his son (the Rabbis)."}, "one-authority-singular-verb": {"label": "The verb is singular, so one maker", "gloss": "Not vaydaberu but vaydaber, not bare'u but bara — no one may say that two authorities created the world (Bereshit Rabbah 1:7; Ibn Ezra; and, to the opposite end, Abelard)."}, "elohim-is-plural-of-persons": {"label": "Eloim is plural: three persons", "gloss": "El is singular and Eloim plural, showing a diversity of persons each of which is God; the singular verb shows that they are one creator and their works undivided (Abelard)."}, "elohim-is-honorific-plural": {"label": "A plural of honour", "gloss": "Every language honours the great with a plural — adonim, be'alim, the king speaking of himself in Arabic — so Elohim is the plural of eloah and means nothing more (Ibn Ezra)."}, "elohim-is-plural-of-powers": {"label": "The force of all forces", "gloss": "El hem: the root el is force, and 'they' points to all the other forces, so Elohim is the master of them all — with a secret not disclosed (Ramban)."}, "trinity-in-the-triad": {"label": "Father, Beginning, Spirit", "gloss": "The three persons are named in order across the first two verses: God the Father, the Beginning who is the Son, the Spirit borne over the waters (Augustine, Basil, Ambrose, Bede, Bruno, Honorius, the Glossa)."}, "trinity-in-the-formula": {"label": "The threefold formula of the six days", "gloss": "God said — and it was so — and God made: the testimony is tripled everywhere because the creating Trinity works everywhere (Rupert; considered and refused by Augustine)."}, "trinity-is-brought-to-the-text": {"label": "The rule of faith comes first", "gloss": "The catholic faith is set out before the exposition begins, because heretics drag Scripture to their own opinion; the doctrine is what the chapter is read under (Augustine, De Genesi ad litteram imperfectus)."}, "spirit-is-holy-spirit": {"label": "The spirit of v. 2 is the Holy Spirit", "gloss": "Not the air and not a wind: Scripture reserved the name, and no other spirit is meant but the one who completes the Trinity (Basil, Ambrose)."}, "principium-is-the-son": {"label": "The Beginning is the Son", "gloss": "'I am the beginning, who also speak to you' (John 8:25) — though the Father too is a beginning, and not from a beginning (Wigbod, Remigius, Bruno)."}, "not-to-angels": {"label": "Not spoken to the angels", "gloss": "Whoever the 'let us' addresses, it is not angels: man was not created by angels, or there would be many creators and not one (Bruno)."}, "word-order-is-modesty": {"label": "God is named after his works", "gloss": "A mortal king proclaims his name and builds afterwards; the Holy One made the needs of his world and was named after — bereshit bara, and only then Elohim (R. Yudan in the name of Akilas; Ben Azzai)."}, "word-order-is-dangerous": {"label": "The word order had to be changed", "gloss": "The seventy-two elders wrote 'God created in the beginning' for Ptolemy, so that bereshit could not be read as the subject (b. Megillah 9a)."}}, "senses": {"literal": "Literal", "allegorical": "Allegorical", "spiritual": "Spiritual", "translation": "Translation"}};
const svg = d3.select('#map'), panel = document.getElementById('panel');
const g = svg.append('g');
const gRings = g.append('g'), gHubLinks = g.append('g'), gEdges = g.append('g'), gHubs = g.append('g'), gNodes = g.append('g'), gLabels = g.append('g');
let W = 800, H = 600, mode = 'answers';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const wn = D.witnesses.map(w => ({...w, kind: 'w'}));
const byId = Object.fromEntries(wn.map(n => [n.id, n]));
const ansKeys = Object.keys(D.answers), senseKeys = Object.keys(D.senses);
const hubsA = ansKeys.map(k => ({id: 'hub:' + k, kind: 'hub', key: k, label: D.answers[k].label, gloss: D.answers[k].gloss, facet: 'answers'}));
const hubsS = senseKeys.map(k => ({id: 'hub:' + k, kind: 'hub', key: k, label: D.senses[k], gloss: '', facet: 'sense'}));
const hubById = Object.fromEntries([...hubsA, ...hubsS].map(h => [h.id, h]));
const threads = D.threads.map(t => ({...t, source: byId[t.from], target: byId[t.to]})).filter(t => t.source && t.target);
const hubLinksA = wn.flatMap(w => w.answers.map(a => ({source: w, target: hubById['hub:' + a]})));
const hubLinksS = wn.flatMap(w => w.senses.map(s => ({source: w, target: hubById['hub:' + s]})));

let k = 1;
function applyScale() {
  nodeSel.attr('r', d => (d.slot ? 6 : 7) / k).attr('stroke-width', 2 / k);
  labelSel.attr('font-size', 11 / k + 'px').attr('dx', 10 / k).attr('dy', 4 / k);
  edgeSel.attr('stroke-width', d => (d.type === 'contests' ? 1.8 : d.type === 'parallel' ? 2 : 1.4) / k).attr('stroke-dasharray', d => d.type === 'echoes' ? `${5/k} ${4/k}` : d.type === 'parallel' ? `${2/k} ${4/k}` : null);
  if (hubSel) { hubSel.attr('r', 13 / k).attr('stroke-width', 1.5 / k); hubLblSel.selectAll('.hublbl').attr('font-size', 12 / k + 'px').attr('y', 30 / k); hubLblSel.selectAll('.hubsub').attr('font-size', 10.5 / k + 'px').attr('y', 43 / k); hubLinkSel.attr('stroke-width', 1 / k).attr('stroke-dasharray', `${1/k} ${3/k}`); }
  gRings.selectAll('text').attr('font-size', 10 / k + 'px'); gRings.selectAll('circle').attr('stroke-width', 1 / k);
}
svg.call(d3.zoom().scaleExtent([.5, 6]).on('zoom', e => { g.attr('transform', e.transform); if (e.transform.k !== k) { k = e.transform.k; applyScale(); } }));

// ---------- drawing
const edgeSel = gEdges.selectAll('path').data(threads).join('path').attr('class', d => 'edge ' + d.type)
  .on('mouseenter', (e, d) => showEdge(d, true)).on('mouseleave', (e, d) => showEdge(d, false)).on('click', (e, d) => { showEdge(d, true); e.stopPropagation(); });
const nodeSel = gNodes.selectAll('circle').data(wn).join('circle').attr('class', d => 'node ' + d.tradition + (d.slot ? ' slot' : '')).attr('r', d => d.slot ? 6 : 7)
  .on('click', (e, d) => { showWitness(d); e.stopPropagation(); }).on('mouseenter', (e, d) => focusNode(d, true)).on('mouseleave', (e, d) => focusNode(d, false))
  .call(d3.drag().on('start', (e, d) => { d.fx = d.x; d.fy = d.y; }).on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; sim.alpha(.3).restart(); }).on('end', (e, d) => { d.fx = null; d.fy = null; }));
const labelSel = gLabels.selectAll('text').data(wn).join('text').attr('class', 'lbl').text(d => d.short);
let hubSel, hubLblSel, hubLinkSel;

const sim = d3.forceSimulation().on('tick', tick);
function tick() {
  edgeSel.attr('d', d => { const {source: s, target: t} = d; const dx = t.x - s.x, dy = t.y - s.y, dr = Math.hypot(dx, dy) * 1.4; return `M${s.x},${s.y}A${dr},${dr} 0 0,1 ${t.x},${t.y}`; });
  nodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
  labelSel.attr('x', d => d.x).attr('y', d => d.y);
  if (hubSel) { hubSel.attr('cx', d => d.x).attr('cy', d => d.y); hubLblSel.attr('transform', d => `translate(${d.x},${d.y})`); hubLinkSel.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y); }
}

function size() { const r = svg.node().getBoundingClientRect(); W = r.width; H = r.height; }

function layout() {
  size(); const cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 40;
  gRings.selectAll('*').remove(); gHubs.selectAll('*').remove(); gHubLinks.selectAll('*').remove(); hubSel = null;
  const labelR = d => d.kind === 'hub' ? 46 : 12 + d.short.length * 2.4;
  sim.nodes(wn).force('charge', null).force('link', null).force('x', null).force('y', null).force('hublink', null).force('collide', d3.forceCollide(labelR).strength(.9));
  if (mode === 'answers' || mode === 'sense') {
    const hubs = mode === 'answers' ? hubsA : hubsS, links = mode === 'answers' ? hubLinksA : hubLinksS;
    hubs.forEach((h, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / hubs.length; h.fx = cx + Math.cos(a) * R * .9; h.fy = cy + Math.sin(a) * R * .9; h.x = h.fx; h.y = h.fy; });
    sim.nodes([...wn, ...hubs]);
    sim.force('charge', d3.forceManyBody().strength(d => d.kind === 'hub' ? -80 : -320))
       .force('hublink', d3.forceLink(links).distance(mode === 'answers' ? 120 : 150).strength(.6))
       .force('link', d3.forceLink(threads).distance(120).strength(.04))
       .force('x', d3.forceX(cx).strength(.03)).force('y', d3.forceY(cy).strength(.03));
    hubLinkSel = gHubLinks.selectAll('line').data(links).join('line').attr('class', 'hublink');
    hubSel = gHubs.selectAll('circle').data(hubs).join('circle').attr('class', 'hub').attr('r', 13).on('click', (e, d) => { showHub(d); e.stopPropagation(); });
    hubLblSel = gHubs.selectAll('g').data(hubs).join('g');
    hubLblSel.append('text').attr('class', 'hublbl').attr('text-anchor', 'middle').attr('y', 30).text(d => d.label);
    hubLblSel.append('text').attr('class', 'hubsub').attr('text-anchor', 'middle').attr('y', 43).text(d => (mode === 'answers' ? hubLinksA : hubLinksS).filter(l => l.target === d).length + ' witnesses');
  } else if (mode === 'time') {
    const dates = wn.map(d => d.date), d0 = Math.min(...dates), d1 = Math.max(...dates);
    const rOf = d => 50 + (d - d0) / (d1 - d0) * (R - 50);
    [0, 500, 1000].forEach(y => { gRings.append('circle').attr('class', 'ring').attr('cx', cx).attr('cy', cy).attr('r', rOf(y)); gRings.append('text').attr('class', 'ringlbl').attr('x', cx + 4).attr('y', cy - rOf(y) - 4).text(y === 0 ? 'year 1' : y); });
    gRings.append('text').attr('class', 'ringlbl').attr('x', cx + R * .7).attr('y', cy + R + 26).text('LATIN →').attr('text-anchor', 'middle');
    gRings.append('text').attr('class', 'ringlbl').attr('x', cx - R * .7).attr('y', cy + R + 26).text('← RABBINIC').attr('text-anchor', 'middle');
    const groups = {'greek-jewish': [], latin: [], rabbinic: []}; wn.forEach(w => groups[w.tradition].push(w));
    Object.values(groups).forEach(a => a.sort((p, q) => p.date - q.date));
    groups['greek-jewish'].forEach(w => { w.tx = cx; w.ty = cy - rOf(w.date); });
    groups.latin.forEach((w, i, a) => { const t = -Math.PI * .42 + (i / Math.max(1, a.length - 1)) * Math.PI * .84; w.tx = cx + Math.cos(t) * rOf(w.date); w.ty = cy + Math.sin(t) * rOf(w.date); });
    groups.rabbinic.forEach((w, i, a) => { const t = Math.PI + Math.PI * .42 - (i / Math.max(1, a.length - 1)) * Math.PI * .84; w.tx = cx + Math.cos(t) * rOf(w.date); w.ty = cy + Math.sin(t) * rOf(w.date); });
    sim.force('x', d3.forceX(d => d.tx).strength(.6)).force('y', d3.forceY(d => d.ty).strength(.6)).force('collide', d3.forceCollide(d => 8 + d.short.length * 1.6).strength(.8));
  } else if (mode === 'place') {
    const lons = wn.map(d => d.lon).filter(Number.isFinite), lats = wn.map(d => d.lat).filter(Number.isFinite);
    const sx = d3.scaleLinear().domain([Math.min(...lons) - 2, Math.max(...lons) + 2]).range([60, W - 120]);
    const sy = d3.scaleLinear().domain([Math.min(...lats) - 1, Math.max(...lats) + 1]).range([H - 50, 50]);
    const seen = new Set();
    wn.forEach(w => { w.tx = sx(w.lon); w.ty = sy(w.lat); if (!seen.has(w.place)) { seen.add(w.place); gRings.append('text').attr('class', 'placelbl').attr('x', w.tx + 12).attr('y', w.ty - 12).text(w.place); } });
    sim.force('x', d3.forceX(d => d.tx).strength(.5)).force('y', d3.forceY(d => d.ty).strength(.5)).force('collide', d3.forceCollide(d => 8 + d.short.length * 1.6).strength(.8));
  }
  applyScale();
  sim.alpha(1).restart();
}

// ---------- panel
function showHome() {
  const q = D.crux.question;
  panel.innerHTML = `<p class="eyebrow">Crux · Genesis 1:4</p><h2>${esc(q.en)}</h2><p class="la-q">${esc(q.la)}</p><p class="heb-q">${esc(q.he)}</p>
  <p>${esc(D.crux.summary)}</p><p>${esc(D.crux.finding)}</p>
  <p class="hint"><b>Answers</b> gathers witnesses around the reading they give; a witness between two hubs holds both. <b>Time</b> is a clock: distance from the centre is the date, Latin to the right, rabbinic to the left. <b>Places</b> is a map. <b>Senses</b> sorts by literal, allegorical, spiritual, translation. Threads keep their meaning in every arrangement. Click a node or a hub; hover a line; drag to pull the graph apart; scroll to zoom: zooming spreads the graph while dots and labels keep their size.</p>`;
}
function showWitness(w) {
  const lem = Object.entries(w.lemma || {}).filter(([k]) => k !== 'en').map(([k, v]) => `<span class="${k === 'he' || k === 'arc' ? 'heb' : 'lat'}" dir="${k === 'he' || k === 'arc' ? 'rtl' : 'ltr'}">${esc(v)}</span>`).join(' ');
  const ocls = (w.olang === 'he' || w.olang === 'arc') ? 'heb' : 'lat';
  const ans = (w.answers || []).map(a => `<span>${esc(D.answers[a]?.label || a)}</span>`).join('');
  const ins = threads.filter(t => t.target === w), outs = threads.filter(t => t.source === w);
  const rel = [...outs.map(t => `→ ${t.type} · ${esc(t.target.short)}`), ...ins.map(t => `← ${t.type} · ${esc(t.source.short)}`)].join('<br>');
  panel.innerHTML = `<p class="eyebrow">${esc(w.tradition.replace('-', ' '))} · ${esc(w.datelabel)} · ${esc(w.place)}</p><h2>${esc(w.author)}</h2><p class="meta">${esc(w.source)}</p>
  <p class="lem">${lem}</p><p>${esc(w.en)}</p><div class="orig ${ocls}">${esc(w.orig)}</div><div class="ans">${ans}</div><p class="note">${esc(w.notes)}</p>
  <p class="cred">${w.translator === 'claude-draft' ? 'Draft English (Claude), awaiting Wilson' : 'English: ' + esc(w.translator)}</p>${rel ? `<p class="cred">${rel}</p>` : ''}`;
  panel.scrollTop = 0;
}
function showHub(h) {
  const links = (h.facet === 'answers' ? hubLinksA : hubLinksS).filter(l => l.target === h);
  panel.innerHTML = `<p class="eyebrow">${h.facet === 'answers' ? 'Answer family' : 'Sense'}</p><h2>${esc(h.label)}</h2><p>${esc(h.gloss)}</p>
  <p class="cred">${links.map(l => esc(l.source.short) + ' · ' + esc(l.source.datelabel)).join('<br>')}</p>`;
  nodeSel.classed('dim', d => !links.some(l => l.source === d)); labelSel.classed('dim', d => !links.some(l => l.source === d));
}
function showEdge(t, on) {
  edgeSel.classed('on', d => on && d === t);
  nodeSel.classed('on', d => on && (d === t.source || d === t.target));
  if (on) { panel.innerHTML = `<p class="eyebrow">${esc(t.type)} · ${esc(t.source.short)} → ${esc(t.target.short)}</p><div class="ev">${esc(t.evidence)}</div>`; }
}
function focusNode(w, on) {
  edgeSel.classed('dim', d => on && d.source !== w && d.target !== w);
  nodeSel.classed('dim', d => on && d !== w && !threads.some(t => (t.source === w && t.target === d) || (t.target === w && t.source === d)));
  labelSel.classed('dim', d => on && d !== w && !threads.some(t => (t.source === w && t.target === d) || (t.target === w && t.source === d)));
}
