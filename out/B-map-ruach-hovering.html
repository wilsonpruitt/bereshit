<style>
:root{--bg:#F3F4F1;--ink:#1A1E21;--mute:#5B615E;--rule:#CBCFC9;--card:#FAFAF7;--lat:#A0392A;--rab:#2B4A9C;--grk:#67762B;--hub:#1A1E21;--ring:#DDE0DA;
 --e-cites:#1A1E21;--e-echo:#7A807C;--e-contest:#A0392A;--e-par:#B4B9B4;--e-trans:#2B4A9C;
 --serif:"EB Garamond",Garamond,"Times New Roman",serif;--sans:Inter,system-ui,sans-serif;--heb:"Frank Ruhl Libre","Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151819;--ink:#E7E5DD;--mute:#9AA09B;--rule:#33393B;--card:#1C2022;--lat:#E28A73;--rab:#8EA6EC;--grk:#B9C66A;--hub:#E7E5DD;--ring:#24292B;--e-cites:#E7E5DD;--e-echo:#8A908C;--e-contest:#E28A73;--e-par:#4C5250;--e-trans:#8EA6EC}}
:root[data-theme="dark"]{--bg:#151819;--ink:#E7E5DD;--mute:#9AA09B;--rule:#33393B;--card:#1C2022;--lat:#E28A73;--rab:#8EA6EC;--grk:#B9C66A;--hub:#E7E5DD;--ring:#24292B;--e-cites:#E7E5DD;--e-echo:#8A908C;--e-contest:#E28A73;--e-par:#4C5250;--e-trans:#8EA6EC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);height:100vh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--rule);font:13px var(--sans)}
.bar .t{font:500 15px var(--serif);margin-right:auto}
.bar .t small{font:500 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-right:10px}
.modes{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.modes button{font:500 12.5px var(--sans);background:none;border:0;border-right:1px solid var(--rule);color:var(--mute);padding:6px 12px;cursor:pointer}
.modes button:last-child{border-right:0}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.modes button:focus-visible,.f label:focus-within{outline:2px solid var(--rab);outline-offset:1px}
.f{display:flex;gap:12px;color:var(--mute)}
.f label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.f i{display:inline-block;width:22px;border-top:2px solid var(--e-cites)}
.f .echoes i{border-top-style:dashed;border-color:var(--e-echo)} .f .contests i{border-color:var(--e-contest)} .f .parallel i{border-top-style:dotted;border-top-width:3px;border-color:var(--e-par)} .f .transmits i{border-color:var(--e-trans)}
.trad{display:flex;gap:12px;color:var(--mute)}
.trad span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
#map{width:100%;height:100%;display:block;cursor:grab}
#map:active{cursor:grabbing}
.panel{border-left:1px solid var(--rule);overflow:auto;padding:20px 22px 40px;font-size:16.5px;line-height:1.5}
.panel .eyebrow{font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.panel h2{font:500 22px/1.2 var(--serif);margin:0 0 4px;text-wrap:balance}
.panel .meta{font:12.5px var(--sans);color:var(--mute);margin:0 0 12px}
.panel .lem{font-size:18px;margin:0 0 10px} .panel .lem .heb{font-family:var(--heb);font-size:19px} .panel .lem .lat{font-style:italic}
.panel .orig{margin:12px 0 0;padding:10px 12px;background:var(--card);border-left:1px solid var(--rule);font-size:15.5px}
.panel .orig.heb{font-family:var(--heb);direction:rtl;text-align:right;font-size:18px;line-height:1.8}
.panel .orig.lat{font-style:italic}
.panel .note{font-size:15px;color:var(--mute);margin:12px 0 0}
.panel .cred{font:12px var(--sans);color:var(--mute);margin-top:12px}
.panel .ans{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.panel .ans span{font:500 11px var(--sans);border:1px solid var(--rule);padding:2px 7px;border-radius:2px}
.panel .ev{border-top:2px solid var(--ink);padding-top:8px}
.panel .heb-q{font-family:var(--heb);direction:rtl;text-align:right;font-size:20px}
.panel .la-q{font-style:italic;font-size:19px}
.panel .hint{font:13px/1.5 var(--sans);color:var(--mute);margin-top:18px;border-top:1px solid var(--rule);padding-top:10px}
svg text{font-family:var(--sans);fill:var(--ink);pointer-events:none}
.lbl{font-size:11px} .lbl.dim{opacity:.35}
.hublbl{font-size:12px;font-weight:600;fill:var(--ink)} .hubsub{font-size:10.5px;fill:var(--mute)}
.ring{fill:none;stroke:var(--ring);stroke-width:1} .ringlbl{font-size:10px;fill:var(--mute);letter-spacing:.08em}
.placelbl{font-size:10px;fill:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.edge{fill:none;stroke-width:1.4;cursor:pointer;transition:opacity .2s}
.edge.cites{stroke:var(--e-cites)} .edge.echoes{stroke:var(--e-echo);stroke-dasharray:5 4} .edge.contests{stroke:var(--e-contest);stroke-width:1.8} .edge.parallel{stroke:var(--e-par);stroke-dasharray:2 4;stroke-width:2} .edge.transmits{stroke:var(--e-trans)}
.edge.on{stroke-width:3.2} .edge.dim{opacity:.12} .edge.hidden{display:none}
.hublink{fill:none;stroke:var(--rule);opacity:.6}
.node{cursor:pointer;stroke:var(--bg);stroke-width:2}
.node.latin{fill:var(--lat)} .node.rabbinic{fill:var(--rab)} .node.greek-jewish{fill:var(--grk)}
.node.slot{fill:none;stroke:var(--mute);stroke-dasharray:2 2}
.node.dim{opacity:.25} .node.on{stroke:var(--ink);stroke-width:3}
.hub{fill:var(--bg);stroke:var(--hub);stroke-width:1.5;cursor:pointer}
@media (max-width:860px){.main{grid-template-columns:1fr;grid-template-rows:1fr 42vh}.panel{border-left:0;border-top:1px solid var(--rule)}}
@media (prefers-reduced-motion:reduce){.edge{transition:none}}

<script>
const D = {"crux": {"id": "ruach-hovering", "question": {"en": "Wind, spirit, or Spirit — and what is 'hovering'?", "la": "Quis est Spiritus Dei, et quid est ferri super aquas?", "he": "מַה הִיא רוּחַ אֱלֹהִים, וּמַהוּ ׳מְרַחֶפֶת׳?"}, "summary": "The Hebrew verb merahefet occurs once more in the Bible, of an eagle over its nest (Deut 32:11). Greek and Latin flattened it to 'was borne over'. Then, on both benches, a bird came back: Jerome and the Syrian read it as brooding warmth, Ben Zoma and Rashi as a dove hovering and not touching. Same verb, opposite pictures; and around each picture a whole doctrine of how God acts on matter. The Latin line splits again between the bird and Augustine's craftsman whose will is 'above' the wood.", "finding": "Rashi's Old French acoveter and Jerome's incubabat are the same word for the same Hebrew, with no contact. Abelard is the one Latin who reports the Hebrew as 'fluttering' (volitabat), on the rabbinic side of the verb."}, "witnesses": [{"id": "lxx-1-2", "short": "Septuagint", "author": "The Seventy", "tradition": "greek-jewish", "date": -250, "datelabel": "c. 250 BCE", "place": "Alexandria", "lat": 31.2, "lon": 29.92, "answers": ["borne-over"], "senses": ["translation"], "lemma": {"el": "πνεῦμα θεοῦ ἐπεφέρετο ἐπάνω τοῦ ὕδατος", "en": "a spirit of God was borne upon the water"}, "en": "But the earth was unsightly and unfurnished, and darkness was over the deep, and the Spirit of God moved over the water.", "translator": "Brenton 1851", "orig": "ἡ δὲ γῆ ἦν ἀόρατος καὶ ἀκατασκεύαστος, καὶ σκότος ἐπάνω τῆς ἀβύσσου, καὶ πνεῦμα θεοῦ ἐπεφέρετο ἐπάνω τοῦ ὕδατος.", "olang": "el", "source": "LXX Gen 1:2 (Rahlfs)", "notes": "ἐπεφέρετο ('was borne upon') is the reading every Latin 'ferebatur / superferebatur' descends from. The Greek already drops the bird: the verb is motion-over, not brooding.", "slot": false}, {"id": "vulgate-1-2", "short": "Vulgate", "author": "Jerome", "tradition": "latin", "date": 392, "datelabel": "c. 392", "place": "Bethlehem", "lat": 31.7, "lon": 35.2, "answers": ["borne-over"], "senses": ["translation"], "lemma": {"la": "Spiritus Dei ferebatur super aquas", "en": "the Spirit of God was borne over the waters"}, "en": "But the earth was empty and void, and darkness [was] upon the face of the deep, and the Spirit of God was borne over the waters.", "translator": "claude-draft", "orig": "Terra autem erat inanis et vacua, et tenebrae [ Vulg. addit erant] super faciem abyssi, et Spiritus Dei ferebatur super aquas.", "olang": "la", "source": "PL 28, col. 163C", "notes": "Jerome's own Vulgate keeps the Old Latin/LXX 'ferebatur' even though his Hebrew Questions (same decade) insist the Hebrew means brooding. The Latin bench inherits the verb he declined to change. PL 28 prints Jerome's text without 'erant' and flags the Vulgate's addition.", "slot": false}, {"id": "targ-onk-1-2", "short": "Onkelos", "author": "Targum Onkelos", "tradition": "rabbinic", "date": 200, "datelabel": "c. 200", "place": "Babylonia (Sura / Pumbedita)", "lat": 32.5, "lon": 44.4, "answers": ["wind"], "senses": ["translation"], "lemma": {"arc": "וְרוּחָא מִן קֳדָם יְיָ מְנַשְּׁבָא", "en": "and a wind from before the LORD was blowing"}, "en": "And the earth was waste and empty, and darkness was spread over the face of the deep, and a wind from before the LORD was blowing over the face of the waters.", "translator": "claude-draft", "orig": "וְאַרְעָא הֲוַת צָדְיָא וְרֵיקַנְיָא וַחֲשׁוֹכָא פָּרַשׂ עַל אַפֵּי תְהוֹמָא וְרוּחָא מִן קֳדָם יְיָ מְנַשְּׁבָא עַל אַפֵּי מַיָּא", "olang": "arc", "source": "Sefaria, 'Onkelos Genesis'", "notes": "Onkelos makes two decisions at once: ruach is a wind, not a spirit, and 'from before the LORD' keeps God at a remove; merahefet becomes menashva, 'blowing'. No bird, no hovering. Etheridge's PD English exists on Sefaria but did not return by version title; fetch from archive.org.", "slot": false}, {"id": "targ-neof-1-2", "short": "Neofiti", "author": "Targum Neofiti", "tradition": "rabbinic", "date": 300, "datelabel": "100–400", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["spirit-of-mercy"], "senses": ["translation"], "lemma": {"arc": "וְרוּחַ דְּרַחֲמִין מִן קֳדָם יְיָ הֲוָה מְנַשְּׁבָא", "en": "and a spirit of mercy from before the LORD was blowing"}, "en": "In the beginning, with wisdom, the Word of the LORD created and perfected the heavens and the earth. And the earth was waste and empty, desolate of human and beast, empty of all tillage of plants and of trees; and darkness was spread over the face of the deep, and a spirit of mercy from before the LORD was blowing over the face of the waters.", "translator": "claude-draft", "orig": "מלקדמין בחכמה [בחוכמתא] ברא (ד)יי שכלל [ושכלל] ית שמיא וית ארעא: וארעא הוות תהיא ובהיא וצדי [וצדיה] מן בר נש ומן בעיר וריקנא מן כל פלחן צמחין ומן אילנין וחשוכא פריס על אפי תהומא ורוח דרחמין מן קדם יי הוה מנשבא על אפי מיא: ואמר ממ(רא) [נ\"א ממרה] דיי יהוי נהור והות נהור כגזירת ממריה׃ וגלי קדם יי ית נהורא ארום טב הוא ואפשר ממרא דיי בין נהורא לבין חשוכא׃ וקרא ממרא דיי לנהורא איממ׳ ולחשוכא קרא לליא והוא רמש והוה צפר סדר עבד בראשית יום קדמאיי׃ ואמר ממרא דיי יהוי רקיעא במציעות מיא ויהוי מפרש בין מיא ארעא לבין מיא עיליא׃ וברא יי ית רקיעא ואפרש בין מיא די מן תחות רקיעא ובין מיא די מלעיל לרקיעא [לרקיע שמיא] והוה כן כמימריה׃ וקרא ממרא דיי לרקיעא שמיא והוה רמש והוה צפר סדר עבד בראשית יום תניין׃", "olang": "arc", "source": "Sefaria, Vatican MS Neofiti 1 (whole of 1:1–5 in one segment)", "notes": "'Spirit of mercy' answers the wind/spirit question in a third way: neither the weather nor the Holy Spirit but a divine disposition. Neofiti's 1:1 'with wisdom' is the K1 anchor. Hebrew licence on Sefaria is 'unknown' — the MS transcription is PD in substance; confirm before embedding.", "slot": false}, {"id": "targ-psj-1-2", "short": "Ps.-Jonathan", "author": "Targum Pseudo-Jonathan", "tradition": "rabbinic", "date": 750, "datelabel": "600–800", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["spirit-of-mercy"], "senses": ["translation"], "lemma": {"arc": "וְרוּחַ רַחֲמִין מִן קֳדָם יְיָ מְנַתְבָא", "en": "and a spirit of mercies from before the LORD breathed"}, "en": "And the earth was vacancy and desolation, solitary of the sons of men, and void of every animal; and darkness was upon the face of the abyss, and the Spirit of mercies from before the Lord breathed upon the face of the waters.", "translator": "Etheridge 1862", "orig": "וְאַרְעָא הֲוַת תַּהֲיָיא וּבַהֲיָיא צַדְיָא מִבְּנֵי נַשׁ וְרֵיקַנְיָא מִן כָּל בְּעִיר וַחֲשׁוֹכָא עַל אַפֵּי תְהוֹמָא וְרוּחַ רַחֲמִין מִן קֳדָם יְיָ מְנַתְבָא עַל אַנְפֵּי מַיָא", "olang": "arc", "source": "Sefaria, 'Targum Jonathan on Genesis'", "notes": "Same 'spirit of mercies' as Neofiti; the verb menatva ('breathed / blew') keeps the Onkelos line. Etheridge embedded verbatim (PD).", "slot": false}, {"id": "br-2-4", "short": "Bereshit Rabbah 2:4", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["messiah", "bird-hovering"], "senses": ["allegorical", "literal"], "lemma": {"he": "וְרוּחַ אֱלֹהִים מְרַחֶפֶת", "en": "and the spirit of God was hovering"}, "en": "“And the spirit of God was hovering” – this is the spirit of the messianic king, as it says: “The spirit of the Lord will rest upon him” (Isaiah 11:2). By what merit will it [the Messianic kingdom] come? “Hovering over the surface of the water” – by the merit of repentance, that is likened to water, as it is stated: “Pour out your heart like water [before the face of the Lord]” (Lamentations 2:19). Rabbi Ḥagai said in the name of Rabbi Pedat: A covenant is made with the water, that even when the weather is hot, the wind blows over it. It happened once that Rabbi Shimon ben Zoma was sitting, entranced in thought. Rabbi Yehoshua passed and greeted him once, twice, but he did not answer him. The third time, he answered him with a start. He said to him: ‘Ben Zoma, where were your thoughts?’ He said to him: ‘I have been contemplating.’ He said to him: ‘As the heavens and the earth are my witnesses, I shall not move from here until you inform me where your thoughts were.’ He said to him: ‘I was looking at the act of Creation, and [I saw that] between the upper waters and the lower waters there were only two or three fingerbreadths. “The spirit of the Lord was blowing” is not written, but rather, “was hovering” – like a bird that flaps its wings, they touch [the nest] but do not quite touch.’ Rabbi Yehoshua turned and said to his disciples: Ben Zoma is gone. Not even a few days passed with ben Zoma still in the world.", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "וְרוּחַ אֱלֹהִים מְרַחֶפֶת, זֶה רוּחוֹ שֶׁל מֶלֶךְ הַמָּשִׁיחַ, הֵיאַךְ מָה דְאַתְּ אָמַר (ישעיה יא, ב): וְנָחָה עָלָיו רוּחַ ה', בְּאֵיזוֹ זְכוּת מְמַשְׁמֶשֶׁת וּבָאָה, הַמְרַחֶפֶת עַל פְּנֵי הַמָּיִם, בִּזְכוּת הַתְּשׁוּבָה שֶׁנִּמְשְׁלָה כַּמַּיִם, שֶׁנֶּאֱמַר (איכה ב, יט): שִׁפְכִי כַמַּיִם לִבֵּךְ. רַבִּי חַגַּי בְּשֵׁם רַבִּי פְּדָת אָמַר, בְּרִית כְּרוּתָה לַמַּיִם שֶׁאֲפִלּוּ בִּשְׁעַת שָׁרָב רוּחָה שַׁיְיפָה, וּכְבָר הָיָה רַבִּי שִׁמְעוֹן בֶּן זוֹמָא יוֹשֵׁב וְתוֹהֶא, וְעָבַר רַבִּי יְהוֹשֻׁעַ וְשָׁאַל בִּשְׁלוֹמוֹ, פַּעַם וּשְׁתַּיִם וְלֹא הֵשִׁיבוֹ, בַּשְׁלִישִׁית הֵשִׁיבוֹ בִּבְהִילוּת, אָמַר לוֹ בֶּן זוֹמָא מֵאַיִן הָרַגְלַיִם, אָמַר לוֹ מְעַיֵּן הָיִיתִי, אָמַר לוֹ מֵעִיד אֲנִי עָלַי שָׁמַיִם וָאָרֶץ שֶׁאֵינִי זָז מִכָּאן עַד שֶׁתּוֹדִיעֵנִי מֵאַיִן הָרַגְלַיִם. אָמַר לוֹ מִסְתַּכֵּל הָיִיתִי בְּמַעֲשֵׂה בְרֵאשִׁית, וְלֹא הָיָה בֵּין מַיִם הָעֶלְיוֹנִים לַמַּיִם הַתַּחְתּוֹנִים אֶלָּא כִּשְׁתַּיִם וְשָׁלשׁ אֶצְבָּעוֹת, וְרוּחַ אֱלֹהִים מְנַשֶּׁבֶת אֵין כְּתִיב כָּאן אֶלָּא מְרַחֶפֶת, כָּעוֹף הַזֶּה שֶׁהוּא מְרַפְרֵף בִּכְנָפָיו וּכְנָפָיו נוֹגְעוֹת וְאֵינָן נוֹגְעוֹת. נֶהְפַּךְ רַבִּי יְהוֹשֻׁעַ וְאָמַר לְתַלְמִידָיו, הָלַךְ לוֹ בֶּן זוֹמָא, וְלֹא שָׁהוּ יָמִים מֻעָטִים וּבֶן זוֹמָא בָּעוֹלָם.", "olang": "he", "source": "Bereshit Rabbah 2:4 (Vilna numbering; Theodor–Albeck differs)", "notes": "Two answers in one section. Resh Lakish: the ruach is the spirit of the King Messiah (Isa 11:2), brought by repentance-as-water. Then the Ben Zoma story: 'blowing' is not written but 'hovering' — like a bird beating its wings, touching and not touching. Note the bird is an unspecified 'of' and the claim is touching-and-not-touching; the Bavli's version has a dove and no touching at all.", "slot": false}, {"id": "b-chag-15a", "short": "Chagigah 15a", "author": "Babylonian Talmud", "tradition": "rabbinic", "date": 550, "datelabel": "redaction 500–600", "place": "Babylonia (Sura / Pumbedita)", "lat": 32.5, "lon": 44.4, "answers": ["bird-hovering"], "senses": ["literal"], "lemma": {"he": "כְּיוֹנָה שֶׁמְּרַחֶפֶת עַל בָּנֶיהָ וְאֵינָהּ נוֹגַעַת", "en": "like a dove that hovers over her young and does not touch"}, "en": "Our rabbis taught: It once happened that Rabbi Yehoshua ben Ḥananya was standing on a step on the Temple Mount, and Ben Zoma saw him and did not rise before him. He said to him: From where and to where, Ben Zoma? He said to him: I was gazing between the upper waters and the lower waters, and between the one and the other there are only three fingerbreadths, as it is said, 'and the spirit of God was hovering over the face of the waters' (Gen 1:2) — like a dove that hovers over her young and does not touch them. Rabbi Yehoshua said to his disciples: Ben Zoma is still outside. — Now, 'the spirit of God was hovering over the face of the waters': when was that? On the first day. But the dividing was on the second day, as it is written, 'and let it divide water from water' (Gen 1:6). And how much [lies between them]? Rav Aḥa bar Yaakov said: a hair's breadth. The rabbis say: like the gap between the planks of a bridge. Mar Zutra, or some say Rav Ashi, said: like two cloaks spread one over the other; and some say, like two cups tipped one upon the other.", "translator": "claude-draft", "orig": "ת\"ר מעשה ברבי יהושע בן חנניה שהיה עומד על גב מעלה בהר הבית וראהו בן זומא ולא עמד מלפניו אמר לו מאין ולאין בן זומא אמר לו צופה הייתי בין מים העליונים למים התחתונים ואין בין זה לזה אלא שלש אצבעות בלבד שנאמר (בראשית א, ב) ורוח אלהים מרחפת על פני המים כיונה שמרחפת על בניה ואינה נוגעת אמר להן רבי יהושע לתלמידיו עדיין בן זומא מבחוץ מכדי ורוח אלהים מרחפת על פני המים אימת הוי ביום הראשון הבדלה ביום שני הוא דהואי דכתיב (בראשית א, ו) ויהי מבדיל בין מים למים וכמה אמר רב אחא בר יעקב כמלא נימא ורבנן אמרי כי גודא דגמלא מר זוטרא ואיתימא רב אסי אמר כתרי גלימי דפריסי אהדדי ואמרי לה כתרי כסי דסחיפי אהדדי", "olang": "arc", "source": "b. Chagigah 15a (Vilna)", "notes": "The Bavli's Ben Zoma reads merahefet as a physical fact about distance: hovering measures the gap between upper and lower waters. The anonymous continuation then argues the gap into a hair's breadth. Steinsaltz/Davidson English is CC BY-NC and is NOT embedded; this is a fresh draft against the Wikisource Aramaic.", "slot": false}, {"id": "rashi-1-2b", "short": "Rashi", "author": "Rashi", "tradition": "rabbinic", "date": 1090, "datelabel": "1080–1105", "place": "Troyes", "lat": 48.3, "lon": 4.08, "answers": ["bird-hovering", "throne"], "senses": ["literal"], "lemma": {"he": "כְּיוֹנָה הַמְרַחֶפֶת עַל הַקֵּן", "en": "as a dove hovering over the nest"}, "en": "ורוח אלהים מרחפת AND THE SPIRIT OF GOD WAS HOVERING — The throne of Divine Glory was standing in space, hovering over the face of the waters by the breath of the mouth of the Holy One, blessed be He, and by His command, even as a dove hovers over its nest. In old French acoveter.", "translator": "Rosenbaum–Silbermann 1929–34", "orig": "ורוח אלהים מרחפת. כִּסֵא הַכָּבוֹד עוֹמֵד בָּאֲוִיר וּמְרַחֵף עַל פְּנֵי הַמַּיִם בְּרוּחַ פִּיו שֶׁל הַקָּבָּ\"ה וּבְמַאֲמָרוֹ, כְּיוֹנָה הַמְרַחֶפֶת עַל הַקֵּן, אקוב\"טיר בְּלַעַ\"ז:", "olang": "he", "source": "Rashi on Gen 1:2, s.v. ורוח אלהים מרחפת", "notes": "Rashi's dove over the nest is the Bavli's dove (Chagigah 15a), not Bereshit Rabbah's unspecified bird. The Old French gloss acoveter means 'to cover, to brood' — which is exactly Jerome's incubabat. Rashi and Jerome, seven centuries apart, gloss the same Hebrew verb with the same vernacular sense from opposite sides. The Throne of Glory standing in the air is from a different source [CHECK: PdRE / Midrash Konen].", "slot": false}, {"id": "basil-hex-lat-2-6", "short": "Basil (Eustathius)", "author": "Basil of Caesarea", "tradition": "latin", "date": 400, "datelabel": "c. 400", "place": "Caesarea in Cappadocia", "lat": 38.72, "lon": 35.49, "answers": ["brooding-warmth"], "senses": ["literal"], "lemma": {"la": "fovebat et vivificabat aquarum naturam, ad similitudinem gallinae cubantis", "en": "warmed and quickened the nature of the waters, like a hen sitting"}, "en": "How, then, was this Spirit borne above the waters? I will tell you not my own account but that of a certain man, a Syrian by birth, who was as far from the wisdom of this age as he was reckoned near to true doctrine. He used to say that the Syrian tongue is the more expressive, and that because of its kinship with Hebrew it comes closer to the idiom of the Scriptures. The sense of his saying, then, is this: 'was borne above,' he says, means that the Spirit warmed and quickened the nature of the waters, in the likeness of a hen sitting on her eggs, putting a living power into the things that were being warmed. So the reason for the phrase 'was borne above' is explained thus: he was driving the nature of the waters toward being quickened. From this the point that some so insistently demand can be sufficiently proved: that the Holy Spirit does not lack generative power.", "translator": "claude-draft", "orig": "Quomodo ergo hic spiritus aquis superferebatur? dicam tibi non meum sermonem, sed viri cujusdam genere Syri, qui tantum aberat a sapientia saeculi quantum verae doctrinae proximus habebatur. Dicebat enim Syrorum vocem facundiorem esse, et propter Hebraicae linguae cognationem, Scripturarum magis sermonibus indulsisse. Sensus itaque dicti illius hoc modo est: Superferebatur, inquit, Spiritus, hoc est fovebat et vivificabat aquarum naturam, ad similitudinem gallinae cubantis: vitalem virtutem his quae fovebantur injiciens. Hujusmodi ergo ratio quod dixit superferebatur, sic interpretatur, id est ad vivificandam aquarum naturam compellebat. Ex quo sufficienter etiam illud quod a quibusdam valde requiritur, approbari potest: quia nec genitali potentia Spiritus sanctus caret.", "olang": "la", "source": "PL 53, col. 886C", "notes": "Basil, Hexaemeron II.6, delivered in Greek in 378; the Latin bench read it in Eustathius' version (c. 400). The unnamed Syrian is the source of the whole Latin 'warming' line: Ambrose, Augustine, Rupert, Abelard, Comestor all descend from this paragraph. Basil's bird is a hen (gallina); Jerome's, independently, is a generic volucris.", "slot": false}, {"id": "ambrose-hex-1-8-29", "short": "Ambrose", "author": "Ambrose", "tradition": "latin", "date": 387, "datelabel": "c. 387", "place": "Milan", "lat": 45.46, "lon": 9.19, "answers": ["brooding-warmth", "trinity"], "senses": ["literal"], "lemma": {"la": "Syrus … sic habet: Et Spiritus Dei fovebat aquas", "en": "the Syriac has: And the Spirit of God warmed the waters"}, "en": "…especially since there follows: 'And the Spirit of God was borne above the waters.' Some take this as the air, others as the breath we draw and take in, the breath of this life-giving atmosphere; but we, agreeing with the judgment of the saints and the faithful, take it as the Holy Spirit, so that in the founding of the world the working of the Trinity may shine out. […] Finally the Syriac, which is neighbor to the Hebrew and in most things agrees and chimes with it in wording, has it thus: 'And the Spirit of God warmed the waters,' that is, quickened them, so as to gather them into new creatures and by his warmth bring them alive. For we also read that the Holy Spirit is creator, Job saying, 'The divine Spirit who made me' (Job 33:4).", "translator": "claude-draft", "orig": "maxime cum sequatur: Et spiritus Dei superferebatur super aquas (Ibid.) . Quem etsi aliqui pro aere accipiant, aliqui pro spiritu quem spiramus et carpimus aurae hujus vitalis spiritum; nos tamen cum sanctorum et fidelium sententia congruentes, Spiritum sanctum accipimus, ut in constitutione mundi operatio Trinitatis eluceat. Praemisso enim quia in principio fecit Deus coelum et terram, id est in Christo fecit Deus, vel Filius Dei Deus fecit, vel per Filium Deus fecit; quia omnia per ipsum facta sunt, et sine ipso factum est nihil, supererat plenitudo operationis in Spiritu, sicut scriptum est: Verbo Domini coelis firmati sunt, et Spiritu oris ejus omnis virtus eorum (Ps. XXXII, 6) . Itaque quemadmodum in Psalmo docemur operationem Verbi, quod est Verbum Dei, et virtutem quam dedit Spiritus sanctus; ita hic propheticum resultavit oraculum, quia Deus dixit, et Deus fecit. Spiritus quoque Dei superferebatur super aquas. Ornando enim polo coeli, germinaturis terris pulchre Spiritus superferebatur, quia per ipsum habebant novorum partuum semina germinare, secundum quod dixit propheta: 17 Emitte Spiritum tuum et creabuntur, et renovabis faciem terrae (Ps. CIII, 30) . Denique Syrus, qui vicinus Hebraeo est, et sermone consonat in plerisque et congruit, sic habet: Et Spiritus Dei fovebat aquas, id est vivificabat, ut in novas cogeret creaturas, et fotu suo animaret ad vitam. Nam etiam Spiritum sanctum legimus creatorem, dicente Job, Spiritus divinus qui fecit me (Job. XXXIII, 4) .", "olang": "la", "source": "PL 14, col. 138C", "notes": "Ambrose is reading Basil's Greek directly (Milan, 387; Eustathius' Latin is later). He carries the Syriac 'warmed' but drops the hen. The Latin excerpt here spans two columns; the middle (Ps 33:6 on Word and Spirit) is elided in the English.", "slot": false}, {"id": "jerome-hq-1-2", "short": "Jerome", "author": "Jerome", "tradition": "latin", "date": 391, "datelabel": "c. 391", "place": "Bethlehem", "lat": 31.7, "lon": 35.2, "answers": ["brooding-warmth"], "senses": ["literal"], "lemma": {"he": "מְרַחֶפֶת", "la": "incubabat, sive confovebat", "en": "was brooding, or warming"}, "en": "'And the Spirit of God was borne over the waters.' For what our copies have as 'was borne,' the Hebrew has MERAHEFET, which we may render 'was brooding' or 'was warming,' in the likeness of a bird quickening her eggs with her heat. From this we understand that it is not said of the spirit of the world, as some suppose, but of the Holy Spirit, who is himself called the giver of life to all things from the beginning. And if giver of life, then consequently creator; and if creator, then God. 'Send forth,' he says, 'your Spirit, and they shall be created' (Ps 104:30).", "translator": "claude-draft", "orig": "Et Spiritus Dei ferebatur super aquas. Pro eo quod in nostris codicibus scriptum est, ferebatur, in Hebraeo habet MEREFETH ( ), quod nos appellare possumus, incubabat, sive confovebat, in similitudinem volucris, ova calore animantis. Ex quo intelligimus, non de spiritu mundi dici, ut nonnulli arbitrantur, sed de Spiritu Sancto, qui et ipse vivificator omnium a principio dicitur. Si autem vivificator, consequenter et conditor. Quod si conditor, et Deus. Emitte enim, ait, Spiritum tuum, et creabuntur (Psal. CIII, 30) .", "olang": "la", "source": "PL 23, col. 939A", "notes": "Jerome claims the bird from the Hebrew verb itself, not from the Syrian. His bird broods and warms (incubare, confovere); Ben Zoma's hovers and does not touch. Same verb, opposite physical picture. The star thread's Latin end.", "slot": false}, {"id": "aug-gnm-1-5-8", "short": "Augustine, c. Manich.", "author": "Augustine", "tradition": "latin", "date": 389, "datelabel": "388–389", "place": "Thagaste", "lat": 36.29, "lon": 7.95, "answers": ["power-not-place"], "senses": ["literal"], "lemma": {"la": "non per spatia locorum … sed per potentiam invisibilis sublimitatis suae", "en": "not across spaces of place, but by the power of his invisible loftiness"}, "en": "As for what is written, 'And the Spirit of God was borne above the water,' the Manichees are in the habit of carping at it thus: 'So the water was the dwelling of the Spirit of God, and it contained the Spirit of God?' They try to twist everything with a perverse mind, and are blinded by their own malice. When we say 'the sun is borne above the earth,' do we mean by this that the sun lives in the earth and that the earth contains the sun? And yet the Spirit of God was not borne above the water the way the sun is borne above the earth, but in another way, which few understand. For that Spirit was not borne above the water across the spaces of place, as the sun is borne above the earth, but by the power of his invisible loftiness. Let these people tell us how the will of a craftsman is borne above the things that are to be made.", "translator": "claude-draft", "orig": "Quod autem scriptum est, Et Spiritus Dei superferebatur super aquam, sic solent Manichaei reprehendere, ut dicant: Aqua ergo erat habitaculum Spiritus Dei, et ipsa continebat Spiritum Dei? Totum conantur perversa mente pervertere, et excaecantur malitia sua. Cum enim dicimus, Sol superfertur super terram, numquid hoc intelligi volumus, quod in terra habitet sol, et terra solem contineat? Et tamen non sic Spiritus Dei superferebatur super aquam, sicut superfertur sol super terram; sed alio modo quem pauci intelligunt. Non enim per spatia locorum superferebatur aquae ille Spiritus, sicut sol terrae superfertur; sed per potentiam invisibilis sublimitatis suae. Dicant autem nobis isti, quomodo iis rebus quae fabricandae sunt, superferatur voluntas fabri.", "olang": "la", "source": "PL 34, col. 177", "notes": "Augustine's first answer, against the Manichees: the verb is about power, not position. The craftsman's will (voluntas fabri) is born here and becomes the Carolingian bench's stock answer.", "slot": false}, {"id": "aug-gnl-imp-4-16", "short": "Augustine, imperf.", "author": "Augustine", "tradition": "latin", "date": 393, "datelabel": "c. 393", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["craftsman", "power-not-place"], "senses": ["literal"], "lemma": {"la": "sicut superfertur voluntas artificis ligno", "en": "as the will of a craftsman is borne above the wood"}, "en": "'And the Spirit of God was borne above the water.' He was not borne above it as oil is above water, or water above earth, that is, as though he were contained; but, if examples are to be taken from visible things for this, as the light of the sun or moon is borne above the bodies it illuminates on earth: for it is not contained in them, but, while it is contained by the sky, it is borne above them. Likewise we must take care not to think the Spirit of God is borne above matter as though across spaces of place, but by a certain effecting and fashioning force, so that what he is borne above is effected and fashioned; as the will of a craftsman is borne above the wood, or above whatever thing is set under him to be worked, or even above the very limbs of his own body, which he moves in order to work.", "translator": "claude-draft", "orig": "Et Spiritus Dei superferebatur super aquam. Non ita superferebatur sicut oleum aquae, vel aqua terrae, id est, quasi contineretur; sed, si ad hoc de visibilibus exempla capienda sunt, sicut superfertur lux ista solis aut lunae his corporibus, quae illuminat in terra: non enim continetur illis; sed cum coelo contineatur, istis superfertur. Item cavendum est ne quasi locorum spatiis Dei Spiritum superferri materiae putemus, sed vi quadam effectoria et fabricatoria, ut illud cui superfertur efficiatur, et fabricetur; sicut superfertur voluntas artificis ligno, vel cuique rei subjectae ad operandum, vel etiam ipsis membris corporis sui, quae ad operandum movet.", "olang": "la", "source": "PL 34, col. 226", "notes": "The craftsman image sharpened: will over wood, will over one's own limbs. Remigius, Bruno and Hugh's 'artifex' all come from here.", "slot": false}, {"id": "aug-conf-13-9-10", "short": "Augustine, Conf. XIII", "author": "Augustine", "tradition": "latin", "date": 400, "datelabel": "c. 400", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["love-gift"], "senses": ["literal", "spiritual"], "lemma": {"la": "Cur solus Spiritus sanctus superferebatur super aquas", "en": "Why only the Holy Spirit was borne above the waters"}, "en": "Was not the Father, or the Son, borne above the waters too? If we mean by place, as a body is, then neither was the Holy Spirit; but if we mean the eminence of unchangeable Godhead over everything changeable, then Father and Son and Holy Spirit were borne above the waters. Why then is this said only of your Spirit? Why of him alone? As if there were a place there, where there is no place, for him alone of whom it is said that he is your gift. In your gift we rest; there we enjoy you. Our rest is our place. Love lifts us there, and your good Spirit raises our lowliness from the gates of death. In good will is our peace. A body by its weight strives toward its own place. Weight is not only toward what is lowest, but toward its own place. Fire tends upward, a stone downward. They are driven by their weights; they seek their places.", "translator": "claude-draft", "orig": "Numquid aut Pater aut Filius non superferebatur super aquas? Si tanquam loco sicut corpus, nec Spiritus sanctus: si autem incommutabilis divinitatis eminentia super omne mutabile, et Pater et Filius et Spiritus sanctus superferebatur super aquas. Cur ergo tantum de Spiritu tuo dictum est hoc? cur de illo tantum dictum est? Quasi locus ibi esset, qui non est locus, de quo solo dictum est quod sit donum tuum. In dono tuo requiescimus; ibi te fruimur. Requies nostra, locus noster. Amor illuc attollit nos, et Spiritus tuus bonus exaltat humilitatem nostram de portis mortis (Psal. IX, 15) . In bona voluntate pax nobis est (Luc. II, 14) . Corpus pondere suo nititur ad locum suum. Pondus non ad ima tantum est, sed ad locum suum. Ignis sursum tendit, deorsum lapsis. Ponderibus suis aguntur, loca sua petunt.", "olang": "la", "source": "PL 32, col. 848", "notes": "The question turned inward: not what 'above' means but why the Spirit alone is said to be above. Answer: because the Spirit is gift, and love is weight. 'Pondus meum amor meus' follows a few lines on.", "slot": false}, {"id": "aug-gnl-1-18-36", "short": "Augustine, Gn. litt. I", "author": "Augustine", "tradition": "latin", "date": 410, "datelabel": "401–415", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["brooding-warmth", "power-not-place"], "senses": ["literal"], "lemma": {"la": "sicut ova foventur ab alitibus", "en": "as eggs are warmed by birds"}, "en": "But before all else let us remember, as we have already said at length, that God does not work by temporal motions, as it were of his mind or body, as a man or an angel works, but by the eternal, unchangeable and stable reasons of his Word, coeternal with himself, and by a certain — if I may so put it — brooding warmth of his Holy Spirit, equally coeternal. For even what is said in Greek and in Latin of the Spirit of God, that he 'was borne above the waters,' according to the sense of the Syriac tongue, which is neighbor to Hebrew (for this is reported to have been explained by a certain learned Syrian Christian), is held to mean not 'was borne above' but rather 'was warming.' Not as swellings or wounds in the body are warmed with water, whether cold or tempered to a fitting heat; but as eggs are warmed by birds, where that heat of the mother's body in a way assists even the forming of the chicks, through a certain affection of love after its kind.", "translator": "claude-draft", "orig": "Sed ante omnia meminerimus, unde jam multa diximus, non temporalibus quasi animi sui aut corporis motibus operari Deum, sicut operatur homo vel angelus; sed aeternis atque incommutabilibus et stabilibus rationibus coaeterni sibi Verbi sui, et quodam, ut ita dixerim, fotu pariter coaeterni sancti Spiritus sui. Nam et illud quod per graecam et latinam linguam dictum est de Spiritu Dei, quod superferebatur super aquas, secundum syrae linguae intellectum, quae vicina est hebraeae, (nam hoc a quodam docto christiano syro fertur expositum) non superferebatur, sed fovebat potius intelligi perhibetur. Nec sicut foventur tumores aut vulnera in corpore aquis vel frigidis vel calore congruo temperatis; sed sicut ova foventur ab alitibus, ubi calor ille materni corporis etiam formandis pullis quodammodo adminiculatur, per quemdam in suo genere dilectionis affectum.", "olang": "la", "source": "PL 34, col. 260", "notes": "Augustine's mature answer joins his own 'power not place' to the Syrian's warming and adds the mother-bird's love. He cites the Syrian at one remove ('fertur'), almost certainly through Ambrose.", "slot": false}, {"id": "isidore-quaest-1-3", "short": "Isidore", "author": "Isidore of Seville", "tradition": "latin", "date": 620, "datelabel": "c. 620", "place": "Seville", "lat": 37.39, "lon": -5.99, "answers": ["heart"], "senses": ["allegorical"], "lemma": {"la": "super cor nostrum tenebrosum et fluidum, quasi super aquas", "en": "over our dark and fluid heart, as over waters"}, "en": "'And the Spirit of God was borne over the waters.' The Spirit of God was already being borne over our dark and fluid heart, as over waters: that standing in him we might find rest, be quickened by his breath, and be washed in his wave.", "translator": "claude-draft", "orig": "Et spiritus Dei ferebatur super aquas. Spiritus autem Dei super cor nostrum tenebrosum et fluidum, quasi super aquas, jam 262 superferebatur; in quo subsistentes requiesceremus, cujusque vivificaremur flatu, et cujus unda ablueremur.", "olang": "la", "source": "PL 83, col. 209C", "notes": "Isidore does not answer the physical question at all; the waters are the heart. The allegorical reading the Glossa will carry in its margin.", "slot": false}, {"id": "bede-gen-1-2", "short": "Bede", "author": "Bede", "tradition": "latin", "date": 720, "datelabel": "c. 720", "place": "Jarrow", "lat": 54.98, "lon": -1.49, "answers": ["trinity"], "senses": ["literal"], "lemma": {"la": "totius simul Trinitatis in creatione mundi virtutem", "en": "the power of the whole Trinity together in the creation of the world"}, "en": "And rightly, having first declared that in the beginning, that is, in the Son, the Father made heaven and earth, he brought in mention of the Holy Spirit too by adding, 'And the Spirit of God was borne above the waters,' so as to signify that the power of the whole Trinity together worked in the creation of the world.", "translator": "claude-draft", "orig": "Bene autem cum in principio Deum, id est, in Filio Patrem fecisse coelum et terram praediceret, etiam sancti Spiritus intulit mentionem addendo: Et Spiritus Dei superferebatur super aquas, ut videlicet totius simul Trinitatis in creatione mundi virtutem cooperatam esse signaret.", "olang": "la", "source": "PL 91, col. 16C", "notes": "Bede has no bird and no Syrian on this verse: his 1:2 is Trinitarian (K3). Included here because Rabanus copies this sentence verbatim and it becomes the Glossa's spine.", "slot": false}, {"id": "wigbod-gen-1-2", "short": "Wigbod", "author": "Wigbod", "tradition": "latin", "date": 790, "datelabel": "c. 790", "place": "Aachen", "lat": 50.78, "lon": 6.08, "answers": ["brooding-warmth", "power-not-place"], "senses": ["literal"], "lemma": {"la": "HIERONYMUS. … in Hebraeo habetur merephet", "en": "JEROME: in the Hebrew it is merephet"}, "en": "Disciple: Explain how the Spirit of God was borne over the waters. — JEROME. Master: For what our copies have as 'was borne,' the Hebrew has merephet, which we may render 'was brooding' or 'was warming,' in the likeness of a bird quickening her eggs with her heat. From this we understand that it is not said of the spirit of the world, as some suppose, but of the Holy Spirit, who is himself called the giver of life to all things from the beginning.", "translator": "claude-draft", "orig": "D. Quomodo spiritus Dei ferebatur super aquas, edissere? HIERONYMUS. M. Pro eo quod in nostris codicibus scriptum est, ferebatur; in Hebraeo habetur merephet, quod nos appellare possumus, incubabat, sive confovebat in similitudinem volucris ova calore animantis. Ex quo intelligimus, non de spiritu mundi dici, ut nonnulli arbitrantur, sed de Spiritu sancto, qui et ipse vivificator omnium a principio dicitur.", "olang": "la", "source": "PL 96, col. 1116C", "notes": "A Carolingian question-and-answer catena that labels its sources. Jerome quoted verbatim under his name at col. 1116C; Augustine's sun-over-earth (Gnm I.5) quoted at col. 1112D. The first witness that shows the two Latin lines (Hebrew bird, power-not-place) sitting side by side as authorities.", "slot": false}, {"id": "alcuin-int-29", "short": "Alcuin", "author": "Alcuin", "tradition": "latin", "date": 796, "datelabel": "c. 796", "place": "Tours", "lat": 47.39, "lon": 0.69, "answers": ["power-not-place"], "senses": ["literal"], "lemma": {"la": "Non pervagatione, sed potestate", "en": "Not by wandering over, but by power"}, "en": "Question 29. What is 'The Spirit of the Lord was borne over the waters'? — Answer: Not by wandering over them, but by power and a ruler's command, to form and quicken the formless matter which in this place is signified by the name of water.", "translator": "claude-draft", "orig": "Inter. 29. Quid est: Spiritus Domini ferebatur super aquas (Gen. I, 2) ?-- Resp. Non pervagatione [ Edit., per vagationem], sed potestate, et regentis imperio, ad formandum et vivificandum informem materiam, quae hoc loco aquae nomine significatur", "olang": "la", "source": "PL 100, col. 519D", "notes": "Augustine compressed to one sentence for the schoolroom. Note 'Spiritus Domini' (Old Latin) not 'Spiritus Dei' (Vulgate) — the Vetus Latina lingers in Alcuin's lemma.", "slot": false}, {"id": "rabanus-gen-1-1", "short": "Rabanus", "author": "Rabanus Maurus", "tradition": "latin", "date": 822, "datelabel": "c. 822", "place": "Fulda", "lat": 50.55, "lon": 9.68, "answers": ["craftsman", "trinity"], "senses": ["literal"], "lemma": {"la": "in similitudinem videlicet fabri, cujus voluntas … solet superferri", "en": "like a craftsman, whose will is borne above the things to be made"}, "en": "'And the Spirit of God was borne over the waters.' It is not to be supposed childishly that the creator Spirit, of whom it is written 'The Spirit of the Lord has filled the whole earth' (Wis 1:7), was borne above the things to be created by position in place. Rather it is to be understood that by divine power he excelled the creatures, holding in his own power when he would illumine the abyss of waters, when he would part them into one place so that the dry land might appear, when and how he would dispose the other creatures at his nod — in the likeness, that is, of a craftsman, whose will is accustomed to be borne above the things that are to be made.", "translator": "claude-draft", "orig": "Et Spiritus Dei ferebatur super aquas. Non est opinandum pueriliter quod Spiritus creator, de quo scriptum est: Quia Spiritus Domini replevit orbem terrarum (Sap. I) , positione loci his quae erant creanda superferretur. Sed intelligendum potius quia virtute divina praecellebat creaturis, habens in propria potestate quando aquarum illustraret abyssum, quando in locum eas secerneret unum, ut appareret arida, quando et quomodo creaturas caeteras pro suo nutu disponeret, in similitudinem videlicet fabri, cujus voluntas his quae fabricandae sunt rebus solet superferri.", "olang": "la", "source": "PL 107, col. 446D", "notes": "Augustine's craftsman in Rabanus' own words at col. 446D; then at 447C he copies Bede's Trinity sentence verbatim. Rabanus is the bridge by which both lines reach the Glossa.", "slot": false}, {"id": "angelom-gen-1-2", "short": "Angelomus", "author": "Angelomus of Luxeuil", "tradition": "latin", "date": 850, "datelabel": "c. 850", "place": "Luxeuil", "lat": 47.82, "lon": 6.38, "answers": ["power-not-place", "brooding-warmth"], "senses": ["literal"], "lemma": {"la": "Unde bene alia translatio dicit: Incumbebat, seu confovebat", "en": "Hence another translation well says: was lying upon, or warming"}, "en": "But he was borne not by place but by power, ruling and sustaining that formless matter, as the will of a craftsman is borne above the things to be made. Hence another translation well says 'was lying upon,' or 'was warming,' in the likeness of a bird quickening her eggs with her heat, so that it may be plainly understood of the Holy Spirit and not of the spirit of this world, as the heretics thought.", "translator": "claude-draft", "orig": "Sed ferebatur non localiter, sed potentialiter, regendo et sustentando ipsam informem materiam; sicut superfertur rebus fabricandis voluntas artificis. Unde bene alia translatio dicit: Incumbebat [ Z., incubabat ], seu confovebat, in similitudine volucris, ova calore animantis, ut manifeste intelligatur de Spiritu sancto, et non de spiritu hujus mundi, sicut haeretici putaverunt.", "olang": "la", "source": "PL 115, col. 116A", "notes": "Angelomus splices the two Latin lines into one sentence: Augustine's 'not by place but by power' and Jerome's bird, the latter presented as 'another translation' and unnamed. Jerome's 'nonnulli' (some suppose) has hardened into 'haeretici'.", "slot": false}, {"id": "remigius-gen-1-2", "short": "Remigius", "author": "Remigius of Auxerre", "tradition": "latin", "date": 900, "datelabel": "c. 900", "place": "Auxerre", "lat": 47.8, "lon": 3.57, "answers": ["craftsman"], "senses": ["literal"], "lemma": {"la": "Sicut mens vel sapientia alicujus artificis superfertur operi", "en": "As the mind or wisdom of a craftsman is borne above his work"}, "en": "'The Spirit of God was borne over the waters.' As the mind or wisdom of some craftsman is borne above the work he is going to make, so that he may make it as he wills, so too the Holy Spirit was borne above, fore-ordaining and as it were arranging what, and in what manner, he willed to make.", "translator": "claude-draft", "orig": "Spiritus Dei ferebatur super aquas. Sicut mens vel sapientia alicujus artificis superfertur operi quod facturus est, ut quomodo vult ita illud faciat: ita et Spiritus sanctus superferebatur, praeordinans et quasi disponens quid, qualiter facere vellet.", "olang": "la", "source": "PL 131, col. 55B", "notes": "Augustine's craftsman, now with 'wisdom' — the Spirit as the plan before the work. Remigius also gives a moral reading at col. 55D (the fluid hearts of men).", "slot": false}, {"id": "bruno-gen-1-2", "short": "Bruno of Segni", "author": "Bruno of Segni", "tradition": "latin", "date": 1100, "datelabel": "c. 1100", "place": "Segni", "lat": 41.69, "lon": 13.02, "answers": ["craftsman"], "senses": ["literal"], "lemma": {"la": "ut bonus artifex … jam tunc facere disponebat", "en": "like a good craftsman, was even then arranging to make"}, "en": "But the Spirit of God was borne over the waters, because, like a good craftsman, he was even then arranging to make this so manifold variety of creatures that we see. So we too, for example, when about to build a house, looking over the timber with eye and mind, assign some pieces to beams, some to columns, and others to other uses.", "translator": "claude-draft", "orig": "Dei. vero Spiritus ferebatur super aquas, quia ut bonus artifex, hanc, quam videmus, tam multiplicem creaturarum varietatem, jam tunc facere disponebat. Sic enim et nos, exempli gratia, domum composituri, lignorum materiam oculis menteque contemplantes, alia trabibus, alia vero columnis, atque alia aliis officiis destinamus.", "olang": "la", "source": "PL 164, col. 148C", "notes": "The craftsman becomes a house-builder sorting timber. The digitization reads 'Dei. vero' — the PL plate should be checked for the stop.", "slot": false}, {"id": "rupert-gen-1-8", "short": "Rupert", "author": "Rupert of Deutz", "tradition": "latin", "date": 1114, "datelabel": "c. 1114", "place": "Liège", "lat": 50.63, "lon": 5.57, "answers": ["brooding-warmth", "love-gift"], "senses": ["literal", "spiritual"], "lemma": {"la": "melioratur ovum in eo quod calore volucris animatur et pullum producit", "en": "an egg is bettered in that it is quickened by a bird's warmth and brings forth a chick"}, "en": "For next follows the forming or adorning of that same creature, and it receives from the attention of the Spirit of God as great a bettering and as great a supplying of its poverty as, in its own small measure, an egg is bettered in that it is quickened by a bird's warmth and brings forth a chick. And what do we think this spirit is, but the goodness and love of God — a love not of feelings but substantial; love, I say, and life, and living power abiding in the Son and the Father, or proceeding from both, consubstantial with Father and Son.", "translator": "claude-draft", "orig": "Deinceps namque creaturae ejusdem formatio vel exornatio succedit, tantamque ex intentione Spiritus Dei meliorationem et tantum inopiae suae supplementum capit, quantum pro modulo suo melioratur ovum in eo quod calore volucris animatur et pullum producit. Quid autem putamus esse hunc spiritum, nisi bonitatem amoremque Dei, amorem non affectuum, sed substantialem, amorem, inquam, et vitam, virtutemque vivam in Filio et Patre manentem, vel ab utroque procedentem, Patri Filioque consubstantialem.", "olang": "la", "source": "PL 167, col. 205C", "notes": "Rupert has the egg but not the Syrian: the image arrives already naturalized. His 'love' is Confessions XIII.9 turned Trinitarian. Not found by the plan's search; surfaced by grepping the TEI for the bird vocabulary.", "slot": false}, {"id": "abelard-hex-1-2", "short": "Abelard", "author": "Peter Abelard", "tradition": "latin", "date": 1130, "datelabel": "c. 1130", "place": "The Paraclete (Nogent-sur-Seine)", "lat": 48.49, "lon": 3.5, "answers": ["fluttering", "brooding-warmth"], "senses": ["literal"], "lemma": {"la": "Hebraicum habet, volitabat super faciem aquarum", "en": "the Hebrew has, was fluttering over the face of the waters"}, "en": "'And the Spirit of the Lord was borne over the waters.' The Hebrew has 'was fluttering over the face of the waters.' One translation has 'was warming the waters,' another 'was borne over the waters,' as does the present one we have in hand, which first comes to us to be expounded. […] Another translation, as we said, also has 'and the Spirit of the Lord was warming the waters,' after the manner of a bird that sits upon an egg to warm and quicken it; whence we rightly call the Holy Spirit the giver of life. And that confused mass is well compared to an egg not yet quickened or formed, in which, as in an egg containing four things in itself, the four elements are comprised…", "translator": "claude-draft", "orig": "Et Spiritus Domini ferebatur super aquas. Hebraicum habet, volitabat super faciem aquarum. Translatio vero quaedam habet, fovebat aquas, quaedam, ferebatur super aquas, sicut habet praesens quam prae manibus habemus, ac primum nobis occurrit exponenda. Quantum ergo nobis videtur, aquarum etiam nomine fluidam illam atque instabilem congeriem nondum certa partium suarum collocatione firmatam comprehendit. Super hanc itaque Spiritus Domini ferebatur, quia ut eam ordinaret, tanquam imperio suo subjectam divina disponebat gratia, ne videlicet ulterius esset inanis aut vacua, seu tenebrosa vel fluida. Quid enim Spiritus Dei nisi ejus bonitas intelligitur, cujus participatione sunt bona universa? Quae videlicet Dei bonitas, quia nondum in illa elementorum confusione apparebat, superferri potius illi quam inferri dicebatur, quia nondum in ea operatus fuerat unde aliquid utilitatis ipsa praetenderet. Unde nec in ejus commendatione: dicitur vidit Deus quia bonum est, sicut in commendatione reliquorum operum. Diligenter etiam dicit, ferebatur super aquas potius quam erat, quasi ostendens eum habere quemdam transitum in istis, ut de tenebris ad lucem produceret, non in eis permanentiam habere, quas nequaquam in hac confusione proposuerat relinquere. Alia etiam, ut diximus, translatio habet, et Spiritus Domini fovebat aquas, more videlicet avis, quae ovo incumbit, ut ipsum foveat atque vivificet; unde et bene vivificatorem Spiritum sanctum appellamus. Bene autem ovo nondum vivificato aut formato illa confusa congeries comparatur, in qua tanquam in ovo quatuor in se continenti quatuor elementa comprehendun", "olang": "la", "source": "PL 178, col. 735B", "notes": "The one Latin witness who reports the Hebrew as 'fluttering' (volitabat) — which is what merahefet means in Deut 32:11 and what Ben Zoma and Rashi hear — rather than Jerome's 'brooding'. He keeps 'warming' only as 'a certain translation'. Where did Abelard get volitabat? Not from Jerome. A Jewish informant is possible [CHECK]. The excerpt spans cols 735B–735D; the middle is elided in the English.", "slot": false}, {"id": "hugh-adnot-gen-1-2", "short": "Hugh of St Victor", "author": "Hugh of St Victor", "tradition": "latin", "date": 1130, "datelabel": "c. 1130", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["craftsman"], "senses": ["literal"], "lemma": {"la": "Spiritum Dei vocat ejus intentionem", "en": "He calls 'the Spirit of God' his intention"}, "en": "'And the Spirit of God was borne over the waters.' He calls 'the Spirit of God' his intention, who like a craftsman presided over the work to be formed; 'the waters' he calls that mist, on account of its mobility; and so he names the same thing now 'abyss' for its depth, now 'darkness' for the absence of light, now 'waters' for its mobility.", "translator": "claude-draft", "orig": "Et spiritus Dei ferebatur super aquas. Spiritum Dei vocat ejus intentionem, qui quasi artifex operi formando praecerat, aquas vocat nebulam illam propter mobilitatem: et ita eamdem rem modo abyssum propter profunditatem, modo tenebras propter absentiam lucis, modo aquas propter mobilitatem appellat.", "olang": "la", "source": "PL 175, col. 36A", "notes": "The most physical Latin reading: the waters are a mist of mixed elements, the Spirit is God's intention. Hugh's Adnotationes are the literal school; his De sacramentis treats the same verse theologically. The TEI reads 'praecerat' for 'praeerat'.", "slot": false}, {"id": "honorius-hex-1", "short": "Honorius", "author": "Honorius Augustodunensis", "tradition": "latin", "date": 1140, "datelabel": "c. 1140", "place": "Regensburg", "lat": 49.02, "lon": 12.1, "answers": ["brooding-warmth", "trinity"], "senses": ["literal"], "lemma": {"la": "vel aquas fovebat, id est cuncta de aquis procreanda animabat", "en": "or was warming the waters, that is, giving life to all that was to come from them"}, "en": "'And the Spirit of the Lord was borne over the waters,' or 'was warming the waters,' that is, was giving life to all that was to be brought forth from the waters. And note the Trinity: to God the Father is ascribed the creation of the world, to the Son the disposing of things, to the Holy Spirit the quickening, or adorning, of all.", "translator": "claude-draft", "orig": "Et Spiritus Domini ferebatur super aquas, vel aquas fovebat, id est cuncta de aquis procreanda animabat. Et nota Trinitatem. Deo Patri ascribitur mundi creatio, Filio rerum dispositio, Spiritui sancto omnium vivificatio, vel ornatio.", "olang": "la", "source": "PL 172, col. 254C", "notes": "By 1140 'vel aquas fovebat' is offered as a bare variant reading, no Syrian, no bird: the image has become a lemma.", "slot": false}, {"id": "comestor-hs-gen-1", "short": "Comestor", "author": "Peter Comestor", "tradition": "latin", "date": 1170, "datelabel": "c. 1170", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["brooding-warmth"], "senses": ["literal"], "lemma": {"la": "Hebraeus habet pro super ferebatur, incubabat, vel Syra lingua, fovebat, sicut avis ova", "en": "The Hebrew has 'was brooding', or in Syriac 'was warming', as a bird her eggs"}, "en": "The Hebrew has, for 'was borne above,' 'was brooding,' or in the Syriac tongue 'was warming,' as a bird her eggs. In this, too, the whole beginning of the world being born is noted, together with its governance. Plato misunderstood this passage, thinking it was said of the world-soul. But it is said of the Holy Spirit creating, of whom we read, 'Send forth your Spirit, and they shall be created' (Ps 104:30).", "translator": "claude-draft", "orig": "Hebraeus habet pro super ferebatur, incubabat, vel Syra lingua, fovebat, sicut avis ova. In quo etiam omne cum regimine nascentis mundi notatur initium. Hunc locum male intellexit Plato, dictum hoc putans de anima mundi. Sed dictum est de Spiritu sancto creante, de quo legitur: Emitte Spiritum tuum, et creabuntur (Psal. CIII) .", "olang": "la", "source": "PL 198, col. 1057A", "notes": "The textbook of the schools fuses Jerome's Hebrew and Basil's Syriac into one sentence and adds a new opponent: Plato's world-soul, i.e. William of Conches and the Chartres reading of the Spirit as anima mundi. The bird has become a proof against philosophers.", "slot": false}, {"id": "aug-gnl-1-5-11", "short": "aug-gnl-1-5-11", "author": "Augustine", "tradition": "latin", "date": 401, "datelabel": "401–415", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["power-not-place", "love-gift", "trinity"], "senses": ["literal"], "lemma": {"la": "non ex indigentia, sed ex beneficentia veniens amor", "en": "a love that comes not from need but from bounty"}, "en": "Therefore, before it was written 'God said, Let there be light,' Scripture went before it, saying, 'And the Spirit of God was borne above the water.' For whether by the name of water he meant the whole of corporeal matter, so as to intimate by that means whence all the things we can now distinguish in their kinds were made and formed (calling it water because we see everything on earth formed and grown together out of a moist nature through its various species), or a kind of spiritual life, floating as it were before the form of its conversion: in either case the Spirit of God was borne above, because whatever it was that he had begun, to be formed and perfected, lay beneath the good will of the Creator; so that when God said in his Word, 'Let there be light,' what was made might abide in his good will, that is in his good pleasure, after the measure of its kind; and so it is right that it pleased God, Scripture saying, 'And light was made; and God saw the light, that it was good.' […] But why, after the creature had first been mentioned, imperfect as it was, is the Spirit of God mentioned afterwards, Scripture first saying 'But the earth was invisible and unformed, and darkness was over the abyss,' and then bringing in 'And the Spirit of God was borne above the water'? Is it because a needy and destitute love so loves that it is subjected to the things it loves; and therefore, when the Spirit of God was mentioned, in whom his holy benevolence and love are understood, he was said to be borne above, lest God should be thought to love the works he was to make out of the necessity of want rather than out of the abundance of bounty?", "translator": "claude-draft", "orig": "Propterea priusquam scriberetur, Dixit Deus, Fiat lux; praecessit Scriptura dicens, Et Spiritus Dei superferebatur super aquam. Quia sive aquae nomine appellare voluit totam corporalem materiam, ut eo modo insinuaret unde facta et formata sint omnia, quae in suis generibus jam dignoscere possumus, appellans aquam, quia ex humida natura videmus omnia in terra per species varias formari atque concrescere; sive spiritualem vitam quamdam ante formam conversionis quasi fluitantem: superferebatur utique Spiritus Dei; quia subjacebat scilicet bonae voluntati Creatoris, quidquid illud erat quod formandum perficiendumque inchoaverat: ut dicente Deo in Verbo suo, Fiat lux; in bona voluntate, hoc est in beneplacito ejus pro modulo sui generis maneret quod factum est; et ideo rectum est, quod placuerit Deo, Scriptura dicente, Et facta est lux; et vidit Deus lucem quia bona est. CAPUT VI.-- Trinitas insinuata cum in inchoatione, tum in perfectione creaturae. 12. Ut quemadmodum in ipso exordio inchoatae creaturae, quae coeli et terrae nomine, propter id quod de illa perficiendum erat, commemorata est, Trinitas insinuatur Creatoris (nam dicente Scriptura, In principio fecit Deus coelum et terram; intelligimus Patrem in Dei nomine, et Filium in principii nomine, qui non Patri, sed per seipsum creatae primitus ac potissimum spirituali creaturae, et consequenter etiam universae creaturae principium est: dicente autem Scriptura, Et Spiritus Dei ferebatur super aquam, completam commemorationem Trinitatis agnoscimus); ita et in conversione atque perfectione creaturae, ut rerum species digerantur, eadem Trinitas insinuetur: Verbum Dei scilicet, et Verbi generator, cum dicitur, Dixit Deus; et sancta bonitas, in qua Deo placet quidquid ei pro suae naturae modulo perfectum placet, cum dicitur, Vidit Deus quia bonum est. CAPUT VII.-- Spiritus Dei cur dictus est superferri super aquam. 13. Sed cur commemorata prius quamvis imperfecta creatura, postea commemoratur Spiritus Dei, prius dicente Scriptura, Terra autem erat invisibilis et incomposita, et tenebrae erant super abyssum ; ac deinde inferente, Et Spiritus Dei superferebatur super aquam? An quoniam egenus atque indigus amor ita diligit, ut rebus quas diligit, subjiciatur; propterea cum commemoraretur Spiritus Dei, in quo sancta ejus benevolentia dilectioque intelligitur, superferri dictus est, ne facienda opera sua per indigentiae necessitatem potius quam per abundantiam beneficentiae Deus amare putaretur?", "olang": "la", "source": "PL 34, col. 250", "notes": "The passage the Glossa quotes in its margin on 1:2 (as 'lib. I de Gen. ad lit., c. 5'). Two answers at once: water is matter or formless spiritual life, and the Spirit is 'above' because divine love is not needy. The middle chapter, which finds the Trinity in the verse, is elided in the English.", "slot": false}, {"id": "glossa-1-2-ruach", "short": "Glossa (slot)", "author": "Glossa ordinaria (school of Laon)", "tradition": "latin", "date": 1120, "datelabel": "compilation 1110–1130", "place": "Laon", "lat": 49.56, "lon": 3.62, "answers": ["power-not-place", "brooding-warmth", "trinity", "heart"], "senses": ["literal", "allegorical"], "lemma": {"la": "Et Spiritus Domini ferebatur super aquas", "en": "And the Spirit of the Lord was borne over the waters"}, "en": "« And the Spirit of the Lord was borne over the waters. » [var: Vulg. Gen. 1:2 *Spiritus Dei*, \"the Spirit of God\"] [n: (AUG., lib. I de Gen. ad lit., c. 5, tom. III.)] Either he called the whole corporeal matter water, that he might intimate whence were made and formed all the things which we see formed on the earth out of a moist nature through divers species; or the spiritual life, as it were floating, before the [0070B] form of its conversion. The Spirit of God was borne above, because that which he had begun to be formed and perfected lay beneath the good will of the Creator. It is also said, « The Spirit of the Lord was borne over the waters. » Lest, by doing works, God should be thought to love through the necessity of want rather than through the abundance of beneficence. For fittingly is something first intimated to have been begun, over which he might be borne: not in place, but by a power surpassing all things.\n\n« And the Spirit of the Lord was borne, » etc. [n: (HIERON. in Gen. t. III, col. 939.)] In the Hebrew it has *merahephet,* that is, it brooded, or cherished, after the manner of a bird warming eggs with the heat of a living thing. We understand therefore that this is not said of the spirit of the world, as many suppose; but of the [0070C] Holy Spirit, who is himself the quickener of all things: and if the quickener, also the founder; if the founder, also God. Psal. CIII: « Send forth, he says, thy Spirit, and they shall be created. » [var: Vulg. Ps. 103:30 *Emittes*, \"Thou shalt send forth\"]\n\n« And the Spirit, » etc. In whom, subsisting, we might rest, quickened by his breath and washed by the wave of baptism. « And the Spirit of the Lord was borne over the waters, » etc. As God, namely, and Creator, he presided over the floating and confused matter, that he might distinguish it when he willed. The whole Trinity therefore is understood to have worked here, God, that is, the Father; the beginning, the Son; the Spirit of God, the Holy Spirit.\n\n« And the Spirit, » etc. [n: (ISID., in Gen.? )] The hearts, namely, that were tossing to and fro, which had lost the quiet of the mind, [0070D] because the Spirit did not rest upon them, but was borne above them: as one able to call back their nature from confusion into something better. Then throughout the whole text of this Scripture we see certain six laborious ages, though distinguished as it were by neighbouring bounds, so that in the seventh rest may be hoped for; and we see that they have a likeness to the six days in which those things were made which Scripture records God to have made. For the first beginning of the human race, in which it began to enjoy this light, is compared to the first day, on which God made light. This age is as it were the infancy of the whole world, which we think of, by the proportion of its greatness, as one man. For man, when he is first born into the light, passes his infancy, the first age, which extends from Adam to Noah in ten generations: the flood is as it were the evening of this [0071A] day, because our infancy is blotted out by the flood of forgetfulness.\n\n[n: (STRAB.)] « Void and empty. » Useless, namely, and unfruitful, and unordered. For all the elements were mingled and confused, and this whole space of air was full of waters; not such as they now are, but they were like thin clouds, such as those above the heavens still are.", "translator": "wilson-pruitt", "orig": "« Et Spiritus Domini ferebatur super aquas. » [n: (AUG., lib. I de Gen. ad lit., c. 5, tom. III.)] Sive totam corporalem materiam aquam appellavit, ut insinuaret unde facta et formata sunt omnia quae ex humida natura per species varias in terra formari videmus; sive spiritualem vitam ante conversionis [0070B] formam quasi fluitantem. Spiritus Dei superferebatur, quia subjacebat bonae voluntati Creatoris, quod formandum et perficiendum inchoaverat. Dictum est etiam « Spiritus Domini ferebatur super aquas. » Ne faciendo opera potius per necessitatem indigentiae quam per abundantiam beneficentiae Deus amare putaretur. Commode enim prius insinuatur aliquid inchoatum, cui superferretur: non loco, sed omnia superante potentia.\n\n« Et Spiritus Domini ferebatur, » etc. [n: (HIERON. in Gen. t. III, col. 939.)] In Hebraeo habet *merahephet,* id est, incubabat, vel fovebat, more volucris ova calore animantis. Intelligimus ergo non de spiritu mundi dici, ut putant multi; sed de Spiritu [0070C] sancto, qui et ipse est omnium vivificator: si autem vivificator, et conditor; si conditor, et Deus. Psal. CIII: « Emitte, ait, Spiritum tuum et creabuntur. »\n\n« Et Spiritus, » etc. In quo subsistentes requiesceremus flatu ejus vivificati, et unda baptismi abluti. « Et Spiritus Domini ferebatur super aquas, » etc. Sicut Deus, scilicet et conditor, praeerat fluitanti et confusae materiei, ut distingueret quando vellet. Tota ergo Trinitas hic operata intelligitur, Deus, Pater scilicet; principium, Filius; Spiritus Dei, Spiritus sanctus.\n\n« Et Spiritus, » etc. [n: (ISID., in Gen.? )] Corda scilicet fluctuantia, quae mentis quietem amiserant, [0070D] quia eis spiritus non innitebatur, sed superferebatur: quasi potens naturam a confusione in melius revocare. Deinde per totum hujus Scripturae textum sex quasdam operosas aetates videmus, licet quasi proximis limitibus distinctas, ut in septima quies speretur; et eas habere similitudinem sex dierum, quibus ea facta sunt, quae Deum fecisse Scriptura commemorat. Primordium enim generis humani, quo ista luce frui coepit, comparatur primo diei quo lucem Deus fecit. Haec aetas tanquam infantia est totius saeculi, quod tanquam unum hominem proportione magnitudinis suae cogitamus. Homo enim cum primo nascitur in lucem, infantiam agit primam aetatem, quae tendit ab Adam usque ad Noe generationibus decem: diluvium quasi vespera hujus [0071A] diei est, quia infantia nostra oblivionis diluvio deletur.\n\n[n: (STRAB.)] « Inanis et vacua. » Inutilis scilicet, et infructuosa, et incomposita. Omnia enim elementa commixta, confusa, et totum hoc aeris spatium aquis plenum; non quales nunc sunt, sed sicut nebulae tenues erant, quales adhuc supercoelestes sunt.", "olang": "la", "source": "PL 113, col. 70A–70D (marginal glosses on 1:2, in the order printed; the 'inanis et vacua' gloss from 69D appended)", "notes": "Four glosses stand on the verse in the margin: Augustine Gn. litt. I.5 (water as matter; love not from need; 'not in place but by a power surpassing all'); Jerome's merahephet, cited by PL column; an unlabelled sentence that is Bede's Trinity gloss via Rabanus ('Tota ergo Trinitas hic operata'); and one Migne marks 'ISID. in Gen.?' (the floating hearts, which is Isidore's moral reading in Augustine's wording). The lemma reads 'Spiritus Domini', the Old Latin, not the Vulgate's 'Spiritus Dei' — Wilson's [var:] flags it. The bird enters the Glossa through Jerome only; the Syrian and the craftsman are both absent.", "slot": false}], "threads": [{"id": "t-k7-01", "from": "vulgate-1-2", "to": "lxx-1-2", "type": "transmits", "evidence": "Vulgate 'ferebatur' renders LXX ἐπεφέρετο, not the Hebrew merahefet; the Latin bench inherits a Greek verb of motion.", "crux": "ruach-hovering"}, {"id": "t-k7-02", "from": "ambrose-hex-1-8-29", "to": "basil-hex-lat-2-6", "type": "cites", "evidence": "'Syrus, qui vicinus Hebraeo est … fovebat aquas, id est vivificabat' reproduces Basil Hex. II.6's Syrian and his gloss 'warmed and quickened'. Ambrose read Basil's Greek; Eustathius' Latin is the bench's later access to the same source.", "crux": "ruach-hovering"}, {"id": "t-k7-03", "from": "aug-gnl-1-18-36", "to": "basil-hex-lat-2-6", "type": "cites", "evidence": "'a quodam docto christiano syro fertur expositum … non superferebatur sed fovebat' names Basil's Syrian at one remove ('fertur'); 'sicut ova foventur ab alitibus' extends the gallina cubans.", "crux": "ruach-hovering"}, {"id": "t-k7-04", "from": "aug-gnl-1-18-36", "to": "ambrose-hex-1-8-29", "type": "echoes", "evidence": "Augustine's access to the Syrian is most plausibly Ambrose's Hexaemeron (heard in Milan 386–7); the 'vivificatio' motif matches Ambrose's 'vivificabat … animaret ad vitam'.", "crux": "ruach-hovering"}, {"id": "t-k7-05", "from": "jerome-hq-1-2", "to": "b-chag-15a", "type": "parallel", "evidence": "Both derive a bird from merahefet. Jerome: incubabat/confovebat, a bird warming eggs. Ben Zoma: a dove hovering over her young and NOT touching. Same verb, opposite physical claim. No citation either way; Jerome's 'in Hebraeo' points at the word, not at a rabbinic informant.", "crux": "ruach-hovering"}, {"id": "t-k7-06", "from": "wigbod-gen-1-2", "to": "jerome-hq-1-2", "type": "cites", "evidence": "Wigbod prints Jerome's paragraph verbatim under the label HIERONYMUS (PL 96:1116C).", "crux": "ruach-hovering"}, {"id": "t-k7-07", "from": "wigbod-gen-1-2", "to": "aug-gnm-1-5-8", "type": "cites", "evidence": "Wigbod prints Augustine's sun-over-earth paragraph verbatim (PL 96:1112D).", "crux": "ruach-hovering"}, {"id": "t-k7-08", "from": "angelom-gen-1-2", "to": "jerome-hq-1-2", "type": "echoes", "evidence": "'alia translatio dicit: Incumbebat seu confovebat, in similitudine volucris, ova calore animantis' is Jerome's wording, unnamed and re-labelled as a translation const svg = d3.select('#map'), panel = document.getElementById('panel');
const g = svg.append('g');
const gRings = g.append('g'), gHubLinks = g.append('g'), gEdges = g.append('g'), gHubs = g.append('g'), gNodes = g.append('g'), gLabels = g.append('g');
let W = 800, H = 600, mode = 'answers';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const wn = D.witnesses.map(w => ({...w, kind: 'w'}));
const byId = Object.fromEntries(wn.map(n => [n.id, n]));
const ansKeys = Object.keys(D.answers), senseKeys = Object.keys(D.senses);
const hubsA = ansKeys.map(k => ({id: 'hub:' + k, kind: 'hub', key: k, label: D.answers[k].label, gloss: D.answers[k].gloss, facet: 'answers'}));
const hubsS = senseKeys.map(k => ({id: 'hub:' + k, kind: 'hub', key: k, label: D.senses[k], gloss: '', facet: 'sense'}));
const hubById = Object.fromEntries([...hubsA, ...hubsS].map(h => [h.id, h]));
const threads = D.threads.map(t => ({...t, source: byId[t.from], target: byId[t.to]})).filter(t => t.source && t.target);
const hubLinksA = wn.flatMap(w => w.answers.map(a => ({source: w, target: hubById['hub:' + a]})));
const hubLinksS = wn.flatMap(w => w.senses.map(s => ({source: w, target: hubById['hub:' + s]})));

let k = 1;
function applyScale() {
  nodeSel.attr('r', d => (d.slot ? 6 : 7) / k).attr('stroke-width', 2 / k);
  labelSel.attr('font-size', 11 / k + 'px').attr('dx', 10 / k).attr('dy', 4 / k);
  edgeSel.attr('stroke-width', d => (d.type === 'contests' ? 1.8 : d.type === 'parallel' ? 2 : 1.4) / k).attr('stroke-dasharray', d => d.type === 'echoes' ? `${5/k} ${4/k}` : d.type === 'parallel' ? `${2/k} ${4/k}` : null);
  if (hubSel) { hubSel.attr('r', 13 / k).attr('stroke-width', 1.5 / k); hubLblSel.selectAll('.hublbl').attr('font-size', 12 / k + 'px').attr('y', 30 / k); hubLblSel.selectAll('.hubsub').attr('font-size', 10.5 / k + 'px').attr('y', 43 / k); hubLinkSel.attr('stroke-width', 1 / k).attr('stroke-dasharray', `${1/k} ${3/k}`); }

}
svg.call(d3.zoom().scaleExtent([.5, 6]).on('zoom', e => { g.attr('transform', e.transform); if (e.transform.k !== k) { k = e.transform.k; applyScale(); } }));

// ---------- drawing
const edgeSel = gEdges.selectAll('path').data(threads).join('path').attr('class', d => 'edge ' + d.type)
  .on('mouseenter', (e, d) => showEdge(d, true)).on('mouseleave', (e, d) => showEdge(d, false)).on('click', (e, d) => { showEdge(d, true); e.stopPropagation(); });
const nodeSel = gNodes.selectAll('circle').data(wn).join('circle').attr('class', d => 'node ' + d.tradition + (d.slot ? ' slot' : '')).attr('r', d => d.slot ? 6 : 7)
  .on('click', (e, d) => { showWitness(d); e.stopPropagation(); }).on('mouseenter', (e, d) => focusNode(d, true)).on('mouseleave', (e, d) => focusNode(d, false))
  .call(d3.drag().on('start', (e, d) => { d.fx = d.x; d.fy = d.y; }).on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; sim.alpha(.3).restart(); }).on('end', (e, d) => { d.fx = null; d.fy = null; }));
const labelSel = gLabels.selectAll('text').data(wn).join('text').attr('class', 'lbl').text(d => d.short);
let hubSel, hubLblSel, hubLinkSel;

const sim = d3.forceSimulation().on('tick', tick);
function tick() {
  edgeSel.attr('d', d => { const {source: s, target: t} = d; const dx = t.x - s.x, dy = t.y - s.y, dr = Math.hypot(dx, dy) * 1.4; return `M${s.x},${s.y}A${dr},${dr} 0 0,1 ${t.x},${t.y}`; });
  nodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
  labelSel.attr('x', d => d.x).attr('y', d => d.y);
  if (hubSel) { hubSel.attr('cx', d => d.x).attr('cy', d => d.y); hubLblSel.attr('transform', d => `translate(${d.x},${d.y})`); hubLinkSel.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y); }
}

function size() { const r = svg.node().getBoundingClientRect(); W = r.width; H = r.height; }

function layout() {
  size(); const cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 40;
  gRings.selectAll('*').remove(); gHubs.selectAll('*').remove(); gHubLinks.selectAll('*').remove(); hubSel = null;
  const labelR = d => d.kind === 'hub' ? 46 : 12 + d.short.length * 2.4;
  sim.nodes(wn).force('charge', null).force('link', null).force('x', null).force('y', null).force('hublink', null).force('collide', d3.forceCollide(labelR).strength(.9));
  if (mode === 'answers' || mode === 'sense') {
    const hubs = mode === 'answers' ? hubsA : hubsS, links = mode === 'answers' ? hubLinksA : hubLinksS;
    hubs.forEach((h, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / hubs.length; h.fx = cx + Math.cos(a) * R * .9; h.fy = cy + Math.sin(a) * R * .9; h.x = h.fx; h.y = h.fy; });
    sim.nodes([...wn, ...hubs]);
    sim.force('charge', d3.forceManyBody().strength(d => d.kind === 'hub' ? -80 : -320))
       .force('hublink', d3.forceLink(links).distance(mode === 'answers' ? 120 : 150).strength(.6))
       .force('link', d3.forceLink(threads).distance(120).strength(.04))
       .force('x', d3.forceX(cx).strength(.03)).force('y', d3.forceY(cy).strength(.03));
    hubLinkSel = gHubLinks.selectAll('line').data(links).join('line').attr('class', 'hublink');
    hubSel = gHubs.selectAll('circle').data(hubs).join('circle').attr('class', 'hub').attr('r', 13).on('click', (e, d) => { showHub(d); e.stopPropagation(); });
    hubLblSel = gHubs.selectAll('g').data(hubs).join('g');
    hubLblSel.append('text').attr('class', 'hublbl').attr('text-anchor', 'middle').attr('y', 30).text(d => d.label);
    hubLblSel.append('text').attr('class', 'hubsub').attr('text-anchor', 'middle').attr('y', 43).text(d => (mode === 'answers' ? hubLinksA : hubLinksS).filter(l => l.target === d).length + ' witnesses');
  } else if (mode === 'time') {
    const dates = wn.map(d => d.date), d0 = Math.min(...dates), d1 = Math.max(...dates);
    const rOf = d => 50 + (d - d0) / (d1 - d0) * (R - 50);
    [0, 500, 1000].forEach(y => { gRings.append('circle').attr('class', 'ring').attr('cx', cx).attr('cy', cy).attr('r', rOf(y)); gRings.append('text').attr('class', 'ringlbl').attr('x', cx + 4).attr('y', cy - rOf(y) - 4).text(y === 0 ? 'year 1' : y); });
    gRings.append('text').attr('class', 'ringlbl').attr('x', cx + R * .7).attr('y', cy + R + 26).text('LATIN →').attr('text-anchor', 'middle');
    gRings.append('text').attr('class', 'ringlbl').attr('x', cx - R * .7).attr('y', cy + R + 26).text('← RABBINIC').attr('text-anchor', 'middle');
    const groups = {'greek-jewish': [], latin: [], rabbinic: []}; wn.forEach(w => groups[w.tradition].push(w));
    Object.values(groups).forEach(a => a.sort((p, q) => p.date - q.date));
    groups['greek-jewish'].forEach(w => { w.tx = cx; w.ty = cy - rOf(w.date); });
    groups.latin.forEach((w, i, a) => { const t = -Math.PI * .42 + (i / Math.max(1, a.length - 1)) * Math.PI * .84; w.tx = cx + Math.cos(t) * rOf(w.date); w.ty = cy + Math.sin(t) * rOf(w.date); });
    groups.rabbinic.forEach((w, i, a) => { const t = Math.PI + Math.PI * .42 - (i / Math.max(1, a.length - 1)) * Math.PI * .84; w.tx = cx + Math.cos(t) * rOf(w.date); w.ty = cy + Math.sin(t) * rOf(w.date); });
    sim.force('x', d3.forceX(d => d.tx).strength(.6)).force('y', d3.forceY(d => d.ty).strength(.6)).force('collide', d3.forceCollide(d => 8 + d.short.length * 1.6).strength(.8));
  } else if (mode === 'place') {
    const lons = wn.map(d => d.lon).filter(Number.isFinite), lats = wn.map(d => d.lat).filter(Number.isFinite);

    sim.force('x', d3.forceX(d => d.tx).strength(.5)).force('y', d3.forceY(d => d.ty).strength(.5)).force('collide', d3.forceCollide(d => 8 + d.short.length * 1.6).strength(.8));

}
