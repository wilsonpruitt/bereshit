<script>
const D = {"crux": {"id": "heaven-earth-order", "question": {"en": "Which was created first, and what is 'heaven' here?", "la": "Quid prius, coelum an terra?", "he": "שָׁמַיִם אוֹ אֶרֶץ — מִי נִבְרָא תְּחִלָּה?"}, "summary": "Chagigah 12a's ten-things list and Augustine's 'what is contained in caelum et terra' answer the same question.", "finding": "Both benches ask which was made first, and both end by refusing the question — and they refuse it with the same psalm. Ps 102:26 names the earth before the heavens: R. Yehuda bar Ilai brings it for Beit Hillel, Ambrose brings the same reversal to prove that the order of naming settles nothing, 'lest heaven be reckoned the better by the privilege of being the firstborn creature' — which is R. Shimon ben Yoḥai's stewpot and its lid and Bereshit Rabbah's closing rule that a reversed order teaches equality of honour. Where the two benches genuinely divide is on the second half of the question. Asked what 'heaven' is, the Bavli reads the answer out of the Hebrew noun — sham mayim, 'there is water' — while Latin, whose word will not spell anything, has to import a substance, and imports the empyrean: a fiery heaven, fiery from brightness and not from heat, filled with angels the moment it was made, which Comestor admits in passing that no ancient philosopher knew. Abelard throws it out and puts the four elements back, and Ibn Ezra, who never heard of him, makes the same objection from the other side: if the heavens of v. 1 are the heavens of the heavens, what will you do with the earth?"}, "witnesses": [{"id": "br-1-14", "short": "br-1-14", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["et-includes", "heaven-earth-is-everything"], "senses": ["literal"], "lemma": {"he": "אֵת הַשָּׁמַיִם וְאֵת הָאָרֶץ", "en": "et the heavens and et the earth"}, "en": "Rabbi Yishmael asked Rabbi Akiva, saying to him: ‘Because you studied under Naḥum of Gam Zo for twenty-two years, [who taught:] The words akh and rak are restrictive expressions, et and gam are inclusive expressions, [I ask you:] What is the meaning of the et that is written here [twice]?’ He said to him: ‘Had it been stated: “In the beginning God created heavens and earth [bereshit bara elohim shamayim vaaretz]” – we might have said that the heavens and the earth are deities.’ He [Rabbi Yishmael] said to him: “For it is not an empty matter for you [mikem]” (Deuteronomy 32:47) – if it is empty, it is because of you [mikem], because you do not know how to expound, because you do not exert yourself in its regard. “As it [the Torah] is your life” (Deuteronomy 32:47) – when is it your life? It is when you exert yourself in its regard. Rather [the explanation is]: “et hashamayim” – to include the sun, the moon, and the constellations; “ve’et haaretz” – to include trees, vegetation, and the Garden of Eden.", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "רַבִּי יִשְׁמָעֵאל שָׁאַל אֶת רַבִּי עֲקִיבָא אָמַר לוֹ בִּשְׁבִיל שֶׁשִּׁמַּשְׁתָּ אֶת נַחוּם אִישׁ גַּם זוּ עֶשְׂרִים וּשְׁתַּיִם שָׁנָה, אַכִין וְרַקִּין מִעוּטִין, אֶתִין וְגַמִּין רִבּוּיִן, הָדֵין אֶת דִּכְתִיב הָכָא, מַה הוּא, אֲמַר לֵיהּ, אִלּוּ נֶאֱמַר בְּרֵאשִׁית בָּרָא אֱלֹהִים שָׁמַיִם וָאָרֶץ, הָיִינוּ אוֹמְרִים הַשָּׁמַיִם וְהָאָרֶץ אֱלָהוּת הֵן, אֲמַר לֵיהּ (דברים לב, מז): כִּי לֹא דָבָר רֵק הוּא מִכֶּם, וְאִם רֵק הוּא מִכֶּם, לָמָּה שֶׁאֵין אַתֶּם יוֹדְעִין לִדְרשׁ בְּשָׁעָה שֶׁאִי אַתֶּם יְגֵעִין בּוֹ, (דברים לב, מז): כִּי הוּא חַיֵּיכֶם, אֵימָתַי הוּא חַיֵּיכֶם, בְּשָׁעָה שֶׁאַתֶּם יְגֵעִין בּוֹ. אֶלָּא אֵת הַשָּׁמַיִם, לְרַבּוֹת חַמָּה וּלְבָנָה וּמַזָּלוֹת, וְאֵת הָאָרֶץ, לְרַבּוֹת אִילָנוֹת וּדְשָׁאִין וְגַן עֵדֶן.", "olang": "he", "source": "Bereshit Rabbah 1:14 (Vilna numbering)", "notes": "The question of what 'heaven and earth' contains, asked as a question about a particle. R. Yishmael puts it to R. Akiva, who served Naḥum of Gam Zo twenty-two years and learned from him that akh and rak restrict while et and gam include: what, then, are the two ets doing here? Akiva's first answer is theological — without them we might have said that the heavens and the earth are deities — and R. Yishmael slaps it down with Deut 32:47, if the Torah is empty it is empty because of you, because you do not exert yourself in it. Then the real answer, and it is an inventory: et ha-shamayim brings in the sun, the moon and the constellations; ve-et ha-aretz brings in the trees, the plants and the Garden of Eden. Augustine asks the identical question in Latin — what is signified by the name of heaven and earth — and answers that the two words are a name for the whole creation, given in visible terms for the sake of little ones. Ramban quotes this passage by name eight hundred years later and treats it as settling the matter.", "slot": false}, {"id": "br-1-15", "short": "br-1-15", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["heaven-first", "earth-first", "both-at-once", "order-of-dignity"], "senses": ["literal"], "lemma": {"he": "כְּקַדֵּרָה וְכִסּוּיָהּ", "en": "like a stewpot and its lid"}, "en": "Beit Shammai and Beit Hillel, Beit Shammai say: The heavens were created first and the earth was created thereafter. Beit Hillel says: The earth was created first and the heavens thereafter. These cite a reason for their position and those cite a reason for their position. According to the opinion of Beit Shammai, who say that the heavens were created first and the earth thereafter, it is analogous to a king who had a throne made, and once that was made he had its footstool made. So, the Holy One blessed be He said: “The heavens are My throne and the earth is My footstool…” (Isaiah 66:1). According to the opinion of Beit Hillel, who say that the earth was created first and the heavens thereafter, it is analogous to a king who built a palace; first he built the lower sections and then he built the upper sections, so, “on the day that the Lord God made earth and the heavens” (Genesis 2:4). Rabbi Yehuda bar Ilai said: This verse, too, supports Beit Hillel: “You laid the foundations of earth in times past” (Psalms 102:26), and then, “the heavens are the work of Your hands” (Psalms 102:26). Rabbi Ḥanin said: From the same place where Scripture supports Beit Shammai, from there, Beit Hillel refute them: “The earth was” (Genesis 1:2) – it already was. Rabbi Yoḥanan said in the name of the Sages: In terms of Creation, the heavens were first, but in terms of completion, the earth was first. Rabbi Tanḥuma said: I will say the source; in terms of Creation, the heavens were first, as it is stated: “In the beginning, God created [the heavens].” In terms of completion, the earth was first, as it is stated: “On the day that the Lord God made earth and the heavens.” Rabbi Shimon ben Yoḥai said: I am surprised how it is that the fathers of the world, Beit Shammai and Beit Hillel, disagreed regarding the creation of the heavens and the earth. It is, rather, as I say, that both of them were created [at the same time,] like a stewpot and its lid, as it is stated: “[My hand also laid the foundation of the earth and My right hand measured the heavens]; I appointed them; they arise together” (Isaiah 48:13). Rabbi Elazar ben Rabbi Shimon said: If it is in accordance with the opinion of my father, why is it that at times the earth is mentioned before the heavens and at times the heavens are mentioned before the earth? Rather, it teaches that both of them are equal in importance to one another. In every place Abraham is mentioned before Isaac and Jacob, but in one place it says: “I will remember My covenant with Jacob, [and also My covenant with Isaac, and also My covenant with Abraham]” (Leviticus 26:42). This teaches that the three of them are equal in importance to one another. In every place Moses is mentioned before Aaron, but in one place it says: “It is Aaron and Moses” (Exodus 6:26). This teaches that both of them are equal in importance to one another. In every place Joshua is mentioned before Caleb, but in one place it says: “Except for Caleb son of Yefuneh the Kenizite and Joshua son of Nun” (Numbers 14:30, Numbers 32:12). This teaches that both of them are equal in importance to one another. In every place turtledoves are mentioned before young pigeons, but in one place it says: “And a young pigeon or a turtledove as a sin offering” (Leviticus 12:6). This tells you that both of them are equal in importance to one another. In every place, honor of the father is mentioned before the mother, but in one place it says: “Each of you shall fear his mother and his father” (Leviticus 19:3). This tells you that both of them are equal in importance to one another. However, the Sages said: The father takes precedence over the mother, because both he [a son] and his mother are obligated to honor his father. In every place the creation of the heavens is mentioned before the earth, but in one place it says: “On the day that the Lord God made earth and the heavens.” This tells you that both of them are equal in importance to one another.", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "בֵּית שַׁמַּאי וּבֵית הִלֵּל, בֵּית שַׁמַּאי אוֹמְרִים הַשָּׁמַיִם נִבְרְאוּ תְּחִלָּה וְאַחַר כָּךְ נִבְרֵאת הָאָרֶץ. וּבֵית הִלֵּל אוֹמְרִים הָאָרֶץ נִבְרֵאת תְּחִלָּה וְאַחַר כָּךְ הַשָּׁמַיִם. אֵלּוּ מְבִיאִין טַעַם לְדִבְרֵיהֶם, וְאֵלּוּ מְבִיאִין טַעַם לְדִבְרֵיהֶם. עַל דַּעְתֵּיהוֹן דְּבֵית שַׁמַּאי דְּאִינּוּן אָמְרִין הַשָּׁמַיִם נִבְרְאוּ תְּחִלָּה וְאַחַר כָּךְ הָאָרֶץ, מָשָׁל לְמֶלֶךְ שֶׁעָשָׂה לוֹ כִּסֵּא, וּמִשֶּׁעֲשָׂאוֹ עָשָׂה אִיפִיפוֹרִין שֶׁלּוֹ, כָּךְ אָמַר הַקָּדוֹשׁ בָּרוּךְ הוּא (ישעיה סו, א): הַשָּׁמַיִם כִּסְאִי וְהָאָרֶץ הֲדֹם רַגְלָי וגו'. וְעַל דַּעְתֵּיהוֹן דְּבֵית הִלֵּל דְּאִינּוּן אָמְרִין הָאָרֶץ נִבְרֵאת תְּחִלָּה וְאַחַר כָּךְ הַשָּׁמַיִם, מָשָׁל לְמֶלֶךְ שֶׁבָּנָה פָּלָטִין, מִשֶּׁבָּנָה אֶת הַתַּחְתּוֹנִים אַחַר כָּךְ בָּנָה אֶת הָעֶלְיוֹנִים, כָּךְ (בראשית ב, ד): בְּיוֹם עֲשׂוֹת ה' אֱלֹהִים אֶרֶץ וְשָׁמָיִם. אָמַר רַבִּי יְהוּדָה בַּר אִילָעִי, אַף דֵּין קְרָא מְסַיֵּעַ לְבֵית הִלֵּל (תהלים קב, כו): לְפָנִים הָאָרֶץ יָסַדְתָּ, וְאַחַר כָּךְ (תהלים קב, כו): וּמַעֲשֵׂה יָדֶיךָ שָׁמָיִם. אָמַר רַבִּי חָנִין מִמָּקוֹם שֶׁהַמִּקְרָא מְסַיֵּעַ לְבֵית שַׁמַּאי, מִשָּׁם בֵּית הִלֵּל מְסַלְּקִין אוֹתוֹ. (בראשית א, ב): וְהָאָרֶץ הָיְתָה, כְּבָר הָיְתָה, רַבִּי יוֹחָנָן בְּשֵׁם חֲכָמִים אָמַר, לַבְּרִיאָה שָׁמַיִם קָדְמוּ, וְלַשִּׁכְלוּל, הָאָרֶץ קָדְמָה. אָמַר רַבִּי תַּנְחוּמָא אֲנָא אַמְרֵי טַעְמָא, לַבְּרִיאָה הַשָּׁמַיִם קָדְמוּ, שֶׁנֶּאֱמַר (בראשית א, א): בְּרֵאשִׁית בָּרָא אֱלֹקִים, וְלַשִּׁכְלוּל הָאָרֶץ קָדְמָה, שֶׁנֶּאֱמַר (בראשית ב, ד): בְּיוֹם עֲשׂוֹת ה' אֱלֹהִים אֶרֶץ וְשָׁמָיִם. אָמַר רַבִּי שִׁמְעוֹן בֶּן יוֹחָאי, תָּמֵהַּ אֲנִי הֵיאַךְ נֶחְלְקוּ אֲבוֹת הָעוֹלָם בֵּית שַׁמַּאי וּבֵית הִלֵּל עַל בְּרִיַּת שָׁמַיִם וָאָרֶץ, אֶלָּא שֶׁאֲנִי אוֹמֵר שְׁנֵיהֶם לֹא נִבְרְאוּ אֶלָּא כְּאִלְפָס וְכִסּוּיָהּ, שֶׁנֶּאֱמַר (ישעיה מח, יג): קֹרֵא אֲנִי אֲלֵיהֶם יַעַמְדוּ יַחְדָּו. אָמַר רַבִּי אֶלְעָזָר בֶּן רַבִּי שִׁמְעוֹן אִם כְּדַעַת אַבָּא לָמָּה פְּעָמִים שֶׁהוּא מַקְדִּים אֶרֶץ לְשָׁמַיִם וּפְעָמִים שֶׁהוּא מַקְדִּים שָׁמַיִם לְאֶרֶץ, אֶלָּא מְלַמֵּד שֶׁשְּׁנֵיהֶם שְׁקוּלִין זֶה כָּזֶה. בְּכָל מָקוֹם הוּא מַקְדִּים אַבְרָהָם לְיִצְחָק וְיַעֲקֹב, וּבְמָקוֹם אֶחָד הוּא אוֹמֵר (ויקרא כו, מב): וְזָכַרְתִּי אֶת בְּרִיתִי יַעֲקֹב וגו', מְלַמֵּד שֶׁשְׁלָשְׁתָּן שְׁקוּלִין זֶה כָּזֶה. בְּכָל מָקוֹם הוּא מַקְדִּים משֶׁה לְאַהֲרֹן, וּבְמָקוֹם אֶחָד הוּא אוֹמֵר (שמות ו, כו): הוּא אַהֲרֹן וּמשֶׁה, מְלַמֵּד שֶׁשְּׁנֵיהֶן שְׁקוּלִין זֶה כָּזֶה. בְּכָל מָקוֹם הוּא מַקְדִּים יְהוֹשֻׁעַ לְכָלֵב, וּבְמָקוֹם אֶחָד הוּא אוֹמֵר (במדבר יד, ל): כִּי אִם כָּלֵב בֶּן יְפוּנֶה הַקְּנִזִּי וִיהוֹשֻׁעַ בִּן נוּן, מְלַמֵּד שֶׁשְּׁנֵיהֶן שְׁקוּלִין זֶה כָּזֶה. בְּכָל מָקוֹם הוּא מַקְדִּים תּוֹרִין לִבְנֵי יוֹנָה, וּבְמָקוֹם אֶחָד הוּא אוֹמֵר (ויקרא יב, ו): וּבֶן יוֹנָה אוֹ תֹר לְחַטָּאת, מַגִּיד שֶׁשְּׁנֵיהֶם שְׁקוּלִין זֶה כָּזֶה. בְּכָל מָקוֹם הוּא מַקְדִּים כִּבּוּד אָב לְאֵם, וּבְמָקוֹם אֶחָד הוּא אוֹמֵר (ויקרא יט, ג): אִישׁ אִמּוֹ וְאָבִיו תִּירָאוּ, מַגִּיד שֶׁשְּׁנֵיהֶן שְׁקוּלִין זֶה כָּזֶה, אֲבָל אָמְרוּ חֲכָמִים הָאָב קֹדֶם לָאֵם, מִפְּנֵי שֶׁהוּא וְאִמּוֹ חַיָּבִין בִּכְבוֹד אָבִיו. בְּכָל מָקוֹם הוּא מַקְדִּים בְּרִיאַת שָׁמַיִם לָאָרֶץ, וּבְמָקוֹם אֶחָד הוּא אוֹמֵר (בראשית ב, ד): בְּיוֹם עֲשׂוֹת ה' אֱלֹהִים אֶרֶץ וְשָׁמָיִם, מַגִּיד שֶׁשְּׁנֵיהֶם שְׁקוּלִין זֶה כָּזֶה.", "olang": "he", "source": "Bereshit Rabbah 1:15 (Vilna numbering)", "notes": "The crux in its classical rabbinic form, with five answers and a refusal. Beit Shammai: the heavens first, because a king has his throne made and then its footstool (Isa 66:1). Beit Hillel: the earth first, because a king building a palace builds the lower parts first, and because Gen 2:4 says 'earth and heavens'. R. Yehuda bar Ilai adds Ps 102:26, 'you laid the foundations of the earth in times past, and the heavens are the work of your hands'. R. Ḥanin turns Beit Shammai's own proof against them: 'the earth WAS' — it already was. R. Yoḥanan in the sages' name splits the question: in creation heaven was first, in completion the earth. Then R. Shimon ben Yoḥai says he is astonished that the fathers of the world should have disputed it at all, since both were created together like a stewpot and its lid (Isa 48:13, 'I call to them, they stand up together'). The section closes with a rule for reading Scripture's word order generally: where the sequence is reversed in one place, that teaches that the two are equal — turtledoves and pigeons, father and mother, heaven and earth. That rule is what Ambrose reaches independently in Milan.", "slot": false}, {"id": "b-chag-12a-order", "short": "b-chag-12a-order", "author": "Babylonian Talmud", "tradition": "rabbinic", "date": 550, "datelabel": "redaction 500–600", "place": "Babylonia (Sura / Pumbedita)", "lat": 32.5, "lon": 44.4, "answers": ["heaven-first", "earth-first", "both-at-once", "created-then-stretched"], "senses": ["literal"], "lemma": {"he": "בֵּית שַׁמַּאי אוֹמְרִים שָׁמַיִם נִבְרְאוּ תְּחִלָּה", "en": "Beit Shammai say: the heavens were created first"}, "en": "Our Rabbis have taught, The house of Shammai say, The heavens were created first, and afterwards the earth was created, as it is said, (Genesis 1:1) \"In the beginning God created the heaven and the earth.\" But the house of Hillel say, The earth was created first, and afterwards the heavens, as it is said, (Genesis 2:4) \"In the day that the Lord God made earth and heaven.\" The house of Hillel said to the house of Shammai, According to you, [does] a person builds an upper story, and afterwards builds the house? [The heavens are called an upper story,] as it is said, (Amos 9:6) \"He builds his upper story in the heavens and sets its foundation on the earth.\" The house of Shammai said to the house of Hillel, According to you, [does] a person makes a footstool and afterwards makes a throne? [The heavens are called a throne,] as it is said, (Isaiah 66:1) \"So says the Lord, The heaven is My throne and the earth is My footstool.\" But the sages say, This and that were created at once, as it is said, (Isaiah 48:13) \"My own hand laid the foundations of the earth, and my right hand spread out the heavens; when I summon them, they all stand up together.\" And the other [opinions of Shammai and Hillel], what is \"together\"? That they cannot be separated the one from the other [once created]. The verses contradicts each other! Resh Lakish said, When they were created, He created the heavens, and afterwards created the earth, but when He stretched them out, He stretched out the earth, and afterwards stretched out the heavens.", "translator": "Sefaria Community Translation", "orig": "ת\"ר ב\"ש אומרים שמים נבראו תחלה ואח\"כ נבראת הארץ שנאמר בראשית ברא אלהים את השמים ואת הארץ וב\"ה אומרים ארץ נבראת תחלה ואח\"כ שמים שנאמר (בראשית ב, ד) ביום עשות ה' אלהים ארץ ושמים אמר להם ב\"ה לב\"ש לדבריכם אדם בונה עלייה ואח\"כ בונה בית שנאמר (עמוס ט, ו) הבונה בשמים מעלותיו ואגודתו על ארץ יסדה אמר להם ב\"ש לב\"ה לדבריכם אדם עושה שרפרף ואח\"כ עושה כסא שנאמר (ישעיהו סו, א) כה אמר ה' השמים כסאי והארץ הדום רגלי וחכ\"א זה וזה כאחת נבראו שנאמר (ישעיהו מח, יג) אף ידי יסדה ארץ וימיני טפחה שמים קורא אני אליהם יעמדו יחדו ואידך מאי יחדו דלא משתלפי מהדדי קשו קראי אהדדי אמר ר\"ל כשנבראו ברא שמים ואח\"כ ברא הארץ וכשנטה נטה הארץ ואחר כך נטה שמים", "olang": "arc", "source": "b. Chagigah 12a (Vilna)", "notes": "The Babylonian redaction of the same dispute, and it argues where Bereshit Rabbah illustrates. Beit Hillel now put the objection as a question — on your view does a man build the upper storey and then the house? (Amos 9:6) — and Beit Shammai answer in kind: on your view does a man make a footstool and then a throne? (Isa 66:1). The sages say both at once, from Isa 48:13, and the Bavli will not leave it there: if 'together' only means that once made they cannot be parted, the two proof-texts still contradict each other, and Resh Lakish settles it with a distinction the Palestinian version does not have — when they were created, heaven was created first; when they were stretched out, the earth was stretched out first. It is the same move Hugh of St Victor makes in Paris six hundred years later with 'not order but dignity', and R. Yoḥanan's 'in creation first, in completion first' in Bereshit Rabbah: the sequence of the words is not the sequence of the acts.", "slot": false}, {"id": "b-chag-12a-shamayim", "short": "b-chag-12a-shamayim", "author": "Babylonian Talmud", "tradition": "rabbinic", "date": 550, "datelabel": "redaction 500–600", "place": "Babylonia (Sura / Pumbedita)", "lat": 32.5, "lon": 44.4, "answers": ["shamayim-is-water"], "senses": ["literal"], "lemma": {"he": "מַאי שָׁמַיִם", "en": "What is 'heaven'?"}, "en": "What is heaven? R. Yose bar Chanina said, That there is water. It was taught in a Mishnah, fire and water. Teaching that the Holy One, blessed be He, brought them and mingled them one with the other, and made from them the firmament.", "translator": "Sefaria Community Translation", "orig": "מאי שמים א\"ר יוסי בר חנינא ששם מים במתניתא תנא אש ומים מלמד שהביאן הקב\"ה וטרפן זה בזה ועשה מהן רקיע", "olang": "arc", "source": "b. Chagigah 12a (Vilna)", "notes": "The crux's second half asked in three words — mai shamayim, what is heaven — and answered from the name itself. R. Yose bar Ḥanina: sham mayim, 'there is water'. A mishnaic tradition: fire and water, which the Holy One brought and mingled with each other, and out of them made the firmament. It is an answer of exactly the kind the Latin bench never gives, because the Latin word yields nothing: caelum can be etymologised (Isidore tries chaos, others caelare, 'to engrave', for the stars) but it cannot be made to spell out what heaven is made of. Where the Bavli reads the substance out of the noun, Remigius and the Glossa have to import a substance — the empyrean, fiery not by heat but by brightness — from elsewhere.", "slot": false}, {"id": "b-chag-12a-akiva", "short": "b-chag-12a-akiva", "author": "Babylonian Talmud", "tradition": "rabbinic", "date": 550, "datelabel": "redaction 500–600", "place": "Babylonia (Sura / Pumbedita)", "lat": 32.5, "lon": 44.4, "answers": ["et-includes"], "senses": ["literal"], "lemma": {"he": "מַאי דָּרַשׁ בְּאֵת הַשָּׁמַיִם וְאֵת הָאָרֶץ", "en": "what did he expound on 'et the heavens and et the earth'?"}, "en": "R. Yishmael asked R. Akiva, while they were walking on the road. He said to him, You are one who served Nachum Ish Gamzu for twenty-two years, who expounded the meaning of all the particles \"et\" in the Torah. What was his exposition of \"the heaven and earth\" - \"et hashamayim v'et ha'aretz\"? He said to him, If it had said \"shamayim va'aretz,\" I would have said, \"Shamayim\" is the name of the Holy One, blessed be He. Now that the words are \"et hashamayim v'et ha'aretz,\" \"shamayim\" means the heaven, literally, and aretz means the earth, literally.", "translator": "Sefaria Community Translation", "orig": "שאל רבי ישמעאל את ר\"ע כשהיו מהלכין בדרך א\"ל אתה ששימשת את נחום איש גם זו כ\"ב שנה שהיה דורש כל אתין שבתורה את השמים ואת הארץ מה היה דורש בהן א\"ל אילו נאמר שמים וארץ הייתי אומר שמים שמו של הקב\"ה עכשיו שנאמר את השמים ואת הארץ שמים שמים ממש ארץ ארץ ממש", "olang": "arc", "source": "b. Chagigah 12a (Vilna)", "notes": "The same encounter as Bereshit Rabbah 1:14 — R. Yishmael asking R. Akiva what Naḥum of Gam Zo made of the two ets — and the answer has changed. Here Akiva says that without the particles he would have taken shamayim to be a name of the Holy One, blessed be He; now that the text reads et ha-shamayim ve-et ha-aretz, heaven means heaven literally and earth means earth literally. In the Palestinian version the danger is that the heavens and the earth would be taken for deities and Akiva is rebuked for the answer; here the danger is narrower, that one word would be a divine name, and the answer stands unchallenged. Both are a Jewish witness to the same anxiety the Latin bench meets at Megillah 9a and in the Greek word order (K3). And note what neither version does: it never occurs to either that the et might include the angels.", "slot": false}, {"id": "ibn-ezra-1-1b", "short": "ibn-ezra-1-1b", "author": "Abraham ibn Ezra", "tradition": "rabbinic", "date": 1155, "datelabel": "c. 1155", "place": "Lucca", "lat": 43.84, "lon": 10.5, "answers": ["one-earth-only"], "senses": ["literal"], "lemma": {"he": "שְׁמֵי הַשָּׁמַיִם", "en": "the heavens of the heavens"}, "en": "Now don’t be surprised by the vav of veha’aretz (“and the earth’), for its meaning is like the feh in Arabic and like “and a mist” v’ed would rise up from the earth” Genesis 2:6, for Moshe did not speak about the World to Come, which is the world of the angels, but rather of this transitory world. And those who explain that the heavens in the first verse are really the heavenly heavens, what will they do [here] with the earth? Behold, complete proofs, for reasonable people, that there is only earth. Now it is expounded that there were seven earths is [actually] that the earth is divided into seven and the Temple was in the center of the settled region, for it was distant from the center of the earth.", "translator": "Sefaria Community Translation", "orig": "ואל תתמה על וי\"ו והארץ כי פירושו כפ\"א רפה בלשון ישמעאל, וכמוהו \"ואד יעלה מן הארץ\" (בראשית ב ו), כי לא דבר משה על העולם הבא, שהוא עולם המלאכים כי אם על עולם ההויה והשחתה, והמפרשים שהשמים בפסוק הראשון הם שמי השמים, מה יעשו בארץ, והנה ראיות גמורות לאנשי שיקול הדעת שאין שם רק ארץ אחת ודרש שבע ארצות הוא שהיישוב נחלק על שבעה ובית המקדש היה באמצע היישוב כי רחוק הוא מאמצע הארץ", "olang": "he", "source": "Ibn Ezra on Gen 1:2, s.v. והארץ (on the heavens of v. 1)", "notes": "A grammarian refusing the whole allegorical apparatus, and the argument is a symmetry argument. Moses, he says, did not speak of the world to come, which is the world of the angels, but of this world of coming-to-be and passing-away; and to those who explain that the heavens of the first verse are really the heavens of the heavens he puts one question — then what will you do with the earth? If shamayim in v. 1 is the intelligible heaven, aretz beside it must be something other than the ground, and no one is willing to say so. That is precisely the position of Remigius, the Glossa and Comestor, who take the heaven of v. 1 to be the empyrean and are then obliged to make the earth beside it into prime matter or the four elements. Ibn Ezra also disposes of the seven earths: there is one earth, divided into seven settled regions, with the Temple at the centre of the settlement and not at the centre of the globe.", "slot": false}, {"id": "ramban-1-1b", "short": "ramban-1-1b", "author": "Moses ben Naḥman (Naḥmanides)", "tradition": "rabbinic", "date": 1267, "datelabel": "1263–1270", "place": "Girona", "lat": 41.98, "lon": 2.82, "answers": ["heaven-earth-four-elements", "et-includes", "heaven-earth-is-everything"], "senses": ["literal"], "lemma": {"he": "וְהָאָרֶץ תִּכְלֹל אַרְבַּע הַיְּסוֹדוֹת", "en": "'the earth' includes all four elements"}, "en": "And the earth, includes all the four elements, [not merely the land] as in the verse, And the heaven and the earth were finished, which includes the entire lower sphere, and in Praise the Eternal from the earth, ye sea-monsters, and all deeps, and as in many other verses. Now with this creation, which was like a very small point having no substance, everything in the heavens and on the earth was created. The word eth —[eth hashamayim ve’eth ha’aretz] — is like “the essence of a thing.” The Sages have always set it forth as serving to include, since it is derived from the expression, The morning ‘atha’ (cometh), and also the night. And so did our Rabbis say: “‘Eth hashamayim (the heavens)’ — eth includes the sun, moon, stars and constellations. ‘Ve’eth ha’aretz (and the earth)’ — ve’eth includes the trees, herbs, and the Garden of Eden.” These include all created things which are corporeal.", "translator": "Charles B. Chavel, 1971–76", "orig": "\"וְהָאָרֶץ\" תִּכְלֹל אַרְבַּע הַיְּסוֹדוֹת כֻּלָּם, כְּמוֹ \"וַיְכֻלּוּ הַשָּׁמַיִם וְהָאָרֶץ וְכָל צְבָאָם\" (בראשית ב':א'), שֶׁתִּכְלֹל כָּל הַכַּדּוּר הַתַּחְתּוֹן. וְכֵן \"הַלְלוּ אֶת ה' מִן הָאָרֶץ תַּנִּינִים וְכָל תְּהֹמוֹת\" (תהלים קמח ז), וְזוּלָתָם רַבִּים. וְהִנֵּה בַּבְּרִיאָה הַזֹּאת, שֶׁהִיא כִּנְקֻדָּה קְטַנָּה דַּקָּה וְאֵין בָּהּ מַמָּשׁ, נִבְרְאוּ כָּל הַנִּבְרָאִים בַּשָּׁמַיִם וּבָאָרֶץ. וּמִלַּת אֵת, כְּמוֹ עֶצֶם הַדָּבָר. וְדָרְשׁוּ בָּהּ שֶׁהִיא לְעוֹלָם לְרַבּוֹת, כִּי הִיא נִגְזְרָה מִן \"אָתָה בֹקֶר וְגַם לָיְלָה\" (ישעיהו כא יב). וְכֵן אָמְרוּ רַבּוֹתֵינוּ (ברשית רבה פרשה א): \"אֵת הַשָּׁמַיִם\", לְרַבּוֹת חַמָּה וּלְבָנָה כּוֹכָבִים וּמַזָּלוֹת; \"וְאֵת הָאָרֶץ\", לְרַבּוֹת הָאִילָנוֹת וּדְשָׁאִים וְגַן עֵדֶן. וְאֵלּוּ כְּלַל כָּל הַנִּבְרָאִים בַּעַל הַגּוּף.", "olang": "he", "source": "Ramban on Gen 1:1, s.v. בראשית (the four elements and the particle et)", "notes": "Ramban gives the Latin schools' answer and the midrash's answer in the same paragraph, and does not notice that they are two. 'The earth' takes in all four elements — as in 'the heavens and the earth were finished', which covers the whole lower sphere, and 'praise the Lord from the earth, you sea-monsters and all deeps' — which is Abelard's reading of the verse to the letter, and Ambrose's before him. Then the particle: et is like 'the essence of a thing', and the Sages have always expounded it as including, so that et ha-shamayim brings in the sun, moon, stars and constellations and ve-et ha-aretz the trees, herbs and the Garden of Eden. He names Bereshit Rabbah for it. The two answers pull opposite ways — one makes the two words a physics of elements, the other an inventory of furniture — and the sentence that joins them is 'these include all created things which are corporeal'. Chavel's English shows on Sefaria as CC BY; licence key chavel-ramban is marked for checking before publication.", "slot": false}, {"id": "ambrose-hex-1-6-20", "short": "ambrose-hex-1-6-20", "author": "Ambrose", "tradition": "latin", "date": 387, "datelabel": "c. 387", "place": "Milan", "lat": 45.46, "lon": 9.19, "answers": ["heaven-earth-four-elements"], "senses": ["literal"], "lemma": {"la": "In his enim quatuor illa elementa creata sunt", "en": "For in these two the four elements were created"}, "en": "In the beginning of time, then, God made heaven and earth. For time is from this world, not before the world; and a day is a portion of time, not its beginning. And although from the order of the reading we could establish that the Lord first made day and night, which are the alternations of times, and on the second day made the firmament, by which he divided the water which is under heaven from the water which is above heaven — yet for the present assertion it is enough that in the beginning he made heaven, from which comes the prerogative of generation and its cause; and made earth, in which the substance of generation should be. For in these two the four elements were created, out of which are generated all these things which belong to the world. And the elements are four — air, fire, water, and earth — which are mingled with one another in all things. Indeed you will find fire in the earth too, which is often struck out of stones and iron; and in heaven, since the vault is fiery and glitters with shining stars, water can be understood to be, which is either above heaven, or is often sent down from that upper place upon the earth in a full shower.", "translator": "claude-draft", "orig": "In principio itaque temporis coelum et terram Deus fecit. Tempus enim ab hoc mundo, non ante mundum: dies autem temporis portio est, non principium. Et quamquam lectionis serie possimus adstruere quod primo diem fecerit Dominus et noctem, quae sunt vices temporum; et secundo die firmamentum fecerit, quo discrevit aquam quae sub coelo est, et aquam quae super coelum; tamen satis est ad praesentem assertionem, quod in principio coelum fecerit, unde praerogativa generationis et causa; et terram fecerit, in qua esset generationis substantia. In his enim quatuor illa elementa creata sunt, ex quibus generantur omnia ista quae mundi sunt. Elementa autem quatuor, aer, ignis, aqua, et terra, quae in omnibus sibi mixta sunt.", "olang": "la", "source": "PL 14, col. 132A", "notes": "The chapter heading Migne prints over this is the crux itself: 'that in heaven and earth the four elements were created, out of which all things are composed; of what substance heaven is, and what the position of the earth.' Ambrose's answer is that the two words are a container for the four elements — heaven supplying the prerogative and cause of generation, earth the substance of it — and he proves the mixture empirically, fire struck from flint and iron in the earth, water inferred in heaven from the rain and from the waters above. It is Abelard's reading of the verse seven hundred years early and Ramban's a century after Abelard, and none of the three cites another. Rabanus copies this paragraph verbatim at PL 107:444B, where K1 has already built it.", "slot": false}, {"id": "ambrose-hex-1-6-24", "short": "ambrose-hex-1-6-24", "author": "Ambrose", "tradition": "latin", "date": 387, "datelabel": "c. 387", "place": "Milan", "lat": 45.46, "lon": 9.19, "answers": ["both-at-once", "order-of-dignity"], "senses": ["literal"], "lemma": {"la": "nihil interest quid prius exprimas, cum simul utrumque sit factum", "en": "it makes no difference which you utter first, since both were made together"}, "en": "For David said: 'In the beginning you founded the earth, Lord, and the heavens are the works of your hands. They shall perish, but you remain, and all shall grow old as a garment, and as a cloak you shall change them, and they shall be changed; but you are the same, and your years shall not fail' (Ps 102:26 [Vg 101:26]). Which the Lord so confirmed in the Gospel that he said: 'Heaven and earth shall pass away, but my words shall not pass away' (Matt 24:35). Those, then, accomplish nothing who thought a fifth, ethereal body had to be brought in to establish the perpetuity of heaven — since they equally see that a part of a single limb joined on unlike the rest usually brings more harm to the body. Note this at the same time, that when the prophet David named the earth in the first place (Ps 148:5) and heaven afterwards, he judged that the work of the Lord had to be declared; for when he said 'and they were made', it makes no difference which you utter first, since both were made together — and at the same time, lest even this prerogative should seem to be adjudged to heaven's divine substance, that it should be reckoned the better by the privilege of being the firstborn creature.", "translator": "claude-draft", "orig": "Dixit enim David: Principio terram tu fundasti, Domine, et opera manuum tuarum sunt coeli. Ipsi peribunt, tu autem permanes, et omnia sicut vestimentum veterascent, et tamquam amictum mutabis ea, et mutabuntur; tu vero ipse es, et anni tui non deficient (Psal. CI, 26 et seq.) . Quod adeo probavit in Evangelio Dominus, ut diceret: Coelum et terra praeteribunt, mea autem verba non praeteribunt (Matth. XXIV, 35) . Nihil igitur agunt, qui propter coeli asserendam perpetuitatem, quintum corpus aethereum introducendum putarunt; cum aeque videant dissimilem caeteris adjunctam membri unius portionem, labem corpori magis afferre consuevisse. Simul illud adverte, quia propheta David cum terram priori loco nominavit (Ps. CXLVIII, 5) , et postea coelum, credidit opus esse Domini declarandum; quando enim dixit et facta sunt, nihil interest quid prius exprimas, cum simul utrumque sit factum; simul ne haec saltem praerogativa coelo divinae videatur adjudicata substantiae, ut primogenitae creaturae privilegio potior aestimetur.", "olang": "la", "source": "PL 14, col. 135B", "notes": "The Latin answer that matches the rabbinic one exactly, and it turns on the same verse. Ps 102:26 names the earth first and the heavens second — the proof R. Yehuda bar Ilai brings for Beit Hillel in Bereshit Rabbah 1:15 — and Ambrose draws from it not that the earth was made first but that the order of naming decides nothing, since both were made together; and then the reason, which is the interesting half: lest heaven be given the privilege of the firstborn. That is R. Shimon ben Yoḥai's stewpot and its lid, and it is Bereshit Rabbah's closing rule that a reversed order teaches equality of honour. Two benches, one psalm verse, the same conclusion, and no contact of any kind.", "slot": false}, {"id": "aug-gnm-1-7-11", "short": "aug-gnm-1-7-11", "author": "Augustine", "tradition": "latin", "date": 389, "datelabel": "388–389", "place": "Thagaste", "lat": 36.29, "lon": 7.95, "answers": ["heaven-earth-is-everything", "pair-is-formless-matter"], "senses": ["literal"], "lemma": {"la": "coeli et terrae nomine universa creatura significata est", "en": "by the name of heaven and earth the whole creation is signified"}, "en": "But as to what is said, 'In the beginning God made heaven and earth' — by the name of heaven and earth the whole creation is signified, which God made and founded. And these were called by the names of visible things on account of the weakness of little ones, who are less able to grasp invisible things. First, then, was made the confused and formless matter, out of which should be made all the things that are distinguished and formed — which I believe is called chaos by the Greeks. For so we read it said elsewhere too, in the praises of God: 'You who made the world out of formless matter' (Wis 11:17) — which some manuscripts have as 'out of unseen matter'.", "translator": "claude-draft", "orig": "Sed illud quod dictum est, In principio fecit Deus coelum et terram, coeli et terrae nomine universa creatura significata est, quam fecit et condidit Deus. Ideo autem nominibus visibilium rerum haec appellata sunt, propter parvulorum infirmitatem, qui minus idonei sunt invisibilia comprehendere. Primo ergo materia facta est confusa et informis, unde omnia fierent quae distincta atque formata sunt, quod credo a Graecis chaos appellari. Sic enim et alio loco legimus dictum in laudibus Dei, Qui fecisti mundum de materia informi (Sap. XI, 18) : quod aliqui codices habent, de materia invisa.", "olang": "la", "source": "PL 34, col. 178", "notes": "The answer that dissolves the question. 'Heaven and earth' is not a list of two things in an order; it is a name for everything God made, put in visible words because the audience cannot yet hold invisible ones. The Bavli's ten-things list is answering the same question — what does 'heaven and earth' contain, and what else was made with them — and answers it by enumeration where Augustine answers it by generalisation. Note also the variant Augustine records at the end: some copies of Wis 11:17 read 'de materia invisa' for 'de materia informi'. His own text of Gen 1:2, 'invisibilis et incomposita', is the reason he notices.", "slot": false}, {"id": "aug-gnl-1-9", "short": "aug-gnl-1-9", "author": "Augustine", "tradition": "latin", "date": 410, "datelabel": "401–415", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["whole-then-parts", "heaven-earth-is-everything"], "senses": ["literal"], "lemma": {"la": "prius universaliter … deinde per partes", "en": "first universally … then in its parts"}, "en": "And why is it said thus, 'In the beginning God made heaven and earth', and not said, 'In the beginning God said, Let heaven and earth be made; and heaven and earth were made', as it is told of the light, 'God said, Let there be light; and light was made'? Was it that first, under the name of heaven and earth, what God made had to be taken in universally and commended; and then to be gone through in its parts — how he made it — when at each thing it is said, 'God said', that is, because through his Word he made whatever he made?", "translator": "claude-draft", "orig": "Et cur ita dictum est, In principio fecit Deus coelum et terram; et non dictum est, In principio dixit Deus, Fiat coelum et terra; et facta sunt coelum et terra: sicut de luce narratur, Dixit Deus, Fiat lux; et facta est lux? Utrum prius universaliter nomine coeli et terrae comprehendendum erat et commendandum quod fecit Deus; et deinde per partes exsequendum, quomodo fecit, cum per singula dicitur, Dixit Deus; id est, quia per Verbum suum fecit, quidquid fecit?", "olang": "la", "source": "PL 34, col. 249", "notes": "A question about the shape of the sentence, and the answer settles what 'heaven and earth' is doing in it: the phrase is a heading. Scripture takes the whole in at one stroke and commends it, and only then goes through the parts with 'God said' at each — which is why v. 1 has no 'let there be' in it. Augustine offers a second answer immediately after (that formless matter cannot be addressed with 'let it be made', since it does not yet imitate the Word), which belongs to K4. This paragraph is the one the Carolingians take: Angelomus compresses it into two lines, and it stands at the head of the Glossa's VERS. 1 in the margin, which K1 has already sliced whole.", "slot": false}, {"id": "alcuin-int-28", "short": "alcuin-int-28", "author": "Alcuin", "tradition": "latin", "date": 796, "datelabel": "c. 796", "place": "Tours", "lat": 47.39, "lon": 0.69, "answers": ["heaven-earth-is-everything", "heaven-is-empyrean"], "senses": ["literal"], "lemma": {"la": "non quia jam hoc erat, sed quia jam hoc esse poterat", "en": "not because it already was this, but because it already could be this"}, "en": "Question 28. What is signified by the name of heaven and earth, when it is said, 'In the beginning God made heaven and earth' (Gen 1:1)? — Answer. That formless matter, which God made out of nothing, was first called heaven and earth: not because it already was this, but because it already could be this. For on the second day this starry heaven is read to have been made, and on the third day the earth to have appeared and begun to be clothed with flowers. Or else, by the name of heaven and earth the spiritual and the earthly creatures can be understood.", "translator": "claude-draft", "orig": "Inter. 28. Quid in coeli terraeque nomine significatur, quando dicitur: In principio fecit Deus coelum et terram (Gen. I, 1) ?-- Resp. Informis illa materia, quam de nihilo fecit Deus, appellata est primo coelum et terra: non quia jam hoc erat, sed quia jam hoc esse poterat. Nam secundo die coelum istud sidereum factum esse legitur, et tertio die terram apparuisse et vestiri floribus coepisse. Sive, in coeli et terrae nomine spirituales et terrenae creaturae intelligi possunt.", "olang": "la", "source": "PL 100, col. 519C", "notes": "Augustine reduced to a rule a pupil can hold: heaven and earth in v. 1 are the names of formless matter, given proleptically — not because it already was this, but because it already could be this — and the proof is the calendar, since the starry heaven comes on the second day and the earth appears on the third. Then, as usual, Alcuin adds the alternative without weighing it: 'or else the spiritual and the earthly creatures'. That second answer is the seed of the empyrean reading which Remigius, the Glossa and Comestor will make the standard one.", "slot": false}, {"id": "angelom-gen-1-1b", "short": "angelom-gen-1-1b", "author": "Angelomus of Luxeuil", "tradition": "latin", "date": 850, "datelabel": "c. 850", "place": "Luxeuil", "lat": 47.82, "lon": 6.38, "answers": ["whole-then-parts"], "senses": ["literal"], "lemma": {"la": "prius universaliter nomine coeli et terrae comprehendendum erat", "en": "first it had to be taken in universally under the name of heaven and earth"}, "en": "But it is asked why it is said thus: 'In the beginning God made heaven and earth', and not said: 'In the beginning God said, Let heaven and earth be made', as it is told of the light: 'God said, Let there be light', and the rest? — Unless because first what he made had to be taken in universally under the name of heaven and earth, and commended, and then gone through in its parts, as it is read to have been done.", "translator": "claude-draft", "orig": "Sed quaeritur cur ita dictum est: In principio fecit Deus coelum et terram, et non dictum est: In principio dixit Deus: Fiat coelum et terra, sicut de luce narratur: Dixit Deus: Fiat lux, et reliqua? Nisi quia prius universaliter nomine coeli et terrae comprehendendum erat, et commendandum quod fecit, et deinde per partes exsequendum, sicuti actum legitur.", "olang": "la", "source": "PL 115, col. 114C", "notes": "Augustine's question and his first answer, compressed to two sentences and shorn of the second answer that made the first provisional. What in De Genesi ad litteram is one horn of a dilemma ('was it that…? or was it that…?') is here the explanation, flatly. The sentences that follow immediately are Angelomus' treatment of 'empty and void' (built at K6), so this witness and that one are one continuous stretch of his commentary divided between two cruxes.", "slot": false}, {"id": "remigius-gen-1-1b", "short": "remigius-gen-1-1b", "author": "Remigius of Auxerre", "tradition": "latin", "date": 900, "datelabel": "c. 900", "place": "Auxerre", "lat": 47.8, "lon": 3.57, "answers": ["heaven-is-empyrean", "heaven-earth-four-elements"], "senses": ["literal"], "lemma": {"la": "illud empyreum, id est igneum, vel intellectuale coelum", "en": "that empyrean, that is fiery, or intellectual heaven"}, "en": "'For he created heaven and earth.' By 'heaven' we ought not to understand this visible firmament, but that empyrean — that is, fiery, or intellectual — heaven, which is called fiery not from burning but from brightness, and which was at once filled with the angelic spirits, of whom it is said in Job: 'When the morning stars praised me together, and all the sons of God shouted for joy' (Job 38:7). And note that three elements are named here. For under the name of heaven gather the air; under the name of earth, the earth itself, and the fire that lies hidden in its bowels. Of the fourth element, that is water, mention is made in what follows.", "translator": "claude-draft", "orig": "Creavit enim coelum et terram. Coelum non istud visibile firmamentum accipere debemus, sed illud empyreum, id est igneum, vel intellectuale coelum quod non ab ardore, sed a splendore igneum dicitur, quod statim repletum est angelicis spiritibus de quibus in Job dicitur: Cum me laudarent simul astra matutina et jubilarent omnes filii Dei (Job XXXVIII, 7) . Et nota tria hic elementa commemorari. Nomine enim coeli aerem collige, nomine terrae ipsam terram, et ignem qui in ejus visceribus latet. Quarti vero elementi, id est aquae, in sequentibus fit commemoratio.", "olang": "la", "source": "PL 131, col. 54D", "notes": "The empyrean enters the Latin gloss tradition here in the form it will keep: not the visible firmament but a fiery heaven, and fiery from brightness rather than heat — the qualification matters, because it is what makes the fire intelligible rather than physical — filled with angels the moment it was made, on the authority of Job 38:7. The Glossa prints this sentence almost word for word at PL 113:68C, inside the VERS. 1 block that K1 slices whole, and from there it reaches Comestor. Remigius then counts the elements out of the two words and finds only three, water being held over to v. 2 — where Ambrose and Abelard find all four.", "slot": false}, {"id": "abelard-hex-1-1b", "short": "abelard-hex-1-1b", "author": "Peter Abelard", "tradition": "latin", "date": 1130, "datelabel": "c. 1130", "place": "The Paraclete (Nogent-sur-Seine)", "lat": 48.49, "lon": 3.5, "answers": ["heaven-earth-four-elements", "one-earth-only"], "senses": ["literal"], "lemma": {"la": "Coeli et terrae nomine hoc loco quatuor elementa comprehendi arbitror", "en": "By the name of heaven and earth I judge the four elements to be taken in here"}, "en": "By the name of heaven and earth I judge the four elements to be taken in here, out of which, as out of a material first beginning, all other bodies are agreed to be composed. By 'heaven' he means the two light elements, that is fire and air. The remaining two, which are heavy, he calls generally 'earth'. For we call heaven both the airy — as in 'the birds of heaven' — and the ethereal, which is fiery. Whence it is not unfitting that he here names both air and fire 'heaven'. It is agreed too that the ethereal heaven, in that its fire is purer, is properly wont to be called heaven; whence with reason the name of heaven, since the purer the fire the lighter its nature, is here put, as has been said, for the two light elements, fire and air. Just so, on the contrary, by 'earth', whose nature is most heavy and weighty, he marks out both the earth itself and the water that clings to it. These four elements, then, as the first principles of all other bodies, he announces that God made in the beginning. And what he says is as if he said: In the beginning, before all those things which he enumerates in order, and of whose completion he adds afterwards, 'Thus the heavens were finished' (Gen 2:1). What he says, 'in the beginning' of the works that follow, is as if he said: In the beginning of the world, that is, before he brought about anything of those things which belong to the world. For the angels, being of an incorporeal nature, are not included among the creatures of the world, as men are, of whom the philosopher makes mention in the third book of the Topics: 'The world,' he says, 'is governed by Providence; but men are a part of the world; therefore human affairs are governed by Providence.'", "translator": "claude-draft", "orig": "Coeli et terrae nomine hoc loco quatuor elementa comprehendi arbitror, ex quibus tanquam materiali primordio caetera omnia corpora constat esse composita. Coelum quidem duo levia elementa, ignem videlicet atque aerem dicit. Reliqua vero duo quae gravia sunt, terram generaliter vocat. Coelum quippe tam aereum dicimus, juxta illud, volucres coeli, quam aethereum quod est igneum. Unde non incongrue tam aerem quam ignem coelum hic nominat. Constat etiam coelum aethereum: quo purior est ignis, coelum proprie solere dici. Unde merito nomen coeli, quod quanto purior est ignis, tanto levioris est naturae, pro duobus, ut dictum, levibus elementis igne scilicet atque aere hic positum esse intelligitur. Sicut e contrario per terram, cujus maxime gravis est et ponderosa natura, tam terram ipsam quam ei adhaerentem aquam determinat. Haec itaque quatuor elementa tanquam caeterorum corporum principia Deum in principio fecisse praenuntiat. Et tale est quod dicit, In principio, ac si diceret, ante illa omnia quae consequenter enumerat, et de quorum etiam consummatione postmodum subdit: Igitur perfecti sunt coeli, etc. (Gen. II, 1.) Tale est quod dicit in principio sequentium operum, ac si diceret: In principio mundi, id est antequam quidquam de his quae de mundo sunt efficeret. Non enim angeli, cum incorporeae sint natureae, inter mundanas creaturas comprehenduntur, sicut homines, de quibus in III Topic. philosophus meminit. « Mundus, inquit, Providentia regitur, hemines autem pars mundi sunt; humanae igitur res Providentia reguntur. »", "olang": "la", "source": "PL 178, col. 733C", "notes": "The most thoroughly physical reading of the verse on the Latin bench, and it ends by throwing the angels out. Heaven names the two light elements, fire and air; earth names the two heavy, earth and the water that clings to it; and the whole verse announces that God made the four elements as the first principles of bodies. Then the consequence, stated without embarrassment: the angels are not included among the creatures of the world at all, being incorporeal, so 'in the beginning of the world' does not touch them — and Boethius' Topics is quoted for the premise that men are a part of the world. That is the exact position Remigius and the Glossa deny, and it is what Ibn Ezra argues for in Lucca, from the other direction, when he asks those who make the heavens of v. 1 the heaven of heavens what they will then do with the earth.", "slot": false}, {"id": "hugh-sacr-1-1b", "short": "hugh-sacr-1-1b", "author": "Hugh of St Victor", "tradition": "latin", "date": 1134, "datelabel": "1130–1137", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["order-of-dignity"], "senses": ["literal"], "lemma": {"la": "non ordinis sed dignitatis causa sic positum", "en": "so placed not for the sake of order but of dignity"}, "en": "Two things are set down in the beginning, heaven and earth. Which of these do you suppose was below, and which shall we say was above? Either earth above and heaven below, or earth below and heaven above? But is it to be believed that in that first condition of things heaven was created underneath, and afterwards in the forming was set above? Perhaps, because Scripture named heaven before earth, someone may say that heaven was created below as a foundation. But I judge it to be so placed not for the sake of order but of dignity; and because the discourse that follows had to be about the element of earth, as about the nearer thing — and for this reason named later — therefore heaven had to be named first and earth afterwards. Nor indeed would the very nature of the things founded allow any other order of position or placing than that the weighty should be disposed downward and the light upward. Therefore the earth was below and heaven above, and what was above the earth was heaven. Therefore heaven was above the earth.", "translator": "claude-draft", "orig": "Duo in principio posita sunt coelum et terra. Quid horum putas subtus, aut quod supra fuisse dicemus? Aut terra supra et coelum subtus; aut terra subtus et coelum supra? Sed nunquid credendum est prima illa conditione rerum coelum subter creatum fuisse; et postea in formatione supra dispositum? Fortassis quia prius Scriptura nominavit coelum quam terram, propterea coelum quasi fundamentum subtus creatum fuisse quis dicat. Ego aut non ordinis sed dignitatis causa sic positum reor; et quia etiam sermo sequens de elemento terrae quasi de proximo (et ob hoc posterius nominato) habendus fuit, ideo et prius coelum et postea terra nominari debuit. Sed neque ipsa conditorum natura alium positionis aut locationis ordinem pateretur, quam ut ponderosa deorsum, et sursum levia disponerentur. Ergo terra deorsum erat et coelum sursum, et quod supra terram erat coelum erat. Ergo coelum supra terram erat.", "olang": "la", "source": "PL 176, col. 191B", "notes": "Hugh takes the question seriously enough to consider the absurd answer — that heaven was made underneath, as a foundation, because it is named first — and then gives the school's rule: word order is dignity, not sequence. His second reason is better than his first and is entirely about composition: the discourse that follows is going to be about the earth, so the earth is named last, nearest to what comes next. That is a claim about how the sentence was written rather than about what happened, and it is R. Yoḥanan's distinction between creation and completion, and Resh Lakish's between creating and stretching, arrived at from the writer's side rather than the world's.", "slot": false}, {"id": "comestor-hs-1-1b", "short": "comestor-hs-1-1b", "author": "Peter Comestor", "tradition": "latin", "date": 1170, "datelabel": "c. 1170", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["heaven-is-empyrean", "heaven-earth-four-elements", "heaven-earth-is-everything"], "senses": ["literal"], "lemma": {"la": "id est continens et contentum", "en": "that is, the container and the thing contained"}, "en": "'World' is said in four ways: sometimes the empyrean heaven is called world, on account of its cleanness; sometimes the sensible world, which is called by the Greeks pan and by the Latins 'all', because the philosopher did not know the empyrean; sometimes the region below the moon alone, because this alone has the living creatures known to us — of which it is said, 'The prince of this world shall be cast out' (John 12:31); sometimes man is called a world, because he presents in himself the image of the whole world, whence by the Lord man was called 'every creature', and the Greek calls man microcosm, that is, the lesser world. Now the empyrean and the sensible world and the sublunary region God created, that is, made out of nothing; but man he created, that is, moulded. Of the creation, then, of those three the lawgiver says: 'In the beginning God created heaven and earth' (Gen 1) — that is, the container and the thing contained, that is, the empyrean heaven and the angelic nature. But 'earth' is the matter of all bodies, that is, the four elements, that is, the sensible world consisting of them. Some understand 'heaven' as the upper parts of the sensible world, and 'earth' as the lower and palpable.", "translator": "claude-draft", "orig": "Mundus quatuor modis dicitur: quandoque empyreum coelum mundus dicitur propter sui munditiam; quaudoque sensibilis mundus, qui a Graecis pan, a Latinis omne dictus est quia, philosophus empyreum non cognovit; quandoque sola regio sublunaris, quia haec sola animantia nobis nota habet de qua: Princeps hujus mundi ejicietur foras (Joan. XII) ; quandoque homo mundus dicitur, quia in se totius mundi imaginem repraesentat. Unde a Domino homo omnis creatura dictus est, et Graecus hominem microcosmum, id est minorem mundum vocat. Empyreum autem et sensibilem mundum, et sublunarem regionem creavit Deus, id est de nihilo fecit; hominem vero creavit, id est plasmavit. De creatione ergo illorum trium inquit legislator: In principio creavit Deus coelum et terram (Gen. I) , id est continens et contentum, id est coelum empyreum et angelicam naturam. Terram vero materiam omnium corporum, id est quatuor elementa, id est mundum sensibilem ex his constantem. Quidam coelum superiores partes mundi sensibilis intelligunt; terram inferiores et palpabiles.", "olang": "la", "source": "PL 198, col. 1055A", "notes": "The twelfth-century synthesis, and it is the most systematic thing said on this crux in Latin: four senses of 'world' laid out first, so that when the verse is read the reader already knows which world is meant. Heaven and earth are then 'the container and the thing contained' — the empyrean heaven with the angelic nature, and the matter of all bodies, the four elements. Remigius' empyrean and Abelard's elements are here in one sentence, which is what Comestor is for; and the aside that the philosopher did not know the empyrean is a quiet acknowledgement that the best-attested part of this reading has no ancient authority behind it. He then reports the rival, flatter reading — heaven the upper parts of the sensible world, earth the lower — without deciding.", "slot": false}, {"id": "b-chag-12a", "short": "b-chag-12a", "author": "Babylonian Talmud", "tradition": "rabbinic", "date": 550, "datelabel": "redaction 500–600", "place": "Babylonia (Sura / Pumbedita)", "lat": 32.5, "lon": 44.4, "answers": ["day-is-a-measure"], "senses": ["literal"], "lemma": {"he": "מִדַּת יוֹם וּמִדַּת לַיְלָה", "en": "the measure of the day and the measure of the night"}, "en": "And R. Yehudah said in the name of Rav, Ten things were created on the first day, and they are these: Heaven and earth, chaos and desolation, light and darkness, wind and waters, the measure of the day and the measure of the night. \"Heaven and earth\", as it is written, (Genesis 1:1) \"In the beginning God created the heaven and the earth.\" Chaos and desolation, as it is written, (Genesis 1:2) \"And the earth was chaos and desolation.\" Light and darkness, darkness as it is written, (Genesis 1:2) \"and darkness was upon the face of the deep,\" light as it is written, (Genesis 1:2) \"And God said, Let there be light.\" Wind and water, as it is written, (Genesis 1:3) \"and the wind of God floated upon the face of the waters.\" The measure of the day and the measure of the night, as it is written, (Genesis 1:5) \"And there was evening and there was morning, one day.\"", "translator": "Sefaria Community Translation", "orig": "ואמר רב יהודה אמר רב עשרה דברים נבראו ביום ראשון ואלו הן שמים וארץ תהו ובהו אור וחשך רוח ומים מדת יום ומדת לילה שמים וארץ דכתיב (בראשית א, א) בראשית ברא אלהים את השמים ואת הארץ תהו ובהו דכתיב (בראשית א, ב) והארץ היתה תהו ובהו אור וחשך חשך דכתיב (בראשית א, ב) וחשך על פני תהום אור דכתיב (בראשית א, ג) ויאמר אלהים יהי אור רוח ומים דכתיב (בראשית א, ב) ורוח אלהים מרחפת על פני המים מדת יום ומדת לילה דכתיב (בראשית א, ה) ויהי ערב ויהי בקר יום אחד", "olang": "arc", "source": "b. Chagigah 12a (Vilna)", "notes": "Rav Yehuda in Rav's name lists ten things made on the first day, and the tenth pair is proof-texted from our verse: the measure of the day and the measure of the night, 'and there was evening and there was morning, one day.' The day's own measure is itself a creature of day one — which is the rabbinic way of answering the question the Latin bench asks as 'what kind of day was it, with no sun?' Hugh of St Victor's dies naturalis is the same instinct in computistical dress.", "slot": false}, {"id": "b-chag-15a", "short": "Chagigah 15a", "author": "Babylonian Talmud", "tradition": "rabbinic", "date": 550, "datelabel": "redaction 500–600", "place": "Babylonia (Sura / Pumbedita)", "lat": 32.5, "lon": 44.4, "answers": ["bird-hovering"], "senses": ["literal"], "lemma": {"he": "כְּיוֹנָה שֶׁמְּרַחֶפֶת עַל בָּנֶיהָ וְאֵינָהּ נוֹגַעַת", "en": "like a dove that hovers over her young and does not touch"}, "en": "Our rabbis taught: It once happened that Rabbi Yehoshua ben Ḥananya was standing on a step on the Temple Mount, and Ben Zoma saw him and did not rise before him. He said to him: From where and to where, Ben Zoma? He said to him: I was gazing between the upper waters and the lower waters, and between the one and the other there are only three fingerbreadths, as it is said, 'and the spirit of God was hovering over the face of the waters' (Gen 1:2) — like a dove that hovers over her young and does not touch them. Rabbi Yehoshua said to his disciples: Ben Zoma is still outside. — Now, 'the spirit of God was hovering over the face of the waters': when was that? On the first day. But the dividing was on the second day, as it is written, 'and let it divide water from water' (Gen 1:6). And how much [lies between them]? Rav Aḥa bar Yaakov said: a hair's breadth. The rabbis say: like the gap between the planks of a bridge. Mar Zutra, or some say Rav Ashi, said: like two cloaks spread one over the other; and some say, like two cups tipped one upon the other.", "translator": "claude-draft", "orig": "ת\"ר מעשה ברבי יהושע בן חנניה שהיה עומד על גב מעלה בהר הבית וראהו בן זומא ולא עמד מלפניו אמר לו מאין ולאין בן זומא אמר לו צופה הייתי בין מים העליונים למים התחתונים ואין בין זה לזה אלא שלש אצבעות בלבד שנאמר (בראשית א, ב) ורוח אלהים מרחפת על פני המים כיונה שמרחפת על בניה ואינה נוגעת אמר להן רבי יהושע לתלמידיו עדיין בן זומא מבחוץ מכדי ורוח אלהים מרחפת על פני המים אימת הוי ביום הראשון הבדלה ביום שני הוא דהואי דכתיב (בראשית א, ו) ויהי מבדיל בין מים למים וכמה אמר רב אחא בר יעקב כמלא נימא ורבנן אמרי כי גודא דגמלא מר זוטרא ואיתימא רב אסי אמר כתרי גלימי דפריסי אהדדי ואמרי לה כתרי כסי דסחיפי אהדדי", "olang": "arc", "source": "b. Chagigah 15a (Vilna)", "notes": "The Bavli's Ben Zoma reads merahefet as a physical fact about distance: hovering measures the gap between upper and lower waters. The anonymous continuation then argues the gap into a hair's breadth. Steinsaltz/Davidson English is CC BY-NC and is NOT embedded; this is a fresh draft against the Wikisource Aramaic.", "slot": false}], "threads": [{"id": "t-k5-01", "from": "b-chag-12a-order", "to": "br-1-15", "type": "parallel", "evidence": "The same dispute in two redactions. Both give Beit Shammai the throne and footstool (Isa 66:1), Beit Hillel Gen 2:4, and the sages 'both at once' from Isa 48:13. Bereshit Rabbah adds the palace built from the ground up, R. Ḥanin's turning of Beit Shammai's proof, and R. Shimon ben Yoḥai's stewpot and lid; the Bavli adds Amos 9:6 for the upper storey and Resh Lakish's created-first/stretched-first distinction. Independent redactions of one Palestinian dispute.", "crux": "heaven-earth-order"}, {"id": "t-k5-02", "from": "b-chag-12a-akiva", "to": "br-1-14", "type": "parallel", "evidence": "One encounter, two answers. Both have R. Yishmael asking R. Akiva what Naḥum of Gam Zo made of the two ets. In Bereshit Rabbah, Akiva's first answer is that without them we might have said heaven and earth were deities, and he is rebuked for it with Deut 32:47 before the real answer (the sun, moon and constellations; the trees, plants and Eden). In the Bavli the danger is narrower — shamayim would be a name of the Holy One — and the answer, that heaven means heaven literally, stands unchallenged.", "crux": "heaven-earth-order"}, {"id": "t-k5-03", "from": "b-chag-12a-shamayim", "to": "b-chag-12a-order", "type": "echoes", "evidence": "The sugya passes from when heaven was made to what heaven is without a break: Resh Lakish's stretching, then 'mai shamayim' — sham mayim, or fire and water mingled into the firmament. The Bavli treats the two halves of this crux as one question.", "crux": "heaven-earth-order"}, {"id": "t-k5-04", "from": "ramban-1-1b", "to": "br-1-14", "type": "cites", "evidence": "'And so did our Rabbis say: eth hashamayim — eth includes the sun, moon, stars and constellations; ve'eth ha'aretz — ve'eth includes the trees, herbs, and the Garden of Eden.' Ramban names Bereshit Rabbah (parashah 1) and reproduces the inventory, adding only the derivation of et from 'atha boker' (Isa 21:12).", "crux": "heaven-earth-order"}, {"id": "t-k5-05", "from": "ramban-1-1b", "to": "abelard-hex-1-1b", "type": "parallel", "evidence": "'The word ha'aretz includes these four elements' and 'by the name of heaven and earth I judge the four elements to be taken in here' are the same reading of the verse, reached in Girona and at the Paraclete a century and a half apart with no possible contact. The distribution differs: Abelard splits the four between the two words, Ramban puts all four under 'earth'.", "crux": "heaven-earth-order"}, {"id": "t-k5-06", "from": "abelard-hex-1-1b", "to": "ambrose-hex-1-6-20", "type": "parallel", "evidence": "'In these two the four elements were created' (Ambrose) and 'by the name of heaven and earth the four elements are taken in' (Abelard) are one doctrine, and both argue it from the mixture of the elements in each other. Abelard does not cite Ambrose, and his division of the four is his own: Ambrose puts all four in the pair without assigning them, Abelard gives fire and air to heaven, earth and water to earth.", "crux": "heaven-earth-order"}, {"id": "t-k5-07", "from": "ambrose-hex-1-6-24", "to": "br-1-15", "type": "parallel", "evidence": "The star thread of this crux. Both turn on Ps 102:26 [Vg 101:26], 'you founded the earth … and the heavens are the work of your hands' — which names the earth first. R. Yehuda bar Ilai brings it as proof for Beit Hillel that the earth was created first. Ambrose brings the same reversal (from Ps 148:5) to prove that the order of naming settles nothing, since both were made together, and adds the reason: lest heaven be reckoned the better by the privilege of being the firstborn creature. That is R. Shimon ben Yoḥai's stewpot and lid and Bereshit Rabbah's closing rule that a reversed order teaches equality of honour, in Milan, four hundred years earlier, with no contact of any kind.", "crux": "heaven-earth-order"}, {"id": "t-k5-08", "from": "b-chag-12a", "to": "aug-gnm-1-7-11", "type": "parallel", "evidence": "Both answer the question 'what is contained in heaven and earth?' — and answer it in opposite modes. Rav Yehudah in Rav's name enumerates: ten things were created on the first day, and heaven and earth head the list, each proved from its verse. Augustine generalises: by the name of heaven and earth the whole creation is signified, put in visible words for the weakness of little ones. An enumeration and a generalisation of the same clause, at roughly the same date, with no contact.", "crux": "heaven-earth-order"}, {"id": "t-k5-09", "from": "aug-gnl-1-9", "to": "aug-gnm-1-7-11", "type": "echoes", "evidence": "Twenty years apart, the same observation about the shape of v. 1 — that it commends the whole before the parts — first as a remark about visible names for little ones, then as the answer to why Scripture does not say 'let heaven and earth be made'.", "crux": "heaven-earth-order"}, {"id": "t-k5-10", "from": "angelom-gen-1-1b", "to": "aug-gnl-1-9", "type": "cites", "evidence": "'Sed quaeritur cur ita dictum est … Nisi quia prius universaliter nomine coeli et terrae comprehendendum erat, et commendandum quod fecit, et deinde per partes exsequendum' reproduces De Genesi ad litteram I.9 sentence for sentence, unnamed, and drops the second answer that made the first one provisional.", "crux": "heaven-earth-order"}, {"id": "t-k5-11", "from": "alcuin-int-28", "to": "aug-gnm-1-7-11", "type": "echoes", "evidence": "'Informis illa materia, quam de nihilo fecit Deus, appellata est primo coelum et terra' is Augustine's answer with the proleptic reason added ('not because it already was this, but because it already could be this'); the alternative Alcuin appends without weighing it — 'or else the spiritual and the earthly creatures' — is not Augustine's here and is the seed of the empyrean reading.", "crux": "heaven-earth-order"}, {"id": "t-k5-12", "from": "comestor-hs-1-1b", "to": "remigius-gen-1-1b", "type": "echoes", "evidence": "The empyrean heaven, fiery from brightness and not from heat, filled at once with the angelic spirits: Remigius states it at PL 131:54D, the Glossa prints it almost verbatim at 113:68C, and Comestor has it as 'the empyrean heaven and the angelic nature'. Comestor adds the admission Remigius does not make — that the philosopher did not know the empyrean.", "crux": "heaven-earth-order"}, {"id": "t-k5-13", "from": "comestor-hs-1-1b", "to": "abelard-hex-1-1b", "type": "echoes", "evidence": "'Terram vero materiam omnium corporum, id est quatuor elementa' is Abelard's reading of the second word, absorbed into a scheme that keeps the empyrean for the first; Comestor then reports the rival reading — 'some understand heaven as the upper parts of the sensible world, and earth as the lower' — without deciding between them.", "crux": "heaven-earth-order"}, {"id": "t-k5-14", "from": "abelard-hex-1-1b", "to": "remigius-gen-1-1b", "type": "contests", "evidence": "Directly opposed on what 'heaven' names in this verse. Remigius: not the visible firmament but the empyrean, filled at once with angels. Abelard: fire and air, and 'the angels, being of an incorporeal nature, are not included among the creatures of the world at all'. Abelard does not name Remigius, but the empyrean-with-angels is the standing gloss he is writing against.", "crux": "heaven-earth-order"}, {"id": "t-k5-15", "from": "ibn-ezra-1-1b", "to": "remigius-gen-1-1b", "type": "parallel", "evidence": "The objection to the empyrean reading, made from the other bench and with no knowledge of it: those who explain that the heavens of the first verse are the heavens of the heavens — what will they then do with the earth beside it? Ibn Ezra's symmetry argument is exactly what forces Remigius, the Glossa and Comestor to turn 'earth' into prime matter or the four elements once they have made 'heaven' the empyrean.", "crux": "heaven-earth-order"}, {"id": "t-k5-16", "from": "hugh-sacr-1-1b", "to": "br-1-15", "type": "parallel", "evidence": "Both refuse to read the sequence of the words as the sequence of the acts, and both put something else in its place. Hugh: 'not for the sake of order but of dignity', and because the discourse that follows is about the earth, which is therefore named last. R. Yoḥanan in the sages' name: in creation the heavens were first, in completion the earth. The Latin reason is compositional, the rabbinic one is about the work itself.", "crux": "heaven-earth-order"}, {"id": "t-k5-17", "from": "hugh-sacr-1-1b", "to": "b-chag-12a-order", "type": "parallel", "evidence": "Resh Lakish resolves the contradiction of the proof-texts by splitting the act — created in one order, stretched out in the other. Hugh resolves the same difficulty by splitting the sentence from the act. Neither will let one verse's word order overrule the other's.", "crux": "heaven-earth-order"}, {"id": "t-k5-18", "from": "br-1-15", "to": "b-chag-15a", "type": "echoes", "evidence": "Both measure the relation of the upper and lower by a physical image and refuse to let them come apart: the stewpot and its lid, which are made together and belong together (Isa 48:13); Ben Zoma's three fingerbreadths between the upper and lower waters, a gap that is not a separation. The same instinct about heaven and earth, in the two Chagigah contexts this project has built.", "crux": "heaven-earth-order"}, {"id": "t-k5-19", "from": "comestor-hs-1-1b", "to": "alcuin-int-28", "type": "echoes", "evidence": "Alcuin's unweighed alternative — 'or else, by the name of heaven and earth the spiritual and the earthly creatures can be understood' — is what Comestor has hardened into 'the container and the thing contained, that is, the empyrean heaven and the angelic nature' on one side and the four elements on the other.", "crux": "heaven-earth-order"}, {"id": "t-k5-20", "from": "ramban-1-1b", "to": "b-chag-12a-akiva", "type": "parallel", "evidence": "Ramban gives the Palestinian form of the et-derivation (sun, moon, stars, constellations; trees, herbs, Eden) and not the Babylonian one (that without the particles shamayim would be a divine name), although both were before him — the inventory is usable for his physics and the anxiety about the divine name is not.", "crux": "heaven-earth-order"}], "answers": {"borne-over": {"label": "Borne over", "gloss": "The verb is motion: a spirit carried above the water (LXX ἐπεφέρετο, Vulgate ferebatur)."}, "wind": {"label": "A wind", "gloss": "Ruach is weather, not a person; Onkelos keeps God at a remove."}, "spirit-of-mercy": {"label": "Spirit of mercy", "gloss": "A divine disposition blowing over the waters (Palestinian targums)."}, "messiah": {"label": "Spirit of the Messiah", "gloss": "Resh Lakish: the ruach of Isa 11:2, brought by repentance-as-water."}, "bird-hovering": {"label": "Dove hovering, not touching", "gloss": "Ben Zoma and Rashi: the bird measures a gap; it does not land."}, "fluttering": {"label": "Fluttering", "gloss": "Abelard's report of the Hebrew: volitabat, as the eagle of Deut 32:11."}, "brooding-warmth": {"label": "Bird brooding, warming", "gloss": "Jerome from the Hebrew, Basil's Syrian, then the Latin schools: the Spirit quickens matter like a hen on eggs."}, "power-not-place": {"label": "Power, not place", "gloss": "Augustine: 'above' means sovereignty, not position; the Manichees misread it."}, "craftsman": {"label": "The craftsman's will", "gloss": "The Spirit over the waters as the maker's intention over the wood."}, "love-gift": {"label": "Love, gift, weight", "gloss": "Confessions XIII: why the Spirit alone is said to be above; pondus meum amor meus."}, "trinity": {"label": "The Trinity named", "gloss": "The verse completes Father (in principio), Son (principium), Spirit."}, "heart": {"label": "Over the heart", "gloss": "Isidore's moral reading: the waters are our fluid, dark heart."}, "throne": {"label": "Throne of Glory", "gloss": "Rashi: the throne stands in the air, held by the breath of God's mouth."}, "unus-cardinal": {"label": "The versions keep the cardinal", "gloss": "ἡμέρα μία, dies unus, yoma chad: 'one', not 'first', in every ancient version."}, "unus-grammatical": {"label": "'First' needs a second", "gloss": "The series 'one, second, third' is improper (Bereshit Rabbah); or, first and second are relatives and there was no second yet (Bruno)."}, "unus-alone": {"label": "God was alone that day", "gloss": "Yachid in his world: no angels were made on the first day, so there was no second anything (Bereshit Rabbah, Rashi)."}, "unus-yom-kippur": {"label": "The one day given to Israel", "gloss": "'One day' is the Day of Atonement, the day the Holy One gave them."}, "unus-24-hours": {"label": "One circuit, twenty-four hours", "gloss": "Day and night together make one revolution, and the whole is named from the day alone."}, "unus-repeated": {"label": "The same day repeated", "gloss": "There is one day only — the angelic light — presented once for each kind of thing made (Augustine)."}, "unus-all-time": {"label": "One day = all time", "gloss": "The word holds the whole span of the ages, or the whole work of the six days (Augustine's set-aside reading; Abelard's own)."}, "unus-angelic-unity": {"label": "The unity of angelic dignity", "gloss": "'One' names the undivided attention of the angelic mind, not a place in a series (Angelomus)."}, "unus-eternal-day": {"label": "The true first day is eternal", "gloss": "This day is first only by number and order of creation; the day that is first by nature is uncreated light (Rupert)."}, "day-precedes-night": {"label": "Day before night", "gloss": "Evening is the end of a finished day, morning the end of the night; days are counted from morning to morning."}, "day-follows-night": {"label": "Night before day", "gloss": "'One day' rules that reckoning begins at evening (Ben Zoma, b. Chullin 83a)."}, "night-for-rest": {"label": "Night made for rest", "gloss": "Day is for labour and night for rest, so only the day's bounds are counted."}, "day-is-a-measure": {"label": "The day's measure is a creature", "gloss": "The measure of day and of night was itself made on day one (b. Chagigah 12a)."}, "evening-is-completion": {"label": "Evening completes a work", "gloss": "Vespera is a work perfected, mane the beginning of the next — the Carolingian formula."}, "evening-is-self-knowledge": {"label": "Evening and morning knowledge", "gloss": "The creature known in itself is evening; known in the Word and referred back in praise, morning (Augustine)."}, "evening-moral": {"label": "Evening as sin or temptation", "gloss": "Evening and morning are the deeds of the wicked and the righteous, or sin and renewal, or temptation and the light of justice."}, "simul": {"label": "All things made at once", "gloss": "Creavit omnia simul (Sir 18:1): the days are not successive."}, "six-days-literal": {"label": "Six real days", "gloss": "Created at once in matter, distinguished in form through six successive days (the common doctors, Bonaventure)."}, "principio-temporis": {"label": "In the beginning of time", "gloss": "The word dates the making: time began with the world, and there was no before (Onkelos, Bede, Rabanus, Remigius, Hugh)."}, "principio-in-filio": {"label": "In the Son", "gloss": "Principium is a proper name of the Word, on the strength of John 8:25 and Ps 104:24 (Ambrose, Augustine, Isidore, Alcuin, the Glossa, Rupert, Honorius)."}, "principio-first-of-all": {"label": "First of all things", "gloss": "'In the beginning' means before everything else that follows — in the beginning of the creatures, or on the first day (Augustine's second reading; Bruno, Abelard)."}, "principio-is-first-creature": {"label": "The first creature is a beginning", "gloss": "The first intellectual creature may be called a beginning to the things it heads (Augustine, De Genesi imperfectus)."}, "beginning-is-wisdom": {"label": "In Wisdom", "gloss": "The beginning is Wisdom — which is the Torah on one bench (Prov 8:22, Prov 3:19, Neofiti) and the Son on the other (Ps 104:24)."}, "reshit-is-torah": {"label": "The beginning is the Torah", "gloss": "Reshit is the Torah, called reshit darko: God looked into it as an architect into his plans and created the world (Bereshit Rabbah, Rashi)."}, "reshit-is-israel": {"label": "For the sake of Israel", "gloss": "Reshit is Israel, called reshit tevu'ato (Jer 2:3); the world was made for their sake."}, "reshit-construct": {"label": "'When God began to create'", "gloss": "Bereshit is a construct and the verse a subordinate clause: at the beginning of God's creating (Rashi's plain sense, Ibn Ezra; contested by Ramban)."}, "world-has-a-beginning": {"label": "The world is not eternal", "gloss": "The point of saying 'in the beginning' at all is that the world had one, against the philosophers (Ambrose, Remigius, Hugh, Ramban)."}, "bereshit-book-name": {"label": "It is the book's name", "gloss": "The Hebrews name volumes from their opening words, so bresith is the title of Genesis (Jerome, Wigbod, Angelomus)."}, "six-preceded": {"label
