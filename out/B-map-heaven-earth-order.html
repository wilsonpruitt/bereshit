": "Six things preceded the world", "gloss": "Torah and the Throne of Glory were made before it; the patriarchs, Israel, the Temple and the Messiah's name were contemplated (Bereshit Rabbah 1:4)."}, "read-it-twice": {"label": "Say the phrase twice", "gloss": "In principio is to be repeated — once in the Son, once at the beginning of time — rather than decided (Comestor)."}, "lux-corporalis": {"label": "A bodily light", "gloss": "A material light made to light material things, standing in the sun's place until the fourth day (Basil, Ambrose, Bede, Hugh, Honorius, Comestor, Bonaventure)."}, "lux-angelica": {"label": "The angelic creation", "gloss": "The light is the spiritual creature called 'heaven' in v. 1, made light by turning to its Creator (Augustine, Angelomus, Rupert)."}, "lux-hidden": {"label": "Stored for the righteous", "gloss": "Too good for the wicked, it was hidden away and is kept for the righteous in the time to come (Bereshit Rabbah, b. Chagigah, Rashi)."}, "lux-garment": {"label": "From the light of his garment", "gloss": "God wrapped himself in it like a garment (Ps 104:2); the heavens were stretched out of it (Bereshit Rabbah, Pirkei de-Rabbi Eliezer)."}, "lux-from-temple": {"label": "From the site of the Temple", "gloss": "The light was created from the place of the sanctuary (Ezek 43:2; Jer 17:12)."}, "lux-becomes-luminaries": {"label": "The luminaries were made from it", "gloss": "The nature of light was made on day one and hung in the firmament on day four (the sages in b. Chagigah 12a; an unnamed opinion in Augustine)."}, "lux-twilight": {"label": "A light like the dawn", "gloss": "Not the sun's brightness but what the sky is before sunrise or after sunset (Remigius, Honorius, Comestor, Hugh)."}, "lux-is-day": {"label": "'Light' just means day", "gloss": "The verse answers itself: he called the light Day, so light here is put for day (Bruno)."}, "lux-is-distinction": {"label": "The distinguishing of the works", "gloss": "The light is the confused heap becoming distinct and knowable, not a thing at all (Abelard)."}, "fiat-is-instantaneous": {"label": "Speaking is making", "gloss": "No interval between the command and the thing: the Hebrew says only 'let it be, and it was' (Ambrose, Basil, Angelomus, Abelard)."}, "pair-is-formless-matter": {"label": "Unformed matter", "gloss": "The pair names the matter God had made and not yet given form to (Augustine, Angelomus, Hugh, Comestor)."}, "pair-is-under-water": {"label": "Hidden under the waters", "gloss": "Invisible because the waters covered it, and because there was neither light nor anyone to see (Basil, Alcuin, Angelomus, Ibn Ezra)."}, "pair-is-unfurnished": {"label": "No seed, no living thing", "gloss": "Empty of shoots and void of animals: a list of what was not there yet (Bede, Remigius, Rupert, Abelard, Hugh, Comestor, the targums)."}, "pair-is-a-name-for-us": {"label": "A name fitted to slow minds", "gloss": "Not a description but the most serviceable word for formlessness, since earth and the deep are the least comely things men know (Augustine, Confessions XII)."}, "pair-many-senses": {"label": "More than one true reading", "gloss": "Five readings of the clause are all true and none can be shown to be Moses' own (Augustine, Confessions XII.21)."}, "pair-is-two-things": {"label": "A green line and slimy stones", "gloss": "Tohu and bohu are two creatures made on the first day: a line encircling the world, and stones sunk in the deep (b. Chagigah 12a, Sefer Yetzirah)."}, "pair-is-matter-and-form": {"label": "Matter and its form", "gloss": "Tohu is the hyle, which can hold no name; bohu is bo hu, the form it puts on (Ramban)."}, "pair-is-astonishment": {"label": "Astonishment", "gloss": "Tohu is what astonishes whoever looks at it — the earth bewildered at her lot, or the reader appalled at the emptiness (Bereshit Rabbah 2:2, Rashi, the Bahir)."}, "pair-is-history": {"label": "The verse tells history", "gloss": "The clause is the first term of a periodization: the generations from Adam, the four kingdoms, or the Church before her children (Bereshit Rabbah 2:1, 2:3, 2:4; Bruno)."}, "pair-is-our-flesh": {"label": "The earth of our flesh", "gloss": "The soul before it has taken the form of doctrine (Isidore, Wigbod, Rabanus, Remigius, Bruno)."}, "pair-is-not-of-heaven": {"label": "Said of earth, not of heaven", "gloss": "The phrase is withheld from heaven, which was filled with angels as soon as it was made (Bede, the Glossa, Angelomus, Abelard)."}, "heaven-first": {"label": "Heaven first", "gloss": "Beit Shammai: the word order is the order of the acts, and a king has his throne made before its footstool (Isa 66:1)."}, "earth-first": {"label": "Earth first", "gloss": "Beit Hillel: a builder raises the lower storey first (Amos 9:6), and Gen 2:4 and Ps 102:26 name the earth before the heavens."}, "both-at-once": {"label": "Both together", "gloss": "The sages, and R. Shimon ben Yoḥai's stewpot and its lid (Isa 48:13); Ambrose, that the order of naming gives heaven no privilege of the firstborn."}, "order-of-dignity": {"label": "Named for dignity, not order", "gloss": "Heaven stands first because it is worthier, or because the account is about to turn to the earth (Hugh of St Victor; R. Yoḥanan's creation-and-completion)."}, "created-then-stretched": {"label": "Created in one order, stretched in the other", "gloss": "Resh Lakish: heaven was created first, the earth was stretched out first — so both proof-texts stand."}, "heaven-earth-is-everything": {"label": "A name for the whole creation", "gloss": "Two visible words standing for all that God made, given so for the weakness of little ones (Augustine, Alcuin, Angelomus, Comestor)."}, "heaven-is-empyrean": {"label": "The empyrean heaven", "gloss": "Not the visible firmament but a fiery — from brightness, not heat — and intellectual heaven, filled with angels as soon as it was made (Remigius, the Glossa, Comestor)."}, "heaven-earth-four-elements": {"label": "The four elements", "gloss": "Heaven names fire and air, earth names earth and water; the verse announces the material first principles of bodies (Ambrose, Abelard, Ramban, Comestor)."}, "et-includes": {"label": "The particle includes", "gloss": "Et ha-shamayim brings in the sun, moon and constellations; ve-et ha-aretz the trees, the plants and the Garden of Eden (Bereshit Rabbah 1:14, b. Chagigah 12a, Ramban)."}, "shamayim-is-water": {"label": "Sham mayim — 'there is water'", "gloss": "The name itself says what heaven is made of: water, or fire and water mingled into the firmament (b. Chagigah 12a)."}, "one-earth-only": {"label": "One earth, and no heaven of heavens here", "gloss": "If the heavens of v. 1 were the intelligible heaven, the earth beside it could not be the ground; the seven earths are seven regions of the one (Ibn Ezra; Abelard, from the other end)."}, "whole-then-parts": {"label": "The whole first, then the parts", "gloss": "V. 1 is a heading: Scripture commends everything God made in two words before going through it with 'God said' (Augustine, Angelomus, the Glossa)."}, "de-nihilo": {"label": "Out of nothing", "gloss": "God made the world, and the matter of the world, from nothing whatever."}, "matter-then-formed": {"label": "Matter first, then formed", "gloss": "Formless matter was created first — first in origin, not in time — and everything else made out of it."}, "matter-is-coeval": {"label": "Matter was already there", "gloss": "God is a craftsman working on a material he did not make. Reported on both benches, held by neither."}, "three-principles": {"label": "God, exemplar, matter", "gloss": "The philosophers' three principles without a principle, named as the position to be refuted."}, "all-of-them-created": {"label": "Of every one of them, creation is written", "gloss": "Each thing the objector calls a pre-existing material has its own verse saying God created it."}, "bara-is-not-ex-nihilo": {"label": "'Created' does not mean from nothing", "gloss": "The verb bara is used of the sea-creatures and of man, who were made from something."}, "creare-vs-formare": {"label": "Created, not formed", "gloss": "Scripture keeps two verbs apart: what has no pre-existing matter is created, what is shaped out of matter is formed."}, "hyle-is-tohu": {"label": "The hyle is tohu", "gloss": "The one created thing is a substance without form, which the Greeks call hyle and Scripture calls tohu."}, "made-from-something-of-god": {"label": "From the light and the snow", "gloss": "Heaven from the light of his garment, earth from the snow beneath the Throne of Glory."}, "craftsman-needs-matter": {"label": "A craftsman needs a material", "gloss": "Wood helps the carpenter, silver the silversmith — the analogy that makes creation from nothing unthinkable."}, "silence-proves-nothing": {"label": "Scripture's silence proves nothing", "gloss": "That Genesis does not say when a thing was made does not make it coeternal with God."}, "world-from-tohu": {"label": "The world was made out of tohu va-vohu", "gloss": "Said with embarrassment, and only because the verse says it."}, "tenebrae-privatio": {"label": "Darkness is not a thing", "gloss": "Darkness is the absence of light, as silence is the ceasing of voice and nakedness the absence of a garment; Scripture never says God made it (Augustine, Angelomus, Hugh)."}, "tenebrae-creatura": {"label": "God made the darkness too", "gloss": "The darkness is a work of God like the light — it is called with the light to bless the Lord in Dan 3, and it is on the rabbinic lists of what was made on the first day (Remigius, the Glossa, Wigbod's pupil; Pirkei de-Rabbi Eliezer, R. Tanḥuma)."}, "tenebrae-angeli": {"label": "The darkness is the apostate angels", "gloss": "The light of day one is the angelic creation and the division is between the holy angels and the unclean (Augustine, City of God XI.19; Angelomus, Hugh, Rupert, Comestor)."}, "tenebrae-peccatores": {"label": "The wicked, or their deeds", "gloss": "The division is moral: the just from sinners (Isidore, Remigius, the Glossa), or the deeds of the righteous from the deeds of the wicked (R. Yanai, R. Abahu)."}, "tenebrae-ignis": {"label": "Darkness names the element of fire", "gloss": "'Darkness' in v. 2 is elemental fire, which is dark; the deep is water and the spirit is air (Ramban)."}, "divisio-loci": {"label": "Divided by place and quality", "gloss": "The two were set apart in space and time — light over the upper part of the world, twelve hours above and twelve below, opposite hemispheres in turn (Basil, Bede, Rabanus, Honorius, Comestor; and R. Yoḥanan's two generals, each given his bound)."}, "divisio-nominis": {"label": "The dividing is the naming", "gloss": "There is no separate act of separation: 'and he divided' means by the calling of names (Ibn Ezra; entertained once by Augustine and dropped)."}, "divisio-est-ordinatio": {"label": "He did not make it but ordered it", "gloss": "God makes the forms and orders the privations, as a singer orders his rests and a painter his shadows, so that even a nothing has its place (Augustine)."}, "divisio-est-judicium": {"label": "The division is a judgement", "gloss": "A sentence passed, and irreversible: on the devil and his angels (Rupert, Hugh), or on the just and sinners by foreknowledge (Isidore)."}, "divisio-est-instantanea": {"label": "The division needed no second act", "gloss": "The two were never mixed: by the very fact that light was made, the division followed, as putting on a garment ends nakedness (Augustine, Hugh)."}, "formatum-ab-informi": {"label": "The formed from the unformed", "gloss": "The dividing is the distinction of the formed thing from the unformed, of the perfect from the imperfect and the distinct from the confused (Wigbod, Abelard, Honorius)."}, "bonum-approbatio": {"label": "'He saw' is approval, not discovery", "gloss": "God did not learn that the light was good: what pleased him to be made pleased him to remain (Alcuin, Comestor), or the seeing is in the thought (Ibn Ezra), or a good work attests itself when seen (Ambrose)."}, "bonum-withheld": {"label": "The approval is deliberately withheld", "gloss": "'It was good' is not repeated after the division, and the divine name is dropped from the naming of the night, so that the darkness should not be approved along with the light (Augustine, Wigbod; R. Elazar, R. Abahu)."}, "havdala-derived": {"label": "The verse is the source of the havdala rule", "gloss": "'He saw … and he divided' — one does not bless over the lamp until he has used its light (R. Ze'eira of Caesarea)."}, "lux-hivdil-set-aside": {"label": "He set the light aside", "gloss": "Va-yavdel means he separated it off — for himself (R. Yehuda bar Simon), or for the righteous in the time to come, like a king setting aside a fine portion for his son (the Rabbis)."}}, "senses": {"literal": "Literal", "allegorical": "Allegorical", "spiritual": "Spiritual", "translation": "Translation"}};
const svg = d3.select('#map'), panel = document.getElementById('panel');
const g = svg.append('g');
const gRings = g.append('g'), gHubLinks = g.append('g'), gEdges = g.append('g'), gHubs = g.append('g'), gNodes = g.append('g'), gLabels = g.append('g');
let W = 800, H = 600, mode = 'answers';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const wn = D.witnesses.map(w => ({...w, kind: 'w'}));
const byId = Object.fromEntries(wn.map(n => [n.id, n]));
const ansKeys = Object.keys(D.answers), senseKeys = Object.keys(D.senses);
const hubsA = ansKeys.map(k => ({id: 'hub:' + k, kind: 'hub', key: k, label: D.answers[k].label, gloss: D.answers[k].gloss, facet: 'answers'}));
const hubsS = senseKeys.map(k => ({id: 'hub:' + k, kind: 'hub', key: k, label: D.senses[k], gloss: '', facet: 'sense'}));
const hubById = Object.fromEntries([...hubsA, ...hubsS].map(h => [h.id, h]));
const threads = D.threads.map(t => ({...t, source: byId[t.from], target: byId[t.to]})).filter(t => t.source && t.target);
const hubLinksA = wn.flatMap(w => w.answers.map(a => ({source: w, target: hubById['hub:' + a]})));
const hubLinksS = wn.flatMap(w => w.senses.map(s => ({source: w, target: hubById['hub:' + s]})));

let k = 1;
function applyScale() {
  nodeSel.attr('r', d => (d.slot ? 6 : 7) / k).attr('stroke-width', 2 / k);
  labelSel.attr('font-size', 11 / k + 'px').attr('dx', 10 / k).attr('dy', 4 / k);
  edgeSel.attr('stroke-width', d => (d.type === 'contests' ? 1.8 : d.type === 'parallel' ? 2 : 1.4) / k).attr('stroke-dasharray', d => d.type === 'echoes' ? `${5/k} ${4/k}` : d.type === 'parallel' ? `${2/k} ${4/k}` : null);
  if (hubSel) { hubSel.attr('r', 13 / k).attr('stroke-width', 1.5 / k); hubLblSel.selectAll('.hublbl').attr('font-size', 12 / k + 'px').attr('y', 30 / k); hubLblSel.selectAll('.hubsub').attr('font-size', 10.5 / k + 'px').attr('y', 43 / k); hubLinkSel.attr('stroke-width', 1 / k).attr('stroke-dasharray', `${1/k} ${3/k}`); }
  gRings.selectAll('text').attr('font-size', 10 / k + 'px'); gRings.selectAll('circle').attr('stroke-width', 1 / k);
}
svg.call(d3.zoom().scaleExtent([.5, 6]).on('zoom', e => { g.attr('transform', e.transform); if (e.transform.k !== k) { k = e.transform.k; applyScale(); } }));

// ---------- drawing
const edgeSel = gEdges.selectAll('path').data(threads).join('path').attr('class', d => 'edge ' + d.type)
  .on('mouseenter', (e, d) => showEdge(d, true)).on('mouseleave', (e, d) => showEdge(d, false)).on('click', (e, d) => { showEdge(d, true); e.stopPropagation(); });
const nodeSel = gNodes.selectAll('circle').data(wn).join('circle').attr('class', d => 'node ' + d.tradition + (d.slot ? ' slot' : '')).attr('r', d => d.slot ? 6 : 7)
  .on('click', (e, d) => { showWitness(d); e.stopPropagation(); }).on('mouseenter', (e, d) => focusNode(d, true)).on('mouseleave', (e, d) => focusNode(d, false))
  .call(d3.drag().on('start', (e, d) => { d.fx = d.x; d.fy = d.y; }).on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; sim.alpha(.3).restart(); }).on('end', (e, d) => { d.fx = null; d.fy = null; }));
const labelSel = gLabels.selectAll('text').data(wn).join('text').attr('class', 'lbl').text(d => d.short);
let hubSel, hubLblSel, hubLinkSel;

const sim = d3.forceSimulation().on('tick', tick);
function tick() {
  edgeSel.attr('d', d => { const {source: s, target: t} = d; const dx = t.x - s.x, dy = t.y - s.y, dr = Math.hypot(dx, dy) * 1.4; return `M${s.x},${s.y}A${dr},${dr} 0 0,1 ${t.x},${t.y}`; });
  nodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
  labelSel.attr('x', d => d.x).attr('y', d => d.y);
  if (hubSel) { hubSel.attr('cx', d => d.x).attr('cy', d => d.y); hubLblSel.attr('transform', d => `translate(${d.x},${d.y})`); hubLinkSel.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y); }
}

function size() { const r = svg.node().getBoundingClientRect(); W = r.width; H = r.height; }

function layout() {
  size(); const cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 40;
  gRings.selectAll('*').remove(); gHubs.selectAll('*').remove(); gHubLinks.selectAll('*').remove(); hubSel = null;
  const labelR = d => d.kind === 'hub' ? 46 : 12 + d.short.length * 2.4;
  sim.nodes(wn).force('charge', null).force('link', null).force('x', null).force('y', null).force('hublink', null).force('collide', d3.forceCollide(labelR).strength(.9));
  if (mode === 'answers' || mode === 'sense') {
    const hubs = mode === 'answers' ? hubsA : hubsS, links = mode === 'answers' ? hubLinksA : hubLinksS;
    hubs.forEach((h, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / hubs.length; h.fx = cx + Math.cos(a) * R * .9; h.fy = cy + Math.sin(a) * R * .9; h.x = h.fx; h.y = h.fy; });
    sim.nodes([...wn, ...hubs]);
    sim.force('charge', d3.forceManyBody().strength(d => d.kind === 'hub' ? -80 : -320))
       .force('hublink', d3.forceLink(links).distance(mode === 'answers' ? 120 : 150).strength(.6))
       .force('link', d3.forceLink(threads).distance(120).strength(.04))
       .force('x', d3.forceX(cx).strength(.03)).force('y', d3.forceY(cy).strength(.03));
    hubLinkSel = gHubLinks.selectAll('line').data(links).join('line').attr('class', 'hublink');
    hubSel = gHubs.selectAll('circle').data(hubs).join('circle').attr('class', 'hub').attr('r', 13).on('click', (e, d) => { showHub(d); e.stopPropagation(); });
    hubLblSel = gHubs.selectAll('g').data(hubs).join('g');
    hubLblSel.append('text').attr('class', 'hublbl').attr('text-anchor', 'middle').attr('y', 30).text(d => d.label);
    hubLblSel.append('text').attr('class', 'hubsub').attr('text-anchor', 'middle').attr('y', 43).text(d => (mode === 'answers' ? hubLinksA : hubLinksS).filter(l => l.target === d).length + ' witnesses');
  } else if (mode === 'time') {
    const dates = wn.map(d => d.date), d0 = Math.min(...dates), d1 = Math.max(...dates);
    const rOf = d => 50 + (d - d0) / (d1 - d0) * (R - 50);
    [0, 500, 1000].forEach(y => { gRings.append('circle').attr('class', 'ring').attr('cx', cx).attr('cy', cy).attr('r', rOf(y)); gRings.append('text').attr('class', 'ringlbl').attr('x', cx + 4).attr('y', cy - rOf(y) - 4).text(y === 0 ? 'year 1' : y); });
    gRings.append('text').attr('class', 'ringlbl').attr('x', cx + R * .7).attr('y', cy + R + 26).text('LATIN →').attr('text-anchor', 'middle');
    gRings.append('text').attr('class', 'ringlbl').attr('x', cx - R * .7).attr('y', cy + R + 26).text('← RABBINIC').attr('text-anchor', 'middle');
    const groups = {'greek-jewish': [], latin: [], rabbinic: []}; wn.forEach(w => groups[w.tradition].push(w));
    Object.values(groups).forEach(a => a.sort((p, q) => p.date - q.date));
    groups['greek-jewish'].forEach(w => { w.tx = cx; w.ty = cy - rOf(w.date); });
    groups.latin.forEach((w, i, a) => { const t = -Math.PI * .42 + (i / Math.max(1, a.length - 1)) * Math.PI * .84; w.tx = cx + Math.cos(t) * rOf(w.date); w.ty = cy + Math.sin(t) * rOf(w.date); });
    groups.rabbinic.forEach((w, i, a) => { const t = Math.PI + Math.PI * .42 - (i / Math.max(1, a.length - 1)) * Math.PI * .84; w.tx = cx + Math.cos(t) * rOf(w.date); w.ty = cy + Math.sin(t) * rOf(w.date); });
    sim.force('x', d3.forceX(d => d.tx).strength(.6)).force('y', d3.forceY(d => d.ty).strength(.6)).force('collide', d3.forceCollide(d => 8 + d.short.length * 1.6).strength(.8));
  } else if (mode === 'place') {
    const lons = wn.map(d => d.lon).filter(Number.isFinite), lats = wn.map(d => d.lat).filter(Number.isFinite);
    const sx = d3.scaleLinear().domain([Math.min(...lons) - 2, Math.max(...lons) + 2]).range([60, W - 120]);
    const sy = d3.scaleLinear().domain([Math.min(...lats) - 1, Math.max(...lats) + 1]).range([H - 50, 50]);
    const seen = new Set();
    wn.forEach(w => { w.tx = sx(w.lon); w.ty = sy(w.lat); if (!seen.has(w.place)) { seen.add(w.place); gRings.append('text').attr('class', 'placelbl').attr('x', w.tx + 12).attr('y', w.ty - 12).text(w.place); } });
    sim.force('x', d3.forceX(d => d.tx).strength(.5)).force('y', d3.forceY(d => d.ty).strength(.5)).force('collide', d3.forceCollide(d => 8 + d.short.length * 1.6).strength(.8));
  }
  applyScale();
  sim.alpha(1).restart();
}

// ---------- panel
function showHome() {
  const q = D.crux.question;
  panel.innerHTML = `<p class="eyebrow">Crux · Genesis 1:1</p><h2>${esc(q.en)}</h2><p class="la-q">${esc(q.la)}</p><p class="heb-q">${esc(q.he)}</p>
  <p>${esc(D.crux.summary)}</p><p>${esc(D.crux.finding)}</p>
  <p class="hint"><b>Answers</b> gathers witnesses around the reading they give; a witness between two hubs holds both. <b>Time</b> is a clock: distance from the centre is the date, Latin to the right, rabbinic to the left. <b>Places</b> is a map. <b>Senses</b> sorts by literal, allegorical, spiritual, translation. Threads keep their meaning in every arrangement. Click a node or a hub; hover a line; drag to pull the graph apart; scroll to zoom: zooming spreads the graph while dots and labels keep their size.</p>`;
}
function showWitness(w) {
  const lem = Object.entries(w.lemma || {}).filter(([k]) => k !== 'en').map(([k, v]) => `<span class="${k === 'he' || k === 'arc' ? 'heb' : 'lat'}" dir="${k === 'he' || k === 'arc' ? 'rtl' : 'ltr'}">${esc(v)}</span>`).join(' ');
  const ocls = (w.olang === 'he' || w.olang === 'arc') ? 'heb' : 'lat';
  const ans = (w.answers || []).map(a => `<span>${esc(D.answers[a]?.label || a)}</span>`).join('');
  const ins = threads.filter(t => t.target === w), outs = threads.filter(t => t.source === w);

  panel.innerHTML = `<p class="eyebrow">${esc(w.tradition.replace('-', ' '))} · ${esc(w.datelabel)} · ${esc(w.place)}</p><h2>${esc(w.author)}</h2><p class="meta">${esc(w.source)}</p>
  <p class="lem">${lem}</p><p>${esc(w.en)}</p><div class="orig ${ocls}">${esc(w.orig)}</div><div class="ans">${ans}</div><p class="note">${esc(w.notes)}</p>

  panel.scrollTop = 0;
}
function showHub(h) {

  <p class="cred">${links.map(l => esc(l.source.short) + ' · ' + esc(l.source.datelabel)).join('<br>')}</p>`;
  nodeSel.classed('dim', d => !links.some(l => l.source === d)); labelSel.classed('dim', d => !links.some(l => l.source === d));
}
function showEdge(t, on) {
  edgeSel.classed('on', d => on && d === t);
  nodeSel.classed('on', d => on && (d === t.source || d === t.target));
  if (on) { panel.innerHTML = `<p class="eyebrow">${esc(t.type)} · ${esc(t.source.short)} → ${esc(t.target.short)}</p><div class="ev">${esc(t.evidence)}</div>`; }
}
function focusNode(w, on) {

}
