<script>
const D = {"crux": {"id": "one-day-evening-first", "question": {"en": "Why 'one day' and not 'first day', and why evening before morning?", "la": "Quare dicitur dies unus et non dies primus?", "he": "לָמָּה נֶאֱמַר ׳יוֹם אֶחָד׳ וְלֹא ׳יוֹם רִאשׁוֹן׳?"}, "summary": "Augustine's morning/evening knowledge and Rashi's 'alone in his world' both read unus as a claim about God's solitude, not counting. Note: the WEB English base text prints 'the first day' and so takes a side.", "finding": "The ancient versions all kept the cardinal — ἡμέρα μία, dies unus, yoma chad — and the modern English translations on both benches quietly convert it to the ordinal: the WEB prints 'the first day', Etheridge's targum prints 'the First Day', and Silbermann's Rashi glosses the lemma 'THE FIRST DAY (literally, one day)' in the very note that exists to ask why it is not 'first'. The question the whole crux is made of survives only in the languages nobody now reads it in. Where the two benches do meet, they meet on the grammar: Bereshit Rabbah 3:9 objects that 'one, second, third' is not a proper series, and Bruno of Segni answers exactly that objection with the logic of relatives — first and second are correlatives, and with no second yet in being nothing could be called first. And they part on the calendar: Ben Zoma derives from yom echad that the day follows the night, while Augustine states in so many words that the days are counted a mane usque in mane."}, "witnesses": [{"id": "lxx-1-5", "short": "lxx-1-5", "author": "The Seventy", "tradition": "greek-jewish", "date": -250, "datelabel": "c. 250 BCE", "place": "Alexandria", "lat": 31.2, "lon": 29.92, "answers": ["unus-cardinal"], "senses": ["translation"], "lemma": {"el": "ἡμέρα μία", "en": "day one"}, "en": "And God called the light Day, and the darkness he called Night. And there was evening and there was morning, one day.", "translator": "claude-draft", "orig": "καὶ ἐκάλεσεν ὁ θεὸς τὸ φῶς ἡμέραν καὶ τὸ σκότος ἐκάλεσεν νύκτα. καὶ ἐγένετο ἑσπέρα καὶ ἐγένετο πρωί, ἡμέρα μία.", "olang": "el", "source": "LXX Gen 1:5 (Rahlfs)", "notes": "The Seventy render the cardinal exactly: ἡμέρα μία, 'day one', not ἡμέρα πρώτη. Every later day in the chapter is an ordinal (δευτέρα, τρίτη), so the Greek preserves the very unevenness the commentators argue about. Brenton's 1851 English prints 'the first day' and dissolves it; this is a fresh draft rather than Brenton for that reason.", "slot": false}, {"id": "vulgate-1-5", "short": "vulgate-1-5", "author": "Jerome", "tradition": "latin", "date": 392, "datelabel": "c. 392", "place": "Bethlehem", "lat": 31.7, "lon": 35.2, "answers": ["unus-cardinal"], "senses": ["translation"], "lemma": {"la": "dies unus", "en": "one day"}, "en": "And he called the light Day, and the darkness Night. And there was made evening and morning, one day.", "translator": "claude-draft", "orig": "Appellavitque lucem Diem, et tenebras Noctem: Factumque est vespere et mane, dies unus.", "olang": "la", "source": "PL 28, col. 163C", "notes": "Jerome keeps the cardinal against the Latin ear: dies unus, then dies secundus, tertius. Every Latin argument in this crux — Ambrose's, Bruno's, Rupert's — exists because he did not write dies primus. PL 28 prints the text with 'Factumque est vespere et mane, dies unus'.", "slot": false}, {"id": "targ-psj-1-5", "short": "targ-psj-1-5", "author": "Targum Pseudo-Jonathan", "tradition": "rabbinic", "date": 750, "datelabel": "600–800", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["unus-cardinal", "night-for-rest"], "senses": ["translation", "literal"], "lemma": {"arc": "יוֹמָא חָד", "en": "one day"}, "en": "And the LORD called the light Day, and made it that the inhabitants of the world might labour in it; and the darkness he called Night, and made it that in it the creatures might have rest. And it was evening, and it was morning, one day.", "translator": "claude-draft", "orig": "וּקְרָא יְיָ לִנְהוֹרָא יְמָמָא וְעַבְדֵהּ לְמִפְלַח בֵּיהּ דַיְירֵי עַלְמָא וְלַחֲשׁוֹכָא קָרָא לֵילְיָא וְעַבְדֵיהּ לְמֵינַח בֵּיהּ בִּרְיָיתָא וַהֲוָה רְמַשׁ וַהֲוָה צְפַר יוֹמָא חָד", "olang": "arc", "source": "Sefaria, 'Targum Jonathan on Genesis'", "notes": "Two things at once. The targum keeps the cardinal, yoma chad, as Onkelos does. And it supplies a reason for the pair that no Hebrew word demands: day is for labour, night for rest. Etheridge's 1862 English prints 'the First Day' — a translator taking the side of the ordinal, exactly as the WEB does — so the cardinal is restored here in a fresh draft.", "slot": false}, {"id": "br-3-8", "short": "br-3-8", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["evening-moral", "unus-yom-kippur", "unus-alone"], "senses": ["allegorical", "literal"], "lemma": {"he": "יוֹם אֶחָד", "en": "one day"}, "en": "“It was evening” (Genesis 1:5) – these are the actions of the wicked. “And it was morning” (Genesis 1:5) – these are the actions of the righteous. “[It was evening and it was morning,] one day” – the Holy One blessed be He gave to them [to Israel] one [unique] day. Which is that? It is Yom Kippur. Rabbi Tanḥum bar Yirmeya said: [It was the day] on which four items were created: Mountains, the heavens, the earth, and light. Rabbi Yudan said: [It was the day] on which the Holy One blessed be He was alone in His world, as there was no one else in His world other than Him. This is in accordance with the opinion of Rabbi Yoḥanan, but it is not in accordance with the opinion of Rabbi Ḥanina. Rabbi Yoḥanan said: The angels [malakhim] were created on the second day. That is what is written: “He covers His upper chambers with water; He makes clouds His chariot; He proceeds on the wings of wind” (Psalms 104:3), and it is written: “He makes the winds His messengers [malakhav]” (Psalms 104:4). Rabbi Ḥanina said: The angels were created on the fifth day, as it is stated: “Let birds fly [yeofef] over the earth…” (Genesis 1:20) and it is written: “And with two it would fly [yeofef]” (Isaiah 6:2). Rabbi Lulyana bar Tavrai said in the name of Rabbi Yitzḥak: Both according to the opinion of Rabbi Ḥanina and according to the opinion of Rabbi Yoḥanan, everyone agrees that none were created on the first day, so people should not say: Mikhael was pulling at the south side of the heavens and Gabriel at its north side, while the Holy One blessed be straightened it out it in the middle. Rather, “I am the Lord, who made everything; who stretched out the heavens alone, who spread the earth by Myself [me’iti]” (Isaiah 44:24) – it [the last word] is written [as two]: “who is with Me [mi iti]?” Who was partner with Me in creation of the world?", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": ".", "olang": "he", "source": "Bereshit Rabbah 3:8 (Vilna numbering; Theodor–Albeck differs)", "notes": "Three answers to 'one day' stacked in one section, and the last of them is the one Rashi will carry into Christendom's reading list. (1) Evening and morning are the deeds of the wicked and of the righteous — the moral reading. (2) 'One day' is the day God gave Israel: the Day of Atonement. (3) R. Yudan: it was the day on which the Holy One was alone (yachid) in his world. That third answer forces the angel question, and the section closes by ruling that on the first day nothing whatever was created besides God — lest anyone say Michael held the sky at the south and Gabriel at the north while God measured in the middle.", "slot": false}, {"id": "br-3-9", "short": "br-3-9", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["unus-grammatical"], "senses": ["literal"], "lemma": {"he": "אֶחָד, שֵׁנִי, שְׁלִישִׁי", "en": "one, second, third"}, "en": "Rabbi Shmuel bar Ami said: From the beginning of the creation of the world, the Holy One blessed be He desired to enter into a partnership with the creations below. Either way, it [the wording of the verse] is difficult. If it [the counting of the days] was for the purpose of a tally, it should have said: ‘One, two, three,’ or else ‘first, second, third’; is it proper to say: ‘One, second, third?’ This is bewildering. When did the Holy One blessed be He repay them? It was later, at the establishment of the Tabernacle, as it is stated: “The one who presented his offering on the first day” (Numbers 7:12) – [alluding to] the first [day] of the creation of the world. The Holy One blessed be He said: ‘It is as though I created the world on that day.’ It was taught: That day was conferred with ten crowns. It was the first day of the act of Creation; the first day for [years of] kings; the first day for the princes; the first day for the priesthood; the first day for the Divine Presence [on earth], as it is stated: “They shall craft a sanctuary for Me [and I will dwell in their midst]” (Exodus 25:8); the first day for blessing; the first day for sacrificial service; the first day for the prohibition of improvised altars; the first day for slaughtering [sacrifices] in the north; and the first day for descent of fire [from heaven], as it is stated: “Fire emerged from before the Lord…” (Leviticus 9:24).", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "אָמַר רַבִּי שְׁמוּאֵל בַּר אַמֵּי, מִתְּחִלַּת בְּרִיָּתוֹ שֶׁל עוֹלָם נִתְאַוֶּה הַקָּדוֹשׁ בָּרוּךְ הוּא לַעֲשׂוֹת שֻׁתָּפוּת בַּתַּחְתּוֹנִים, מַה נַּפְשָׁךְ, אִם לְעִנְיַן הַחֶשְׁבּוֹן, לֹא הָיָה צָרִיךְ לְמֵימַר אֶלָּא אֶחָד, שְׁנַיִם, שְׁלֹשָׁה, אוֹ רִאשׁוֹן, שֵׁנִי, וּשְׁלִישִׁי. שֶׁמָּא אֶחָד, שֵׁנִי, שְׁלִישִׁי, אֶתְמְהָא. אֵימָתַי פָּרַע לָהֶם הַקָּדוֹשׁ בָּרוּךְ הוּא, לְהַלָּן בַּהֲקָמַת הַמִּשְׁכָּן, שֶׁנֶּאֱמַר (במדבר ז, יב): וַיְהִי הַמַּקְרִיב בַּיּוֹם הָרִאשׁוֹן אֶת קָרְבָּנוֹ, רִאשׁוֹן לִבְרִיָּתוֹ שֶׁל עוֹלָם, אָמַר הַקָּדוֹשׁ בָּרוּךְ הוּא כְּאִלּוּ בְּאוֹתוֹ יוֹם בָּרָאתִי אֶת עוֹלָמִי. תָּנֵי עֶשֶׂר עֲטָרוֹת נָטַל אוֹתוֹ הַיּוֹם, רִאשׁוֹן לְמַעֲשֵׂה בְרֵאשִׁית, רִאשׁוֹן לִמְלָכִים, רִאשׁוֹן לִנְשִׂיאִים, רִאשׁוֹן לִכְהֻנָּה, רִאשׁוֹן לַשְּׁכִינָה, שֶׁנֶּאֱמַר (שמות כה, ח): וְעָשׂוּ לִי מִקְדָּשׁ, רִאשׁוֹן לִבְרָכָה, רִאשׁוֹן לָעֲבוֹדָה, רִאשׁוֹן לְאִסּוּר הַבָּמָה, רִאשׁוֹן לִשְׁחִטָּה בַּצָּפוֹן, רִאשׁוֹן לִירִידַת הָאֵשׁ, שֶׁנֶּאֱמַר (ויקרא י, ב): וַתֵּצֵא אֵשׁ מִלִּפְנֵי ה' וגו'.", "olang": "he", "source": "Bereshit Rabbah 3:9 (Vilna numbering)", "notes": "The grammatical objection in its sharpest rabbinic form: if the days were being tallied it should read 'one, two, three' or 'first, second, third' — is it proper to say 'one, second, third'? The midrash states the difficulty and then answers something else (the ten crowns of the Tabernacle's first day), leaving the grammar standing as a difficulty. Ambrose, Bruno and Rupert answer the identical objection on the Latin side, and nobody on either side cites anybody.", "slot": false}, {"id": "rashi-1-5", "short": "rashi-1-5", "author": "Rashi", "tradition": "rabbinic", "date": 1090, "datelabel": "1080–1105", "place": "Troyes", "lat": 48.3, "lon": 4.08, "answers": ["unus-grammatical", "unus-alone"], "senses": ["literal"], "lemma": {"he": "יוֹם אֶחָד", "en": "one day"}, "en": "יום אחד THE FIRST DAY (literally, one day) — According to the regular mode of expression used in this chapter it should be written here “first day”, just as it is written with regard to the other days “the second”, “the third”, “the fourth”. Why, then, does it write אחד “one”? Because the Holy One, blessed be He, was then the Only One (Sole Being) in His Universe, since the angels were not created until the second day. Thus it is explained in Genesis Rabbah (Genesis Rabbah 3:8).", "translator": "Rosenbaum–Silbermann 1929–34", "orig": "יום אחד. לְפִי סֵדֶר לְשׁוֹן הַפָּרָשָׁה הָיָה לוֹ לִכְתֹּב יוֹם רִאשׁוֹן, כְּמוֹ שֶׁכָּתוּב בִּשְׁאָר הַיָּמִים שֵׁנִי, שְׁלִישִׁי, רְבִיעִי, לָמָּה כָתַב אֶחָד? לְפִי שֶׁהָיָה הַקָּבָּ\"ה יָחִיד בְּעוֹלָמוֹ, שֶׁלֹא נִבְרְאוּ הַמַּלְאָכִים עַד יוֹם שֵׁנִי, כָּךְ מְפֹרָשׁ בּבְ\"רַ:", "olang": "he", "source": "Rashi on Gen 1:5, s.v. יום אחד", "notes": "Rashi puts the question in the form the Latin bench uses — by the order of the chapter's own language it should have written 'first day,' as it writes second, third, fourth — and answers it from Bereshit Rabbah 3:8: because the Holy One was then alone (yachid) in his world, the angels not having been created until the second day. Ambrose asks the same question in Latin seven centuries earlier and answers it from the length of a circuit; Bruno of Segni answers it from the logic of relatives. Note that Silbermann's English renders the lemma 'THE FIRST DAY (literally, one day)' — the translator conceding the point the commentary exists to dispute.", "slot": false}, {"id": "b-chag-12a", "short": "b-chag-12a", "author": "Babylonian Talmud", "tradition": "rabbinic", "date": 550, "datelabel": "redaction 500–600", "place": "Babylonia (Sura / Pumbedita)", "lat": 32.5, "lon": 44.4, "answers": ["day-is-a-measure"], "senses": ["literal"], "lemma": {"he": "מִדַּת יוֹם וּמִדַּת לַיְלָה", "en": "the measure of the day and the measure of the night"}, "en": "And R. Yehudah said in the name of Rav, Ten things were created on the first day, and they are these: Heaven and earth, chaos and desolation, light and darkness, wind and waters, the measure of the day and the measure of the night. \"Heaven and earth\", as it is written, (Genesis 1:1) \"In the beginning God created the heaven and the earth.\" Chaos and desolation, as it is written, (Genesis 1:2) \"And the earth was chaos and desolation.\" Light and darkness, darkness as it is written, (Genesis 1:2) \"and darkness was upon the face of the deep,\" light as it is written, (Genesis 1:2) \"And God said, Let there be light.\" Wind and water, as it is written, (Genesis 1:3) \"and the wind of God floated upon the face of the waters.\" The measure of the day and the measure of the night, as it is written, (Genesis 1:5) \"And there was evening and there was morning, one day.\"", "translator": "Sefaria Community Translation", "orig": "ואמר רב יהודה אמר רב עשרה דברים נבראו ביום ראשון ואלו הן שמים וארץ תהו ובהו אור וחשך רוח ומים מדת יום ומדת לילה שמים וארץ דכתיב (בראשית א, א) בראשית ברא אלהים את השמים ואת הארץ תהו ובהו דכתיב (בראשית א, ב) והארץ היתה תהו ובהו אור וחשך חשך דכתיב (בראשית א, ב) וחשך על פני תהום אור דכתיב (בראשית א, ג) ויאמר אלהים יהי אור רוח ומים דכתיב (בראשית א, ב) ורוח אלהים מרחפת על פני המים מדת יום ומדת לילה דכתיב (בראשית א, ה) ויהי ערב ויהי בקר יום אחד", "olang": "arc", "source": "b. Chagigah 12a (Vilna)", "notes": "Rav Yehuda in Rav's name lists ten things made on the first day, and the tenth pair is proof-texted from our verse: the measure of the day and the measure of the night, 'and there was evening and there was morning, one day.' The day's own measure is itself a creature of day one — which is the rabbinic way of answering the question the Latin bench asks as 'what kind of day was it, with no sun?' Hugh of St Victor's dies naturalis is the same instinct in computistical dress.", "slot": false}, {"id": "b-chull-83a", "short": "b-chull-83a", "author": "Babylonian Talmud", "tradition": "rabbinic", "date": 550, "datelabel": "redaction 500–600", "place": "Babylonia (Sura / Pumbedita)", "lat": 32.5, "lon": 44.4, "answers": ["day-follows-night"], "senses": ["literal"], "lemma": {"he": "הַיּוֹם הוֹלֵךְ אַחַר הַלַּיְלָה", "en": "the day follows the night"}, "en": "MISHNAH. The 'one day' stated with regard to an animal and its young (Lev 22:28) means that the day follows the night. This is what Ben Zoma expounded: it is said in the work of creation 'one day' (Gen 1:5), and it is said with regard to an animal and its young 'one day'; just as the 'one day' stated in the work of creation means that the day follows the night, so too the 'one day' stated with regard to an animal and its young means that the day follows the night. GEMARA. Our rabbis taught: this is what Ben Zoma expounded. Since the whole passage speaks of nothing but consecrated things, and with consecrated things the night follows the day, one might have thought it is so here too; therefore it is said here 'one day' and it is said in the work of creation 'one day' — just as the 'one day' stated in the work of creation means that the day follows the night, so too the 'one day' stated with regard to an animal and its young means that the day follows the night.", "translator": "claude-draft", "orig": "מתני׳ (ויקרא כב, כח) יום אחד האמור באותו ואת בנו היום הולך אחר הלילה את זו דרש רבי שמעון בן זומא נאמר במעשה בראשית (בראשית א, ה) יום אחד ונאמר באותו ואת בנו יום אחד מה יום אחד האמור במעשה בראשית היום הולך אחר הלילה אף יום אחד האמור באותו ואת בנו היום הולך אחר הלילה: גמ׳ ת\"ר את זו דרש ר\"ש בן זומא לפי שכל הענין כולו אינו מדבר אלא בקדשים ובקדשים לילה הולך אחר היום יכול אף זה כן נאמר כאן יום אחד ונאמר במעשה בראשית יום אחד מה יום אחד האמור במעשה בראשית היום הולך אחר הלילה אף יום [אחד] האמור באותו ואת בנו היום הולך אחר הלילה", "olang": "arc", "source": "b. Chullin 83a (Vilna; Mishnah Chullin 5:5 with its gemara)", "notes": "The halakhic weight of the verse, and the flat contradictory of the Latin bench. Ben Zoma — the same tradent who reads merahefet as a measured gap in K7 — ties 'one day' in Lev 22:28 to 'one day' in Genesis by verbal analogy and rules that the day follows the night: reckoning begins at evening. Augustine says in so many words that the days are counted a mane usque in mane; Ambrose says the day has the birthright over the night; Hugh says every dawn belongs to the preceding day. Same five words of Genesis, two calendars. Steinsaltz/Davidson English is CC BY-NC and is not embedded; this is a fresh draft against the Wikisource Aramaic.", "slot": false}, {"id": "ambrose-hex-1-10", "short": "ambrose-hex-1-10", "author": "Ambrose", "tradition": "latin", "date": 387, "datelabel": "c. 387", "place": "Milan", "lat": 45.46, "lon": 9.19, "answers": ["day-precedes-night", "unus-24-hours"], "senses": ["literal"], "lemma": {"la": "Praeclare etiam unum non primum diem dixit", "en": "Excellently, too, he said one day and not first day"}, "en": "Some ask why Scripture recorded evening first and morning afterward, lest it should seem to put night before day. They fail to notice, first, that it put the day first by saying, 'And God called the light Day, and the darkness he called Night'; and then that evening is the end of the day, and morning the end of the night. So, to give the day the prerogative and the birthright, it named the end of the day first, since night was to follow, and afterward added the end of the night. […] Excellently, too, he said one day and not first day. For with a second day and a third and the rest to follow he could have said 'first,' and that seemed to be the order; but he laid down a law, that twenty-four hours of day and night together be defined by the name of day only — as if he were saying: the measure of twenty-four hours is the time of one day. For as the generation of men is counted and the women are understood along with them, since the lesser are bound to the greater, so too the days are numbered and the nights reckoned as joined to them. Therefore as there is one circuit, so there is one day.", "translator": "claude-draft", "orig": "Quaerunt aliqui, cur prius vesperum, postea mane Scriptura memoraverit, ne forte noctem priusquam diem significare videatur. Nec advertunt primo quod praemiserit diem, dicendo: Et vocavit Deus lucem diem, et tenebras vocavit noctem: deinde quod vesper finis diei sit, et mane finis noctis. Ergo ut praerogativam et primatus nativitatis diei daret, prius finem diei significavit, postquam secutura nox esset, deinde postea finem noctis adjunxit. Eo usque autem noctem diei Scriptura anteferre non potuit, ut et diei et noctis tempora, diei appellatione concluserit, tamquam principalis auctoritate nominis vindicaverit. Et hanc Scripturae esse consuetudinem, ut potiori appellationem deputet, frequentibus exemplis probamus. Siquidem et Jacob dixit: Dies vitae meae, pusilli et mali (Gen. XLVII, 9) . Et iterum: Omnes dies vitae meae. Et David posuit: Dies annorum nostrorum (Ps. LXXXIX, 10) ; non dixit et noctes. Unde advertimus ea quae nunc in specie historiae traduntur, vim statuisse legis in posterum. Principium ergo diei, vox Dei est: fiat lux; et facta est lux. Finis diei vesper est. Jam sequens dies ex noctis fine succedit. Sententia autem Dei evidens, quia diem primo vocavit lucem, et secundo vocavit tenebras noctem. 37. Praeclare etiam unum non primum diem dixit; nam secuturo secundo, et tertio die, et deinceps reliquis primum potuit dicere: et hoc ordinis videbatur, sed legem statuit, ut viginti 22 quatuor horae diurnae atque nocturnae diei tantum nomine definiantur, ut si diceret: Viginti quatuor horarum mensura unius diei tempus est. Sicut enim virorum generatio computatur, et intelligitur etiam feminarum, quia nectuntur secunda potioribus; ita etiam dies numerantur, et noctes aestimantur adjunctae. Sicut igitur circuitus unus, ita dies unus.", "olang": "la", "source": "PL 14, col. 143C", "notes": "Ambrose's chapter heading states the crux exactly: 'That day is here set before night, against what seems so to some; why it is called one day rather than first; and that it is closed by a morning end.' His answers are three: evening comes first because evening is the end of the day and morning the end of the night, so naming evening first gives the day its birthright; 'one' rather than 'first' because a day is a single circuit of twenty-four hours; and the day names the night along with it as men name women. He also notes that many call a week 'one day' because it returns into itself. At PL 14:145C he adds a fourth: the day is set apart from the others as 'one,' not compared with them as 'first,' because on it the foundations of all things were laid. Elided in the English at […]: the proof from Scripture's custom of naming the greater term for the pair (Jacob's 'days of my life', Ps 89:10's 'days of our years', never 'and nights'), and the sentence 'Principium ergo diei, vox Dei est: fiat lux.'", "slot": false}, {"id": "aug-gnm-1-10", "short": "aug-gnm-1-10", "author": "Augustine", "tradition": "latin", "date": 389, "datelabel": "388–389", "place": "Thagaste", "lat": 36.29, "lon": 7.95, "answers": ["day-precedes-night", "evening-is-completion"], "senses": ["literal"], "lemma": {"la": "reliqui dies computantur a mane usque in mane", "en": "the remaining days are counted from morning to morning"}, "en": "Here too the Manichees carp, supposing it was said as though the day began from evening. They do not understand that the whole of that working — by which the light was made, and division was made between light and darkness, and the light was called Day and the darkness Night — that this whole working belongs to the day; and that after this working, the day being as it were finished, evening was made. But because the night also belongs to its own day, the one day is not said to have passed until, the night too being over, morning came: and so thereafter the remaining days are counted from morning to morning.", "translator": "claude-draft", "orig": "Et hic calumniantur Manichaei, dum putant ita dictum esse, quasi a vespera dies coeperit. Non intelligunt operationem illam qua lux facta est, et divi sum est inter lucem et tenebras, et vocata est lux dies, et tenebrae nox; hanc ergo totam operationem non intelligunt ad diem pertinere: post hanc autem operationem tanquam finito die facta est vespera. Sed quia etiam nox ad diem suum pertinet, non dicitur transisse dies unus, nisi etiam nocte transacta cum factum est mane: sic deinceps reliqui dies computantur a mane usque in mane.", "olang": "la", "source": "PL 34, col. 180", "notes": "Augustine's earliest answer, and the one the Latin bench keeps: the day does not begin at evening. The whole work belongs to the day; evening is what follows a finished day; and the days are counted a mane usque in mane, morning to morning. The Manichees are the named opponents, but the reckoning he rejects is the one Ben Zoma rules for in b. Chullin 83a — the day that follows the night. Neither side knows it is contradicting the other.", "slot": false}, {"id": "aug-gnl-1-17", "short": "aug-gnl-1-17", "author": "Augustine", "tradition": "latin", "date": 401, "datelabel": "401–415", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["unus-all-time", "evening-moral"], "senses": ["allegorical"], "lemma": {"la": "ideoque non dictus est primus, sed unus dies", "en": "and that is why it was called not first but one day"}, "en": "Or is this day the name of the whole of time, and does it include all the volumes of the ages under this one word — and is that why it was called not 'first' but 'one day'? For 'and there was evening,' he says, 'and there was morning, one day': so that by the evening's being made the sin of the rational creature may be signified, and by the morning's being made, its renewal.", "translator": "claude-draft", "orig": "An hic dies totius temporis nomen est, et omnia volumina saeculorum hoc vocabulo includit; ideoque non dictus est primus, sed unus dies? Et facta est enim vespera, et factum est, inquit, mane dies unus: ut per hoc quod facta est vespera, peccatum rationalis creaturae; quod autem factum est mane, renovatio ejus significata videatur.", "olang": "la", "source": "PL 34, col. 259", "notes": "The one sentence in the Latin bench that puts the rabbis' question and answers it their way: not first but one, because the word holds all time. Augustine raises it and then sets it aside in the next paragraph — 'this is a matter of prophetic allegory, which is not what we undertook in this discourse' — and returns to the literal question. The reading he declines here is the one Abelard will take up as his own, and it is the shape of Bereshit Rabbah 3:8's 'one day' too, though what fills the word there is Yom Kippur and not the ages.", "slot": false}, {"id": "aug-gnl-4-22", "short": "aug-gnl-4-22", "author": "Augustine", "tradition": "latin", "date": 410, "datelabel": "401–415", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["unus-repeated", "evening-is-self-knowledge"], "senses": ["spiritual", "literal"], "lemma": {"la": "idem dies ubique repetitur", "en": "the same day is repeated throughout"}, "en": "And because the other creatures, which are made below it, are not made without its knowledge, therefore of course the same day is repeated throughout, so that by its repetition there come to be as many days as there are kinds of created things to be distinguished, to be brought to an end by the perfection of the number six: so that the evening of the first day is its knowledge of itself, that it is not what God is; and the morning after this evening, by which the one day is closed and the second begun, is its turning, by which it refers what it has been created to the praise of the Creator, and receives from the Word of God the knowledge of the creature that is made after it, that is, of the firmament.", "translator": "claude-draft", "orig": "Et quia caeterae creaturae, quae infra ipsam fiunt, sine cognitione ejus non fiunt, propterea nimirum idem dies ubique repetitur, ut ejus repetitione fiant tot dies, quoties distinguuntur rerum genera creatarum, perfectione senarii numeri terminanda: ut vespera primi diei sit etiam sui cognitio, non se esse quod Deus est; mane autem post hanc vesperam, quo concluditur dies unus, et inchoatur secundus, conversio sit ejus, qua id quod creata est, ad laudem referat Creatoris, et percipiat de Verbo Dei cognitionem creaturae quae post ipsam fit, hoc est firmamenti", "olang": "la", "source": "PL 34, col. 312", "notes": "Augustine's mature answer, and the one the Glossa puts in the margin of 1:5 by book, chapter and column. There is only one day: the angelic light itself. Its evening is its knowledge of itself as not-God; its morning is that knowledge referred back in praise; and the six days are that one day presented six times over, once for each kind of thing made. On this reading 'one day' is not a counting word at all, which is why the sixfold repetition does not make it 'first'. Two chapters on (I.25, PL 34:313) he draws the corollary the City of God will state more compactly: this is why no night is ever named.", "slot": false}, {"id": "aug-gnl-5-18", "short": "aug-gnl-5-18", "author": "Augustine", "tradition": "latin", "date": 412, "datelabel": "401–415", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["simul", "evening-is-self-knowledge"], "senses": ["spiritual"], "lemma": {"la": "illa velut matutina sive diurna cognitione, hac vero velut vespertina", "en": "by that as it were morning or daylight knowledge, and by this as it were evening knowledge"}, "en": "Now then let us consider those things which God made all at once, from which, when they were completed on the sixth day, he rested on the seventh — intending afterward to consider his works in which he works even now. […] Of this whole creation of God there is much we do not know: whether things in the heavens too high for our sense to reach them, or things in regions of the earth perhaps uninhabitable, or things hidden below, whether in the depth of the abyss or in the secret folds of the earth. Now these things, before they were made, certainly were not. How then were things known to God which were not? And again, how could he make things that were not known to him? For he made nothing in ignorance. He made them known, then; he did not come to know them once made. Accordingly, before they were made they both were and were not: they were in God's knowledge, they were not in their own nature. And therefore that day was made on which they should become known in both ways, both in God and in themselves: by that as it were morning or daylight knowledge, and by this as it were evening knowledge.", "translator": "claude-draft", "orig": "Jam nunc consideremus ea quae fecit Deus omnia simul, a quibus in die sexto consummatis requievit in septimo, postea consideraturi opera ejus, in quibus usque nunc operatur. Ipse enim ante saecula: a saeculo autem ea dicimus, ex quo coepit saeculum, sicut ipsum mundum; in saeculo autem, sicut ea quae nascuntur in mundo. Cum ergo Scriptura dixisset, Omnia per ipsum facta sunt, et sine ipso factum est nihil; paulo post ait, In hoc mundo erat, et mundus per ipsum factus est (Joan. I, 3, 10) . De hoc opere Dei alio loco scriptum est: Qui fecisti mundum de materia informi (Sap. XI, 18) . Hic mundus plerumque coeli et terrae nomine nuncupatur, sicut jam commemoravimus, quae Scriptura dicit Deum fecisse, cum factus est dies: de quibus verbis jam, quantum visum est, disputavimus, quemadmodum congruat conditioni mundi hujus, et quod sex diebus consummatus est cum omnibus quae in eo sunt, et quod tunc factus, cum factus est dies, ut et illud congruat quod creavit omnia simul (Eccli. XVIII. 1) . CAPUT XVIII.-- Creaturae plures nobis ignotae. Qua ratione a Deo et ab Angelis noscuntur. Cognitio matutina et vespertina. 36. Hujus universae Dei creaturae multa non novimus, sive quae in coelis sunt altius, quam ut noster sensus ea possit attingere; sive quae in regionibus terrarum fortassis inhabitabilibus; sive quae deorsum latent, vel in profundo abyssi, vel in occultis sinibus terrae. Haec igitur antequam fierent, utique non erant. Quomodo ergo Deo nota erant quae non erant? Et rursus quomodo ea faceret quae sibi nota non erant? Non enim quidquam fecit ignorans. Nota ergo fecit, non facta cognovit. Proinde, antequam fierent, et erant, et non erant: erant in Dei scientia, non erant in sua natura. Ac per hoc factus est dies ille, cui utroque modo innotescerent, et in Deo et in seipsis: illa velut matutina sive diurna cognitione, hac vero velut vespertina.", "olang": "la", "source": "PL 34, col. 333", "notes": "The place where the two halves of Augustine's reading are joined and named. 'Creavit omnia simul' (Sir 18:1) makes the six days non-successive; the morning and evening knowledge explains what the day words are then doing. Migne's chapter heading supplies the technical term the schools will quote — cognitio matutina et vespertina. This is the passage Bonaventure will call 'very reasonable and very subtle' and then decline.", "slot": false}, {"id": "aug-civ-11-7", "short": "aug-civ-11-7", "author": "Augustine", "tradition": "latin", "date": 417, "datelabel": "413–427", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["unus-repeated", "evening-is-self-knowledge"], "senses": ["spiritual"], "lemma": {"la": "nusquam interposuit vocabulum noctis", "en": "nowhere did it insert the word 'night'"}, "en": "If, that is, we can understand the evening of this day and its morning with any fitness. For the knowledge of the creature, compared with the knowledge of the Creator, in a manner grows dusk; and again it grows light and becomes morning, when that knowledge too is referred to the praise and love of the Creator; nor does it fall away into night, where the Creator is not forsaken through love of the creature. In short, when Scripture numbered those days in order, it nowhere inserted the word 'night.' It nowhere says 'night was made,' but 'evening was made, and morning was made, one day' (Gen 1:5); and so a second day, and the rest. For the knowledge of a creature in itself is, so to speak, more faded than when it is known in the Wisdom of God, as in the art by which it was made. Therefore it can more fittingly be called evening than night; which nevertheless, as I said, when it is referred to the praise and love of the Creator, runs back into morning. And when it does this in the knowledge of itself, it is one day.", "translator": "claude-draft", "orig": "Si tamen et vesperam diei hujus et mane aliquatenus congruenter intelligere valeamus. Quoniam scientia creaturae in comparatione scientiae Creatoris quodammodo vesperascit: itemque lucescit et mane fit, cum et ipsa refertur ad laudem dilectionemque Creatoris; nec in noctem vergitur, ubi non Creator creaturae dilectione relinquitur. Denique Scriptura cum illos dies dinumeraret ex ordine, nusquam interposuit vocabulum noctis. Non enim ait alicubi, Facta est nox; sed, Facta est vespera, et factum est mane dies unus (Gen. I, 5) . Ita dies secundus, et caeteri. Cognitio quippe creaturae in se ipsa decoloratior est, ut ita dicam, quam cum in Dei Sapientia cognoscitur, velut in arte qua facta est. Ideo vespera congruentius quam nox dici potest: quae tamen, ut dixi, cum ad laudandum et amandum refertur Creatorem, recurrit in mane. Et hoc cum facit in cognitione sui ipsius, dies unus est", "olang": "la", "source": "PL 41, col. 322", "notes": "The City of God's compact restatement, and the one that travels. The observation that carries the argument is a plain fact about the text: through all six days Scripture never once writes 'and night was made.' Evening, yes; night, never. Augustine reads that as evidence that the vespera in question is a dimming of knowledge, not a darkness. Gregory the Great will make the same observation serve a moral reading, and the Glossa prints Gregory's version on 1:5.", "slot": false}, {"id": "bede-gen-1-5", "short": "bede-gen-1-5", "author": "Bede", "tradition": "latin", "date": 720, "datelabel": "c. 720", "place": "Jarrow", "lat": 54.98, "lon": -1.49, "answers": ["unus-24-hours", "day-precedes-night"], "senses": ["literal"], "lemma": {"la": "dies expletus est unus, viginti scilicet et quatuor horarum", "en": "one day was completed, of twenty-four hours"}, "en": "'And there was evening and morning, one day.' There was evening, the light setting little by little after the space of a day's length was spent, and passing beneath the lower parts of the world — which is now done by the accustomed circuit of the sun in the nights; and there was morning, the same light returning little by little over the lands and beginning another day; and up to this point one day was completed, of twenty-four hours, that is. By the commendation of which word Scripture watchfully warns us to learn that the light which was made lit the lower parts of the world by its setting. For if it did not do this, but rather, evening having come, it wholly perished and again little by little revived at morning, it would have said the day was completed not at the morning of the following day but rather at the evening of the first.", "translator": "claude-draft", "orig": "Factumque est vespere et mane dies unus. Factumque est vespere occidente paulatim luce post expletum spatium diurnae longitudinis, atque inferiores mundi partes subeunte, quod nunc usitato solis circuitu noctibus agi solet; factum et mane redeunte eadem paulatim super terras, atque alium diem initiante; et huc usque dies expletus est unus, viginti scilicet et quatuor horarum, cujus commendatione verbi Scriptura vigilanter admonet ut lucem quae facta est inferiora orbis occasu suo lustrasse discamus. Nam si non hoc faceret, sed magis facto vespere paulatim tota periret, ac rursum paulatim mane recreata resurgeret, non jam in mane diei sequentis, sed potius in vespera primi unum diceret esse diem perfectum", "olang": "la", "source": "PL 91, col. 17D", "notes": "Bede reads the phrase as an argument about physics. If the created light had been snuffed out at evening and rekindled at morning, then the day would have been complete at its own evening and Scripture would have said so. That it waits for the morning proves the light went on shining round the underside of the world — the same body of light that later runs the sun's circuit. This is the one place in the crux where the wording of Genesis is treated as evidence for cosmology. Rabanus copies the paragraph verbatim.", "slot": false}, {"id": "rabanus-gen-1-5", "short": "rabanus-gen-1-5", "author": "Rabanus Maurus", "tradition": "latin", "date": 822, "datelabel": "c. 822", "place": "Fulda", "lat": 50.55, "lon": 9.68, "answers": ["unus-24-hours", "day-precedes-night"], "senses": ["literal"], "lemma": {"la": "viginti scilicet et quatuor horarum", "en": "of twenty-four hours, that is"}, "en": "'And there was evening and morning, one day.' There was evening, that is, the light setting little by little after the space of a day's length was spent, and passing beneath the lower parts of the world — which is now done by the accustomed circuit of the sun in the nights; and there was morning, the same light returning little by little above the lands and beginning another day; and up to this point one day was completed, of twenty-four hours, that is. By the commendation of which word Scripture watchfully warns us to say that the light which was made lit the lower parts of the world by its setting. For if it did not do this, but rather, evening having come, it wholly perished and again at morning rose up in the thing created, it would have said the day was completed not at the morning of the following day but rather at the evening of the first.", "translator": "claude-draft", "orig": "Factumque est vespere et mane dies unus. Factum est vespere, id est, occidente paulatim luce post expletum spatium diurnae longitudinis, atque inferiores mundi partes subeunte, quod nunc usitato solis circuitu noctibus agi solet; factum et mane redeunte eadem paulatim supra terras, atque alium diem initiante; et huc usque dies expletus est unus, viginti scilicet et quatuor horarum. Cujus commendatione verbi, Scriptura vigilanter admonet ut lucem quae facta est inferiora orbis occasu suo lustrasse dicamus. Nam si non hoc faceret, sed magis facto vespere paulatim tota periret, ac rursum mane paulatim in re creata resurgeret, non jam in mane diei sequentis, sed potius in vespera primi, unum diceret esse diem perfectum.", "olang": "la", "source": "PL 107, col. 448D", "notes": "Rabanus copies Bede on 1:5 as he copies Bede on 1:2 — the same silent transmission the K7 threads trace. The Corpus Corporum text differs from Bede's at two words ('dicamus' for 'discamus', 'in re creata resurgeret' for 'recreata resurgeret'); the second looks like a printer's separation of 'recreata' rather than a real variant, and the PL plate should be checked before either is treated as Rabanus' own.", "slot": false}, {"id": "alcuin-int-34", "short": "alcuin-int-34", "author": "Alcuin", "tradition": "latin", "date": 796, "datelabel": "c. 796", "place": "Tours", "lat": 47.39, "lon": 0.69, "answers": ["evening-is-completion"], "senses": ["literal"], "lemma": {"la": "finis operis perfecti, et initium operis incoepti", "en": "the end of a work completed, and the beginning of a work begun"}, "en": "Question 33. Why is the light read as created on the first day? — Answer: It suits the works of God that on the first day a temporal light should first be made from the eternal light, so that there might be something by which the rest he would create could appear. Question 34. What is 'there was evening and morning, one day'? — Answer: That is, the end of a work completed, and the beginning of a work begun.", "translator": "claude-draft", "orig": "Inter. 33. Quare prima die lux creata legitur?-- Resp. Congruit operibus Dei, ut prima die a [ Ms., de] luce aeterna lux temporalis primo fieret, ut esset unde caetera quae crearet, apparerent. Inter. 34. Quid est: Factum est vespere et mane dies unus (vers. 5) ?-- Resp. Id est finis operis perfecti, et initium operis incoepti.", "olang": "la", "source": "PL 100, col. 520A", "notes": "Augustine's angelic evening and morning stripped of the angels and reduced to a schoolroom formula: evening is a finished work, morning is a work beginning. Everything that made the doctrine difficult is gone, and what is left will be copied by Wigbod and Angelomus and, through them, become the standard Carolingian gloss on the verse.", "slot": false}, {"id": "wigbod-gen-1-5", "short": "wigbod-gen-1-5", "author": "Wigbod", "tradition": "latin", "date": 790, "datelabel": "c. 790", "place": "Aachen", "lat": 50.78, "lon": 6.08, "answers": ["evening-is-completion", "evening-is-self-knowledge"], "senses": ["literal", "spiritual"], "lemma": {"la": "ipsa creaturae cognitio in semetipsa vespera erat, in Deo autem mane", "en": "the creature's knowledge of itself was evening; in God, morning"}, "en": "Disciple: 'And there was evening and morning, one day.' How is this to be understood? — Master: What is evening but the perfecting of each several work, and morning the beginning of those that follow? — AUGUSTINE. Disciple: You maintain that the first day is a spiritual creature; how then did it have evening and morning? — Master: Every creature, before it was made in its own time, was in the Word of God itself, to be known first by the angels and so to be made in its own time. Wherefore the creature's own knowledge of itself was evening; in God, however, morning — because the creature is seen more fully in the Lord than the creature is seen in itself; seen more fully, that is, in the art by which it was made than in itself which was made. For this reason the evangelist John says: 'What was made, in him was life' (John 1:3–4).", "translator": "claude-draft", "orig": "D. Factumque est vespere et mane dies unus (Ibid.) . Quomodo hoc intelligendum est? M. Quid per vesperam nisi perfectio singulorum operum, et mane est inchoatio sequentium? AUGUSTINUS. D. Primum enim diem astruis spiritalem esse creaturam, et quomodo habuit vespere et mane? M. Omnis namque creatura antequam tempore suo fieret, in ipso Dei Verbo erat, prius ab angelis cognoscenda, et sic suo tempore facienda. Quapropter ipsa creaturae cognitio in semetipsa vespera erat, in Deo autem mane, quia plus videtur ipsa creatura in Domino, quam in seipsa videtur creatura. Plus scilicet videtur in arte qua facta est, quam in seipsa quae facta est.", "olang": "la", "source": "PL 96, col. 1120D", "notes": "The Carolingian catena doing on 1:5 what it does on 1:2 in K7: setting the two Latin lines side by side and labelling the second one. The schoolroom formula comes first unattributed; then the disciple presses the hard case — if the first day is a spiritual creature, what are its evening and morning? — and the answer is Augustine's angelic double knowledge, printed under his name. This is where a reader of the ninth century could see that the compressed gloss and the difficult doctrine were the same doctrine.", "slot": false}, {"id": "angelom-gen-1-5", "short": "angelom-gen-1-5", "author": "Angelomus of Luxeuil", "tradition": "latin", "date": 850, "datelabel": "c. 850", "place": "Luxeuil", "lat": 47.82, "lon": 6.38, "answers": ["evening-is-completion", "evening-is-self-knowledge", "unus-angelic-unity"], "senses": ["literal", "spiritual"], "lemma": {"la": "propter unitatem angelicae dignitatis", "en": "on account of the unity of angelic dignity"}, "en": "Verse 5. 'And there was evening and morning, one day.' It must be asked why 'evening and morning' is said, when the sun was not yet in the firmament, by whose setting evening and by whose rising morning would be made. Or did the first and second and third day perhaps have as much space as there is from the rising of the sun to its setting, and again, wheeling by the north, it returns to the east so as to drive off the world's darkness by its brightness — the space which those who are in caves and workhouses, though they lack the light, can feel by habit? Which might perhaps be understood so, were it not that 'evening and morning' is added. So it remains that by evening is understood the perfecting of the preceding work, and by morning the beginning of the one that follows. For Scripture speaks after our manner, so that the distinction of God's works may be understood. Further, what it says, 'evening and morning, one day,' can be referred to the angelic creature. For when it turned its gaze away from God and turned to beholding the creature, in a manner it was evening; but when it turned back to the Creator, so as to understand the creature more clearly in him, it was morning. And yet, if it had remained in the consideration of the creature, it would have been not evening only but night. 'One day' is well added, on account of the unity of angelic dignity, which so clings to contemplating the one God that it never moves its gaze from contemplation.", "translator": "claude-draft", "orig": "VERS. 5.-- Factumque est vespere et mane dies unus. Quaerendum est cur dicatur, vespere et mane, cum adhuc non erat sol in firmamento, cujus occasu vespere et ortu mane efficerentur? An forte tantum spatium prima, et secunda, et tertia dies habuit, quantum est ab ortu solis usque ad occasum, et iterum aquilonem gyrando revertitur ad orientem, ut suo fulgore tenebras mundi propellat, et quod spatium illi qui in antris et in ergastulis, licet luce careant, sentire per usum possunt; quod fortassis ita intelligi valeret, nisi adderetur vespere et mane. Unde restat ut in [Cod. Z. om. in] vespera intelligatur perfectio praecedentis operis, et mane inchoatio subsequentis. Loquitur enim more nostro Scriptura, ut distinctio operum Dei intelligatur. Porro quod ait, vespere et mane dies unus, potest referii ad angelicam creaturam. Quando enim intuitum avertebat a Deo, et convertebatur ad contuendam creaturam, quodammodo vespere erat; cum vero ad Creatorem convertebatur, ut in ipso clarius intelligeret creaturam, mane erat. Verumtamen si permansisset in consideratione creaturae, non solum vespere, sed etiam nox esset. Dies unus bene additur propter unitatem angelicae dignitatis, quae ita uni Deo contemplando inhaeret, ut nunquam intuitum amoveat a contemplatione.", "olang": "la", "source": "PL 115, col. 118B", "notes": "Angelomus splices as he splices in K7: the schoolroom formula first, then Augustine's angelic reading, then a third answer that is his own. 'One day' is well said because of the unity of angelic dignity — the word 'one' is made a predicate of the angels' undivided attention rather than a number in a series. Note also that he keeps Augustine's guard rail: had the angelic mind stayed with the creature it would have been not evening but night, which is why Scripture never writes night.", "slot": false}, {"id": "remigius-gen-1-5", "short": "remigius-gen-1-5", "author": "Remigius of Auxerre", "tradition": "latin", "date": 900, "datelabel": "c. 900", "place": "Auxerre", "lat": 47.8, "lon": 3.57, "answers": ["evening-moral"], "senses": ["allegorical"], "lemma": {"la": "Per mane initium fidei: per vesperam vero perfectio bonae operationis", "en": "By morning, the beginning of faith; by evening, the perfection of good work"}, "en": "Verse 5. 'There was evening and morning, one day.' By morning is understood the beginning of faith; by evening, the perfection of good work. The morning of this day is drawn out into evening when the beginning of faith is perfected by the completion of good work.", "translator": "claude-draft", "orig": "Vers. 5. Factum est vespere et mane dies unus. Per mane initium fidei: per vesperam vero perfectio bonae operationis intelligitur. Cujus diei mane in vesperam deducitur cum initium fidei completione bonae operationis perficitur.", "olang": "la", "source": "PL 131, col. 56A", "notes": "The shortest witness on the crux and the only one that quietly reverses the verse. Remigius reads morning as the beginning and evening as the perfection, so that his day runs from mane to vesperam — the opposite of the order Genesis prints and of the order every other Latin here defends. He is not arguing for a reckoning; the moral figure simply requires that a thing begin before it is completed, and the text is bent to it. Compare Bereshit Rabbah 3:8, where the same moral pairing (wicked and righteous) is fitted to the verse's own order instead.", "slot": false}, {"id": "bruno-gen-1-5", "short": "bruno-gen-1-5", "author": "Bruno of Segni", "tradition": "latin", "date": 1100, "datelabel": "c. 1100", "place": "Segni", "lat": 41.69, "lon": 13.02, "answers": ["unus-grammatical", "day-precedes-night", "night-for-rest"], "senses": ["literal"], "lemma": {"la": "primus et secundus relativa sunt", "en": "'first' and 'second' are relatives"}, "en": "There follows: 'And there was evening and morning, one day.' Some understand evening and morning as night and day. For since it enumerates all the days in order with the nights passed over, they want both day and night to be understood under the one name of day. But the order of speech is astonishing, in which evening is put before morning, as though he had begun to work not from morning but from evening. For if he had said, 'there was morning and evening, one day,' there would perhaps be no question; but because he put evening between two mornings, it can be doubted which of them it is referred to. For if evening is referred to the preceding morning, the whole night is undoubtedly left out; and if to the following, then the whole day is passed over and only the night's boundaries are set. Hence it was more fitting that there should be 'evening and morning, one day' — but it could have been called one night. But since divine providence created the night not for labour but for rest, there is nothing unfitting if in God's working, which was done not in the night but in the day, only the day's boundaries are set. For if in this place we understand the whole space of day and night, as they wish, to be one day, then God divided the two from each other in vain, and gave the divided things different names; for he called the light Day and the darkness Night. No day, therefore, consists of night and day. Since then it is not the dreams that are seen in the night, but the works that are done in it, that are described here, it was necessary to enumerate days and not nights. […] But as for its being said 'one day was made,' and not 'a first day was made,' this holds good because 'first' and 'second' are relatives, and neither can exist without the other. Since therefore there was not yet a second, it was indeed one day; yet that one could not be called first.", "translator": "claude-draft", "orig": "Sequitur: « Factumque est vespere, et mane dies unus. » Vespere et mane noctem et diem quidam intelligunt. Nam quoniam noctibus praetermissis, omnes per ordinem dies enumerat, uno diei nomine, et diem, et noctem intelligere volunt. Sed mirabilis ordo locutionis, in quo ante mane ponitur vespere, quasi non mane, sed a vespere operari coepisset. Si enim dixisset, Factum est mane et vespere dies unus, nulla fortasse quaestio esset, sed quia inter duo mane vespere posuit, ad quid illorum referatur dubitari potest. Si enim ad praecedens mane vespere refertur, nox procul dubio tota relinquitur; quod si ad subsequens, die quidem tota praetermissa, soli noctis termini ponuntur. Unde convenientius factum est vespere et mane dies unus, sed nox una dici potuit. Sed quia divina providentia non ad laborem, sed ad quietem noctem creavit, nullum est inconveniens, si in Dei operatione, quae utique non in nocte, sed in die fiebat, solius diei termini ponantur. Si enim hoc in loco totum, ut volunt, diei noctisque spatium, unum diem intelligimus, frustra Deus utraque a se divisit, divisisque diversa nomina dedit; vocavit enim lucem diem, ac tenebras noctem. Nulla igitur dies ex nocte constat ac die. Quia igitur non somnia, quae in nocte videntur; sed opera, quae in eo fiunt, hic describuntur, dies utique non noctes enumerare necessarium fuit. Fecit ergo Deus in principio coelum, et terram et lucem; quibus patratis, factum est vespere, atque hoc praecedente mane continuato, factus est dies unus, et tunc quidem a tenebris lucem divisit, quo finito die, factum est vespere. Neque enim in die noctem fecit, sed suo ordine post diem fieri praecepit. Quod autem dictum est, factus est dies unus, et non dicitur, factus est dies primus, ad hoc valet quod primus et secundus relativa sunt, neque sine altero alter esse potest. Cum igitur nondum esset secundus, erat utique dies unus, ipse tamen unus primus dici non poterat.", "olang": "la", "source": "PL 164, col. 149B", "notes": "The best-argued Latin answer on the crux, and the one that most nearly meets Bereshit Rabbah on its own ground. Bruno's is a logician's answer: primus and secundus are relative terms, and a relative cannot stand without its correlate; with no second day yet in existence there was nothing for a 'first' to be first of, so the day could only be called one. He also reaches, independently, the reason Pseudo-Jonathan gives for the night — that providence made it for rest and not for labour — and draws the hard conclusion the others avoid: nulla dies ex nocte constat ac die, no day is made of night and day, because God divided them and named them separately.", "slot": false}, {"id": "rupert-gen-1-5", "short": "rupert-gen-1-5", "author": "Rupert of Deutz", "tradition": "latin", "date": 1114, "datelabel": "c. 1114", "place": "Liège", "lat": 50.63, "lon": 5.57, "answers": ["day-precedes-night", "unus-eternal-day"], "senses": ["literal"], "lemma": {"la": "Quae enim Deus divisit, quomodo conjungi vel unum quid efficere possint?", "en": "For how can things God divided be joined or make one thing?"}, "en": "It is to be noted here first of all that he did not say, 'And there were made darkness and light, one day.' This was well and prudently observed by the sacred writer. For how can the things God divided be joined together, or make some one thing? Now he divided light and darkness, and called the light Day — day, I say, whole and full, without partnership of darkness. […] For, as has been said already, things separated by God's dividing cannot be associated or make some one thing.", "translator": "claude-draft", "orig": "Notandum hic in primis est quod non dixit: Factaeque sunt tenebrae et lux dies unus. Hoc bene et prudenter a scriptore sacro observatum est. Quae enim Deus divisit, quomodo conjungi vel unum quid efficere possint? 9 Divisit autem lucem et tenebras, appellavitque lucem diem, diem, inquam, totum et plenum absque consortio tenebrarum. Bene ergo dictum est: Factae sunt tenebrae et lux dies unus, quia, sicut jam dictum est, quae Deo dividente separata sunt, sociari vel unum quid efficere non possunt.", "olang": "la", "source": "PL 167, col. 217A", "notes": "Rupert's chapter heading is the crux in his own words: 'Why it was not said, there were made darkness and night, a first day, but there was made evening and morning, one day.' His first move is Bruno's conclusion arrived at differently — what God divided cannot be added back together into a single thing, so the 'one day' cannot be day-plus-night. Two columns later (PL 167:217D) he gives his own answer to the ordinal: the truly first day is not this one; and at PL 167:1807A, in the books on the Spirit's works, he states it flatly — the writer knowingly refused to write dies primus, because the day that is first by nature is eternal, and this one is first only by number and by the order of creation. Elided in the English at […]: the sentence the Corpus Corporum text prints as 'Bene ergo dictum est: Factae sunt tenebrae et lux dies unus', which contradicts the sentence it follows and should almost certainly read 'Bene ergo non dictum est'. [CHECK the PL plate before translating it either way.]", "slot": false}, {"id": "abelard-hex-1-5", "short": "abelard-hex-1-5", "author": "Peter Abelard", "tradition": "latin", "date": 1130, "datelabel": "c. 1130", "place": "The Paraclete (Nogent-sur-Seine)", "lat": 48.49, "lon": 3.5, "answers": ["unus-all-time", "evening-is-completion"], "senses": ["spiritual", "literal"], "lemma": {"la": "Diem unum hic vocat totam illorum operum Dei consummationem", "en": "He here calls 'one day' the whole completion of those works of God"}, "en": "'And there was evening and morning, one day.' He here calls 'one day' the whole completion of those works of God — held first in his mind, and afterward completed in the work on the sixth day. And the evening of this whole span of time which he here calls one day, he calls that whole working of God according as it first lay hid in his mind, before it came forth into the light through its effect. And again he names that same working morning, according as, being afterward completed in the work, it showed itself visible. Thus he calls the conception of the divine mind, in the disposing of the work to come, evening; and morning he calls the working out of that conception and the effect of the divine disposition, completed in six days.", "translator": "claude-draft", "orig": "Et factum est vespere et mane dies unus. Diem unum hic vocat totam illorum operum Dei consummationem, prius in mente habitam et in opere postmodum sexta die completam. Vesperam autem hujus totius temporis quod hic unum diem appellat, totam illam operationem Dei vocat, secundum quod prius in ejus mente latebat, antequam per effectum ad lucem prodiret. Ac rursus ipsam eamdem operationem mane nuncupat secundum quod opere postmodum completa sese visibilem praebuit. Divinae itaque mentis conceptum in dispositione futuri operis vesperam dicit, mane vero appellat ipsam conceptus illius operationem et divinae dispositionis effectum in sex diebus consummatum.", "olang": "la", "source": "PL 178, col. 740C", "notes": "Abelard takes the reading Augustine raised and set aside: 'one day' names not the first of the days but the whole of them. His evening is the work as it lay hidden in God's mind, his morning the same work made visible — the pair describing the passage from conception to execution rather than any part of a night. He then allows, fairly, that a reader who prefers to refer the phrase to the first day's work alone may do so, 'nihil impedit'. As in K7 he is the Latin most willing to hold two readings and rank them rather than refute one.", "slot": false}, {"id": "hugh-sacr-1-5", "short": "hugh-sacr-1-5", "author": "Hugh of St Victor", "tradition": "latin", "date": 1134, "datelabel": "c. 1134", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["day-precedes-night", "unus-24-hours"], "senses": ["literal"], "lemma": {"la": "omnis aurora praecedentis diei est", "en": "every dawn belongs to the preceding day"}, "en": "And therefore, because the first day had no dawn preceding it — since before the light was created there was full darkness, and as soon as the light appeared over the earth there was full day, and because God's work ought to have begun from what is perfect — therefore Scripture said: 'There was made evening and morning, one day.' For it did not say, 'There was made morning and evening,' but 'There was made,' it says, 'evening and morning, one day.' Because, as we have said, the first day had no morning preceding it, since it took its beginning from full and perfect light; and therefore every dawn belongs to the preceding day, and every day takes its beginning from sunrise. And the natural day is that space of time which, passing from sunrise to sunrise, encloses within itself both night and day; in which — since day naturally precedes night — we call the end of the day evening and the end of the night dawn; and it stands beyond doubt that dawn is always to be referred to the preceding day.", "translator": "claude-draft", "orig": "Et propterea quia primus dies auroram praecedentem non habuit, quoniam antequam lux crearetur plenae tenebrae fuerunt, mox autem luce apparente super terram plenus dies, propterea quod a perfecto opus Dei inchoari debuisset, ideo dixisse Scripturam: Factum est vespere et mane dies unus (Gen. I) . Non enim dixit Factum est mane et vespere; sed: Factum est, inquit, vespere et mane dies unus. Quia, sicut diximus, primus dies mane praecedens non habuit, quoniam a luce plena atque perfecta initium sumpsit; propterea omnis aurora praecedentis diei est, et omnis dies ab ortu solis initium sumit. Estque dies naturalis illud spatium temporis quod ab ortu solis usque ad ortum pertransiens noctem in se diemque concludit; in qua (quoniam naturaliter dies noctem praecedit) et finem diei vesperam dicimus, finem noctis auroram, constat indubitanter quod aurora semper ad praecedentem diem referenda sit.", "olang": "la", "source": "PL 176, col. 194B", "notes": "The computist's answer, stated with the technical vocabulary the schools had by then settled: the dies naturalis runs sunrise to sunrise and holds a night and a day inside it; evening is the end of the day and dawn the end of the night; therefore a dawn always belongs to the day before it. The reason evening is named first is not doctrinal at all but a fact about the first day: it had no dawn to be named, because it began in full light. Hugh's Adnotationes on Genesis (PL 175:35A) argue the same in brief and add a proof from the equinox.", "slot": false}, {"id": "honorius-hex-1-5", "short": "honorius-hex-1-5", "author": "Honorius Augustodunensis", "tradition": "latin", "date": 1140, "datelabel": "c. 1140", "place": "Regensburg", "lat": 49.02, "lon": 12.1, "answers": ["unus-24-hours", "unus-repeated"], "senses": ["literal", "allegorical"], "lemma": {"la": "non primus, sed unus dies dicitur, quia idem semper repetitur", "en": "it is called not first but one day, because the same day is always repeated"}, "en": "'And there was evening and morning, one day.' Evening is the end of the day; morning, however, is the end of the night: which two joined together make twenty-four hours and complete one day. And it is called not first but one day, because the same day is always repeated, as it is written: 'By your ordinance the day continues' (Ps 119:91). During that first three days the night remained wholly dark, because neither moon nor stars lit it. It is to be noted, moreover, that the day begins from light and ends in light: because all the works of God are begun from Christ, who is the true light, and in him all are completed.", "translator": "claude-draft", "orig": "Factumque est vespere et mane, dies unus. Vespere est finis diei; mane autem finis noctis: quae duo juncta, viginti quatuor horae fiunt, et unum diem conficiunt. Ideo autem non primus, sed unus dies dicitur, quia idem semper repetitur; ut scribitur: Ordinatione tua perseverat dies (Psal. CXVIII, 91) . Illo primo triduo nox prorsus tenebrosa manebat; quia eam nec luna, nec sidera illuminabant. Notandum autem, quod dies a luce inchoatur et in luce terminatur: quia omnia opera Dei a Christo, qui est lux vera, inchoantur, et in eodem cuncta consummantur.", "olang": "la", "source": "PL 172, col. 255D", "notes": "By 1140 Augustine's angelic repetition has become a one-clause gloss with a proof text — 'not first but one, because the same day is always repeated' — sitting inside a paragraph of plain computistical arithmetic. The two answers that stand furthest apart in the tradition are here made to agree in a sentence apiece, which is what the twelfth-century handbook does with a contested question. Honorius returns to the verse later in the same work (PL 172:261D) with a wholly different answer: not first but one, because the angelic nature which is called day begins from the eternal day and has no end. [CHECK the work division at PL 172:261 before treating that as a second witness.]", "slot": false}, {"id": "comestor-hs-1-5", "short": "comestor-hs-1-5", "author": "Peter Comestor", "tradition": "latin", "date": 1170, "datelabel": "c. 1170", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["unus-24-hours", "day-precedes-night"], "senses": ["literal"], "lemma": {"la": "completus est dies unus naturalis", "en": "one natural day was completed"}, "en": "'And there was evening, and after that there was morning.' And so one natural day was completed. For first, with heaven and earth, light was created; and as it set little by little, there was made the evening of the first usual day; and as the same light passed under the earth and came to the rising, there was made morning — that is, the night was ended and the second day began. And so, with the light of the day preceding and the night following being ended, one day came to be.", "translator": "claude-draft", "orig": "Et factum est vespere, et post factum est mane. Et sic completus est dies unus naturalis. Primo enim cum coelo et terra lux est creata: qua paulatim occidente, factum est vespere primae diei usualis, et eadem migrante sub terras et ad ortum veniente, factum est mane, id est terminata est nox, et inchoavit dies secunda. Itaque praecedente luce diei, et sequente nocte terminata, exstitit dies unus.", "olang": "la", "source": "PL 198, col. 1057D", "notes": "The textbook settles it: dies unus naturalis, light first and night following, on Bede's travelling light. Nothing of Augustine's day survives in the sentence, and the question 'why not first?' is not raised at all — it has been answered so often that the schools' handbook no longer needs to ask. Comestor does keep one older reading a few lines earlier: the division of light from darkness is also the division of the angels, the standing ones light and the fallen ones darkness.", "slot": false}, {"id": "glossa-1-5", "short": "glossa-1-5", "author": "Glossa ordinaria (school of Laon)", "tradition": "latin", "date": 1120, "datelabel": "compilation 1110–1130", "place": "Laon", "lat": 49.56, "lon": 3.62, "answers": ["evening-moral", "evening-is-self-knowledge", "unus-repeated"], "senses": ["allegorical", "spiritual"], "lemma": {"la": "non nox, sed vespera facta memoratur", "en": "not night, but evening is recorded as made"}, "en": "Verse 5. […] 'And there was evening,' etc. (GREGORY, Moralia VIII.6.) By no means in this life is sin so forsaken through the exercise of justice that one may remain in it unshaken: for if rectitude drives out the fault, the fault sits at the doors of our thought and knocks to be let in. Whence Moses says: 'Light was made'; and a little after: 'Evening was made.' For the Creator, foreknowing human guilt, then set forth in time what is now enacted in the mind. For the shadow of temptation follows the light of rectitude. But because the light of the elect is not put out by temptation, it is recorded that not night but evening was made: for temptation hides the light of justice, it does not destroy it. (AUGUSTINE, on Genesis to the letter, book IV, ch. 22, 23, vol. III, col. 311, 312.) Note that the other creatures, etc., down to: that the one may belong to the day, and this to the evening.", "translator": "claude-draft", "orig": "VERS. 5.--. . . . « Factumque est vespere, » etc. (GREG., l. VIII Moral., c. 6, tom. I.) Nequaquam in hac vita per exercitationem justitiae peccatum deseritur, ut in ipsa inconcusse maneatur: quia si culpam rectitudo eliminat, cogitationis nostrae foribus assidens, ut sibi aperiatur, pulsat. Unde ait Moyses: « Facta est lux; » et paulo post: « Factum est vespere. » Creator enim, humanae culpae praescius, tunc expressit in tempore quod nunc versatur in mente. Lumen namque rectitudinis sequitur umbra tentationis. Sed quia electorum lux tentatione non exstinguitur, non nox, sed vespera facta memoratur, quia tentatio lumen justitiae abscondit, non interimit. (AUG., de Gen. ad litt., l. IV, c. 22, 23, tom. III, col. 311, 312.) Notandum, quod caeterae creaturae, etc., usque ad ut illud scilicet ad diem pertineat, hoc ad vesperam.", "olang": "la", "source": "PL 113, col. 71D", "notes": "Two glosses only, and between them they carry both Latin answers onto the verse. Gregory the Great supplies the moral one, and he does it by seizing exactly the fact Augustine had seized in City of God XI.7 — that Scripture writes evening and never night — and reading it as consolation: temptation dims the light of justice, it does not extinguish it. Then Augustine's angelic reading is not quoted but cited, by book, chapter and Migne column, and abbreviated in the Glossa's usual way ('etc., usque ad'). A twelfth-century reader of the margin was told where to go and expected to have the book. The English here is a fresh draft; Wilson's edition of the Glossa (migne.app/glossa) supersedes it when it reaches 1:5.", "slot": false}, {"id": "bonaventure-sent-2-12-1-2", "short": "bonaventure-sent-2-12-1-2", "author": "Bonaventure", "tradition": "latin", "date": 1252, "datelabel": "1250–1252", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["simul", "six-days-literal"], "senses": ["literal", "spiritual"], "lemma": {"la": "illi dies non fuerunt dies materiales, sed potius spirituales", "en": "those days were not material days but rather spiritual ones"}, "en": "For some Saints in this question followed more the theological way, drawing reasoning toward those things which are of the faith. Opinion of Augustine. But others, among whom the principal was Augustine, followed more the philosophical way, which lays down those things which seem more consonant with reason: hence he also drew the meaning of Scripture toward the confirmation and attestation of reason. Therefore, since it seems more reasonable that all things be produced at once by the supreme power, and that an intervening delay of time would seem to be of no utility or necessity, he held that all things were produced at once, confirming his position through the authorities of sacred Scripture, and explaining that which seems to him to contradict it — namely, the distinction of days — by showing that those days were not material days but rather spiritual [days], which could all be at once. — And this position was very reasonable and very subtle.\n\nNot pleasing to all. Nevertheless, because the meaning of Scripture seems to be twisted by this position, and it is safer and more meritorious to submit our understanding and reason wholly to Scripture rather than in any way to twist it: therefore commonly the other doctors, both those who preceded Augustine and those who came after, understood and held [the matter] as the text and letter of sacred Scripture of Genesis seems to sound. Hence they held that all corporeal things were created at once Conclusion. in matter, but not at once — rather, through a senary of days — were distinguished in form.", "translator": "wilson-pruitt", "orig": "Quidam enim Sancti in hac quaestione magis secuti sunt viam theologicam, trahentes rationem ad ea quae sunt fidei. Opinio Augustini. Quidam vero, inter quos praecipuus fuit Augustinus, magis secuti sunt viam philosophicam, quae illa ponit, quae magis videntur rationi consona: unde et intellectum Scripturae traxit ad rationis confirmationem et attestationem. Unde cum videatur rationabilius, a summa potentia omnia produci simul, et mora temporis interiacentis nullius videatur esse utilitatis vel necessitatis; posuit, omnia simul esse producta, suam positionem confirmans per auctoritates sacrae Scripturae, et exponens illud quod videtur sibi contraire, videlicet de dierum distinctione, ostendens, quod illi dies non fuerunt dies materiales, sed potius spirituales, qui omnes simul potuerunt esse. — Et haec positio multum fuit rationabilis et valde subtilis.\n\nNon omnibus placet. Verumtamen, quia ad hanc positionem videtur intellectus Scripturae distrahi, et securius est et magis meritorium, intellectum nostrum et rationem omnino Scripturae supponere, quam ipsam aliquo modo distrahere: ideo communiter alii doctores, et qui praecesserunt Augustinum, et qui secuti sunt, sic intellexerunt et posuerunt, sicut textus et littera sacrae Scripturae Genesis sonare videtur. Unde posuerunt, omnia corporalia Conclusio. simul esse creata in materia, sed non simul, sed per senarium dierum, esse distincta in forma.", "olang": "la", "source": "In II Sent., d. XII, a. 1, q. 2 (Quaracchi 1885, II.296–297)", "notes": "The moment the Latin tradition decides. Bonaventure sets out Augustine's position fairly and generously — the philosophical way, holding that all things were produced at once and that the days of Genesis were spiritual and could all be simultaneous — and calls it 'very reasonable and very subtle.' Then he declines it, on a ground that is not exegetical but moral: it is safer and more meritorious to submit our reason to Scripture than to twist Scripture to our reason. The common doctors, before Augustine and after, held that all bodies were created at once in matter but distinguished in form through the six days. Augustine's day, the one day repeated, does not survive this paragraph as the school's reading of Genesis 1.", "slot": false}], "threads": [{"id": "t-k10-01", "from": "vulgate-1-5", "to": "lxx-1-5", "type": "transmits", "evidence": "Jerome's 'dies unus' renders the LXX's cardinal ἡμέρα μία, not an ordinal; the whole Latin quarrel over unus and primus rests on a word the Greek had already kept from the Hebrew.", "crux": "one-day-evening-first"}, {"id": "t-k10-02", "from": "targ-psj-1-5", "to": "lxx-1-5", "type": "parallel", "evidence": "Aramaic 'yoma chad' and Greek ἡμέρα μία make the same decision independently: keep the cardinal, though every following day in the chapter is an ordinal. Onkelos does the same.", "crux": "one-day-evening-first"}, {"id": "t-k10-03", "from": "rashi-1-5", "to": "br-3-8", "type": "cites", "evidence": "Rashi names his source — 'thus it is explained in Bereshit Rabbah' — and reproduces R. Yudan's answer, that God was alone (yachid) in his world, adding the datum that fixes it: the angels were not created until the second day.", "crux": "one-day-evening-first"}, {"id": "t-k10-04", "from": "br-3-9", "to": "br-3-8", "type": "parallel", "evidence": "Two consecutive sections of one compilation asking the same thing from opposite ends: 3:8 asks what 'one day' is a name for, 3:9 asks why the series is 'one, second, third' at all. The second states the grammar as an unresolved difficulty.", "crux": "one-day-evening-first"}, {"id": "t-k10-05", "from": "b-chull-83a", "to": "br-3-8", "type": "parallel", "evidence": "Both fix a meaning on the words yom echad and neither cites the other: the midrash makes it the day God was alone, the Talmud makes it the rule that reckoning follows the night. The halakhic use is the one that governs practice.", "crux": "one-day-evening-first"}, {"id": "t-k10-06", "from": "b-chag-12a", "to": "br-3-8", "type": "parallel", "evidence": "Both list what was made on day one and both must decide whether anything besides God was there. Chagigah counts ten things and includes the measures of day and night from our verse; Bereshit Rabbah rules that nothing at all was created on the first day, so that no partner in creation can be alleged.", "crux": "one-day-evening-first"}, {"id": "t-k10-07", "from": "ambrose-hex-1-10", "to": "lxx-1-5", "type": "echoes", "evidence": "Ambrose reads a Latin text that keeps the Greek cardinal and builds his chapter on it: 'Praeclare etiam unum non primum diem dixit.' Without ἡμέρα μία behind the Latin there is no question to ask.", "crux": "one-day-evening-first"}, {"id": "t-k10-08", "from": "ambrose-hex-1-10", "to": "rashi-1-5", "type": "parallel", "evidence": "The same question in two languages seven hundred years apart: he could have said 'first,' with a second and third to follow, and that seemed the order — so why 'one'? Ambrose answers from the twenty-four-hour circuit, Rashi from God's solitude. No contact is possible in either direction.", "crux": "one-day-evening-first"}, {"id": "t-k10-09", "from": "bruno-gen-1-5", "to": "br-3-9", "type": "parallel", "evidence": "Bereshit Rabbah objects that 'one, second, third' is not a proper series; Bruno answers precisely that objection with the logic of relatives — first and second are correlative terms, and with no second yet in being nothing could be called first. The best-matched pair on the crux, and there is no channel between them.", "crux": "one-day-evening-first"}, {"id": "t-k10-10", "from": "aug-gnm-1-10", "to": "b-chull-83a", "type": "contests", "evidence": "Augustine: the day does not begin at evening, and 'reliqui dies computantur a m
