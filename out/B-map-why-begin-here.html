<script>
const D = {"crux": {"id": "why-begin-here", "question": {"en": "Why does Scripture open with creation at all?", "la": "Cur a creatione incipit Scriptura?", "he": "לָמָּה פָּתַח בִּבְרֵאשִׁית?"}, "summary": "The crux where each tradition's reason for having a commentary is exposed.", "finding": "This is the crux where each tradition's reason for having a commentary is exposed, and the two reasons turn out to be the same shape and opposite in content. Rashi opens the most-read Jewish commentary on the Torah with an objection to the book: R. Isaac said the Torah, which is Israel's law book, ought to have begun at 'this month shall be to you the first of the months', the first commandment given to Israel — and it begins with the creation only so that when the nations call Israel robbers, Israel may answer that the earth is the Lord's and he gave it to whom he pleased. Hugh of St Victor, in Paris within fifty years of Troyes, opens his own summa with the same verdict in scholastic terms: the matter of all divine Scripture is the works of restoration, and the works of foundation — the creation of the world with all its elements — are the matter of secular writings. Both have ruled that Genesis 1 is not what its book is for; both then supply a reason from outside the chapter, and the reasons have nothing to do with each other. Hugh needs a whole further chapter to explain how Scripture descends through the works of foundation on its way to the Incarnation, and Comestor a generation later repairs the difficulty with a builder's metaphor — history is the foundation, allegory the wall leaning on it, tropology the roof — so that starting here is the first course of masonry rather than a detour.\n\nWhat the Latin bench never does is ask whether the chapter should be expounded at all, and what the rabbinic bench never stops doing is asking exactly that. The Mishnah rules that the work of creation may not be expounded before two, and that whoever looks at four things — what is above, what is below, what is before, what is after — it were fitting for him that he had not come into the world. Bereshit Rabbah puts the same four questions into the shape of the first letter of the first word: the bet is closed on three sides and open at the front, so you have permission to ask only from the day the world was created and onward. And five sections earlier the same commentary curses the people doing what it is doing — may they be silenced, those lying lips — 'with arrogance', is it in order to boast, I am expounding the work of creation? A commentary that makes the case against itself twice in its first chapter has no counterpart on the Latin side at all.\n\nThe reason it has none is visible in Augustine, and it is not that the Latin bench is less reverent. In the first chapter of De Genesi contra Manichaeos he explains why the book exists and why it is written the way it is: the Manichees pursue the learned and the unlearned alike, so they must be refuted 'not with ornate and polished speech but with plain facts' — educated friends had read his earlier books and warned him kindly that ordinary readers could not follow them. And in the next chapter the Manichees put their question: in what beginning, and what was God doing before he made heaven and earth? That is the Mishnah's 'what is before', asked by an opponent instead of a student. On one bench the question is put by someone who must be stopped, and the tradition builds a fence; on the other it is put by someone who must be answered, and the answer becomes the commentary. Ambrose settles the matter from the other end — Moses spoke not in the persuasion of human wisdom but as a witness, testis, of the divine work, and the world is a specimen of the divine working, because while the work is seen the worker is put forward, as a building shows its craftsman when the craftsman is silent. Beginning here is, for the Latin bench, the most natural thing a book about God could do. For R. Isaac it is the one thing that has to be explained away."}, "witnesses": [{"id": "rashi-1-1", "short": "rashi-1-1", "author": "Rashi", "tradition": "rabbinic", "date": 1090, "datelabel": "1075–1105", "place": "Troyes", "lat": 48.3, "lon": 4.08, "answers": ["should-have-begun-at-exodus", "claim-on-the-land"], "senses": ["literal"], "lemma": {"he": "בְּרֵאשִׁית", "en": "In the beginning"}, "en": "בראשית IN THE BEGINNING — Rabbi Isaac said: The Torah which is the Law book of Israel should have commenced with the verse (Exodus 12:2) “This month shall be unto you the first of the months” which is the first commandment given to Israel. What is the reason, then, that it commences with the account of the Creation? Because of the thought expressed in the text (Psalms 111:6) “He declared to His people the strength of His works (i.e. He gave an account of the work of Creation), in order that He might give them the heritage of the nations.” For should the peoples of the world say to Israel, “You are robbers, because you took by force the lands of the seven nations of Canaan”, Israel may reply to them, “All the earth belongs to the Holy One, blessed be He; He created it and gave it to whom He pleased. When He willed He gave it to them, and when He willed He took it from them and gave it to us” (Yalkut Shimoni on Torah 187)", "translator": "Rosenbaum–Silbermann 1929–34", "orig": "אָמַר רַבִּי יִצְחָק לֹֹֹֹֹא הָיָה צָרִיךְ לְהַתְחִיל אֶת הַתּוֹרָה אֶלָּא מֵהַחֹדֶשׁ הַזֶּה לָכֶם, שֶׁהִיא מִצְוָה רִאשׁוֹנָה שֶׁנִּצְטַוּוּ בָּהּ יִשׂרָאֵל, וּמַה טַּעַם פָּתַח בִּבְרֵאשִׁית? מִשׁוּם כֹּחַ מַעֲשָׂיו הִגִּיד לְעַמּוֹ לָתֵת לָהֶם נַחֲלַת גּוֹיִם (תהילים קי\"א), שֶׁאִם יֹאמְרוּ אֻמּוֹת הָעוֹלָם לְיִשְׁרָאֵל לִסְטִים אַתֶּם, שֶׁכְּבַשְׁתֶּם אַרְצוֹת שִׁבְעָה גוֹיִם, הֵם אוֹמְרִים לָהֶם כָּל הָאָרֶץ שֶׁל הַקָּבָּ\"ה הִיא, הוּא בְרָאָהּ וּנְתָנָהּ לַאֲשֶׁר יָשַׁר בְּעֵינָיו, בִּרְצוֹנוֹ נְתָנָהּ לָהֶם, וּבִרְצוֹנוֹ נְטָלָהּ מֵהֶם וּנְתָנָהּ לָנו", "olang": "he", "source": "Rashi on Gen 1:1, s.v. בראשית", "notes": "The most famous opening sentence in the history of Jewish Bible commentary, and it is an objection to the book it is opening. R. Isaac said: the Torah, which is Israel's law book, ought to have begun at 'this month shall be to you the first of the months' (Exod 12:2), the first commandment given to Israel. Why then does it begin with the creation? Because of Ps 111:6, 'he declared to his people the power of his works, in order to give them the inheritance of the nations' — so that when the peoples of the world say to Israel, you are robbers, for you seized the lands of the seven nations, Israel may answer: the whole earth belongs to the Holy One, blessed be He; he made it and gave it to whom he pleased, and when he willed he took it from them and gave it to us. The chapter, on this account, is not there for its own sake at all. It is title to land, and Rashi puts it at the head of a commentary that will be read for nine hundred years.", "slot": false}, {"id": "br-1-2", "short": "br-1-2", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["claim-on-the-land"], "senses": ["literal"], "lemma": {"he": "כֹּחַ מַעֲשָׂיו הִגִּיד לְעַמּוֹ", "en": "the power of his deeds he told to his people"}, "en": "Rabbi Yehoshua of Sikhnin began in the name of Rabbi Levi: “The power of His deeds He told to His people, to give them the inheritance of nations” (Psalms 111:6). What is the reason that the Holy One blessed be He revealed what was created on the first day and what was created on the second day? It is due to the idolaters, so they could not rebuke Israel and say to them: ‘You are a nation of robbers.’ Israel responds to them and says to them: ‘And you, is it [your own land] not in your hands by robbery? Is it not so that: “Kaftorim, who emerged from Kaftor, destroyed them [the Avites], and settled in their place”? (Deuteronomy 2:23). The world and all its contents belong to the Holy One blessed be He. When He wished He gave it to you, and when He wished He took it from you and gave it to us.’ That is what is written: “[The power of His deeds He told to His people,] to give them the inheritance of nations…” – He told them [the history of] all the generations.", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "רבי יהושע דסכנין בשם רבי לוי פתח (תהלים קיא, ו): \"כֹּחַ מַעֲשָׂיו הִגִּיד לְעַמּוֹ וְגוֹ'\" מה טעם גילה הקב\"ה לישראל מה שנברא ביום הראשון ומה שנברא ביום השני מפני עובדי כוכבים ומזלות שלא יהיו מונין את ישראל ואומרין להם הלא אומה של בזויים אתם וישראל משיבין אותן ואומרין להם ואתם הלא בזויה היא בידכם הלא כפתורים היוצאים מכפתור השמידום וישבו תחתם העולם ומלואו של הקדוש ברוך הוא כשרצה נתנה לכם וכשרצה נטלה מכם ונתנה לנו הה\"ד \"לָתֵת לָהֶם נַחֲלַת גּוֹיִם וְגוֹ'\" הגיד להם את כל הדורות:", "olang": "he", "source": "Bereshit Rabbah 1:2 (Vilna numbering)", "notes": "Rashi's answer four hundred years before Rashi, and with the objection left out. R. Yehoshua of Sikhnin in the name of R. Levi opens on Ps 111:6 and asks the question directly: what is the reason that the Holy One revealed what was created on the first day and what on the second? Because of the idolaters, so that they should not be able to rebuke Israel and say, you are a nation of robbers. And Israel answers — is your own land not in your hands by robbery? did not the Kaftorim destroy the Avvim and settle in their place (Deut 2:23)? The world and all in it belongs to the Holy One; when he wished he gave it to you, and when he wished he took it from you and gave it to us. Every element of Rashi's comment is here except R. Isaac's opening move, that the book should have started at Exod 12:2 — which is the part that makes it a question about the shape of Scripture rather than about a controversy over land.", "slot": false}, {"id": "br-1-5a", "short": "br-1-5a", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["do-not-expound-it", "honour-of-the-maker"], "senses": ["literal"], "lemma": {"he": "תֵּאָלַמְנָה שִׂפְתֵי שָׁקֶר", "en": "may they be silenced, those lying lips"}, "en": "Rav Huna began in the name of bar Kapara: “May they be silenced [te’alamna], those lying lips [that speak harsh words against the righteous one with arrogance and contempt]” (Psalms 31:19) – may they be bound up, may they become mute, may they be silenced. May they become mute – as it says: “Who gives a mouth to a person, or who renders one mute [ilem] or deaf, or sighted or blind? Is it not I, the Lord?” (Exodus 4:11). And [may they be bound up,] as it says: “Behold, we were binding [me’alemim] sheaves in the field and behold, my sheaf arose” (Genesis 37:7). May they be silenced – that is its plain sense. “That speak…against the Righteous One” (Psalms 31:19) – [this refers to] Him of eternal life. “Harsh words [atak]” (Psalms 31:19) – matters that He concealed [shehe’etik] from His creations. “With arrogance” (Psalms 31:19) – this is an expression of bewilderment: [Do they do this] in order to boast arrogantly: I am expounding the act of Creation? “And contempt” (Psalms 31:19) – this [too] is an expression of bewilderment: Is it in order to show contempt for My honor? As Rabbi Yosei bar Ḥanina said: Anyone who attains honor through the degradation of another person has no portion in the World to Come; how much more so is this so regarding the honor of the Omnipresent. What is written following this? “How great is the goodness You have in store for those who fear You” (Psalms 31:20) – for those who fear You, but not for those who demean the [awesome] fear of You. They will not be included in: “How great is the goodness.”", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "ר' הונא בשם בר קפרא פתח (תהלים לא, יט): \"תאלמנה שפתי שקר וגו'\" אתפרכן אתחרשן אשתתקן. \"אתפרכן אתחרשן\" - היך מה דאת אמר (שמות ד, יא): \"או מי ישום אלם או חרש או פקח או עור הלא אנכי ה'\" ואומר (בראשית לז, ז): \"והנה אנחנו מאלמים אלומים בתוך השדה והנה קמה אלומתי\" \"אשתתקן\" - כמשמעו. \"הַדֹּבְרוֹת עַל צַדִּיק\" חי העולמים \"עָתָק\" שהעתיק בבריותיו בגאוה אתמהה בשביל להתגאות ולומר אני דורש במעשה בראשית \"וָבוּז\" אתמהה מבזה על כבודי דא\"ר יוסי בר חנינא כל המתכבד בקלון חבירו אין לו חלק לעולם הבא בכבודו של מקום על אחת כמה וכמה ומה כתיב אחריו (כ): \"מָה רַב טוּבְך", "olang": "he", "source": "Bereshit Rabbah 1:5, first half (Vilna numbering)", "notes": "A curse on the expositors, at the head of the commentary that expounds it. Rav Huna in the name of Bar Kappara takes Ps 31:19, 'may they be silenced, those lying lips that speak against the righteous one with arrogance and contempt', and reads every word of it against people doing what Bereshit Rabbah is doing: may they be bound, may they be made mute, may they be silenced; 'against the Righteous One' means him of eternal life; 'harsh words' means matters he concealed from his creatures; 'with arrogance' — is it in order to boast, I am expounding the work of creation? 'and contempt' — is it in order to show contempt for my honour? And R. Yose bar Ḥanina's rule follows: anyone who attains honour through another's degradation has no portion in the world to come, and how much more so where the honour is the Omnipresent's. The section that says this is section five of a commentary that runs to a hundred sections on this book. **Slice note**: K4 built the palace parable that follows as `br-1-5b`; this is the half before it.", "slot": false}, {"id": "br-1-10", "short": "br-1-10", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["do-not-expound-it", "the-bet-is-closed", "beginning-is-blessing"], "senses": ["literal", "spiritual"], "lemma": {"he": "לָמָּה נִבְרָא הָעוֹלָם בְּבֵי\"ת", "en": "why was the world created with a bet?"}, "en": "Rabbi Yona said in the name of Rabbi Levi: Why was the world created with the letter beit? It is because just as the beit is closed on all [three of] its sides but open in its front, so, you do not have permission to ask: What is below, what is above, what was before, and what is after, but only from the day when the world created and onward. Bar Kapara said: “For ask now of the early days that were before you, from the day [that God created man upon the earth]” (Deuteronomy 4:32) – from the day they were created, you may inquire, but you may not inquire what was before that. “From one end of the heavens to the other end” (Deuteronomy 4:32), you may inquire and investigate, but what is beyond that you may not investigate. Rabbi Shimon ben Pazi expounded regarding the act of Creation together with bar Kapara: Why was the world created with the letter beit? It is to inform you that there are two worlds, this world and the World to Come. Another matter, why with a beit? Because it alludes to an expression of blessing [berakha]. And why not with an alef? Because it alludes to an expression of curse [arira]. Another matter, why not with an alef? It is to avoid giving recourse to the heretics to say: How can the world endure, as it was created with an expression of curse? Rather, the Holy One blessed be He said: ‘Behold, I will create it with an expression of blessing, and there is hope that perhaps it will endure.’ Another matter, why with a beit? It is because just as the beit has two protrusions, one above it and one below and behind it, if one says to the beit: ‘Who created you?’ It points with its upper protrusion, saying: ‘That One who is above created me.’ ‘And what is His name?’ It points with its rear protrusion and says: ‘The Lord [Adonai] is His name.’ Rabbi Elazar bar Ḥanina said in the name of Rabbi Aḥa: For twenty-six generations the alef complained before the throne of the Holy One blessed be He. It said before Him: ‘Master of the universe, I am the first of the letters, but You did not create Your world with me.’ The Holy One blessed be He said to it: ‘The world and all its contents were created only for the sake of the Torah, as it is stated: “The Lord founded the earth with wisdom…” (Proverbs 3:19). Tomorrow, I will be coming to give the Torah at Sinai, and I will open it at its beginning only with you, as it is stated: “I [anokhi] am the Lord your God”’ (Exodus 20:2). Rabbi Hoshaya says: Why is it called alef? It is because He consented concerning a thousand, as it is stated: “The word that He commanded for one thousand [elef] generations” (Psalms 105:8).", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "רבי יונה בשם ר' לוי אמר למה נברא העולם בב' אלא מה ב' זה סתום מכל צדדיו ופתוח מלפניו כך אין לך רשות לומר מה למטה מה למעלה מה לפנים מה לאחור אלא מיום שנברא העולם ולהבא. בר קפרא אמר (דברים ד, לב): \"כִּי שְׁאַל נָא לְיָמִים רִאשׁוֹנִים אֲשֶׁר הָיוּ לְפָנֶיךָ [לְמִן הַיוֹם אֲשֶׁר בָּרָא אֱלֹהִים]\" למן היום שנבראו אתה דורש ואי אתה דורש לפנים מכאן (שם) אתה דורש וחוקר ואי אתה חוקר לפנים מכאן. דרש רבי יהודה בן פזי במעשה בראשית בהדיה דבר קפרא למה נברא העולם בב' להודיעך שהן שני עולמים העוה\"ז והעוה\"ב. ד\"א ולמה בב' שהוא לשון ברכה ולמה לא באל\"ף שהוא לשון ארירה. ד\"א למה לא באל\"ף שלא ליתן פתחון פה לאפיקורסין לומר היאך העולם יכול לעמוד שהוא נברא בלשון ארירה אלא אמר הקדוש ברוך הוא הרי אני בורא אותו בלשון ברכה והלואי יעמוד .ד\"א למה בב' אלא מה ב' זה יש לו שני עוקצין אחד מלמעלה ואחד מלמטה מאחוריו אומרים לב' מי בראך והוא מראה בעוקצו מלמעלה ואמר זה שלמעלה בראני ומה שמו והוא מראה להן בעוקצו של אחריו ואומר ה' שמו. א\"ר אלעזר בר חנינא בשם ר' אחא עשרים וששה דורות היתה האל\"ף קורא תגר לפני כסאו של הקדוש ברוך הוא אמרה לפניו רבש\"ע אני ראשון של אותיות ולא בראת עולמך בי אמר לה הקב\"ה העולם ומלואו לא נברא אלא בזכות התורה שנאמר (משלי ג, יט): \"ה' בחכמה יסד ארץ וגו'\" למחר אני בא ליתן תורה בסיני ואיני פותח תחלה אלא בך שנאמר (שמות כ, ב): \"אנכי ה' אלהיך\" רבי הושעיא אומר למה נקרא שמו אל\"ף שהוא מסכים מאֶלֶף שנאמר (תהלים קה, ח): \"דבר צוה לאלף דור\":.", "olang": "he", "source": "Bereshit Rabbah 1:10 (Vilna numbering)", "notes": "The ban on the four questions derived from the shape of the first letter of the verse, which is as close to the crux as a comment can get. R. Yona in the name of R. Levi: why was the world created with a bet? Because just as the bet is closed on its three sides and open at the front, so you have no permission to ask what is below, what is above, what was before and what is after — but only from the day the world was created and onward. Bar Kappara gets the same fence out of Deut 4:32: from the day they were created you may enquire, but not before that; from one end of the heavens to the other you may investigate, but not beyond. The rest of the section is a sequence of further answers — two worlds, this and the world to come; bet for berakhah rather than alef for arirah, so that the heretics should not be able to say the world was made with a curse — and each of them is a reason for the letter that is also a reason for where the book starts. This is m. Chagigah 2:1's four forbidden matters, made into an exegesis of a single consonant.", "slot": false}, {"id": "m-chag-2-1", "short": "m-chag-2-1", "author": "the Mishnah", "tradition": "rabbinic", "date": 210, "datelabel": "redaction 200–220", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["do-not-expound-it", "honour-of-the-maker"], "senses": ["literal"], "lemma": {"he": "וְלֹא בְמַעֲשֵׂה בְרֵאשִׁית בִּשְׁנַיִם", "en": "nor the work of creation before two"}, "en": "One does not expound the forbidden sexual relations before three, nor the work of creation before two, nor the Chariot before one — unless he was wise and understood of his own knowledge. Whoever looks at four things, it were fitting for him that he had not come into the world: what is above, what is below, what is before, and what is after. And whoever has no care for the honour of his Maker, it were fitting for him that he had not come into the world.", "translator": "claude-draft-approved", "orig": "אֵין דּוֹרְשִׁין בַּעֲרָיוֹת בִּשְׁלֹשָׁה. וְלֹא בְמַעֲשֵׂה בְרֵאשִׁית בִּשְׁנַיִם. וְלֹא בַמֶּרְכָּבָה בְּיָחִיד, אֶלָּא אִם כֵּן הָיָה חָכָם וּמֵבִין מִדַּעְתּוֹ. כָּל הַמִּסְתַּכֵּל בְּאַרְבָּעָה דְּבָרִים, רָאוּי לוֹ כְּאִלּוּ לֹא בָּא לָעוֹלָם, מַה לְּמַעְלָה, מַה לְּמַטָּה, מַה לְּפָנִים, וּמַה לְּאָחוֹר. וְכָל שֶׁלֹּא חָס עַל כְּבוֹד קוֹנוֹ, רָאוּי לוֹ שֶׁלֹּא בָּא לָעוֹלָם:", "olang": "he", "source": "m. Chagigah 2:1", "notes": "The rule the whole rabbinic bench on this site is working under, and it is not a comment on Gen 1:1 but a restriction on commenting. The work of creation may not be expounded before two, and the Chariot not before one, unless he is wise and understands of his own knowledge — a rule about audience size, so that what is said cannot become public teaching. Then the four things: what is above, what is below, what is before, what is after; and whoever looks at them, it were fitting he had not come into the world. Those four are what Bereshit Rabbah 1:10 reads out of the closed sides of the letter bet, and they are, item for item, the questions the Manichees put to Augustine and that he answers at length in the first chapters of De Genesi contra Manichaeos. ⚠ **Anchor note**: this is a witness by PLAN.md §5's specification for K2, not by the general anchor rule; see the file docstring. The Sefaria English here is the William Davidson Edition, which is not licensed for this site, so the English is a fresh draft from the Hebrew.", "slot": false}, {"id": "ambrose-hex-1-1b", "short": "ambrose-hex-1-1b", "author": "Ambrose", "tradition": "latin", "date": 387, "datelabel": "c. 387", "place": "Milan", "lat": 45.46, "lon": 9.19, "answers": ["moses-is-a-witness", "against-the-philosophers"], "senses": ["literal"], "lemma": {"la": "tamquam testis divini operis ausus est dicere", "en": "as a witness of the divine work he dared to say"}, "en": "Finally it was not in the persuasion of human wisdom, nor in the counterfeit disputations of philosophy, but in the showing of the Spirit and of power, as a witness of the divine work, that he dared to say: In the beginning God made heaven and earth. Not he, so that the world should come together by a concourse of atoms […]. For a man full of prudence perceived that the divine mind alone contains the substances of things visible and invisible, their origins and their causes — not, as the philosophers dispute, that a stronger interlacing of atoms furnishes the cause of unbroken endurance: but he judged that they were weaving a spider's web who gave such minute and unsubstantial first principles to heaven and earth — principles which, as they were joined by chance, would by chance and at random be dissolved, did they not stand fast in the divine power of their governor. Nor is it without cause that they do not know the governor, who have not known God, by whom all things are ruled and governed. Let us follow him, then, who knows both the author and the governor, and let us not be led away by empty opinions.", "translator": "claude-draft-approved", "orig": "Denique non in persuasione humanae sapientiae, nec in philosophiae simulatoriis disputationibus, sed in ostensione spiritus et virtutis, tamquam testis divini operis ausus est dicere: In principio fecit Deus coelum et terram. Non ille, ut atomorum concursione mundus coiret, serum atque otiosum exspectavit negotium; neque disciplinam quamdam materiae, quam contemplando, mundum posset effingere, sed auctorem Deum exprimendum putavit. Advertit enim vir plenus prudentiae, quod visibilium atque invisibilium substantias, origines, et causas rerum mens sola divina contineat, non ut philosophi disputant, validiorem atomorum complexionem perseverantiae jugis praestare causam: sed judicavit quod telam araneae texerent qui sic minuta et insubstantiva principia coelo ac terris darent, quae ut fortuito conjungerentur, ita fortuito ac temere dissolverentur, nisi in sui gubernatoris divina virtute constarent. Nec immerito gubernatorem nesciunt, qui non noverunt Deum, per quem omnia reguntur et gubernantur. Sequamur ergo eum, qui et auctorem novit, et gubernatorem, nec vanis abducamur opinionibus.", "olang": "la", "source": "PL 14, col. 125B", "notes": "The Latin bench's reason for the chapter, and it is a claim about the writer's standing rather than about the chapter's contents. Moses did not speak in the persuasion of human wisdom nor in philosophy's counterfeit disputations but in the showing of the Spirit and of power, and he dared to say 'In the beginning God made heaven and earth' as a witness — testis — of the divine work. Everything Ambrose has said in the preceding column about Plato's three principles and the atomists is cleared away by that one word: a witness does not argue, he reports, and what he reports is what the divine mind alone contains. The spider's web is aimed at Epicurus. Note what the Latin answer does not contain: any suggestion that the chapter should not have been written, or that it is doing something the book is not otherwise for. That question is asked only on the other bench, and there it is asked first.", "slot": false}, {"id": "ambrose-hex-1-5", "short": "ambrose-hex-1-5", "author": "Ambrose", "tradition": "latin", "date": 387, "datelabel": "c. 387", "place": "Milan", "lat": 45.46, "lon": 9.19, "answers": ["the-work-shows-the-maker"], "senses": ["literal"], "lemma": {"la": "dum opus videtur, praefertur operator", "en": "while the work is seen, the worker is put forward"}, "en": "This world, then, is a specimen of the divine working; because while the work is seen, the worker is put forward. For as of these arts of ours some are active, which consist in the movement of the body or the sound of the voice — the movement or the sound ceased, nothing was left over, nothing remained to those who watched or listened; others are theoretical, which exercise the vigour of the mind; others of such a kind that, the office of working having ceased, the work's own service still appears, as building and weaving, which even when the craftsman is silent show his skill.", "translator": "claude-draft-approved", "orig": "Est ergo hic mundus divinae specimen operationis; quia dum opus videtur, 9 praefertur operator. Namque ut istarum artium aliae sunt actuosae, quae sunt in corporis motu, aut sono vocis; cessavit motus aut sonus, nihil superfuit, nec remansit spectantibus vel audientibus: aliae theoreticae, quae vigorem mentis exerceant: aliae hujusmodi, ut cessante quoque operationis officio, operis munus appareat, ut aedificatio atque textura, quae etiam tacente artifice, peritiam ejus ostendunt", "olang": "la", "source": "PL 14, col. 130C", "notes": "Why creation and not something else: because a made thing goes on saying who made it after the maker has stopped speaking. Ambrose sorts the arts into three — those that leave nothing behind when the movement or the sound stops, those that exercise the mind, and those whose product keeps working when the craftsman is silent, like building and weaving — and puts the world in the third class. The argument is Rom 1:20 turned into a workshop, and it answers the crux from the side of the reader rather than the writer: Scripture begins here because this is where God can be inferred from what is in front of anyone. Set against Rashi's answer, the two benches could hardly be further apart. For Ambrose the chapter is the most natural possible opening; for R. Isaac it is the one that has to be explained away.", "slot": false}, {"id": "aug-gnm-1-1", "short": "aug-gnm-1-1", "author": "Augustine", "tradition": "latin", "date": 389, "datelabel": "388–390", "place": "Thagaste", "lat": 36.29, "lon": 7.95, "answers": ["against-the-heretics", "written-for-the-unlearned"], "senses": ["literal"], "lemma": {"la": "non ornato politoque sermone, sed rebus manifestis", "en": "not with ornate and polished speech, but with plain facts"}, "en": "If the Manichees chose whom they deceive, we too would choose the words with which to answer them: but since they pursue both those learned in letters and the unlearned with their error, and while they promise truth try to turn men away from truth, their emptiness must be refuted not with ornate and polished speech but with plain facts. For I was pleased by the judgement of certain truly Christian men who, being themselves educated in liberal letters, when they had read our other books which we published against the Manichees, saw that they were either not understood by the less skilled, or understood with difficulty, and most kindly warned me not to abandon the common manner of speaking, if I meant to drive errors so ruinous out of the minds even of the unlearned. For this usual and simple speech the learned also understand, but that other the unlearned do not understand.", "translator": "claude-draft-approved", "orig": "Si eligerent Manichaei quos deciperent, eligeremus et nos verba quibus eis responderemus: cum vero illi et doctos litteris, et indoctos errore suo persequantur, et cum promittunt veritatem, a veritate conentur avertere; non ornato politoque sermone, sed rebus manifestis convincenda est vanitas eorum. Placuit enim mihi quorumdam vere christianorum sententia, qui cum sint eruditi liberalibus litteris, tamen alios libros nostros, quos adversus Manichaeos edidimus, cum legissent, viderunt eos ab imperitioribus, aut non aut difficile intelligi, et me benevolentissime monuerunt ut communem loquendi consuetudinem non desererem, si errores illos tam perniciosos ab animis etiam imperitorum expellere cogitarem. Hunc enim sermonem usitatum et simplicem etiam docti intelligunt, illum autem indocti non intelligunt.", "olang": "la", "source": "PL 34, col. 173", "notes": "Augustine explaining, before he has expounded a syllable, why this commentary exists and why it is written the way it is — which is the one thing on the Latin bench that answers the crux in the same register as Rashi's opening. The reason is an opponent: the Manichees pursue the learned and the unlearned alike, so the reply cannot be a learned one. And the reason for the style is a piece of received advice, reported with its embarrassment intact — educated friends read his earlier anti-Manichaean books, saw that ordinary readers could not follow them, and told him kindly to stop writing like that. The chapter that follows is then a defence of Gen 1:1 against the question 'in what beginning? and what was God doing before?' — which is m. Chagigah's 'what was before', put by an opponent who has to be answered rather than by a student who has to be stopped.", "slot": false}, {"id": "hugh-sacr-prologus", "short": "hugh-sacr-prologus", "author": "Hugh of St Victor", "tradition": "latin", "date": 1134, "datelabel": "1130–1137", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["scripture-is-about-restoration", "foundation-is-for-secular-writings"], "senses": ["literal"], "lemma": {"la": "materia divinarum Scripturarum omnium sunt opera restaurationis", "en": "the matter of all the divine Scriptures is the works of restoration"}, "en": "CHAPTER II. What is the matter of the divine Scriptures. The matter of all the divine Scriptures is the works of human restoration. For there are two works in which is contained everything that has been made. The first is the work of foundation. The second is the work of restoration. The work of foundation is that by which it was brought about that the things which were not should be. The work of restoration is that by which it was brought about that the things which had perished should be better. Therefore the work of foundation is the creation of the world with all its elements. The work of restoration is the incarnation of the Word with all its sacraments, whether those which went before from the beginning of the age or those which follow to the end of the world. For the incarnate Word is our King, who came into this world to fight with the devil; and all the saints who were before his coming are as soldiers going before the face of the King, and those who came after and will come to the end of the world are soldiers following their King. And the King himself is in the midst of his army, walking hedged about on this side and that and thronged by his companies. And although in so great a multitude various kinds of arms appear in the sacraments and observances of the peoples going before and following after, yet all are proved to serve one King and to follow one standard, and to pursue one enemy and to be crowned with one victory. In all these the works of restoration are considered; on which the whole intention of the divine Scriptures turns. Worldly or secular writings have for their matter the works of foundation. The divine Scripture has for its matter the works of restoration. Therefore it is rightly believed to be more excellent than all writings, by as much as the matter is worthier and more sublime in which its consideration and treatment is engaged. For the works of restoration are far worthier than the works of foundation; because those were made for service, that they might be under man while he stood; these for salvation, that they might raise him fallen. Therefore those, as some small thing, were completed in six days; but these cannot be completed save in six ages.", "translator": "claude-draft-approved", "orig": "CAP. II. Quae sit materia divinarum Scripturarum. Materia divinarum Scripturarum omnium, sunt opera restaurationis humanae. Duo enim sunt opera in quibus universa continentur quae facta sunt. Primum est opus conditionis. Secundum est opus restaurationis. Opus conditionis est quo factum est, ut essent quae non erant. Opus restaurationis est quo factum est ut melius essent quae perierant. Ergo opus conditionis est creatio mundi cum omnibus elementis suis. Opus restaurationis est incarnatio Verbi cum omnibus sacramentis suis; sive iis quae praecesserunt ab initio saeculi, sive iis quae subsequuntur usque ad finem mundi. Verbum enim incarnatum rex noster est, qui in hunc mundum venit cum diabolo pugnaturus; et omnes sancti qui ante ejus adventum fuerunt, quasi milites sunt ante faciem regis praecedentes; et qui postea venerunt et venient usque ad finem mundi milites sunt regem suum subsequentes. Et ipse rex medius est in exercitu suo; hinc inde vallatus incedens et stipatus agminibus suis. Et licet in hac tanta multitudine diversae armorum species in sacramentis et observationibus praecedentium et subsequentium populorum appareant, omnes tamen uni regi militare et unum vexillum sequi probantur, et hostem unum persequi et una victoria coronari. In his omnibus opera restaurationis considerantur; in quibus divinarum Scripturarum tota vertatur intentio. Mundanae sive saeculares scripturae materiam habent opera conditionis. Divina Scriptura materiam habet opera restaurationis. Propterea tanto excellentior omnibus scripturis jure creditur, quanto dignior est et sublimior materia in qua ejus consideratio tractatio quae versatur. Nam opera restaurationis multo digniora sunt operibus conditionis; quia illa ad servitutem facta sunt, ut stanti homini subessent; haec ad salutem, ut lapsum erigerent. Propterea illa quasi modicum aliquid sex diebus perfecta sunt; haec vero non nisi aetatibus sex compleri possunt.", "olang": "la", "source": "PL 176, col. 183A", "notes": "The sharpest Latin answer on this crux, and it is sharp because Hugh gives away more than he means to. The matter of all divine Scripture is the works of restoration; the works of foundation — the creation of the world with all its elements — are the matter of secular writings. That is a clean division and it leaves Genesis 1 on the wrong side of it, which is why the next chapter has to explain how divine Scripture descends through the works of foundation to narrate the works of restoration. Hugh is therefore saying, in the technical vocabulary of a Paris master, exactly what R. Isaac says in Troyes at the head of Rashi's commentary: this chapter is not what the book is for. The two go on to give incompatible reasons — Hugh that Scripture passes through the creation on its way to the Incarnation, Rashi that Israel needs a title to the land — and neither bench ever hears the other's. ⚠ **Anchor note**: a prologue, built by PLAN.md §5's specification for K2; see the file docstring.", "slot": false}, {"id": "comestor-hs-prologus", "short": "comestor-hs-prologus", "author": "Peter Comestor", "tradition": "latin", "date": 1170, "datelabel": "c. 1170", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["history-is-the-foundation"], "senses": ["allegorical"], "lemma": {"la": "historia fundamentum est", "en": "history is the foundation"}, "en": "It belongs to imperial majesty to have three chambers in the palace: the hall of audience or council, in which it decrees laws; the dining-hall, in which it distributes food; the bedchamber, in which it rests. After this manner our Emperor, who commands the winds and the sea, has this world for his hall of audience, where all things are disposed at his nod — whence that word of Isaiah: I fill heaven and earth. According to this he is called Lord: whence, The earth is the Lord's, and the fulness thereof. He has the soul of the just for his bedchamber, because his delights are to rest there and to be with the sons of men: according to this he is called the bridegroom, and each soul the bride. He has holy Scripture for his dining-hall, in which he so makes his own drunk that he renders them sober: whence, We walked in the house of God with consent — being of one mind in holy Scripture. According to this he is called the householder. Of this dining-hall there are three parts: foundation, wall, roof. History is the foundation, of which there are three kinds: annals, calendars, day-books. Allegory is the wall leaning upon it, which figures one deed by another. Tropology is the roof set on the summit, which by what has been done intimates what is to be done by us. The first is plainer, the second sharper, the third sweeter.", "translator": "claude-draft-approved", "orig": "Imperatoriae majestatis est, in palatio tres habere mansiones: auditorium vel consistorium in quo jura decernit: coenaculum, in quo cibaria distribuit; thalamum, in quo quiescit. Ad hunc modum Imperator noster, qui imperat ventis et mari, mundum hunc habet pro auditorio: ubi ad nutum ejus omnia disponuntur. Unde illud Isaiae: Coelum et terram ego impleo (Isa. XXV) . Secundum hanc dicitur Dominus. Unde: Domini est terra, et plenitudo ejus (Psal. XXII) . Animam justi habet pro thalamo, quia deliciae sunt ei ibi quiescere, et esse cum filiis hominum (Prov. VIII) : secundum hanc dicitur sponsus, et anima cujusque sponsa (Ose. II) : Sacram Scripturam habet pro coenaculo, in qua sic suos inebriat, ut sobrios reddat. Unde: Ambulavimus in domo Dei cum consensu (Psal. LIV) , in sacra Scriptura id ipsum sapientes. Secundum hanc dicitur paterfamilias: Coenaculi hujus tres sunt partes, fundamentum, paries, tectum. Historia fundamentum est, cujus tres sunt species: annalis, kalendaria, ephimera. Allegoria paries superinnitens, quae per factum aliud factum figurat. Tropologia, doma culmini superpositum, quae per id quod factum est quid a nobis sit faciendum insinuat. Prima planior, secunda acutior, tertia suavior", "olang": "la", "source": "PL 198, col. 1053", "notes": "Why a book of Scripture begins with a narrative of events, answered by a builder's metaphor that is also a curriculum. Scripture is the Emperor's dining-hall, and the hall has a foundation, a wall and a roof: history, allegory, tropology — the first plainer, the second sharper, the third sweeter. History is the foundation, so it comes first because nothing can be built before it is laid, and the Historia scholastica is a whole book written on that principle. It is the most institutional answer on the daf: not why God began the book here, but why a master beginning to teach it must begin here. The three kinds of history — annals, calendars, day-books — are the technical vocabulary of a twelfth-century classroom. ⚠ **Anchor note**: a prologue, built by PLAN.md §5's specification for K2; see the file docstring.", "slot": false}, {"id": "ambrose-hex-1-1-hyle", "short": "ambrose-hex-1-1-hyle", "author": "Ambrose", "tradition": "latin", "date": 387, "datelabel": "c. 387", "place": "Milan", "lat": 45.46, "lon": 9.19, "answers": ["three-principles", "matter-is-coeval"], "senses": ["literal"], "lemma": {"la": "de materia, quam vocant hylen", "en": "out of the matter which they call hyle"}, "en": "Have men taken up so much opinion that some of them set up three principles of all things — God, and the exemplar, and matter — and asserted that these are incorruptible and uncreated and without beginning, as Plato and his disciples do; and that God made the world not as the creator of matter but as a craftsman looking to an exemplar, that is, to an idea, out of the matter which they call hyle, which is said to have given the causes of generation to all things; and thought the world itself too incorruptible, neither created nor made? Others also, as Aristotle with his followers thought fit to argue, laid down two principles, matter and form, and a third along with them, which is called operative, to which it should belong to bring about fitly what it had judged should be undertaken.", "translator": "claude-draft-approved", "orig": "Tantumne opinionis assumpsisse homines, ut aliqui eorum tria principia constituerent omnium, Deum, et exemplar, et materiam, sicut Plato discipulique ejus; et ea incorrupta, et increata, ac sine initio esse asseverarent: Deumque non tamquam creatorem materiae, sed tamquam artificem ad exemplar, hoc est, ideam intendentem, fecisse mundum de materia, quam vocant hylen, quae gignendi causas rebus omnibus dedisse asseratur: ipsum quoque 2 mundum incorruptum, nec creatum, aut factum existimarent: alii quoque, ut Aristoteles cum suis disputandum putavit, duo principia ponerent, materiam et speciem, et tertium cum iis, quod operatorium dicitur, cui suppeteret competenter efficere, quod adoriundum putasset.", "olang": "la", "source": "PL 14, col. 123A", "notes": "The opening sentence of the Hexaemeron, and the whole Latin bench's account of the opposition is settled in it. Plato: three principles, God and the exemplar and matter, all three incorruptible, uncreated and without beginning, with God a craftsman looking to an idea rather than the maker of the stuff — and the stuff is named, hyle. Aristotle: two principles, matter and form, with a third operative one. Every later Latin witness on this crux repeats one or both lists, usually without naming Ambrose: Remigius has the three at PL 131:53D (K1 sliced it), Hugh of St Victor has them as opifex, materia and forma, Comestor has all three philosophers with Epicurus added and hyle spelt ile. What none of them repeats is the reason Ambrose gives immediately afterwards for Moses' having written as he did — that passage is at PL 14:124B and was built for K1 as ambrose-hex-1-2, so this crux takes the doxography and leaves the answer where it stands.", "slot": false}, {"id": "hugh-sacr-1-1-nihilo", "short": "hugh-sacr-1-1-nihilo", "author": "Hugh of St Victor", "tradition": "latin", "date": 1134, "datelabel": "1130–1137", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["de-nihilo", "creare-vs-formare", "three-principles"], "senses": ["literal"], "lemma": {"la": "non solum ex materia fecit, sed materiam omnium ipse de nihilo creavit", "en": "he not only made them out of matter, but himself created the matter of all things out of nothing"}, "en": "'In the beginning God created heaven and earth' (Gen 1:1). What was created was made out of nothing. For what was made out of something was indeed made, but was not created, because it was not made out of nothing. God therefore made heaven and earth; and not only made but created, that is, made out of nothing. The philosophers of the gentiles laid down three principles of things without a principle: the workman, matter, and form — professing that all the things that were made were brought forth out of matter into form through the workman. But they professed God to be only a maker and not a creator. The true faith, however, confesses one only first principle, which always was; and through it alone it came about that what once was not should be. And the power of his unspeakable omnipotence, just as it could not have anything coeternal besides itself by which it might be helped in making, so it had at hand, when it willed, that what it willed and when and how much it willed should be created out of nothing. All things therefore that were made, God not only made out of matter, but himself created the matter of all things out of nothing.", "translator": "claude-draft-approved", "orig": "In principio creavit Deus coelum et terram (Gen. I) . Quod creatum est de nihilo factum est. Nam quod de aliquo factum est, factum quidem est sed creatum non est; quia de nihilo factum non est. Fecit ergo Deus coelum et terram; nec solum fecit sed creavit, hoc est de nihilo fecit. Philosophi gentilium tria quaedam rerum principia sine principio posuerunt: opificem, materiam et formam; profitentes ea quae facta sunt omnia ex materia quidem in formam per opificem esse producta. Sed isti factorem solum non creatorem Deum professi sunt. Fides autem vera unum solummodum primum principium confitetur quod semper erat; et per ipsum solum factum est ut esset quod aliquando non erat. Cujus ineffabilis omnipotentiae virtus, sicut non potuit aliud praeter se habere coaeternum, quo in faciendo juvaretur; ita ipsi cum voluit suberat, ut quod voluit et quando et quantum voluit de nihilo crearetur. Omnia ergo quae facta sunt, Deus non solum ex materia fecit, sed materiam omnium ipse de nihilo creavit.", "olang": "la", "source": "PL 176, col. 187A", "notes": "The first chapter of the first book of De sacramentis, which is to say that when the Latin bench organises itself into a systematic theology this crux is where it starts. The chapter title is the thesis: that there is one principle from which all things were made out of nothing. Then the distinction as a definition — what was made out of something was made but not created — followed by the doxography Ambrose opened the Hexaemeron with, now compressed to three words, opifex, materia, forma, and given its precise consequence: those philosophers professed God to be a maker and not a creator. The move that closes it is Augustine's, that nothing coeternal could help him in the making. Ramban reaches the same last sentence in Girona a century and a quarter later — two substances only were created, and everything else was constructed from them — from the Hebrew of the verb and a Greek word for the matter, and with nothing of this in front of him.", "slot": false}], "threads": [{"id": "t-k2-01", "from": "rashi-1-1", "to": "br-1-2", "type": "cites", "evidence": "Rashi's answer is Bereshit Rabbah 1:2 almost entire — Ps 111:6, 'he declared to his people the power of his works, in order to give them the inheritance of the nations'; the nations calling Israel robbers; and Israel's reply that the whole earth belongs to the Holy One, who gave it and took it and gave it again. What Rashi adds, and what makes it the opening of a commentary rather than a piece of polemic, is R. Isaac's premise: the Torah should have begun at Exod 12:2.", "crux": "why-begin-here"}, {"id": "t-k2-02", "from": "hugh-sacr-prologus", "to": "rashi-1-1", "type": "parallel", "evidence": "The star thread of this crux, and both benches say it about the book they are expounding. R. Isaac: the Torah is Israel's law book and ought to have begun with the first commandment given to Israel, at Exod 12:2. Hugh: the matter of all divine Scripture is the works of restoration, and the works of foundation are the matter of secular writings. Each has ruled that the first chapter of Genesis is not what its book is for, in Troyes and in Paris within fifty years, and each then supplies a reason external to the chapter — a claim on the land, a descent toward the Incarnation.", "crux": "why-begin-here"}, {"id": "t-k2-03", "from": "m-chag-2-1", "to": "br-1-10", "type": "cites", "evidence": "Bereshit Rabbah reads the Mishnah's four forbidden matters out of the shape of the first letter of the verse: as the bet is closed on its three sides and open at the front, you have no permission to ask what is below, what is above, what was before and what is after. The list is the Mishnah's, item for item and in the same order; what is new is that it is now a property of the text rather than a rule of the school.", "crux": "why-begin-here"}, {"id": "t-k2-04", "from": "br-1-5a", "to": "m-chag-2-1", "type": "echoes", "evidence": "The Mishnah restricts the audience and the midrash curses the motive. Rav Huna in the name of Bar Kappara reads Ps 31:19 against those who speak 'with arrogance' — is it in order to boast, I am expounding the work of creation? — and 'with contempt', for the honour of the Maker. The Mishnah's closing clause is the same: whoever has no care for the honour of his Maker, it were fitting he had not come into the world.", "crux": "why-begin-here"}, {"id": "t-k2-05", "from": "br-1-5a", "to": "br-1-10", "type": "echoes", "evidence": "Two fences in one chapter of the same commentary, five sections apart, and both about the same book they are introducing: a curse on those who expound the work of creation for their own honour, and a letter shaped so that the questions before and behind may not be put. Bereshit Rabbah opens by making the case against itself twice.", "crux": "why-begin-here"}, {"id": "t-k2-06", "from": "aug-gnm-1-1", "to": "m-chag-2-1", "type": "contests", "evidence": "The identical question and the opposite discipline. The Mishnah: whoever looks at what is above, what is below, what is before, what is after, it were fitting for him that he had not come into the world. Augustine, in the chapter following this one: the Manichees ask 'in what beginning? if God made heaven and earth in some beginning of time, what was he doing before he made heaven and earth?' — and he answers it, at length and in the plainest Latin he can manage. On one bench the question is put by a student who must be stopped; on the other by an opponent who must be answered, and being answered it becomes part of the commentary tradition for good.", "crux": "why-begin-here"}, {"id": "t-k2-07", "from": "aug-gnm-1-1", "to": "br-1-5a", "type": "contests", "evidence": "Both texts stand at the head of an exposition of Genesis 1 and both are about who should be doing the expounding. Bereshit Rabbah: may they be silenced, may they be made mute — is it in order to boast, I am expounding the work of creation? Augustine: since the Manichees pursue the learned and the unlearned alike, the reply must be made not in ornate and polished speech but in plain facts, and educated friends warned him kindly that his earlier books could not be followed by ordinary readers. One tradition's answer to a wide audience is to restrict the teaching; the other's is to change the prose.", "crux": "why-begin-here"}, {"id": "t-k2-08", "from": "ambrose-hex-1-1b", "to": "rashi-1-1", "type": "contests", "evidence": "The two benches' reasons for the chapter, and they do not meet at any point. Ambrose: Moses spoke not in the persuasion of human wisdom nor in philosophy's counterfeit disputations but as a witness of the divine work, and therefore dared to say 'in the beginning God made heaven and earth'. R. Isaac: the book should have begun at the first commandment, and begins here so that Israel may answer the charge of robbery. One answers from the writer's authority, the other from the reader's need; neither would recognise the other's question as the question.", "crux": "why-begin-here"}, {"id": "t-k2-09", "from": "ambrose-hex-1-5", "to": "ambrose-hex-1-1b", "type": "echoes", "evidence": "Two answers a few columns apart and they are the two halves of one: Moses could write it because he was a witness of the divine work, and it is worth writing because a work goes on showing its worker after he has fallen silent, as building and weaving do. The first secures the text, the second secures the subject.", "crux": "why-begin-here"}, {"id": "t-k2-10", "from": "comestor-hs-prologus", "to": "hugh-sacr-prologus", "type": "echoes", "evidence": "Two Paris prologues a generation apart, and the second answers the difficulty the first creates. Hugh has left the works of foundation to secular writings and must explain how Scripture descends through them; Comestor makes history the foundation of the building and allegory the wall that leans upon it, so that beginning with the creation is not a detour but the first course of masonry. Comestor is Hugh's pupil's pupil and the metaphor is doing structural work.", "crux": "why-begin-here"}, {"id": "t-k2-11", "from": "comestor-hs-prologus", "to": "br-1-5a", "type": "contests", "evidence": "The most complete opposition on the daf, and neither text knows the other exists. Comestor's Scripture is a dining-hall in which the Emperor makes his own drunk so as to render them sober, with a threefold curriculum built on it and a book to follow. Bereshit Rabbah's fifth section curses those who expound the work of creation for their own honour and reserves the concealed matters to the Righteous One. One tradition institutionalises the exposition; the other keeps warning itself against it — and both then produce the exposition anyway.", "crux": "why-begin-here"}, {"id": "t-k2-12", "from": "hugh-sacr-prologus", "to": "ambrose-hex-1-5", "type": "contests", "evidence": "Ambrose puts the world in the class of works that keep showing their maker when the maker is silent, which makes the creation the natural first subject of any book about God. Hugh assigns the works of foundation to secular writings and keeps the works of restoration for Scripture, which makes it the least natural. The Latin bench holds both, seven hundred years apart, and Hugh does not mention that anyone had thought otherwise.", "crux": "why-begin-here"}, {"id": "t-k2-13", "from": "br-1-10", "to": "aug-gnm-1-1", "type": "parallel", "evidence": "Both fence the same question from opposite sides at the head of the same chapter. R. Yona in the name of R. Levi: the bet is closed behind, so you may not ask what was before, only from the day the world was created onward. Augustine's opponents ask precisely what was before, and his answer — that no time could pass before God made time, since none can be the maker of times except one who is before times — is the fence rebuilt as an argument. Bar Kappara reaches for Deut 4:32, 'ask now of the early days that were before you, from the day God created man'; Augustine reaches for Titus 1:2, 'before eternal times'. Each has a verse for the boundary and only one of them will say what lies past it.", "crux": "why-begin-here"}, {"id": "t-k2-14", "from": "rashi-1-1", "to": "m-chag-2-1", "type": "contests", "evidence": "The first sentence of the most-read Jewish commentary on the Torah asks why the book begins with the work of creation, in a tradition whose Mishnah says the work of creation may not be expounded before two. Rashi does not cite the rule and does not need to break it: his answer removes the chapter from the domain the Mishnah is fencing by making it a matter of public law rather than of hidden things — the peoples of the world say, and Israel answers.", "crux": "why-begin-here"}, {"id": "t-k2-15", "from": "br-1-2", "to": "ambrose-hex-1-5", "type": "parallel", "evidence": "Both make the creation account public evidence, and for opposite audiences. R. Yehoshua of Sikhnin in R. Levi's name: God revealed what was made on each day because of the idolaters, so that Israel could answer the charge of robbery. Ambrose: the world is a specimen of the divine working, so that while the work is seen the worker is put forward, as a building shows its craftsman when he is silent. The rabbinic bench's evidence is a text and its jury is the nations; the Latin bench's evidence is the world and its jury is anyone with eyes.", "crux": "why-begin-here"}, {"id": "t-k2-x1", "from": "ambrose-hex-1-1b", "to": "ambrose-hex-1-1-hyle", "type": "echoes", "evidence": "Phase 4. Two halves of Ambrose's first chapter, split between two cruxes. The earlier passage sets out what the philosophers held — Plato's three principles, uncreated and coeternal with God, and the atomists' concourse; this one clears them away in a sentence by making Moses a witness rather than a disputant. The refutation is unintelligible without the doxography that precedes it.", "crux": "why-begin-here"}, {"id": "t-k2-x2", "from": "hugh-sacr-prologus", "to": "hugh-sacr-1-1-nihilo", "type": "echoes", "evidence": "Phase 4. Hugh sets out in his prologue that the matter of secular writings is the works of foundation, and then, when he reaches the works of foundation himself, opens by refuting the philosophers of the nations who posited three first principles without a beginning — workman, matter and form. The prologue explains why that refutation has to come first: he is on ground he has just assigned to somebody else.", "crux": "why-begin-here"}], "answers": {"borne-over": {"label": "Borne over", "gloss": "The verb is motion: a spirit carried above the water (LXX ἐπεφέρετο, Vulgate ferebatur)."}, "wind": {"label": "A wind", "gloss": "Ruach is weather, not a person; Onkelos keeps God at a remove."}, "spirit-of-mercy": {"label": "Spirit of mercy", "gloss": "A divine disposition blowing over the waters (Palestinian targums)."}, "messiah": {"label": "Spirit of the Messiah", "gloss": "Resh Lakish: the ruach of Isa 11:2, brought by repentance-as-water."}, "bird-hovering": {"label": "Dove hovering, not touching", "gloss": "Ben Zoma and Rashi: the bird measures a gap; it does not land."}, "fluttering": {"label": "Fluttering", "gloss": "Abelard's report of the Hebrew: volitabat, as the eagle of Deut 32:11."}, "brooding-warmth": {"label": "Bird brooding, warming", "gloss": "Jerome from the Hebrew, Basil's Syrian, then the Latin schools: the Spirit quickens matter like a hen on eggs."}, "power-not-place": {"label": "Power, not place", "gloss": "Augustine: 'above' means sovereignty, not position; the Manichees misread it."}, "craftsman": {"label": "The craftsman's will", "gloss": "The Spirit over the waters as the maker's intention over the wood."}, "love-gift": {"label": "Love, gift, weight", "gloss": "Confessions XIII: why the Spirit alone is said to be above; pondus meum amor meus."}, "trinity": {"label": "The Trinity named", "gloss": "The verse completes Father (in principio), Son (principium), Spirit."}, "heart": {"label": "Over the heart", "gloss": "Isidore's moral reading: the waters are our fluid, dark heart."}, "throne": {"label": "Throne of Glory", "gloss": "Rashi: the throne stands in the air, held by the breath of God's mouth."}, "unus-cardinal": {"label": "The versions keep the cardinal", "gloss": "ἡμέρα μία, dies unus, yoma chad: 'one', not 'first', in every ancient version."}, "unus-grammatical": {"label": "'First' needs a second", "gloss": "The series 'one, second, third' is improper (Bereshit Rabbah); or, first and second are relatives and there was no second yet (Bruno)."}, "unus-alone": {"label": "God was alone that day", "gloss": "Yachid in his world: no angels were made on the first day, so there was no second anything (Bereshit Rabbah, Rashi)."}, "unus-yom-kippur": {"label": "The one day given to Israel", "gloss": "'One day' is the Day of Atonement, the day the Holy One gave them."}, "unus-24-hours": {"label": "One circuit, twenty-four hours", "gloss": "Day and night together make one revolution, and the whole is named from the day alone."}, "unus-repeated": {"label": "The same day repeated", "gloss": "There is one day only — the angelic light — presented once for each kind of thing made (Augustine)."}, "unus-all-time": {"label": "One day = all time", "gloss": "The word holds the whole span of the ages, or the whole work of the six days (Augustine's set-aside reading; Abelard's own)."}, "unus-angelic-unity": {"label": "The unity of angelic dignity", "gloss": "'One' names the undivided attention of the angelic mind, not a place in a series (Angelomus)."}, "unus-eternal-day": {"label": "The true first day is eternal", "gloss": "This day is first only by number and order of creation; the day that is first by nature is uncreated light (Rupert)."}, "day-precedes-night": {"label": "Day before night", "gloss": "Evening is the end of a finished day, morning the end of the night; days are counted from morning to morning."}, "day-follows-night": {"label": "Night before day", "gloss": "'One day' rules that reckoning begins at evening (Ben Zoma, b. Chullin 83a)."}, "night-for-rest": {"label": "Night made for rest", "gloss": "Day is for labour and night for rest, so only the day's bounds are counted."}, "day-is-a-measure": {"label": "The day's measure is a creature", "gloss": "The measure of day and of night was itself made on day one (b. Chagigah 12a)."}, "evening-is-completion": {"label": "Evening completes a work", "gloss": "Vespera is a work perfected, mane the beginning of the next — the Carolingian formula."}, "evening-is-self-knowledge": {"label": "Evening and morning knowledge", "gloss": "The creature known in itself is evening; known in the Word and referred back in praise, morning (Augustine)."}, "evening-moral": {"label": "Evening as sin or temptation", "gloss": "Evening and morning are the deeds of the wicked and the righteous, or sin and renewal, or temptation and the light of justice."}, "simul": {"label": "All things made at once", "gloss": "Creavit omnia simul (Sir 18:1): the days are not successive."}, "six-days-literal": {"label": "Six real days", "gloss": "Created at once in matter, distinguished in form through six successive days (the common doctors, Bonaventure)."}, "principio-temporis": {"label": "In the beginning of time", "gloss": "The word dates the making: time began with the world, and there was no before (Onkelos, Bede, Rabanus, Remigius, Hugh)."}, "principio-in-filio": {"label": "In the Son", "gloss": "Principium is a proper name of the Word, on the strength of John 8:25 and Ps 104:24 (Ambrose, Augustine, Isidore, Alcuin, the Glossa, Rupert, Honorius)."}, "principio-first-of-all": {"label": "First of all things", "gloss": "'In the beginning' means before everything else that follows — in the beginning of the creatures, or on the first day (Augustine's second reading; Bruno, Abelard)."}, "principio-is-first-creature": {"label": "The first creature is a beginning", "gloss": "The first intellectual creature may be called a beginning to the things it heads (Augustine, De Genesi imperfectus)."}, "beginning-is-wisdom": {"label": "In Wisdom", "gloss": "The beginning is Wisdom — which is the Torah on one bench (Prov 8:22, Prov 3:19, Neofiti) and the Son on the other (Ps 104:24)."}, "reshit-is-torah": {"label": "The beginning is the Torah", "gloss": "Reshit is the Torah, called reshit darko: God looked into it as an architect into his plans and created the world (Bereshit Rabbah, Rashi)."}, "reshit-is-israel": {"label": "For the sake of Israel", "gloss": "Reshit is Israel, called reshit tevu'ato (Jer 2:3); the world was made for their sake."}, "reshit-construct": {"label": "'When God began to create'", "gloss": "Bereshit is a construct and the verse a subordinate clause: at the beginning of God's creating (Rashi's plain sense, Ibn Ezra; contested by Ramban)."}, "world-has-a-beginning": {"label": "The world is not eternal", "gloss": "The point of saying 'in the beginning' at all is that the world had one, against the philosophers (Ambrose, Remigius, Hugh, Ramban)."}, "bereshit-book-name": {"label": "It is the book's name", "gloss": "The Hebrews name volumes from their opening words, so bresith is the title of Genesis (Jerome, Wigbod, Angelomus)."}, "six-preceded": {"label": "Six things preceded the world", "gloss": "Torah and the Throne of Glory were made before it; the patriarchs, Israel, the Temple and the Messiah's name were contemplated (Bereshit Rabbah 1:4)."}, "read-it-twice": {"label": "Say the phrase twice", "gloss": "In principio is to be repeated — once in the Son, once at the beginning of time — rather than decided (Comestor)."}, "lux-corporalis": {"label": "A bodily light", "gloss": "A material light made to light material things, standing in the sun's place until the fourth day (Basil, Ambrose, Bede, Hugh, Honorius, Comestor, Bonaventure)."}, "lux-angelica": {"label": "The angelic creation", "gloss": "The light is the spiritual creature called 'heaven' in v. 1, made light by turning to its Creator (Augustine, Angelomus, Rupert)."}, "lux-hidden": {"label": "Stored for the righteous", "gloss": "Too good for the wicked, it was hidden away and is kept for the righteous in the time to come (Bereshit Rabbah, b. Chagigah, Rashi)."}, "lux-garment": {"label": "From the light of his garment", "gloss": "God wrapped himself in it like a garment (Ps 104:2); the heavens were stretched out of it (Bereshit Rabbah, Pirkei de-Rabbi Eliezer)."}, "lux-from-temple": {"label": "From the site of the Temple", "gloss": "The light was created from the place of the sanctuary (Ezek 43:2; Jer 17:12)."}, "lux-becomes-luminaries": {"label": "The luminaries were made from it", "gloss": "The nature of light was made on day one and hung in the firmament on day four (the sages in b. Chagigah 12a; an unnamed opinion in Augustine)."}, "lux-twilight": {"label": "A light like the dawn", "gloss": "Not the sun's brightness but what the sky is before sunrise or after sunset (Remigius, Honorius, Comestor, Hugh)."}, "lux-is-day": {"label": "'Light' just means day", "gloss": "The verse answers itself: he called the light Day, so light here is put for day (Bruno)."}, "lux-is-distinction": {"label": "The distinguishing of the works", "gloss": "The light is the confused heap becoming distinct and knowable, not a thing at all (Abelard)."}, "fiat-is-instantaneous": {"label": "Speaking is making", "gloss": "No interval between the command and the thing: the Hebrew says only 'let it be, and it was' (Ambrose, Basil, Angelomus, Abelard)."}, "pair-is-formless-matter": {"label": "Unformed matter", "gloss": "The pair names the matter God had made and not yet given form to (Augustine, Angelomus, Hugh, Comestor)."}, "pair-is-under-water": {"label": "Hidden under the waters", "gloss": "Invisible because the waters covered it, and because there was neither light nor anyone to see (Basil, Alcuin, Angelomus, Ibn Ezra)."}, "pair-is-unfurnished": {"label": "No seed, no living thing", "gloss": "Empty of shoots and void of animals: a list of what was not there yet (Bede, Remigius, Rupert, Abelard, Hugh, Comestor, the targums)."}, "pair-is-a-name-for-us": {"label": "A name fitted to slow minds", "gloss": "Not a description but the most serviceable word for formlessness, since earth and the deep are the least comely things men know (Augustine, Confessions XII)."}, "pair-many-senses": {"label": "More than one true reading", "gloss": "Five readings of the clause are all true and none can be shown to be Moses' own (Augustine, Confessions XII.21)."}, "pair-is-two-things": {"label": "A green line and slimy stones", "gloss": "Tohu and bohu are two creatures made on the first day: a line encircling the world, and stones sunk in the deep (b. Chagigah 12a, Sefer Yetzirah)."}, "pair-is-matter-and-form": {"label": "Matter and its form", "gloss": "Tohu is the hyle, which can hold no name; bohu is bo hu, the form it puts on (Ramban)."}, "pair-is-astonishment": {"label": "Astonishment", "gloss": "Tohu is what astonishes whoever looks at it — the earth bewildered at her lot, or the reader appalled at the emptiness (Bereshit Rabbah 2:2, Rashi, the Bahir)."}, "pair-is-history": {"label": "The verse tells history", "gloss": "The clause is the first term of a periodization: the generations from Adam, the four kingdoms, or the Church before her children (Bereshit Rabbah 2:1, 2:3, 2:4; Bruno)."}, "pair-is-our-flesh": {"label": "The earth of our flesh", "gloss": "The soul before it has taken the form of doctrine (Isidore, Wigbod, Rabanus, Remigius, Bruno)."}, "pair-is-not-of-heaven": {"label": "Said of earth, not of heaven", "gloss": "The phrase is withheld from heaven, which was filled with angels as soon as it was made (Bede, the Glossa, Angelomus, Abelard)."}, "heaven-first": {"label": "Heaven first", "gloss": "Beit Shammai: the word order is the order of the acts, and a king has his throne made before its footstool (Isa 66:1)."}, "earth-first": {"label": "Earth first", "gloss": "Beit Hillel: a builder raises the lower storey first (Amos 9:6), and Gen 2:4 and Ps 102:26 name the earth before the heavens."}, "both-at-once": {"label": "Both together", "gloss": "The sages, and R. Shimon ben Yoḥai's stewpot and its lid (Isa 48:13); Ambrose, that the order of naming gives heaven no privilege of the firstborn."}, "order-of-dignity": {"label": "Named for dignity, not order", "gloss": "Heaven stands first because it is worthier, or because the account is about to turn to the earth (Hugh of St Victor; R. Yoḥanan's creation-and-completion)."}, "created-then-stretched": {"label": "Created in one order, stretched in the other", "gloss": "Resh Lakish: heaven was created first, the earth was stretched out first — so both proof-texts stand."}, "heaven-earth-is-everything": {"label": "A name for the whole creation", "gloss": "Two visible words standing for all that God made, given so for the weakness of little ones (Augustine, Alcuin, Angelomus, Comestor)."}, "heaven-is-empyrean": {"label": "The empyrean heaven", "gloss": "Not the visible firmament but a fiery — from brightness, not heat — and intellectual heaven, filled with angels as soon as it was made (Remigius, the Glossa, Comestor)."}, "heaven-earth-four-elements": {"label": "The four elements", "gloss": "Heaven names fire and air, earth names earth and water; the verse announces the material first principles of bodies (Ambrose, Abelard, Ramban, Comestor)."}, "et-includes": {"label": "The particle includes", "gloss": "Et ha-shamayim brings in the sun, moon and constellations; ve-et ha-aretz the trees, the plants and the Garden of Eden (Bereshit Rabbah 1:14, b. Chagigah 12a, Ramban)."}, "shamayim-is-water": {"label": "Sham mayim — 'there is water'", "gloss": "The name itself says what heaven is made of: water, or fire and water mingled into the firmament (b. Chagigah 12a)."}, "one-earth-only": {"label": "One earth, and no heaven of heavens here", "gloss": "If the heavens of v. 1 were the intelligible heaven, the earth beside it could not be the ground; the seven earths are seven regions of the one (Ibn Ezra; Abelard, from the other end)."}, "whole-then-parts": {"label": "The whole first, then the parts", "gloss": "V. 1 is a heading: Scripture commends everything God made in two words before going through it with 'God said' (Augustine, Angelomus, the Glossa)."}, "de-nihilo": {"label": "Out of nothing", "gloss": "God made the world, and the matter of the world, from nothing whatever."}, "matter-then-formed": {"label": "Matter first, then formed", "gloss": "Formless matter was created first — first in origin, not in time — and everything else made out of it."}, "matter-is-coeval": {"label": "Matter was already there", "gloss": "God is a craftsman working on a material he did not make. Reported on both benches, held by neither."}, "three-principles": {"label": "God, exemplar, matter", "gloss": "The philosophers' three principles without a principle, named as the position to be refuted."}, "all-of-them-created": {"label": "Of every one of them, creation is written", "gloss": "Each thing the objector calls a pre-existing material has its own verse saying God created it."}, "bara-is-not-ex-nihilo": {"label": "'Created' does not mean from nothing", "gloss": "The verb bara is used of the sea-creatures and of man, who were made from something."}, "creare-vs-formare": {"label": "Created, not formed", "gloss": "Scripture keeps two verbs apart: what has no pre-existing matter is created, what is shaped out of matter is formed."}, "hyle-is-tohu": {"label": "The hyle is tohu", "gloss": "The one created thing is a substance without form, which the Greeks call hyle and Scripture calls tohu."}, "made-from-something-of-god": {"label": "From the light and the snow", "gloss": "Heaven from the light of his garment, earth from the snow beneath the Throne of Glory."}, "craftsman-needs-matter": {"label": "A craftsman needs a material", "gloss": "Wood helps the carpenter, silver the silversmith — the analogy that makes creation from nothing unthinkable."}, "silence-proves-nothing": {"label": "Scripture's silence proves nothing", "gloss": "That Genesis does not say when a thing was made does not make it coeternal with God."}, "world-from-tohu": {"label": "The world was made out of tohu va-vohu", "gloss": "Said with embarrassment, and only because the verse says it."}, "tenebrae-privatio": {"label": "Darkness is not a thing", "gloss": "Darkness is the absence of light, as silence is the ceasing of voice and nakedness the absence of a garment; Scripture never says God made it (Augustine, Angelomus, Hugh)."}, "tenebrae-creatura": {"label": "God made the darkness too", "gloss": "The darkness is a work of God like the light — it is called with the light to bless the Lord in Dan 3, and it is on the rabbinic lists of what was made on the first day (Remigius, the Glossa, Wigbod's pupil; Pirkei de-Rabbi Eliezer, R. Tanḥuma)."}, "tenebrae-angeli": {"label": "The darkness is the apostate angels", "gloss": "The light of day one is the angelic creation and the division is between the holy angels and the unclean (Augustine, City of God XI.19; Angelomus, Hugh, Rupert, Comestor)."}, "tenebrae-peccatores": {"label": "The wicked, or their deeds", "gloss": "The division is moral: the just from sinners (Isidore, Remigius, the Glossa), or the deeds of the righteous from the deeds of the wicked (R. Yanai, R. Abahu)."}, "tenebrae-ignis": {"label": "Darkness names the element of fire", "gloss": "'Darkness' in v. 2 is elemental fire, which is dark; the deep is water and the spirit is air (Ramban)."}, "divisio-loci": {"label": "Divided by place and quality", "gloss": "The two were set apart in space and time — light over the upper part of the world, twelve hours above and twelve below, opposite hemispheres in turn (Basil, Bede, Rabanus, Honorius, Comestor; and R. Yoḥanan's two generals, each given his bound)."}, "divisio-nominis": {"label": "The dividing is the naming", "gloss": "There is no separate act of separation: 'and he divided' means by the calling of names (Ibn Ezra; entertained once by Augustine and dropped)."}, "divisio-est-ordinatio": {"label": "He did not make it but ordered it", "gloss": "God makes the forms and orders the privations, as a singer orders his rests and a painter his shadows, so that even a nothing has its place (Augustine)."}, "divisio-est-judicium": {"label": "The division is a judgement", "gloss": "A sentence passed, and irreversible: on the devil and his angels (Rupert, Hugh), or on the just and sinners by foreknowledge (Isidore)."}, "divisio-est-instantanea": {"label": "The division needed no second act", "gloss": "The two were never mixed: by the very fact that light was made, the division followed, as putting on a garment ends nakedness (Augustine, Hugh)."}, "formatum-ab-informi": {"label": "The formed from the unformed", "gloss": "The dividing is the distinction of the formed thing from the unformed, of the perfect from the imperfect and the distinct from the confused (Wigbod, Abelard, Honorius)."}, "bonum-approbatio": {"label": "'He saw' is approval, not discovery", "gloss": "God did not learn that the light was good: what pleased him to be made pleased him to remain (Alcuin, Comestor), or the seeing is in the thought (Ibn Ezra), or a good work attests itself when seen (Ambrose)."}, "bonum-withheld": {"label": "The approval is deliberately withheld", "gloss": "'It was good' is not repeated after the division, and the divine name is dropped from the naming of the night, so that the darkness should not be approved along with the light (Augustine, Wigbod; R. Elazar, R. Abahu)."}, "havdala-derived": {"label": "The verse is the source of the havdala rule", "gloss": "'He saw … and he divided' — one does not bless over the lamp until he has used its light (R. Ze'eira of Caesarea)."}, "lux-hivdil-set-aside": {"label": "He set the light aside", "gloss": "Va-yavdel means he separated it off — for himself (R. Yehuda bar Simon), or for the righteous in the time to come, like a king setting aside a fine portion for his son (the Rabbis)."}, "one-authority-singular-verb": {"label": "The verb is singular, so one maker", "gloss": "Not vaydaberu but vaydaber, not bare'u but bara — no one may say that two authorities created the world (Bereshit Rabbah 1:7; Ibn Ezra; and, to the opposite end, Abelard)."}, "elohim-is-plural-of-persons": {"label": "Eloim is plural: three persons", "gloss": "El is singular and Eloim plural, showing a diversity of persons each of which is God; the singular verb shows that they are one creator and their works undivided (Abelard)."}, "elohim-is-honorific-plural": {"label": "A plural of honour", "gloss": "Every language honours the great with a plural — adonim, be'alim, the king speaking of himself in Arabic — so Elohim is the plural of eloah and means nothing more (Ibn Ezra). This is his account of the NOUN. He refuses the same reading of the plural VERB at Gen 1:26, where Saadia offers it to him: see plural-of-majest
