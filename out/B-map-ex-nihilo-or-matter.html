<script>
const D = {"crux": {"id": "ex-nihilo-or-matter", "question": {"en": "Was anything there before?", "la": "Utrum aliquid praecesserit?", "he": "הֲיֵשׁ דָּבָר שֶׁקָּדַם לָעוֹלָם?"}, "summary": "Both benches reach for 2 Macc 7:28 and Wis 11:17 and find them pulling in opposite directions.", "finding": "Both benches meet the same objection, in the same words, from a craftsman. The philosopher tells Rabban Gamliel that his God was a great artist who found good materials — emptiness, disorder, darkness, wind, water, the deeps (BR 1:9); Augustine says we must not be like those who cannot believe God made anything out of nothing, because they are watching craftsmen, and wood helps the carpenter, silver the silversmith, gold the goldsmith, earth the potter (Gnm I.6.10); Basil says with us every art works on a material brought to it, smithcraft on iron and carpentry on wood, and that this is what they have projected on God. Three benches, one analogy, no contact — and three different kinds of answer. Basil answers from the dignity of the unbegotten, Augustine from omnipotence, and Rabban Gamliel with a concordance, producing a verse of creation for each of the six materials. The Latin answer is a doctrine and the rabbinic answer is a list of proof texts, and neither would have satisfied the other.\n\nThe second finding is a philological objection raised three times in forty years by men who could not have read one another, from the same two verses. Scripture uses the creation verb of things made out of something: God created the great sea-creatures (Gen 1:21), God created man in his own image (Gen 1:27). Rupert of Deutz puts the objection to himself at Liège about 1115 and answers that the word is used rightly there because the matter had already been created. Abelard at the Paraclete about 1130 answers it by separating two Latin verbs — created of what has no pre-existing matter, formed of what is shaped out of matter, as at Gen 2:7 and 2:19. Ibn Ezra in Lucca about 1155 brings the identical verses in the identical order and concludes that the commentators are simply wrong: bara does not mean bringing forth something from nothing. The Latin distinction is available only because the translation supplies two verbs where the Hebrew has one at the places that matter — and Ramban, who had Ibn Ezra in front of him and named him, closed the question a century later by asserting the exclusive Ibn Ezra had denied, in the same two-stage form Hugh of St Victor had given it in Paris: one thing was created out of nothing, and everything else was made out of that.\n\nAnd the position everyone refutes is held, on this site, by nobody — except in the two places where the rabbinic bench states it in its own voice and is uncomfortable about it. Bereshit Rabbah 1:5 asks 'from what?' and answers 'the earth was emptiness and disorder', with the formula reserved for saying what may not be said, and a parable about insulting a king by mentioning the sewers his palace stands on. Pirkei de-Rabbi Eliezer 3 answers 'from what?' with no embarrassment at all: the heavens from the light of his garment, the earth from the snow beneath the Throne of Glory. Nothing on the Latin bench has that shape, and nothing could have: once matter is the thing at issue, a material that belongs to God is still a material."}, "witnesses": [{"id": "br-1-5b", "short": "br-1-5b", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["world-from-tohu", "matter-then-formed"], "senses": ["literal"], "lemma": {"he": "מִנַּיִן הֵן", "en": "From what were they?"}, "en": "The way of the world is that when a flesh-and-blood king builds his palace in [a location that had been] a place of sewers, a place of refuse, and a malodorous place, anyone who comes and says: ‘This palace was built in a place of sewers, a place of refuse, and a malodorous place,’ is this not an insult? So, too, anyone who comes and says: ‘This world was created from emptiness and disorder,’ is this not an insult? This is a rhetorical question. Rav Huna said in the name of bar Kapara: Were the matter not written explicitly it would not have been possible to say it: “In the beginning, God created” (Genesis 1:1) – from what? “The earth was emptiness and disorder” (Genesis 1:2).", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "בנוהג שבעולם מלך ב\"ו בונה פלטין במקום הביבים ובמקום האשפה ובמקום הסריות כל מי שהוא בא לומר פלטין זו בנויה במקום הביבים ובמקום האשפה ובמקום הסריות אינו פוגם כך כל מי שהוא בא לומר העוה\"ז נברא מתוך תוהו ובוהו אינו פוגם אתמהה ר' הונא בשם בר קפרא אמר אילולי שהדבר כתוב אי אפשר לאמרו \"בְּרֵאשִׁית בָּרָא אֱלֹהִים\" מנין הן \"וְהָאָרֶץ הָיְתָה תֹהוּ וָבֹה", "olang": "he", "source": "Bereshit Rabbah 1:5 (Vilna numbering), second half", "notes": "The rabbinic bench saying the thing the Latin bench spends four centuries denying, and saying it with its eyes shut. The parable first: a king builds his palace over sewers, a refuse heap and a stinking place, and whoever comes and says 'this palace is built over sewers' has insulted him — so too whoever says 'this world was created out of emptiness and disorder' has insulted the King. Then Rav Huna in the name of bar Kappara, and the formula is the formula for saying what may not be said: were the matter not written explicitly it would not be possible to say it — 'In the beginning God created' — from what? 'The earth was emptiness and disorder.' The verse is read as an answer to the question the verse raises, and the answer is that the material was there. Four sections later the same work will make Rabban Gamliel refuse exactly that inference to a philosopher's face. Neither section knows the other is there; the first half of BR 1:5, which forbids expounding what is before the world at all, belongs to K2.", "slot": false}, {"id": "br-1-9", "short": "br-1-9", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["matter-is-coeval", "all-of-them-created", "craftsman-needs-matter"], "senses": ["literal"], "lemma": {"he": "אֱלֹהֶיךָ צַיָּר גָּדוֹל הָיָה", "en": "Your God was a great artist"}, "en": "A certain philosopher once asked Rabban Gamliel, saying to him: ‘Your God is a great artist, however he found many excellent raw materials that helped him: Emptiness, disorder, darkness, wind, water, and depths.’ He said to him: ‘May the spirit of that man depart from him; regarding all of them, creation is written.’ Emptiness and disorder, as it is stated: “Who makes peace and creates evil” (Isaiah 45:7). Darkness, “who forms light [and creates darkness]” (Isaiah 45:7); water, “Praise Him, heavens on heavens, and the water [above the heavens]” (Psalms 148:4). Why? “For He commanded and they were created” (Psalms 148:5). Wind, “For behold, He forms mountains and creates wind” (Amos 4:13); depths, “when there were no depths, I generated” (Proverbs 8:24).", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "﻿פילסופי אחד שאל את רבן גמליאל אמר ליה צייר גדול הוא אלהיכם אלא שמצא סממנים טובים שסייעו אותו תוהו ובוהו וחושך ורוח ומים ותהומות אמר ליה תיפח רוחיה דההוא גברא כולהון כתיב בהן בריאה תוהו ובוהו - שנאמר (ישעיה מה, ז): \"עושה שלום ובורא רע\" חושך - \"יוֹצֵר אוֹר [וּבוֹרֵא חֹשֶׁךְ]\" מים - (תהלים קמח, ה): \"הללוהו שמי השמים והמים\" למה ש\"צוה ונבראו\" רוח (עמוס ד, יג): \"כי הנה יוצר הרים ובורא רוח\" תהומות (משלי ח, כד): \"באין תהומות חוללתי\":", "olang": "he", "source": "Bereshit Rabbah 1:9 (Vilna numbering)", "notes": "Six lines, and they contain the whole crux. A philosopher tells Rabban Gamliel: your God was a great artist, but he found good materials to help him — emptiness, disorder, darkness, wind, water, the deeps. The answer is not an argument but a concordance: may that man's spirit depart, of every one of them creation is written. Tohu and bohu from Isaiah 45:7, 'who makes peace and creates evil'; darkness from the same verse; water from Psalm 148:4–5, 'for he commanded and they were created'; wind from Amos 4:13, 'he forms mountains and creates wind'; the deeps from Proverbs 8:24, 'when there were no deeps I was brought forth'. The list is exactly the list of BR 1:5's embarrassment, and the objection is exactly Augustine's fabri and Basil's smith and carpenter — the craftsman who cannot work without a material. The rabbinic bench meets it once, in a chreia, and answers by producing a verse for each item; the Latin bench meets it as a philosophical position and answers with a doctrine of omnipotence. Neither method would satisfy the other.", "slot": false}, {"id": "pdre-3-7", "short": "pdre-3-7", "author": "Pirkei de-Rabbi Eliezer", "tradition": "rabbinic", "date": 800, "datelabel": "750–850", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["made-from-something-of-god"], "senses": ["literal"], "lemma": {"he": "מִשֶּׁלֶג שֶׁתַּחַת כִּסֵּא הַכָּבוֹד", "en": "from the snow beneath the Throne of Glory"}, "en": "Whence was the earth created? He took of the snow (or ice) which was beneath His Throne of Glory and threw it upon the waters, and the waters became congealed so that the dust of the earth was formed, as it is said, “He saith to the snow, Be thou earth” (Job 37:6).", "translator": "Gerald Friedlander, 1916", "orig": "הָאָרֶץ מֵאֵיזֶה מָקוֹם נִבְרֵאת? מִשֶּׁלֶג שֶׁתַּחַת כִּסֵּא הַכָּבוֹד, לָקַח וְזָרַק עַל הַמַּיִם וְנִקְפְּאוּ הַמַּיִם וְנַעֲשָׂה עֲפַר הָאָרֶץ, שֶׁנֶּאֱמַר (איוב לז, ו): ״כִּי לַשֶּׁלֶג יֹאמַר הֱוֵא אָרֶץ״.", "olang": "he", "source": "Pirkei de-Rabbi Eliezer 3", "notes": "A cosmogony on the rabbinic bench in which the question 'from what?' has an answer, and the answer is a substance. Heaven from the light of his garment (the preceding section, built at K8 as pdre-3-6); earth from the snow under the Throne of Glory, thrown on the waters and congealed, with Job 37:6 for proof — 'he says to the snow, be earth'. Nothing here is made out of nothing, and nothing here is embarrassed about it: the materials are simply divine ones, taken from what is already God's. The Latin bench has no answer of this shape at all, and could not have: once matter is the thing at issue, a material that belongs to God is still a material, and Basil's objection would fall on it as heavily as on Plato's hyle. The two benches are not disagreeing here; only one of them has heard the question.", "slot": false}, {"id": "ibn-ezra-1-1c", "short": "ibn-ezra-1-1c", "author": "Abraham ibn Ezra", "tradition": "rabbinic", "date": 1155, "datelabel": "c. 1155", "place": "Lucca", "lat": 43.84, "lon": 10.5, "answers": ["bara-is-not-ex-nihilo"], "senses": ["literal", "translation"], "lemma": {"he": "בָּרָא", "en": "created"}, "en": "Most commentators have said that creation means bringing forth something from nothing, and thus: “But if Hashem will created a creation” [referring to something never seen before] Bamidbar 16:30. But they have forgotten “And G-d created the crocodiles” Bereshit 1:21, as well as three times in the same verse: “G-d created man in His image…” Bereshit 1:27; “and Who creates darkness” Isaiah 45:7 – which is the opposite of light, which is something. Now here is the precise grammar of the word barat - it has two meanings. One is as stated. The other: “He did not revive them with bread” Samuel II 12:17. In this second one, aleph is in place of hey, for similar to it is “And the whole people came to revive David” – this is in the hif’il verb construction. If it were with an aleph, it would be like “To revive you from the beginning of every grain-gift of Yisrael” Samuel I 2:29. We also find [the same root] in the pi’el verb construction: “You will clear for yourselves there” Joshua 17:15. It’s not like “choose for yourselves a man” Samuel I 17:8, rather like “And He BARAed them” Ezekiel 23:47. And its meaning is to cut, to place a divided border – and the enlightened will understand.", "translator": "Sefaria Community Translation", "orig": "ברא רובי המפרשים אמרו שהבריאה להוציא יש מאין, וכן \"אם בריאה יברא ד'\" (במדבר ט\"ז ל'), והנה שכחו \"ויברא אלהים את התנינים\" (בראשית א כא), ושלש בפסוק אחד, \"ויברא אלהים את האדם\" (בראשית א כז), \"ובורא חושך\" (ישעי' מ\"ה ו') שהוא הפוך האור שהוא יש, וזה דקדוק המלה ברא לשני טעמים זה האחד, והשני \"לא ברא אתם לחם\" (ש\"ב י\"ב י\"ז), וזה השני אל\"ף תחת ה\"א, כי כמוהו \"ויבוא כל העם להברות את דוד\" (ש\"ב ג' ל\"ה), כי הוא מהבנין הכבד הנוסף, ואם היה באל\"ף, היה, כמו \"להבריאכם מראשית כל מנחת ישראל (ש\"א ב' כ\"ט), ומצאנו מהבנין הכבד, \"ובראת לך שם\" (יהושע י\"ז ט\"ו), ואיננו כמו ברו לכם איש (ש\"א י\"ו ח'), רק כמו \"וברא אותהן\" (יחז' כ\"ג מ\"ז), וטעמו, לגזור ולשום גבול נגזר, והמשכיל יבין", "olang": "he", "source": "Ibn Ezra on Gen 1:1, s.v. ברא", "notes": "The crux settled by lexicography, against the whole weight of the doctrine. Most commentators, Ibn Ezra says, have held that bara means bringing forth something from nothing, and they cite Numbers 16:30, 'if the Lord create a creation'. But they have forgotten 'and God created the great sea-creatures' (Gen 1:21), and the three occurrences in one verse at Gen 1:27, 'God created man in his image' — and 'who creates darkness' (Isa 45:7), which is the privation of light, and light is something. The verb has two senses, and the second, from 2 Samuel 12:17, is to cut, to set a bounded edge; and the enlightened will understand. Three verses, and two of them are the two Rupert of Deutz answers in Liège forty years earlier — Gen 1:21 and Gen 1:27, in that order — to save the doctrine that Ibn Ezra is dismantling. Note also which verse Ibn Ezra does not need to reach for: Isaiah 45:7 is Rabban Gamliel's first proof text at BR 1:9, brought there to show that tohu and darkness were created; here 'who creates darkness' is brought to show that the verb does not mean what the doctrine requires.", "slot": false}, {"id": "ramban-1-1c", "short": "ramban-1-1c", "author": "Moses ben Naḥman (Naḥmanides)", "tradition": "rabbinic", "date": 1267, "datelabel": "1263–1270", "place": "Girona", "lat": 41.98, "lon": 2.82, "answers": ["de-nihilo", "hyle-is-tohu", "matter-then-formed"], "senses": ["literal"], "lemma": {"he": "מֵאֲפִיסָה מֻחְלֶטֶת", "en": "from absolute non-existence"}, "en": "Now listen to the correct and clear explanation of the verse in its simplicity. The Holy One, blessed be He, created all things from absolute non-existence. Now we have no expression in the sacred language for bringing forth something from nothing other than the word bara (created). Everything that exists under the sun or above was not made from non-existence at the outset. Instead He brought forth from total and absolute nothing a very thin substance devoid of corporeality but having a power of potency, fit to assume form and to proceed from potentiality into reality. This was the primary matter created by G-d; it is called by the Greeks hyly (matter). After the hyly, He did not create anything, but He formed and made things with it, and from this hyly He brought everything into existence and clothed the forms and put them into a finished condition. Know that the heavens and all that is in them consist of one substance, and the earth and everything that is in it consist of one substance. The Holy One, blessed be He, created these two substances from nothing; they alone were created, and everything else was constructed from them.", "translator": "Charles B. Chavel, 1971–76", "orig": "וְעַתָּה שְׁמַע פֵּרוּשׁ הַמִּקְרָא עַל פְּשׁוּטוֹ נָכוֹן וּבָרוּר. הקב\"ה בָּרָא כָּל הַנִּבְרָאִים מֵאֲפִיסָה מֻחְלֶטֶת. וְאֵין אֶצְלֵנוּ בִּלְשׁוֹן הַקֹּדֶשׁ בְּהוֹצָאַת הַיֵּשׁ מֵאַיִן אֶלָּא לְשׁוֹן \"בָּרָא\"; וְאֵין כָּל הַנַּעֲשֶׂה – תַּחַת הַשֶּׁמֶשׁ אוֹ לְמַעְלָה – הוֹוֶה מִן הָאַיִן הַתְחָלָה רִאשׁוֹנָה. אֲבָל הוֹצִיא מִן הָאֶפֶס הַגָּמוּר הַמֻּחְלָט יְסוֹד דַּק מְאֹד, אֵין בּוֹ מַמָּשׁ, אֲבָל הוּא כֹּחַ מַמְצִיא, מוּכָן לְקַבֵּל הַצּוּרָה וְלָצֵאת מִן הַכֹּחַ אֶל הַפֹּעַל. וְהוּא הַחֹמֶר הָרִאשׁוֹן, נִקְרָא לַיְּוָנִים \"הִיּוּלִי\". וְאַחַר הַהִיּוּלִי לֹא בָּרָא דָּבָר, אֲבָל יָצַר וְעָשָׂה, כִּי מִמֶּנּוּ הִמְצִיא הַכֹּל וְהִלְבִּישׁ הַצּוּרוֹת וְתִקֵּן אוֹתָן. וְדַע, כִּי הַשָּׁמַיִם וְכָל אֲשֶׁר בָּהֶם – חֹמֶר אֶחָד, וְהָאָרֶץ וְכָל אֲשֶׁר בָּהּ – חֹמֶר אֶחָד. והקב\"ה בָּרָא אֵלּוּ שְׁנֵיהֶם מֵאַיִן, וּשְׁנֵיהֶם לְבַדָּם נִבְרָאִים, וְהַכֹּל נַעֲשִׂים מֵהֶם.", "olang": "he", "source": "Ramban on Gen 1:1, s.v. בראשית (the hyle)", "notes": "The rabbinic bench's fullest statement of creation out of nothing, and it is built on the Latin schools' distinction without naming them. The Holy One created all things from absolute non-existence; and there is no expression in the sacred tongue for bringing forth something from nothing except the word bara. Then the qualification that makes the doctrine survive the objection: nothing under the sun or above it was made from non-existence at the outset — what was brought forth from the utter nothing was a very thin substance, without corporeality, having a power of potency, fit to receive form and to pass from potentiality into act; the primary matter, which the Greeks call hyly. After the hyly he created nothing, but formed and made. Two substances only were created, one for the heavens and one for the earth, and everything else was constructed from them. That is Hugh of St Victor's chapter one — God not only made all things out of matter but created the matter of all things out of nothing — reached in Girona a century and a half later with the Greek word intact and no Latin in sight. And the first sentence is aimed at a named man: R. Abraham is Ibn Ezra, quoted and answered a few lines above, who had denied precisely that bara carries the sense Ramban here says it alone carries. Chavel's English shows on Sefaria as CC BY; licence key chavel-ramban is marked for checking before publication.", "slot": false}, {"id": "basil-hex-2-2-materia", "short": "basil-hex-2-2-materia", "author": "Basil of Caesarea", "tradition": "latin", "date": 400, "datelabel": "c. 400", "place": "Caesarea in Cappadocia", "lat": 38.72, "lon": 35.49, "answers": ["de-nihilo", "matter-is-coeval", "craftsman-needs-matter"], "senses": ["literal"], "lemma": {"la": "Quam si dixerimus ingenitam, sine dubio coaequari Deo", "en": "If we call it unbegotten, it is beyond doubt made equal to God"}, "en": "But the detractors of the truth, in no way following the Scriptures in their proper sense and dragging their interpretation to their own judgement, say that by words of this kind the matter of things is shown — matter which was as it were by nature invisible and unordered and formless, and deprived of every appearance and figure, which the craftsman took up and shaped according to his wisdom, and so through it made all the things that are seen. If we call this matter unbegotten, it is beyond doubt made equal to God when it is weighed in the honours it deserves, and it will be judged worthy of the same privileges as he. And what could be more wicked and more criminal than that a thing confused and utterly deformed should be judged endowed with a dignity equal to the wise and powerful and exceedingly good God, the founder of all? Then, if it is so great that it can take in the whole divine discipline, they will nonetheless be seen to make its substance equal to God's power — if indeed the earth is able of itself to measure out the whole wisdom of God. But if matter is less than the divine power, their argument is drawn into a still more atrocious blasphemy; for they try to assert that God is ineffectual and idle in his works because of a poverty of matter. It is the neediness of human nature that deceived them into thinking such things. For with us each art is exercised upon some matter brought to it — smithcraft upon iron, carpentry upon wood — and in these one thing is what underlies, another the form, another what is made out of the form: for matter is what is taken from outside, the form is what the art produces, and the finished thing is what is composed of both, that is, of the form and the matter. So they suppose it is with the divine working too: that the figure was brought to the world out of the wisdom of its founder, but the matter was subjected to the creator from outside; and that the whole world was so constructed, possessing its substance sought from elsewhere, but its figure and shape received from the power of God. […] But God, before the things that are seen came to be, embracing all things in his mind and willing to bring to birth the things that were not, considered what kind of world it ought to be, and generated along with it a matter suited to its form. To heaven he assigned the nature befitting it, and to the shape of the lands he furnished the substance owed to them. Fire and water and air he distinguished as he willed, and led into the order that the account of each demanded. […] Let them cease, then, to handle with fabulous inventions and with the wretched sense of their own thoughts a power incomprehensible to the mind and unspeakable in human words. God made heaven and earth, not each of them by half, but a whole heaven and a whole earth, that is, the very substance taken together with its form. For God is not the deviser of figures, but the creator of the whole nature.", "translator": "claude-draft-approved", "orig": "Sed obtrectatores veritatis, sensu proprio Scripturas minime consequentes, ad suumque arbitrium interpretationem trahentes earum, materiam rerum dicunt per hujuscemodi verba monstrari, quae quasi natura invisibilis et incomposita atque informis erat, et omni specie schemateque privata, quam assumptam artifex pro sua sapientia conformavit, atque ita per eam omnia quae videntur effecit. Quam si dixerimus ingenitam, sine dubio coaequari Deo cum in promerendis aestimatur honoribus, et iisdem quibus ille privilegiis digna censebitur. Quo quid sit nefandius ac sceleratius, quam ut res confusa penitusque deformis, pari dignitate praedita judicetur qua sapiens et potens nimiumque bonus et omnium conditor Deus? Deinde si tanta est ut omnem divinam possit capere disciplinam, nihilominus ejus substantiam Dei videbuntur potentiae coaequare, si tamen valet tellus cunctam per se Dei sapientiam metiri. Sin autem minor est materia divinae potentiae, et sic in atrociorem blasphemiam eorum sermo ducetur; quippe qui propter inopiam materiae, inefficacem et otiosum in suis operibus Deum conantur asserere, quos quidem humanae naturae talia sentire decepit indigentia. Sane quoniam apud nos ars unaquaeque erga aliquam adhibitam materiam exercetur, sicut fabrilitas circa ferrum, carpentaria circa lignum, et in his aliud est quod subjacet, aliud species, aliud quod formatur ex specie: nam materia est quae extrinsecus assumitur, species quae ex arte producitur, perfectio autem est quae ex utraque componitur, id est de specie atque materia: sic opinantur et de divina operatione, schema quidem mundo de sapientia conditoris allatum, materiam vero extrinsecus creatori fuisse subjectam: atque ita universum mundum esse constructum, qui substantiam quidem possidet aliunde quaesitam, schema vero et figuram, ex Dei virtute perceptam. Hinc illis datur occasio negandi, causis Deum praeesse mundanis, et tanquam stipis alicujus rerum geniturae portionem exiguam contulisse: minime valentes, propter intellectus inopiam, ad culmen respicere veritatis. Nec considerarunt quia hic quidem ars post materiam noscitur adhibita, vitae gratia dispensandae. Nam lana quidem fuit anterior, texendi autem usus postea repertus est, ut id quod per naturam minus fuerat suppleretur ex arte; lignum quoque prius fuit, quod ars dolatoria postmodum percipiens, in ususque necessarios formans, commoditatem nobis non parvam contulit. Nam et remum nautis, et agricultoribus ventilabrum, et bellatoribus hastam dedit. Deus autem, priusquam fierent quae videntur, omnia mente complexus, volensque in nativitatem producere quae non erant, consideravit qualis mundus esse deberet, ejusque speciei congruam materiam congeneravit. Et coelo quidem deputavit decentem sibi naturam, terrarum vero schemati familiarem debitamque substantiam commodavit. Ignem vero, et aquam, et aerem distinxit ut voluit: et in ordinem deduxit quem singulorum ratio flagitabat. Totum autem mundum, cum esset sui dissimilis, et ex diversitate compositus, inviolabilibus cujusdam concordiae vinculis arctatum, in unam societatem compaginationemque devinxit, ut etiam illa quae multum a se positione distabant, permixtione mutua copulata credantur. Cessent ergo fabulosis figmentis, ac miserabili suarum cogitationum sensu virtutem mente incomprehensibilem et humanis sermonibus ineffabilem contrectare. 3. Fecit Deus coelum et terram, non singula ex dimidia parte, sed integrum coelum et integram terram, id est ipsam substantiam cum specie comprehensam. Non enim schematum repertor est Deus, sed totius naturae creator.", "olang": "la", "source": "PL 53, col. 880C", "notes": "The Greek bench's answer, and the argument it refutes is the philosopher's at Bereshit Rabbah 1:9 stated as a philosophy. Those who read 'invisible and unordered' as a description of an unbegotten matter make that matter God's equal in honour, since whatever is unbegotten shares his privilege; and if the matter is instead less than God, they have made God poor. Then the diagnosis, and it is the same analogy the philosopher used and Augustine will use: with us every art works on a material brought to it, smithcraft on iron and carpentry on wood, so that the finished thing is composed of a form supplied by the art and a substance supplied from outside — and they project this on the divine working, giving God the shape of the world and someone else the stuff of it. Basil's answer is that God generated the matter along with the form it was to have, and made not half of heaven and half of earth but the whole substance with its form: he is not the deviser of figures but the creator of the whole nature. The paragraph before this one is K6's basil-hex-2-4. Two elisions are marked in the English: at PL 53:881B, 'Hinc illis datur occasio … commoditatem nobis non parvam contulit', where Basil argues that the human arts came after their materials (wool before weaving, wood before the adze) and that God's making is the reverse; and at PL 53:881C, 'Totum autem mundum … permixtione mutua copulata credantur', on the bonds of concord that hold the unlike world together. The Latin excerpt is continuous.", "slot": false}, {"id": "ambrose-hex-1-1-hyle", "short": "ambrose-hex-1-1-hyle", "author": "Ambrose", "tradition": "latin", "date": 387, "datelabel": "c. 387", "place": "Milan", "lat": 45.46, "lon": 9.19, "answers": ["three-principles", "matter-is-coeval"], "senses": ["literal"], "lemma": {"la": "de materia, quam vocant hylen", "en": "out of the matter which they call hyle"}, "en": "Have men taken up so much opinion that some of them set up three principles of all things — God, and the exemplar, and matter — and asserted that these are incorruptible and uncreated and without beginning, as Plato and his disciples do; and that God made the world not as the creator of matter but as a craftsman looking to an exemplar, that is, to an idea, out of the matter which they call hyle, which is said to have given the causes of generation to all things; and thought the world itself too incorruptible, neither created nor made? Others also, as Aristotle with his followers thought fit to argue, laid down two principles, matter and form, and a third along with them, which is called operative, to which it should belong to bring about fitly what it had judged should be undertaken.", "translator": "claude-draft-approved", "orig": "Tantumne opinionis assumpsisse homines, ut aliqui eorum tria principia constituerent omnium, Deum, et exemplar, et materiam, sicut Plato discipulique ejus; et ea incorrupta, et increata, ac sine initio esse asseverarent: Deumque non tamquam creatorem materiae, sed tamquam artificem ad exemplar, hoc est, ideam intendentem, fecisse mundum de materia, quam vocant hylen, quae gignendi causas rebus omnibus dedisse asseratur: ipsum quoque 2 mundum incorruptum, nec creatum, aut factum existimarent: alii quoque, ut Aristoteles cum suis disputandum putavit, duo principia ponerent, materiam et speciem, et tertium cum iis, quod operatorium dicitur, cui suppeteret competenter efficere, quod adoriundum putasset.", "olang": "la", "source": "PL 14, col. 123A", "notes": "The opening sentence of the Hexaemeron, and the whole Latin bench's account of the opposition is settled in it. Plato: three principles, God and the exemplar and matter, all three incorruptible, uncreated and without beginning, with God a craftsman looking to an idea rather than the maker of the stuff — and the stuff is named, hyle. Aristotle: two principles, matter and form, with a third operative one. Every later Latin witness on this crux repeats one or both lists, usually without naming Ambrose: Remigius has the three at PL 131:53D (K1 sliced it), Hugh of St Victor has them as opifex, materia and forma, Comestor has all three philosophers with Epicurus added and hyle spelt ile. What none of them repeats is the reason Ambrose gives immediately afterwards for Moses' having written as he did — that passage is at PL 14:124B and was built for K1 as ambrose-hex-1-2, so this crux takes the doxography and leaves the answer where it stands.", "slot": false}, {"id": "aug-conf-12-7", "short": "aug-conf-12-7", "author": "Augustine", "tradition": "latin", "date": 398, "datelabel": "397–401", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["de-nihilo", "matter-then-formed"], "senses": ["literal"], "lemma": {"la": "unum prope te, alterum prope nihil", "en": "one near to you, the other near to nothing"}, "en": "And whence had it any being at all, unless it were from you, from whom are all things in whatever measure they are? Yet the further from you the more unlike — and not by places. And so you, Lord, who are not one thing at one time and another otherwise, but the selfsame and the selfsame and the selfsame, Holy, Holy, Holy, Lord God almighty (Isa 6:3): in the Beginning which is from you, in your Wisdom which was born of your substance, you made something, and made it out of nothing. For you made heaven and earth; not out of yourself, for then it would be equal to your Only-begotten and thereby to you, and it would in no way be just that what was not out of you should be equal to you. And there was nothing else besides you out of which you might make them, God, one Trinity and threefold Unity: and therefore you made heaven and earth out of nothing, a great something and a small something; since you are almighty and good, to make all things good, a great heaven and a small earth. You were, and there was nothing else out of which you made heaven and earth, two somethings: one near to you, the other near to nothing; one than which you alone were higher, the other than which nothing was lower.", "translator": "claude-draft-approved", "orig": "Et unde utcumque erat, nisi esset abs te, a quo sunt omnia in quantumcumque sunt? Sed tanto a te longius, quanto dissimilius; neque enim locis. Itaque tu, Domine, qui non es alias aliud et alias aliter, sed idipsum et idipsum et idipsum, Sanctus, Sanctus, Sanctus Dominus Deus omnipotens (Isai. VI, 3) ; in Principio quod est de te, in Sapientia tua quae nata est de substantia tua, fecisti aliquid et de nihilo. Fecisti enim coelum et terram; non de te: nam esset aequale Unigenito tuo, ac per hoc et tibi; et nullo modo justum esset, ut aequale tibi esset, quod de te non esset. Et aliud praeter te non erat unde faceres ea, Deus una Trinitas, et trina Unitas: et ideo de nihilo fecisti coelum et terram, magnum quiddam et parvum quiddam; quoniam omnipotens et bonus es ad facienda omnia bona, magnum coelum et parvam terram. Tu eras, et aliud nihil unde fecisti coelum et terram, duo quaedam; unum prope te, alterum prope nihil: unum, quo superior tu esses; alterum, quo inferius nihil esset.", "olang": "la", "source": "PL 32, col. 828", "notes": "The doctrine argued as a dilemma with two horns and no third. Whatever is, is from God; but heaven and earth are not made out of God, for what is out of God is the Only-begotten and equal to him; and there was nothing else besides God out of which to make them; therefore they were made out of nothing. Then the phrase that the rest of Book XII turns on: two somethings, one near to God and one near to nothing — the heaven of heaven and the formless matter — one than which God alone is higher, one than which nothing is lower. Augustine will not say that the matter is nothing, and he will not say that it is something in its own right; prope nihil is a position built to be unavailable to both objections at once. Bereshit Rabbah 1:5 stands at the same place and does not have the phrase, and so has to say the thing plainly and apologise for it.", "slot": false}, {"id": "aug-conf-12-22", "short": "aug-conf-12-22", "author": "Augustine", "tradition": "latin", "date": 398, "datelabel": "397–401", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["de-nihilo", "silence-proves-nothing"], "senses": ["literal"], "lemma": {"la": "cur non informem quoque illam materiem … a Deo factam esse de nihilo", "en": "why should we not understand that the formless matter too was made by God out of nothing"}, "en": "Hence if Genesis has passed over in silence something that God made — which nevertheless neither sound faith nor sure understanding doubts that God made — no sober teaching will on that account dare to say that those waters are coeternal with God, merely because we have heard them mentioned in the book of Genesis but do not find where they were made. Why then should we not understand, with truth teaching us, that the formless matter also, which this Scripture calls the invisible and unordered earth and the dark deep, was made by God out of nothing, and is therefore not coeternal with him — although this narrative has omitted to state where it was made?", "translator": "claude-draft-approved", "orig": "Unde si aliquid Genesis tacuit Deum fecisse, quod tamen Deum fecisse nec sana fides, nec certus ambigit intellectus; nec ideo ulla sobria doctrina dicere audebit istas aquas coaeternas Deo, quia in libro Geneseos commemoratas quidem audivimus, ubi autem factae sint non invenimus: cur non informem quoque illam materiem, quam Scriptura haec terram invisibilem et incompositam, tenebrosamque abyssum appellat, docente veritate intelligamus a Deo factam esse de nihilo, ideoque illi non esse coaeternam, quamvis ubi facta sit, omiserit enuntiare ista narratio?", "olang": "la", "source": "PL 32, col. 838", "notes": "The argument that had to be made because the doctrine has no verse. Genesis never says that God made the formless matter, and the objection from that silence is real; Augustine answers it with a second silence in the same chapter. The waters above the firmament are mentioned and their making is never narrated either, and nobody is willing to call them coeternal with God — so the silence cannot be what decides. It is exactly the ground the philosopher takes at Bereshit Rabbah 1:9, and Rabban Gamliel's answer is the opposite method: not an argument about what silence can prove, but a verse produced for each item on the list, tohu from Isaiah, darkness from Isaiah, the waters from the Psalm, the wind from Amos, the deeps from Proverbs. Augustine has the more general answer and Rabban Gamliel the more convincing one, and neither could have used the other's.", "slot": false}, {"id": "aug-gnm-1-6-10", "short": "aug-gnm-1-6-10", "author": "Augustine", "tradition": "latin", "date": 389, "datelabel": "388–389", "place": "Thagaste", "lat": 36.29, "lon": 7.95, "answers": ["de-nihilo", "craftsman-needs-matter", "matter-then-formed"], "senses": ["literal"], "lemma": {"la": "cum considerant fabros et quoslibet opifices non posse aliquid fabricare, nisi habuerint unde fabricent", "en": "when they consider that craftsmen and workmen of any kind cannot make anything unless they have something to make it from"}, "en": "And therefore God is most rightly believed to have made all things out of nothing: because even if all formed things were made out of that matter, that matter itself was made out of nothing at all. For we ought not to be like those who do not believe that almighty God could make anything out of nothing, when they consider that craftsmen and workmen of any kind cannot make anything unless they have something to make it from. For wood helps the craftsman, and silver helps the silversmith, and gold the goldsmith, and earth helps the potter to be able to finish his works. If they are not helped by that matter out of which they make something, they can make nothing, since they do not themselves make the matter. For the craftsman does not make the wood, but makes something out of wood: and so all other workmen of this kind. But almighty God had no need to be helped by any thing that he had not himself made, in order to bring about what he willed. For if some thing that he had not himself made helped him towards the things he willed to make, he was not almighty: which it is sacrilege to believe.", "translator": "claude-draft-approved", "orig": "Et ideo Deus rectissime creditur omnia de nihilo fecisse, quia etiamsi omnia formata de ista materia facta sunt, haec ipsa materia tamen de omnino nihilo facta est. Non enim debemus esse similes istis qui omnipotentem Deum non credunt aliquid de nihilo facere potuisse, cum considerant fabros et quoslibet opifices non posse aliquid fabricare, nisi habuerint unde fabricent. Et ligna enim adjuvant fabrum, et argentum adjuvat argentarium, et aurum aurificem, et terra figulum adjuvat ut possit perficere opera sua. Si enim non adjuventur ea materia unde aliquid faciunt, nihil possunt facere, cum materiam ipsam ipsi non faciant. Non enim faber lignum facit, sed de ligno facit aliquid: sic et caeteri omnes hujusmodi opifices. Omnipotens autem Deus nulla re adjuvandus erat, quam ipse non fecerat, ut quod volebat efficeret. Si enim ad eas res quas facere volebat, adjuvabat eum aliqua res quam ipse non fecerat, non erat omnipotens: quod sacrilegum est credere.", "olang": "la", "source": "PL 34, col. 178", "notes": "The chapter Migne heads 'Formless matter out of nothing, and out of it all things', and the argument in it is the one this whole crux turns on. Augustine grants that everything formed was made out of the formless matter and then puts the doctrine one step further back: the matter itself was made out of nothing at all. The objection he answers is not a text but a habit of mind — people cannot believe God made anything out of nothing because they are watching craftsmen, and wood helps the carpenter, silver the silversmith, gold the goldsmith, earth the potter. It is the philosopher's sentence at Bereshit Rabbah 1:9 with the trades filled in, made in Thagaste sixty years before the Galilean compilation and independently of it; and the refutation turns on omnipotence rather than on Scripture — if anything God had not made helped him, he was not almighty. Wigbod copies this chapter to the last clause, and Angelomus rewrites it with the trades kept and the source dropped.", "slot": false}, {"id": "bede-gen-1-2-materia", "short": "bede-gen-1-2-materia", "author": "Bede", "tradition": "latin", "date": 720, "datelabel": "717–725", "place": "Jarrow", "lat": 54.98, "lon": -1.49, "answers": ["matter-then-formed", "pair-is-formless-matter"], "senses": ["literal"], "lemma": {"la": "vel de ipsis exordium naturae, vel sumpsere de nihilo", "en": "either took the beginning of their nature from these, or took it out of nothing"}, "en": "Only to this extent is that matter formless out of which Scripture testifies that the world was made, when it says in the praises of God: 'You who made the world out of formless matter' (Wis 11:17). For all the things which we are accustomed to see in the world along with the waters and the earth either took the beginning of their nature from these, or took it out of nothing; but the earth itself and the waters themselves have received the name of formless matter for this reason, that before they came into the light there was nothing from which they might have comeliness.", "translator": "claude-draft-approved", "orig": "Ad haec tantum informis est illa materies, de qua mundum esse factum testatur Scriptura, quae in Dei laudibus dicit: Qui fecisti mundum de materia informi. Nam cuncta quae cum aquis et terra videre solemus in mundo, vel de ipsis exordium naturae, vel sumpsere de nihilo; ipsa autem terra et ipsae aquae propterea nomen sortitae sunt materiae informis, quia priusquam in lucem venirent, unde formositatem haberent non erat.", "olang": "la", "source": "PL 91, col. 15C", "notes": "Bede taking the sting out of the word. Wisdom 11:17 says the world was made out of formless matter, and the whole Latin difficulty is in that verse: it appears to concede the philosopher's point in Scripture's own voice. Bede's answer is a restriction — the matter is formless only to this extent, that the earth and the waters had nothing to give them comeliness until the light came — so that 'formless matter' names two visible things at a stage of their history, not a substrate. And the sentence that follows keeps both possibilities open without choosing: what we see either began from the earth and the waters, or was taken out of nothing. Rabanus copies this paragraph verbatim at PL 107:446C and the Glossa prints it condensed at 113:69D–70A, which is where most readers after 1150 met it.", "slot": false}, {"id": "alcuin-int-19-20", "short": "alcuin-int-19-20", "author": "Alcuin", "tradition": "latin", "date": 796, "datelabel": "c. 796", "place": "Tours", "lat": 47.39, "lon": 0.69, "answers": ["de-nihilo", "matter-then-formed", "simul"], "senses": ["literal"], "lemma": {"la": "Quae creaturae de nihilo factae sunt?", "en": "Which creatures were made out of nothing?"}, "en": "Question 19. In how many ways is the divine working? — Answer. Four. First, that in the dispensation of the Word of God all things are eternal. Second, that in formless matter he who lives for ever created all things at once (Sir 18:1). Third, that through the works of the six days he distinguished the various creatures. Fourth, that out of the primordial seeds natures do not arise unknown, but known ones are more often re-formed, lest they perish. Question 20. Which creatures were made out of nothing? — Answer. Heaven, earth, angels, light, air, water, and the soul of man.", "translator": "claude-draft-approved", "orig": "Inter. 19. Quot modis est operatio divina?-- Resp. Quatuor. Primo, quod in verbi [Dei] dispensatione omnia aeterna sunt. Secundo, quod in materia informi qui vivit in aeternum, creavit omnia simul (Eccl. XVIII, 1) . Tertio, quod per opera dierum sex varias distinxit creaturas. Quarto, quod ex primordialibus seminibus non incognitae oriuntur naturae, sed notae saepius, ne pereant, reformantur. Inter. 20. Quae creaturae de nihilo factae sunt?-- Resp. Coelum, terra, angeli, lux, aer, aqua [et] anima hominis.", "olang": "la", "source": "PL 100, col. 519A", "notes": "The crux turned into a list a pupil can memorise, and the list is the Latin bench's only counterpart to the rabbinic enumerations. Seven items made out of nothing: heaven, earth, angels, light, air, water, the soul of man. Set it beside Rav Yehudah in Rav's name at b. Chagigah 12a — ten things created on the first day: heaven and earth, chaos and desolation, light and darkness, wind and waters, the measure of the day and the measure of the night — and beside Pirkei de-Rabbi Eliezer 3's eight, and the shape of the answer is identical while the contents diverge exactly where the doctrines diverge. Alcuin's list has angels and the human soul on it, which no rabbinic list has; the rabbinic lists have tohu and bohu on them, which is the one thing Alcuin's question is designed to exclude. The four modes in question 19 are Augustine's, with Sirach 18:1 for the second, and they are what makes the list possible: 'created all things at once' in formless matter is the mode under which the seven are all made out of nothing together.", "slot": false}, {"id": "wigbod-gen-1-1c", "short": "wigbod-gen-1-1c", "author": "Wigbod", "tradition": "latin", "date": 790, "datelabel": "c. 790", "place": "Luxeuil", "lat": 47.82, "lon": 6.38, "answers": ["de-nihilo", "craftsman-needs-matter"], "senses": ["literal"], "lemma": {"la": "Non enim faber facit lignum, sed de ligno aliquid facit", "en": "For the craftsman does not make the wood, but makes something out of wood"}, "en": "And therefore God is most rightly believed to have made all things out of nothing: because even if all formed things were made out of that matter, that matter itself was made out of nothing. For we ought not to be like those who do not believe that almighty God could make anything out of nothing, when they consider that craftsmen and workmen of any kind cannot make anything unless they have something to make it from. For wood helps the craftsman, and silver helps the silversmith, and gold the goldsmith, and earth helps the potter to be able to finish his works. If they are not helped by that matter out of which they make something, they can make nothing, since they themselves do not make the matter. For the craftsman does not make the wood, but makes something out of wood: and so all other workmen. But almighty God had no need to be helped by any thing that he had not himself made, in order to bring about what he willed; for if some thing that he had not himself made helped him towards the things he willed to make, he was not almighty: which it is sacrilege to believe.", "translator": "claude-draft-approved", "orig": "Et ideo Deus rectissime creditur omnia de nihilo fecisse, quia etiamsi omnia formata de ista materia facta sunt, haec ipsa tamen materia de nihilo facta est. Non enim debemus esse similes istis, qui omnipotentem Deum non credunt aliquid de nihilo facere potuisse, cum considerant fabros et quoslibet opifices non posse aliquid fabricare, nisi habuerint unde fabricent. Et ligna enim adjuvant fabrum, et argentum adjuvat argentarium, et aurum aurificem, et terra figulum adjuvat, ut possit perficere opera sua. Si enim non adjuventur ea materia unde aliquid faciunt, nihil possunt facere, cum materiam ipsam non ipsi faciunt. Non enim faber facit lignum, sed de ligno aliquid facit, sic et caeteri omnes opifices. Omnipotens autem Deus nulla re adjuvandus erat, quam ipse non fecerat, ut quod volebat efficeret; si enim ad eas res quas facere volebat, adjuvabat eum aliqua res quam ipse non fecerat, non erat omnipotens; quod sacrilegum est credere.", "olang": "la", "source": "PL 96, col. 1113B", "notes": "Wigbod copying Augustine, and this time he copies everything. At K1 his method was the interesting thing about him: he takes over Jerome's discussion of 'in the beginning' and drops precisely the sentence in which Jerome refutes the reading 'in the Son' from the Hebrew, so that the objection survives in the Carolingian schools and the answer does not. Here he takes over De Genesi contra Manichaeos I.6.10 without losing a clause — the four trades, the wood that the carpenter does not make, the argument from omnipotence, the word sacrilegium at the end. What he drops in the one place and keeps in the other is a fair index of what a Carolingian compiler thought was load-bearing: philology about a Hebrew word is expendable, an argument that secures omnipotence is not. He reads 'de nihilo facta est' where Augustine has 'de omnino nihilo'.", "slot": false}, {"id": "angelom-gen-1-1c", "short": "angelom-gen-1-1c", "author": "Angelomus of Luxeuil", "tradition": "latin", "date": 850, "datelabel": "c. 850", "place": "Luxeuil", "lat": 47.82, "lon": 6.38, "answers": ["de-nihilo", "craftsman-needs-matter", "matter-then-formed"], "senses": ["literal"], "lemma": {"la": "Ista propterea dicunt, quia attendunt fabrum, et non Deum", "en": "They say these things because they attend to the craftsman and not to God"}, "en": "For God founded formless matter out of nothing, and out of it created all things, according to what is written in the book of Wisdom: 'For your hand, Lord, was not powerless, which created the world out of formless matter' (Wis 11:17). Whence the philosophers, as has already been said, not being able to penetrate how the divine Wisdom created the world out of nothing, reckoned the world to be coeternal. They say these things because they attend to the craftsman and not to God. For they say: wood helps the craftsman, and silver the silversmith, and gold the goldsmith. Yet although they need these, they cannot create. But the Lord needed none of these, and founded all things out of formless matter, not outside himself as a craftsman does — for the craftsman does not make the wood, but makes something out of wood. And the almighty had no need to be helped by any thing that he had not himself made in order to bring about what he willed; otherwise he would not be God.", "translator": "claude-draft-approved", "orig": "Deus enim ex nihilo condidit informem materiam, et ex ipsa cuncta creavit, juxta quod scriptum est in libro Sapientiae: Non enim erat manus tua, Domine, invalida, qua creasti mundum ex informi materia (Sap. XI, 18) . Unde philosophi, prout jam dictum est, non valentes penetrare quemadmodum divina Sapientia mundum creavit ex nihilo, aestimabant coaeternum esse mundum. Ista propterea dicunt, quia attendunt fabrum, et non Deum. Aiunt enim: Lignum adjuvat fabrum, et argentum argentarium, et aurum aurificem. His enim quamvis indigeant, tamen creare nequeunt. Dominus autem nihil horum indiguit, sed ex informi materia condidit omnia, non extra se tanquam faber (non enim faber facit lignum, sed de ligno aliquid facit). Omnipotens autem nulla re adjuvandus erat, quam ipse non fecerat, ut quod volebat efficeret, alioquin Deus non esset.", "olang": "la", "source": "PL 115, col. 114B", "notes": "Augustine's argument rewritten, and the rewriting turns it into a report of a debate. Where Augustine says 'we ought not to be like those who…', Angelomus says 'they say these things because they attend to the craftsman and not to God' and then quotes them: aiunt enim, lignum adjuvat fabrum, et argentum argentarium, et aurum aurificem. The objection has become a speech with a speaker, which is the form it has at Bereshit Rabbah 1:9 and nowhere else on the Latin bench — and, as there, the speaker is a philosopher and is not named. Angelomus adds the diagnosis Augustine does not give: it is because they could not penetrate how Wisdom created the world out of nothing that they concluded the world is coeternal. The paragraph immediately before this one is his analogy of sound and song for how formless matter precedes the formed creature in origin only, not in time; the one immediately after is Augustine's question about why the verse does not say 'let there be', which K5 built as angelom-gen-1-1b.", "slot": false}, {"id": "glossa-1-2-materia", "short": "glossa-1-2-materia", "author": "Glossa ordinaria (school of Laon)", "tradition": "latin", "date": 1120, "datelabel": "compilation 1110–1130", "place": "Laon", "lat": 49.56, "lon": 3.62, "answers": ["matter-then-formed", "pair-is-formless-matter"], "senses": ["literal"], "lemma": {"la": "Ipsa autem terra et aqua informis dicuntur materia", "en": "But the earth itself and the water are called formless matter"}, "en": "(Bede, in the place cited.) 'There was darkness,' etc. Those are not to be listened to who say by way of reproach that God created darkness before light: for he made no darkness in the water or the air; but by a distinct order of providence he first created the waters together with heaven, and the earth, and adorned them with the grace of light when he willed. And note that with heaven two elements of the world were created, into which two others were inserted, namely water and earth, in which are fire and air. The waters covered the whole surface of the earth to such a height that they reached to those places where they still in part remain above the firmament. But the earth itself and the water are called formless matter, because all the things we see either took their beginning out of these, or out of nothing: and before they came into the light there was nothing from which they might have form.", "translator": "claude-draft-approved", "orig": "(BEDA ubi supra.) « Tenebrae erant, » etc. Non sunt audiendi qui reprehendendo dicunt Deum prius creasse tenebras quam lucem: quia nullas in aqua, vel aere fecit tenebras; sed distincto ordine providentiae prius aquas cum coelo creavit, et terra, et has cum voluit lucis gratia venustavit. Et notandum quod cum coelo duo elementa mundi creata sunt, quibus alia duo inserta sunt, aqua, scilicet, et terra, quibus insunt ignis et aer. Aquae autem totam superficiem terrae tanta altitudine tegebant, ut ad illos usque locos pertingerent, ubi nunc usque super firmamentum partim resident. Ipsa autem terra et aqua informis dicuntur materia, quia omnia quae videmus, vel ex istis sumpserunt exordium, vel ex nihilo: et priusquam in lucem venirent, non erat unde formam haberent.", "olang": "la", "source": "PL 113, col. 69D", "notes": "The third of the Glossa's marginal glosses on Gen 1:2, Bede again, and it is the only place in the Glossa on this verse where formless matter is defined. Bede's paragraph at PL 91:15C is here cut to its last two sentences and lightly rewritten — 'omnia quae videmus, vel ex istis sumpserunt exordium, vel ex nihilo' for Bede's 'cuncta quae cum aquis et terra videre solemus in mundo, vel de ipsis exordium naturae, vel sumpsere de nihilo' — and the qualification that made Bede's sentence careful, that the matter is formless only to this extent, is gone with the sentence that carried it. What a twelfth-century reader met in the margin, then, is the flat statement that earth and water are called formless matter, with the alternative 'or out of nothing' still attached and no longer doing any work. The first half of this gloss, on the darkness, belongs to K9; the two glosses printed before it on the same lemma are K6's glossa-1-2-terra and the Strabo gloss carried inside K7's glossa-1-2-ruach.", "slot": false}, {"id": "rupert-gen-1-1c", "short": "rupert-gen-1-1c", "author": "Rupert of Deutz", "tradition": "latin", "date": 1115, "datelabel": "1112–1117", "place": "Liège", "lat": 50.63, "lon": 5.57, "answers": ["de-nihilo", "creare-vs-formare", "bara-is-not-ex-nihilo"], "senses": ["literal"], "lemma": {"la": "Quod si quis objiciat hominem quoque, cum non de nihilo, sed de terra factus sit, creatum dici", "en": "But if anyone should object that man too, though made not out of nothing but out of the earth, is said to be created"}, "en": "But if anyone should object that man too, though made not out of nothing but out of the earth, is said to be created — as it is written, 'And God created man to his own image; to the image of God he created him' (Gen 1:27); or again what is likewise said, 'And God created the great sea-creatures' (Gen 1:21) — we say to this that it is rightly said, but in this respect only, that the matter out of which those forms were produced or taken had already been created. And by these names, that is heaven and earth, as was said above, the whole creation visible and invisible together is signified. That nothing is excepted is proved from the apostolic creed also, in which we say: I believe in God the Father almighty, creator of heaven and earth — adding nothing of the creatures; we do not doubt that under these names we have taken in all things visible and invisible together. For in the other creed of the catholic faith no less, when we say: I believe in one God the Father almighty, maker of heaven and earth, at once, explaining what we have said by heaven and earth, we add: of all things visible and invisible. Therefore what is said, 'in the beginning God created heaven and earth', is the same as if it were said: through his Son, God the Father created the whole substance of all things visible and invisible, such as yet as the earth that follows expresses: 'But the earth was empty and void.'", "translator": "claude-draft-approved", "orig": "Quod si quis objiciat hominem quoque, cum non de nihilo, sed de terra factus sit, creatum dici, sicut scriptum est: Et creavit Deus hominem ad imaginem suam, ad imaginem Dei creavit illum; vel quod item dictum est: Creavitque Deus cete grandia; dicimus ad haec, recte dictum, eo duntaxat respectu quia jam ipsa, de qua productae vel sumptae sunt species, creata fuerat materia, quibus nominibus, scilicet coelo et terra, ut supra dictum est, significari universam creaturam visibilem et invisibilem simul. Et nihil excipi, ex symbolo quoque comprobatur apostolico, quocum dicimus: Credo in Deum, Patrem omnipotentem, creatorem coeli et terrae, nihil creaturarum adjicientes, cuncta his nominibus visibilia simul et invisibilia, nos comprehendisse non dubitamus. Nam in alio nihilominus catholico fidei symbolo cum dicimus: Credo in unum Deum, Patrem omnipotentem, factorem coeli et terrae, statim exponentes quid dixerimus coeli et terrae, subjungimus visibilium omnium et invisibilium. Igitur, quod dictum est, in principio creavit Deus coelum et terram, idem est ac si diceretur: Per Filium suum Deus Pater creavit omnium visibilium et invisibilium substantiam universam, talem adhuc qualem subsecutus terram exprimit: Terra autem erat inanis et vacua.", "olang": "la", "source": "PL 167, col. 202C", "notes": "A Latin abbot meeting the objection from usage and answering it with a distinction, forty years before Ibn Ezra meets the same objection from the same verses and lets it stand. The objection: Scripture uses creavit of man, who was made out of the earth (Gen 1:27), and of the sea-creatures (Gen 1:21) — so the verb cannot carry the sense the doctrine needs. Rupert's answer is that the word is rightly used there, but only in the respect that the matter from which those things were shaped had itself already been created; the verb reaches back through the shaping to the creation of the stuff. He then secures the scope of Gen 1:1 from the creeds rather than from Genesis: creatorem coeli et terrae in the apostolic creed adds nothing after it, and the other creed glosses the pair as visibilium omnium et invisibilium. Ibn Ezra brings Gen 1:21 and Gen 1:27 in that same order and concludes instead that bara simply has a second sense. The sentence immediately before this one, in which Rupert refuses the philosophers' coeval hyle by name, is inside the slice K1 built as rupert-gen-1-1.", "slot": false}, {"id": "abelard-hex-1-1c", "short": "abelard-hex-1-1c", "author": "Peter Abelard", "tradition": "latin", "date": 1130, "datelabel": "c. 1130", "place": "The Paraclete (Nogent-sur-Seine)", "lat": 48.49, "lon": 3.5, "answers": ["creare-vs-formare", "de-nihilo"], "senses": ["literal", "translation"], "lemma": {"la": "creari proprie id dicitur, quod de non esse ita ad esse producitur, ut praejacentem non habeat materiam", "en": "that is properly said to be created which is so brought forth from non-being to being that it has no pre-existing matter"}, "en": "And it is well said of the elements 'created' rather than 'formed', because that is properly said to be created which is so brought forth from non-being to being that it has no pre-existing matter, and did not first subsist in any state of nature. But when something is made out of matter already prepared, by the joining on of a form, that is rightly said to be formed — as is what is set down in what follows: 'The Lord God therefore formed man of the slime of the earth' (Gen 2:7). And again: 'All the animals of the earth therefore having been formed out of the ground' (Gen 2:19). For when a pre-existing matter is denoted — as when 'out of the ground' is put first, since it was to be formed into some appearance — then a thing is most rightly said to be formed.", "translator": "claude-draft-approved", "orig": "Bene autem de elementis dictum est, creavit, potius quam formavit, quia creari proprie id dicitur, quod de non esse ita ad esse producitur, ut praejacentem non habeat materiam, nec in aliquo primitus subsisteret naturae statu. Cum autem de ipsa jam materia praeparata adjunctione formae aliquid fit, recte illud formari dicitur, sicut est illud quod in sequentibus ponitur: Formavit igitur hominem de limo terrae (Gen. II, 7) . Et iterum: Formatis igitur de humo cunctis animantibus terrae (ibid., 19) . Cum enim praejacens materia denotatur, veluti cum praemittitur de humo quoniam in speciem aliquam formaretur, tunc rectissime formari dicitur.", "olang": "la", "source": "PL 178, col. 734B", "notes": "The distinction stated as a rule about two Latin verbs, and the rule is exactly what Ibn Ezra denies about the one Hebrew verb underlying both. Creare is properly said of what is brought from non-being to being with no pre-existing matter and no prior state of nature; formare of what is made out of matter already prepared by the joining on of a form. The proof is the usage of Genesis itself: formavit hominem de limo terrae at 2:7, formatis de humo cunctis animantibus at 2:19 — where the material is named first, the verb is formavit. Abelard is reading a Latin translation, and the two verbs he separates render two different Hebrew verbs at 2:7 and 2:19 but not at 1:21 and 1:27, where the Hebrew has bara and the Latin has creavit of things made out of something. That is the gap Rupert closes with a distinction and Ibn Ezra widens into a lexical entry, and none of the three has read either of the others.", "slot": false}, {"id": "hugh-sacr-1-1-nihilo", "short": "hugh-sacr-1-1-nihilo", "author": "Hugh of St Victor", "tradition": "latin", "date": 1134, "datelabel": "1130–1137", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["de-nihilo", "creare-vs-formare", "three-principles"], "senses": ["literal"], "lemma": {"la": "non solum ex materia fecit, sed materiam omnium ipse de nihilo creavit", "en": "he not only made them out of matter, but himself created the matter of all things out of nothing"}, "en": "'In the beginning God created heaven and earth' (Gen 1:1). What was created was made out of nothing. For what was made out of something was indeed made, but was not created, because it was not made out of nothing. God therefore made heaven and earth; and not only made but created, that is, made out of nothing. The philosophers of the gentiles laid down three principles of things without a principle: the workman, matter, and form — professing that all the things that were made were brought forth out of matter into form through the workman. But they professed God to be only a maker and not a creator. The true faith, however, confesses one only first principle, which always was; and through it alone it came about that what once was not should be. And the power of his unspeakable omnipotence, just as it could not have anything coeternal besides itself by which it might be helped in making, so it had at hand, when it willed, that what it willed and when and how much it willed should be created out of nothing. All things therefore that were made, God not only made out of matter, but himself created the matter of all things out of nothing.", "translator": "claude-draft-approved", "orig": "In principio creavit Deus coelum et terram (Gen. I) . Quod creatum est de nihilo factum est. Nam quod de aliquo factum est, factum quidem est sed creatum non est; quia de nihilo factum non est. Fecit ergo Deus coelum et terram; nec solum fecit sed creavit, hoc est de nihilo fecit. Philosophi gentilium tria quaedam rerum principia sine principio posuerunt: opificem, materiam et formam; profitentes ea quae facta sunt omnia ex materia quidem in formam per opificem esse producta. Sed isti factorem solum non creatorem Deum professi sunt. Fides autem vera unum solummodum primum principium confitetur quod semper erat; et per ipsum solum factum est ut esset quod aliquando non erat. Cujus ineffabilis omnipotentiae virtus, sicut non potuit aliud praeter se habere coaeternum, quo in faciendo juvaretur; ita ipsi cum voluit suberat, ut quod voluit et quando et quantum voluit de nihilo crearetur. Omnia ergo quae facta sunt, Deus non solum ex materia fecit, sed materiam omnium ipse de nihilo creavit.", "olang": "la", "source": "PL 176, col. 187A", "notes": "The first chapter of the first book of De sacramentis, which is to say that when the Latin bench organises itself into a systematic theology this crux is where it starts. The chapter title is the thesis: that there is one principle from which all things were made out of nothing. Then the distinction as a definition — what was made out of something was made but not created — followed by the doxography Ambrose opened the Hexaemeron with, now compressed to three words, opifex, materia, forma, and given its precise consequence: those philosophers professed God to be a maker and not a creator. The move that closes it is Augustine's, that nothing coeternal could help him in the making. Ramban reaches the same last sentence in Girona a century and a quarter later — two substances only were created, and everything else was constructed from them — from the Hebrew of the verb and a Greek word for the matter, and with nothing of this in front of him.", "slot": false}, {"id": "comestor-hs-1-1c", "short": "comestor-hs-1-1c", "author": "Peter Comestor", "tradition": "latin", "date": 1170, "datelabel": "1169–1175", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["three-principles", "matter-is-coeval"], "senses": ["literal"], "lemma": {"la": "Cum vero dixit Moyses, creavit trium errores elidit", "en": "But when Moses said 'created', he struck down the errors of three men"}, "en": "But when Moses said 'created', he struck down the errors of three men: Plato, Aristotle, and Epicurus. Plato said that three things were from eternity, namely God, the ideas, and hyle, and that in the beginning of time the world was made out of hyle. Aristotle said two, the world and the workman, who worked out of two principles, namely matter and form, without a beginning, and works without an end. Epicurus said two, the void and the atoms: and in the beginning nature solidified certain atoms into earth, others into water, others into air, others into fire.", "translator": "claude-draft-approved", "orig": "Cum vero dixit Moyses, creavit trium errores elidit, Platonis, Aristotelis et Epicuri. Plato dixit tria fuisse ab aeterno, scilicet Deum ideas, ile, et in principio temporis, de ile mundum factum fuisse. Aristoteles duo, mundum et opificem, qui de duobus principiis, scilicet materia et forma, operatus est sine principio, et operatur sine fine. Epicurus duo, inane et atomos: et in principio natura quosdam atomos solidavit in terram, alios in aquam, alios in aera, alios in ignem.", "olang": "la", "source": "PL 198, col. 1055B", "notes": "Ambrose's doxography at the end of its Latin life, in the textbook every thirteenth-century student read. Three named opponents now instead of two, with Epicurus added and given the void and the atoms; and the whole apparatus hangs on a single word of the verse — cum vero dixit Moyses, creavit. Plato's three are God, the ideas and hyle, which Migne prints ile. What follows immediately is the sentence K1 built as comestor-hs-1-1, in which Moses prophesied God alone eternal and the world created without pre-existing matter, so this crux and that one hold the two halves of one paragraph: the errors here, the answer there.", "slot": false}, {"id": "abelard-hex-1-2", "short": "Abelard", "author": "Peter Abelard", "tradition": "latin", "date": 1130, "datelabel": "c. 1130", "place": "The Paraclete (Nogent-sur-Seine)", "lat": 48.49, "lon": 3.5, "answers": ["fluttering", "brooding-warmth"], "senses": ["literal"], "lemma": {"la": "Hebraicum habet, volitabat super faciem aquarum", "en": "the Hebrew has, was fluttering over the face of the waters"}, "en": "'And the Spirit of the Lord was borne over the waters.' The Hebrew has 'was fluttering over the face of the waters.' One translation has 'was warming the waters,' another 'was borne over the waters,' as does the present one we have in hand, which first comes to us to be expounded. […] Another translation, as we said, also has 'and the Spirit of the Lord was warming the waters,' after the manner of a bird that sits upon an egg to warm and quicken it; whence we rightly call the Holy Spirit the giver of life. And that confused mass is well compared to an egg not yet quickened or formed, in which, as in an egg containing four things in itself, the four elements are comprised…", "translator": "claude-draft-approved", "orig": "Et Spiritus Domini ferebatur super aquas. Hebraicum habet, volitabat super faciem aquarum. Translatio vero quaedam habet, fovebat aquas, quaedam, ferebatur super aquas, sicut habet praesens quam prae manibus habemus, ac primum nobis occurrit exponenda. Quantum ergo nobis videtur, aquarum etiam nomine fluidam illam atque instabilem congeriem nondum certa partium suarum collocatione firmatam comprehendit. Super hanc itaque Spiritus Domini ferebatur, quia ut eam ordinaret, tanquam imperio suo subjectam divina disponebat gratia, ne videlicet ulterius esset inanis aut vacua, seu tenebrosa vel fluida. Quid enim Spiritus Dei nisi ejus bonitas intelligitur, cujus participatione sunt bona universa? Quae videlicet Dei bonitas, quia nondum in illa elementorum confusione apparebat, superferri potius illi quam inferri dicebatur, quia nondum in ea operatus fuerat unde aliquid utilitatis ipsa praetenderet. Unde nec in ejus commendatione: dicitur vidit Deus quia bonum est, sicut in commendatione reliquorum operum. Diligenter etiam dicit, ferebatur super aquas potius quam erat, quasi ostendens eum habere quemdam transitum in istis, ut de tenebris ad lucem produceret, non in eis permanentiam habere, quas nequaquam in hac confusione proposuerat relinquere. Alia etiam, ut diximus, translatio habet, et Spiritus Domini fovebat aquas, more videlicet avis, quae ovo incumbit, ut ipsum foveat atque vivificet; unde et bene vivificatorem Spiritum sanctum appellamus. Bene autem ovo nondum vivificato aut formato illa confusa congeries comparatur, in qua tanquam in ovo quatuor in se continenti quatuor elementa comprehendun", "olang": "la", "source": "PL 178, col. 735B", "notes": "The one Latin witness who reports the Hebrew as 'fluttering' (volitabat) — which is what merahefet means in Deut 32:11 and what Ben Zoma and Rashi hear — rather than Jerome's 'brooding'. He keeps 'warming' only as 'a certain translation'. Where did Abelard get volitabat? Not from Jerome. A Jewish informant is possible [CHECK]. The excerpt spans cols 735B–735D; the middle is elided in the English.", "slot": false}, {"id": "aug-gnl-5-18", "short": "aug-gnl-5-18", "author": "Augustine", "tradition": "latin", "date": 412, "datelabel": "401–415", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["simul", "evening-is-self-knowledge"], "senses": ["spiritual"], "lemma": {"la": "illa velut matutina sive diurna cognitione, hac vero velut vespertina", "en": "by that as it were morning or daylight knowledge, and by this as it were evening knowledge"}, "en": "Now then let us consider those things which God made all at once, from which, when they were completed on the sixth day, he rested on the seventh — intending afterward to consider his works in which he works even now. […] Of this whole creation of God there is much we do not know: whether things in the heavens too high for our sense to reach them, or things in regions of the earth perhaps uninhabitable, or things hidden below, whether in the depth of the abyss or in the secret folds of the earth. Now these things, before they were made, certainly were not. How then were things known to God which were not? And again, how could he make things that were not known to him? For he made nothing in ignorance. He made them known, then; he did not come to know them once made. Accordingly, before they were made they both were and were not: they were in God's knowledge, they were not in their own nature. And therefore that day was made on which they should become known in both ways, both in God and in themselves: by that as it were morning or daylight knowledge, and by this as it were evening knowledge.", "translator": "claude-draft-approved", "orig": "Jam nunc consideremus ea quae fecit Deus omnia simul, a quibus in die sexto consummatis requievit in septimo, postea consideraturi opera ejus, in quibus usque nunc operatur. Ipse enim ante saecula: a saeculo autem ea dicimus, ex quo coepit saeculum, sicut ipsum mundum; in saeculo autem, sicut ea quae nascuntur in mundo. Cum ergo Scriptura dixisset, Omnia per ipsum facta sunt, et sine ipso factum est nihil; paulo post ait, In hoc mundo erat, et mundus per ipsum factus est (Joan. I, 3, 10) . De hoc opere Dei alio loco scriptum est: Qui fecisti mundum de materia informi (Sap. XI, 18) . Hic mundus plerumque coeli et terrae nomine nuncupatur, sicut jam commemoravimus, quae Scriptura dicit Deum fecisse, cum factus est dies: de quibus verbis jam, quantum visum est, disputavimus, quemadmodum congruat conditioni mundi hujus, et quod sex diebus consummatus est cum omnibus quae in eo sunt, et quod tunc factus, cum factus est dies, ut et illud congruat quod creavit omnia simul (Eccli. XVIII. 1) . CAPUT XVIII.-- Creaturae plures nobis ignotae. Qua ratione a Deo et ab Angelis noscuntur. Cognitio matutina et vespertina. 36. Hujus universae Dei creaturae multa non novimus, sive quae in coelis sunt altius, quam ut noster sensus ea possit attingere; sive quae in regionibus terrarum fortassis inhabitabilibus; sive quae deorsum latent, vel in profundo abyssi, vel in occultis sinibus terrae. Haec igitur antequam fierent, utique non erant. Quomodo ergo Deo nota erant quae non erant? Et rursus quomodo ea faceret quae sibi nota non erant? Non enim quidquam fecit ignorans. Nota ergo fecit, non facta cognovit. Proinde, antequam fierent, et erant, et non erant: erant in Dei scientia, non erant in sua natura. Ac per hoc factus est dies ille, cui utroque modo innotescerent, et in Deo et in seipsis: illa velut matutina sive diurna cognitione, hac vero velut vespertina.", "olang": "la", "source": "PL 34, col. 333", "notes": "The place where the two halves of Augustine's reading are joined and named. 'Creavit omnia simul' (Sir 18:1) makes the six days non-successive; the morning and evening knowledge explains what the day words are then doing. Migne's chapter heading supplies the technical term the schools will quote — cognitio matutina et vespertina. This is the passage Bonaventure will call 'very reasonable and very subtle' and then decline.", "slot": false}, {"id": "bonaventure-sent-2-12-1-2", "short": "bonaventure-sent-2-12-1-2", "author": "Bonaventure", "tradition": "latin", "date": 1252, "datelabel": "1250–1252", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["simul", "six-days-literal"], "senses": ["literal", "spiritual"], "lemma": {"la": "illi dies non fuerunt dies materiales, sed potius spirituales", "en": "those days were not material days but rather spiritual ones"}, "en": "For some Saints in this question followed more the theological way, drawing reasoning toward those things which are of the faith. Opinion of Augustine. But others, among whom the principal was Augustine, followed more the philosophical way, which lays down those things which seem more consonant with reason: hence he also drew the meaning of Scripture toward the confirmation and attestation of reason. Therefore, since it seems more reasonable that all things be produced at once by the supreme power, and that an intervening delay of time would seem to be of no utility or necessity, he held that all things were produced at once, confirming his position through the authorities of sacred Scripture, and explaining that which seems to him to contradict it — namely, the distinction of days — by showing that those days were not material days but rather spiritual [days], which could all be at once. — And this position was very reasonable and very subtle.\n\nNot pleasing to all. Nevertheless, because the meaning of Scripture seems to be twisted by this position, and it is safer and more meritorious to submit our understanding and reason wholly to Scripture rather than in any way to twist it: therefore commonly the other doctors, both those who preceded Augustine and those who came after, understood and held [the matter] as the text and letter of sacred Scripture of Genesis seems to sound. Hence they held that all corporeal things were created at once Conclusion. in matter, but not at once — rather, through a senary of days — were distinguished in form.", "translator": "wilson-pruitt", "orig": "Quidam enim Sancti in hac quaestione magis secuti sunt viam theologicam, trahentes rationem ad ea quae sunt fidei. Opinio Augustini. Quidam vero, inter quos praecipuus fuit Augustinus, magis secuti sunt viam philosophicam, quae illa ponit, quae magis videntur rationi consona: unde et intellectum Scripturae traxit ad rationis confirmationem et attestationem. Unde cum videatur rationabilius, a summa potentia omnia produci simul, et mora temporis interiacentis nullius videatur esse utilitatis vel necessitatis; posuit, omnia simul esse producta, suam positionem confirmans per auctoritates sacrae Scripturae, et exponens illud quod videtur sibi contraire, videlicet de dierum distinctione, ostendens, quod illi dies non fuerunt dies materiales, sed potius spirituales
