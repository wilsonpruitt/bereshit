, qui omnes simul potuerunt esse. — Et haec positio multum fuit rationabilis et valde subtilis.\n\nNon omnibus placet. Verumtamen, quia ad hanc positionem videtur intellectus Scripturae distrahi, et securius est et magis meritorium, intellectum nostrum et rationem omnino Scripturae supponere, quam ipsam aliquo modo distrahere: ideo communiter alii doctores, et qui praecesserunt Augustinum, et qui secuti sunt, sic intellexerunt et posuerunt, sicut textus et littera sacrae Scripturae Genesis sonare videtur. Unde posuerunt, omnia corporalia Conclusio. simul esse creata in materia, sed non simul, sed per senarium dierum, esse distincta in forma.", "olang": "la", "source": "In II Sent., d. XII, a. 1, q. 2 (Quaracchi 1885, II.296–297)", "notes": "The moment the Latin tradition decides. Bonaventure sets out Augustine's position fairly and generously — the philosophical way, holding that all things were produced at once and that the days of Genesis were spiritual and could all be simultaneous — and calls it 'very reasonable and very subtle.' Then he declines it, on a ground that is not exegetical but moral: it is safer and more meritorious to submit our reason to Scripture than to twist Scripture to our reason. The common doctors, before Augustine and after, held that all bodies were created at once in matter but distinguished in form through the six days. Augustine's day, the one day repeated, does not survive this paragraph as the school's reading of Genesis 1.", "slot": false}, {"id": "chalcidius-caelum-et-terra", "short": "chalcidius-caelum-et-terra", "author": "Chalcidius", "tradition": "latin", "date": 350, "datelabel": "300–400", "place": "Cordoba (?)", "lat": 37.88, "lon": -4.78, "answers": ["heaven-earth-is-everything", "heaven-is-empyrean"], "senses": ["literal", "spiritual"], "lemma": {"la": "negant hoc coelum ab initio factum, sed secundo die", "en": "they deny that this heaven was made in the beginning, but on the second day"}, "en": "But it is to be understood what heaven, or what earth, Scripture is speaking of. Those who are content with a hasty understanding think that this heaven which we see, and the earth on which we are carried, are meant; whereas those who search more deeply deny that this heaven was made in the beginning, but on the second day. For in the beginning light was made, and that was called day. But this heaven afterwards, which God called the solidity. Then on the third day, the waters being removed, the dry appeared, and the name of earth was imposed on it. So that it is evident that neither this heaven known to us, nor this earth on which we are, was made from the outset, but that there are others more ancient, to be drawn in by the understanding rather than by the senses. Scripture therefore testifies that the true heaven is one thing and the solidity another; and in the same way that the earth is one thing and the dry another. What heaven, then, did God found before the rest, or what earth? Philo judges them to be incorporeal and intelligible essences, the ideas and exemplars both of this dry land and of the solidity. And finally he says that the human too was first intelligible, the archetypal exemplar of the human race, and only then made corporeal by God. Others not so: but that the prophet, knowing that there are two species of all things, one intelligible and one perceptible, called those powers which embrace and contain both natures 'heaven and earth' — heaven being the incorporeal nature, and earth that which is the substance of bodies, which the Greeks call hyle.", "translator": "claude-draft", "orig": "Quod autem coelum quamue terram scriptura loquatur intelligendum. Qui tumultuario contenti sunt intellectu, coelum hoc quod uidemus, et terram qua subuehimur dici putant; porro qui altius indagantur negant hoc coelum ab initio factum, sed secundo die. Namque ab initio factum lumen, idque diem esse cognominatum. Hoc uero coelum postea, quod Deus appellauerit soliditatem. Tertio deinceps die remotis aquis apparuit sicca, eique terrae nomen impositum. Ut sit euidens neque hoc coelum cognitum nobis, neque hanc in qua sumus terram ab exordio facta, sed alia esse antiquiora intellectu potius quam sensibus haurienda. Aliud igitur uerum coelum, et aliud quiddam esse soliditatem scriptura testatur; eodemque modo aliud terram, et item aliud siccam. Quod igitur illud coelum prius quam caetera Deus condidit, quamue terram? Philo carentes corpore atque intelligibiles essentias esse censet, ideas et exemplaria tam siccae istius terrae quam soliditatis. Denique etiam hominem prius intelligibilem, et exemplum archetypum generis humani, tunc demum corporeum factum a Deo esse dicit. Alii non ita, sed sciente prophetam duas esse species rerum omnium, alteram intelligibilem, alteram sensilem, eas uirtutes quae utranque naturam circumplexae contineant, coelum et terram cognominasse. Coelum quidem incorpoream naturam, terram uero quae substantia est corporum, quam graeci ὕλην uocant.", "olang": "la", "source": "Paris 1520, fo. LVIII recto (archive.org bub_gb_LxGcsxR3tWgC, page/n116.jpg)", "notes": "The oldest Latin statement of this crux on the daf, and it arrives with an apparatus nobody after him has. The question is put exactly as the twelfth century will put it — what heaven and what earth does Scripture mean? — and answered by a chronology within the chapter itself: the firmament is called heaven on the second day and the dry is called earth on the third, so the heaven and earth of the first verse cannot be the ones we see, and must be older and intelligible rather than sensible. That is Remigius's empyrean and Comestor's container-and-contained argument, six hundred years early. What is unique to Chalcidius is the sourcing. He names Philo, who does not appear anywhere else in this edition and whom the Latin bench of Gen 1 never cites: heaven and earth are the incorporeal ideas and exemplars, and the human too was intelligible before he was corporeal. Then he reports a second school — alii non ita — for whom the two names are the two species of all things, the intelligible and the perceptible, earth being the substance of bodies, quam graeci hylen uocant. The Greek word is printed in Greek type in the 1520 edition. On the other bench the same question is Beit Shammai against Beit Hillel at b. Chagigah 12a, and the same instinct is R. Akiva's, that the et of the verse must include something more than what is named.", "slot": false}, {"id": "chalcidius-hebraei-versiones", "short": "chalcidius-hebraei-versiones", "author": "Chalcidius", "tradition": "latin", "date": 350, "datelabel": "300–400", "place": "Cordoba (?)", "lat": 37.88, "lon": -4.78, "answers": ["matter-is-coeval", "de-nihilo"], "senses": ["translation", "literal"], "lemma": {"la": "Hebraei syluam generatam esse confitentur", "en": "The Hebrews confess that hyle was generated"}, "en": "The Hebrews confess that hyle was generated; and the wisest of them, Moses, quickened not by human eloquence but, as they say, by divine inspiration, spoke thus from the outset in that book which is reckoned to be about the begetting of the world, according to the translation of the seventy wise men: 'In the beginning God made heaven and earth. But the earth was invisible and unadorned.' But as Aquila says: 'The head of things God founded, heaven and earth. The earth, moreover, was empty, and nothing.' Or as Symmachus: 'From the outset God founded heaven and earth. The earth, moreover, was an idle something, confused and unordered.' But Origen asserts that he was persuaded by the Hebrews that the translation is in some degree drawn away from the true property of the words; for that there was in the exemplar: 'But the earth was in a certain stupefied wonder.' Yet all these, they say, run together into one, namely that the hyle which underlies the whole body of the universe was generated; and they interpret the words themselves thus.", "translator": "claude-draft", "orig": "Hebraei syluam generatam esse confitentur, quorum sapientissimus Moyses non humana facundia, sed diuina, ut ferunt, inspiratione uegetatus in eo libro qui de genitura mundi censetur, ab exordio sic est profatus iuxta interpretationem septuaginta prudentium: Initio Deus fecit coelum et terram. Terra autem erat inuisibilis et incompta. Ut uero ait Aquila: Caput rerum condidit Deus coelum et terram. Terra porro inanis erat, et nihil. Uel ut Symmachus: Ab exordio condidit Deus coelum et terram. Terra porro fuit otiosum quid confusumque et inordinatum. Sed Origenes asseuerat ita sibi ab Hebraeis esse persuasum, quod in aliquantum sit a uera proprietate deriuata interpretatio. Fuisse enim in exemplari: Terra autem stupida quadam erat admiratione. Omnia tamen haec in unum aiunt concurrere, ut et generata sit ea quae subiecta est uniuerso corpori sylua, sermonesque ipsos sic interpretantur.", "olang": "la", "source": "Paris 1520, fo. LVII verso (archive.org bub_gb_LxGcsxR3tWgC, page/n115.jpg)", "notes": "A page that should not exist. Chalcidius is a fourth-century Latin commentator on the Timaeus, outside the Patrologia and off this edition's Latin bench, and in the middle of a Platonist argument about whether hyle was made he turns to Genesis and prints Gen 1:1–2 four times over: the Septuagint, Aquila, Symmachus, and a reading Origen says the Hebrews gave him. Three things on this daf follow from it, and each is a first. The opening clause reports what the other bench holds and names it as theirs — Hebraei syluam generatam esse confitentur, the Hebrews confess that hyle was generated — which is the position Bereshit Rabbah 1:9 defends against the philosopher and Ramban states outright, attributed to Hebrew informants in Latin two centuries before Jerome's Hebrew Questions. Aquila's caput rerum is reshit rendered as 'head', which is the etymological reading no Latin witness on this daf reaches and which the rabbinic bench builds on; Symmachus's otiosum quid confusumque et inordinatum is a Greek rendering of tohu va-vohu that the Latin tradition later meets only as an anonymous alia translatio. And the exemplar reading Origen credits to the Hebrews, terra autem stupida quadam erat admiratione, is tohu read as astonishment — which is exactly Bereshit Rabbah 2:2's tohe u-bohe, bewildered and astonished, and Rashi's word for it. None of it reached the bench that needed it.", "slot": false}, {"id": "chalcidius-terra-sylua", "short": "chalcidius-terra-sylua", "author": "Chalcidius", "tradition": "latin", "date": 350, "datelabel": "300–400", "place": "Cordoba (?)", "lat": 37.88, "lon": -4.78, "answers": ["hyle-is-tohu", "pair-is-formless-matter", "matter-is-coeval"], "senses": ["literal", "translation"], "lemma": {"la": "cum sit omnium qualitatum receptrix, propriam nullam habet ex natura", "en": "since it is the receiver of all qualities, it has none of its own by nature"}, "en": "'But the earth was invisible and formless' — that is, corporeal hyle, the old substance of the world, before it took on forms fashioned by the skill of God the craftsman, still then colourless and lacking every quality. And what is such is certainly held to be invisible and formless. It is called 'empty' and 'nothing' for this reason: that since it is the receiver of all qualities, it has none of its own by nature. Hyle, then, as that which receives into itself all the things that happen, is called empty, as that which can never seem able to be filled. And because it is devoid of all things, it is called nothing. But it is named 'idle' and 'undigested' by Symmachus: idle, in that of itself it avails nothing; and it is reckoned undigested in that it has the fitness to receive order from God adorning it as he sets about the world. But the signification 'stupefied, out of wonder' declares a certain force and likeness of soul, since it would be stupefied, seized by the majesty of its craftsman and author.", "translator": "claude-draft", "orig": "Terra autem erat inuisibilis et informis, hoc est sylua corporea uetus mundi substantia, prius quam efficta Dei opificis sollertia sumeret formas, etiam tunc decolor et omni carens qualitate. Quod uero tale est, inuisibile certe habetur et informe. Inanis porro et nihil propterea dicta, quia cum sit omnium qualitatum receptrix, propriam nullam habet ex natura. Sylua ergo, ut quae cuncta quae accidunt recipiat in se, inanis appellata, ut quae compleri nunquam posse uideatur. Porro quia sit expers omnium, nihil dicta. Otiosa uero et indigesta nuncupatur a Symmacho: quodque quidem per se nihil ualeat, otiosa; quod uero habeat opportunitatem suscipiendi ordinis ab exornante semet Deo mundum moliente, indigesta censetur. Stupide uero ex admiratione significatio animae uim quandam similitudinemque declarat, siquidem opificis et auctoris sui maiestate capta stuperet.", "olang": "la", "source": "Paris 1520, fo. LVIII recto (archive.org bub_gb_LxGcsxR3tWgC, page/n116.jpg)", "notes": "Tohu va-vohu given four Latin renderings in one paragraph, each explained, by the earliest Latin on this daf. Invisible and formless is hyle: the old corporeal substance of the world, colourless and without quality before the craftsman's skill gave it forms. Empty and nothing are explained by the receptacle argument in its clean Platonic form — it is called empty because it receives all qualities and has none of its own, and nothing because it is devoid of all things — which is what Augustine will grope toward in Confessions XII, calling it a nothing-something, and what the Gloss will flatten into materia informis. Symmachus's otiosa and indigesta are then glossed separately: idle because of itself it avails nothing, undigested because it has the fitness to receive order. And the reading Origen credits to the Hebrews, stupide ex admiratione, is given a psychological explanation — the earth would be stupefied, seized by the majesty of its maker. That last one is the crux's rabbinic answer arriving on the Latin bench and being taken seriously: Bereshit Rabbah 2:2 reads tohu va-vohu as tohe u-bohe, bewildered and astonished, and Rashi's word for tohu is astonishment. Alcuin, Angelomus and Hugh all know that alia translatio says inordinata, without knowing whose translation it is or that a fourth-century Latin had named him and explained the word.", "slot": false}, {"id": "lxx-1-1", "short": "lxx-1-1", "author": "The Seventy", "tradition": "greek-jewish", "date": -250, "datelabel": "c. 250 BCE", "place": "Alexandria", "lat": 31.2, "lon": 29.92, "answers": ["principio-temporis"], "senses": ["translation"], "lemma": {"el": "ἐν ἀρχῇ", "en": "in the beginning"}, "en": "In the beginning God made the heaven and the earth.", "translator": "claude-draft-approved", "orig": "ἐν ἀρχῇ ἐποίησεν ὁ θεὸς τὸν οὐρανὸν καὶ τὴν γῆν.", "olang": "el", "source": "LXX Gen 1:1 (Rahlfs)", "notes": "ἐν ἀρχῇ without an article and without a governing noun: the Greek turns a Hebrew word that may be construct into an adverbial phrase, and in doing so closes off the reading Rashi and Ibn Ezra will call the plain sense. Note also ἐποίησεν, 'made', where the Vulgate will write creavit: the Latin bench's whole argument that creare means to make from nothing has no purchase on the Greek. Every Latin witness here quotes fecit or creavit according to which Latin text is in front of him, and the variation is evidence, not noise.", "slot": false}, {"id": "ramban-1-2-tohu", "short": "ramban-1-2-tohu", "author": "Moses ben Naḥman (Naḥmanides)", "tradition": "rabbinic", "date": 1267, "datelabel": "1263–1270", "place": "Girona", "lat": 41.98, "lon": 2.82, "answers": ["pair-is-matter-and-form", "pair-is-astonishment"], "senses": ["literal"], "lemma": {"he": "תֹּהוּ … בֹּהוּ", "en": "tohu … bohu"}, "en": "This substance, which the Greeks called hyly, is called in the sacred language tohu, the word being derived from the expression of the Sages: “betohei (when the wicked bethinks himself) of his doings in the past.” If a person wants to decide a name for it [this primordial matter], he may bethink himself, change his mind and call it by another name since it has taken on no form to which the name should be attached. The form which this substance finally takes on is called in the sacred language bohu, which is a composite word made up of the two words bo hu (in it there is [substance]). This may be compared to the verse, Thou art not able ‘asohu’ (to perform it), in which case the word asohu is missing a vav and an aleph [and is a composite of the two words] aso hu. It is this which Scripture says, And he shall stretch over it the line of ‘tohu’ (confusion) and the stones of ‘bohu.’ [The tohu in Hebrew or hyly in Greek] is the line by which the craftsman delineates the plan of his structure and that which he hopes to make. This is derived from the expression, Kavei (Hope) unto G-d. The stones are forms in the building. Similarly it is written, They are accounted by Him as nought and ‘tohu,’ as tohu comes after nothingness and there is nothing yet in it. So the Rabbis have also said in Sefer Yetzirah: “He created substance from tohu, and made that which was nothing something.” They have furthermore said in the Midrash of Rabbi Nechunya ben Hakanah: “Rabbi Berachyah said: ‘What is the meaning of the verse, And the earth was ‘tohu’ (without form) ‘vavohu’ (and void)? What is the meaning of the word “was?” It had already been tohu. And what is tohu? It is a thing which astonishes people. It was then turned into bohu. And what is bohu? It is a thing which has substance, as it is written, [bohu is a composite of the two words] ‘bo hu’ (in it there is substance)", "translator": "Charles B. Chavel, 1971–76", "orig": "וְהַחֹמֶר הַזֶּה, שֶׁקָּרְאוּ הִיּוּלִי, נִקְרָא בִּלְשׁוֹן הַקֹּדֶשׁ \"תֹּהוּ\", וְהַמִּלָּה נִגְזְרָה מִלְּשׁוֹנָם (קידושין מ ב): \"בְּתוֹהֶא עַל הָרִאשׁוֹנוֹת\". מִפְּנֵי שֶׁאִם בָּא אָדָם לִגְזֹר בּוֹ שֵׁם, תּוֹהֶא וְנִמְלָךְ לְקוֹרְאוֹ בְּשֵׁם אַחֵר, כִּי לֹא לָבַשׁ צוּרָה שֶׁיִּתָּפֵשׂ בָּהּ הַשֵּׁם כְּלָל. וְהַצּוּרָה הַנִּלְבֶּשֶׁת לַחֹמֶר הַזֶּה נִקְרֵאת בִּלְשׁוֹן הַקֹּדֶשׁ \"בֹּהוּ\", וְהַמִּלָּה מֻרְכֶּבֶת, כְּלוֹמַר \"בּוֹ הוּא\", כְּמִלַּת \"לֹא תוּכַל עֲשֹׂהוּ\" (שמות יח יח), שֶׁמְּחֻסַּר הַו\"ו וְהָאָלֶ\"ף, עֲשׂוֹ הוּא. וְזֶהוּ שֶׁאָמַר הַכָּתוּב (ישעיהו לד יא): \"וְנָטָה עָלֶיהָ קַו תֹהוּ וְאַבְנֵי בֹהוּ\", כִּי הוּא הַקַּו אֲשֶׁר בּוֹ יְתַחֵם הָאֻמָּן מַחְשֶׁבֶת בִּנְיָנוֹ וּמָה שֶׁיְּקַוֶּה לַעֲשׂוֹת, נִגְזַר מִן \"קַוֵּה אֶל ה'\" (תהלים כז יד), וְהָאֲבָנִים הֵם צוּרוֹת בַּבִּנְיָן. וְכֵן כָּתוּב: \"מֵאֶפֶס וָתֹהוּ נֶחְשְׁבוּ לוֹ\" (ישעיהו מ יז), כִּי הַתֹּהוּ אַחַר הָאֶפֶס, וְאֵינֶנּוּ דָּבָר. וְכָךְ אָמְרוּ בְּסֵפֶר יְצִירָה: \"יָצַר מִתֹּהוּ מַמָּשׁ וְעָשָׂה אֵינוֹ יֶשְׁנוֹ\". וְעוֹד אָמְרוּ בְּמִדְרַשׁ רַבִּי נְחוּנְיָא בֶּן הַקָּנָה (ספר הבהיר): אָמַר רַבִּי בֶּרֶכְיָה, מַאי דִכְתִיב: \"וְהָאָרֶץ הָיְתָה תֹהוּ וָבֹהוּ\"? מַאי מַשְׁמַע \"הָיְתָה\"? שֶׁכְּבָר הָיְתָה תֹּהוּ. וּמַאי \"בֹּהוּ\"? אֶלָּא תֹּהוּ הָיְתָה, וּמַאי \"תֹּהוּ\"? דָּבָר הַמַּתְהֶא בְּנֵי אָדָם, וְחָזְרָה לְבֹהוּ. וּמַאי \"בֹּהוּ\"? דָּבָר שֶׁיֵּשׁ בּוֹ מַמָּשׁ, דִּכְתִיב \"בּוֹ הוּא\"", "olang": "he", "source": "Ramban on Gen 1:1, s.v. בראשית (the tohu–bohu paragraph)", "notes": "The one witness on either bench that makes the pair a matched technical vocabulary. The primary matter, which the Greeks call hyle, is called in the holy tongue tohu — the word derived from the rabbinic betohe, of a man who bethinks himself of what he has done, because if a man came to fix a name to this matter he would think again and call it something else, having no form to fasten a name on. The form that the matter puts on is called bohu, a compound word, bo hu, 'in it there is'. Then Isa 34:11 read as a workshop: the line of tohu is the cord by which the craftsman marks out the plan of his building, the stones of bohu are the forms in it — the same verse the Chagigah baraita read as a green line round the world and stones in the deep. He closes with Sefer Yetzirah and with the Bahir's R. Berekhya, who defines tohu as 'a thing which astonishes people' — Rashi's etymology, now describing a substance rather than a viewer. Chavel's English shows on Sefaria as CC BY, which is surprising for a 1971 Shilo text: licence key chavel-ramban is marked for checking before publication. The paragraph that precedes this one — creation from absolute nothing, and the hyle as the only thing created — belongs to K4 and is not sliced here.", "slot": false}, {"id": "targ-neof-1-1", "short": "targ-neof-1-1", "author": "Targum Neofiti", "tradition": "rabbinic", "date": 300, "datelabel": "100–400", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["beginning-is-wisdom"], "senses": ["translation"], "lemma": {"arc": "מלקדמין בחכמה", "en": "from the first, in wisdom"}, "en": "In the beginning and in great wisdom, God created and finished the heavens and the earth.", "translator": "Sefaria Community Translation", "orig": "מלקדמין בחכמה [בחוכמתא] ברא (ד)יי שכלל [ושכלל] ית שמיא וית ארעא:", "olang": "arc", "source": "Targum Neofiti, Gen 1:1 (Vatican, Neofiti 1)", "notes": "The single most consequential word on this crux: Neofiti does not translate bereshit, it interprets it — min qadmin be-ḥokhmah, 'from the first, in wisdom' — and then adds a second verb, shakhlel, 'and finished'. A Palestinian targumist and the Latin fathers reach the same gloss on the same word, 'in Wisdom', and then part company entirely over what Wisdom is: for Bereshit Rabbah it is the Torah, for Augustine and Bede it is the Son. Neither side knows the other is there. The CC0 English prints 'in great wisdom'; there is no word for 'great' in the Aramaic, and the reading בחוכמתא recorded in the manuscript's own margin is simply the emphatic state. Note that this witness and K7's targ-neof-1-2 are two slices of one Sefaria segment: the whole of Gen 1:1–5 comes back as a single block.", "slot": false}, {"id": "targ-onk-1-1", "short": "targ-onk-1-1", "author": "Targum Onkelos", "tradition": "rabbinic", "date": 200, "datelabel": "100–300", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["principio-temporis"], "senses": ["translation"], "lemma": {"arc": "בְּקַדְמִין", "en": "in former times"}, "en": "In the beginning the LORD created the heavens and the earth.", "translator": "claude-draft-approved", "orig": "בְּקַדְמִין בְּרָא יְיָ יָת שְׁמַיָּא וְיָת אַרְעָא", "olang": "arc", "source": "Sefaria, 'Onkelos Genesis'", "notes": "be-qadmin, a plain adverb of time and nothing else: no construct, no wisdom, no first thing. Onkelos hears the verse as the Greek does. Etheridge's Onkelos did not return from Sefaria by version title (see notes/SOURCES-FINDINGS.md) and the Metsudah English is CC BY-NC, so the English is a fresh draft.", "slot": false}, {"id": "targ-psj-1-1", "short": "targ-psj-1-1", "author": "Targum Pseudo-Jonathan", "tradition": "rabbinic", "date": 750, "datelabel": "600–800", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["principio-temporis"], "senses": ["translation"], "lemma": {"arc": "מִן אַוְולָא", "en": "from the first"}, "en": "At the beginning the LORD created the heavens and the earth.", "translator": "J. W. Etheridge, 1862", "orig": "מִן אַוְולָא בְּרָא יְיָ יַת שְׁמַיָא וְיַת אַרְעָא", "olang": "arc", "source": "Sefaria, 'Targum Jonathan on Genesis'", "notes": "A third Aramaic word for the same Hebrew one: min avvela, 'from the first'. Etheridge prints the Aramaic in transliteration inside his English ('At the beginning (min avella)'), which is why his sentence carries a gloss no other version has; the parenthesis is his.", "slot": false}, {"id": "vulgate-1-1", "short": "vulgate-1-1", "author": "Jerome", "tradition": "latin", "date": 392, "datelabel": "c. 392", "place": "Bethlehem", "lat": 31.7, "lon": 35.2, "answers": ["principio-temporis"], "senses": ["translation"], "lemma": {"la": "In principio", "en": "In the beginning"}, "en": "In the beginning God created the heaven and the earth.", "translator": "claude-draft-approved", "orig": "In principio creavit Deus coelum et terram.", "olang": "la", "source": "PL 28, col. 163C", "notes": "Jerome translates in principio and not in Filio, and in the Hebrew Questions he says in so many words why: the reading 'in the Son' is false as a translation, however true as a sense. But he also writes creavit where the Old Latin his own contemporaries quote has fecit — Augustine, Ambrose, Bede and the Glossa all argue from fecit — so the Latin bench spends seven centuries reasoning about a verse in two versions at once.", "slot": false}], "threads": [{"id": "t-k4-01", "from": "br-1-9", "to": "aug-gnm-1-6-10", "type": "parallel", "evidence": "The philosopher: 'Your God was a great artist, but he found good materials that helped him.' Augustine: 'those who do not believe that almighty God could make anything out of nothing, when they consider that craftsmen and workmen cannot make anything unless they have something to make it from … wood helps the craftsman, silver the silversmith.' The same inference from the same analogy, and the verb is the same in both — the materials help. Thagaste 389, Galilee c. 450, no contact.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-02", "from": "br-1-9", "to": "basil-hex-2-2-materia", "type": "parallel", "evidence": "Basil diagnoses the position the philosopher states: 'with us each art is exercised upon some matter brought to it — smithcraft upon iron, carpentry upon wood … so they suppose it is with the divine working too.' Two trades where the midrash has none and Augustine has four, and the same conclusion drawn about God's poverty.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-03", "from": "aug-gnm-1-6-10", "to": "basil-hex-2-2-materia", "type": "parallel", "evidence": "Both answer the craftsman analogy by denying that God receives anything from outside: Basil, 'God is not the deviser of figures but the creator of the whole nature'; Augustine, 'if some thing that he had not himself made helped him, he was not almighty'. Augustine did not read Eustathius' Latin Basil in 389, and the arguments differ in kind — Basil's from the dignity of the unbegotten, Augustine's from omnipotence.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-04", "from": "wigbod-gen-1-1c", "to": "aug-gnm-1-6-10", "type": "transmits", "evidence": "Verbatim to the last clause, including the four trades and 'quod sacrilegum est credere'; Wigbod reads 'de nihilo facta est' where Augustine has 'de omnino nihilo'. Wigbod does not name Augustine here, though he names Jerome elsewhere in the same work.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-05", "from": "angelom-gen-1-1c", "to": "aug-gnm-1-6-10", "type": "echoes", "evidence": "'Aiunt enim: Lignum adjuvat fabrum, et argentum argentarium, et aurum aurificem … non enim faber facit lignum, sed de ligno aliquid facit' — Augustine's clauses reused without his name and recast as reported speech, with the potter dropped and a diagnosis added ('quia attendunt fabrum, et non Deum').", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-06", "from": "hugh-sacr-1-1-nihilo", "to": "ambrose-hex-1-1-hyle", "type": "echoes", "evidence": "Ambrose: 'tria principia constituerent omnium, Deum, et exemplar, et materiam … de materia, quam vocant hylen'. Hugh: 'Philosophi gentilium tria quaedam rerum principia sine principio posuerunt: opificem, materiam et formam.' The same three-item list with the same qualification (without a principle / uncreated and without beginning), abbreviated to single words and unattributed.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-07", "from": "comestor-hs-1-1c", "to": "ambrose-hex-1-1-hyle", "type": "echoes", "evidence": "'Plato dixit tria fuisse ab aeterno, scilicet Deum ideas, ile' is Ambrose's 'Deum, et exemplar, et materiam … quam vocant hylen' with exemplar resolved into ideae, and Aristotle's two principles, materia et forma, follow in the same order. Epicurus is Comestor's addition.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-08", "from": "basil-hex-2-2-materia", "to": "ambrose-hex-1-1-hyle", "type": "parallel", "evidence": "The same position described from the two sides of the Latin/Greek divide within about fifteen years: Ambrose names it (Plato's three principles, hyle uncreated) and Basil argues against it without naming anyone ('if we call this matter unbegotten it is made equal to God'). Ambrose knew Basil's Greek Hexaemeron; this Latin Basil is Eustathius' later version, so the Latin words are not a source for Ambrose's.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-09", "from": "ibn-ezra-1-1c", "to": "rupert-gen-1-1c", "type": "parallel", "evidence": "The same objection from the same two verses, in the same order, answered in opposite directions. Rupert: 'if anyone should object that man too … is said to be created — as it is written, God created man to his own image … or again, God created the great sea-creatures'. Ibn Ezra: 'they have forgotten And God created the crocodiles (Gen 1:21), as well as three times in the same verse, God created man in his image (Gen 1:27)'. Rupert saves the doctrine with a distinction about the matter; Ibn Ezra concludes the verb has a second sense. Liège c. 1115, Lucca c. 1155, no possible contact.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-10", "from": "ibn-ezra-1-1c", "to": "abelard-hex-1-1c", "type": "parallel", "evidence": "Abelard secures ex nihilo on the difference between two Latin verbs — creavit of the elements, formavit of man at Gen 2:7 and the animals at 2:19 — where Ibn Ezra dissolves it by showing that the one Hebrew verb bara stands at 1:21 and 1:27 of things made out of something. The Latin distinction is available only because the translation supplies two words where the Hebrew has one at the decisive places.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-11", "from": "abelard-hex-1-1c", "to": "rupert-gen-1-1c", "type": "parallel", "evidence": "Two Latin answers to one difficulty within about fifteen years: Rupert grants that creavit is used of things shaped from matter and refers the word back to the creation of the matter; Abelard denies that it is properly so used at all and assigns those cases to formare. Neither cites the other, and the two answers are incompatible.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-12", "from": "hugh-sacr-1-1-nihilo", "to": "abelard-hex-1-1c", "type": "parallel", "evidence": "The same definition by contrast, in Paris within four years: Abelard, 'creari proprie id dicitur, quod de non esse ita ad esse producitur, ut praejacentem non habeat materiam'; Hugh, 'quod de aliquo factum est, factum quidem est sed creatum non est; quia de nihilo factum non est'. Neither names the other, and the school relations between them make silence the interesting fact.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-13", "from": "glossa-1-2-materia", "to": "bede-gen-1-2-materia", "type": "transmits", "evidence": "Migne prints the gloss under (BEDA ubi supra.). Bede: 'cuncta quae cum aquis et terra videre solemus in mundo, vel de ipsis exordium naturae, vel sumpsere de nihilo; ipsa autem terra et ipsae aquae propterea nomen sortitae sunt materiae informis, quia priusquam in lucem venirent, unde formositatem haberent non erat.' Glossa: 'Ipsa autem terra et aqua informis dicuntur materia, quia omnia quae videmus, vel ex istis sumpserunt exordium, vel ex nihilo: et priusquam in lucem venirent, non erat unde formam haberent.' The restriction that opened Bede's paragraph — 'Ad haec tantum informis est illa materies' — is not carried over.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-14", "from": "bede-gen-1-2-materia", "to": "aug-gnm-1-6-10", "type": "parallel", "evidence": "Both hang the difficulty on Wisdom 11:17, 'qui fecisti mundum de materia informi', and take opposite routes out of it: Augustine grants the formless matter and pushes creation one step behind it; Bede restricts the phrase to the earth and the waters before the light came, so that no substrate is conceded at all.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-15", "from": "angelom-gen-1-1c", "to": "bede-gen-1-2-materia", "type": "parallel", "evidence": "Wisdom 11:17 again, quoted in full by Angelomus in the form 'non enim erat manus tua, Domine, invalida, qua creasti mundum ex informi materia', and used to the opposite end: for Angelomus the verse proves that God made the matter and then made everything out of it, for Bede that 'formless matter' is only a name for the earth and waters in the dark.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-16", "from": "alcuin-int-19-20", "to": "aug-gnl-5-18", "type": "echoes", "evidence": "Alcuin's second mode of divine working — 'in materia informi qui vivit in aeternum, creavit omnia simul (Eccli. XVIII, 1)' — is Augustine's simul doctrine with Augustine's proof text, reduced to one clause and set in a list of four.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-17", "from": "br-1-5b", "to": "br-1-9", "type": "contests", "evidence": "Four sections apart in one compilation, and the second answers the first. BR 1:5: 'were the matter not written explicitly it would not be possible to say it — In the beginning God created — from what? The earth was emptiness and disorder.' BR 1:9: the philosopher names emptiness, disorder, darkness, wind, water and the deeps as the materials God found, and Rabban Gamliel answers that of every one of them creation is written. The same list of six, read once as the stuff the world was made of and once as a list of created things.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-18", "from": "pdre-3-7", "to": "br-1-9", "type": "contests", "evidence": "Pirkei de-Rabbi Eliezer answers 'from what?' with substances — the earth from the snow beneath the Throne of Glory, congealed on the waters, with Job 37:6 for proof; the heavens, in the preceding section, from the light of his garment. Rabban Gamliel's answer to the same question is that nothing was found and everything was created. Neither text acknowledges the other, and both stand in the rabbinic bench's own tradition.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-19", "from": "ramban-1-1c", "to": "ibn-ezra-1-1c", "type": "contests", "evidence": "Ramban names R. Abraham a few lines above this passage and then writes 'there is no expression in the sacred tongue for bringing forth something from nothing other than the word bara' — which is the exact claim Ibn Ezra had refuted from Gen 1:21, Gen 1:27 and Isaiah 45:7. The contest is direct and is the reason the sentence is phrased as an exclusive.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-20", "from": "ramban-1-1c", "to": "hugh-sacr-1-1-nihilo", "type": "parallel", "evidence": "Hugh: 'omnia ergo quae facta sunt, Deus non solum ex materia fecit, sed materiam omnium ipse de nihilo creavit.' Ramban: 'the Holy One, blessed be He, created these two substances from nothing; they alone were created, and everything else was constructed from them.' The same two-stage doctrine — one creation out of nothing, everything afterwards made out of what was created — with the Greek word for the matter on the Hebrew side and not on the Latin.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-21", "from": "ramban-1-1c", "to": "br-1-5b", "type": "cites", "evidence": "Ramban's tohu is bar Kappara's difficulty resolved: BR 1:5 asks 'from what?' and answers 'the earth was tohu va-vohu', with an apology; Ramban makes tohu the name in the sacred tongue for the hyle, so that the verse now says the world was made out of the one thing that was created out of nothing. He quotes the rabbinic material of this section (and Sefer Yetzirah, 'he created substance from tohu') by name in the lines that follow.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-22", "from": "aug-conf-12-22", "to": "br-1-9", "type": "parallel", "evidence": "One difficulty, two opposite methods. Augustine argues that Genesis' silence about when a thing was made cannot prove it coeternal, and makes the case with a second silence (the waters above the firmament). Rabban Gamliel meets the same objection by breaking the silence item by item: Isaiah 45:7 for tohu and darkness, Psalm 148:4–5 for the waters, Amos 4:13 for the wind, Proverbs 8:24 for the deeps.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-23", "from": "aug-conf-12-22", "to": "aug-conf-12-7", "type": "echoes", "evidence": "The same conclusion reached twice in one book by different routes — at XII.7 from the exhaustive dilemma (not out of God, and nothing else was there, therefore out of nothing), at XII.22 from the failure of the argument from Scripture's silence. The second is the defensive form of the first.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-24", "from": "aug-conf-12-7", "to": "aug-gnm-1-6-10", "type": "echoes", "evidence": "'De nihilo fecisti coelum et terram' restates in prayer what De Genesi contra Manichaeos argued nine years earlier, with the same two-stage structure — formed things out of the matter, the matter out of nothing — now expressed as 'unum prope te, alterum prope nihil'.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-25", "from": "alcuin-int-19-20", "to": "aug-gnm-1-6-10", "type": "parallel", "evidence": "Augustine's doctrine turned into an inventory: 'Quae creaturae de nihilo factae sunt? — Coelum, terra, angeli, lux, aer, aqua et anima hominis.' The list form has no Latin precedent on this crux and exact rabbinic counterparts (b. Chagigah 12a's ten things, PdRE 3's eight), and Alcuin's items are chosen so that no unformed substrate appears on it.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-x1", "from": "ramban-1-2-tohu", "to": "ramban-1-1c", "type": "echoes", "evidence": "Phase 4. One continuous argument that the crux boundaries split in two: having said that the Holy One created all things from absolute non-existence and that after the hyle he created nothing, Ramban goes straight on to name it — the substance the Greeks called hyly is what the sacred tongue calls tohu. The hyle and the tohu are the same thing, and the two witnesses are consecutive sentences.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-x2", "from": "abelard-hex-1-1c", "to": "vulgate-1-1", "type": "cites", "evidence": "Phase 4. Abelard's whole definition of creation rests on a distinction between two Latin verbs — created of what has no pre-existing matter, formed of what is shaped out of matter — and the distinction is available only because the translation supplies two verbs where the Hebrew has one at the places that matter. Ibn Ezra brings the same two verses (Gen 1:21, 1:27) to the opposite conclusion, that bara does not mean bringing forth from nothing, because in Hebrew there is no second verb to escape into.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-c1", "from": "chalcidius-hebraei-versiones", "to": "br-1-9", "type": "parallel", "evidence": "A Latin reporting the rabbinic position on this crux, correctly, and by name. Hebraei syluam generatam esse confitentur — the Hebrews confess that hyle was generated. At Bereshit Rabbah 1:9 a philosopher tells R. Gamliel that his God was a great artist but had good materials to hand — tohu and bohu, darkness, wind, water, the deeps — and is answered that Scripture says of every one of them that it was created. That is the rabbinic bench refusing coeval matter, which is exactly what Chalcidius says the Hebrews hold. He is a fourth-century Latin who knows the other bench's answer to this crux, states it accurately, and is read by nobody who argues the crux afterwards.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-c2", "from": "chalcidius-hebraei-versiones", "to": "ambrose-hex-1-1-hyle", "type": "contests", "evidence": "Ambrose sets up the hyle of the philosophers as the position a Christian must refuse, and Chalcidius had already reported the concession that dissolves it. For Ambrose, matter that the craftsman merely finds is a rival to God; for Chalcidius, the Hebrews grant that hyle itself was generated, so the Platonist account of the world's substance and the scriptural account of its origin are not in competition. Ambrose is refuting a Platonism that this Latin Platonist does not hold, forty years earlier and in the same language.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-c3", "from": "chalcidius-terra-sylua", "to": "aug-conf-12-7", "type": "parallel", "evidence": "The same doctrine reached from opposite directions. Augustine works down from God to a formless something 'near to nothing', and needs a page to say what it is not. Chalcidius works up from the Timaeus and has the definition ready: the receiver of all qualities has none of its own by nature, and is therefore called empty; being devoid of all things, it is called nothing. Augustine has the Bible and is short of the vocabulary; Chalcidius has the vocabulary and is using the Bible to confirm it.", "crux": "ex-nihilo-or-matter"}, {"id": "t-k4-c4", "from": "chalcidius-terra-sylua", "to": "ramban-1-1c", "type": "parallel", "evidence": "The two witnesses on this daf who take the plain sense of the verse to be about matter and still hold that the matter was made. Ramban: bara means from absolute non-existence, and what was drawn out on the first day was a formless substance from which everything after was formed. Chalcidius: the earth of v. 2 is corporeal hyle, the old substance of the world before it took form — and the Hebrews, he has just said, confess it was generated. Girona 1267 and a Latin commentary on the Timaeus of about 350, agreeing on both halves of the crux.", "crux": "ex-nihilo-or-matter"}], "answers": {"borne-over": {"label": "Borne over", "gloss": "The verb is motion: a spirit carried above the water (LXX ἐπεφέρετο, Vulgate ferebatur)."}, "wind": {"label": "A wind", "gloss": "Ruach is weather, not a person; Onkelos keeps God at a remove."}, "spirit-of-mercy": {"label": "Spirit of mercy", "gloss": "A divine disposition blowing over the waters (Palestinian targums)."}, "messiah": {"label": "Spirit of the Messiah", "gloss": "Resh Lakish: the ruach of Isa 11:2, brought by repentance-as-water."}, "bird-hovering": {"label": "Dove hovering, not touching", "gloss": "Ben Zoma and Rashi: the bird measures a gap; it does not land."}, "fluttering": {"label": "Fluttering", "gloss": "Abelard's report of the Hebrew: volitabat, as the eagle of Deut 32:11."}, "brooding-warmth": {"label": "Bird brooding, warming", "gloss": "Jerome from the Hebrew, Basil's Syrian, then the Latin schools: the Spirit quickens matter like a hen on eggs."}, "power-not-place": {"label": "Power, not place", "gloss": "Augustine: 'above' means sovereignty, not position; the Manichees misread it."}, "craftsman": {"label": "The craftsman's will", "gloss": "The Spirit over the waters as the maker's intention over the wood."}, "love-gift": {"label": "Love, gift, weight", "gloss": "Confessions XIII: why the Spirit alone is said to be above; pondus meum amor meus."}, "trinity": {"label": "The Trinity named", "gloss": "The verse completes Father (in principio), Son (principium), Spirit."}, "heart": {"label": "Over the heart", "gloss": "Isidore's moral reading: the waters are our fluid, dark heart."}, "throne": {"label": "Throne of Glory", "gloss": "Rashi: the throne stands in the air, held by the breath of God's mouth."}, "unus-cardinal": {"label": "The versions keep the cardinal", "gloss": "ἡμέρα μία, dies unus, yoma chad: 'one', not 'first', in every ancient version."}, "unus-grammatical": {"label": "'First' needs a second", "gloss": "The series 'one, second, third' is improper (Bereshit Rabbah); or, first and second are relatives and there was no second yet (Bruno)."}, "unus-alone": {"label": "God was alone that day", "gloss": "Yachid in his world: no angels were made on the first day, so there was no second anything (Bereshit Rabbah, Rashi)."}, "unus-yom-kippur": {"label": "The one day given to Israel", "gloss": "'One day' is the Day of Atonement, the day the Holy One gave them."}, "unus-24-hours": {"label": "One circuit, twenty-four hours", "gloss": "Day and night together make one revolution, and the whole is named from the day alone."}, "unus-repeated": {"label": "The same day repeated", "gloss": "There is one day only — the angelic light — presented once for each kind of thing made (Augustine)."}, "unus-all-time": {"label": "One day = all time", "gloss": "The word holds the whole span of the ages, or the whole work of the six days (Augustine's set-aside reading; Abelard's own)."}, "unus-angelic-unity": {"label": "The unity of angelic dignity", "gloss": "'One' names the undivided attention of the angelic mind, not a place in a series (Angelomus)."}, "unus-eternal-day": {"label": "The true first day is eternal", "gloss": "This day is first only by number and order of creation; the day that is first by nature is uncreated light (Rupert)."}, "day-precedes-night": {"label": "Day before night", "gloss": "Evening is the end of a finished day, morning the end of the night; days are counted from morning to morning."}, "day-follows-night": {"label": "Night before day", "gloss": "'One day' rules that reckoning begins at evening (Ben Zoma, b. Chullin 83a)."}, "night-for-rest": {"label": "Night made for rest", "gloss": "Day is for labour and night for rest, so only the day's bounds are counted."}, "day-is-a-measure": {"label": "The day's measure is a creature", "gloss": "The measure of day and of night was itself made on day one (b. Chagigah 12a)."}, "evening-is-completion": {"label": "Evening completes a work", "gloss": "Vespera is a work perfected, mane the beginning of the next — the Carolingian formula."}, "evening-is-self-knowledge": {"label": "Evening and morning knowledge", "gloss": "The creature known in itself is evening; known in the Word and referred back in praise, morning (Augustine)."}, "evening-moral": {"label": "Evening as sin or temptation", "gloss": "Evening and morning are the deeds of the wicked and the righteous, or sin and renewal, or temptation and the light of justice."}, "simul": {"label": "All things made at once", "gloss": "Creavit omnia simul (Sir 18:1): the days are not successive."}, "six-days-literal": {"label": "Six real days", "gloss": "Created at once in matter, distinguished in form through six successive days (the common doctors, Bonaventure)."}, "principio-temporis": {"label": "In the beginning of time", "gloss": "The word dates the making: time began with the world, and there was no before (Onkelos, Bede, Rabanus, Remigius, Hugh)."}, "principio-in-filio": {"label": "In the Son", "gloss": "Principium is a proper name of the Word, on the strength of John 8:25 and Ps 104:24 (Ambrose, Augustine, Isidore, Alcuin, the Glossa, Rupert, Honorius)."}, "principio-first-of-all": {"label": "First of all things", "gloss": "'In the beginning' means before everything else that follows — in the beginning of the creatures, or on the first day (Augustine's second reading; Bruno, Abelard)."}, "principio-is-first-creature": {"label": "The first creature is a beginning", "gloss": "The first intellectual creature may be called a beginning to the things it heads (Augustine, De Genesi imperfectus)."}, "beginning-is-wisdom": {"label": "In Wisdom", "gloss": "The beginning is Wisdom — which is the Torah on one bench (Prov 8:22, Prov 3:19, Neofiti) and the Son on the other (Ps 104:24)."}, "reshit-is-torah": {"label": "The beginning is the Torah", "gloss": "Reshit is the Torah, called reshit darko: God looked into it as an architect into his plans and created the world (Bereshit Rabbah, Rashi)."}, "reshit-is-israel": {"label": "For the sake of Israel", "gloss": "Reshit is Israel, called reshit tevu'ato (Jer 2:3); the world was made for their sake."}, "reshit-construct": {"label": "'When God began to create'", "gloss": "Bereshit is a construct and the verse a subordinate clause: at the beginning of God's creating (Rashi's plain sense, Ibn Ezra; contested by Ramban)."}, "world-has-a-beginning": {"label": "The world is not eternal", "gloss": "The point of saying 'in the beginning' at all is that the world had one, against the philosophers (Ambrose, Remigius, Hugh, Ramban)."}, "bereshit-book-name": {"label": "It is the book's name", "gloss": "The Hebrews name volumes from their opening words, so bresith is the title of Genesis (Jerome, Wigbod, Angelomus)."}, "six-preceded": {"label": "Six things preceded the world", "gloss": "Torah and the Throne of Glory were made before it; the patriarchs, Israel, the Temple and the Messiah's name were contemplated (Bereshit Rabbah 1:4)."}, "read-it-twice": {"label": "Say the phrase twice", "gloss": "In principio is to be repeated — once in the Son, once at the beginning of time — rather than decided (Comestor)."}, "lux-corporalis": {"label": "A bodily light", "gloss": "A material light made to light material things, standing in the sun's place until the fourth day (Basil, Ambrose, Bede, Hugh, Honorius, Comestor, Bonaventure)."}, "lux-angelica": {"label": "The angelic creation", "gloss": "The light is the spiritual creature called 'heaven' in v. 1, made light by turning to its Creator (Augustine, Angelomus, Rupert)."}, "lux-hidden": {"label": "Stored for the righteous", "gloss": "Too good for the wicked, it was hidden away and is kept for the righteous in the time to come (Bereshit Rabbah, b. Chagigah, Rashi)."}, "lux-garment": {"label": "From the light of his garment", "gloss": "God wrapped himself in it like a garment (Ps 104:2); the heavens were stretched out of it (Bereshit Rabbah, Pirkei de-Rabbi Eliezer)."}, "lux-from-temple": {"label": "From the site of the Temple", "gloss": "The light was created from the place of the sanctuary (Ezek 43:2; Jer 17:12)."}, "lux-becomes-luminaries": {"label": "The luminaries were made from it", "gloss": "The nature of light was made on day one and hung in the firmament on day four (the sages in b. Chagigah 12a; an unnamed opinion in Augustine)."}, "lux-twilight": {"label": "A light like the dawn", "gloss": "Not the sun's brightness but what the sky is before sunrise or after sunset (Remigius, Honorius, Comestor, Hugh)."}, "lux-is-day": {"label": "'Light' just means day", "gloss": "The verse answers itself: he called the light Day, so light here is put for day (Bruno)."}, "lux-is-distinction": {"label": "The distinguishing of the works", "gloss": "The light is the confused heap becoming distinct and knowable, not a thing at all (Abelard)."}, "fiat-is-instantaneous": {"label": "Speaking is making", "gloss": "No interval between the command and the thing: the Hebrew says only 'let it be, and it was' (Ambrose, Basil, Angelomus, Abelard)."}, "pair-is-formless-matter": {"label": "Unformed matter", "gloss": "The pair names the matter God had made and not yet given form to (Augustine, Angelomus, Hugh, Comestor)."}, "pair-is-under-water": {"label": "Hidden under the waters", "gloss": "Invisible because the waters covered it, and because there was neither light nor anyone to see (Basil, Alcuin, Angelomus, Ibn Ezra)."}, "pair-is-unfurnished": {"label": "No seed, no living thing", "gloss": "Empty of shoots and void of animals: a list of what was not there yet (Bede, Remigius, Rupert, Abelard, Hugh, Comestor, the targums)."}, "pair-is-a-name-for-us": {"label": "A name fitted to slow minds", "gloss": "Not a description but the most serviceable word for formlessness, since earth and the deep are the least comely things men know (Augustine, Confessions XII)."}, "pair-many-senses": {"label": "More than one true reading", "gloss": "Five readings of the clause are all true and none can be shown to be Moses' own (Augustine, Confessions XII.21)."}, "pair-is-two-things": {"label": "A green line and slimy stones", "gloss": "Tohu and bohu are two creatures made on the first day: a line encircling the world, and stones sunk in the deep (b. Chagigah 12a, Sefer Yetzirah)."}, "pair-is-matter-and-form": {"label": "Matter and its form", "gloss": "Tohu is the hyle, which can hold no name; bohu is bo hu, the form it puts on (Ramban)."}, "pair-is-astonishment": {"label": "Astonishment", "gloss": "Tohu is what astonishes whoever looks at it — the earth bewildered at her lot, or the reader appalled at the emptiness (Bereshit Rabbah 2:2, Rashi, the Bahir)."}, "pair-is-history": {"label": "The verse tells history", "gloss": "The clause is the first term of a periodization: the generations from Adam, the four kingdoms, or the Church before her children (Bereshit Rabbah 2:1, 2:3, 2:4; Bruno)."}, "pair-is-our-flesh": {"label": "The earth of our flesh", "gloss": "The soul before it has taken the form of doctrine (Isidore, Wigbod, Rabanus, Remigius, Bruno)."}, "pair-is-not-of-heaven": {"label": "Said of earth, not of heaven", "gloss": "The phrase is withheld from heaven, which was filled with angels as soon as it was made (Bede, the Glossa, Angelomus, Abelard)."}, "heaven-first": {"label": "Heaven first", "gloss": "Beit Shammai: the word order is the order of the acts, and a king has his throne made before its footstool (Isa 66:1)."}, "earth-first": {"label": "Earth first", "gloss": "Beit Hillel: a builder raises the lower storey first (Amos 9:6), and Gen 2:4 and Ps 102:26 name the earth before the heavens."}, "both-at-once": {"label": "Both together", "gloss": "The sages, and R. Shimon ben Yoḥai's stewpot and its lid (Isa 48:13); Ambrose, that the order of naming gives heaven no privilege of the firstborn."}, "order-of-dignity": {"label": "Named for dignity, not order", "gloss": "Heaven stands first because it is worthier, or because the account is about to turn to the earth (Hugh of St Victor; R. Yoḥanan's creation-and-completion)."}, "created-then-stretched": {"label": "Created in one order, stretched in the other", "gloss": "Resh Lakish: heaven was created first, the earth was stretched out first — so both proof-texts stand."}, "heaven-earth-is-everything": {"label": "A name for the whole creation", "gloss": "Two visible words standing for all that God made, given so for the weakness of little ones (Augustine, Alcuin, Angelomus, Comestor)."}, "heaven-is-empyrean": {"label": "The empyrean heaven", "gloss": "Not the visible firmament but a fiery — from brightness, not heat — and intellectual heaven, filled with angels as soon as it was made (Remigius, the Glossa, Comestor)."}, "heaven-earth-four-elements": {"label": "The four elements", "gloss": "Heaven names fire and air, earth names earth and water; the verse announces the material first principles of bodies (Ambrose, Abelard, Ramban, Comestor)."}, "et-includes": {"label": "The particle includes", "gloss": "Et ha-shamayim brings in the sun, moon and constellations; ve-et ha-aretz the trees, the plants and the Garden of Eden (Bereshit Rabbah 1:14, b. Chagigah 12a, Ramban)."}, "shamayim-is-water": {"label": "Sham mayim — 'there is water'", "gloss": "The name itself says what heaven is made of: water, or fire and water mingled into the firmament (b. Chagigah 12a)."}, "one-earth-only": {"label": "One earth, and no heaven of heavens here", "gloss": "If the heavens of v. 1 were the intelligible heaven, the earth beside it could not be the ground; the seven earths are seven regions of the one (Ibn Ezra; Abelard, from the other end)."}, "whole-then-parts": {"label": "The whole first, then the parts", "gloss": "V. 1 is a heading: Scripture commends everything God made in two words before going through it with 'God said' (Augustine, Angelomus, the Glossa)."}, "de-nihilo": {"label": "Out of nothing", "gloss": "God made the world, and the matter of the world, from nothing whatever."}, "matter-then-formed": {"label": "Matter first, then formed", "gloss": "Formless matter was created first — first in origin, not in time — and everything else made out of it."}, "matter-is-coeval": {"label": "Matter was already there", "gloss": "God is a craftsman working on a material he did not make. Reported on both benches, held by neither."}, "three-principles": {"label": "God, exemplar, matter", "gloss": "The philosophers' three principles without a principle, named as the position to be refuted."}, "all-of-them-created": {"label": "Of every one of them, creation is written", "gloss": "Each thing the objector calls a pre-existing material has its own verse saying God created it."}, "bara-is-not-ex-nihilo": {"label": "'Created' does not mean from nothing", "gloss": "The verb bara is used of the sea-creatures and of man, who were made from something."}, "creare-vs-formare": {"label": "Created, not formed", "gloss": "Scripture keeps two verbs apart: what has no pre-existing matter is created, what is shaped out of matter is formed."}, "hyle-is-tohu": {"label": "The hyle is tohu", "gloss": "The one created thing is a substance without form, which the Greeks call hyle and Scripture calls tohu."}, "made-from-something-of-god": {"label": "From the light and the snow", "gloss": "Heaven from the light of his garment, earth from the snow beneath the Throne of Glory."}, "craftsman-needs-matter": {"label": "A craftsman needs a material", "gloss": "Wood helps the carpenter, silver the silversmith — the analogy that makes creation from nothing unthinkable."}, "silence-proves-nothing": {"label": "Scripture's silence proves nothing", "gloss": "That Genesis does not say when a thing was made does not make it coeternal with God."}, "world-from-tohu": {"label": "The world was made out of tohu va-vohu", "gloss": "Said with embarrassment, and only because the verse says it."}, "tenebrae-privatio": {"label": "Darkness is not a thing", "gloss": "Darkness is the absence of light, as silence is the ceasing of voice and nakedness the absence of a garment; Scripture never says God made it (Augustine, Angelomus, Hugh)."}, "tenebrae-creatura": {"label": "God made the darkness too", "gloss": "The darkness is a work of God like the light — it is called with the light to bless the Lord in Dan 3, and it is on the rabbinic lists of what was made on the first day (Remigius, the Glossa, Wigbod's pupil; Pirkei de-Rabbi Eliezer, R. Tanḥuma)."}, "tenebrae-angeli": {"label": "The darkness is the apostate angels", "gloss": "The light of day one is the angelic creation and the division is between the holy angels and the unclean (Augustine, City of God XI.19; Angelomus, Hugh, Rupert, Comestor)."}, "tenebrae-peccatores": {"label": "The wicked, or their deeds", "gloss": "The division is moral: the just from sinners (Isidore, Remigius, the Glossa), or the deeds of the righteous from the deeds of the wicked (R. Yanai, R. Abahu)."}, "tenebrae-ignis": {"label": "Darkness names the element of fire", "gloss": "'Darkness' in v. 2 is elemental fire, which is dark; the deep is water and the spirit is air (Ramban)."}, "divisio-loci": {"label": "Divided by place and quality", "gloss": "The two were set apart in space and time — light over the upper part of the world, twelve hours above and twelve below, opposite hemispheres in turn (Basil, Bede, Rabanus, Honorius, Comestor; and R. Yoḥanan's two generals, each given his bound)."}, "divisio-nominis": {"label": "The dividing is the naming", "gloss": "There is no separate act of separation: 'and he divided' means by the calling of names (Ibn Ezra; entertained once by Augustine and dropped)."}, "divisio-est-ordinatio": {"label": "He did not make it but ordered it", "gloss": "God makes the forms and orders the privations, as a singer orders his rests and a painter his shadows, so that even a nothing has its place (Augustine)."}, "divisio-est-judicium": {"label": "The division is a judgement", "gloss": "A sentence passed, and irreversible: on the devil and his angels (Rupert, Hugh), or on the just and sinners by foreknowledge (Isidore)."}, "divisio-est-instantanea": {"label": "The division needed no second act", "gloss": "The two were never mixed: by the very fact that light was made, the division followed, as putting on a garment ends nakedness (Augustine, Hugh)."}, "formatum-ab-informi": {"label": "The formed from the unformed", "gloss": "The dividing is the distinction of the formed thing from the unformed, of the perfect from the imperfect and the distinct from the confused (Wigbod, Abelard, Honorius)."}, "bonum-approbatio": {"label": "'He saw' is approval, not discovery", "gloss": "God did not learn that the light was good: what pleased him to be made pleased him to remain (Alcuin, Comestor), or the seeing is in the thought (Ibn Ezra), or a good work attests itself when seen (Ambrose)."}, "bonum-withheld": {"label": "The approval is deliberately withheld", "gloss": "'It was good' is not repeated after the division, and the divine name is dropped from the naming of the night, so that the darkness should not be approved along with the light (Augustine, Wigbod; R. Elazar, R. Abahu)."}, "havdala-derived": {"label": "The verse is the source of the havdala rule", "gloss": "'He saw … and he divided' — one does not bless over the lamp until he has used its light (R. Ze'eira of Caesarea)."}, "lux-hivdil-set-aside": {"label": "He set the light aside", "gloss": "Va-yavdel means he separated it off — for himself (R. Yehuda bar Simon), or for the righteous in the time to come, like a king setting aside a fine portion for his son (the Rabbis)."}, "one-authority-singular-verb": {"label": "The verb is singular, so one maker", "gloss": "Not vaydaberu but vaydaber, not bare'u but bara — no one may say that two authorities created the world (Bereshit Rabbah 1:7; Ibn Ezra; and, to the opposite end, Abelard)."}, "elohim-is-plural-of-persons": {"label": "Eloim is plural: three persons", "gloss": "El is singular and Eloim plural, showing a diversity of persons each of which is God; the singular verb shows that they are one creator and their works undivided (Abelard)."}, "elohim-is-honorific-plural": {"label": "A plural of honour", "gloss": "Every language honours the great with a plural — adonim, be'alim, the king speaking of himself in Arabic — so Elohim is the plural of eloah and means nothing more (Ibn Ezra). This is his account of the NOUN. He refuses the same reading of the plural VERB at Gen 1:26, where Saadia offers it to him: see plural-of-majesty-refused."}, "elohim-is-plural-of-powers": {"label": "The force of all forces", "gloss": "El hem: the root el is force, and 'they' points to all the other forces, so Elohim is the master of them all — with a secret not disclosed (Ramban)."}, "trinity-in-the-triad": {"label": "Father, Beginning, Spirit", "gloss": "The three persons are named in order across the first two verses: God the Father, the Beginning who is the Son, the Spirit borne over the waters (Augustine, Basil, Ambrose, Bede, Bruno, Honorius, the Glossa)."}, "trinity-in-the-formula": {"label": "The threefold formula of the six days", "gloss": "God said — and it was so — and God made: the testimony is tripled everywhere because the creating Trinity works everywhere (Rupert; considered and refused by Augustine)."}, "trinity-is-brought-to-the-text": {"label": "The rule of faith comes first", "gloss": "The catholic faith is set out before the exposition begins, because heretics drag Scripture to their own opinion; the doctrine is what the chapter is read under (Augustine, De Genesi ad litteram imperfectus)."}, "spirit-is-holy-spirit": {"label": "The spirit of v. 2 is the Holy Spirit", "gloss": "Not the air and not a wind: Scripture reserved the name, and no other spirit is meant but the one who completes the Trinity (Basil, Ambrose)."}, "principium-is-the-son": {"label": "The Beginning is the Son", "gloss": "'I am the beginning, who also speak to you' (John 8:25) — though the Father too is a beginning, and not from a beginning (Wigbod, Remigius, Bruno)."}, "not-to-angels": {"label": "Not spoken to the angels", "gloss": "Whoever the 'let us' addresses, it is not angels: man was not created by angels, or there would be many creators and not one (Bruno)."}, "word-order-is-modesty": {"label": "God is named after his works", "gloss": "A mortal king proclaims his name and builds afterwards; the Holy One made the needs of his world and was named after — bereshit bara, and only then Elohim (R. Yudan in the name of Akilas; Ben Azzai)."}, "word-order-is-dangerous": {"label": "The word order had to be changed", "gloss": "The seventy-two elders wrote 'God created in the beginning' for Ptolemy, so that bereshit could not be read as the subject (b. Megillah 9a)."}, "should-have-begun-at-exodus": {"label": "It should have begun at Exodus 12:2", "gloss": "The Torah is Israel's law book and ought to have opened with the first commandment given to Israel; the creation account has to be accounted for (R. Isaac, in Rashi)."}, "claim-on-the-land": {"label": "Title to the land", "gloss": "'He declared to his people the power of his works, to give them the inheritance of the nations' (Ps 111:6) — so that Israel may answer the charge of robbery (Bereshit Rabbah 1:2; Rashi)."}, "do-not-expound-it": {"label": "It may not be expounded", "gloss": "Not before two, and not the four questions — what is above, what is below, what is before, what is after (m. Chagigah 2:1; Bereshit Rabbah 1:5 and 1:10)."}, "honour-of-the-maker": {"label": "For the honour of the Maker", "gloss": "Whoever has no care for the honour of his Maker, it were fitting he had not come into the world; and the concealed matters are not to be published for the expositor's own glory (m. Chagigah 2:1; Rav Huna in the name of Bar Kappara)."}, "the-bet-is-closed": {"label": "The bet is closed behind", "gloss": "The world was made with a bet, closed on three sides and open in front: you may ask only from the day of creation onward (R. Yona in the name of R. Levi)."}, "beginning-is-blessing": {"label": "Bet for blessing, not alef for curse", "gloss": "Made with the letter of berakhah rather than of arirah, so that the heretics could not say the world was created with a curse (Bereshit Rabbah 1:10)."}, "moses-is-a-witness": {"label": "Moses wrote as a witness", "gloss": "Not in the persuasion of human wisdom nor in the counterfeit disputations of philosophy, but in the showing of the Spirit and of power, as a witness of the divine work (Ambrose)."}, "against-the-philosophers": {"label": "Against the philosophers", "gloss": "Plato's three principles and the atomists' concourse are a spider's web; the divine mind alone contains the origins and causes of things (Ambrose)."}, "against-the-heretics": {"label": "Because the heretics attack it", "gloss": "The Manichees mock the Old Testament before the unlearned, so the first book must be defended, and defended plainly (Augustine)."}, "written-for-the-unlearned": {"label": "In plain speech, for the unlearned", "gloss": "Not with ornate and polished speech but with plain facts — the usual and simple speech the learned also understand (Augustine)."}, "the-work-shows-the-maker": {"label": "The work shows the worker", "gloss": "The world is a specimen of the divine working: like building and weaving, it shows the craftsman's skill even when the craftsman is silent (Ambrose)."}, "scripture-is-about-restoration": {"label": "Scripture is about restoration", "gloss": "The matter of all divine Scripture is the works of human restoration, completed not in six days but in six ages (Hugh of St Victor)."}, "foundation-is-for-secular-writings": {"label": "Foundation belongs to secular writings", "gloss": "The works of foundation are the matter of worldly writings; divine Scripture only descends through them on its way to the Incarnation (Hugh of St Victor)."}, "history-is-the-foundation": {"label": "History is the foundation", "gloss": "Scripture is a hall with foundation, wall and roof — history, allegory, tropology — and nothing can be built before the foundation is laid (Comestor)."}, "faciamus-is-the-trinity": {"label": "'Let us make' is the Trinity", "gloss": "The formula changes at this one verse — everywhere else 'let it be', here 'let us make' — to intimate a plurality of persons; the singular of v. 27 then gives the unity of the deity (Augustine, Bede, Alcuin, Wigbod, Remigius, the Glossa, Rupert, Abelard, Hugh, Comestor)."}, "faciamus-to-the-son": {"label": "The Father speaks to the Son", "gloss": "Not to himself, since the verb is not 'I shall make', and not to servants: the address is to the Son, who is the image (Basil, Ambrose, Comestor; refused by Augustine, since 'to our image' would then have to be 'to yours')."}, "faciamus-to-the-angels": {"label": "He said it to the angels", "gloss": "God took counsel with, or spoke to, the ministering angels — stated outright by Pseudo-Jonathan, argued by Rashi and Ibn Ezra, reported as an option by Remigius, taught with a moral by Hugh, printed at Gen 11:7 by the Glossa, and called a Jewish fiction by Basil."}, "image-of-the-whole-trinity": {"label": "To the image of the Trinity itself", "gloss": "Not to the image of the Father alone, or the Son alone, or the Spirit alone — and who would dare separate the Holy Spirit from that plurality? (Augustine, and the Gloss after him)."}, "counsel-with-the-household-above": {"label": "He took counsel with the household above", "gloss": "Be-mi nimlakh — with the ministering angels, the court that stands to right and left, out of the humility of the Holy One (Bereshit Rabbah 8:3 and 8:8, b. Sanhedrin 38b, Rashi)."}, "consilium-not-senate": {"label": "A soliloquy, not a senate", "gloss": "The counsel was held inwardly — be-libbo nimlakh, he took counsel with his heart; non tam senatu quam soliloquio — though the rabbinic bench draws from it that no second party was present and the Latin bench that three persons were (R. Ami, Rupert, Abelard)."}, "refutation-beside-the-claim": {"label": "The refutation is beside the opening", "gloss": "Wherever the verse gives the minim an opening, the answer stands next to it: 'let us make' answered by 'and he created', 'let us go down' by 'and the LORD came down' (R. Simlai, R. Yoḥanan, Rashi)."}, "dignity-of-the-creature": {"label": "The consultative form marks the creature's standing", "gloss": "A rational creature is made with counsel, so that its nobility may be shown — or, on the other bench, so that the great may learn to ask leave of the lesser (Alcuin, Bede, Hugh, Abelard; Bereshit Rabbah 8:8)."}, "plural-of-majesty-refused": {"label": "Not a plural of majesty", "gloss": "Saadia's reading of na'aseh as royal speech is refused and its proof texts parsed away one by one — 'these witnesses are false witnesses' (Ibn Ezra, against the Gaon, and against his own account of the plural noun at Gen 1:1)."}, "i-and-the-earth": {"label": "I and the earth", "gloss": "The plural has a second subject and it is the ground: the earth to bring forth the body from its elements, God to give the spirit (Ramban, crediting R. Yosef Kimḥi)."}}, "senses": {"literal": "Literal", "allegorical": "Allegorical", "spiritual": "Spiritual", "translation": "Translation"}};
const svg = d3.select('#map'), panel = document.getElementById('panel');
const g = svg.append('g');
const gRings = g.append('g'), gHubLinks = g.append('g'), gEdges = g.append('g'), gHubs = g.append('g'), gNodes = g.append('g'), gLabels = g.append('g');
let W = 800, H = 600, mode = 'answers';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const wn = D.witnesses.map(w => ({...w, kind: 'w'}));
const byId = Object.fromEntries(wn.map(n => [n.id, n]));
const ansKeys = Object.keys(D.answers), senseKeys = Object.keys(D.senses);
const hubsA = ansKeys.map(k => ({id: 'hub:' + k, kind: 'hub', key: k, label: D.answers[k].label, gloss: D.answers[k].gloss, facet: 'answers'}));
const hubsS = senseKeys.map(k => ({id: 'hub:' + k, kind: 'hub', key: k, label: D.senses[k], gloss: '', facet: 'sense'}));
const hubById = Object.fromEntries([...hubsA, ...hubsS].map(h => [h.id, h]));
const threads = D.threads.map(t => ({...t, source: byId[t.from], target: byId[t.to]})).filter(t => t.source && t.target);
const hubLinksA = wn.flatMap(w => w.answers.map(a => ({source: w, target: hubById['hub:' + a]})));
const hubLinksS = wn.flatMap(w => w.senses.map(s => ({source: w, target: hubById['hub:' + s]})));

let k = 1;
function applyScale() {
  nodeSel.attr('r', d => (d.slot ? 6 : 7) / k).attr('stroke-width', 2 / k);
  labelSel.attr('font-size', 11 / k + 'px').attr('dx', 10 / k).attr('dy', 4 / k);
  edgeSel.attr('stroke-width', d => (d.type === 'contests' ? 1.8 : d.type === 'parallel' ? 2 : 1.4) / k).attr('stroke-dasharray', d => d.type === 'echoes' ? `${5/k} ${4/k}` : d.type === 'parallel' ? `${2/k} ${4/k}` : null);
  if (hubSel) { hubSel.attr('r', 13 / k).attr('stroke-width', 1.5 / k); hubLblSel.selectAll('.hublbl').attr('font-size', 12 / k + 'px').attr('y', 30 / k); hubLblSel.selectAll('.hubsub').attr('font-size', 10.5 / k + 'px').attr('y', 43 / k); hubLinkSel.attr('stroke-width', 1 / k).attr('stroke-dasharray', `${1/k} ${3/k}`); }
  gRings.selectAll('text').attr('font-size', 10 / k + 'px'); gRings.selectAll('circle').attr('stroke-width', 1 / k);
}
svg.call(d3.zoom().scaleExtent([.5, 6]).on('zoom', e => { g.attr('transform', e.transform); if (e.transform.k !== k) { k = e.transform.k; applyScale(); } }));

// ---------- drawing
const edgeSel = gEdges.selectAll('path').data(threads).join('path').attr('class', d => 'edge ' + d.type)
  .on('mouseenter', (e, d) => showEdge(d, true)).on('mouseleave', (e, d) => showEdge(d, false)).on('click', (e, d) => { showEdge(d, true); e.stopPropagation(); });
const nodeSel = gNodes.selectAll('circle').data(wn).join('circle').attr('class', d => 'node ' + d.tradition + (d.slot ? ' slot' : '')).attr('r', d => d.slot ? 6 : 7)
  .on('click', (e, d) => { showWitness(d); e.stopPropagation(); }).on('mouseenter', (e, d) => focusNode(d, true)).on('mouseleave', (e, d) => focusNode(d, false))
  .call(d3.drag().on('start', (e, d) => { d.fx = d.x; d.fy = d.y; }).on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; sim.alpha(.3).restart(); }).on('end', (e, d) => { d.fx = null; d.fy = null; }));
const labelSel = gLabels.selectAll('text').data(wn).join('text').attr('class', 'lbl').text(d => d.short);
let hubSel, hubLblSel, hubLinkSel;

const sim = d3.forceSimulation().on('tick', tick);
function tick() {
  edgeSel.attr('d', d => { const {source: s, target: t} = d; const dx = t.x - s.x, dy = t.y - s.y, dr = Math.hypot(dx, dy) * 1.4; return `M${s.x},${s.y}A${dr},${dr} 0 0,1 ${t.x},${t.y}`; });
  nodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
  labelSel.attr('x', d => d.x).attr('y', d => d.y);
  if (hubSel) { hubSel.attr('cx', d => d.x).attr('cy', d => d.y); hubLblSel.attr('transform', d => `translate(${d.x},${d.y})`); hubLinkSel.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y); }
}

function size() { const r = svg.node().getBoundingClientRect(); W = r.width; H = r.height; }

function layout() {
  size(); const cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 40;
  gRings.selectAll('*').remove(); gHubs.selectAll('*').remove(); gHubLinks.selectAll('*').remove(); hubSel = null;
  const labelR = d => d.kind === 'hub' ? 46 : 12 + d.short.length * 2.4;
  sim.nodes(wn).force('charge', null).force('link', null).force('x', null).force('y', null).force('hublink', null).force('collide', d3.forceCollide(labelR).strength(.9));
  if (mode === 'answers' || mode === 'sense') {
    const hubs = mode === 'answers' ? hubsA : hubsS, links = mode === 'answers' ? hubLinksA : hubLinksS;
    hubs.forEach((h, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / hubs.length; h.fx = cx + Math.cos(a) * R * .9; h.fy = cy + Math.sin(a) * R * .9; h.x = h.fx; h.y = h.fy; });
    sim.nodes([...wn, ...hubs]);
    sim.force('charge', d3.forceManyBody().strength(d => d.kind === 'hub' ? -80 : -320))
       .force('hublink', d3.forceLink(links).distance(mode === 'answers' ? 120 : 150).strength(.6))
       .force('link', d3.forceLink(threads).distance(120).strength(.04))
       .force('x', d3.forceX(cx).strength(.03)).force('y', d3.forceY(cy).strength(.03));
    hubLinkSel = gHubLinks.selectAll('line').data(links).join('line').attr('class', 'hublink');
    hubSel = gHubs.selectAll('circle').data(hubs).join('circle').attr('class', 'hub').attr('r', 13).on('click', (e, d) => { showHub(d); e.stopPropagation(); });
    hubLblSel = gHubs.selectAll('g').data(hubs).join('g');
    hubLblSel.append('text').attr('class', 'hublbl').attr('text-anchor', 'middle').attr('y', 30).text(d => d.label);
    hubLblSel.append('text').attr('class', 'hubsub').attr('text-anchor', 'middle').attr('y', 43).text(d => (mode === 'answers' ? hubLinksA : hubLinksS).filter(l => l.target === d).length + ' witnesses');
  } else if (mode === 'time') {
    const dates = wn.map(d => d.date), d0 = Math.min(...dates), d1 = Math.max(...dates);
    const rOf = d => 50 + (d - d0) / (d1 - d0) * (R - 50);
    [0, 500, 1000].forEach(y => { gRings.append('circle').attr('class', 'ring').attr('cx', cx).attr('cy', cy).attr('r', rOf(y)); gRings.append('text').attr('class', 'ringlbl').attr('x', cx + 4).attr('y', cy - rOf(y) - 4).text(y === 0 ? 'year 1' : y); });
    gRings.append('text').attr('class', 'ringlbl').attr('x', cx + R * .7).attr('y', cy + R + 26).text('LATIN →').attr('text-anchor', 'middle');
    gRings.append('text').attr('class', 'ringlbl').attr('x', cx - R * .7).attr('y', cy + R + 26).text('← RABBINIC').attr('text-anchor', 'middle');
    const groups = {'greek-jewish': [], latin: [], rabbinic: []}; wn.forEach(w => groups[w.tradition].push(w));
    Object.values(groups).forEach(a => a.sort((p, q) => p.date - q.date));
    groups['greek-jewish'].forEach(w => { w.tx = cx; w.ty = cy - rOf(w.date); });
    groups.latin.forEach((w, i, a) => { const t = -Math.PI * .42 + (i / Math.max(1, a.length - 1)) * Math.PI * .84; w.tx = cx + Math.cos(t) * rOf(w.date); w.ty = cy + Math.sin(t) * rOf(w.date); });
    groups.rabbinic.forEach((w, i, a) => { const t = Math.PI + Math.PI * .42 - (i / Math.max(1, a.length - 1)) * Math.PI * .84; w.tx = cx + Math.cos(t) * rOf(w.date); w.ty = cy + Math.sin(t) * rOf(w.date); });
    sim.force('x', d3.forceX(d => d.tx).strength(.6)).force('y', d3.forceY(d => d.ty).strength(.6)).force('collide', d3.forceCollide(d => 8 + d.short.length * 1.6).strength(.8));
  } else if (mode === 'place') {
    const lons = wn.map(d => d.lon).filter(Number.isFinite), lats = wn.map(d => d.lat).filter(Number.isFinite);
    const sx = d3.scaleLinear().domain([Math.min(...lons) - 2, Math.max(...lons) + 2]).range([60, W - 120]);
    const sy = d3.scaleLinear().domain([Math.min(...lats) - 1, Math.max(...lats) + 1]).range([H - 50, 50]);
    const seen = new Set();
    wn.forEach(w => { w.tx = sx(w.lon); w.ty = sy(w.lat); if (!seen.has(w.place)) { seen.add(w.place); gRings.append('text').attr('class', 'placelbl').attr('x', w.tx + 12).attr('y', w.ty - 12).text(w.place); } });
    sim.force('x', d3.forceX(d => d.tx).strength(.5)).force('y', d3.forceY(d => d.ty).strength(.5)).force('collide', d3.forceCollide(d => 8 + d.short.length * 1.6).strength(.8));
  }
  applyScale();
  sim.alpha(1).restart();
}

// ---------- panel
function showHome() {
  const q = D.crux.question;
  panel.innerHTML = `<p class="eyebrow">Crux · Genesis 1:1</p><h2>${esc(q.en)}</h2><p class="la-q">${esc(q.la)}</p><p class="heb-q">${esc(q.he)}</p>
  <p>${esc(D.crux.summary)}</p><p>${esc(D.crux.finding)}</p>
  <p class="hint"><b>Answers</b> gathers witnesses around the reading they give; a witness between two hubs holds both. <b>Time</b> is a clock: distance from the centre is the date, Latin to the right, rabbinic to the left. <b>Places</b> is a map. <b>Senses</b> sorts by literal, allegorical, spiritual, translation. Threads keep their meaning in every arrangement. Click a node or a hub; hover a line; drag to pull the graph apart; scroll to zoom: zooming spreads the graph while dots and labels keep their size.</p>`;
}
function showWitness(w) {
  const lem = Object.entries(w.lemma || {}).filter(([k]) => k !== 'en').map(([k, v]) => `<span class="${k === 'he' || k === 'arc' ? 'heb' : 'lat'}" dir="${k === 'he' || k === 'arc' ? 'rtl' : 'ltr'}">${esc(v)}</span>`).join(' ');
  const ocls = (w.olang === 'he' || w.olang === 'arc') ? 'heb' : 'lat';
  const ans = (w.answers || []).map(a => `<span>${esc(D.answers[a]?.label || a)}</span>`).join('');
  const ins = threads.filter(t => t.target === w), outs = threads.filter(t => t.source === w);
  const rel = [...outs.map(t => `→ ${t.type} · ${esc(t.target.short)}`), ...ins.map(t => `← ${t.type} · ${esc(t.source.short)}`)].join('<br>');
  panel.innerHTML = `<p class="eyebrow">${esc(w.tradition.replace('-', ' '))} · ${esc(w.datelabel)} · ${esc(w.place)}</p><h2>${esc(w.author)}</h2><p class="meta">${esc(w.source)}</p>
  <p class="lem">${lem}</p><p>${esc(w.en)}</p><div class="orig ${ocls}">${esc(w.orig)}</div><div class="ans">${ans}</div><p class="note">${esc(w.notes)}</p>
  <p class="cred">${w.translator === 'claude-draft' ? 'Draft English (Claude), awaiting Wilson' : 'English: ' + esc(w.translator)}</p>${rel ? `<p class="cred">${rel}</p>` : ''}`;
  panel.scrollTop = 0;
}
function showHub(h) {
  const links = (h.facet === 'answers' ? hubLinksA : hubLinksS).filter(l => l.target === h);
  panel.innerHTML = `<p class="eyebrow">${h.facet === 'answers' ? 'Answer family' : 'Sense'}</p><h2>${esc(h.label)}</h2><p>${esc(h.gloss)}</p>
  <p class="cred">${links.map(l => esc(l.source.short) + ' · ' + esc(l.source.datelabel)).join('<br>')}</p>`;
  nodeSel.classed('dim', d => !links.some(l => l.source === d)); labelSel.classed('dim', d => !links.some(l => l.source === d));
}
function showEdge(t, on) {
  edgeSel.classed('on', d => on && d === t);
  nodeSel.classed('on', d => on && (d === t.source || d === t.target));
  if (on) { panel.innerHTML = `<p class="eyebrow">${esc(t.type)} · ${esc(t.source.short)} → ${esc(t.target.short)}</p><div class="ev">${esc(t.evidence)}</div>`; }
}
function focusNode(w, on) {
  edgeSel.classed('dim', d => on && d.source !== w && d.target !== w);
  nodeSel.classed('dim', d => on && d !== w && !threads.some(t => (t.source === w && t.target === d) || (t.target === w && t.source === d)));
  labelSel.classed('dim', d => on && d !== w && !threads.some(t => (t.source === w && t.target === d) || (t.target === w && t.source === d)));
}
svg.on('click', () => { nodeSel.classed('dim', false).classed('on', false); labelSel.classed('dim', false); edgeSel.classed('dim', false).classed('on', false); showHome(); });
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; document.querySelectorAll('.modes button').forEach(x => x.setAttribute('aria-pressed', x === b)); layout(); }));
document.querySelectorAll('#filters input').forEach(c => c.addEventListener('change', () => { const off = new Set([...document.querySelectorAll('#filters input')].filter(i => !i.checked).map(i => i.dataset.type)); edgeSel.classed('hidden', d => off.has(d.type)); }));
window.addEventListener('resize', () => layout());
size(); wn.forEach(w => { w.x = W / 2 + (Math.random() - .5) * 200; w.y = H / 2 + (Math.random() - .5) * 200; });
showHome(); layout();
</script>
