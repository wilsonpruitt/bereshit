d, which we think of, by the proportion of its greatness, as one man. For man, when he is first born into the light, passes his infancy, the first age, which extends from Adam to Noah in ten generations: the flood is as it were the evening of this [0071A] day, because our infancy is blotted out by the flood of forgetfulness.\n\n[n: (STRAB.)] « Void and empty. » Useless, namely, and unfruitful, and unordered. For all the elements were mingled and confused, and this whole space of air was full of waters; not such as they now are, but they were like thin clouds, such as those above the heavens still are.", "translator": "wilson-pruitt", "orig": "« Et Spiritus Domini ferebatur super aquas. » [n: (AUG., lib. I de Gen. ad lit., c. 5, tom. III.)] Sive totam corporalem materiam aquam appellavit, ut insinuaret unde facta et formata sunt omnia quae ex humida natura per species varias in terra formari videmus; sive spiritualem vitam ante conversionis [0070B] formam quasi fluitantem. Spiritus Dei superferebatur, quia subjacebat bonae voluntati Creatoris, quod formandum et perficiendum inchoaverat. Dictum est etiam « Spiritus Domini ferebatur super aquas. » Ne faciendo opera potius per necessitatem indigentiae quam per abundantiam beneficentiae Deus amare putaretur. Commode enim prius insinuatur aliquid inchoatum, cui superferretur: non loco, sed omnia superante potentia.\n\n« Et Spiritus Domini ferebatur, » etc. [n: (HIERON. in Gen. t. III, col. 939.)] In Hebraeo habet *merahephet,* id est, incubabat, vel fovebat, more volucris ova calore animantis. Intelligimus ergo non de spiritu mundi dici, ut putant multi; sed de Spiritu [0070C] sancto, qui et ipse est omnium vivificator: si autem vivificator, et conditor; si conditor, et Deus. Psal. CIII: « Emitte, ait, Spiritum tuum et creabuntur. »\n\n« Et Spiritus, » etc. In quo subsistentes requiesceremus flatu ejus vivificati, et unda baptismi abluti. « Et Spiritus Domini ferebatur super aquas, » etc. Sicut Deus, scilicet et conditor, praeerat fluitanti et confusae materiei, ut distingueret quando vellet. Tota ergo Trinitas hic operata intelligitur, Deus, Pater scilicet; principium, Filius; Spiritus Dei, Spiritus sanctus.\n\n« Et Spiritus, » etc. [n: (ISID., in Gen.? )] Corda scilicet fluctuantia, quae mentis quietem amiserant, [0070D] quia eis spiritus non innitebatur, sed superferebatur: quasi potens naturam a confusione in melius revocare. Deinde per totum hujus Scripturae textum sex quasdam operosas aetates videmus, licet quasi proximis limitibus distinctas, ut in septima quies speretur; et eas habere similitudinem sex dierum, quibus ea facta sunt, quae Deum fecisse Scriptura commemorat. Primordium enim generis humani, quo ista luce frui coepit, comparatur primo diei quo lucem Deus fecit. Haec aetas tanquam infantia est totius saeculi, quod tanquam unum hominem proportione magnitudinis suae cogitamus. Homo enim cum primo nascitur in lucem, infantiam agit primam aetatem, quae tendit ab Adam usque ad Noe generationibus decem: diluvium quasi vespera hujus [0071A] diei est, quia infantia nostra oblivionis diluvio deletur.\n\n[n: (STRAB.)] « Inanis et vacua. » Inutilis scilicet, et infructuosa, et incomposita. Omnia enim elementa commixta, confusa, et totum hoc aeris spatium aquis plenum; non quales nunc sunt, sed sicut nebulae tenues erant, quales adhuc supercoelestes sunt.", "olang": "la", "source": "PL 113, col. 70A–70D (marginal glosses on 1:2, in the order printed; the 'inanis et vacua' gloss from 69D appended)", "notes": "Four glosses stand on the verse in the margin: Augustine Gn. litt. I.5 (water as matter; love not from need; 'not in place but by a power surpassing all'); Jerome's merahephet, cited by PL column; an unlabelled sentence that is Bede's Trinity gloss via Rabanus ('Tota ergo Trinitas hic operata'); and one Migne marks 'ISID. in Gen.?' (the floating hearts, which is Isidore's moral reading in Augustine's wording). The lemma reads 'Spiritus Domini', the Old Latin, not the Vulgate's 'Spiritus Dei' — Wilson's [var:] flags it. The bird enters the Glossa through Jerome only; the Syrian and the craftsman are both absent.", "slot": false}, {"id": "honorius-hex-1", "short": "Honorius", "author": "Honorius Augustodunensis", "tradition": "latin", "date": 1140, "datelabel": "c. 1140", "place": "Regensburg", "lat": 49.02, "lon": 12.1, "answers": ["brooding-warmth", "trinity"], "senses": ["literal"], "lemma": {"la": "vel aquas fovebat, id est cuncta de aquis procreanda animabat", "en": "or was warming the waters, that is, giving life to all that was to come from them"}, "en": "'And the Spirit of the Lord was borne over the waters,' or 'was warming the waters,' that is, was giving life to all that was to be brought forth from the waters. And note the Trinity: to God the Father is ascribed the creation of the world, to the Son the disposing of things, to the Holy Spirit the quickening, or adorning, of all.", "translator": "claude-draft-approved", "orig": "Et Spiritus Domini ferebatur super aquas, vel aquas fovebat, id est cuncta de aquis procreanda animabat. Et nota Trinitatem. Deo Patri ascribitur mundi creatio, Filio rerum dispositio, Spiritui sancto omnium vivificatio, vel ornatio.", "olang": "la", "source": "PL 172, col. 254C", "notes": "By 1140 'vel aquas fovebat' is offered as a bare variant reading, no Syrian, no bird: the image has become a lemma.", "slot": false}, {"id": "lxx-1-1", "short": "lxx-1-1", "author": "The Seventy", "tradition": "greek-jewish", "date": -250, "datelabel": "c. 250 BCE", "place": "Alexandria", "lat": 31.2, "lon": 29.92, "answers": ["principio-temporis"], "senses": ["translation"], "lemma": {"el": "ἐν ἀρχῇ", "en": "in the beginning"}, "en": "In the beginning God made the heaven and the earth.", "translator": "claude-draft-approved", "orig": "ἐν ἀρχῇ ἐποίησεν ὁ θεὸς τὸν οὐρανὸν καὶ τὴν γῆν.", "olang": "el", "source": "LXX Gen 1:1 (Rahlfs)", "notes": "ἐν ἀρχῇ without an article and without a governing noun: the Greek turns a Hebrew word that may be construct into an adverbial phrase, and in doing so closes off the reading Rashi and Ibn Ezra will call the plain sense. Note also ἐποίησεν, 'made', where the Vulgate will write creavit: the Latin bench's whole argument that creare means to make from nothing has no purchase on the Greek. Every Latin witness here quotes fecit or creavit according to which Latin text is in front of him, and the variation is evidence, not noise.", "slot": false}, {"id": "rupert-gen-1-8", "short": "Rupert", "author": "Rupert of Deutz", "tradition": "latin", "date": 1114, "datelabel": "c. 1114", "place": "Liège", "lat": 50.63, "lon": 5.57, "answers": ["brooding-warmth", "love-gift"], "senses": ["literal", "spiritual"], "lemma": {"la": "melioratur ovum in eo quod calore volucris animatur et pullum producit", "en": "an egg is bettered in that it is quickened by a bird's warmth and brings forth a chick"}, "en": "For next follows the forming or adorning of that same creature, and it receives from the attention of the Spirit of God as great a bettering and as great a supplying of its poverty as, in its own small measure, an egg is bettered in that it is quickened by a bird's warmth and brings forth a chick. And what do we think this spirit is, but the goodness and love of God — a love not of feelings but substantial; love, I say, and life, and living power abiding in the Son and the Father, or proceeding from both, consubstantial with Father and Son.", "translator": "claude-draft-approved", "orig": "Deinceps namque creaturae ejusdem formatio vel exornatio succedit, tantamque ex intentione Spiritus Dei meliorationem et tantum inopiae suae supplementum capit, quantum pro modulo suo melioratur ovum in eo quod calore volucris animatur et pullum producit. Quid autem putamus esse hunc spiritum, nisi bonitatem amoremque Dei, amorem non affectuum, sed substantialem, amorem, inquam, et vitam, virtutemque vivam in Filio et Patre manentem, vel ab utroque procedentem, Patri Filioque consubstantialem.", "olang": "la", "source": "PL 167, col. 205C", "notes": "Rupert has the egg but not the Syrian: the image arrives already naturalized. His 'love' is Confessions XIII.9 turned Trinitarian. Not found by the plan's search; surfaced by grepping the TEI for the bird vocabulary.", "slot": false}, {"id": "targ-neof-1-1", "short": "targ-neof-1-1", "author": "Targum Neofiti", "tradition": "rabbinic", "date": 300, "datelabel": "100–400", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["beginning-is-wisdom"], "senses": ["translation"], "lemma": {"arc": "מלקדמין בחכמה", "en": "from the first, in wisdom"}, "en": "In the beginning and in great wisdom, God created and finished the heavens and the earth.", "translator": "Sefaria Community Translation", "orig": "מלקדמין בחכמה [בחוכמתא] ברא (ד)יי שכלל [ושכלל] ית שמיא וית ארעא:", "olang": "arc", "source": "Targum Neofiti, Gen 1:1 (Vatican, Neofiti 1)", "notes": "The single most consequential word on this crux: Neofiti does not translate bereshit, it interprets it — min qadmin be-ḥokhmah, 'from the first, in wisdom' — and then adds a second verb, shakhlel, 'and finished'. A Palestinian targumist and the Latin fathers reach the same gloss on the same word, 'in Wisdom', and then part company entirely over what Wisdom is: for Bereshit Rabbah it is the Torah, for Augustine and Bede it is the Son. Neither side knows the other is there. The CC0 English prints 'in great wisdom'; there is no word for 'great' in the Aramaic, and the reading בחוכמתא recorded in the manuscript's own margin is simply the emphatic state. Note that this witness and K7's targ-neof-1-2 are two slices of one Sefaria segment: the whole of Gen 1:1–5 comes back as a single block.", "slot": false}, {"id": "targ-onk-1-1", "short": "targ-onk-1-1", "author": "Targum Onkelos", "tradition": "rabbinic", "date": 200, "datelabel": "100–300", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["principio-temporis"], "senses": ["translation"], "lemma": {"arc": "בְּקַדְמִין", "en": "in former times"}, "en": "In the beginning the LORD created the heavens and the earth.", "translator": "claude-draft-approved", "orig": "בְּקַדְמִין בְּרָא יְיָ יָת שְׁמַיָּא וְיָת אַרְעָא", "olang": "arc", "source": "Sefaria, 'Onkelos Genesis'", "notes": "be-qadmin, a plain adverb of time and nothing else: no construct, no wisdom, no first thing. Onkelos hears the verse as the Greek does. Etheridge's Onkelos did not return from Sefaria by version title (see notes/SOURCES-FINDINGS.md) and the Metsudah English is CC BY-NC, so the English is a fresh draft.", "slot": false}, {"id": "targ-psj-1-1", "short": "targ-psj-1-1", "author": "Targum Pseudo-Jonathan", "tradition": "rabbinic", "date": 750, "datelabel": "600–800", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["principio-temporis"], "senses": ["translation"], "lemma": {"arc": "מִן אַוְולָא", "en": "from the first"}, "en": "At the beginning the LORD created the heavens and the earth.", "translator": "J. W. Etheridge, 1862", "orig": "מִן אַוְולָא בְּרָא יְיָ יַת שְׁמַיָא וְיַת אַרְעָא", "olang": "arc", "source": "Sefaria, 'Targum Jonathan on Genesis'", "notes": "A third Aramaic word for the same Hebrew one: min avvela, 'from the first'. Etheridge prints the Aramaic in transliteration inside his English ('At the beginning (min avella)'), which is why his sentence carries a gloss no other version has; the parenthesis is his.", "slot": false}, {"id": "vulgate-1-1", "short": "vulgate-1-1", "author": "Jerome", "tradition": "latin", "date": 392, "datelabel": "c. 392", "place": "Bethlehem", "lat": 31.7, "lon": 35.2, "answers": ["principio-temporis"], "senses": ["translation"], "lemma": {"la": "In principio", "en": "In the beginning"}, "en": "In the beginning God created the heaven and the earth.", "translator": "claude-draft-approved", "orig": "In principio creavit Deus coelum et terram.", "olang": "la", "source": "PL 28, col. 163C", "notes": "Jerome translates in principio and not in Filio, and in the Hebrew Questions he says in so many words why: the reading 'in the Son' is false as a translation, however true as a sense. But he also writes creavit where the Old Latin his own contemporaries quote has fecit — Augustine, Ambrose, Bede and the Glossa all argue from fecit — so the Latin bench spends seven centuries reasoning about a verse in two versions at once.", "slot": false}], "threads": [{"id": "t-k3-01", "from": "abelard-hex-1-1-eloim", "to": "br-1-7", "type": "parallel", "evidence": "The star thread of the site. Both ask why the plural noun Elohim takes a singular verb, in the same words. R. Yitzḥak: 'bereshit bare'u Elohim is not written here, but bara Elohim' — and therefore no creature can say that two authorities created the world. Abelard: 'unde autem dictum est Eloim creavit, non creaverunt? ut videlicet ad plurale nomen singulare verbum referretur; quatenus insinuaretur in tribus illis personis non tres creatores, sed unum tantum debere intelligi.' One grammatical fact, seven hundred years apart, no contact, and the same conclusion drawn about the verb — one creator — from opposite conclusions about the noun.", "crux": "elohim-and-trinity"}, {"id": "t-k3-02", "from": "ibn-ezra-1-1-elohim", "to": "abelard-hex-1-1-eloim", "type": "contests", "evidence": "The same question and the opposite answer, twenty years apart and with no possible contact. Abelard: Eloim is plural, showing a plurality of divine persons, each of which is God, and the singular verb shows they are one creator. Ibn Ezra: Elohim is the plural of eloah, and the plural is how the Holy Tongue speaks of the great — as adonim and be'alim are plural for one master, and as a king in Arabic speaks of himself in the plural — 'and for this reason Scripture says bara and not bare'u.' Each has the whole of the other's evidence and takes the plural to mean the opposite thing.", "crux": "elohim-and-trinity"}, {"id": "t-k3-03", "from": "ibn-ezra-1-1-elohim", "to": "br-1-7", "type": "echoes", "evidence": "Ibn Ezra's closing clause is Bereshit Rabbah's argument reduced to a grammarian's note: 'for this reason Scripture says bara and not bare'u.' What the midrash offers as a refutation of two authorities, he offers as the expected concord of an honorific plural — the same reading with the polemic taken out and a comparative philology of Arabic, Hebrew and the vernaculars put in.", "crux": "elohim-and-trinity"}, {"id": "t-k3-04", "from": "ramban-1-1-elohim", "to": "ibn-ezra-1-1-elohim", "type": "contests", "evidence": "Ramban has Ibn Ezra open in front of him throughout the comment on this verse and takes the plural the other way: not an honorific but a compound, el hem, the force and 'they' — all the other forces — so that Elohim is the force of all forces. He does not deny the grammar; he refuses to let the plural be empty. 'A secret will yet be disclosed in connection with this' says that the real answer is one he will not print.", "crux": "elohim-and-trinity"}, {"id": "t-k3-05", "from": "ramban-1-1-elohim", "to": "abelard-hex-1-1-eloim", "type": "parallel", "evidence": "The two witnesses on this daf who make the plurality of the noun a plurality in God, and they could not be further apart on what it is. Abelard: a diversity of persons, of which each one is God, and the doctrine is preachable and technical — opera Trinitatis indivisa. Ramban: the master of all the forces, and a secret that will be disclosed elsewhere. A century apart, in Paris and in Girona, with nothing between them but the same three consonants.", "crux": "elohim-and-trinity"}, {"id": "t-k3-06", "from": "b-meg-9a", "to": "br-1-7", "type": "echoes", "evidence": "The same anxiety twice, once as exegesis and once as translation history. R. Yitzḥak proves from the singular verbs that no one can say two authorities created the world; the elders before Ptolemy move the divine name to the front of the sentence — 'God created in the beginning' — so that bereshit cannot be read as the subject of bara, that is, as a power that made God. Both are defending the first verse against a reading that finds more than one maker in it.", "crux": "elohim-and-trinity"}, {"id": "t-k3-07", "from": "b-meg-9a", "to": "br-1-12", "type": "contests", "evidence": "The elders reverse the word order that R. Yudan and Ben Azzai explain and praise. For the Bavli's baraita the sequence bereshit bara … Elohim is a danger to be removed for a Greek reader; for Bereshit Rabbah it is the Holy One's modesty — a mortal king proclaims his name and produces his works afterwards, but God acted first and was named after. The same three words are a liability in Alexandria and a virtue in Caesarea.", "crux": "elohim-and-trinity"}, {"id": "t-k3-08", "from": "b-meg-9a", "to": "abelard-hex-1-1-eloim", "type": "parallel", "evidence": "The baraita reports the elders removing from the Greek exactly the two features the Latin bench builds on, and neither removal reached the Church. The first item on their list is the word order of Gen 1:1; the second is the plural of Gen 1:26 turned singular. The Septuagint as transmitted has neither change. Abelard's argument needs the plural noun standing next to a singular verb in the first verse, which is what the elders are said to have rearranged, and Bruno's needs the 'let us make' of Gen 1:26, which is what they are said to have made singular.", "crux": "elohim-and-trinity"}, {"id": "t-k3-09", "from": "bruno-gen-1-1c", "to": "br-1-7", "type": "parallel", "evidence": "Both refuse a plurality of creators in the same words and against different opponents. R. Yitzḥak: no creature can say that two authorities created the world. Bruno: was he speaking to the angels? God forbid — for otherwise there would be not one creator but many, whereas God alone is the creator of all. The premise is shared exactly; what Bruno does next with it, and the midrash cannot, is find the second and third persons in the same verses.", "crux": "elohim-and-trinity"}, {"id": "t-k3-10", "from": "bruno-gen-1-1c", "to": "aug-conf-13-5", "type": "echoes", "evidence": "'Habes ergo Deum, id est Patrem; habes et principium, id est Filium … Habes igitur et Spiritum sanctum' is Augustine's three-term reading turned into a schoolroom enumeration, with the same John 8:25 for the Son and the same Spirit of v. 2 for the third. What Augustine reached at the end of a search and called a riddle, Bruno hands over in three sentences as something the reader can check.", "crux": "elohim-and-trinity"}, {"id": "t-k3-11", "from": "aug-conf-13-5", "to": "aug-gnl-1-5-11", "type": "echoes", "evidence": "The same triad in the same order in two works: the Father in the name of God, the Son in the name of the Beginning, the Spirit borne over the waters, which De Genesi ad litteram calls the completa commemoratio Trinitatis. What the Confessions add is the sequence of the search — he held two, he already believed the third, and he went looking for it in the text.", "crux": "elohim-and-trinity"}, {"id": "t-k3-12", "from": "aug-gnl-imp-1-2", "to": "aug-conf-13-5", "type": "contests", "evidence": "Augustine on both sides of the question this crux really turns on. In the unfinished commentary the catholic faith is set out before the exposition begins, expressly because heretics drag Scripture to their own opinion, so that the Trinity is the rule the chapter will be read under. In the Confessions the Trinity 'appears to me in a riddle' out of the first words. The two are not incompatible and he never reconciles them, and every later Latin witness on this daf writes as though only the second were true.", "crux": "elohim-and-trinity"}, {"id": "t-k3-13", "from": "basil-hex-2-6b", "to": "ambrose-hex-1-8-29", "type": "transmits", "evidence": "Ambrose is reading Basil at Milan and makes the same choice between the same two readings: either the spirit of v. 2 is the air, or it is the Holy Spirit — 'but we, agreeing with the judgement of the saints and the faithful, take it as the Holy Spirit, so that the working of the Trinity may shine out in the constitution of the world.' Basil's reason is that Scripture reserved the name; Ambrose's is that the third person is needed to complete the triad the first verse began.", "crux": "elohim-and-trinity"}, {"id": "t-k3-14", "from": "basil-hex-2-6b", "to": "bede-gen-1-2", "type": "parallel", "evidence": "Expletor and the same argument from the shape of the sentence, three centuries and a language apart: Basil, that no other spirit is meant but the Holy, who is the completer of the venerable Trinity; Bede, that having first declared that in the beginning, that is in the Son, the Father made heaven and earth, Scripture brought in mention of the Holy Spirit too, so as to signify the power of the whole Trinity together in the creation of the world.", "crux": "elohim-and-trinity"}, {"id": "t-k3-15", "from": "aug-conf-13-5", "to": "bede-gen-1-2", "type": "cites", "evidence": "Bede's sentence is Augustine's triad with the two halves welded: 'in principio, id est in Filio, Pater fecit coelum et terram' and then the Spirit added 'ut totius simul Trinitatis in creatione mundi virtutem significaret'. The riddle has become a demonstration, and the word aenigma is gone.", "crux": "elohim-and-trinity"}, {"id": "t-k3-16", "from": "wigbod-gen-1-1d", "to": "aug-conf-13-5", "type": "echoes", "evidence": "'In principio sibi coaeterno fecit Deus coelum et terram, in unigenito Filio qui est sapientia Patris' is Augustine's 'in Principio sapientiae nostrae quod est tua Sapientia de te nata, aequalis tibi et coaeterna, id est in Filio tuo' with the possessives dropped and 1 Cor 1:24 put in for the identification. The Carolingian dialogue asked a question about time and was answered with a person.", "crux": "elohim-and-trinity"}, {"id": "t-k3-17", "from": "remigius-gen-1-1c", "to": "wigbod-gen-1-1d", "type": "echoes", "evidence": "The same identification with the same proof text, and Remigius adds the guard the dialogue does not have: God the Father too is a beginning, but not from a beginning, since he is begotten of none. Once 'in the beginning' names the Son because the Son is a principium, the word will fit the Father as well, and only Remigius notices.", "crux": "elohim-and-trinity"}, {"id": "t-k3-18", "from": "remigius-gen-1-1c", "to": "br-1-12", "type": "parallel", "evidence": "Both benches ask what may properly be predicated of the creator and answer it out of the first verse's word order. R. Yudan in the name of Akilas: to this one it is fitting to call God — because he acted first and was named afterwards, unlike a king acclaimed before he has built anything. Remigius: the Father is a beginning, but not from a beginning. The rabbinic argument is about the order of the words in the sentence and the Latin about the order of the persons in God, and both are reading the same three words.", "crux": "elohim-and-trinity"}, {"id": "t-k3-19", "from": "rupert-gen-1-3-trinitas", "to": "aug-gnl-1-5-11", "type": "contests", "evidence": "Rupert builds his whole Hexaemeron on the reading Augustine considered and refused. Augustine asks whether the Trinity is to be understood in 'God said, let it be — and God made — and God saw that it was good', and answers that it does not befit the unity of the Trinity for the Son to be understood as making under orders and the Spirit as freely approving. Rupert takes the threefold formula as the Trinity's signature everywhere in the six days, and escapes the objection by making the three words a testimony rather than three offices.", "crux": "elohim-and-trinity"}, {"id": "t-k3-20", "from": "rupert-gen-1-3-trinitas", "to": "rupert-gen-1-8", "type": "echoes", "evidence": "One design stated twice. At Gen 1:2 the Spirit's brooding is what betters the creature as a bird's warmth betters an egg; here the threefold formula of every day's work is the trace of the creating Trinity, tied to the law of three witnesses. Both are claims about how the chapter was written, not about what happened in it.", "crux": "elohim-and-trinity"}, {"id": "t-k3-21", "from": "honorius-hex-1", "to": "aug-conf-13-5", "type": "echoes", "evidence": "Honorius states the triad and then does something Augustine does not: he distributes the works. 'Note the Trinity: to God the Father is ascribed the creation of the world, to the Son the disposition of things, to the Holy Spirit the quickening or adorning of all.' That is the appropriation doctrine of the twelfth-century schools laid over the first two verses, and it is the distribution of labour Augustine had warned against.", "crux": "elohim-and-trinity"}, {"id": "t-k3-22", "from": "glossa-1-2-ruach", "to": "aug-gnl-1-5-11", "type": "cites", "evidence": "The standard gloss on the Spirit clause is Augustine's De Genesi ad litteram I.5 printed under his name, so that what the twelfth-century schoolroom reads on Gen 1:2 is the third term of Augustine's triad in Augustine's own words — the Spirit borne over the waters not by place but as the will of a craftsman is over what he makes, a love that comes not from need but from bounty.", "crux": "elohim-and-trinity"}, {"id": "t-k3-23", "from": "abelard-hex-1-1-eloim", "to": "aug-gnl-1-5-11", "type": "cites", "evidence": "Abelard names Augustine for the procession — 'the person of the Holy Spirit and of the Father, from whom that Spirit principally proceeds, as blessed Augustine records' — and gets the first half of his Trinity the Augustinian way, out of the sequence of the verses: the Spirit from 'the Spirit of the Lord', the Word from 'God said'. Only then does he turn to the Hebrew noun, which Augustine did not have and could not have used.", "crux": "elohim-and-trinity"}, {"id": "t-k3-24", "from": "bruno-gen-1-1c", "to": "remigius-gen-1-1c", "type": "echoes", "evidence": "The same identification of the Son with the principium of Gen 1:1 from the same verse of John — 'ego principium qui et loquor vobis' — in Auxerre about 890 and at Segni about 1090. It is the most stable single move on the Latin bench and it is what makes the three-term reading possible at all: without a person in the second word there is no triad to complete.", "crux": "elohim-and-trinity"}, {"id": "t-k3-25", "from": "aug-gnl-imp-1-2", "to": "br-1-7", "type": "parallel", "evidence": "Both texts open their treatment of Genesis by fencing it against a dualism, and both do it before expounding a word. Augustine sets out the catholic faith first, because many heretics drag the Scriptures to their own opinion, and ends by ruling that nothing in the creature belongs to the Trinity except that the Trinity made it. R. Yitzḥak rules that no creature can say that two authorities created the world. The heresies are not the same and the manoeuvre is identical: the first verse is made to exclude a second maker before it is made to say anything else.", "crux": "elohim-and-trinity"}, {"id": "t-k3-x1", "from": "comestor-hs-1-1", "to": "aug-conf-13-5", "type": "echoes", "evidence": "Phase 4. 'Creatus autem est in principio, id est in Filio' is Augustine's second term reduced to an apposition and taught as settled — the riddle of Confessions XIII.5 become a gloss a reader passes over. Written at Phase 4 because `comestor-hs-1-1` was built for K1 and its opening clause belongs to this crux.", "crux": "elohim-and-trinity"}, {"id": "t-k3-x2", "from": "b-meg-9a", "to": "lxx-1-1", "type": "contests", "evidence": "Phase 4. The baraita says the seventy-two elders wrote 'God created in the beginning' for Ptolemy, moving the divine name to the front so that bereshit could not be read as a subject. The Septuagint as transmitted has not moved it: en archē epoiēsen ho theos keeps the Hebrew order. The change the rabbinic bench remembers making is not in the Greek the Church inherited, and the Latin reading of the verse stands in the space it would have closed.", "crux": "elohim-and-trinity"}, {"id": "t-k3-x3", "from": "targ-onk-1-1", "to": "br-1-7", "type": "parallel", "evidence": "Phase 4. The targum removes the difficulty the midrash has to argue about. Where the Hebrew has the plural-looking Elohim with a singular verb, Onkelos writes YY — the Tetragrammaton, which is not plural in form — so that no reader of the Aramaic could raise the question of two authorities at all. R. Yitzḥak has to answer it three times from the verbs.", "crux": "elohim-and-trinity"}, {"id": "t-k3-26", "from": "basil-hex-1-26-judaei", "to": "targ-psj-1-26", "type": "contests", "evidence": "Basil reports the position and Pseudo-Jonathan is the position. 'Ferunt enim, quod angelis dixerit: Faciamus hominem' — for they say that he said it to the angels — is answered as a Judaica fictio; and the targum reads, in the biblical line itself, 'and the LORD said to the angels who minister before him … let us make a human in our image'. Basil's argument against it is the image clause: is there one image of God and of the angels? The targum has already met that by dating the angels to the second day, so that they are creatures and no rival makers. Neither text has the other, and the caricature turns out to be a quotation.", "crux": "elohim-and-trinity"}, {"id": "t-k3-27", "from": "basil-hex-1-26-judaei", "to": "br-8-9", "type": "contests", "evidence": "The same grammatical proof on both benches, aimed in opposite directions, and each aimed at the other's people. Basil: 'Non enim dixit ad imagines nostras, sicut et Scriptura testatur: Fecit Deus, inquit, hominem: non fecerunt' — God made the human, they did not make — used to show that the plural is of persons and not of makers. R. Simlai, asked by the minim how many divinities created the world: 'va-yivre'u Elohim et ha-adam be-tzalmeihem is not said, but va-yivra Elohim et ha-adam be-tzalmo.' One verse, one observation about the number of the verb, two disputations, and each bench is arguing with the other's readers.", "crux": "elohim-and-trinity"}, {"id": "t-k3-28", "from": "ambrose-hex-6-7-40", "to": "basil-hex-1-26-judaei", "type": "transmits", "evidence": "Ambrose is working through Basil at Milan and keeps the order of the questions: to whom does he say it — not to himself, because he does not say faciam; not to the angels, because a servant is no partner in the master's work; therefore to the Son. What he adds is the second front: 'etiamsi Judaei nolint; etiamsi Ariani repugnent', so that the Jewish reading of the plural and the Arian subordination of the Son are refuted by one argument, and whoever denies the Son a share in the working ends by making a gift of it to servuli.", "crux": "elohim-and-trinity"}, {"id": "t-k3-29", "from": "ambrose-hex-6-7-40", "to": "rashi-1-26-minim", "type": "parallel", "evidence": "The same grammatical fact, the same use made of it, and opposite conclusions about the hearer. Ambrose: 'Cui dicit? Non sibi utique, quia non dicit, faciam, sed faciamus' — he cannot be speaking to himself, because the verb is not singular. Rashi: 'had it written e'eseh adam, we should not have learned that he speaks with his court but with himself.' Both rule out the soliloquy from the form of the verb; Ambrose concludes that the hearer is the Son, Rashi that it is the household above. Milan about 387 and Troyes about 1090, with no possible contact, reasoning identically to incompatible ends.", "crux": "elohim-and-trinity"}, {"id": "t-k3-30", "from": "aug-gnl-imp-16-61", "to": "ambrose-hex-6-7-40", "type": "contests", "evidence": "Augustine takes away the answer Ambrose had just given, and on grammatical grounds. If the Father were speaking to the Son, then 'ad imaginem nostram' would have to be 'ad imaginem tuam' or 'ad imaginem meam'; and if the plural covered the Father and the Son only, 'a qua pluralitate Spiritum sanctum separare quis audeat?' So the plural is not a conversation between two persons but the Trinity speaking of itself, and the human is made to the image of the whole. Comestor will print both readings side by side eight hundred years later without noticing that the second was written to exclude the first.", "crux": "elohim-and-trinity"}, {"id": "t-k3-31", "from": "aug-gnl-3-19-29", "to": "aug-gnl-imp-16-61", "type": "echoes", "evidence": "The same reading twenty years on, with the polemic gone and one sentence added that the whole Latin bench will quote: it is not a matter of indifference that elsewhere Scripture says dixit Deus, fiat, and here dixit Deus, faciamus. The unfinished commentary argued from ad imaginem nostram; the finished one argues from the change of formula, which is a claim about how the chapter is written rather than about what the words mean, and is therefore the version that can be abridged into a gloss.", "crux": "elohim-and-trinity"}, {"id": "t-k3-32", "from": "aug-civ-16-6", "to": "b-sanh-38b-tshuva", "type": "parallel", "evidence": "The strongest structural parallel on the site, and neither side can have known the other. R. Yoḥanan's rule at Sanhedrin 38b lists the places where the minim broke loose with the refutation beside each, and the first two are Gen 1:26, answered by the singular of Gen 1:27, and Gen 11:7 — havah nerdah, come let us go down — answered by the singular of Gen 11:5. Augustine's chapter is headed 'qualis intelligenda sit esse locutio, qua Deus Angelis loquitur' and takes up the same two verses in the same order: at Gen 1:26 the angels are excluded, because ad imaginem nostram forbids them, and 'non dixit, Fecerunt dii'; at Gen 11:7, where there is no image clause, 'si aliquid esset, quod Angelos prohiberet intelligi' — and nothing is, so the angels stand. Two benches select the same pair out of the Pentateuch by the same criterion, a plural verb of divine speech, and apply the same test, the singular that follows. They disagree only about what the plural was doing there.", "crux": "elohim-and-trinity"}, {"id": "t-k3-33", "from": "glossa-11-7-angeli", "to": "b-sanh-38b-tshuva", "type": "parallel", "evidence": "The Gloss joins Gen 11:7 to Gen 1:26 and answers both with their singulars — 'Ad angelos dixisse intelligitur; vel secundum illud: Faciamus hominem ad imaginem et similitudinem nostram. Nam singulari numero subjunctum est: et divisit eos, sicut ibi: Fecit Deus hominem ad imaginem et similitudinem suam' — which is R. Yoḥanan's list and R. Yoḥanan's test, in a Latin schoolbook, with the conclusion left open. It is the one place in the Gloss where the angel reading is printed as the plain sense, and it is printed at the verse where the argument from the image cannot be run.", "crux": "elohim-and-trinity"}, {"id": "t-k3-34", "from": "glossa-11-7-angeli", "to": "aug-civ-16-6", "type": "cites", "evidence": "The gloss is Augustine's chapter reduced to its verdict. De civitate Dei XVI.6 grants the angels at Babel because nothing prevents them, having refused them at Gen 1:26 because of the image; the Gloss keeps the grant, keeps the cross-reference to faciamus hominem, and drops the reason for the difference — so that a twelfth-century reader meets the angel reading of one plural without the argument that had excluded it from the other.", "crux": "elohim-and-trinity"}, {"id": "t-k3-35", "from": "glossa-1-26", "to": "aug-gnl-3-19-29", "type": "cites", "evidence": "The standard gloss on Gen 1:26 is De Genesi ad litteram III.19 printed under Augustine's name and cut to its two moves: the plural intimates the persons, the singular of v. 27 gives the unity of the deity. What is cut is the argument — Augustine's 'alioquin non vere dictum est, ad imaginem nostram, si ad Patris solius, aut Filii solius imaginem factus est homo' becomes a bare 'non enim vere diceretur ad imaginem nostram'. This is the page on which Hugh, Abelard and Comestor all begin.", "crux": "elohim-and-trinity"}, {"id": "t-k3-36", "from": "bede-gen-1-26", "to": "basil-hex-1-26-judaei", "type": "transmits", "evidence": "Bede is copying the Latin Basil and keeping the sentence while dropping the fight. 'Donec is qui doceretur non erat, in profundo fuit abdita praedicatio Deitatis; ubi vero coepit hominis exspectari creatio, revelata est fides' stands word for word in both. What Bede removes is every Jew in the passage, and what he puts in its place is a reason: it could not be said to angels, 'quia nulla prorsus ratio sinit ut Dei et angelorum unam esse eamdemque imaginem sive similitudinem credamus'. The argument survives the polemic, and it is the argument, not the polemic, that Rabanus and Angelomus then copy from Bede.", "crux": "elohim-and-trinity"}, {"id": "t-k3-37", "from": "alcuin-int-36-37", "to": "br-8-8", "type": "parallel", "evidence": "Both take the change of formula to be about the standing of the creature rather than about God, and they draw opposite morals from it. Alcuin: why of the human alone is it said faciamus? — so that, a rational creature being founded, it might be seen to be made with counsel, 'et ut ejus nobilitas ostenderetur'. Bereshit Rabbah: the plural was worth the opening it gives the minim because a great man who will not ask leave of a lesser must learn from his Creator, who consulted the ministering angels. Nobility on one bench, humility on the other, out of the same observation that this verse and no other has a consultative form.", "crux": "elohim-and-trinity"}, {"id": "t-k3-38", "from": "wigbod-gen-1-26", "to": "aug-gnl-3-19-29", "type": "transmits", "evidence": "Augustine's sentence cut in half and given to two speakers, D and M, so that the observation is a pupil's and the doctrine a master's, and headed AMBROSIUS. One word changes and it matters: Augustine wrote 'ad imaginem Dei' and argued for a page why it is not 'ad imaginem Filii'; Wigbod writes 'ad imaginem suam', which settles the question by removing it.", "crux": "elohim-and-trinity"}, {"id": "t-k3-39", "from": "remigius-gen-1-26", "to": "br-8-3", "type": "parallel", "evidence": "The same question in one word each. Remigius: 'quasi quodam concilio dicit: Faciamus' — as though by a kind of council he says, let us make. Bereshit Rabbah: 'be-mi nimlakh', with whom did he take counsel. Both take the change of formula to imply a consultation and then have to say with whom; and Remigius adds the line that shows the Latin bench knew there was more than one answer available — 'quod, licet quidam ad angelos referendum dicant, melius tamen ad sanctam Trinitatem refertur'. Some do refer it to the angels, at Auxerre about 890, and he neither names them nor refutes them.", "crux": "elohim-and-trinity"}, {"id": "t-k3-40", "from": "rupert-gen-1-26-consilium", "to": "br-8-3", "type": "parallel", "evidence": "Bereshit Rabbah 8:3 sets out two extremes and does not choose: R. Yehoshua in R. Levi's name has God consult the work of heaven and earth, with a parable of a king and his two sanqlitin — Greek synklētikoi, senators — and R. Ami has him take counsel be-libbo, with his own heart. Rupert names both in Latin and chooses: the counsel of the Trinity was 'non tam senatu quam soliloquio venerando … habitum'. The Roman word for the one and the Augustinian word for the other, six hundred years later, at Liège, with no contact; and the soliloquy that proves for R. Ami that nobody else was present proves for Rupert that three persons were.", "crux": "elohim-and-trinity"}, {"id": "t-k3-41", "from": "abelard-hex-1-26-faciamus", "to": "br-8-3", "type": "parallel", "evidence": "R. Ami's answer with a bibliography. 'Quasi ergo aliquis secum loquens se et rationem suam quasi duo constituit cum eam consulit, sicut Boetius in libro De consolatione Philosophiae, vel Augustinus in libro Soliloquiorum' — a man who consults his own reason sets up himself and his reason as two. That is be-libbo nimlakh, he took counsel with his heart, made into a philosophical model; and where the midrash uses the inward counsel to show that no second party was present, Abelard uses it to show how a real plurality speaks with one mouth.", "crux": "elohim-and-trinity"}, {"id": "t-k3-42", "from": "abelard-hex-1-26-faciamus", "to": "abelard-hex-1-1-eloim", "type": "echoes", "evidence": "One man, one argument, two verses, and the pair is the whole of this crux. At Gen 1:1 the evidence is a Hebrew noun plural in form beside a singular verb — 'unde autem dictum est Eloim creavit, non creaverunt?' At Gen 1:26 it is a Latin verb plural in form beside the singular of v. 27 — 'sed cur pluraliter dicitur: faciamus hominem ad imaginem nostram, si nulla prorsus pluralitas in Deo sit … et creavit Deus hominem'. The inference is identical both times, the plural for the persons and the singular for the one creator, and both times it is addressed to Jews by name: dicant Judaei si possunt.", "crux": "elohim-and-trinity"}, {"id": "t-k3-43", "from": "abelard-hex-1-26-faciamus", "to": "rashi-1-26-minim", "type": "contests", "evidence": "The opening and the man who takes it, forty years apart and about two hundred miles. Rashi grants that na'aseh gives the minim room to rebel, and keeps it anyway for the sake of the lesson in humility, writing the refutation beside it: va-yivra and not va-yivre'u. Abelard walks into precisely that opening — 'dicant Judaei si possunt, vel nobiscum fateantur in una Divinitatis essentia pluralitatem personarum' — and takes Rashi's own refutation, the singular of v. 27, as the second half of his proof rather than as an answer to it. Neither has read the other and the argument fits together exactly.", "crux": "elohim-and-trinity"}, {"id": "t-k3-44", "from": "hugh-adnot-1-26", "to": "br-8-8", "type": "parallel", "evidence": "The identical moral drawn from the identical difficulty, at St Victor about 1130 and in Galilee seven hundred years earlier. Hugh: God brings in counsel 'ut nos cautos reddat, ne dedignemur consilium accipere et ab aequalibus et a minoribus; cum ipse ad angelos ita loquatur'. Bereshit Rabbah: if a great man will not seek leave from one lesser than himself, let him learn from his Creator, who consulted the ministering angels when he came to make a human. Both make the verse a lesson in taking advice downwards, and both ground the lesson in the angels — which is the one thing about this verse the rest of the Latin bench will not concede.", "crux": "elohim-and-trinity"}, {"id": "t-k3-45", "from": "hugh-adnot-1-26", "to": "targ-psj-1-26", "type": "parallel", "evidence": "Hugh goes further than the targum. Pseudo-Jonathan has God address the ministering angels and stops there, and guards the point by dating them to the second day so that they cannot be co-creators. Hugh writes 'ad angelos ita loquatur, quorum ministerio forsitan formatum est corpus hominis' — by whose ministry perhaps the human body was formed — which grants the angels a hand in the work itself. That is the position Basil calls a Jewish fiction, Ambrose refuses because a servant is no partner, and Bruno says would make many creators; it is in a Victorine schoolbook, offered before the Trinitarian reading and only then set aside with vel quod melius est.", "crux": "elohim-and-trinity"}, {"id": "t-k3-46", "from": "hugh-adnot-1-26", "to": "remigius-gen-1-26", "type": "echoes", "evidence": "The same two-reading structure two hundred and forty years apart, and the interval shows the angel reading losing ground without ever being refuted. Remigius: some refer it to the angels, but it is better referred to the holy Trinity. Hugh: he speaks to the angels, by whose ministry perhaps the body was formed — or, what is better, take it as the counsel of the Trinity. Both put the angels first and prefer the Trinity comparatively, neither argues against the angels, and by Comestor's Historia scholastica forty years after Hugh the option is simply not mentioned.", "crux": "elohim-and-trinity"}, {"id": "t-k3-47", "from": "comestor-hs-1-26", "to": "aug-gnl-imp-16-61", "type": "contests", "evidence": "The handbook prints as an alternative the reading Augustine wrote to exclude. 'Et loquitur Pater ad Filium, et Spiritum sanctum. Vel est quasi communis vox trium personarum' — the first is Ambrose's and Basil's, the second is Augustine's, and Augustine's objection to the first is that ad imaginem nostram would then have to be tuam or meam. Comestor ranks neither and argues for neither. What a priest examined on the Historia scholastica about 1170 knows about this verse is that there are two acceptable answers and no reason to prefer either.", "crux": "elohim-and-trinity"}, {"id": "t-k3-48", "from": "br-8-9", "to": "br-1-7", "type": "echoes", "evidence": "The same proof twice in the same compilation, once as exegesis and once as a disputation. R. Yitzḥak at 1:7 observes that the plural-looking Elohim takes singular verbs — not vaydaberu but vaydaber, not bare'u but bara — and concludes that no creature may say two authorities created the world. R. Simlai at 8:9 is asked by the minim how many divinities created the world and answers with the same verb: baru Elohim is not written here but bara Elohim. What 8:9 adds is the occasion. The grammatical observation this crux is built on is, in its own tradition, an answer given to opponents who had asked the question out loud.", "crux": "elohim-and-trinity"}, {"id": "t-k3-49", "from": "br-8-9", "to": "br-8-8", "type": "echoes", "evidence": "Two paragraphs, one anxiety, and they name it the same way: pitchon peh la-minim, an opening for the minim. At 8:8 Moses sees the opening while he is writing the verse and is told to write it anyway; at 8:9 the minim walk through it and are met at the door. R. Simlai's rule states the policy the earlier paragraph enacted — everywhere you find an opening for the minim, you find the refutation beside it — so that the danger and its answer are treated as a designed pair rather than as an accident to be explained away.", "crux": "elohim-and-trinity"}, {"id": "t-k3-50", "from": "b-sanh-38b-tshuva", "to": "br-8-9", "type": "echoes", "evidence": "R. Simlai's rule become R. Yoḥanan's, with the disputation dropped and the list extended. In the midrash the rule is said between two exchanges and is illustrated by them; in the Bavli it is stated flat and followed by three verse-pairs, Gen 1:26 with 1:27, Gen 11:7 with 11:5, Gen 35:7 with 35:3. The verb hardens too: she'alu ha-minim, the minim asked, becomes kol makom she-pakru ha-minim, everywhere the minim broke loose.", "crux": "elohim-and-trinity"}, {"id": "t-k3-51", "from": "b-sanh-38b-malachim", "to": "br-8-3", "type": "echoes", "evidence": "Bereshit Rabbah asks with whom God took counsel and gives four answers without choosing; the Bavli tells the story that answers it and lets the answer cost something. Rav Yehuda in Rav's name has God create a company of ministering angels and put the verse to them as a question — retzonkhem na'aseh adam be-tzalmenu — and burn them when they object, and the second company after them, until the third says that the world is his and he may do as he wishes. The consultation is real, in the words of the verse; the partnership is destroyed in the telling.", "crux": "elohim-and-trinity"}, {"id": "t-k3-52", "from": "rashi-1-26-anvetanuto", "to": "b-sanh-38b-malachim", "type": "cites", "evidence": "Rashi's first comment is the Bavli's story turned into a doctrine of God, and he ends by quoting it: 'there are in the heavens beings after my likeness; if there will not be on earth also beings after my likeness, there will be envy among the beings that I have created.' What the daf leaves as a narrative — the angels object, they are burnt — Rashi makes a habit: this is how God judges kings too, as Micaiah saw, and as Daniel's decree of the watchers shows. The word for the court is pamalya shel ma'alah, from the Latin familia.", "crux": "elohim-and-trinity"}, {"id": "t-k3-53", "from": "rashi-1-26-minim", "to": "br-8-9", "type": "cites", "evidence": "Rashi ends the second comment with R. Simlai's answer verbatim in Hebrew — 'and the refutation of the minim he wrote beside it, va-yivra et ha-adam, and he did not write va-yivre'u' — and with it he takes over the midrash's whole posture: name the risk, keep the verse, point to the answer alongside. The one thing he does not take over is R. Simlai's caution. Where the midrash has the disciples object that the minim were pushed off with a reed, Rashi lets the grammatical answer stand as the answer.", "crux": "elohim-and-trinity"}, {"id": "t-k3-54", "from": "ibn-ezra-1-26-naaseh", "to": "ibn-ezra-1-1-elohim", "type": "contests", "evidence": "One grammarian, two plurals, two incompatible accounts, and the daf can only show it because both pages are here. At Gen 1:1 the plural noun Elohim is the honorific plural and means nothing more: every language honours the great with a plural, as adonim and be'alim are plural for one master and as a king in Arabic speaks of himself in the plural. At Gen 1:26 Saadia Gaon offers him the identical explanation for the plural verb — na'aseh is the manner of royal speech — and he calls the proof texts false witnesses, parses every one of them away, and puts a real hearer in their place: God said to the angels, let us make a human, we shall occupy ourselves with him and not the water and the earth. The plural of majesty is a fact about nouns and does not reach a verb with a subject; but the reader who has only the Gen 1:1 page would take Ibn Ezra's answer to this crux to be the opposite of what it is.", "crux": "elohim-and-trinity"}, {"id": "t-k3-55", "from": "ibn-ezra-1-26-naaseh", "to": "rashi-1-26-anvetanuto", "type": "parallel", "evidence": "The two great northern and southern commentators arrive at the same hearer by different routes and with different tempers. Rashi gets to the angels from the humility of God and the court of 1 Kgs 22, and has to defend the reading against the minim in his next comment. Ibn Ezra gets to them by elimination: the earth and the waters brought forth the plants and the animals, and at the human God says we shall occupy ourselves with him and not they. No court, no humility, no polemic, and no acknowledgement that anybody reads the verse otherwise.", "crux": "elohim-and-trinity"}, {"id": "t-k3-56", "from": "ramban-1-26-naaseh", "to": "ibn-ezra-1-26-naaseh", "type": "contests", "evidence": "Ramban keeps the plural literal and takes the angels out of it. 'Ani ve-ha-aretz ha-nizkeret na'aseh adam' — I and the aforementioned earth, let us make a human: the earth to bring forth the body from its elements as it did for the beasts, and God to give the spirit, exactly as Gen 2:7 then describes in two clauses. The plural has a second party and the second party is the ground. He credits R. Yosef Kimḥi and calls it the most acceptable of all that have been thought about the verse, which is how he sets aside both the angels of Ibn Ezra and Rashi and the plural of majesty of Saadia without arguing with any of them.", "crux": "elohim-and-trinity"}, {"id": "t-k3-57", "from": "ramban-1-26-naaseh", "to": "ramban-1-1-elohim", "type": "echoes", "evidence": "The same man refusing, twice, to let a plural be either empty or personal, and needing a secret only once. At Gen 1:1 Elohim is a compound, el hem, the force of all the forces, and 'a secret will yet be disclosed in connection with this'. At Gen 1:26 the plural verb has a plain second subject, the earth, and nothing is withheld — the mystery is moved to the following verse, where 'the way of truth in this verse will be known to him who understands'. Of the four answers this crux collects, Ramban's is the only one that makes the plural real without making it a plurality in God or a company of angels.", "crux": "elohim-and-trinity"}, {"id": "t-k3-58", "from": "targ-onk-1-26", "to": "targ-onk-1-1", "type": "contests", "evidence": "The same targum, the same difficulty, opposite hands. At Gen 1:1 Onkelos writes YY for Elohim, so that the plural-looking noun disappears and no reader of the Aramaic could raise the question of two authorities from it. At Gen 1:26 he leaves the plural verb standing — na'avid enasha be-tzalmana — and adds nothing, addresses nobody, and supplies no angels. Whatever governed the first choice, it was not a policy of removing plurals from the creation account, and the contrast is the best evidence on the daf that the Gen 1:1 substitution was about the divine name rather than about number.", "crux": "elohim-and-trinity"}, {"id": "t-k3-59", "from": "targ-psj-1-26", "to": "targ-onk-1-26", "type": "contests", "evidence": "Two Aramaic versions of one verse, one adding the hearers and one refusing to. Pseudo-Jonathan: 'and the LORD said to the angels who minister before him, who were created on the second day of the creation of the world, let us make a human in our image, in our likeness.' Onkelos: 'and the LORD said, let us make a human in our image, as our likeness.' The later targum answers the question the earlier one left open, and guards its answer by dating the angels after the beginning so that they cannot be makers.", "crux": "elohim-and-trinity"}, {"id": "t-k3-60", "from": "targ-psj-1-26", "to": "glossa-11-7-angeli", "type": "parallel", "evidence": "An Aramaic targum of the eighth century and a Latin schoolbook of the twelfth put the same hearers behind the same kind of plural. 'Va-amar YY le-malakhaya di-meshamshin qomoi' — and the LORD said to the angels who minister before him. 'Ad angelos dixisse intelligitur' — he is understood to have said it to the angels. Neither argues for it; both simply state it as what the verse means. The Gloss says it at Gen 11:7 and cross-refers to Gen 1:26; the targum says it at Gen 1:26 outright.", "crux": "elohim-and-trinity"}, {"id": "t-k3-61", "from": "bruno-gen-1-1c", "to": "targ-psj-1-26", "type": "contests", "evidence": "Bruno's rhetorical question has a literal answer in a book he could not read. 'Quos ad hominem creandum invitabat, dicens: Faciamus hominem?' — whom was he inviting to create the human? — and his answer is that it cannot be the angels, since otherwise there would be not one creator but many. Pseudo-Jonathan names them: the angels who minister before him, created on the second day. The targum has already conceded Bruno's premise, that no creature may be a maker, and secured it by the date; Bruno takes the reading to be refuted by the premise alone.", "crux": "elohim-and-trinity"}, {"id": "t-k3-62", "from": "aug-civ-16-6", "to": "hugh-adnot-1-26", "type": "contests", "evidence": "Augustine allows the angels one plural and not the other, and gives the reason; Hugh allows them both, and takes the reason back. De civitate Dei XVI.6 refuses them at Gen 1:26 because ad imaginem nostram forbids it, and grants them at Gen 11:7 because nothing prevents it. Hugh writes 'cum ipse ad angelos ita loquatur, quorum ministerio forsitan formatum est corpus hominis' at Gen 1:26 itself, where Augustine's objection stands unanswered, and then prefers the Trinity for a different reason altogether — that it is better, not that the angels are excluded.", "crux": "elohim-and-trinity"}], "answers": {"borne-over": {"label": "Borne over", "gloss": "The verb is motion: a spirit carried above the water (LXX ἐπεφέρετο, Vulgate ferebatur)."}, "wind": {"label": "A wind", "gloss": "Ruach is weather, not a person; Onkelos keeps God at a remove."}, "spirit-of-mercy": {"label": "Spirit of mercy", "gloss": "A divine disposition blowing over the waters (Palestinian targums)."}, "messiah": {"label": "Spirit of the Messiah", "gloss": "Resh Lakish: the ruach of Isa 11:2, brought by repentance-as-water."}, "bird-hovering": {"label": "Dove hovering, not touching", "gloss": "Ben Zoma and Rashi: the bird measures a gap; it does not land."}, "fluttering": {"label": "Fluttering", "gloss": "Abelard's report of the Hebrew: volitabat, as the eagle of Deut 32:11."}, "brooding-warmth": {"label": "Bird brooding, warming", "gloss": "Jerome from the Hebrew, Basil's Syrian, then the Latin schools: the Spirit quickens matter like a hen on eggs."}, "power-not-place": {"label": "Power, not place", "gloss": "Augustine: 'above' means sovereignty, not position; the Manichees misread it."}, "craftsman": {"label": "The craftsman's will", "gloss": "The Spirit over the waters as the maker's intention over the wood."}, "love-gift": {"label": "Love, gift, weight", "gloss": "Confessions XIII: why the Spirit alone is said to be above; pondus meum amor meus."}, "trinity": {"label": "The Trinity named", "gloss": "The verse completes Father (in principio), Son (principium), Spirit."}, "heart": {"label": "Over the heart", "gloss": "Isidore's moral reading: the waters are our fluid, dark heart."}, "throne": {"label": "Throne of Glory", "gloss": "Rashi: the throne stands in the air, held by the breath of God's mouth."}, "unus-cardinal": {"label": "The versions keep the cardinal", "gloss": "ἡμέρα μία, dies unus, yoma chad: 'one', not 'first', in every ancient version."}, "unus-grammatical": {"label": "'First' needs a second", "gloss": "The series 'one, second, third' is improper (Bereshit Rabbah); or, first and second are relatives and there was no second yet (Bruno)."}, "unus-alone": {"label": "God was alone that day", "gloss": "Yachid in his world: no angels were made on the first day, so there was no second anything (Bereshit Rabbah, Rashi)."}, "unus-yom-kippur": {"label": "The one day given to Israel", "gloss": "'One day' is the Day of Atonement, the day the Holy One gave them."}, "unus-24-hours": {"label": "One circuit, twenty-four hours", "gloss": "Day and night together make one revolution, and the whole is named from the day alone."}, "unus-repeated": {"label": "The same day repeated", "gloss": "There is one day only — the angelic light — presented once for each kind of thing made (Augustine)."}, "unus-all-time": {"label": "One day = all time", "gloss": "The word holds the whole span of the ages, or the whole work of the six days (Augustine's set-aside reading; Abelard's own)."}, "unus-angelic-unity": {"label": "The unity of angelic dignity", "gloss": "'One' names the undivided attention of the angelic mind, not a place in a series (Angelomus)."}, "unus-eternal-day": {"label": "The true first day is eternal", "gloss": "This day is first only by number and order of creation; the day that is first by nature is uncreated light (Rupert)."}, "day-precedes-night": {"label": "Day before night", "gloss": "Evening is the end of a finished day, morning the end of the night; days are counted from morning to morning."}, "day-follows-night": {"label": "Night before day", "gloss": "'One day' rules that reckoning begins at evening (Ben Zoma, b. Chullin 83a)."}, "night-for-rest": {"label": "Night made for rest", "gloss": "Day is for labour and night for rest, so only the day's bounds are counted."}, "day-is-a-measure": {"label": "The day's measure is a creature", "gloss": "The measure of day and of night was itself made on day one (b. Chagigah 12a)."}, "evening-is-completion": {"label": "Evening completes a work", "gloss": "Vespera is a work perfected, mane the beginning of the next — the Carolingian formula."}, "evening-is-self-knowledge": {"label": "Evening and morning knowledge", "gloss": "The creature known in itself is evening; known in the Word and referred back in praise, morning (Augustine)."}, "evening-moral": {"label": "Evening as sin or temptation", "gloss": "Evening and morning are the deeds of the wicked and the righteous, or sin and renewal, or temptation and the light of justice."}, "simul": {"label": "All things made at once", "gloss": "Creavit omnia simul (Sir 18:1): the days are not successive."}, "six-days-literal": {"label": "Six real days", "gloss": "Created at once in matter, distinguished in form through six successive days (the common doctors, Bonaventure)."}, "principio-temporis": {"label": "In the beginning of time", "gloss": "The word dates the making: time began with the world, and there was no before (Onkelos, Bede, Rabanus, Remigius, Hugh)."}, "principio-in-filio": {"label": "In the Son", "gloss": "Principium is a proper name of the Word, on the strength of John 8:25 and Ps 104:24 (Ambrose, Augustine, Isidore, Alcuin, the Glossa, Rupert, Honorius)."}, "principio-first-of-all": {"label": "First of all things", "gloss": "'In the beginning' means before everything else that follows — in the beginning of the creatures, or on the first day (Augustine's second reading; Bruno, Abelard)."}, "principio-is-first-creature": {"label": "The first creature is a beginning", "gloss": "The first intellectual creature may be called a beginning to the things it heads (Augustine, De Genesi imperfectus)."}, "beginning-is-wisdom": {"label": "In Wisdom", "gloss": "The beginning is Wisdom — which is the Torah on one bench (Prov 8:22, Prov 3:19, Neofiti) and the Son on the other (Ps 104:24)."}, "reshit-is-torah": {"label": "The beginning is the Torah", "gloss": "Reshit is the Torah, called reshit darko: God looked into it as an architect into his plans and created the world (Bereshit Rabbah, Rashi)."}, "reshit-is-israel": {"label": "For the sake of Israel", "gloss": "Reshit is Israel, called reshit tevu'ato (Jer 2:3); the world was made for their sake."}, "reshit-construct": {"label": "'When God began to create'", "gloss": "Bereshit is a construct and the verse a subordinate clause: at the beginning of God's creating (Rashi's plain sense, Ibn Ezra; contested by Ramban)."}, "world-has-a-beginning": {"label": "The world is not eternal", "gloss": "The point of saying 'in the beginning' at all is that the world had one, against the philosophers (Ambrose, Remigius, Hugh, Ramban)."}, "bereshit-book-name": {"label": "It is the book's name", "gloss": "The Hebrews name volumes from their opening words, so bresith is the title of Genesis (Jerome, Wigbod, Angelomus)."}, "six-preceded": {"label": "Six things preceded the world", "gloss": "Torah and the Throne of Glory were made before it; the patriarchs, Israel, the Temple and the Messiah's name were contemplated (Bereshit Rabbah 1:4)."}, "read-it-twice": {"label": "Say the phrase twice", "gloss": "In principio is to be repeated — once in the Son, once at the beginning of time — rather than decided (Comestor)."}, "lux-corporalis": {"label": "A bodily light", "gloss": "A material light made to light material things, standing in the sun's place until the fourth day (Basil, Ambrose, Bede, Hugh, Honorius, Comestor, Bonaventure)."}, "lux-angelica": {"label": "The angelic creation", "gloss": "The light is the spiritual creature called 'heaven' in v. 1, made light by turning to its Creator (Augustine, Angelomus, Rupert)."}, "lux-hidden": {"label": "Stored for the righteous", "gloss": "Too good for the wicked, it was hidden away and is kept for the righteous in the time to come (Bereshit Rabbah, b. Chagigah, Rashi)."}, "lux-garment": {"label": "From the light of his garment", "gloss": "God wrapped himself in it like a garment (Ps 104:2); the heavens were stretched out of it (Bereshit Rabbah, Pirkei de-Rabbi Eliezer)."}, "lux-from-temple": {"label": "From the site of the Temple", "gloss": "The light was created from the place of the sanctuary (Ezek 43:2; Jer 17:12)."}, "lux-becomes-luminaries": {"label": "The luminaries were made from it", "gloss": "The nature of light was made on day one and hung in the firmament on day four (the sages in b. Chagigah 12a; an unnamed opinion in Augustine)."}, "lux-twilight": {"label": "A light like the dawn", "gloss": "Not the sun's brightness but what the sky is before sunrise or after sunset (Remigius, Honorius, Comestor, Hugh)."}, "lux-is-day": {"label": "'Light' just means day", "gloss": "The verse answers itself: he called the light Day, so light here is put for day (Bruno)."}, "lux-is-distinction": {"label": "The distinguishing of the works", "gloss": "The light is the confused heap becoming distinct and knowable, not a thing at all (Abelard)."}, "fiat-is-instantaneous": {"label": "Speaking is making", "gloss": "No interval between the command and the thing: the Hebrew says only 'let it be, and it was' (Ambrose, Basil, Angelomus, Abelard)."}, "pair-is-formless-matter": {"label": "Unformed matter", "gloss": "The pair names the matter God had made and not yet given form to (Augustine, Angelomus, Hugh, Comestor)."}, "pair-is-under-water": {"label": "Hidden under the waters", "gloss": "Invisible because the waters covered it, and because there was neither light nor anyone to see (Basil, Alcuin, Angelomus, Ibn Ezra)."}, "pair-is-unfurnished": {"label": "No seed, no living thing", "gloss": "Empty of shoots and void of animals: a list of what was not there yet (Bede, Remigius, Rupert, Abelard, Hugh, Comestor, the targums)."}, "pair-is-a-name-for-us": {"label": "A name fitted to slow minds", "gloss": "Not a description but the most serviceable word for formlessness, since earth and the deep are the least comely things men know (Augustine, Confessions XII)."}, "pair-many-senses": {"label": "More than one true reading", "gloss": "Five readings of the clause are all true and none can be shown to be Moses' own (Augustine, Confessions XII.21)."}, "pair-is-two-things": {"label": "A green line and slimy stones", "gloss": "Tohu and bohu are two creatures made on the first day: a line encircling the world, and stones sunk in the deep (b. Chagigah 12a, Sefer Yetzirah)."}, "pair-is-matter-and-form": {"label": "Matter and its form", "gloss": "Tohu is the hyle, which can hold no name; bohu is bo hu, the form it puts on (Ramban)."}, "pair-is-astonishment": {"label": "Astonishment", "gloss": "Tohu is what astonishes whoever looks at it — the earth bewildered at her lot, or the reader appalled at the emptiness (Bereshit Rabbah 2:2, Rashi, the Bahir)."}, "pair-is-history": {"label": "The verse tells history", "gloss": "The clause is the first term of a periodization: the generations from Adam, the four kingdoms, or the Church before her children (Bereshit Rabbah 2:1, 2:3, 2:4; Bruno)."}, "pair-is-our-flesh": {"label": "The earth of our flesh", "gloss": "The soul before it has taken the form of doctrine (Isidore, Wigbod, Rabanus, Remigius, Bruno)."}, "pair-is-not-of-heaven": {"label": "Said of earth, not of heaven", "gloss": "The phrase is withheld from heaven, which was filled with angels as soon as it was made (Bede, the Glossa, Angelomus, Abelard)."}, "heaven-first": {"label": "Heaven first", "gloss": "Beit Shammai: the word order is the order of the acts, and a king has his throne made before its footstool (Isa 66:1)."}, "earth-first": {"label": "Earth first", "gloss": "Beit Hillel: a builder raises the lower storey first (Amos 9:6), and Gen 2:4 and Ps 102:26 name the earth before the heavens."}, "both-at-once": {"label": "Both together", "gloss": "The sages, and R. Shimon ben Yoḥai's stewpot and its lid (Isa 48:13); Ambrose, that the order of naming gives heaven no privilege of the firstborn."}, "order-of-dignity": {"label": "Named for dignity, not order", "gloss": "Heaven stands first because it is worthier, or because the account is about to turn to the earth (Hugh of St Victor; R. Yoḥanan's creation-and-completion)."}, "created-then-stretched": {"label": "Created in one order, stretched in the other", "gloss": "Resh Lakish: heaven was created first, the earth was stretched out first — so both proof-texts stand."}, "heaven-earth-is-everything": {"label": "A name for the whole creation", "gloss": "Two visible words standing for all that God made, given so for the weakness of little ones (Augustine, Alcuin, Angelomus, Comestor)."}, "heaven-is-empyrean": {"label": "The empyrean heaven", "gloss": "Not the visible firmament but a fiery — from brightness, not heat — and intellectual heaven, filled with angels as soon as it was made (Remigius, the Glossa, Comestor)."}, "heaven-earth-four-elements": {"label": "The four elements", "gloss": "Heaven names fire and air, earth names earth and water; the verse announces the material first principles of bodies (Ambrose, Abelard, Ramban, Comestor)."}, "et-includes": {"label": "The particle includes", "gloss": "Et ha-shamayim brings in the sun, moon and constellations; ve-et ha-aretz the trees, the plants and the Garden of Eden (Bereshit Rabbah 1:14, b. Chagigah 12a, Ramban)."}, "shamayim-is-water": {"label": "Sham mayim — 'there is water'", "gloss": "The name itself says what heaven is made of: water, or fire and water mingled into the firmament (b. Chagigah 12a)."}, "one-earth-only": {"label": "One earth, and no heaven of heavens here", "gloss": "If the heavens of v. 1 were the intelligible heaven, the earth beside it could not be the ground; the seven earths are seven regions of the one (Ibn Ezra; Abelard, from the other end)."}, "whole-then-parts": {"label": "The whole first, then the parts", "gloss": "V. 1 is a heading: Scripture commends everything God made in two words before going through it with 'God said' (Augustine, Angelomus, the Glossa)."}, "de-nihilo": {"label": "Out of nothing", "gloss": "God made the world, and the matter of the world, from nothing whatever."}, "matter-then-formed": {"label": "Matter first, then formed", "gloss": "Formless matter was created first — first in origin, not in time — and everything else made out of it."}, "matter-is-coeval": {"label": "Matter was already there", "gloss": "God is a craftsman working on a material he did not make. Reported on both benches, held by neither."}, "three-principles": {"label": "God, exemplar, matter", "gloss": "The philosophers' three principles without a principle, named as the position to be refuted."}, "all-of-them-created": {"label": "Of every one of them, creation is written", "gloss": "Each thing the objector calls a pre-existing material has its own verse saying God created it."}, "bara-is-not-ex-nihilo": {"label": "'Created' does not mean from nothing", "gloss": "The verb bara is used of the sea-creatures and of man, who were made from something."}, "creare-vs-formare": {"label": "Created, not formed", "gloss": "Scripture keeps two verbs apart: what has no pre-existing matter is created, what is shaped out of matter is formed."}, "hyle-is-tohu": {"label": "The hyle is tohu", "gloss": "The one created thing is a substance without form, which the Greeks call hyle and Scripture calls tohu."}, "made-from-something-of-god": {"label": "From the light and the snow", "gloss": "Heaven from the light of his garment, earth from the snow beneath the Throne of Glory."}, "craftsman-needs-matter": {"label": "A craftsman needs a material", "gloss": "Wood helps the carpenter, silver the silversmith — the analogy that makes creation from nothing unthinkable."}, "silence-proves-nothing": {"label": "Scripture's silence proves nothing", "gloss": "That Genesis does not say when a thing was made does not make it coeternal with God."}, "world-from-tohu": {"label": "The world was made out of tohu va-vohu", "gloss": "Said with embarrassment, and only because the verse says it."}, "tenebrae-privatio": {"label": "Darkness is not a thing", "gloss": "Darkness is the absence of light, as silence is the ceasing of voice and nakedness the absence of a garment; Scripture never says God made it (Augustine, Angelomus, Hugh)."}, "tenebrae-creatura": {"label": "God made the darkness too", "gloss": "The darkness is a work of God like the light — it is called with the light to bless the Lord in Dan 3, and it is on the rabbinic lists of what was made on the first day (Remigius, the Glossa, Wigbod's pupil; Pirkei de-Rabbi Eliezer, R. Tanḥuma)."}, "tenebrae-angeli": {"label": "The darkness is the apostate angels", "gloss": "The light of day one is the angelic creation and the division is between the holy angels and the unclean (Augustine, City of God XI.19; Angelomus, Hugh, Rupert, Comestor)."}, "tenebrae-peccatores": {"label": "The wicked, or their deeds", "gloss": "The division is moral: the just from sinners (Isidore, Remigius, the Glossa), or the deeds of the righteous from the deeds of the wicked (R. Yanai, R. Abahu)."}, "tenebrae-ignis": {"label": "Darkness names the element of fire", "gloss": "'Darkness' in v. 2 is elemental fire, which is dark; the deep is water and the spirit is air (Ramban)."}, "divisio-loci": {"label": "Divided by place and quality", "gloss": "The two were set apart in space and time — light over the upper part of the world, twelve hours above and twelve below, opposite hemispheres in turn (Basil, Bede, Rabanus, Honorius, Comestor; and R. Yoḥanan's two generals, each given his bound)."}, "divisio-nominis": {"label": "The dividing is the naming", "gloss": "There is no separate act of separation: 'and he divided' means by the calling of names (Ibn Ezra; entertained once by Augustine and dropped)."}, "divisio-est-ordinatio": {"label": "He did not make it but ordered it", "gloss": "God makes the forms and orders the privations, as a singer orders his rests and a painter his shadows, so that even a nothing has its place (Augustine)."}, "divisio-est-judicium": {"label": "The division is a judgement", "gloss": "A sentence passed, and irreversible: on the devil and his angels (Rupert, Hugh), or on the just and sinners by foreknowledge (Isidore)."}, "divisio-est-instantanea": {"label": "The division needed no second act", "gloss": "The two were never mixed: by the very fact that light was made, the division followed, as putting on a garment ends nakedness (Augustine, Hugh)."}, "formatum-ab-informi": {"label": "The formed from the unformed", "gloss": "The dividing is the distinction of the formed thing from the unformed, of the perfect from the imperfect and the distinct from the confused (Wigbod, Abelard, Honorius)."}, "bonum-approbatio": {"label": "'He saw' is approval, not discovery", "gloss": "God did not learn that the light was good: what pleased him to be made pleased him to remain (Alcuin, Comestor), or the seeing is in the thought (Ibn Ezra), or a good work attests itself when seen (Ambrose)."}, "bonum-withheld": {"label": "The approval is deliberately withheld", "gloss": "'It was good' is not repeated after the division, and the divine name is dropped from the naming of the night, so that the darkness should not be approved along with the light (Augustine, Wigbod; R. Elazar, R. Abahu)."}, "havdala-derived": {"label": "The verse is the source of the havdala rule", "gloss": "'He saw … and he divided' — one does not bless over the lamp until he has used its light (R. Ze'eira of Caesarea)."}, "lux-hivdil-set-aside": {"label": "He set the light aside", "gloss": "Va-yavdel means he separated it off — for himself (R. Yehuda bar Simon), or for the righteous in the time to come, like a king setting aside a fine portion for his son (the Rabbis)."}, "one-authority-singular-verb": {"label": "The verb is singular, so one maker", "gloss": "Not vaydaberu but vaydaber, not bare'u but bara — no one may say that two authorities created the world (Bereshit Rabbah 1:7; Ibn Ezra; and, to the opposite end, Abelard)."}, "elohim-is-plural-of-persons": {"label": "Eloim is plural: three persons", "gloss": "El is singular and Eloim plural, showing a diversity of persons each of which is God; the singular verb shows that they are one creator and their works undivided (Abelard)."}, "elohim-is-honorific-plural": {"label": "A plural of honour", "gloss": "Every language honours the great with a plural — adonim, be'alim, the king speaking of himself in Arabic — so Elohim is the plural of eloah and means nothing more (Ibn Ezra)."}, "elohim-is-plural-of-powers": {"label": "The force of all forces", "gloss": "El hem: the root el is force, and 'they' points to all the other forces, so Elohim is the master of them all — with a secret not disclosed (Ramban)."}, "trinity-in-the-triad": {"label": "Father, Beginning, Spirit", "gloss": "The three persons are named in order across the first two verses: God the Father, the Beginning who is the Son, the Spirit borne over the waters (Augustine, Basil, Ambrose, Bede, Bruno, Honorius, the Glossa)."}, "trinity-in-the-formula": {"label": "The threefold formula of the six days", "gloss": "God said — and it was so — and God made: the testimony is tripled everywhere because the creating Trinity works everywhere (Rupert; considered and refused by Augustine)."}, "trinity-is-brought-to-the-text": {"label": "The rule of faith comes first", "gloss": "The catholic faith is set out before the exposition begins, because heretics drag Scripture to their own opinion; the doctrine is what the chapter is read under (Augustine, De Genesi ad litteram imperfectus)."}, "spirit-is-holy-spirit": {"label": "The spirit of v. 2 is the Holy Spirit", "gloss": "Not the air and not a wind: Scripture reserved the name, and no other spirit is meant but the one who completes the Trinity (Basil, Ambrose)."}, "principium-is-the-son": {"label": "The Beginning is the Son", "gloss": "'I am the beginning, who also speak to you' (John 8:25) — though the Father too is a beginning, and not from a beginning (Wigbod, Remigius, Bruno)."}, "not-to-angels": {"label": "Not spoken to the angels", "gloss": "Whoever the 'let us' addresses, it is not angels: man was not created by angels, or there would be many creators and not one (Bruno)."}, "word-order-is-modesty": {"label": "God is named after his works", "gloss": "A mortal king proclaims his name and builds afterwards; the Holy One made the needs of his world and was named after — bereshit bara, and only then Elohim (R. Yudan in the name of Akilas; Ben Azzai)."}, "word-order-is-dangerous": {"label": "The word order had to be changed", "gloss": "The seventy-two elders wrote 'God created in the beginning' for Ptolemy, so that bereshit could not be read as the subject (b. Megillah 9a)."}, "should-have-begun-at-exodus": {"label": "It should have begun at Exodus 12:2", "gloss": "The Torah is Israel's law book and ought to have opened with the first commandment given to Israel; the creation account has to be accounted for (R. Isaac, in Rashi)."}, "claim-on-the-land": {"label": "Title to the land", "gloss": "'He declared to his people the power of his works, to give them the inheritance of the nations' (Ps 111:6) — so that Israel may answer the charge of robbery (Bereshit Rabbah 1:2; Rashi)."}, "do-not-expound-it": {"label": "It may not be expounded", "gloss": "Not before two, and not the four questions — what is above, what is below, what is before, what is after (m. Chagigah 2:1; Bereshit Rabbah 1:5 and 1:10)."}, "honour-of-the-maker": {"label": "For the honour of the Maker", "gloss": "Whoever has no care for the honour of his Maker, it were fitting he had not come into the world; and the concealed matters are not to be published for the expositor's own glory (m. Chagigah 2:1; Rav Huna in the name of Bar Kappara)."}, "the-bet-is-closed": {"label": "The bet is closed behind", "gloss": "The world was made with a bet, closed on three sides and open in front: you may ask only from the day of creation onward (R. Yona in the name of R. Levi)."}, "beginning-is-blessing": {"label": "Bet for blessing, not alef for curse", "gloss": "Made with the letter of berakhah rather than of arirah, so that the heretics could not say the world was created with a curse (Bereshit Rabbah 1:10)."}, "moses-is-a-witness": {"label": "Moses wrote as a witness", "gloss": "Not in the persuasion of human wisdom nor in the counterfeit disputations of philosophy, but in the showing of the Spirit and of power, as a witness of the divine work (Ambrose)."}, "against-the-philosophers": {"label": "Against the philosophers", "gloss": "Plato's three principles and the atomists' concourse are a spider's web; the divine mind alone contains the origins and causes of things (Ambrose)."}, "against-the-heretics": {"label": "Because the heretics attack it", "gloss": "The Manichees mock the Old Testament before the unlearned, so the first book must be defended, and defended plainly (Augustine)."}, "written-for-the-unlearned": {"label": "In plain speech, for the unlearned", "gloss": "Not with ornate and polished speech but with plain facts — the usual and simple speech the learned also unde
