<script>
const D = {"crux": {"id": "elohim-and-trinity", "question": {"en": "Who is the God who creates, and what do grammar and word order say about plurality?", "la": "Quis est Deus qui creat, et quid de Trinitate?", "he": "מִי הוּא אֱלֹהִים הַבּוֹרֵא, וּמַה מַּשְׁמָע לְשׁוֹן רַבִּים?"}, "summary": "Megillah 9a is a Jewish witness to a Greek interpretive move that reaches the Latin bench through the Vetus Latina.", "finding": "One grammatical fact, three benches, three incompatible conclusions — and it is the same fact each time. Bereshit Rabbah 1:7 observes that the plural-looking Elohim takes singular verbs throughout: vaydaberu is not written but vaydaber, vayomeru is not written but vayomer, bare'u is not written but bara — and concludes that no creature can say that two authorities created the world. Abelard, at the Paraclete about 1133, asks the identical question in Latin — unde dictum est Eloim creavit, non creaverunt? — and answers that a singular verb is referred to a plural noun so that in those three persons one creator should be understood and not three, from which he derives the technical doctrine that the works of the Trinity are undivided. Ibn Ezra, at Lucca about 1155, closes the same argument with the same clause — 'and for this reason Scripture says bara and not bare'u' — having first shown that the plural is simply how the Holy Tongue speaks of the great, as adonim and be'alim are plural for one master and as a king in Arabic speaks of himself in the plural. And Ramban, a century later with Ibn Ezra in front of him, refuses to let the plural be empty at all: the word is a compound, el hem, the force and all the other forces, and 'a secret will yet be disclosed in connection with this'. Nobody is answering anybody. Three of the four could not have read each other, and the fourth is reading only within his own bench.\n\nWhat makes Abelard's page the strangest thing on this daf is that the Latin bench had the information for six hundred years and never used it here. Jerome knew that the Hebrew word is common in number and said so — verbum Hebraicum ELOIM communis est numeri, et Deus quippe et dii similiter appellantur — but he says it at Genesis 6:2, about the sons of God, and Rabanus copies him there verbatim, and neither brings it forward to the first verse. Every other Latin witness on this crux gets its Trinity from the sequence of the sentences rather than from any Hebrew word: the Father in the name of God, the Son in the name of the Beginning, the Spirit borne over the waters. That is Augustine's triad, and he calls it a riddle — ecce apparet mihi in aenigmate Trinitas — and states the order of his own search plainly, that he already held two of the three and believed the third and went looking for it in the holy sayings. Bede, Bruno, Honorius and the Glossa repeat the triad and none of them repeats the word riddle. In the unfinished commentary Augustine is franker still: he sets out the catholic faith before expounding a syllable, because many heretics drag the Scriptures to their own opinion.\n\nThe rabbinic bench, meanwhile, preserves a memory of the whole problem as a translation problem. Megillah 9a's baraita has seventy-two elders shut in seventy-two houses writing the Torah for Ptolemy, and the first two things on the list of what they changed are the two verses the Latin bench builds on: they wrote 'God created in the beginning', moving the divine name to the front so that bereshit could not be read as a subject, and they wrote 'I shall make a human', singular, for the 'let us make' of Gen 1:26. Both changes remove a plurality from the opening of Genesis. Neither is in the Septuagint the Church actually inherited, whose first verse keeps the Hebrew order and whose Gen 1:26 keeps the plural. So the Latin reading of both verses stands in exactly the space the elders are said to have closed — and Bruno of Segni, refuting it at Segni about 1090, refuses the plurality in the rabbinic bench's own words: was he speaking to the angels? God forbid, for otherwise there would be not one creator but many."}, "witnesses": [{"id": "br-1-7", "short": "br-1-7", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["one-authority-singular-verb"], "senses": ["literal"], "lemma": {"he": "בְּרֵאשִׁית בָּרְאוּ אֱלֹהִים, אֵין כְּתִיב כָּאן", "en": "'In the beginning the gods created' is not written here"}, "en": "Rabbi Yitzḥak began: “The beginning of Your word is truth…” (Psalms 119:160) – Rabbi Yitzḥak said: Right from the beginning of the creation of the world [it can be seen that] “the beginning of Your word is truth” – “in the beginning, God created.” “But My Lord God is truth” (Jeremiah 10:10), “All Your righteous laws are eternal” (Psalms 119:160) – as each and every edict that You decree upon Your creations, they accept the judgment upon themselves and receive it faithfully, and no person can come and say that two authorities created the world: “God [Elohim] spoke [vaydaberu]” is not written here [in plural], but rather [in singular], “God spoke [vaydaber];” “God [Elohim] said [vayomeru]” is not written here [in plural], but rather [in singular], “God said [vayomer]”; “In the beginning God created [bare’u]” is not written here [in plural], but rather [in singular], “God created [bara].”", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "רַבִּי יִצְחָק פָּתַח (תהלים קיט, קס): רֹאשׁ דְּבָרְךָ אֱמֶת וגו', אָמַר רַבִּי יִצְחָק מִתְּחִלַּת בְּרִיָּתוֹ שֶׁל עוֹלָם רֹאשׁ דְּבָרְךָ אֱמֶת. בְּרֵאשִׁית בָּרָא אֱלֹהִים, (ירמיה י, י): וַה' אֱלֹהִים אֱמֶת. וּלְעוֹלָם כָּל מִשְׁפַּט צִדְקֶךָ, שֶׁכָּל גְּזֵרָה וּגְזֵרָה שֶׁאַתָּה גּוֹזֵר עַל בְּרִיּוֹתֶיךָ הֵן מַצְדִיקִין עֲלֵיהֶם אֶת הַדִּין וּמְקַבְּלִין אוֹתוֹ בֶּאֱמוּנָה, וְאֵין כָּל בְּרִיָה יְכוֹלָה לוֹמַר שְׁתֵּי רְשֻׁיּוֹת בָּרְאוּ הָעוֹלָם. וַיְדַבְּרוּ אֱלֹהִים, אֵין כְּתִיב כָּאן, אֶלָּא וַיְדַבֵּר אֱלֹהִים. וַיֹּאמְרוּ אֱלֹהִים, אֵין כְּתִיב כָּאן, אֶלָּא וַיֹּאמֶר אֱלֹהִים. בְּרֵאשִׁית בָּרְאוּ אֱלֹהִים, אֵין כְּתִיב כָּאן, אֶלָּא בָּרָא אֱלֹהִים.", "olang": "he", "source": "Bereshit Rabbah 1:7 (Vilna numbering)", "notes": "The rabbinic answer to this crux, and it is a grammatical argument made three times over. R. Yitzḥak reads Ps 119:160, 'the beginning of your word is truth', of the opening of Genesis: from the beginning of the creation of the world the head of your word is truth, 'in the beginning God created', and the Lord God is truth (Jer 10:10). Then the point: no creature can come and say that two authorities created the world — vaydaberu Elohim is not written here but vaydaber Elohim; vayomeru Elohim is not written here but vayomer Elohim; bereshit bare'u Elohim is not written here but bara Elohim. Three verbs, all singular, against a noun that is plural in form. The observation is exactly Abelard's at the Paraclete seven hundred years later and Ibn Ezra's at Lucca, and the three of them draw three different conclusions from it. Note what the argument is aimed at: not idolatry in general but shtei reshuyot, two authorities — the dualism the same midrash elsewhere calls minut — and the verse is being used as a proof text against it.", "slot": false}, {"id": "br-1-12", "short": "br-1-12", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["word-order-is-modesty"], "senses": ["literal"], "lemma": {"he": "בְּרֵאשִׁית בָּרָא, וְאַחַר כָּךְ אֱלֹהִים", "en": "'In the beginning created', and only then 'God'"}, "en": "Rabbi Yudan said in the name of Akilas: To this One it is fitting to call God. The ordinary way of the world is that a flesh-and-blood king is praised in his province though he has not yet built any public baths in it and has not yet built private baths in it. First he proclaims his name and then presents his works. The Unique One of the world, however, first acted and then He was praised. Shimon ben Azai says: “Your humility has made me great” (II Samuel 22:36) – a flesh-and-blood [king] mentions his name first and then his title of praise: So-and-so Augustoli, So-and-so Pro titulo. But the Holy One blessed be He is not so; instead, after creating the needs of his world, only then does He mention His name: “In the beginning…created [bereshit bara]” and then “God [Elohim].”", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "רַבִּי יוּדָן בְּשֵׁם עֲקִילוּס אָמַר, לָזֶה נָאֶה לְקָרְאוֹ אֱלוֹהַּ, בְּנֹהַג שֶׁבָּעוֹלָם מֶלֶךְ בָּשָׂר וָדָם מִתְקַלֵּס בַּמְּדִינָה, וַעֲדַיִן לֹא בָּנָה לָהּ דִּימוֹסִיּוֹת, וַעֲדַיִן לֹא בָּנָה לָהּ פְּרִיבְטָאוֹת, בַּתְּחִלָּה מַזְכִּיר שְׁמוֹ וּלְבַסּוֹף קָטִיזְמָה שֶׁלּוֹ. בְּרַם יְחִידוֹ שֶׁל עוֹלָם, בִּתְּחִלָּה פָּעַל וּלְבַסּוֹף נִתְקַלֵּס. שִׁמְעוֹן בֶּן עֲזַאי אוֹמֵר (שמואל ב כב, לו): וְעַנֹתְךָ תַרְבֵּנִי, בָּשָׂר וָדָם מַזְכִּיר שְׁמוֹ וְאַחַר כָּךְ שִׁבְחוֹ, פְּלַן אֲגוֹסְטוֹלִי, פְּלַן פְּרַאטָאטָא. אֲבָל הַקָּדוֹשׁ בָּרוּךְ הוּא אֵינוֹ כֵן, אֶלָּא מִשֶּׁבָּרָא צָרְכֵי עוֹלָמוֹ אַחַר כָּךְ מַזְכִּיר שְׁמוֹ, בְּרֵאשִׁית בָּרָא, וְאַחַר כָּךְ אֱלֹהִים.", "olang": "he", "source": "Bereshit Rabbah 1:12 (Vilna numbering)", "notes": "Why the divine name comes third in the sentence, answered from court protocol and in Greek loanwords. R. Yudan in the name of Akilas — Aquila the proselyte, the translator — says: to this one it is fitting to call God. A flesh-and-blood king is acclaimed in a province before he has built it a public bath or a private one; he proclaims his name first and produces his works afterwards. The Unique One of the world acted first and was praised afterwards. Ben Azzai gets the same from 2 Sam 22:36, 'your humility has made me great': mortals put the name first and the titles after — So-and-so Augustalis, So-and-so pro titulo — but the Holy One, after creating the needs of his world, only then mentions his name: bereshit bara, and after that Elohim. The interest for this crux is that the rabbinic bench has a positive account of the Hebrew word order that the Greek elders were obliged to destroy, and its terms are the honorifics of the Roman provincial administration.", "slot": false}, {"id": "b-meg-9a", "short": "b-meg-9a", "author": "Babylonian Talmud", "tradition": "rabbinic", "date": 550, "datelabel": "redaction 500–600", "place": "Babylonia (Sura / Pumbedita)", "lat": 32.5, "lon": 44.4, "answers": ["word-order-is-dangerous", "one-authority-singular-verb"], "senses": ["translation", "literal"], "lemma": {"he": "אֱלֹהִים בָּרָא בְּרֵאשִׁית", "en": "God created in the beginning"}, "en": "For it was taught: [This is] the case of Ptolemy the King, who gathered seventy-two elders and entered them into seventy-two houses, and he did not reveal to them for what he gathered them. He then met each of them individually and he said to them: \"Write for me the Torah of Moses your teacher [in Greek].\" The Holy One, Blessed Be He put counsel into the heart of each one, and all of them harmonized to one understanding. And they wrote for him: \"God created in the beginning.\" (Genesis 1:1) \"I shall make a human in image and likeness.\" (Genesis 1:26)", "translator": "Sefaria Community Translation", "orig": "ומשום מעשה דתלמי המלך דתניא מעשה בתלמי המלך שכינס שבעים ושנים זקנים והכניסן בשבעים ושנים בתים ולא גילה להם על מה כינסן ונכנס אצל כל אחד ואחד ואמר להם כתבו לי תורת משה רבכם נתן הקב\"ה בלב כל אחד ואחד עצה והסכימו כולן לדעת אחת וכתבו לו אלהים ברא בראשית (בראשית א, א) אעשה אדם בצלם ובדמות (בראשית א, כו)", "olang": "arc", "source": "b. Megillah 9a (Vilna)", "notes": "The rabbinic bench's own account of how the Greek Bible came to read as it does, and the first two items on the list are the two verses the Latin bench builds its plurality on. Ptolemy shut seventy-two elders in seventy-two houses and told each to write him the Torah of Moses; God put counsel in each one's heart and they all agreed on one understanding. And they wrote for him: 'God created in the beginning' — Elohim bara bereshit, the divine name moved to the front so that bereshit could not be read as the subject, that is, as a deity who made God — and 'I shall make a human in image and likeness', singular, for the plural na'aseh of Gen 1:26. Both changes are aimed at plurality in the opening of Genesis. Neither is in the Septuagint the Church actually inherited: its Gen 1:1 keeps the Hebrew order, en archē epoiēsen ho theos, and its Gen 1:26 keeps the plural, poiēsōmen anthrōpon. So the baraita is a tradition about a Greek Torah rather than a description of one, and the Latin reading of both verses exists in the space the described changes would have closed.", "slot": false}, {"id": "ramban-1-1-elohim", "short": "ramban-1-1-elohim", "author": "Moses ben Naḥman (Naḥmanides)", "tradition": "rabbinic", "date": 1267, "datelabel": "1263–1270", "place": "Girona", "lat": 41.98, "lon": 2.82, "answers": ["elohim-is-plural-of-powers"], "senses": ["literal", "spiritual"], "lemma": {"he": "אֱלֹהִים בַּעַל הַכֹּחוֹת כֻּלָּם", "en": "Elohim, the Master of all the forces"}, "en": "AND ‘ELOKIM’ (G-D) SAID. The word Elokim means “the Master of all forces,” for the root of the word is e-il, meaning force, and the word Elokim is a composite consisting of the words e-il heim, as if the word e-il is in a construct state, and heim, [literally] “they,” alludes to all other forces. Thus Elokim means “the Force of all forces.” A secret will yet be disclosed in connection with this.", "translator": "Charles B. Chavel, 1971–76", "orig": "וְאָמַר אֱלֹהִים בַּעַל הַכֹּחוֹת כֻּלָּם, כִּי הַמִּלָּה עִקָּרָהּ \"אֵל\", שֶׁהוּא כֹּחַ, וְהִיא מִלָּה מֻרְכֶּבֶת, \"אֵל הֵם\", כְּאִלּוּ \"אֵל\" סָמוּךְ, \"וְהֵם\" יִרְמֹז לְכָל שְׁאָר הַכּוֹחוֹת; כְּלוֹמַר, כֹּחַ הַכּוֹחוֹת כֻּלָּם. וְעוֹד יִתְבָּאֵר סוֹד בָּזֶה.", "olang": "he", "source": "Ramban on Gen 1:1, s.v. אלהים", "notes": "Ramban takes the plural seriously and makes it mean something other than persons. The word is a compound: its root is el, which is force, and it is put together as el hem, as though el were in the construct and hem, 'they', pointed to all the other forces — so that Elohim is the force of all forces, the master of them all. Then the sentence that stops the paragraph: 'a secret will yet be disclosed in connection with this', which is his standard signal that a kabbalistic doctrine lies underneath and will not be printed. So on the one bench a plural noun points to a plurality within God that may not be spoken, and on the other, at almost the same date, it points to three persons that may be preached. Neither Ibn Ezra's honorific plural nor Abelard's three persons is what Ramban means, and his answer is the only one of the three that treats the plurality as real and as not a plurality of creators.", "slot": false}, {"id": "ibn-ezra-1-1-elohim", "short": "ibn-ezra-1-1-elohim", "author": "Abraham ibn Ezra", "tradition": "rabbinic", "date": 1155, "datelabel": "c. 1155", "place": "Lucca", "lat": 43.84, "lon": 10.5, "answers": ["elohim-is-honorific-plural", "one-authority-singular-verb"], "senses": ["literal"], "lemma": {"he": "עַל כֵּן יֹאמַר הַכָּתוּב בָּרָא, וְלֹא בָּרְאוּ", "en": "for this reason Scripture says 'he created' and not 'they created'"}, "en": "“E-lohim” – After we have found [the word] e-loah, we know that E-lohim is its plural form, and the root [of this] is in the nature of language. For every language has a formal form. The way of expressing formality in non-Hebrew languages is by the lesser using the plural in the presence of the greater. In Arabic the way of formal expression is for the greater to speak, as royalty, in the plural. In the Holy Tongue, the way is to refer to the greater in the plural. Like “master” (adonim), “owner” b’alim as they said, “a harsh master” (b’alim) Isaiah 19:4, “his master (b’alim) shall take”. Likewise the word “upon him” (alav), “to him” (elav), “until him” (adav). For this reason does Scripture state “He created” and not “they created”.", "translator": "Sefaria Community Translation", "orig": "אלהים, אחר שמצאנו אלוה, ידענו כי אלהים לשון רבים, ושרש זה מדרך הלשון, כי כל לשון יש לו דרך כבוד, וכבוד לשון לועז שיאמר הקטן לנכח הגדול לשון רבים, ובלשון ישמעאל דרך כבוד שידבר הגדול כמו המלך בלשון רבים, ובלשון הקדש דרך כבוד לומר על הגדול לשון רבים כמו \"אדנים\" \"ובעלים\", שאמרו \"אדנים קשה\" (ישעי' י\"ט ד'), \"ולקה בעליו\" (שמות כ\"ב, י') וכן מלת עליו, אליו, ועדיו, על כן יאמר הכתוב ברא, ולא בראו", "olang": "he", "source": "Ibn Ezra on Gen 1:1, s.v. אלהים", "notes": "The grammarian's answer, and it is comparative philology two hundred years before anyone calls it that. Having found eloah, we know that Elohim is its plural, and the root of the usage is in the nature of language itself: every language has a way of showing honour. In the vernacular tongues the lesser addresses the greater in the plural; in Arabic the greater — a king — speaks of himself in the plural; in the Holy Tongue the way is to speak of the greater in the plural, as with adonim, 'master', and be'alim, 'owner', which take plural forms for a single person (Isa 19:4, Exod 22:10). And therefore: Scripture says bara and not bare'u. That last clause is word for word what Abelard asks at the Paraclete twenty years earlier — unde dictum est Eloim creavit, non creaverunt? — and the two men give opposite answers to it, neither having heard of the other.", "slot": false}, {"id": "basil-hex-2-6b", "short": "basil-hex-2-6b", "author": "Basil of Caesarea", "tradition": "greek", "date": 380, "datelabel": "370–380", "place": "Caesarea in Cappadocia", "lat": 38.72, "lon": 35.49, "answers": ["trinity-in-the-triad", "spirit-is-holy-spirit"], "senses": ["literal"], "lemma": {"la": "venerabilis Trinitatis expletor", "en": "the completer of the venerable Trinity"}, "en": "And the Spirit of God, it says, was borne over the water. If by 'spirit' he means the diffusion of this air of ours, understand that the writer is enumerating for you the several portions of the world; for he says that God made heaven and earth, water and air, this liquid and diffused element. Or else — which I judge the truer, and which was approved by those who were before us — by 'the Spirit of God' he means the Holy Spirit. For Scripture reserved it, that it might fittingly declare the special mention of this name; and we ought to believe that no other spirit is spoken of but the Holy, who is the completer of the blessed and venerable Trinity. And taking this understanding, you will find that a greater profit is thereupon conferred on you.", "translator": "claude-draft-approved", "orig": "Et spiritus, inquit, Dei ferebatur super aquam. Sive diffusionem aeris istius, spiritum dicit, percipe scriptorem portiones tibi mundi singulas enumerantem; nam fecisse Deum dicit coelum et terram, aquam et aerem, hunc liquidum atque diffusum; sive, quod verum magis existimo, et quod his qui ante nos fuere probatum est, Spiritum Dei dicit, id est sanctum. Reservavit enim Scriptura, ut praecipuam hujus competenter mentionem nominis declararet: nullumque alium spiritum dictum debemus credere, nisi sanctum, qui beatae ac venerabilis Trinitatis expletor est, et hunc intellectum capiens, majus tibi subinde commodum conferri reperies.", "olang": "la", "source": "PL 53, col. 886B", "notes": "The Greek bench identifying the third term, and doing it as a decision between two readings rather than as an assumption. Either the spirit of v. 2 is the diffusion of the air, in which case the verse is finishing an inventory of the elements — heaven, earth, water, air — or it is the Holy Spirit; and Basil takes the second, on the authority of those before him, with a reason drawn from the shape of the sentence: Scripture held the word back so that the mention of this name should carry its full weight. The word he uses for the Spirit is expletor, the one who completes or fills out the Trinity, which is an odd and strong term and is the whole of the Latin bench's argument in one noun: the Father and the Son are in the first verse, and the third person has been kept for the second. Ambrose, who is reading Basil, makes the same choice at Milan a few years later and says so.", "slot": false}, {"id": "aug-gnl-imp-1-2", "short": "aug-gnl-imp-1-2", "author": "Augustine", "tradition": "latin", "date": 393, "datelabel": "c. 393", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["trinity-is-brought-to-the-text"], "senses": ["literal"], "lemma": {"la": "ante tractationem hujus libri catholica fides breviter explicanda est", "en": "before treating this book, the catholic faith must briefly be set out"}, "en": "And since many heretics have been accustomed to drag the exposition of the divine Scriptures to their own opinion, which is beside the faith of catholic teaching, before the treatment of this book the catholic faith must briefly be set out. It is this: that God the Father almighty made and established the whole creation through his only-begotten Son, that is, his Wisdom and Power, consubstantial with him and coeternal, in the unity of the Holy Spirit, himself also consubstantial and coeternal. That this Trinity, then, is called one God, and that he made and created all things that are, in so far as they are, catholic teaching bids us believe; so that every creature, whether intellectual or corporeal — or, as it may be more briefly said in the words of the divine Scriptures, whether invisible or visible — is made not of God's nature but by God out of nothing: and that there is nothing in it belonging to the Trinity, except that the Trinity founded it and it was founded. Wherefore it is not lawful to say or believe that the whole creation is either consubstantial with God or coeternal.", "translator": "claude-draft-approved", "orig": "Et quoniam multi haeretici ad suam sententiam, quae praeter fidem est catholicae disciplinae, expositionem Scripturarum divinarum trahere consueverunt; ante tractationem hujus libri catholica fides breviter explicanda est. 2. Est autem haec: Deum Patrem omnipotentem universam creaturam fecisse atque constituisse per Filium suum unigenitum, id est Sapientiam et Virtutem suam consubstantialem sibi et coaeternam, in unitate Spiritus sancti, et ipsius consubstantialis et coaeterni. Hanc ergo Trinitatem dici unum Deum, eumque fecisse et creasse omnia quae sunt, in quantum sunt, catholica disciplina credi jubet; ita ut creatura omnis sive intellectualis sive corporalis, vel quod brevius dici potest secundum verba divinarum Scripturarum, sive invisibilis sive visibilis, non de Dei natura, sed a Deo sit facta de nihilo: nihilque in ea esse quod ad Trinitatem pertineat, nisi quod Trinitas condidit, ista condita est. Quapropter creaturam universam neque consubstantialem Deo, neque coaeternam fas est dicere aut credere.", "olang": "la", "source": "PL 34, col. 221", "notes": "Augustine states, before he has expounded a word of Genesis, what the exposition will have to come out to, and gives the reason: many heretics drag the divine Scriptures to their own opinion. So the Trinity is the rule under which the first chapter will be read, not a conclusion drawn from it — which is worth having on the daf, because every other Latin witness here proceeds as though the three persons were found in the words. The content of the rule is exactly what a reader of Gen 1:1–2 needs: the Father made everything through the Son who is his Wisdom, in the unity of the Spirit; the three are one God; and nothing in the creature belongs to the Trinity except that the Trinity made it. That last clause is aimed at the Manichees and does on the Latin bench what R. Yitzḥak's 'no creature can say that two authorities created the world' does on the rabbinic: it forecloses a dualism.", "slot": false}, {"id": "aug-conf-13-5", "short": "aug-conf-13-5", "author": "Augustine", "tradition": "latin", "date": 400, "datelabel": "397–401", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["trinity-in-the-triad", "trinity-is-brought-to-the-text"], "senses": ["allegorical", "spiritual"], "lemma": {"la": "Ecce Trinitas Deus meus, Pater et Filius et Spiritus sanctus", "en": "Behold the Trinity, my God, Father and Son and Holy Spirit"}, "en": "Behold, the Trinity appears to me in a riddle, which you are, my God; since you, Father, in the Beginning of our wisdom — which is your Wisdom, born of you, equal to you and coeternal, that is, in your Son — made heaven and earth. And we have said many things about the heaven of heaven, and about the earth invisible and unordered, and about the darksome deep, according to the wandering falls of a spiritual formlessness, unless it were turned to him from whom it had whatever life it had, and by illumination were made a beautiful life, and were the heaven of that heaven which was afterwards made between water and water. And I already held the Father in the name of God, who made these things, and the Son in the name of the Beginning, in whom he made these things; and believing my God to be a Trinity, as I did believe, I sought it in his holy sayings — and behold, your Spirit was borne over the waters. Behold the Trinity, my God, Father and Son and Holy Spirit, creator of all creation.", "translator": "claude-draft-approved", "orig": "Ecce apparet mihi in aenigmate Trinitas, quod es Deus meus; quoniam tu, Pater, in Principio sapientiae nostrae quod est tua Sapientia de te nata, aequalis tibi et coaeterna, id est in Filio tuo, fecisti coelum et terram. Et multa diximus de coelo coeli, et de terra invisibili et incomposita, et de abysso tenebrosa, secundum spiritualis informitatis vagabunda deliquia, nisi converteretur ad eum a quo erat qualiscumque vita, et illuminatione fieret speciosa vita, et esset coelum coeli ejus, quod inter aquam et aquam postea factum est; et tenebam jam Patrem in Dei nomine, qui fecit haec, et Filium in Principii nomine in quo fecit haec; et Trinitatem credens Deum meum, sicuti credebam, quaerebam in eloquiis sanctis ejus, et ecce Spiritus tuus superferebatur super aquas. Ecce Trinitas Deus meus, Pater et Filius et Spiritus sanctus, creator universae creaturae.", "olang": "la", "source": "PL 32, col. 847", "notes": "The three-term reading in its classical form, and it is autobiography rather than exegesis: the Father in the name of God, the Son in the name of the Beginning, and then — 'believing my God to be a Trinity, as I did believe, I sought it in his holy sayings, and behold, your Spirit was borne over the waters.' The order of the sentence is the order of the search. He held two of the three from the first verse, he already believed the third, and he went looking for it in the text; and the chapter heading the editors gave it says what he does not, that the Trinity which is God is understood from the first words of Genesis. Augustine himself calls it a riddle, in aenigmate. This is the passage that Bede, the Glossa, Bruno, Honorius and Abelard are all repeating, and none of them keeps the word riddle.", "slot": false}, {"id": "wigbod-gen-1-1d", "short": "wigbod-gen-1-1d", "author": "Wigbod", "tradition": "latin", "date": 790, "datelabel": "c. 790", "place": "Tours", "lat": 47.39, "lon": 0.69, "answers": ["principium-is-the-son", "trinity-in-the-triad"], "senses": ["literal"], "lemma": {"la": "in principio sibi coaeterno", "en": "in a Beginning coeternal with himself"}, "en": "M[aster]. Let us say that in a Beginning coeternal with himself God made heaven and earth — in the only-begotten Son, who is the Wisdom of the Father, of whom the Apostle says: Christ the power of God and the wisdom of God (1 Cor 1:24).", "translator": "claude-draft-approved", "orig": "M. Dicamus quia in principio sibi coaeterno fecit Deus coelum et terram, in unigenito Filio qui est sapientia Patris, de quo dicit Apostolus, Christum Dei virtutem et Dei sapientiam (I Cor. I, 24) .", "olang": "la", "source": "PL 96, col. 1115A", "notes": "The Carolingian dialogue's answer to the question its pupil has just asked — in what beginning, the beginning of time, or a beginning that was the start of the creature? — and it refuses the alternative by making the Beginning a person: one coeternal with God himself, the only-begotten Son who is the Father's Wisdom, with 1 Cor 1:24 for the identification. What the schoolroom form makes visible is how short the step is. The pupil asked a question about time; the master answered with a doctrine of the second person, and neither notices that the question has been changed.", "slot": false}, {"id": "remigius-gen-1-1c", "short": "remigius-gen-1-1c", "author": "Remigius of Auxerre", "tradition": "latin", "date": 890, "datelabel": "c. 890", "place": "Auxerre", "lat": 47.8, "lon": 3.57, "answers": ["principium-is-the-son"], "senses": ["allegorical"], "lemma": {"la": "Deus enim Pater principium est, sed non de principio", "en": "for God the Father is a beginning, but not from a beginning"}, "en": "Allegorically, in what is said, In the beginning God made heaven and earth, by the name of 'beginning' we may not inappropriately understand the Son of God, as he himself said of himself to the Jews: I am the beginning, who also speak to you (John 8:25). For God the Father is a beginning, but not from a beginning, since he was not made or created by the Father but begotten; through which Beginning God the Father created heaven and earth, that is, the heavenly and the earthly. For by 'heaven' are signified the heavenly, or those leading a heavenly life; by 'earth', those gaping after earthly business. Both of these were created through the Beginning, because when Jesus Christ was born it became plain who were heavenly and who were earthly.", "translator": "claude-draft-approved", "orig": "Allegorice quod dictum est: in principio fecit Deus coelum et terram, nomine principii Filium Dei non incongrue possumus accipere, sicut ipse de se Judaeis dixit: ego principium qui et loquor vobis (Joan. VIII, 28) . Deus enim Pater principium est, sed non de principio, quia a Patre non factus nec creatus, sed genitus est: per quod principium Deus Pater coelum et terram creavit, id est coelestes et terrenos. Per coelum enim coelestes sive coelestem vitam ducentes: per terram vero terrenis negotiis inhiantes signantur. Qui utrique per principium creati sunt, quia nato Jesu Christo patuit qui essent coelestes, quique terreni.", "olang": "la", "source": "PL 131, col. 55C", "notes": "A distinction made in passing that nobody else on this daf bothers with: the Father too is a beginning — but not from a beginning, since he is not made or created but begotten. Remigius has noticed that if 'in the beginning' names the Son because the Son is a principium, the word will also fit the Father, and he heads it off with the credal formula. The rest is the standard identification with John 8:25 and then the ecclesial reading, in which heaven and earth are the heavenly-minded and the earthly-minded and the division became visible only at the Incarnation. Set beside R. Yudan's 'to this one it is fitting to call God', the two benches are doing the same thing with the same clause — asking what may properly be predicated of the creator, and answering out of the word order.", "slot": false}, {"id": "bruno-gen-1-1c", "short": "bruno-gen-1-1c", "author": "Bruno of Segni", "tradition": "latin", "date": 1085, "datelabel": "1078–1100", "place": "Segni", "lat": 41.69, "lon": 13.02, "answers": ["trinity-in-the-triad", "not-to-angels"], "senses": ["literal", "allegorical"], "lemma": {"la": "Nunquid ad angelos? Absit!", "en": "Was it to the angels? God forbid!"}, "en": "It is God, then, who speaks. Was it to the angels? God forbid! For man was not created by angels; otherwise there would be not one but many creators, whereas God alone is the Creator of all. For thus it is written: The Creator of all, terrible and strong (2 Macc 1:24). And again: You have made all things in wisdom (Ps 104:24 [Vg 103:24]). If therefore it is true, as cannot be denied, that God alone created all things, whom was he inviting to the making of man when he said, Let us make man? Let us hear, then, what is said at the head of this book: In the beginning God created heaven and earth. You have therefore God, that is, the Father; you have also a beginning, that is, the Son — for so he himself says: I am the beginning, who also speak to you (John 8:25). But what follows? And the Spirit of God was borne over the waters. You have therefore the Holy Spirit also. And that not the Father alone created heaven, but the Son and the Holy Spirit together with him, let the psalmist say: By the word of the Lord the heavens were established, and all their power by the spirit of his mouth (Ps 33:6 [Vg 32:6]). Now the whole Trinity, that is, God and his Word and his Spirit, is one God; and it is he who says, Let us make man — not seeking help outside himself, but disposing all things within himself with his Son and the Holy Spirit.", "translator": "claude-draft-approved", "orig": "Deus ergo est qui loquitur. Nunquid ad angelos? Absit! Non enim ab angelis creatus est homo; alioquin non unus, sed multi creatores essent, ut solus Deus est omnium Creator. Sic enim scriptum est: « Creator omnium terribilis, et fortis (II Machab. I, 24) . » Itemque: « Omnia in sapientia fecisti (Psal. CIII, 24) . » Si igitur verum est, quod negari non potest, solus Deus creavit omnia; quos ad hominem creandum invitabat, dicens: « Faciamus hominem. » Audiamus igitur quid in capite libri hujus dicatur: « In principio creavit Deus coelum et terram. » Habes ergo Deum, id est Patrem; habes et principium, id est Filium; sic enim ipse ait: « Ego principium qui et loquor vobis (Joan. VIII, 25) . » Sed quid sequitur? « Et Spiritus Dei ferebatur super aquas. » Habes igitur et Spiritum sanctum. Quod autem non solus Pater coelum creaverit, sed simul cum eo Filius quoque, et Spiritus sanctus, dicat Psalmista: « Verbo, inquit, Domini coeli firmati sunt, et Spiritu oris ejus omnis virtus eorum (Psal. XXXII, 6) . » Tota autem Trinitas, id est Deus, et Verbum ejus, et Spiritus ejus, unus Deus, et iste quidem dicit: « Faciamus hominem; » non extra se auxilium petens, sed in se cum Filio suo, et Spiritu sancto cuncta disponens.", "olang": "la", "source": "PL 164, col. 157A", "notes": "The one Latin witness on this crux who states the negative half of the question, and he states it in the rabbinic bench's own terms. Whom was God inviting when he said 'let us make man'? Not the angels — for man was not created by angels, and otherwise there would be not one creator but many. That is R. Yitzḥak's 'no creature can say that two authorities created the world', with the angels in the place of the second authority and with the same horror of it. Having refused the answer, Bruno goes back to the head of the book for the right one, and lays the triad out in three short moves: you have God, that is the Father; you have a beginning, that is the Son; and what follows? — the Spirit of God borne over the waters, so you have the Holy Spirit too. Nothing in the argument is his own except its shape, which is a schoolman's: the wrong answer refuted first, from a premise both benches share.", "slot": false}, {"id": "abelard-hex-1-1-eloim", "short": "abelard-hex-1-1-eloim", "author": "Peter Abelard", "tradition": "latin", "date": 1133, "datelabel": "c. 1133", "place": "The Paraclete (Nogent-sur-Seine)", "lat": 48.49, "lon": 3.5, "answers": ["elohim-is-plural-of-persons", "one-authority-singular-verb", "trinity-in-the-triad"], "senses": ["literal", "translation"], "lemma": {"la": "Eloim creavit, non creaverunt", "en": "Eloim created, not 'they created'"}, "en": "It is to be noted that in this very opening of Genesis the prophet carefully expressed the foundation of our faith concerning the unity of God and the Trinity. For when he said 'the Spirit of the Lord', he plainly distinguished at once both the person of the Holy Spirit and that of the Father, from whom that Spirit principally proceeds, as blessed Augustine records. But in that he added 'God said', he openly expressed God's own saying, that is, his Word, which is the Son, together with the Father himself. For no one of sound head can be so foolish as to reckon this saying corporeal, since the Godhead is not corporeal, nor has it to speak in a bodily way, nor was there yet anyone present to whom it would have had to speak bodily. Now where we say 'God created', for what is 'God' the Hebrew has Eloim, which shows a plurality of divine persons. For El is singular, which is interpreted 'God'; but Eloim is plural, by which we understand the diversity of the persons, of which each one is God. But why is it said 'Eloim created' and not 'they created'? — namely, so that a singular verb should be referred to a plural noun; in order that it might be intimated that in those three persons not three creators but one only is to be understood. When therefore he said 'Eloim created', in which he taught that the divine persons work equally together, he assuredly laid down beforehand that the works of the Trinity are undivided. And when afterwards, as we have said, he distinguished the persons of the Father and the Spirit and the Word, he determined wherein that Trinity consists.", "translator": "claude-draft-approved", "orig": "Notandum vero in hoc ipso Genesis exordio fidei nostrae fundamentum circa unitatem Dei ac Trinitatem prophetam diligenter expressisse. Cum enim dixerit Spiritus Domini, simul et personam Spiritus sancti et Patris, a quo ipse Spiritus, ut beatus meminit Augustinus, principaliter procedit, manifeste distinxit. In eo vero quod addidit: Dixit Deus, dictum ipsius Dei, id est Verbum ejus, quod est Filius, cum ipso pariter Patre patenter expressit. Nemo etenim sani capitis ita desipere potest, ut hoc dictum corporale aestimet, cum nec corporalis sit divinitas, nec loqui corporaliter habeat, nec adhuc cui eum loqui corporaliter oporteret, assisteret. Ubi autem nos dicimus: Creavit Deus, pro eo quod est Deus, in Hebraeo habetur Eloim, quod divinarum personarum pluralitatem ostendit. El quippe singulare est quod interpretatur Deus; Eloim vero plurale est, per quod diversitatem personarum, quarum unaquaeque Deus est, intelligimus. Unde autem dictum est: Eloim creavit, non creaverunt? ut videlicet ad plurale nomen singulare verbum referretur; quatenus insinuaretur in tribus illis personis non tres creatores, sed unum tantum debere intelligi. Cum igitur dixit Eloim creavit, in quo divinas personas pariter cooperari docuit, profecto indivisa esse opera Trinitatis praefixit. Cum autem postmodum, ut diximus, Patris et Spiritus et Verbi personas distinxit, in quo illa consisteret Trinitas determinavit.", "olang": "la", "source": "PL 178, col. 739B", "notes": "The star witness of this crux, and the only place on the Latin bench where the Hebrew word is brought to Gen 1:1 at all. Abelard knows that El is singular and Eloim plural, and he asks the exact question the midrash asks — why 'Eloim created' and not 'they created'? — and answers it by the concord: a singular verb referred to a plural noun, so that in those three persons one creator is understood and not three. From which he draws the technical doctrine, opera Trinitatis indivisa. Where he got the grammar is unknown: Jerome's note that the Hebrew word is common in number sits at Gen 6:2 and is about the sons of God, and no Latin before Abelard brings it forward to the first verse. What he does not have is the rest of the Hebrew: he reads the plural as a plurality of persons, which is the one thing the rabbinic bench never lets it mean, and Ibn Ezra will refute the reading twenty years later without ever having heard of him. Note also the first half of the passage, where the Trinity is got out of the sequence of the verses rather than the noun — Spirit and Father from 'the Spirit of the Lord', Word and Father from 'God said' — which is Augustine's method and needs no Hebrew at all.", "slot": false}, {"id": "rupert-gen-1-3-trinitas", "short": "rupert-gen-1-3-trinitas", "author": "Rupert of Deutz", "tradition": "latin", "date": 1117, "datelabel": "1112–1117", "place": "Liège", "lat": 50.63, "lon": 5.57, "answers": ["trinity-in-the-formula"], "senses": ["allegorical", "spiritual"], "lemma": {"la": "ubique tria consonant testimonii verba", "en": "everywhere three words of testimony agree"}, "en": "Because these are the works of the creating Trinity, holy Scripture rightly triples its testimony everywhere. For there are three sayings, or rather one and the same thing said three times. God said, whose saying is doing. And so it was done, and the earth brought forth. And the first is according to the evening, that is, the secret of the Word of God, in which was life; whatever is according to the morning, that is, by the substantial bringing forth of things; and another was done according to this same morning, and a third according to the continuing day of the creature persevering in whatever manner. You will find this in all the works of the six days: God said, Let there be luminaries, and it was so, and God made two great luminaries. Again: Let the waters bring forth creeping things, and God created the great sea-creatures, and God blessed them, and so on. But in the creation of the light, God said: Let there be light, and light was made, and he divided the light and the darkness. Everywhere three words of testimony agree, because everywhere, at evening and at morning and through the whole day, the creating Trinity works. And this is the original cause of the holy and just law by which the same writer laid down that no judicial case needs more than three witnesses.", "translator": "claude-draft-approved", "orig": "Quia creatricis Trinitatis haec sunt opera, bene testimonium suum sancta Scriptura ubique triplicat. Tria nempe dicat sunt, imo ter unum idemque dictum est. Dixit Deus, cujus dixisse fecisse est. Factumque est ita, et protulit terra. Et primum quidem secundum vespere est, id est verbi Dei secretum, in quo vita erat; quidquid mane, id est substantiali rerum productione; factumque est aliud secundum hoc ipsum mane, tertium secundum diem continuum quomodocunque perseverantis creaturae. Hoc in cunctis sex dierum operibus invenies: Dixit Deus: Fiant luminaria, et factum est ita, et fecit Deus duo luminaria magna. Item: Producant aquae reptilia, creavitque Deus cete grandia, benedixitque illis Deus, etc. Sed in creatione lucis dixit Deus: Fiat lux, et facta est lux, et divisit lucem et tenebras. Ubique tria consonant testimonii verba, quia tota ubique vespere et mane et tota die creatrix operatur Trinitas. Et haec est sanctae ac justae legis originalis causa, qua scriptor idem sanxit, ut testibus plus quam tribus nulla judicialis indigeat causa.", "olang": "la", "source": "PL 167, col. 229D", "notes": "Rupert's whole design for the Hexaemeron in one paragraph, and it is the boldest thing said on this crux: the threefold formula that runs through the six days — God said, and it was so, and God made — is itself the trace of the Trinity, because the creating Trinity is at work everywhere, and Moses laid down the law of three witnesses for the same reason he wrote the chapter this way. Augustine had entertained precisely this reading at De Genesi ad litteram II and rejected it, on the ground that it would make the Son appear to act under orders and the Spirit merely to approve. Rupert takes it up anyway and generalises it past the point where Augustine's objection can be raised, by making the three words a testimony rather than a distribution of labour — and then, having done so, ties it to the law of evidence, which is a claim about how Scripture was written rather than about what happened.", "slot": false}, {"id": "ambrose-hex-1-8-29", "short": "Ambrose", "author": "Ambrose", "tradition": "latin", "date": 387, "datelabel": "c. 387", "place": "Milan", "lat": 45.46, "lon": 9.19, "answers": ["brooding-warmth", "trinity"], "senses": ["literal"], "lemma": {"la": "Syrus … sic habet: Et Spiritus Dei fovebat aquas", "en": "the Syriac has: And the Spirit of God warmed the waters"}, "en": "…especially since there follows: 'And the Spirit of God was borne above the waters.' Some take this as the air, others as the breath we draw and take in, the breath of this life-giving atmosphere; but we, agreeing with the judgment of the saints and the faithful, take it as the Holy Spirit, so that in the founding of the world the working of the Trinity may shine out. […] Finally the Syriac, which is neighbor to the Hebrew and in most things agrees and chimes with it in wording, has it thus: 'And the Spirit of God warmed the waters,' that is, quickened them, so as to gather them into new creatures and by his warmth bring them alive. For we also read that the Holy Spirit is creator, Job saying, 'The divine Spirit who made me' (Job 33:4).", "translator": "claude-draft-approved", "orig": "maxime cum sequatur: Et spiritus Dei superferebatur super aquas (Ibid.) . Quem etsi aliqui pro aere accipiant, aliqui pro spiritu quem spiramus et carpimus aurae hujus vitalis spiritum; nos tamen cum sanctorum et fidelium sententia congruentes, Spiritum sanctum accipimus, ut in constitutione mundi operatio Trinitatis eluceat. Praemisso enim quia in principio fecit Deus coelum et terram, id est in Christo fecit Deus, vel Filius Dei Deus fecit, vel per Filium Deus fecit; quia omnia per ipsum facta sunt, et sine ipso factum est nihil, supererat plenitudo operationis in Spiritu, sicut scriptum est: Verbo Domini coelis firmati sunt, et Spiritu oris ejus omnis virtus eorum (Ps. XXXII, 6) . Itaque quemadmodum in Psalmo docemur operationem Verbi, quod est Verbum Dei, et virtutem quam dedit Spiritus sanctus; ita hic propheticum resultavit oraculum, quia Deus dixit, et Deus fecit. Spiritus quoque Dei superferebatur super aquas. Ornando enim polo coeli, germinaturis terris pulchre Spiritus superferebatur, quia per ipsum habebant novorum partuum semina germinare, secundum quod dixit propheta: 17 Emitte Spiritum tuum et creabuntur, et renovabis faciem terrae (Ps. CIII, 30) . Denique Syrus, qui vicinus Hebraeo est, et sermone consonat in plerisque et congruit, sic habet: Et Spiritus Dei fovebat aquas, id est vivificabat, ut in novas cogeret creaturas, et fotu suo animaret ad vitam. Nam etiam Spiritum sanctum legimus creatorem, dicente Job, Spiritus divinus qui fecit me (Job. XXXIII, 4) .", "olang": "la", "source": "PL 14, col. 138C", "notes": "Ambrose is reading Basil's Greek directly (Milan, 387; Eustathius' Latin is later). He carries the Syriac 'warmed' but drops the hen. The Latin excerpt here spans two columns; the middle (Ps 33:6 on Word and Spirit) is elided in the English.", "slot": false}, {"id": "aug-conf-13-9-10", "short": "Augustine, Conf. XIII", "author": "Augustine", "tradition": "latin", "date": 400, "datelabel": "c. 400", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["love-gift"], "senses": ["literal", "spiritual"], "lemma": {"la": "Cur solus Spiritus sanctus superferebatur super aquas", "en": "Why only the Holy Spirit was borne above the waters"}, "en": "Was not the Father, or the Son, borne above the waters too? If we mean by place, as a body is, then neither was the Holy Spirit; but if we mean the eminence of unchangeable Godhead over everything changeable, then Father and Son and Holy Spirit were borne above the waters. Why then is this said only of your Spirit? Why of him alone? As if there were a place there, where there is no place, for him alone of whom it is said that he is your gift. In your gift we rest; there we enjoy you. Our rest is our place. Love lifts us there, and your good Spirit raises our lowliness from the gates of death. In good will is our peace. A body by its weight strives toward its own place. Weight is not only toward what is lowest, but toward its own place. Fire tends upward, a stone downward. They are driven by their weights; they seek their places.", "translator": "claude-draft-approved", "orig": "Numquid aut Pater aut Filius non superferebatur super aquas? Si tanquam loco sicut corpus, nec Spiritus sanctus: si autem incommutabilis divinitatis eminentia super omne mutabile, et Pater et Filius et Spiritus sanctus superferebatur super aquas. Cur ergo tantum de Spiritu tuo dictum est hoc? cur de illo tantum dictum est? Quasi locus ibi esset, qui non est locus, de quo solo dictum est quod sit donum tuum. In dono tuo requiescimus; ibi te fruimur. Requies nostra, locus noster. Amor illuc attollit nos, et Spiritus tuus bonus exaltat humilitatem nostram de portis mortis (Psal. IX, 15) . In bona voluntate pax nobis est (Luc. II, 14) . Corpus pondere suo nititur ad locum suum. Pondus non ad ima tantum est, sed ad locum suum. Ignis sursum tendit, deorsum lapsis. Ponderibus suis aguntur, loca sua petunt.", "olang": "la", "source": "PL 32, col. 848", "notes": "The question turned inward: not what 'above' means but why the Spirit alone is said to be above. Answer: because the Spirit is gift, and love is weight. 'Pondus meum amor meus' follows a few lines on.", "slot": false}, {"id": "aug-gnl-1-5-11", "short": "aug-gnl-1-5-11", "author": "Augustine", "tradition": "latin", "date": 401, "datelabel": "401–415", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["power-not-place", "love-gift", "trinity"], "senses": ["literal"], "lemma": {"la": "non ex indigentia, sed ex beneficentia veniens amor", "en": "a love that comes not from need but from bounty"}, "en": "Therefore, before it was written 'God said, Let there be light,' Scripture went before it, saying, 'And the Spirit of God was borne above the water.' For whether by the name of water he meant the whole of corporeal matter, so as to intimate by that means whence all the things we can now distinguish in their kinds were made and formed (calling it water because we see everything on earth formed and grown together out of a moist nature through its various species), or a kind of spiritual life, floating as it were before the form of its turning: in either case the Spirit of God was borne above, because whatever it was that he had begun, to be formed and perfected, lay beneath the good will of the Creator; so that when God said in his Word, 'Let there be light,' what was made might abide in his good will, that is in his good pleasure, after the measure of its kind; and so it is right that it pleased God, Scripture saying, 'And light was made; and God saw the light, that it was good.' […] But why, after the creature had first been mentioned, imperfect as it was, is the Spirit of God mentioned afterwards, Scripture first saying 'But the earth was invisible and unordered, and darkness was over the abyss,' and then bringing in 'And the Spirit of God was borne above the water'? Is it because a needy and destitute love so loves that it is subjected to the things it loves; and therefore, when the Spirit of God was mentioned, in whom his holy benevolence and love are understood, he was said to be borne above, lest God should be thought to love the works he was to make out of the necessity of want rather than out of the abundance of bounty?", "translator": "claude-draft-approved", "orig": "Propterea priusquam scriberetur, Dixit Deus, Fiat lux; praecessit Scriptura dicens, Et Spiritus Dei superferebatur super aquam. Quia sive aquae nomine appellare voluit totam corporalem materiam, ut eo modo insinuaret unde facta et formata sint omnia, quae in suis generibus jam dignoscere possumus, appellans aquam, quia ex humida natura videmus omnia in terra per species varias formari atque concrescere; sive spiritualem vitam quamdam ante formam conversionis quasi fluitantem: superferebatur utique Spiritus Dei; quia subjacebat scilicet bonae voluntati Creatoris, quidquid illud erat quod formandum perficiendumque inchoaverat: ut dicente Deo in Verbo suo, Fiat lux; in bona voluntate, hoc est in beneplacito ejus pro modulo sui generis maneret quod factum est; et ideo rectum est, quod placuerit Deo, Scriptura dicente, Et facta est lux; et vidit Deus lucem quia bona est. CAPUT VI.-- Trinitas insinuata cum in inchoatione, tum in perfectione creaturae. 12. Ut quemadmodum in ipso exordio inchoatae creaturae, quae coeli et terrae nomine, propter id quod de illa perficiendum erat, commemorata est, Trinitas insinuatur Creatoris (nam dicente Scriptura, In principio fecit Deus coelum et terram; intelligimus Patrem in Dei nomine, et Filium in principii nomine, qui non Patri, sed per seipsum creatae primitus ac potissimum spirituali creaturae, et consequenter etiam universae creaturae principium est: dicente autem Scriptura, Et Spiritus Dei ferebatur super aquam, completam commemorationem Trinitatis agnoscimus); ita et in conversione atque perfectione creaturae, ut rerum species digerantur, eadem Trinitas insinuetur: Verbum Dei scilicet, et Verbi generator, cum dicitur, Dixit Deus; et sancta bonitas, in qua Deo placet quidquid ei pro suae naturae modulo perfectum placet, cum dicitur, Vidit Deus quia bonum est. CAPUT VII.-- Spiritus Dei cur dictus est superferri super aquam. 13. Sed cur commemorata prius quamvis imperfecta creatura, postea commemoratur Spiritus Dei, prius dicente Scriptura, Terra autem erat invisibilis et incomposita, et tenebrae erant super abyssum ; ac deinde inferente, Et Spiritus Dei superferebatur super aquam? An quoniam egenus atque indigus amor ita diligit, ut rebus quas diligit, subjiciatur; propterea cum commemoraretur Spiritus Dei, in quo sancta ejus benevolentia dilectioque intelligitur, superferri dictus est, ne facienda opera sua per indigentiae necessitatem potius quam per abundantiam beneficentiae Deus amare putaretur?", "olang": "la", "source": "PL 34, col. 250", "notes": "The passage the Glossa quotes in its margin on 1:2 (as 'lib. I de Gen. ad lit., c. 5'). Two answers at once: water is matter or formless spiritual life, and the Spirit is 'above' because divine love is not needy. The middle chapter, which finds the Trinity in the verse, is elided in the English.", "slot": false}, {"id": "bede-gen-1-2", "short": "Bede", "author": "Bede", "tradition": "latin", "date": 720, "datelabel": "c. 720", "place": "Jarrow", "lat": 54.98, "lon": -1.49, "answers": ["trinity"], "senses": ["literal"], "lemma": {"la": "totius simul Trinitatis in creatione mundi virtutem", "en": "the power of the whole Trinity together in the creation of the world"}, "en": "And rightly, having first declared that in the beginning, that is, in the Son, the Father made heaven and earth, he brought in mention of the Holy Spirit too by adding, 'And the Spirit of God was borne above the waters,' so as to signify that the power of the whole Trinity together worked in the creation of the world.", "translator": "claude-draft-approved", "orig": "Bene autem cum in principio Deum, id est, in Filio Patrem fecisse coelum et terram praediceret, etiam sancti Spiritus intulit mentionem addendo: Et Spiritus Dei superferebatur super aquas, ut videlicet totius simul Trinitatis in creatione mundi virtutem cooperatam esse signaret.", "olang": "la", "source": "PL 91, col. 16C", "notes": "Bede has no bird and no Syrian on this verse: his 1:2 is Trinitarian (K3). Included here because Rabanus copies this sentence verbatim and it becomes the Glossa's spine.", "slot": false}, {"id": "comestor-hs-1-1", "short": "comestor-hs-1-1", "author": "Peter Comestor", "tradition": "latin", "date": 1170, "datelabel": "1169–1173", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["read-it-twice", "principio-in-filio", "principio-temporis", "principio-first-of-all"], "senses": ["literal", "allegorical"], "lemma": {"la": "iterandum est in principio", "en": "'in the beginning' is to be repeated"}, "en": "But Moses prophesied God alone to be eternal, and the world created without pre-existing matter. And it was created in the beginning, that is, in the Son; and 'in the beginning' is to be repeated thus: In the beginning God created heaven and earth, in the beginning, namely, of time. For the world and time are coeval. And as God alone is eternal, so the world is everlasting, that is, always eternal, eternal in a temporal way; the angels too are everlasting. Or: in the beginning of all creatures he created heaven and earth, that is, he made these primordial creatures, and made them at once.", "translator": "claude-draft-approved", "orig": "Moyses vero solum Deum aeternum prophetavit, et sine praejacenti materia mundum creatum. Creatus autem est in principio, id est in Filio, et iterandum est in principio sic: In principio creavit Deus coelum et terram, in principio scilicet temporis. Coaeva enim sunt mundus et tempus. Sicut autem solus Deus aeternus, sic mundus sempiternus, id est semper aeternus, temporaliter aeternus angeli quoque sempiterni. Vel in principio omnium creaturarum, creavit coelum et terram, id est has creaturas primordiales fecit, et simul.", "olang": "la", "source": "PL 198, col. 1056A", "notes": "The settlement, stated as a rule of reading: iterandum est in principio — say the phrase twice. Once it means in the Son, once it means at the beginning of time, and Comestor then adds Bruno's third sense as an alternative, in the beginning of all creatures. Augustine had listed the three as questions; the handbook that taught Europe the Bible for three hundred years prints all three as the answer and instructs the reader to take the words over again for each. Note the distinction Comestor needs and that the English must keep: God alone is aeternus, the world and the angels are sempiternus, everlasting — 'eternal in a temporal way'. The preceding columns, where he sets Plato, Aristotle and Epicurus against Moses, are not sliced here; that doxography is Remigius' material and belongs with K4.", "slot": false}, {"id": "glossa-1-2-ruach", "short": "Glossa (slot)", "author": "Glossa ordinaria (school of Laon)", "tradition": "latin", "date": 1120, "datelabel": "compilation 1110–1130", "place": "Laon", "lat": 49.56, "lon": 3.62, "answers": ["power-not-place", "brooding-warmth", "trinity", "heart"], "senses": ["literal", "allegorical"], "lemma": {"la": "Et Spiritus Domini ferebatur super aquas", "en": "And the Spirit of the Lord was borne over the waters"}, "en": "« And the Spirit of the Lord was borne over the waters. » [var: Vulg. Gen. 1:2 *Spiritus Dei*, \"the Spirit of God\"] [n: (AUG., lib. I de Gen. ad lit., c. 5, tom. III.)] Either he called the whole corporeal matter water, that he might intimate whence were made and formed all the things which we see formed on the earth out of a moist nature through divers species; or the spiritual life, as it were floating, before the [0070B] form of its conversion. The Spirit of God was borne above, because that which he had begun to be formed and perfected lay beneath the good will of the Creator. It is also said, « The Spirit of the Lord was borne over the waters. » Lest, by doing works, God should be thought to love through the necessity of want rather than through the abundance of beneficence. For fittingly is something first intimated to have been begun, over which he might be borne: not in place, but by a power surpassing all things.\n\n« And the Spirit of the Lord was borne, » etc. [n: (HIERON. in Gen. t. III, col. 939.)] In the Hebrew it has *merahephet,* that is, it brooded, or cherished, after the manner of a bird warming eggs with the heat of a living thing. We understand therefore that this is not said of the spirit of the world, as many suppose; but of the [0070C] Holy Spirit, who is himself the quickener of all things: and if the quickener, also the founder; if the founder, also God. Psal. CIII: « Send forth, he says, thy Spirit, and they shall be created. » [var: Vulg. Ps. 103:30 *Emittes*, \"Thou shalt send forth\"]\n\n« And the Spirit, » etc. In whom, subsisting, we might rest, quickened by his breath and washed by the wave of baptism. « And the Spirit of the Lord was borne over the waters, » etc. As God, namely, and Creator, he presided over the floating and confused matter, that he might distinguish it when he willed. The whole Trinity therefore is understood to have worked here, God, that is, the Father; the beginning, the Son; the Spirit of God, the Holy Spirit.\n\n« And the Spirit, » etc. [n: (ISID., in Gen.? )] The hearts, namely, that were tossing to and fro, which had lost the quiet of the mind, [0070D] because the Spirit did not rest upon them, but was borne above them: as one able to call back their nature from confusion into something better. Then throughout the whole text of this Scripture we see certain six laborious ages, though distinguished as it were by neighbouring bounds, so that in the seventh rest may be hoped for; and we see that they have a likeness to the six days in which those things were made which Scripture records God to have made. For the first beginning of the human race, in which it began to enjoy this light, is compared to the first day, on which God made light. This age is as it were the infancy of the whole world, which we think of, by the proportion of its greatness, as one man. For man, when he is first born into the light, passes his infancy, the first age, which extends from Adam to Noah in ten generations: the flood is as it were the evening of this [0071A] day, because our infancy is blotted out by the flood of forgetfulness.\n\n[n: (STRAB.)] « Void and empty. » Useless, namely, and unfruitful, and unordered. For all the elements were mingled and confused, and this whole space of air was full of waters; not such as they now are, but they were like thin clouds, such as those above the heavens still are.", "translator": "wilson-pruitt", "orig": "« Et Spiritus Domini ferebatur super aquas. » [n: (AUG., lib. I de Gen. ad lit., c. 5, tom. III.)] Sive totam corporalem materiam aquam appellavit, ut insinuaret unde facta et formata sunt omnia quae ex humida natura per species varias in terra formari videmus; sive spiritualem vitam ante conversionis [0070B] formam quasi fluitantem. Spiritus Dei superferebatur, quia subjacebat bonae voluntati Creatoris, quod formandum et perficiendum inchoaverat. Dictum est etiam « Spiritus Domini ferebatur super aquas. » Ne faciendo opera potius per necessitatem indigentiae quam per abundantiam beneficentiae Deus amare putaretur. Commode enim prius insinuatur aliquid inchoatum, cui superferretur: non loco, sed omnia superante potentia.\n\n« Et Spiritus Domini ferebatur, » etc. [n: (HIERON. in Gen. t. III, col. 939.)] In Hebraeo habet *merahephet,* id est, incubabat, vel fovebat, more volucris ova calore animantis. Intelligimus ergo non de spiritu mundi dici, ut putant multi; sed de Spiritu [0070C] sancto, qui et ipse est omnium vivificator: si autem vivificator, et conditor; si conditor, et Deus. Psal. CIII: « Emitte, ait, Spiritum tuum et creabuntur. »\n\n« Et Spiritus, » etc. In quo subsistentes requiesceremus flatu ejus vivificati, et unda baptismi abluti. « Et Spiritus Domini ferebatur super aquas, » etc. Sicut Deus, scilicet et conditor, praeerat fluitanti et confusae materiei, ut distingueret quando vellet. Tota ergo Trinitas hic operata intelligitur, Deus, Pater scilicet; principium, Filius; Spiritus Dei, Spiritus sanctus.\n\n« Et Spiritus, » etc. [n: (ISID., in Gen.? )] Corda scilicet fluctuantia, quae mentis quietem amiserant, [0070D] quia eis spiritus non innitebatur, sed superferebatur: quasi potens naturam a confusione in melius revocare. Deinde per totum hujus Scripturae textum sex quasdam operosas aetates videmus, licet quasi proximis limitibus distinctas, ut in septima quies speretur; et eas habere similitudinem sex dierum, quibus ea facta sunt, quae Deum fecisse Scriptura commemorat. Primordium enim generis humani, quo ista luce frui coepit, comparatur primo diei quo lucem Deus fecit. Haec aetas tanquam infantia est totius saeculi, quod tanquam unum hominem proportione magnitudinis suae cogitamus. Homo enim cum primo nascitur in lucem, infantiam agit primam aetatem, quae tendit ab Adam usque ad Noe generationibus decem: diluvium quasi vespera hujus [0071A] diei est, quia infantia nostra oblivionis diluvio deletur.\n\n[n: (STRAB.)] « Inanis et vacua. » Inutilis scilicet, et infructuosa, et incomposita. Omnia enim elementa commixta, confusa, et totum hoc aeris spatium aquis plenum; non quales nunc sunt, sed sicut nebulae tenues erant, quales adhuc supercoelestes sunt.", "olang": "la", "source": "PL 113, col. 70A–70D (marginal glosses on 1:2, in the order printed; the 'inanis et vacua' gloss from 69D appended)", "notes": "Four glosses stand on the verse in the margin: Augustine Gn. litt. I.5 (water as matter; love not from need; 'not in place but by a power surpassing all'); Jerome's merahephet, cited by PL column; an unlabelled sentence that is Bede's Trinity gloss via Rabanus ('Tota ergo Trinitas hic operata'); and one Migne marks 'ISID. in Gen.?' (the floating hearts, which is Isidore's moral reading in Augustine's wording). The lemma reads 'Spiritus Domini', the Old Latin, not the Vulgate's 'Spiritus Dei' — Wilson's [var:] flags it. The bird enters the Glossa through Jerome only; the Syrian and the craftsman are both absent.", "slot": false}, {"id": "honorius-hex-1", "short": "Honorius", "author": "Honorius Augustodunensis", "tradition": "latin", "date": 1140, "datelabel": "c. 1140", "place": "Regensburg", "lat": 49.02, "lon": 12.1, "answers": ["brooding-warmth", "trinity"], "senses": ["literal"], "lemma": {"la": "vel aquas fovebat, id est cuncta de aquis procreanda animabat", "en": "or was warming the waters, that is, giving life to all that was to come from them"}, "en": "'And the Spirit of the Lord was borne over the waters,' or 'was warming the waters,' that is, was giving life to all that was to be brought forth from the waters. And note the Trinity: to God the Father is ascribed the creation of the world, to the Son the disposing of things, to the Holy Spirit the quickening, or adorning, of all.", "translator": "claude-draft-approved", "orig": "Et Spiritus Domini ferebatur super aquas, vel aquas fovebat, id est cuncta de aquis procreanda animabat. Et nota Trinitatem. Deo Patri ascribitur mundi creatio, Filio rerum dispositio, Spiritui sancto omnium vivificatio, vel ornatio.", "olang": "la", "source": "PL 172, col. 254C", "notes": "By 1140 'vel aquas fovebat' is offered as a bare variant reading, no Syrian, no bird: the image has become a lemma.", "slot": false}, {"id": "lxx-1-1", "short": "lxx-1-1", "author": "The Seventy", "tradition": "greek-jewish", "date": -250, "datelabel": "c. 250 BCE", "place": "Alexandria", "lat": 31.2, "lon": 29.92, "answers": ["principio-temporis"], "senses": ["translation"], "lemma": {"el": "ἐν ἀρχῇ", "en": "in the beginning"}, "en": "In the beginning God made the heaven and the earth.", "translator": "claude-draft-approved", "orig": "ἐν ἀρχῇ ἐποίησεν ὁ θεὸς τὸν οὐρανὸν καὶ τὴν γῆν.", "olang": "el", "source": "LXX Gen 1:1 (Rahlfs)", "notes": "ἐν ἀρχῇ without an article and without a governing noun: the Greek turns a Hebrew word that may be construct into an adverbial phrase, and in doing so closes off the reading Rashi and Ibn Ezra will call the plain sense. Note also ἐποίησεν, 'made', where the Vulgate will write creavit: the Latin bench's whole argument that creare means to make from nothing has no purchase on the Greek. Every Latin witness here quotes fecit or creavit according to which Latin text is in front of him, and the variation is evidence, not noise.", "slot": false}, {"id": "rupert-gen-1-8", "short": "Rupert", "author": "Rupert of Deutz", "tradition": "latin", "date": 1114, "datelabel": "c. 1114", "place": "Liège", "lat": 50.63, "lon": 5.57, "answers": ["brooding-warmth", "love-gift"], "senses": ["literal", "spiritual"], "lemma": {"la": "melioratur ovum in eo quod calore volucris animatur et pullum producit", "en": "an egg is bettered in that it is quickened by a bird's warmth and brings forth a chick"}, "en": "For next follows the forming or adorning of that same creature, and it receives from the attention of the Spirit of God as great a bettering and as great a supplying of its poverty as, in its own small measure, an egg is bettered in that it is quickened by a bird's warmth and brings forth a chick. And what do we think this spirit is, but the goodness and love of God — a love not of feelings but substantial; love, I say, and life, and living power abiding in the Son and the Father, or proceeding from both, consubstantial with Father and Son.", "translator": "claude-draft-approved", "orig": "Deinceps namque creaturae ejusdem formatio vel exornatio succedit, tantamque ex intentione Spiritus Dei meliorationem et tantum inopiae suae supplementum capit, quantum pro modulo suo melioratur ovum in eo quod calore volucris animatur et pullum producit. Quid autem putamus esse hunc spiritum, nisi bonitatem amoremque Dei, amorem non affectuum, sed substantialem, amorem, inquam, et vitam, virtutemque vivam in Filio et Patre manentem, vel ab utroque procedentem, Patri Filioque consubstantialem.", "olang": "la", "source": "PL 167, col. 205C", "notes": "Rupert has the egg but not the Syrian: the image arrives already naturalized. His 'love' is Confessions XIII.9 turned Trinitarian. Not found by the plan's search; surfaced by grepping the TEI for the bird vocabulary.", "slot": false}, {"id": "targ-neof-1-1", "short": "targ-neof-1-1", "author": "Targum Neofiti", "tradition": "rabbinic", "date": 300, "datelabel": "100–400", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["beginning-is-wisdom"], "senses": ["translation"], "lemma": {"arc": "מלקדמין בחכמה", "en": "from the first, in wisdom"}, "en": "In the beginning and in great wisdom, God created and finished the heavens and the earth.", "translator": "Sefaria Community Translation", "orig": "מלקדמין בחכמה [בחוכמתא] ברא (ד)יי שכלל [ושכלל] ית שמיא וית ארעא:", "olang": "arc", "source": "Targum Neofiti, Gen 1:1 (Vatican, Neofiti 1)", "notes": "The single most consequential word on this crux: Neofiti does not translate bereshit, it interprets it — min qadmin be-ḥokhmah, 'from the first, in wisdom' — and then adds a second verb, shakhlel, 'and finished'. A Palestinian targumist and the Latin fathers reach the same gloss on the same word, 'in Wisdom', and then part company entirely over what Wisdom is: for Bereshit Rabbah it is the Torah, for Augustine and Bede it is the Son. Neither side knows the other is there. The CC0 English prints 'in great wisdom'; there is no word for 'great' in the Aramaic, and the reading בחוכמתא recorded in the manuscript's own margin is simply the emphatic state. Note that this witness and K7's targ-neof-1-2 are two slices of one Sefaria segment: the whole of Gen 1:1–5 comes back as a single block.", "slot": false}, {"id": "targ-onk-1-1", "short": "targ-onk-1-1", "author": "Targum Onkelos", "tradition": "rabbinic", "date": 200, "datelabel": "100–300", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["principio-temporis"], "senses": ["translation"], "lemma": {"arc": "בְּקַדְמִין", "en": "in former times"}, "en": "In the beginning the LORD created the heavens and the earth.", "translator": "claude-draft-approved", "orig": "בְּקַדְמִין בְּרָא יְיָ יָת שְׁמַיָּא וְיָת אַרְעָא", "olang": "arc", "source": "Sefaria, 'Onkelos Genesis'", "notes": "be-qadmin, a plain adverb of time and nothing else: no construct, no wisdom, no first thing. Onkelos hears the verse as the Greek does. Etheridge's Onkelos did not return from Sefaria by version title (see notes/SOURCES-FINDINGS.md) and the Metsudah English is CC BY-NC, so the English is a fresh draft.", "slot": false}, {"id": "targ-psj-1-1", "short": "targ-psj-1-1", "author": "Targum Pseudo-Jonathan", "tradition": "rabbinic", "date": 750, "datelabel": "600–800", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["principio-temporis"], "senses": ["translation"], "lemma": {"arc": "מִן אַוְולָא", "en": "from the first"}, "en": "At the beginning the LORD created the heavens and the earth.", "translator": "J. W. Etheridge, 1862", "orig": "מִן אַוְולָא בְּרָא יְיָ יַת שְׁמַיָא וְיַת אַרְעָא", "olang": "arc", "source": "Sefaria, 'Targum Jonathan on Genesis'", "notes": "A third Aramaic word for the same Hebrew one: min avvela, 'from the first'. Etheridge prints the Aramaic in transliteration inside his English ('At the beginning (min avella)'), which is why his sentence carries a gloss no other version has; the parenthesis is his.", "slot": false}, {"id": "vulgate-1-1", "short": "vulgate-1-1", "author": "Jerome", "tradition": "latin", "date": 392, "datelabel": "c. 392", "place": "Bethlehem", "lat": 31.7, "lon": 35.2, "answers": ["principio-temporis"], "senses": ["translation"], "lemma": {"la": "In principio", "en": "In the beginning"}, "en": "In the beginning God created the heaven and the earth.", "translator": "claude-draft-approved", "orig": "In principio creavit Deus coelum et terram.", "olang": "la", "source": "PL 28, col. 163C", "notes": "Jerome translates in principio and not in Filio, and in the Hebrew Questions he says in so many words why: the reading 'in the Son' is false as a translation, however true as a sense. But he also writes creavit where the Old Latin his own contemporaries quote has fecit — Augustine, Ambrose, Bede and the Glossa all argue from fecit — so the Latin bench spends seven centuries reasoning about a verse in two versions at once.", "slot": false}], "threads": [{"id": "t-k3-01", "from": "abelard-hex-1-1-eloim", "to": "br-1-7", "type": "parallel", "evidence": "The star thread of the site. Both ask why the plural noun Elohim takes a singular verb, in the same words. R. Yitzḥak: 'bereshit bare'u Elohim is not written here, but bara Elohim' — and therefore no creature can say that two authorities created the world. Abelard: 'unde autem dictum est Eloim creavit, non creaverunt? ut videlicet ad plurale nomen singulare verbum referretur; quatenus insinuaretur in tribus illis personis non tres creatores, sed unum tantum debere intelligi.' One grammatical fact, seven hundred years apart, no contact, and the same conclusion drawn about the verb — one creator — from opposite conclusions about the noun.", "crux": "elohim-and-trinity"}, {"id": "t-k3-02", "from": "ibn-ezra-1-1-elohim", "to": "abelard-hex-1-1-eloim", "type": "contests", "evidence": "The same question and the opposite answer, twenty years apart and with no possible contact. Abelard: Eloim is plural, showing a plurality of divine persons, each of which is God, and the singular verb shows they are one creator. Ibn Ezra: Elohim is the plural of eloah, and the plural is how the Holy Tongue speaks of the great — as adonim and be'alim are plural for one master, and as a king in Arabic speaks of himself in the plural — 'and for this reason Scripture says bara and not bare'u.' Each has the whole of the other's evidence and takes the plural to mean the opposite thing.", "crux": "elohim-and-trinity"}, {"id": "t-k3-03", "from": "ibn-ezra-1-1-elohim", "to": "br-1-7", "type": "echoes", "evidence": "Ibn Ezra's closing clause is Bereshit Rabbah's argument reduced to a grammarian's note: 'for this reason Scripture says bara and not bare'u.' What the midrash offers as a refutation of two authorities, he offers as the expected concord of an honorific plural — the same reading with the polemic taken out and a comparative philology of Arabic, Hebrew and the vernaculars put in.", "crux": "elohim-and-trinity"}, {"id": "t-k3-04", "from": "ramban-1-1-elohim", "to": "ibn-ezra-1-1-elohim", "type": "contests", "evidence": "Ramban has Ibn Ezra open in front of him throughout the comment on this verse and takes the plural the other way: not an honorific but a compound, el hem, the force and 'they' — all the other forces — so that Elohim is the force of all forces. He does not deny the grammar; he refuses to let the plural be empty. 'A secret will yet be disclosed in connection with this' says that the real answer is one he will not print.", "crux": "elohim-and-trinity"}, {"id": "t-k3-05", "from": "ramban-1-1-elohim", "to": "abelard-hex-1-1-eloim", "type": "parallel", "evidence": "The two witnesses on this daf who make the plurality of the noun a plurality in God, and they could not be further apart on what it is. Abelard: a diversity of persons, of which each one is God, and the doctrine is preachable and technical — opera Trinitatis indivisa. Ramban: the master of all the forces, and a secret that will be disclosed elsewhere. A century apart, in Paris and in Girona, with nothing between them but the same three consonants.", "crux": "elohim-and-trinity"}, {"id": "t-k3-06", "from": "b-meg-9a", "to": "br-1-7", "type": "echoes", "evidence": "The same anxiety twice, once as exegesis and once as translation history. R. Yitzḥak proves from the singular verbs that no one can say two authorities created the world; the elders before Ptolemy move the divine name to the front of the sentence — 'God created in the beginning' — so that bereshit cannot be read as the subject of bara, that is, as a power that made God. Both are defending the first verse against a reading that finds more than one maker in it.", "crux": "elohim-and-trinity"}, {"id": "t-k3-07", "from": "b-meg-9a", "to": "br-1-12", "type": "contests", "evidence": "The elders reverse the word order that R. Yudan and Ben Azzai explain and praise. For the Bavli's baraita the sequence bereshit bara … Elohim is a danger to be removed for a Greek reader; for Bereshit Rabbah it is the Holy One's modesty — a mortal king proclaims his name and produces his works afterwards, but God acted first and was named after. The same three words are a liability in Alexandria and a virtue in Caesarea.", "crux": "elohim-and-trinity"}, {"id": "t-k3-08", "from": "b-meg-9a", "to": "abelard-hex-1-1-el
