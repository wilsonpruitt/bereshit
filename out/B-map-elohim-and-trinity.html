oim", "type": "parallel", "evidence": "The baraita reports the elders removing from the Greek exactly the two features the Latin bench builds on, and neither removal reached the Church. The first item on their list is the word order of Gen 1:1; the second is the plural of Gen 1:26 turned singular. The Septuagint as transmitted has neither change. Abelard's argument needs the plural noun standing next to a singular verb in the first verse, which is what the elders are said to have rearranged, and Bruno's needs the 'let us make' of Gen 1:26, which is what they are said to have made singular.", "crux": "elohim-and-trinity"}, {"id": "t-k3-09", "from": "bruno-gen-1-1c", "to": "br-1-7", "type": "parallel", "evidence": "Both refuse a plurality of creators in the same words and against different opponents. R. Yitzḥak: no creature can say that two authorities created the world. Bruno: was he speaking to the angels? God forbid — for otherwise there would be not one creator but many, whereas God alone is the creator of all. The premise is shared exactly; what Bruno does next with it, and the midrash cannot, is find the second and third persons in the same verses.", "crux": "elohim-and-trinity"}, {"id": "t-k3-10", "from": "bruno-gen-1-1c", "to": "aug-conf-13-5", "type": "echoes", "evidence": "'Habes ergo Deum, id est Patrem; habes et principium, id est Filium … Habes igitur et Spiritum sanctum' is Augustine's three-term reading turned into a schoolroom enumeration, with the same John 8:25 for the Son and the same Spirit of v. 2 for the third. What Augustine reached at the end of a search and called a riddle, Bruno hands over in three sentences as something the reader can check.", "crux": "elohim-and-trinity"}, {"id": "t-k3-11", "from": "aug-conf-13-5", "to": "aug-gnl-1-5-11", "type": "echoes", "evidence": "The same triad in the same order in two works: the Father in the name of God, the Son in the name of the Beginning, the Spirit borne over the waters, which De Genesi ad litteram calls the completa commemoratio Trinitatis. What the Confessions add is the sequence of the search — he held two, he already believed the third, and he went looking for it in the text.", "crux": "elohim-and-trinity"}, {"id": "t-k3-12", "from": "aug-gnl-imp-1-2", "to": "aug-conf-13-5", "type": "contests", "evidence": "Augustine on both sides of the question this crux really turns on. In the unfinished commentary the catholic faith is set out before the exposition begins, expressly because heretics drag Scripture to their own opinion, so that the Trinity is the rule the chapter will be read under. In the Confessions the Trinity 'appears to me in a riddle' out of the first words. The two are not incompatible and he never reconciles them, and every later Latin witness on this daf writes as though only the second were true.", "crux": "elohim-and-trinity"}, {"id": "t-k3-13", "from": "basil-hex-2-6b", "to": "ambrose-hex-1-8-29", "type": "transmits", "evidence": "Ambrose is reading Basil at Milan and makes the same choice between the same two readings: either the spirit of v. 2 is the air, or it is the Holy Spirit — 'but we, agreeing with the judgement of the saints and the faithful, take it as the Holy Spirit, so that the working of the Trinity may shine out in the constitution of the world.' Basil's reason is that Scripture reserved the name; Ambrose's is that the third person is needed to complete the triad the first verse began.", "crux": "elohim-and-trinity"}, {"id": "t-k3-14", "from": "basil-hex-2-6b", "to": "bede-gen-1-2", "type": "parallel", "evidence": "Expletor and the same argument from the shape of the sentence, three centuries and a language apart: Basil, that no other spirit is meant but the Holy, who is the completer of the venerable Trinity; Bede, that having first declared that in the beginning, that is in the Son, the Father made heaven and earth, Scripture brought in mention of the Holy Spirit too, so as to signify the power of the whole Trinity together in the creation of the world.", "crux": "elohim-and-trinity"}, {"id": "t-k3-15", "from": "aug-conf-13-5", "to": "bede-gen-1-2", "type": "cites", "evidence": "Bede's sentence is Augustine's triad with the two halves welded: 'in principio, id est in Filio, Pater fecit coelum et terram' and then the Spirit added 'ut totius simul Trinitatis in creatione mundi virtutem significaret'. The riddle has become a demonstration, and the word aenigma is gone.", "crux": "elohim-and-trinity"}, {"id": "t-k3-16", "from": "wigbod-gen-1-1d", "to": "aug-conf-13-5", "type": "echoes", "evidence": "'In principio sibi coaeterno fecit Deus coelum et terram, in unigenito Filio qui est sapientia Patris' is Augustine's 'in Principio sapientiae nostrae quod est tua Sapientia de te nata, aequalis tibi et coaeterna, id est in Filio tuo' with the possessives dropped and 1 Cor 1:24 put in for the identification. The Carolingian dialogue asked a question about time and was answered with a person.", "crux": "elohim-and-trinity"}, {"id": "t-k3-17", "from": "remigius-gen-1-1c", "to": "wigbod-gen-1-1d", "type": "echoes", "evidence": "The same identification with the same proof text, and Remigius adds the guard the dialogue does not have: God the Father too is a beginning, but not from a beginning, since he is begotten of none. Once 'in the beginning' names the Son because the Son is a principium, the word will fit the Father as well, and only Remigius notices.", "crux": "elohim-and-trinity"}, {"id": "t-k3-18", "from": "remigius-gen-1-1c", "to": "br-1-12", "type": "parallel", "evidence": "Both benches ask what may properly be predicated of the creator and answer it out of the first verse's word order. R. Yudan in the name of Akilas: to this one it is fitting to call God — because he acted first and was named afterwards, unlike a king acclaimed before he has built anything. Remigius: the Father is a beginning, but not from a beginning. The rabbinic argument is about the order of the words in the sentence and the Latin about the order of the persons in God, and both are reading the same three words.", "crux": "elohim-and-trinity"}, {"id": "t-k3-19", "from": "rupert-gen-1-3-trinitas", "to": "aug-gnl-1-5-11", "type": "contests", "evidence": "Rupert builds his whole Hexaemeron on the reading Augustine considered and refused. Augustine asks whether the Trinity is to be understood in 'God said, let it be — and God made — and God saw that it was good', and answers that it does not befit the unity of the Trinity for the Son to be understood as making under orders and the Spirit as freely approving. Rupert takes the threefold formula as the Trinity's signature everywhere in the six days, and escapes the objection by making the three words a testimony rather than three offices.", "crux": "elohim-and-trinity"}, {"id": "t-k3-20", "from": "rupert-gen-1-3-trinitas", "to": "rupert-gen-1-8", "type": "echoes", "evidence": "One design stated twice. At Gen 1:2 the Spirit's brooding is what betters the creature as a bird's warmth betters an egg; here the threefold formula of every day's work is the trace of the creating Trinity, tied to the law of three witnesses. Both are claims about how the chapter was written, not about what happened in it.", "crux": "elohim-and-trinity"}, {"id": "t-k3-21", "from": "honorius-hex-1", "to": "aug-conf-13-5", "type": "echoes", "evidence": "Honorius states the triad and then does something Augustine does not: he distributes the works. 'Note the Trinity: to God the Father is ascribed the creation of the world, to the Son the disposition of things, to the Holy Spirit the quickening or adorning of all.' That is the appropriation doctrine of the twelfth-century schools laid over the first two verses, and it is the distribution of labour Augustine had warned against.", "crux": "elohim-and-trinity"}, {"id": "t-k3-22", "from": "glossa-1-2-ruach", "to": "aug-gnl-1-5-11", "type": "cites", "evidence": "The standard gloss on the Spirit clause is Augustine's De Genesi ad litteram I.5 printed under his name, so that what the twelfth-century schoolroom reads on Gen 1:2 is the third term of Augustine's triad in Augustine's own words — the Spirit borne over the waters not by place but as the will of a craftsman is over what he makes, a love that comes not from need but from bounty.", "crux": "elohim-and-trinity"}, {"id": "t-k3-23", "from": "abelard-hex-1-1-eloim", "to": "aug-gnl-1-5-11", "type": "cites", "evidence": "Abelard names Augustine for the procession — 'the person of the Holy Spirit and of the Father, from whom that Spirit principally proceeds, as blessed Augustine records' — and gets the first half of his Trinity the Augustinian way, out of the sequence of the verses: the Spirit from 'the Spirit of the Lord', the Word from 'God said'. Only then does he turn to the Hebrew noun, which Augustine did not have and could not have used.", "crux": "elohim-and-trinity"}, {"id": "t-k3-24", "from": "bruno-gen-1-1c", "to": "remigius-gen-1-1c", "type": "echoes", "evidence": "The same identification of the Son with the principium of Gen 1:1 from the same verse of John — 'ego principium qui et loquor vobis' — in Auxerre about 890 and at Segni about 1090. It is the most stable single move on the Latin bench and it is what makes the three-term reading possible at all: without a person in the second word there is no triad to complete.", "crux": "elohim-and-trinity"}, {"id": "t-k3-25", "from": "aug-gnl-imp-1-2", "to": "br-1-7", "type": "parallel", "evidence": "Both texts open their treatment of Genesis by fencing it against a dualism, and both do it before expounding a word. Augustine sets out the catholic faith first, because many heretics drag the Scriptures to their own opinion, and ends by ruling that nothing in the creature belongs to the Trinity except that the Trinity made it. R. Yitzḥak rules that no creature can say that two authorities created the world. The heresies are not the same and the manoeuvre is identical: the first verse is made to exclude a second maker before it is made to say anything else.", "crux": "elohim-and-trinity"}, {"id": "t-k3-x1", "from": "comestor-hs-1-1", "to": "aug-conf-13-5", "type": "echoes", "evidence": "Phase 4. 'Creatus autem est in principio, id est in Filio' is Augustine's second term reduced to an apposition and taught as settled — the riddle of Confessions XIII.5 become a gloss a reader passes over. Written at Phase 4 because `comestor-hs-1-1` was built for K1 and its opening clause belongs to this crux.", "crux": "elohim-and-trinity"}, {"id": "t-k3-x2", "from": "b-meg-9a", "to": "lxx-1-1", "type": "contests", "evidence": "Phase 4. The baraita says the seventy-two elders wrote 'God created in the beginning' for Ptolemy, moving the divine name to the front so that bereshit could not be read as a subject. The Septuagint as transmitted has not moved it: en archē epoiēsen ho theos keeps the Hebrew order. The change the rabbinic bench remembers making is not in the Greek the Church inherited, and the Latin reading of the verse stands in the space it would have closed.", "crux": "elohim-and-trinity"}, {"id": "t-k3-x3", "from": "targ-onk-1-1", "to": "br-1-7", "type": "parallel", "evidence": "Phase 4. The targum removes the difficulty the midrash has to argue about. Where the Hebrew has the plural-looking Elohim with a singular verb, Onkelos writes YY — the Tetragrammaton, which is not plural in form — so that no reader of the Aramaic could raise the question of two authorities at all. R. Yitzḥak has to answer it three times from the verbs.", "crux": "elohim-and-trinity"}], "answers": {"borne-over": {"label": "Borne over", "gloss": "The verb is motion: a spirit carried above the water (LXX ἐπεφέρετο, Vulgate ferebatur)."}, "wind": {"label": "A wind", "gloss": "Ruach is weather, not a person; Onkelos keeps God at a remove."}, "spirit-of-mercy": {"label": "Spirit of mercy", "gloss": "A divine disposition blowing over the waters (Palestinian targums)."}, "messiah": {"label": "Spirit of the Messiah", "gloss": "Resh Lakish: the ruach of Isa 11:2, brought by repentance-as-water."}, "bird-hovering": {"label": "Dove hovering, not touching", "gloss": "Ben Zoma and Rashi: the bird measures a gap; it does not land."}, "fluttering": {"label": "Fluttering", "gloss": "Abelard's report of the Hebrew: volitabat, as the eagle of Deut 32:11."}, "brooding-warmth": {"label": "Bird brooding, warming", "gloss": "Jerome from the Hebrew, Basil's Syrian, then the Latin schools: the Spirit quickens matter like a hen on eggs."}, "power-not-place": {"label": "Power, not place", "gloss": "Augustine: 'above' means sovereignty, not position; the Manichees misread it."}, "craftsman": {"label": "The craftsman's will", "gloss": "The Spirit over the waters as the maker's intention over the wood."}, "love-gift": {"label": "Love, gift, weight", "gloss": "Confessions XIII: why the Spirit alone is said to be above; pondus meum amor meus."}, "trinity": {"label": "The Trinity named", "gloss": "The verse completes Father (in principio), Son (principium), Spirit."}, "heart": {"label": "Over the heart", "gloss": "Isidore's moral reading: the waters are our fluid, dark heart."}, "throne": {"label": "Throne of Glory", "gloss": "Rashi: the throne stands in the air, held by the breath of God's mouth."}, "unus-cardinal": {"label": "The versions keep the cardinal", "gloss": "ἡμέρα μία, dies unus, yoma chad: 'one', not 'first', in every ancient version."}, "unus-grammatical": {"label": "'First' needs a second", "gloss": "The series 'one, second, third' is improper (Bereshit Rabbah); or, first and second are relatives and there was no second yet (Bruno)."}, "unus-alone": {"label": "God was alone that day", "gloss": "Yachid in his world: no angels were made on the first day, so there was no second anything (Bereshit Rabbah, Rashi)."}, "unus-yom-kippur": {"label": "The one day given to Israel", "gloss": "'One day' is the Day of Atonement, the day the Holy One gave them."}, "unus-24-hours": {"label": "One circuit, twenty-four hours", "gloss": "Day and night together make one revolution, and the whole is named from the day alone."}, "unus-repeated": {"label": "The same day repeated", "gloss": "There is one day only — the angelic light — presented once for each kind of thing made (Augustine)."}, "unus-all-time": {"label": "One day = all time", "gloss": "The word holds the whole span of the ages, or the whole work of the six days (Augustine's set-aside reading; Abelard's own)."}, "unus-angelic-unity": {"label": "The unity of angelic dignity", "gloss": "'One' names the undivided attention of the angelic mind, not a place in a series (Angelomus)."}, "unus-eternal-day": {"label": "The true first day is eternal", "gloss": "This day is first only by number and order of creation; the day that is first by nature is uncreated light (Rupert)."}, "day-precedes-night": {"label": "Day before night", "gloss": "Evening is the end of a finished day, morning the end of the night; days are counted from morning to morning."}, "day-follows-night": {"label": "Night before day", "gloss": "'One day' rules that reckoning begins at evening (Ben Zoma, b. Chullin 83a)."}, "night-for-rest": {"label": "Night made for rest", "gloss": "Day is for labour and night for rest, so only the day's bounds are counted."}, "day-is-a-measure": {"label": "The day's measure is a creature", "gloss": "The measure of day and of night was itself made on day one (b. Chagigah 12a)."}, "evening-is-completion": {"label": "Evening completes a work", "gloss": "Vespera is a work perfected, mane the beginning of the next — the Carolingian formula."}, "evening-is-self-knowledge": {"label": "Evening and morning knowledge", "gloss": "The creature known in itself is evening; known in the Word and referred back in praise, morning (Augustine)."}, "evening-moral": {"label": "Evening as sin or temptation", "gloss": "Evening and morning are the deeds of the wicked and the righteous, or sin and renewal, or temptation and the light of justice."}, "simul": {"label": "All things made at once", "gloss": "Creavit omnia simul (Sir 18:1): the days are not successive."}, "six-days-literal": {"label": "Six real days", "gloss": "Created at once in matter, distinguished in form through six successive days (the common doctors, Bonaventure)."}, "principio-temporis": {"label": "In the beginning of time", "gloss": "The word dates the making: time began with the world, and there was no before (Onkelos, Bede, Rabanus, Remigius, Hugh)."}, "principio-in-filio": {"label": "In the Son", "gloss": "Principium is a proper name of the Word, on the strength of John 8:25 and Ps 104:24 (Ambrose, Augustine, Isidore, Alcuin, the Glossa, Rupert, Honorius)."}, "principio-first-of-all": {"label": "First of all things", "gloss": "'In the beginning' means before everything else that follows — in the beginning of the creatures, or on the first day (Augustine's second reading; Bruno, Abelard)."}, "principio-is-first-creature": {"label": "The first creature is a beginning", "gloss": "The first intellectual creature may be called a beginning to the things it heads (Augustine, De Genesi imperfectus)."}, "beginning-is-wisdom": {"label": "In Wisdom", "gloss": "The beginning is Wisdom — which is the Torah on one bench (Prov 8:22, Prov 3:19, Neofiti) and the Son on the other (Ps 104:24)."}, "reshit-is-torah": {"label": "The beginning is the Torah", "gloss": "Reshit is the Torah, called reshit darko: God looked into it as an architect into his plans and created the world (Bereshit Rabbah, Rashi)."}, "reshit-is-israel": {"label": "For the sake of Israel", "gloss": "Reshit is Israel, called reshit tevu'ato (Jer 2:3); the world was made for their sake."}, "reshit-construct": {"label": "'When God began to create'", "gloss": "Bereshit is a construct and the verse a subordinate clause: at the beginning of God's creating (Rashi's plain sense, Ibn Ezra; contested by Ramban)."}, "world-has-a-beginning": {"label": "The world is not eternal", "gloss": "The point of saying 'in the beginning' at all is that the world had one, against the philosophers (Ambrose, Remigius, Hugh, Ramban)."}, "bereshit-book-name": {"label": "It is the book's name", "gloss": "The Hebrews name volumes from their opening words, so bresith is the title of Genesis (Jerome, Wigbod, Angelomus)."}, "six-preceded": {"label": "Six things preceded the world", "gloss": "Torah and the Throne of Glory were made before it; the patriarchs, Israel, the Temple and the Messiah's name were contemplated (Bereshit Rabbah 1:4)."}, "read-it-twice": {"label": "Say the phrase twice", "gloss": "In principio is to be repeated — once in the Son, once at the beginning of time — rather than decided (Comestor)."}, "lux-corporalis": {"label": "A bodily light", "gloss": "A material light made to light material things, standing in the sun's place until the fourth day (Basil, Ambrose, Bede, Hugh, Honorius, Comestor, Bonaventure)."}, "lux-angelica": {"label": "The angelic creation", "gloss": "The light is the spiritual creature called 'heaven' in v. 1, made light by turning to its Creator (Augustine, Angelomus, Rupert)."}, "lux-hidden": {"label": "Stored for the righteous", "gloss": "Too good for the wicked, it was hidden away and is kept for the righteous in the time to come (Bereshit Rabbah, b. Chagigah, Rashi)."}, "lux-garment": {"label": "From the light of his garment", "gloss": "God wrapped himself in it like a garment (Ps 104:2); the heavens were stretched out of it (Bereshit Rabbah, Pirkei de-Rabbi Eliezer)."}, "lux-from-temple": {"label": "From the site of the Temple", "gloss": "The light was created from the place of the sanctuary (Ezek 43:2; Jer 17:12)."}, "lux-becomes-luminaries": {"label": "The luminaries were made from it", "gloss": "The nature of light was made on day one and hung in the firmament on day four (the sages in b. Chagigah 12a; an unnamed opinion in Augustine)."}, "lux-twilight": {"label": "A light like the dawn", "gloss": "Not the sun's brightness but what the sky is before sunrise or after sunset (Remigius, Honorius, Comestor, Hugh)."}, "lux-is-day": {"label": "'Light' just means day", "gloss": "The verse answers itself: he called the light Day, so light here is put for day (Bruno)."}, "lux-is-distinction": {"label": "The distinguishing of the works", "gloss": "The light is the confused heap becoming distinct and knowable, not a thing at all (Abelard)."}, "fiat-is-instantaneous": {"label": "Speaking is making", "gloss": "No interval between the command and the thing: the Hebrew says only 'let it be, and it was' (Ambrose, Basil, Angelomus, Abelard)."}, "pair-is-formless-matter": {"label": "Unformed matter", "gloss": "The pair names the matter God had made and not yet given form to (Augustine, Angelomus, Hugh, Comestor)."}, "pair-is-under-water": {"label": "Hidden under the waters", "gloss": "Invisible because the waters covered it, and because there was neither light nor anyone to see (Basil, Alcuin, Angelomus, Ibn Ezra)."}, "pair-is-unfurnished": {"label": "No seed, no living thing", "gloss": "Empty of shoots and void of animals: a list of what was not there yet (Bede, Remigius, Rupert, Abelard, Hugh, Comestor, the targums)."}, "pair-is-a-name-for-us": {"label": "A name fitted to slow minds", "gloss": "Not a description but the most serviceable word for formlessness, since earth and the deep are the least comely things men know (Augustine, Confessions XII)."}, "pair-many-senses": {"label": "More than one true reading", "gloss": "Five readings of the clause are all true and none can be shown to be Moses' own (Augustine, Confessions XII.21)."}, "pair-is-two-things": {"label": "A green line and slimy stones", "gloss": "Tohu and bohu are two creatures made on the first day: a line encircling the world, and stones sunk in the deep (b. Chagigah 12a, Sefer Yetzirah)."}, "pair-is-matter-and-form": {"label": "Matter and its form", "gloss": "Tohu is the hyle, which can hold no name; bohu is bo hu, the form it puts on (Ramban)."}, "pair-is-astonishment": {"label": "Astonishment", "gloss": "Tohu is what astonishes whoever looks at it — the earth bewildered at her lot, or the reader appalled at the emptiness (Bereshit Rabbah 2:2, Rashi, the Bahir)."}, "pair-is-history": {"label": "The verse tells history", "gloss": "The clause is the first term of a periodization: the generations from Adam, the four kingdoms, or the Church before her children (Bereshit Rabbah 2:1, 2:3, 2:4; Bruno)."}, "pair-is-our-flesh": {"label": "The earth of our flesh", "gloss": "The soul before it has taken the form of doctrine (Isidore, Wigbod, Rabanus, Remigius, Bruno)."}, "pair-is-not-of-heaven": {"label": "Said of earth, not of heaven", "gloss": "The phrase is withheld from heaven, which was filled with angels as soon as it was made (Bede, the Glossa, Angelomus, Abelard)."}, "heaven-first": {"label": "Heaven first", "gloss": "Beit Shammai: the word order is the order of the acts, and a king has his throne made before its footstool (Isa 66:1)."}, "earth-first": {"label": "Earth first", "gloss": "Beit Hillel: a builder raises the lower storey first (Amos 9:6), and Gen 2:4 and Ps 102:26 name the earth before the heavens."}, "both-at-once": {"label": "Both together", "gloss": "The sages, and R. Shimon ben Yoḥai's stewpot and its lid (Isa 48:13); Ambrose, that the order of naming gives heaven no privilege of the firstborn."}, "order-of-dignity": {"label": "Named for dignity, not order", "gloss": "Heaven stands first because it is worthier, or because the account is about to turn to the earth (Hugh of St Victor; R. Yoḥanan's creation-and-completion)."}, "created-then-stretched": {"label": "Created in one order, stretched in the other", "gloss": "Resh Lakish: heaven was created first, the earth was stretched out first — so both proof-texts stand."}, "heaven-earth-is-everything": {"label": "A name for the whole creation", "gloss": "Two visible words standing for all that God made, given so for the weakness of little ones (Augustine, Alcuin, Angelomus, Comestor)."}, "heaven-is-empyrean": {"label": "The empyrean heaven", "gloss": "Not the visible firmament but a fiery — from brightness, not heat — and intellectual heaven, filled with angels as soon as it was made (Remigius, the Glossa, Comestor)."}, "heaven-earth-four-elements": {"label": "The four elements", "gloss": "Heaven names fire and air, earth names earth and water; the verse announces the material first principles of bodies (Ambrose, Abelard, Ramban, Comestor)."}, "et-includes": {"label": "The particle includes", "gloss": "Et ha-shamayim brings in the sun, moon and constellations; ve-et ha-aretz the trees, the plants and the Garden of Eden (Bereshit Rabbah 1:14, b. Chagigah 12a, Ramban)."}, "shamayim-is-water": {"label": "Sham mayim — 'there is water'", "gloss": "The name itself says what heaven is made of: water, or fire and water mingled into the firmament (b. Chagigah 12a)."}, "one-earth-only": {"label": "One earth, and no heaven of heavens here", "gloss": "If the heavens of v. 1 were the intelligible heaven, the earth beside it could not be the ground; the seven earths are seven regions of the one (Ibn Ezra; Abelard, from the other end)."}, "whole-then-parts": {"label": "The whole first, then the parts", "gloss": "V. 1 is a heading: Scripture commends everything God made in two words before going through it with 'God said' (Augustine, Angelomus, the Glossa)."}, "de-nihilo": {"label": "Out of nothing", "gloss": "God made the world, and the matter of the world, from nothing whatever."}, "matter-then-formed": {"label": "Matter first, then formed", "gloss": "Formless matter was created first — first in origin, not in time — and everything else made out of it."}, "matter-is-coeval": {"label": "Matter was already there", "gloss": "God is a craftsman working on a material he did not make. Reported on both benches, held by neither."}, "three-principles": {"label": "God, exemplar, matter", "gloss": "The philosophers' three principles without a principle, named as the position to be refuted."}, "all-of-them-created": {"label": "Of every one of them, creation is written", "gloss": "Each thing the objector calls a pre-existing material has its own verse saying God created it."}, "bara-is-not-ex-nihilo": {"label": "'Created' does not mean from nothing", "gloss": "The verb bara is used of the sea-creatures and of man, who were made from something."}, "creare-vs-formare": {"label": "Created, not formed", "gloss": "Scripture keeps two verbs apart: what has no pre-existing matter is created, what is shaped out of matter is formed."}, "hyle-is-tohu": {"label": "The hyle is tohu", "gloss": "The one created thing is a substance without form, which the Greeks call hyle and Scripture calls tohu."}, "made-from-something-of-god": {"label": "From the light and the snow", "gloss": "Heaven from the light of his garment, earth from the snow beneath the Throne of Glory."}, "craftsman-needs-matter": {"label": "A craftsman needs a material", "gloss": "Wood helps the carpenter, silver the silversmith — the analogy that makes creation from nothing unthinkable."}, "silence-proves-nothing": {"label": "Scripture's silence proves nothing", "gloss": "That Genesis does not say when a thing was made does not make it coeternal with God."}, "world-from-tohu": {"label": "The world was made out of tohu va-vohu", "gloss": "Said with embarrassment, and only because the verse says it."}, "tenebrae-privatio": {"label": "Darkness is not a thing", "gloss": "Darkness is the absence of light, as silence is the ceasing of voice and nakedness the absence of a garment; Scripture never says God made it (Augustine, Angelomus, Hugh)."}, "tenebrae-creatura": {"label": "God made the darkness too", "gloss": "The darkness is a work of God like the light — it is called with the light to bless the Lord in Dan 3, and it is on the rabbinic lists of what was made on the first day (Remigius, the Glossa, Wigbod's pupil; Pirkei de-Rabbi Eliezer, R. Tanḥuma)."}, "tenebrae-angeli": {"label": "The darkness is the apostate angels", "gloss": "The light of day one is the angelic creation and the division is between the holy angels and the unclean (Augustine, City of God XI.19; Angelomus, Hugh, Rupert, Comestor)."}, "tenebrae-peccatores": {"label": "The wicked, or their deeds", "gloss": "The division is moral: the just from sinners (Isidore, Remigius, the Glossa), or the deeds of the righteous from the deeds of the wicked (R. Yanai, R. Abahu)."}, "tenebrae-ignis": {"label": "Darkness names the element of fire", "gloss": "'Darkness' in v. 2 is elemental fire, which is dark; the deep is water and the spirit is air (Ramban)."}, "divisio-loci": {"label": "Divided by place and quality", "gloss": "The two were set apart in space and time — light over the upper part of the world, twelve hours above and twelve below, opposite hemispheres in turn (Basil, Bede, Rabanus, Honorius, Comestor; and R. Yoḥanan's two generals, each given his bound)."}, "divisio-nominis": {"label": "The dividing is the naming", "gloss": "There is no separate act of separation: 'and he divided' means by the calling of names (Ibn Ezra; entertained once by Augustine and dropped)."}, "divisio-est-ordinatio": {"label": "He did not make it but ordered it", "gloss": "God makes the forms and orders the privations, as a singer orders his rests and a painter his shadows, so that even a nothing has its place (Augustine)."}, "divisio-est-judicium": {"label": "The division is a judgement", "gloss": "A sentence passed, and irreversible: on the devil and his angels (Rupert, Hugh), or on the just and sinners by foreknowledge (Isidore)."}, "divisio-est-instantanea": {"label": "The division needed no second act", "gloss": "The two were never mixed: by the very fact that light was made, the division followed, as putting on a garment ends nakedness (Augustine, Hugh)."}, "formatum-ab-informi": {"label": "The formed from the unformed", "gloss": "The dividing is the distinction of the formed thing from the unformed, of the perfect from the imperfect and the distinct from the confused (Wigbod, Abelard, Honorius)."}, "bonum-approbatio": {"label": "'He saw' is approval, not discovery", "gloss": "God did not learn that the light was good: what pleased him to be made pleased him to remain (Alcuin, Comestor), or the seeing is in the thought (Ibn Ezra), or a good work attests itself when seen (Ambrose)."}, "bonum-withheld": {"label": "The approval is deliberately withheld", "gloss": "'It was good' is not repeated after the division, and the divine name is dropped from the naming of the night, so that the darkness should not be approved along with the light (Augustine, Wigbod; R. Elazar, R. Abahu)."}, "havdala-derived": {"label": "The verse is the source of the havdala rule", "gloss": "'He saw … and he divided' — one does not bless over the lamp until he has used its light (R. Ze'eira of Caesarea)."}, "lux-hivdil-set-aside": {"label": "He set the light aside", "gloss": "Va-yavdel means he separated it off — for himself (R. Yehuda bar Simon), or for the righteous in the time to come, like a king setting aside a fine portion for his son (the Rabbis)."}, "one-authority-singular-verb": {"label": "The verb is singular, so one maker", "gloss": "Not vaydaberu but vaydaber, not bare'u but bara — no one may say that two authorities created the world (Bereshit Rabbah 1:7; Ibn Ezra; and, to the opposite end, Abelard)."}, "elohim-is-plural-of-persons": {"label": "Eloim is plural: three persons", "gloss": "El is singular and Eloim plural, showing a diversity of persons each of which is God; the singular verb shows that they are one creator and their works undivided (Abelard)."}, "elohim-is-honorific-plural": {"label": "A plural of honour", "gloss": "Every language honours the great with a plural — adonim, be'alim, the king speaking of himself in Arabic — so Elohim is the plural of eloah and means nothing more (Ibn Ezra)."}, "elohim-is-plural-of-powers": {"label": "The force of all forces", "gloss": "El hem: the root el is force, and 'they' points to all the other forces, so Elohim is the master of them all — with a secret not disclosed (Ramban)."}, "trinity-in-the-triad": {"label": "Father, Beginning, Spirit", "gloss": "The three persons are named in order across the first two verses: God the Father, the Beginning who is the Son, the Spirit borne over the waters (Augustine, Basil, Ambrose, Bede, Bruno, Honorius, the Glossa)."}, "trinity-in-the-formula": {"label": "The threefold formula of the six days", "gloss": "God said — and it was so — and God made: the testimony is tripled everywhere because the creating Trinity works everywhere (Rupert; considered and refused by Augustine)."}, "trinity-is-brought-to-the-text": {"label": "The rule of faith comes first", "gloss": "The catholic faith is set out before the exposition begins, because heretics drag Scripture to their own opinion; the doctrine is what the chapter is read under (Augustine, De Genesi ad litteram imperfectus)."}, "spirit-is-holy-spirit": {"label": "The spirit of v. 2 is the Holy Spirit", "gloss": "Not the air and not a wind: Scripture reserved the name, and no other spirit is meant but the one who completes the Trinity (Basil, Ambrose)."}, "principium-is-the-son": {"label": "The Beginning is the Son", "gloss": "'I am the beginning, who also speak to you' (John 8:25) — though the Father too is a beginning, and not from a beginning (Wigbod, Remigius, Bruno)."}, "not-to-angels": {"label": "Not spoken to the angels", "gloss": "Whoever the 'let us' addresses, it is not angels: man was not created by angels, or there would be many creators and not one (Bruno)."}, "word-order-is-modesty": {"label": "God is named after his works", "gloss": "A mortal king proclaims his name and builds afterwards; the Holy One made the needs of his world and was named after — bereshit bara, and only then Elohim (R. Yudan in the name of Akilas; Ben Azzai)."}, "word-order-is-dangerous": {"label": "The word order had to be changed", "gloss": "The seventy-two elders wrote 'God created in the beginning' for Ptolemy, so that bereshit could not be read as the subject (b. Megillah 9a)."}, "should-have-begun-at-exodus": {"label": "It should have begun at Exodus 12:2", "gloss": "The Torah is Israel's law book and ought to have opened with the first commandment given to Israel; the creation account has to be accounted for (R. Isaac, in Rashi)."}, "claim-on-the-land": {"label": "Title to the land", "gloss": "'He declared to his people the power of his works, to give them the inheritance of the nations' (Ps 111:6) — so that Israel may answer the charge of robbery (Bereshit Rabbah 1:2; Rashi)."}, "do-not-expound-it": {"label": "It may not be expounded", "gloss": "Not before two, and not the four questions — what is above, what is below, what is before, what is after (m. Chagigah 2:1; Bereshit Rabbah 1:5 and 1:10)."}, "honour-of-the-maker": {"label": "For the honour of the Maker", "gloss": "Whoever has no care for the honour of his Maker, it were fitting he had not come into the world; and the concealed matters are not to be published for the expositor's own glory (m. Chagigah 2:1; Rav Huna in the name of Bar Kappara)."}, "the-bet-is-closed": {"label": "The bet is closed behind", "gloss": "The world was made with a bet, closed on three sides and open in front: you may ask only from the day of creation onward (R. Yona in the name of R. Levi)."}, "beginning-is-blessing": {"label": "Bet for blessing, not alef for curse", "gloss": "Made with the letter of berakhah rather than of arirah, so that the heretics could not say the world was created with a curse (Bereshit Rabbah 1:10)."}, "moses-is-a-witness": {"label": "Moses wrote as a witness", "gloss": "Not in the persuasion of human wisdom nor in the counterfeit disputations of philosophy, but in the showing of the Spirit and of power, as a witness of the divine work (Ambrose)."}, "against-the-philosophers": {"label": "Against the philosophers", "gloss": "Plato's three principles and the atomists' concourse are a spider's web; the divine mind alone contains the origins and causes of things (Ambrose)."}, "against-the-heretics": {"label": "Because the heretics attack it", "gloss": "The Manichees mock the Old Testament before the unlearned, so the first book must be defended, and defended plainly (Augustine)."}, "written-for-the-unlearned": {"label": "In plain speech, for the unlearned", "gloss": "Not with ornate and polished speech but with plain facts — the usual and simple speech the learned also understand (Augustine)."}, "the-work-shows-the-maker": {"label": "The work shows the workman", "gloss": "The world is a specimen of the divine working: like building and weaving, it shows the craftsman's skill even when the craftsman is silent (Ambrose)."}, "scripture-is-about-restoration": {"label": "Scripture is about restoration", "gloss": "The matter of all divine Scripture is the works of human restoration, completed not in six days but in six ages (Hugh of St Victor)."}, "foundation-is-for-secular-writings": {"label": "Foundation belongs to secular writings", "gloss": "The works of foundation are the matter of worldly writings; divine Scripture only descends through them on its way to the Incarnation (Hugh of St Victor)."}, "history-is-the-foundation": {"label": "History is the foundation", "gloss": "Scripture is a hall with foundation, wall and roof — history, allegory, tropology — and nothing can be built before the foundation is laid (Comestor)."}}, "senses": {"literal": "Literal", "allegorical": "Allegorical", "spiritual": "Spiritual", "translation": "Translation"}};
const svg = d3.select('#map'), panel = document.getElementById('panel');
const g = svg.append('g');
const gRings = g.append('g'), gHubLinks = g.append('g'), gEdges = g.append('g'), gHubs = g.append('g'), gNodes = g.append('g'), gLabels = g.append('g');
let W = 800, H = 600, mode = 'answers';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const wn = D.witnesses.map(w => ({...w, kind: 'w'}));
const byId = Object.fromEntries(wn.map(n => [n.id, n]));
const ansKeys = Object.keys(D.answers), senseKeys = Object.keys(D.senses);
const hubsA = ansKeys.map(k => ({id: 'hub:' + k, kind: 'hub', key: k, label: D.answers[k].label, gloss: D.answers[k].gloss, facet: 'answers'}));
const hubsS = senseKeys.map(k => ({id: 'hub:' + k, kind: 'hub', key: k, label: D.senses[k], gloss: '', facet: 'sense'}));
const hubById = Object.fromEntries([...hubsA, ...hubsS].map(h => [h.id, h]));
const threads = D.threads.map(t => ({...t, source: byId[t.from], target: byId[t.to]})).filter(t => t.source && t.target);
const hubLinksA = wn.flatMap(w => w.answers.map(a => ({source: w, target: hubById['hub:' + a]})));
const hubLinksS = wn.flatMap(w => w.senses.map(s => ({source: w, target: hubById['hub:' + s]})));

let k = 1;
function applyScale() {
  nodeSel.attr('r', d => (d.slot ? 6 : 7) / k).attr('stroke-width', 2 / k);
  labelSel.attr('font-size', 11 / k + 'px').attr('dx', 10 / k).attr('dy', 4 / k);
  edgeSel.attr('stroke-width', d => (d.type === 'contests' ? 1.8 : d.type === 'parallel' ? 2 : 1.4) / k).attr('stroke-dasharray', d => d.type === 'echoes' ? `${5/k} ${4/k}` : d.type === 'parallel' ? `${2/k} ${4/k}` : null);
  if (hubSel) { hubSel.attr('r', 13 / k).attr('stroke-width', 1.5 / k); hubLblSel.selectAll('.hublbl').attr('font-size', 12 / k + 'px').attr('y', 30 / k); hubLblSel.selectAll('.hubsub').attr('font-size', 10.5 / k + 'px').attr('y', 43 / k); hubLinkSel.attr('stroke-width', 1 / k).attr('stroke-dasharray', `${1/k} ${3/k}`); }
  gRings.selectAll('text').attr('font-size', 10 / k + 'px'); gRings.selectAll('circle').attr('stroke-width', 1 / k);
}
svg.call(d3.zoom().scaleExtent([.5, 6]).on('zoom', e => { g.attr('transform', e.transform); if (e.transform.k !== k) { k = e.transform.k; applyScale(); } }));

// ---------- drawing
const edgeSel = gEdges.selectAll('path').data(threads).join('path').attr('class', d => 'edge ' + d.type)
  .on('mouseenter', (e, d) => showEdge(d, true)).on('mouseleave', (e, d) => showEdge(d, false)).on('click', (e, d) => { showEdge(d, true); e.stopPropagation(); });
const nodeSel = gNodes.selectAll('circle').data(wn).join('circle').attr('class', d => 'node ' + d.tradition + (d.slot ? ' slot' : '')).attr('r', d => d.slot ? 6 : 7)
  .on('click', (e, d) => { showWitness(d); e.stopPropagation(); }).on('mouseenter', (e, d) => focusNode(d, true)).on('mouseleave', (e, d) => focusNode(d, false))
  .call(d3.drag().on('start', (e, d) => { d.fx = d.x; d.fy = d.y; }).on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; sim.alpha(.3).restart(); }).on('end', (e, d) => { d.fx = null; d.fy = null; }));
const labelSel = gLabels.selectAll('text').data(wn).join('text').attr('class', 'lbl').text(d => d.short);
let hubSel, hubLblSel, hubLinkSel;

const sim = d3.forceSimulation().on('tick', tick);
function tick() {
  edgeSel.attr('d', d => { const {source: s, target: t} = d; const dx = t.x - s.x, dy = t.y - s.y, dr = Math.hypot(dx, dy) * 1.4; return `M${s.x},${s.y}A${dr},${dr} 0 0,1 ${t.x},${t.y}`; });
  nodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
  labelSel.attr('x', d => d.x).attr('y', d => d.y);
  if (hubSel) { hubSel.attr('cx', d => d.x).attr('cy', d => d.y); hubLblSel.attr('transform', d => `translate(${d.x},${d.y})`); hubLinkSel.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y); }
}

function size() { const r = svg.node().getBoundingClientRect(); W = r.width; H = r.height; }

function layout() {
  size(); const cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 40;
  gRings.selectAll('*').remove(); gHubs.selectAll('*').remove(); gHubLinks.selectAll('*').remove(); hubSel = null;
  const labelR = d => d.kind === 'hub' ? 46 : 12 + d.short.length * 2.4;
  sim.nodes(wn).force('charge', null).force('link', null).force('x', null).force('y', null).force('hublink', null).force('collide', d3.forceCollide(labelR).strength(.9));
  if (mode === 'answers' || mode === 'sense') {
    const hubs = mode === 'answers' ? hubsA : hubsS, links = mode === 'answers' ? hubLinksA : hubLinksS;
    hubs.forEach((h, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / hubs.length; h.fx = cx + Math.cos(a) * R * .9; h.fy = cy + Math.sin(a) * R * .9; h.x = h.fx; h.y = h.fy; });
    sim.nodes([...wn, ...hubs]);
    sim.force('charge', d3.forceManyBody().strength(d => d.kind === 'hub' ? -80 : -320))
       .force('hublink', d3.forceLink(links).distance(mode === 'answers' ? 120 : 150).strength(.6))
       .force('link', d3.forceLink(threads).distance(120).strength(.04))
       .force('x', d3.forceX(cx).strength(.03)).force('y', d3.forceY(cy).strength(.03));
    hubLinkSel = gHubLinks.selectAll('line').data(links).join('line').attr('class', 'hublink');
    hubSel = gHubs.selectAll('circle').data(hubs).join('circle').attr('class', 'hub').attr('r', 13).on('click', (e, d) => { showHub(d); e.stopPropagation(); });
    hubLblSel = gHubs.selectAll('g').data(hubs).join('g');
    hubLblSel.append('text').attr('class', 'hublbl').attr('text-anchor', 'middle').attr('y', 30).text(d => d.label);
    hubLblSel.append('text').attr('class', 'hubsub').attr('text-anchor', 'middle').attr('y', 43).text(d => (mode === 'answers' ? hubLinksA : hubLinksS).filter(l => l.target === d).length + ' witnesses');
  } else if (mode === 'time') {
    const dates = wn.map(d => d.date), d0 = Math.min(...dates), d1 = Math.max(...dates);
    const rOf = d => 50 + (d - d0) / (d1 - d0) * (R - 50);
    [0, 500, 1000].forEach(y => { gRings.append('circle').attr('class', 'ring').attr('cx', cx).attr('cy', cy).attr('r', rOf(y)); gRings.append('text').attr('class', 'ringlbl').attr('x', cx + 4).attr('y', cy - rOf(y) - 4).text(y === 0 ? 'year 1' : y); });
    gRings.append('text').attr('class', 'ringlbl').attr('x', cx + R * .7).attr('y', cy + R + 26).text('LATIN →').attr('text-anchor', 'middle');
    gRings.append('text').attr('class', 'ringlbl').attr('x', cx - R * .7).attr('y', cy + R + 26).text('← RABBINIC').attr('text-anchor', 'middle');
    const groups = {'greek-jewish': [], latin: [], rabbinic: []}; wn.forEach(w => groups[w.tradition].push(w));
    Object.values(groups).forEach(a => a.sort((p, q) => p.date - q.date));
    groups['greek-jewish'].forEach(w => { w.tx = cx; w.ty = cy - rOf(w.date); });
    groups.latin.forEach((w, i, a) => { const t = -Math.PI * .42 + (i / Math.max(1, a.length - 1)) * Math.PI * .84; w.tx = cx + Math.cos(t) * rOf(w.date); w.ty = cy + Math.sin(t) * rOf(w.date); });
    groups.rabbinic.forEach((w, i, a) => { const t = Math.PI + Math.PI * .42 - (i / Math.max(1, a.length - 1)) * Math.PI * .84; w.tx = cx + Math.cos(t) * rOf(w.date); w.ty = cy + Math.sin(t) * rOf(w.date); });
    sim.force('x', d3.forceX(d => d.tx).strength(.6)).force('y', d3.forceY(d => d.ty).strength(.6)).force('collide', d3.forceCollide(d => 8 + d.short.length * 1.6).strength(.8));
  } else if (mode === 'place') {
    const lons = wn.map(d => d.lon).filter(Number.isFinite), lats = wn.map(d => d.lat).filter(Number.isFinite);
    const sx = d3.scaleLinear().domain([Math.min(...lons) - 2, Math.max(...lons) + 2]).range([60, W - 120]);
    const sy = d3.scaleLinear().domain([Math.min(...lats) - 1, Math.max(...lats) + 1]).range([H - 50, 50]);
    const seen = new Set();
    wn.forEach(w => { w.tx = sx(w.lon); w.ty = sy(w.lat); if (!seen.has(w.place)) { seen.add(w.place); gRings.append('text').attr('class', 'placelbl').attr('x', w.tx + 12).attr('y', w.ty - 12).text(w.place); } });
    sim.force('x', d3.forceX(d => d.tx).strength(.5)).force('y', d3.forceY(d => d.ty).strength(.5)).force('collide', d3.forceCollide(d => 8 + d.short.length * 1.6).strength(.8));
  }
  applyScale();
  sim.alpha(1).restart();
}

// ---------- panel
function showHome() {
  const q = D.crux.question;
  panel.innerHTML = `<p class="eyebrow">Crux · Genesis 1:1</p><h2>${esc(q.en)}</h2><p class="la-q">${esc(q.la)}</p><p class="heb-q">${esc(q.he)}</p>
  <p>${esc(D.crux.summary)}</p><p>${esc(D.crux.finding)}</p>
  <p class="hint"><b>Answers</b> gathers witnesses around the reading they give; a witness between two hubs holds both. <b>Time</b> is a clock: distance from the centre is the date, Latin to the right, rabbinic to the left. <b>Places</b> is a map. <b>Senses</b> sorts by literal, allegorical, spiritual, translation. Threads keep their meaning in every arrangement. Click a node or a hub; hover a line; drag to pull the graph apart; scroll to zoom: zooming spreads the graph while dots and labels keep their size.</p>`;
}
function showWitness(w) {
  const lem = Object.entries(w.lemma || {}).filter(([k]) => k !== 'en').map(([k, v]) => `<span class="${k === 'he' || k === 'arc' ? 'heb' : 'lat'}" dir="${k === 'he' || k === 'arc' ? 'rtl' : 'ltr'}">${esc(v)}</span>`).join(' ');
  const ocls = (w.olang === 'he' || w.olang === 'arc') ? 'heb' : 'lat';
  const ans = (w.answers || []).map(a => `<span>${esc(D.answers[a]?.label || a)}</span>`).join('');
  const ins = threads.filter(t => t.target === w), outs = threads.filter(t => t.source === w);
  const rel = [...outs.map(t => `→ ${t.type} · ${esc(t.target.short)}`), ...ins.map(t => `← ${t.type} · ${esc(t.source.short)}`)].join('<br>');
  panel.innerHTML = `<p class="eyebrow">${esc(w.tradition.replace('-', ' '))} · ${esc(w.datelabel)} · ${esc(w.place)}</p><h2>${esc(w.author)}</h2><p class="meta">${esc(w.source)}</p>
  <p class="lem">${lem}</p><p>${esc(w.en)}</p><div class="orig ${ocls}">${esc(w.orig)}</div><div class="ans">${ans}</div><p class="note">${esc(w.notes)}</p>
  <p class="cred">${w.translator === 'claude-draft' ? 'Draft English (Claude), awaiting Wilson' : 'English: ' + esc(w.translator)}</p>${rel ? `<p class="cred">${rel}</p>` : ''}`;
  panel.scrollTop = 0;
}
function showHub(h) {
  const links = (h.facet === 'answers' ? hubLinksA : hubLinksS).filter(l => l.target === h);
  panel.innerHTML = `<p class="eyebrow">${h.facet === 'answers' ? 'Answer family' : 'Sense'}</p><h2>${esc(h.label)}</h2><p>${esc(h.gloss)}</p>
  <p class="cred">${links.map(l => esc(l.source.short) + ' · ' + esc(l.source.datelabel)).join('<br>')}</p>`;
  nodeSel.classed('dim', d => !links.some(l => l.source === d)); labelSel.classed('dim', d => !links.some(l => l.source === d));
}
function showEdge(t, on) {
  edgeSel.classed('on', d => on && d === t);
  nodeSel.classed('on', d => on && (d === t.source || d === t.target));
  if (on) { panel.innerHTML = `<p class="eyebrow">${esc(t.type)} · ${esc(t.source.short)} → ${esc(t.target.short)}</p><div class="ev">${esc(t.evidence)}</div>`; }
}
function focusNode(w, on) {
  edgeSel.classed('dim', d => on && d.source !== w && d.target !== w);
  nodeSel.classed('dim', d => on && d !== w && !threads.some(t => (t.source === w && t.target === d) || (t.target === w && t.source === d)));
  labelSel.classed('dim', d => on && d !== w && !threads.some(t => (t.source === w && t.target === d) || (t.target === w && t.source === d)));
}
svg.on('click', () => { nodeSel.classed('dim', false).classed('on', false); labelSel.classed('dim', false); edgeSel.classed('dim', false).classed('on', false); showHome(); });
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; document.querySelectorAll('.modes button').forEach(x => x.setAttribute('aria-pressed', x === b)); layout(); }));
document.querySelectorAll('#filters input').forEach(c => c.addEventListener('change', () => { const off = new Set([...document.querySelectorAll('#filters input')].filter(i => !i.checked).map(i => i.dataset.type)); edgeSel.classed('hidden', d => off.has(d.type)); }));
window.addEventListener('resize', () => layout());
size(); wn.forEach(w => { w.x = W / 2 + (Math.random() - .5) * 200; w.y = H / 2 + (Math.random() - .5) * 200; });
showHome(); layout();
</script>
