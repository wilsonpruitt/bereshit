mes a pupil's and the doctrine a master's. Nothing is added and one thing is lost: Augustine wrote ad imaginem Dei, and had a paragraph of argument about why it is not ad imaginem Filii; Wigbod writes ad imaginem suam, which makes the point unarguable and unexaminable at once. The compilation is also where the attribution slips — the excerpt is headed AMBROSIUS, de creatione hominis, and the words are Augustine's. That is the ordinary condition of the Carolingian florilegia and is why the Latin bench of the ninth century can be read for what it circulated rather than for what it thought.", "slot": false}, {"id": "remigius-gen-1-26", "short": "remigius-gen-1-26", "author": "Remigius of Auxerre", "tradition": "latin", "date": 890, "datelabel": "c. 890", "place": "Auxerre", "lat": 47.8, "lon": 3.57, "answers": ["faciamus-is-the-trinity", "dignity-of-the-creature", "faciamus-to-the-angels"], "senses": ["literal"], "lemma": {"la": "quasi quodam concilio dicit: Faciamus", "en": "as though by a kind of council he says: let us make"}, "en": "Verse 26. Let us make a human to our image and likeness. Whereas he made the rest by commanding, God — as though about to make the greatest thing, and one to be preferred to all that he had made — says, as though by a kind of council: let us make. And although some say that this is to be referred to the angels, it is better referred to the holy Trinity.", "translator": "claude-draft", "orig": "Vers. 26. Faciamus hominem ad imaginem et similitudinem nostram. Cum caetera jubendo fecerit, quasi maximam rem facturus Deus et cunctis quae fecerat praeferendam, quasi quodam concilio dicit: Faciamus. Quod, licet quidam ad angelos referendum dicant, melius tamen ad sanctam Trinitatem refertur.", "olang": "la", "source": "PL 131, col. 56D", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. Three sentences, and the middle one is the most useful thing on the Latin half of this daf. Quasi quodam concilio dicit: Faciamus — as though by a kind of council he says, let us make — is Bereshit Rabbah 8:3's be-mi nimlakh, with whom did he take counsel, in a Latin word; and the third sentence records, without naming anyone, that some say it is to be referred to the angels. That is the rabbinic bench's own primary answer, reported at Auxerre about 890 as a live opinion among Latin readers and rejected only comparatively — melius tamen, it is better referred to the Trinity, not: it is impossible. Remigius is the one Latin witness here who neither refutes the angel reading nor accepts it, and the mildness is the evidence: by the end of the ninth century the reading is in the schools as an option, and nobody on this daf says where it came from.", "slot": false}, {"id": "glossa-1-26", "short": "glossa-1-26", "author": "Glossa ordinaria (school of Laon)", "tradition": "latin", "date": 1120, "datelabel": "compilation 1110–1130", "place": "Laon", "lat": 49.56, "lon": 3.62, "answers": ["faciamus-is-the-trinity", "image-of-the-whole-trinity"], "senses": ["literal"], "lemma": {"la": "Insinuatur pluralitas personarum Patris, et Filii, et Spiritus sancti", "en": "A plurality of persons is intimated — of the Father, and the Son, and the Holy Spirit"}, "en": "Verse 26. 'Let us make a human.' (AUG., ibid., c. 19.) A plurality of persons is intimated — of the Father, and the Son, and the Holy Spirit — and at once the unity of the deity, when it is said: 'and God made the human to the image of God', not the Father to the image only of the Son. For it would not truly be said, to our image; but it was said thus: 'God made the human to the image of God', as if it were said 'to his own image'. And when it says 'to the image of God', when above it had said 'to our image', it is signified that the plurality of persons does not work so that we should believe in many gods, but so that we should take the Father, and the Son, and the Holy Spirit as one God.", "translator": "claude-draft", "orig": "VERS. 26.-- « Faciamus hominem. » (AUG., ibid., c. 19.) Insinuatur pluralitas personarum Patris, et Filii, et Spiritus sancti, et statim unitas deitatis, cum dicitur: « Et fecit Deus hominem ad imaginem Dei, » non Pater ad imaginem tantum Filii. Non enim vere diceretur ad imaginem nostram; sed ita dictum est: « Fecit Deus hominem ad imaginem Dei, » ac si diceretur « ad imaginem suam. » Cum autem dicitur « ad imaginem Dei, » cum superius dictum sit, « ad imaginem nostram, » significatur quod non agit pluralitas personarum, ut plures deos credamus, sed ut Patrem, et Filium, et Spiritum sanctum unum Deum accipiamus.", "olang": "la", "source": "PL 113, col. 80B", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. The school answer in the form the twelfth century actually read: Augustine's De Genesi ad litteram III.19, printed under his name, abridged to the two moves that matter and set beside the verse. What the abridgement drops is the argument — Augustine's careful 'otherwise how is it true, what was said, to our image, if the human was made to the image of the Son alone?' becomes the flat 'for it would not truly be said, to our image' — so that a reader of the Gloss gets the conclusion with the reasoning compressed to a clause. This is the page on which Peter Comestor, Hugh and Abelard all begin. The same volume of the Gloss, ninety columns later, prints the angel reading of Gen 11:7 without a word of warning; see `glossa-11-7-angeli`.", "slot": false}, {"id": "glossa-11-7-angeli", "short": "glossa-11-7-angeli", "author": "Glossa ordinaria (school of Laon)", "tradition": "latin", "date": 1120, "datelabel": "compilation 1110–1130", "place": "Laon", "lat": 49.56, "lon": 3.62, "answers": ["faciamus-to-the-angels", "one-authority-singular-verb"], "senses": ["literal"], "lemma": {"la": "Ad angelos dixisse intelligitur", "en": "He is understood to have said it to the angels"}, "en": "Verse 7. 'Come, therefore', etc. He is understood to have said it to the angels; or according to that: 'let us make a human to our image and likeness.' For it is added in the singular number: 'and he divided them', etc., just as there: 'God made the human to his own image and likeness.'", "translator": "claude-draft", "orig": "VERS. 7.-- « Venite igitur, » etc. Ad angelos dixisse intelligitur; vel secundum illud: « Faciamus hominem ad imaginem et similitudinem nostram. » Nam singulari numero subjunctum est: « et divisit eos, » etc., sicut ibi: « Fecit Deus hominem ad imaginem et similitudinem suam. »", "olang": "la", "source": "PL 113, col. 114D", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. ⚠ A second anchor note applies: this is a gloss on Gen 11:7, the tower of Babel, not on Gen 1:26 or on Gen 1:1–5. It is on the daf because it says of venite, confundamus what nobody in the Gloss says of faciamus: he is understood to have said it to the angels. And it gets there by the same route the rabbinic bench does. The gloss pairs Gen 11:7 with Gen 1:26 as the two plural verses; it then answers the plural of Gen 11:7 with the singular of Gen 11:8 — 'and he divided them' — exactly as the plural of Gen 1:26 is answered by the singular of Gen 1:27. That is R. Yoḥanan's rule at b. Sanhedrin 38b, which lists the same two verses in the same order with the same singular refutations beside them, and it is the structure of Augustine's chapter de locutione qua Deus Angelis loquitur (`aug-civ-16-6`), where Gen 1:26 is refused to the angels and Gen 11:7 is granted to them. Three benches, the same pair of verses, the same test. The Gloss is the one place where a Latin schoolbook prints the angel reading as the plain sense, and it does so where the image clause is missing and the argument against it therefore fails.", "slot": false}, {"id": "rupert-gen-1-26-consilium", "short": "rupert-gen-1-26-consilium", "author": "Rupert of Deutz", "tradition": "latin", "date": 1117, "datelabel": "1112–1117", "place": "Liège", "lat": 50.63, "lon": 5.57, "answers": ["faciamus-is-the-trinity", "consilium-not-senate"], "senses": ["literal", "spiritual"], "lemma": {"la": "non tam senatu quam soliloquio venerando", "en": "not so much a senate as a venerable soliloquy"}, "en": "He says: let us make a human to our image and likeness. He changed his voice — he who until now had said of each single thing: let it be, and it was made; let the earth bring forth, let the waters bring forth, and it was made. But now, as though he had sat down wearied from the circuit of earth and heaven and sea, and while catching his breath it had come into his mind that one thing was still lacking which it would be fitting or needful to make: let us make, he says, a human to our image and likeness. Lord, says the prophet, let your ancient counsel be made true. Or does the counsel seem to you a small one, to have been signified by these few little sayings of the holy Trinity? A plainly great counsel was held in that counsel of Wisdom, in that — not so much a senate as a venerable soliloquy — of such persons, the Father, and the Son, and the Holy Spirit, concerning us sinners.", "translator": "claude-draft", "orig": "Ait: Faciamus hominem ad imaginem et similitudinem nostram. Mutavit vocem suam, quippe qui hactenus de singulis dixit: Fiat, et factum est; producat terra, producant aquae, et factum est. Nunc autem tanquam a circuitu terrae, coeli et maris, lassabundus resederit, et inter respirandum in mentem illi venerit, adhuc unum deesse quod deceret vel oporteret fieri: Faciamus, inquit, hominem ad imaginem et similitudinem nostram. Domine, inquit propheta, consilium tuum antiquum, verum fiat. An tibi parvum videtur consilium, his paucis sanctae Trinitatis dictiunculis esse significatum? Magnum plane consilium in illo Sapientiae consilio, in illo talium personarum, Patris, et Filii et Spiritus sancti, non tam senatu quam soliloquio venerando de nobis peccatoribus habitum est.", "olang": "la", "source": "PL 167, col. 247B", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. Rupert states the philological observation more plainly than anyone else on the Latin bench — mutavit vocem suam, he changed his voice — and then does something no one else does: he names the two things the change of voice could mean and rejects one of them. The counsel is non tam senatu quam soliloquio, not so much a senate as a soliloquy. That is the disagreement of Bereshit Rabbah 8:3 settled in four words, and settled the other way from where it starts. There R. Yehoshua in R. Levi's name says God took counsel with the work of heaven and earth, and the parable is of a king with two sanqlitin — Greek synklētikoi, senators — while R. Ami says be-libbo nimlakh, he took counsel with his own heart. Rupert, who has never heard of either, uses the Roman word for the first and the Augustinian word for the second, and chooses the second. Abelard chooses it too, twenty years later, and gives it a source: a man consulting his own reason makes two of himself, as in Boethius and in Augustine's Soliloquies. The image of God pausing for breath is Rupert's own and is not in the tradition.", "slot": false}, {"id": "abelard-hex-1-26-faciamus", "short": "abelard-hex-1-26-faciamus", "author": "Peter Abelard", "tradition": "latin", "date": 1133, "datelabel": "c. 1133", "place": "The Paraclete (Nogent-sur-Seine)", "lat": 48.49, "lon": 3.5, "answers": ["elohim-is-plural-of-persons", "faciamus-is-the-trinity", "consilium-not-senate", "one-authority-singular-verb"], "senses": ["literal"], "lemma": {"la": "Sed cur pluraliter dicitur: faciamus hominem ad imaginem nostram, si nulla prorsus pluralitas in Deo sit", "en": "But why is it said in the plural — let us make a human to our image — if there is no plurality at all in God?"}, "en": "The excellence of this creation he plainly intimates, when, speaking as though out of a kind of counsel, he says: let us make. But why is it said in the plural — let us make a human to our image — if there is no plurality at all in God, who alone is afterwards recorded to have created the human to his own image in these words: and God created the human to his own image, to the image of God he created him? Let the Jews say, if they can, or else confess with us that in the one essence of the Divinity there is a plurality of persons rather than of things. Considering this carefully, the prophet says in the plural, in order to make a distinction of persons: let us make; and in order to assign the unity of God he added in the singular: and God created the human, etc. So, then, as someone speaking with himself sets up himself and his own reason as though they were two when he consults it — as Boethius does in the book *On the Consolation of Philosophy*, or Augustine in the book of *Soliloquies* — so God the Father, as though inviting both Wisdom and Goodness, that is the Son and the Holy Spirit, to the creation of the human, says: let us make him such and so great, that he may be our image or likeness.", "translator": "claude-draft", "orig": "Cujus quidem creationis excellentiam patenter insinuat, cum quasi ex quodam consilio loquens, dicit: faciamus. Sed cur pluraliter dicitur: faciamus hominem ad imaginem nostram, si nulla prorsus pluralitas in Deo sit, qui solus hominem creasse ad imaginem suam postea memoratur his verbis: Et creavit Deus hominem ad imaginem suam, ad imaginem Dei creavit illum. Dicant Judaei si possunt, vel nobiscum fateantur in una Divinitatis essentia pluralitatem personarum magis quam rerum esse. Quod diligenter propheta considerans ad distinctionem personarum faciendam, dicit pluraliter: Faciamus; ad unitatem vero Dei assignandam subjunxit singulariter, et creavit Deus hominem, etc. Quasi ergo aliquis secum loquens se et rationem suam quasi duo constituit cum eam consulit, sicut Boetius in libro De consolatione Philosophiae, vel Augustinus in libro Soliloquiorum. Sic Deus Pater ad creationem hominis tam Sapientiam quam Bonitatem, hoc est Filium et Spiritum sanctum quasi invitans dicit: Faciamus eum talem et tantum, ut imago nostra sit vel similitudo.", "olang": "la", "source": "PL 178, col. 760A", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. The same man who is this crux's star witness on Eloim at Gen 1:1, asking the same question at the other verse, and the two pages should be read together: at 1:1 the evidence is a Hebrew noun that is plural in form beside a singular verb, and here it is a Latin verb that is plural in form beside a singular verb three lines later. Both times the argument runs the same way — the plural gives the persons, the singular gives the one creator — and both times it is addressed to Jews by name: dicant Judaei si possunt. What is new here is the analogy, and it is the most interesting thing on the Latin bench for this daf. A man who consults his own reason 'sets up himself and his reason as though they were two', as Boethius does in the Consolation and Augustine in the Soliloquies. That is R. Ami's answer at Bereshit Rabbah 8:3, be-libbo nimlakh — he took counsel with his heart — used to prove the opposite conclusion: for R. Ami the inward counsel shows that no second party was involved, for Abelard it shows how a real plurality can speak in one mouth. Rupert had reached the same figure sixteen years earlier and called it a soliloquy without naming the book.", "slot": false}, {"id": "hugh-adnot-1-26", "short": "hugh-adnot-1-26", "author": "Hugh of St Victor", "tradition": "latin", "date": 1130, "datelabel": "c. 1130", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["faciamus-to-the-angels", "faciamus-is-the-trinity", "dignity-of-the-creature"], "senses": ["literal", "spiritual"], "lemma": {"la": "cum ipse ad angelos ita loquatur, quorum ministerio forsitan formatum est corpus hominis", "en": "since he himself so speaks to the angels, by whose ministry perhaps the human body was formed"}, "en": "Let us make a human to our image and likeness. First he said: in the beginning God created heaven and earth. Then he said: let there be light; here, thirdly, he adds: let us make a human, etc. In this three advances may be named. First the work, then the informing word, thirdly the counsel — by this, that he here adds: let us make a human, etc. Nor does he bring in counsel because he could not equally well make both great things and small; but in order to show the dignity of the human that was created, and to make us careful not to disdain to take counsel both from equals and from lesser people — since he himself so speaks to the angels, by whose ministry perhaps the human body was formed. Or, what is better, let us take it that it was the counsel of the Trinity, and that by the plural word there is a distinction of persons; and by this, that he adds in the singular, to our image and likeness, a unity of essence.", "translator": "claude-draft", "orig": "Faciamus hominem ad imaginem, et similitudinem nostram. Primo dixit: In principio creavit Deus coelum et terram. Deinde dixit: Fiat lux, hic tertio adjungit: Faciamus hominem, etc. In hoc vocari possunt tres progressus. Primum opus, deinde informans verbum, tertio consilium, per hoc, quod hic adjungit: Faciamus hominem, etc. Nec propterea consilium inducit, quin aeque possit facere et magna et parva; sed ut dignitatem creati hominis ostenderet, et ut nos cautos reddat, ne dedignemur consilium accipere et ab aequalibus et a minoribus; cum ipse ad angelos ita loquatur, quorum ministerio forsitan formatum est corpus hominis. Vel quod melius est, accipiamus consilium Trinitatis fuisse, et per verbum plurale distinctionem personarum; per hoc quod subjungit singulariter ad imaginem et similitudinem nostram, unitatem essentiae.", "olang": "la", "source": "PL 175, col. 37B", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. The one place on the Latin bench where the angel reading is not merely reported but taught, and taught as a moral. Hugh gives the change of formula a shape — work, informing word, counsel, three advances across Gen 1:1, 1:3 and 1:26 — and then draws from the third the lesson that we should not disdain to take counsel from equals and from lesser people, since he himself so speaks to the angels. He goes further than any rabbinic witness on this daf dares to: quorum ministerio forsitan formatum est corpus hominis, by whose ministry perhaps the human body was formed, which is the thing Basil calls a Jewish fiction and Bruno says would make many creators. Only then comes vel quod melius est, or what is better — the counsel of the Trinity. So the school of St Victor about 1130 holds both readings, prefers the second, and gets from the first exactly the moral Bereshit Rabbah 8:8 gets: that the great should consult the small, and that the Creator did it first. Hugh's ad imaginem et similitudinem nostram is called singular in the last clause; he means the singular of Gen 1:27, and the sentence is loose in the printed text.", "slot": false}, {"id": "comestor-hs-1-26", "short": "comestor-hs-1-26", "author": "Peter Comestor", "tradition": "latin", "date": 1170, "datelabel": "1169–1173", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["faciamus-to-the-son", "faciamus-is-the-trinity"], "senses": ["literal"], "lemma": {"la": "Et loquitur Pater ad Filium, et Spiritum sanctum", "en": "And the Father speaks to the Son and the Holy Spirit"}, "en": "Then it is added concerning the creation of the human thus: let us make a human, etc. (Gen 1). And the Father speaks to the Son and the Holy Spirit. Or it is as it were the common voice of the three persons, 'let us make', and 'our': and the human was made to the image of God, as regards the soul.", "translator": "claude-draft", "orig": "Deinde subditur de creatione hominis sic: Faciamus hominem, etc. (Gen. I) . Et loquitur Pater ad Filium, et Spiritum sanctum. Vel est quasi communis vox trium personarum, Faciamus, et nostram: factus est autem homo ad imaginem Dei, quantum ad animam.", "olang": "la", "source": "PL 198, col. 1063C", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. The handbook settling it, and the interest is in what it settles and what it leaves standing. Comestor gives two readings without ranking them: the Father speaks to the Son and the Holy Spirit — which is Ambrose's and Basil's answer, refused by Augustine on the ground that ad imaginem nostram would then have to be tuam or meam — or the plural is the common voice of the three, which is Augustine's. He does not notice that the first is the one Augustine wrote two books to exclude, and neither reading is argued for. The angels are not mentioned at all: between Hugh at St Victor about 1130, who teaches the angel reading as a moral and grants the angels a possible ministry in forming the body, and the Historia scholastica about 1170, which is the book every priest in Latin Europe will be examined on, the option has simply dropped out of the syllabus.", "slot": false}, {"id": "br-8-3", "short": "br-8-3", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["counsel-with-the-household-above", "consilium-not-senate"], "senses": ["literal"], "lemma": {"he": "וַיֹּאמֶר אֱלֹהִים נַעֲשֶׂה אָדָם. בְּמִי נִמְלַךְ?", "en": "'And God said, let us make a human' — with whom did he take counsel?"}, "en": "“And God said: Let us make Man” – with whom did He consult? Rabbi Yehoshua said in the name of Rabbi Levi: He consulted with the works of the heavens and the earth. This is analogous to a king who had two members of his council and he would not do anything without their knowledge. Rabbi Shmuel bar Naḥman said: He consulted with what was made on each and every day. This is analogous to a king who had an adviser and he would not do anything without his knowledge. Rabbi Ami said: He consulted with His heart. This is analogous to a king who built a palace through the services of an architect, but it was not pleasing for him. At whom should he be angry? Is it not the architect? This is a rhetorical question. That is, “He was saddened in His heart” (Genesis 6:6). Rav Asi said: This is analogous to a king who conducted a business transaction through an intermediary, and he suffered a loss. At whom should he be angry? Is it not the intermediary? This is a rhetorical question. That is, “He was saddened in His heart.”", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "ויאמר אלהים נעשה אדם. במי נמלך? רבי יהושע בשם ר' לוי אמר:במלאכת השמים והארץ נמלך. משל למלך שהיו לו ב' סנקליטים ולא היה עושה דבר חוץ מדעתן. רבי שמואל בר נחמן אמר: במעשה כל יום ויום נמלך. משל למלך שהיה לו סנקתדרון ולא היה עושה דבר חוץ מדעתו. ר' אמי אמר: בלבו נמלך. משל למלך שבנה פלטין ע\"י ארדכל, ראה אותה ולא ערבה לו על מי יש לו להתרעם, לא על ארדכל אתמהא?! הוי, ויתעצב אל לבו. אמר רבי אסי: משל למלך שעשה לו סחורה על ידי סרסור והפסיד, על מי יש לו להתרעם לא על הסרסור אתמהא?! הוי, ויתעצב אל לבו:", "olang": "he", "source": "Bereshit Rabbah 8:3 (Vilna numbering)", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. The rabbinic bench asks the Latin bench's question in three words — be-mi nimlakh, with whom did he take counsel — and then, instead of answering it, prints four answers side by side and lets them stand. R. Yehoshua in R. Levi's name: he took counsel with the work of heaven and earth, and the parable is of a king with two sanqlitin, the Greek synklētikoi, senators, without whose knowledge he did nothing. R. Shmuel bar Naḥman: with the work of each day, like a king with one counsellor. R. Ami: be-libbo nimlakh, he took counsel with his own heart — and the parables that follow are about blame rather than about counsel, the architect and the broker who lose the king's money, so that 'he was saddened in his heart' (Gen 6:6) explains the counsel backwards from the regret. Rav Asi repeats the second. Note what is not here and is in every Latin witness on this daf: nobody suggests that the plural could point to a plurality in God. The question is whom God consulted, not who spoke; and the two extremes the midrash offers, a senate and a soliloquy, are the two Rupert of Deutz will name in Latin at Liège six hundred years later — non tam senatu quam soliloquio — choosing the soliloquy, as R. Ami does, and meaning by it the opposite thing.", "slot": false}, {"id": "br-8-8", "short": "br-8-8", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["counsel-with-the-household-above", "against-the-heretics", "dignity-of-the-creature"], "senses": ["literal"], "lemma": {"he": "רִבּוֹן הָעוֹלָם מָה אַתָּה נוֹתֵן פִּתְחוֹן פֶּה לַמִּינִים", "en": "Master of the world, why are you giving the minim an opening?"}, "en": "Rabbi Shmuel bar Naḥman said in the name of Rabbi Yonatan: When Moses was writing the Torah, and was writing what was made on each day, when he reached this verse: “And God said: Let us make Man in our image, in our likeness” – he said before Him: ‘Master of the universe, why do you provide the heretics with basis for a claim? This is bewildering.’ He said to him: ‘Just write, and if someone wants to err, let him err.’ The Holy One blessed be He said to Moses: ‘Is it not so regarding this man whom I created, that I will bring forth descendants of greater and lesser status? If someone of greater status is about to seek approval from one of lesser stature than he, but he says: Why do I need to seek approval from one who is of lesser stature than I? One may say to him: Learn from your Creator, as He created the heavenly realms and the earthly realms, but when He came to create man, he consulted with the ministering angels.’ Rabbi Levi said: There is no consultation here; rather, this is analogous to a king who was strolling at the entrance to his palace, and saw a large hewn rock set off to the side. He said: ‘What should we use this for?’ Some of them [of his advisers] said: ‘[Use it for] the public baths,’ and others said: ‘For private bathhouses.’ The king said: ‘I am going to craft it into a statue.’ Who will prevent it?", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "רבי שמואל בר נחמן בשם רבי יונתן אמר: בשעה שהיה משה כותב את התורה היה כותב מעשה כל יום ויום, כיון שהגיע לפסוק הזה שנאמר: ויאמר אלהים נעשה אדם בצלמנו כדמותנו. אמר לפניו: רבון העולם מה אתה נותן פתחון פה למינים אתמהא?! אמר לו: כתוב והרוצה לטעות יטעה. אמר לו הקב\"ה: משה! האדם הזה שבראתי לא גדולים וקטנים אני מעמיד ממנו?! שאם יבא הגדול ליטול רשות מן הקטן ממנו, והוא אומר מה אני צריך ליטול רשות מן הקטן ממני?! והן אומרים לו: למוד מבוראך, שהוא ברא את העליונים ואת התחתונים, כיון שבא לבראת את האדם נמלך במלאכי השרת. אמר רבי לוי: לית הכא מלכו אלא, משל למלך שהיה מטייל בפתח פלטין שלו וראה בלורין א' מושלכת, אמר, מה נעשה בה? מהן אומרים דימוסיות, ומהן אומרים פריבטאות. אמר המלך: אינדרטין אני עושה אותה, מי מעכב:", "olang": "he", "source": "Bereshit Rabbah 8:8 (Vilna numbering)", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. The single most important passage on this daf, because it is the rabbinic bench saying out loud that it knows what the other bench does with this verse. Moses is writing the Torah at dictation; he reaches na'aseh adam and stops: ribbon ha-olam, mah attah noten pitchon peh la-minim — Master of the world, why are you giving the minim an opening? And the answer is not a defence of the plural but a refusal to protect it: 'write, and whoever wants to err, let him err.' Then the reason the risk was worth taking, and it is a moral one: God made greater and lesser, and a great man who will not ask leave of a lesser is to learn from his Creator, who consulted the ministering angels before making a human. R. Levi will not have even that — let hakha malkhu, there is no consulting here — and gives a parable in which the king asks what to do with a block of stone, hears his advisers say baths, and makes a statue: who is going to stop him? So the passage holds three positions at once: that the plural is dangerous, that it teaches humility, and that the consultation was never real. What it does not do is deny that the verse can be read as the minim read it. That is the concession the Latin bench never makes and never needs to, and it is the clearest evidence on the site that the two readings of Gen 1:26 were known to each other.", "slot": false}, {"id": "br-8-9", "short": "br-8-9", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["one-authority-singular-verb", "refutation-beside-the-claim", "against-the-heretics"], "senses": ["literal"], "lemma": {"he": "שָׁאֲלוּ הַמִּינִים אֶת רַבִּי שִׂמְלַאי: כַּמָּה אֱלֹהוּת בָּרְאוּ אֶת הָעוֹלָם?", "en": "The minim asked Rabbi Simlai: how many divinities created the world?"}, "en": "The heretics once asked Rabbi Samlai: ‘How many deities created the world?’ He said to them: ‘Let you and I inquire into the early days.’ That is what is written: “For inquire now into the early days that were before you, from the day that God created [bara] man” (Deuteronomy 4:32) – “that [God] baru” is not written here, but rather, “that [God] bara.” They said to him: ‘What is this that is written: “In the beginning God [Elohim] created”?’ He said to them: “Baru Elohim” is not written here, but rather, “bara Elohim.” Rabbi Samlai said [moreover]: Everywhere you find a basis for a claim of the heretics, you find a refutation alongside it. They asked him further, saying to him: ‘What is this that is written: “Let us make Man in our image, in our likeness”?’ He said to them: ‘Read what is written thereafter: God created [vayivre’u] man in their image is not stated, but rather, “God created [vayivra] man in His image,”’ (Genesis 1:27). After they left, his students said to him: ‘Rabbi, those men you pushed off with a reed. What would you respond to us?’ He said to them: ‘In the past, Adam was created from earth and Eve was created from Adam. From now on, “In our image, in our likeness” – a man will not [produce offspring] without a woman, nor will a woman without a man, nor both of them without the Divine Presence.’", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "שאלו המינים את רבי שמלאי: כמה אלהות בראו את העולם? אמר להם: אני ואתם נשאל לימים הראשונים, הדא הוא דכתיב (דברים ד): כי שאל נא לימים ראשונים למן היום אשר ברא אלהים אדם, אשר בראו אין כתיב כאן, אלא אשר ברא. חזרו ושאלו אותו אמרו לו: מה הוא דין דכתיב בראשית ברא אלהים? אמר להם: בראו אלהים אין כתיב כאן, אלא ברא אלהים. אמר רבי שמלאי: בכל מקום שאתה מוצא פתחון פה למינין, אתה מוצא תשובה בצדה. חזרו ושאלו אותו אמרו לו: מה הוא דין דכתיב: נעשה אדם בצלמנו כדמותנו? אמר להון: קראון מה דבתריה, ויבראו אלהים את האדם בצלמיהם לא נאמר, אלא ויברא אלהים את האדם בצלמו. וכיון שיצאו אמרו לו תלמידיו רבי! לאלו דחית בקנה לנו מה את משיב? אמר להם: לשעבר אדם נברא מן האדמה, חוה נבראת מן האדם, מכאן ואילך בצלמנו כדמותנו, לא איש בלא אשה ולא אשה בלא איש ולא שניהם בלא שכינה.", "olang": "he", "source": "Bereshit Rabbah 8:9 (Vilna numbering)", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. A disputation, reported as a disputation, on exactly the two verses this crux is built on. The minim ask R. Simlai how many divinities created the world; he answers from Deut 4:32, bara and not baru; they come back with Gen 1:1, and he gives the same answer — baru Elohim is not written here but bara Elohim, which is R. Yitzḥak's argument at Bereshit Rabbah 1:7 word for word (see `br-1-7`); they come back with na'aseh adam be-tzalmenu, and he sends them to the next verse, va-yivra and not va-yivre'u. Between the second and third exchange he states the rule the whole passage exists to illustrate: wherever you find an opening for the minim, you find the refutation beside it. Three things follow for this daf. The singular-verb argument that K1 and this crux both carry as a piece of grammar is here a polemical instrument aimed at named opponents. Gen 1:1 and Gen 1:26 are treated as one question, which is the reason this Gen 1:26 material belongs on a Gen 1:1–2 daf at all. And the disciples are not satisfied — those men you pushed off with a reed; what will you answer us? — so the midrash itself marks the grammatical answer as a debating move rather than an explanation, and gives the students a different one: that from now on the image needs a man, a woman and the Shekhinah. […] The passage continues in the printed English with two further exchanges, on Josh 22:22 and Josh 24:19, which are the same manoeuvre on other verses; they are outside the Hebrew segment as Daat prints it and are elided here.", "slot": false}, {"id": "b-sanh-38b-malachim", "short": "b-sanh-38b-malachim", "author": "Babylonian Talmud", "tradition": "rabbinic", "date": 550, "datelabel": "redaction 500–600", "place": "Babylonia (Sura / Pumbedita)", "lat": 32.5, "lon": 44.4, "answers": ["counsel-with-the-household-above"], "senses": ["literal"], "lemma": {"he": "רְצוֹנְכֶם נַעֲשֶׂה אָדָם בְּצַלְמֵנוּ", "en": "Is it your will that we make a human in our image?"}, "en": "Rav Yehuda said, Rav said: at the hour when the Holy One, blessed be He, sought to create the human, he created one company of ministering angels. He said to them: is it your will that we make a human in our image? They said before him: Master of the world, what are his deeds? He said to them: such and such are his deeds. They said before him: Master of the world, 'what is a mortal, that you remember him, and a human being, that you take account of him?' (Ps 8:5). He put out his little finger among them and burned them. And so with the second company. The third company said before him: Master of the world, the ones who spoke before you first — what did they achieve? The whole world is yours; whatever you wish to do in your world, do.", "translator": "claude-draft", "orig": "אמר רב יהודה א\"ר בשעה שבקש הקב\"ה לבראות את האדם ברא כת אחת של מלאכי השרת אמר להם רצונכם נעשה אדם בצלמנו אמרו לפניו רבש\"ע מה מעשיו אמר להן כך וכך מעשיו אמרו לפניו רבש\"ע (תהלים ח, ה) מה אנוש כי תזכרנו ובן אדם כי תפקדנו הושיט אצבעו קטנה ביניהן ושרפם וכן כת שניה כת שלישית אמרו לפניו רבש\"ע ראשונים שאמרו לפניך מה הועילו כל העולם כולו שלך הוא כל מה שאתה רוצה לעשות בעולמך עשה", "olang": "arc", "source": "b. Sanhedrin 38b (Vilna)", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. The angel reading in its most literal and least apologetic form: God does not merely take counsel with the ministering angels, he puts the question to them in the words of the verse — retzonkhem na'aseh adam be-tzalmenu, is it your will that we make a human in our image — and when they object he burns them, twice, until a third company learns not to answer. Two things make this the sharpest rabbinic witness here. First, the plural of the verse is taken as a real address to real hearers, which is precisely the reading Basil calls a Jewish fiction, Ambrose refuses because a servant cannot be a partner in the work, Bede excludes by a ratio, and Bruno says would produce many creators; the Latin bench's characterisation of the position is, on this page, accurate. Second, the story concedes the objection the Latin bench presses: the angels contribute nothing, are destroyed for speaking, and are told the world is not theirs. The consultation is real and the partnership is not, which is a distinction no Latin witness on this daf considers.", "slot": false}, {"id": "b-sanh-38b-tshuva", "short": "b-sanh-38b-tshuva", "author": "Babylonian Talmud", "tradition": "rabbinic", "date": 550, "datelabel": "redaction 500–600", "place": "Babylonia (Sura / Pumbedita)", "lat": 32.5, "lon": 44.4, "answers": ["refutation-beside-the-claim", "one-authority-singular-verb", "against-the-heretics"], "senses": ["literal"], "lemma": {"he": "כָּל מָקוֹם שֶׁפָּקְרוּ הַמִּינִים תְּשׁוּבָתָן בְּצִידָּן", "en": "Everywhere the minim blasphemed, their refutation is beside them"}, "en": "Rabbi Yoḥanan said: everywhere the minim blasphemed, their refutation is beside them. 'Let us make a human in our image' (Gen 1:26) — and it says, 'and God created the human in his image' (Gen 1:27). 'Come, let us go down and confound their language there' (Gen 11:7) — 'and the LORD came down to see the city and the tower' (Gen 11:5). 'For there the divine beings were revealed to him' (Gen 35:7) — 'to the God who answers me in the day of my distress' (Gen 35:3).", "translator": "claude-draft", "orig": "א\"ר יוחנן כ\"מ שפקרו המינים תשובתן בצידן (בראשית א, כו) נעשה אדם בצלמנו (ואומר) (בראשית א, כז) ויברא אלהים את האדם בצלמו (בראשית יא, ז) הבה נרדה ונבלה שם שפתם (בראשית יא, ה) וירד ה' לראות את העיר ואת המגדל (בראשית לה, ז) כי שם נגלו אליו האלהים (בראשית לה, ג) לאל העונה אותי ביום צרתי", "olang": "arc", "source": "b. Sanhedrin 38b (Vilna)", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. The rule of R. Simlai at Bereshit Rabbah 8:9 stated as a rule and then run down a list, and the list is what matters here. Three verses where God speaks or is spoken of in the plural, each with the singular that follows it set beside it as its own answer: na'aseh adam against va-yivra, havah nerdah at Babel against va-yered YHWH, niglu elav ha-Elohim against la-El ha-oneh oti. The first two are exactly the pair Augustine takes up at De civitate Dei XVI.6 in a chapter headed what kind of speech is to be understood, by which God speaks to the angels, where Gen 1:26 is refused to the angels because of the image clause and Gen 11:7 is granted to them because there is nothing to prevent it; and they are exactly the pair the Glossa Ordinaria joins at PL 113:114D, glossing venite at Babel by faciamus hominem and answering both with their singulars. Three benches select the same two verses out of the whole Pentateuch and apply the same test to them. Nobody is reading anybody. The selection is forced by the Hebrew, and the disagreement is only about what the plural was doing there in the first place. Note the word: pakru, they blasphemed or broke loose — a harder verb than the she'elu, they asked, of the midrash's version, and the Bavli has dropped the disputation and kept the rule.", "slot": false}, {"id": "rashi-1-26-anvetanuto", "short": "rashi-1-26-anvetanuto", "author": "Rashi", "tradition": "rabbinic", "date": 1090, "datelabel": "1075–1105", "place": "Troyes", "lat": 48.3, "lon": 4.08, "answers": ["counsel-with-the-household-above"], "senses": ["literal"], "lemma": {"he": "עַנְוְתָנוּתוֹ שֶׁל הַקָּבָּ\"ה לָמַדְנוּ מִכָּאן", "en": "The humility of the Holy One, blessed be He, we learn from here"}, "en": "נעשה אדם WE WILL MAKE MAN — The meekness of the Holy One, blessed be He, they (the Rabbis) learned from here: because the man is in the likeness of the angels and they might envy him, therefore He took counsel with them (Midrash Tanchuma, Shemot 18 and see Genesis Rabbah 8). And when He judges the kings He likewise consults His heavenly council, for thus we find in the case of Ahab to whom Micha said, (1 Kings 22:19) “I saw the Lord sitting on His throne, and all the host of heaven standing by Him on His right hand and on His left.” Has God, then, a right hand and a left hand? But it means that some stood on the right side to plead in favour of the accused and others stood on the left side to accuse; and similarly we read (Daniel 4:14), “the matter is by the decree of the watchers, and the sentence by the word of the holy ones”, — here, also, He consulted His heavenly council and asked permission of them, saying to them: “There are in the heavens beings after My likeness; if there will not be on earth also beings after My likeness, there will be envy among the beings that I have created” (Sanhedrin 38b).", "translator": "M. Rosenbaum and A. M. Silbermann, 1929–34", "orig": "נעשה אדם. עַנְוְתָנוּתוֹ שֶׁל הַקָּבָּ\"ה לָמַדְנוּ מִכָּאן, לְפִי שֶׁאָדָם הוּא בִּדְמוּת הַמַּלְאָכִים וְיִתְקַנְּאוּ בוֹ, לְפִיכָךְ נִמְלַךְ בָּהֶם, וּכְשֶׁהוּא דָן אֶת הַמְּלָכִים הוּא נִמְלָךְ בְּפָמַלְיָא שֶׁלּוֹ, שֶׁכֵּן מָצִינוּ בְאַחְאָב, שֶׁאָמַר לוֹ מִיכָה רָאִיתִי אֶת ה' יֹשֵׁב עַל כִּסְאוֹ וְכָל צְבָא הַשָּׁמַיִם עוֹמְדִים עָלָיו מִימִינוֹ וּמִשְּׂמֹאלוֹ (מלכים א כ\"ב), וְכִי יֵש יָמִין וּשְׂמֹאל לְפָנָיו? אֶלָּא אֵלּוּ מַיְמִינִים לִזְכוּת וְאֵלוּ מַשְׂמְאִילִים לְחוֹבָה, וְכֵן בִּגְזֵרַת עִירִין פִּתְגָמָא וּבְמֵאמַר קַדִּישִׁין שְׁאֵלְתָא (דניאל ד'), אַף כָּאן בְּפָמַלְיָא שֶׁלוֹ נָטַל רְשׁוּת, אָמַר לָהֶם יֵשׁ בָּעֶלְיוֹנִים כִּדְמוּתִי; אִם אֵין כִּדְמוּתִי בַתַּחְתּוֹנִים הֲרֵי יֵשׁ קִנְאָה בְמַעֲשֵׂה בְרֵאשִׁית:", "olang": "he", "source": "Rashi on Gen 1:26, s.v. נעשה אדם (first comment)", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. Rashi takes the angel reading as the plain sense and gives it a motive: anvetanuto shel ha-Qadosh barukh Hu, the humility of the Holy One, learned from this verse. Because the human is in the likeness of the angels and they might be envious, he took counsel with them; and this is his habit, for Micaiah saw the LORD on his throne with all the host of heaven standing to his right and his left (1 Kgs 22:19), which cannot be a right and a left but is a court, some arguing for acquittal and some for guilt, and Daniel's decree of the watchers is the same court. The word he uses for it is pamalya shel ma'alah, the household above, from the Latin familia — so that the Latin bench's senatus and the rabbinic bench's imperial household are the same borrowed picture of a court, used to opposite ends. That God natal reshut, took leave, from his own retinue is the strongest form of the reading anywhere on this daf, and Rashi will spend his second comment defending it against the obvious objection.", "slot": false}, {"id": "rashi-1-26-minim", "short": "rashi-1-26-minim", "author": "Rashi", "tradition": "rabbinic", "date": 1090, "datelabel": "1075–1105", "place": "Troyes", "lat": 48.3, "lon": 4.08, "answers": ["refutation-beside-the-claim", "one-authority-singular-verb", "counsel-with-the-household-above"], "senses": ["literal"], "lemma": {"he": "וּתְשׁוּבַת הַמִּינִים כָּתַב בְּצִדּוֹ, וַיִּבְרָא אֶת הָאָדָם, וְלֹא כָתַב וַיִּבְרְאוּ", "en": "and the refutation of the minim he wrote beside it: 'and he created the human', and he did not write 'and they created'"}, "en": "נעשה אדם WE WILL MAKE MAN — Although they did not assist Him in forming him (the man) and although this use of the plural may give the heretics an occasion to rebel (i. e. to argue in favour of their own views), yet the verse does not refrain from teaching proper conduct and the virtue of humbleness, namely, that the greater should consult, and take permission from the smaller; for had it been written, “I shall make man”, we could not, then, have learned that He spoke to His judicial council but to Himself. And as a refutation of the heretics it is written immediately after this verse “And God created the man”, and it is not written “and they created” (Genesis Rabbah 8:9)", "translator": "M. Rosenbaum and A. M. Silbermann, 1929–34", "orig": "נעשה אדם. אַעַ\"פִּ שֶׁלֹּא סִיְּעוּהוּ בִיצִירָתוֹ וְיֵשׁ מָקוֹם לַמִּינִים לִרְדּוֹת, לֹא נִמְנַע הַכָּתוּב מִלְּלַמֵּד דֶרֶך אֶרֶץ וּמִדַּת עֲנָוָה שֶׁיְּהֵא הַגָּדוֹל נִמְלָךְ וְנוֹטֵל רְשׁוּת מִן הַקָּטָן; וְאִם כָּתַב אֶעֱשֶׂה אָדָם, לֹא לָמַדְנוּ שֶׁיְּהֵא מְדַבֵּר עִם בֵּית דִינוֹ, אֶלָּא עִם עַצְמוֹ, וּתְשׁוּבַת הַמִּינִים כָּתַב בְּצִדּוֹ, וַיִּבְרָא אֶת הָאָדָם, וְלֹא כָתַב וַיִּבְרְאוּ:", "olang": "he", "source": "Rashi on Gen 1:26, s.v. נעשה אדם (second comment)", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. The objection and the answer, in a hundred words, and it is the whole of this crux compressed. The objection: the angels did not help, and the plural gives the minim room to rebel. The answer is in three parts. Scripture did not refrain, because the point was to teach derekh eretz and the measure of humility, that the great should consult and take leave of the lesser. Had it written e'eseh adam, we should not have learned that he speaks with his court but only with himself — which is Ambrose's non dicit faciam, sed faciamus at Milan, the identical grammatical observation put to the identical use of ruling out a soliloquy, and to the opposite conclusion about who is being addressed. And the refutation of the minim was written beside it: va-yivra et ha-adam, and he did not write va-yivre'u, which is R. Simlai's rule and answer from Bereshit Rabbah 8:9. Rashi at Troyes about 1090 is thus doing openly what no Latin witness on this daf does: he names the risk the verse carries, weighs it against what the verse teaches, and decides that the teaching is worth the opening. Whether the minim he has in mind are the Christians of northern France is not said here and is not needed: the grammatical opening is the same one Abelard will exploit at the Paraclete forty years later.", "slot": false}, {"id": "ibn-ezra-1-26-naaseh", "short": "ibn-ezra-1-26-naaseh", "author": "Abraham ibn Ezra", "tradition": "rabbinic", "date": 1155, "datelabel": "c. 1155", "place": "Lucca", "lat": 43.84, "lon": 10.5, "answers": ["plural-of-majesty-refused", "faciamus-to-the-angels"], "senses": ["literal"], "lemma": {"he": "וְאֵלֶּה הָעֵדִים עֵדֵי שֶׁקֶר הֵם", "en": "and these witnesses are false witnesses"}, "en": "And he said [further] that the word na’aseh, though it is in plural, is the manner of royal speak [i.e., the plural of majesty]. Similarly, “we shall give nitnah to you also this one” Genesis 29:27. “We say before the king” Daniel 2:36, “perhaps I will be able and we will smite him” Numbers 22:6. But these witnesses are false witnesses, for nitnah is [actually] the nif’al verb construction, and similarly “the city is given” nitnah Jeremiah 32:24, and the vav converts it to the future tense, like is the rule with all past-tense verbs, meaning “she will be given to you”. And “we shall smite him” – he [Balak] and his camp, or it could be the infinitive of the verb, like “clease nakeh, I shall not clease you” Jeremiah 46:28. And even though we do find “they were not smitten” Exodus 9:32, [nevertheless], only that verb construction (pu'al) lacks an infinitive form – and R. Moshe of Spain erred in his book [on this matter]. And the word “we shall say (before the king)” Daniel 2:37 is Aramaic, and [further], how could Daniel speak hautily with Nebuchadnezzar, who was the king of kings? Now I shall explain: Know that all of the work of creation was created for the honor of man at the command of Hashem. The plants – the earth and the water brought them forth, and all the living souls [i.e., the animals]. And afterwards, Hashem said to the angels, “let US make man” – WE will busy ourselves with him, not the water and the earth.", "translator": "Sefaria Community Translation", "orig": "ואמר במלת נעשה, ואם היא לשון רבים, שכן מנהג המלכים לדבר, וכמוהו וְנִתְּנָה לך גם את זאת (בראשית כח כז), \"נאמר קדם מלכא (דניאל ב לו) \"אולי אוכל נכה בו\" (במדבר כב ו), ואלה העדים עדי שקר הם, כי \"ונתנה לך\" בנין נפעל, וכמוהו \"והעיר נתנה\" (ירמיה לב כד), והוי\"ו השיבו לעתיד כמשפט כל פעל עבר, והטעם וַתִנָתַן לך \"ונכה בו\" הוא ומחנהו, או יהיה שם הפועל כמו \"ונקה לא אנקך\" (ירמיה מו כח) ואף כי שמצאנו \"לא נכו\" (שמות ט, לב) כי לא יבוא בנין שלא נזכר שם פועלו, כי אם מהכבד, ור' משה הכהן הספרדי טעה בספרו, ומלת \"נאמר קדם מלכא\" (דניאל ב לו) ארמית היא ואיך ידבר דניאל בלשון גדולה עם נבוכדנצר שהיה מלך מלכים, ועתה אפרש, דע כי כל מעשה בראשית, לכבוד האדם נברא במצות השם, והצמחים הוציאה אותם הארץ והמים, וכל נפשות החיות, ואח\"כ אמר השם למלאכים, נעשה אדם, אנחנו נתעסק בו, ולא המים והארץ", "olang": "he", "source": "Ibn Ezra on Gen 1:26, s.v. נעשה אדם", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. The finding of this session, and it is a correction to what the daf would otherwise say about Ibn Ezra. At Gen 1:1 he explains the plural Elohim as the honorific plural — every language honours the great with a plural, as adonim and be'alim are plural for one master, and as a king in Arabic speaks of himself in the plural (see `ibn-ezra-1-1-elohim`). Here, on the plural verb, he is offered the same explanation by Saadia Gaon — na'aseh is the manner of royal speech, with Gen 29:27, Dan 2:36 and Num 22:6 for proofs — and he demolishes it: ve-elleh ha-edim edei sheker hem, and these witnesses are false witnesses. Each proof text is parsed away, nitnah as a nifal and not a first person plural, nakkeh bo as Balak and his camp or else an infinitive; R. Moshe ha-Kohen is told he erred in his book; and Daniel could not have used a plural of grandeur to the king of kings. Then his own answer: God said to the angels, let us make a human — we shall occupy ourselves with him, and not the water and the earth, which had brought forth the plants and the animals. So the grammarian who takes the plural noun to be empty takes the plural verb to be full, and full in the way the Latin bench most objects to. The two positions are not inconsistent — a plural of honour is a fact about nouns, and na'aseh has a real subject — but only a reader who has both pages can see that Ibn Ezra's answer to this crux is the angel reading.", "slot": false}, {"id": "ramban-1-26-naaseh", "short": "ramban-1-26-naaseh", "author": "Moses ben Naḥman (Naḥmanides)", "tradition": "rabbinic", "date": 1267, "datelabel": "1263–1270", "place": "Girona", "lat": 41.98, "lon": 2.82, "answers": ["i-and-the-earth"], "senses": ["literal"], "lemma": {"he": "אֲנִי וְהָאָרֶץ הַנִּזְכֶּרֶת נַעֲשֶׂה אָדָם", "en": "I and the aforementioned earth, let us make a human"}, "en": "The correct explanation of na’aseh (let us make) [which is in the plural form when it should have been in the singular] is as follows: It has been shown to you that G-d created something from nothing only on the first day, and afterwards He formed and made things from those created elements. Thus when He gave the waters the power of bringing forth a living soul, the command concerning them was Let the waters swarm. The command concerning cattle was Let the earth bring forth. But in the case of man He said, Let us make, that is, I and the aforementioned earth, let us make man, the earth to bring forth the body from its elements as it did with cattle and beasts, as it is written, And the Eternal G-d formed man of the dust of the ground, and He, blessed be He, to give the spirit from His mouth, the Supreme One, as it is written, And He breathed into his nostrils the breath of life. And He said, In our image, and after our likeness, as man will then be similar to both. In the capacity of his body, he will be similar to the earth from which he was taken, and in spirit he will be similar to the higher beings, because it [the spirit] is not a body and will not die. In the second verse, He says, In the image of G-d He created him, in order to relate the distinction by which man is distinguished from the rest of created beings. The explanation of this verse I have found ascribed to Rabbi Joseph the Kimchite, and is the most acceptable of all interpretations that have been advanced concerning it.", "translator": "Charles B. Chavel, 1971–76", "orig": "וְהַפְּשָׁט הַנָּכוֹן בְּמִלַּת \"נַעֲשֶׂה\" הוּא מִפְּנֵי שֶׁכְּבָר הָרְאֵיתָ לָדַעַת (רמב\"ן על בראשית א':א') כִּי הָאֱלֹהִים בָּרָא יֵשׁ מֵאַיִן בַּיּוֹם הָרִאשׁוֹן לְבַדּוֹ, וְאַחַר כָּךְ מִן הַיְּסוֹדוֹת הָהֵם הַנִּבְרָאִים יָצַר וְעָשָׂה, וְכַאֲשֶׁר נָתַן בַּמַּיִם כֹּחַ הַשֵּׁרוּץ לִשְׁרֹץ נֶפֶשׁ חַיָּה, וְהָיָה הַמַּאֲמָר בָּהֶם \"יִשְׁרְצוּ הַמַּיִם\" (בראשית א':כ'), וְהָיָה הַמַּאֲמָר בַּבְּהֵמָה \"תּוֹצֵא הָאָרֶץ\" (בראשית א':כ\"ד), אָמַר בָּאָדָם \"נַעֲשֶׂה\", כְּלוֹמַר אֲנִי וְהָאָרֶץ הַנִּזְכֶּרֶת נַעֲשֶׂה אָדָם, שֶׁתּוֹצִיא הָאָרֶץ הַגּוּף מִיְּסֹדֶיהָ כַּאֲשֶׁר עָשְׂתָה בַּבְּהֵמָה וּבַחַיָּה, כְּדִכְתִיב (בראשית ב':ז') \"וַיִּיצֶר ה' אֱלֹהִים אֶת הָאָדָם עָפָר מִן הָאֲדָמָה\", וְיִתֵּן הוּא יִתְבָּרַךְ הָרוּחַ מִפִּי עֶלְיוֹן, כְּדִכְתִיב (שם) \"וַיִּפַּח בְּאַפָּיו נִשְׁמַת חַיִּים\". וְאָמַר \"בְּצַלְמֵנוּ כִּדְמוּתֵנוּ\", כִּי יִדְמֶה לִשְׁנֵיהֶם, בְּמַתְכֹּנֶת גּוּפוֹ לָאָרֶץ אֲשֶׁר לֻקַּח מִמֶּנָּה, וְיִדְמֶה בָּרוּחַ לָעֶלְיוֹנִים, שֶׁאֵינָהּ גּוּף וְלֹא תָּמוּת. וְאָמַר בַּכָּתוּב הַשֵּׁנִי בְּצֶלֶם אֱלֹהִים בָּרָא אֹתוֹ (בראשית א':כ\"ז), לְסַפֵּר הַפֶּלֶא אֲשֶׁר נִפְלָא בּוֹ מִשְּׁאָר הַנִּבְרָאִים. וְזֶה פְּשַׁט הַמִּקְרָא הַזֶּה מְצָאתִיו לְרַבִּי יוֹסֵף הַקִּמְחִי, וְהוּא הַנִּרְאֶה מִכָּל מָה שֶׁחָשְׁבוּ בּוֹ.", "olang": "he", "source": "Ramban on Gen 1:26, s.v. נעשה אדם", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. A fourth answer, and the only one on either bench that keeps the plural literal and puts a creature in it without putting an angel in it. Ramban argues from the order of the chapter: God created something from nothing on the first day only, and afterwards formed and made from what he had created, so that the waters were told to swarm and the earth to bring forth. At the human the formula changes because the two agents are named together — ani ve-ha-aretz ha-nizkeret na'aseh adam, I and the aforementioned earth, let us make a human — the earth to bring forth the body from its elements as it did for the beasts, and the Holy One to give the spirit, as Gen 2:7 then says twice over. Be-tzalmenu ki-dmutenu follows exactly: the human will resemble both, his body the earth he was taken from and his spirit the beings above. He credits the reading to R. Yosef Kimḥi and calls it the most acceptable of all that have been thought about the verse — a phrase that quietly sets aside Rashi's angels, which he does not name here. Ramban's answer at Gen 1:1 was that Elohim is el hem, the force of all the forces, with a secret not disclosed; his answer here needs no secret at all, and no plurality in God whatever.", "slot": false}, {"id": "targ-onk-1-26", "short": "targ-onk-1-26", "author": "Targum Onkelos", "tradition": "rabbinic", "date": 200, "datelabel": "100–300", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["one-authority-singular-verb"], "senses": ["translation"], "lemma": {"he": "וַאֲמַר יְיָ נַעֲבִיד אֱינָשָׁא", "en": "And the LORD said, let us make a human"}, "en": "And the LORD said: let us make a human in our image, as our likeness; and let them rule over the fish of the sea and over the bird of the heavens and over the cattle and over all the earth and over every creeping thing that creeps upon the earth.", "translator": "claude-draft", "orig": "וַאֲמַר יְיָ נַעֲבִיד אֶינָשָׁא בְּצַלְמֵנָא כִּדְמוּתָנָא וְיִשְׁלְטוּן בְּנוּנֵי יַמָּא וּבְעוֹפָא דִּשְׁמַיָּא וּבִבְעִירָא וּבְכָל אַרְעָא וּבְכָל רִחֲשָׁא דְּרָחֵשׁ עַל אַרְעָא", "olang": "arc", "source": "Targum Onkelos, Gen 1:26", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. Evidence by omission, and it only reads as evidence next to the same targum's Gen 1:1. There Onkelos writes YY for Elohim, the Tetragrammaton, which is not plural in form, so that a reader of the Aramaic cannot raise the question of two authorities from the noun at all (see `targ-onk-1-1`). Here the plural verb is left standing: na'avid enasha be-tzalmana ki-dmutana — let us make a human in our image, as our likeness — with nothing added, nobody addressed, and no angels. The one difficulty the Aramaic could have removed as easily as the other, and did not. Whatever governed Onkelos's hand at Gen 1:1, it was not a general policy of smoothing plurals out of the creation account; and Pseudo-Jonathan, working on the same verse in the same language, does add the angels in so many words.", "slot": false}, {"id": "targ-psj-1-26", "short": "targ-psj-1-26", "author": "Targum Pseudo-Jonathan", "tradition": "rabbinic", "date": 750, "datelabel": "600–800", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["faciamus-to-the-angels"], "senses": ["translation"], "lemma": {"he": "וַאֲמַר יְיָ לְמַלְאָכַיָא דִמְשַׁמְשִׁין קוֹמוֹי", "en": "And the LORD said to the angels who minister before him"}, "en": "And the Lord said to the angels who ministered before Him, who had been created in the second day of the creation of the world, Let us make man in Our image, in Our likeness; and let them rule over the fish of the sea, and over the fowl which are in the atmosphere of heaven, and over the cattle, and over all the earth, and over every reptile creeping upon the earth.", "translator": "J. W. Etheridge, 1862", "orig": "וַאֲמַר יְיָ לְמַלְאָכַיָא דִמְשַׁמְשִׁין קוֹמוֹי דְאִיתְבְּרִי בְּיוֹם תִּנְיָן לִבְרִיַית עַלְמָא נַעֲבֵיד אָדָם בְּצַלְמָנָא בִּדְיוֹקְנָנָא וְיִשְׁלְטוּן בְּכַוְורֵי יַמָא וּבְעוֹפָא דְאַוִיר שְׁמַיָא וּבִבְעִירָא וּבְכָל אַרְעָא וּבְכָל רִיחֲשָׁא דִרְחֵישׁ עֲלוֹי אַרְעָא", "olang": "arc", "source": "Targum Pseudo-Jonathan, Gen 1:26", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. The angel reading written into the text of Scripture itself, which is as far as the rabbinic answer to this crux can be pushed. Where the Hebrew has 'and God said, let us make', Pseudo-Jonathan has 'and the LORD said to the angels who minister before him, who were created on the second day of the creation of the world, let us make a human in our image, in our likeness'. Two additions, and the second is doing work: dating the angels to the second day forestalls the objection that they might have been co-creators, since they were made after the beginning and are therefore creatures like the rest. The Glossa Ordinaria at PL 113:114D says ad angelos dixisse intelligitur — he is understood to have said it to the angels — of the plural at Babel, and cross-refers to faciamus hominem; a Latin reader of the twelfth century and an Aramaic reader of the eighth are looking at the same plural and reaching for the same hearers. That the targum puts it in the biblical line rather than in a gloss is why Basil could say ferunt enim, quod angelis dixerit and be reporting rather than caricaturing.", "slot": false}, {"id": "ambrose-hex-1-8-29", "short": "Ambrose", "author": "Ambrose", "tradition": "latin", "date": 387, "datelabel": "c. 387", "place": "Milan", "lat": 45.46, "lon": 9.19, "answers": ["brooding-warmth", "trinity"], "senses": ["literal"], "lemma": {"la": "Syrus … sic habet: Et Spiritus Dei fovebat aquas", "en": "the Syriac has: And the Spirit of God warmed the waters"}, "en": "…especially since there follows: 'And the Spirit of God was borne above the waters.' Some take this as the air, others as the breath we draw and take in, the breath of this life-giving atmosphere; but we, agreeing with the judgment of the saints and the faithful, take it as the Holy Spirit, so that in the founding of the world the working of the Trinity may shine out. […] Finally the Syriac, which is neighbor to the Hebrew and in most things agrees and chimes with it in wording, has it thus: 'And the Spirit of God warmed the waters,' that is, quickened them, so as to gather them into new creatures and by his warmth bring them alive. For we also read that the Holy Spirit is creator, Job saying, 'The divine Spirit who made me' (Job 33:4).", "translator": "claude-draft-approved", "orig": "maxime cum sequatur: Et spiritus Dei superferebatur super aquas (Ibid.) . Quem etsi aliqui pro aere accipiant, aliqui pro spiritu quem spiramus et carpimus aurae hujus vitalis spiritum; nos tamen cum sanctorum et fidelium sententia congruentes, Spiritum sanctum accipimus, ut in constitutione mundi operatio Trinitatis eluceat. Praemisso enim quia in principio fecit Deus coelum et terram, id est in Christo fecit Deus, vel Filius Dei Deus fecit, vel per Filium Deus fecit; quia omnia per ipsum facta sunt, et sine ipso factum est nihil, supererat plenitudo operationis in Spiritu, sicut scriptum est: Verbo Domini coelis firmati sunt, et Spiritu oris ejus omnis virtus eorum (Ps. XXXII, 6) . Itaque quemadmodum in Psalmo docemur operationem Verbi, quod est Verbum Dei, et virtutem quam dedit Spiritus sanctus; ita hic propheticum resultavit oraculum, quia Deus dixit, et Deus fecit. Spiritus quoque Dei superferebatur super aquas. Ornando enim polo coeli, germinaturis terris pulchre Spiritus superferebatur, quia per ipsum habebant novorum partuum semina germinare, secundum quod dixit propheta: 17 Emitte Spiritum tuum et creabuntur, et renovabis faciem terrae (Ps. CIII, 30) . Denique Syrus, qui vicinus Hebraeo est, et sermone consonat in plerisque et congruit, sic habet: Et Spiritus Dei fovebat aquas, id est vivificabat, ut in novas cogeret creaturas, et fotu suo animaret ad vitam. Nam etiam Spiritum sanctum legimus creatorem, dicente Job, Spiritus divinus qui fecit me (Job. XXXIII, 4) .", "olang": "la", "source": "PL 14, col. 138C", "notes": "Ambrose is reading Basil's Greek directly (Milan, 387; Eustathius' Latin is later). He carries the Syriac 'warmed' but drops the hen. The Latin excerpt here spans two columns; the middle (Ps 33:6 on Word and Spirit) is elided in the English.", "slot": false}, {"id": "aug-conf-13-9-10", "short": "Augustine, Conf. XIII", "author": "Augustine", "tradition": "latin", "date": 400, "datelabel": "c. 400", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["love-gift"], "senses": ["literal", "spiritual"], "lemma": {"la": "Cur solus Spiritus sanctus superferebatur super aquas", "en": "Why only the Holy Spirit was borne above the waters"}, "en": "Was not the Father, or the Son, borne above the waters too? If we mean by place, as a body is, then neither was the Holy Spirit; but if we mean the eminence of unchangeable Godhead over everything changeable, then Father and Son and Holy Spirit were borne above the waters. Why then is this said only of your Spirit? Why of him alone? As if there were a place there, where there is no place, for him alone of whom it is said that he is your gift. In your gift we rest; there we enjoy you. Our rest is our place. Love lifts us there, and your good Spirit raises our lowliness from the gates of death. In good will is our peace. A body by its weight strives toward its own place. Weight is not only toward what is lowest, but toward its own place. Fire tends upward, a stone downward. They are driven by their weights; they seek their places.", "translator": "claude-draft-approved", "orig": "Numquid aut Pater aut Filius non superferebatur super aquas? Si tanquam loco sicut corpus, nec Spiritus sanctus: si autem incommutabilis divinitatis eminentia super omne mutabile, et Pater et Filius et Spiritus sanctus superferebatur super aquas. Cur ergo tantum de Spiritu tuo dictum est hoc? cur de illo tantum dictum est? Quasi locus ibi esset, qui non est locus, de quo solo dictum est quod sit donum tuum. In dono tuo requiescimus; ibi te fruimur. Requies nostra, locus noster. Amor illuc attollit nos, et Spiritus tuus bonus exaltat humilitatem nostram de portis mortis (Psal. IX, 15) . In bona voluntate pax nobis est (Luc. II, 14) . Corpus pondere suo nititur ad locum suum. Pondus non ad ima tantum est, sed ad locum suum. Ignis sursum tendit, deorsum lapsis. Ponderibus suis aguntur, loca sua petunt.", "olang": "la", "source": "PL 32, col. 848", "notes": "The question turned inward: not what 'above' means but why the Spirit alone is said to be above. Answer: because the Spirit is gift, and love is weight. 'Pondus meum amor meus' follows a few lines on.", "slot": false}, {"id": "aug-gnl-1-5-11", "short": "aug-gnl-1-5-11", "author": "Augustine", "tradition": "latin", "date": 401, "datelabel": "401–415", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["power-not-place", "love-gift", "trinity"], "senses": ["literal"], "lemma": {"la": "non ex indigentia, sed ex beneficentia veniens amor", "en": "a love that comes not from need but from bounty"}, "en": "Therefore, before it was written 'God said, Let there be light,' Scripture went before it, saying, 'And the Spirit of God was borne above the water.' For whether by the name of water he meant the whole of corporeal matter, so as to intimate by that means whence all the things we can now distinguish in their kinds were made and formed (calling it water because we see everything on earth formed and grown together out of a moist nature through its various species), or a kind of spiritual life, floating as it were before the form of its turning: in either case the Spirit of God was borne above, because whatever it was that he had begun, to be formed and perfected, lay beneath the good will of the Creator; so that when God said in his Word, 'Let there be light,' what was made might abide in his good will, that is in his good pleasure, after the measure of its kind; and so it is right that it pleased God, Scripture saying, 'And light was made; and God saw the light, that it was good.' […] But why, after the creature had first been mentioned, imperfect as it was, is the Spirit of God mentioned afterwards, Scripture first saying 'But the earth was invisible and unordered, and darkness was over the abyss,' and then bringing in 'And the Spirit of God was borne above the water'? Is it because a needy and destitute love so loves that it is subjected to the things it loves; and therefore, when the Spirit of God was mentioned, in whom his holy benevolence and love are understood, he was said to be borne above, lest God should be thought to love the works he was to make out of the necessity of want rather than out of the abundance of bounty?", "translator": "claude-draft-approved", "orig": "Propterea priusquam scriberetur, Dixit Deus, Fiat lux; praecessit Scriptura dicens, Et Spiritus Dei superferebatur super aquam. Quia sive aquae nomine appellare voluit totam corporalem materiam, ut eo modo insinuaret unde facta et formata sint omnia, quae in suis generibus jam dignoscere possumus, appellans aquam, quia ex humida natura videmus omnia in terra per species varias formari atque concrescere; sive spiritualem vitam quamdam ante formam conversionis quasi fluitantem: superferebatur utique Spiritus Dei; quia subjacebat scilicet bonae voluntati Creatoris, quidquid illud erat quod formandum perficiendumque inchoaverat: ut dicente Deo in Verbo suo, Fiat lux; in bona voluntate, hoc est in beneplacito ejus pro modulo sui generis maneret quod factum est; et ideo rectum est, quod placuerit Deo, Scriptura dicente, Et facta est lux; et vidit Deus lucem quia bona est. CAPUT VI.-- Trinitas insinuata cum in inchoatione, tum in perfectione creaturae. 12. Ut quemadmodum in ipso exordio inchoatae creaturae, quae coeli et terrae nomine, propter id quod de illa perficiendum erat, commemorata est, Trinitas insinuatur Creatoris (nam dicente Scriptura, In principio fecit Deus coelum et terram; intelligimus Patrem in Dei nomine, et Filium in principii nomine, qui non Patri, sed per seipsum creatae primitus ac potissimum spirituali creaturae, et consequenter etiam universae creaturae principium est: dicente autem Scriptura, Et Spiritus Dei ferebatur super aquam, completam commemorationem Trinitatis agnoscimus); ita et in conversione atque perfectione creaturae, ut rerum species digerantur, eadem Trinitas insinuetur: Verbum Dei scilicet, et Verbi generator, cum dicitur, Dixit Deus; et sancta bonitas, in qua Deo placet quidquid ei pro suae naturae modulo perfectum placet, cum dicitur, Vidit Deus quia bonum est. CAPUT VII.-- Spiritus Dei cur dictus est superferri super aquam. 13. Sed cur commemorata prius quamvis imperfecta creatura, postea commemoratur Spiritus Dei, prius dicente Scriptura, Terra autem erat invisibilis et incomposita, et tenebrae erant super abyssum ; ac deinde inferente, Et Spiritus Dei superferebatur super aquam? An quoniam egenus atque indigus amor ita diligit, ut rebus quas diligit, subjiciatur; propterea cum commemoraretur Spiritus Dei, in quo sancta ejus benevolentia dilectioque intelligitur, superferri dictus est, ne facienda opera sua per indigentiae necessitatem potius quam per abundantiam beneficentiae Deus amare putaretur?", "olang": "la", "source": "PL 34, col. 250", "notes": "The passage the Glossa quotes in its margin on 1:2 (as 'lib. I de Gen. ad lit., c. 5'). Two answers at once: water is matter or formless spiritual life, and the Spirit is 'above' because divine love is not needy. The middle chapter, which finds the Trinity in the verse, is elided in the English.", "slot": false}, {"id": "bede-gen-1-2", "short": "Bede", "author": "Bede", "tradition": "latin", "date": 720, "datelabel": "c. 720", "place": "Jarrow", "lat": 54.98, "lon": -1.49, "answers": ["trinity"], "senses": ["literal"], "lemma": {"la": "totius simul Trinitatis in creatione mundi virtutem", "en": "the power of the whole Trinity together in the creation of the world"}, "en": "And rightly, having first declared that in the beginning, that is, in the Son, the Father made heaven and earth, he brought in mention of the Holy Spirit too by adding, 'And the Spirit of God was borne above the waters,' so as to signify that the power of the whole Trinity together worked in the creation of the world.", "translator": "claude-draft-approved", "orig": "Bene autem cum in principio Deum, id est, in Filio Patrem fecisse coelum et terram praediceret, etiam sancti Spiritus intulit mentionem addendo: Et Spiritus Dei superferebatur super aquas, ut videlicet totius simul Trinitatis in creatione mundi virtutem cooperatam esse signaret.", "olang": "la", "source": "PL 91, col. 16C", "notes": "Bede has no bird and no Syrian on this verse: his 1:2 is Trinitarian (K3). Included here because Rabanus copies this sentence verbatim and it becomes the Glossa's spine.", "slot": false}, {"id": "comestor-hs-1-1", "short": "comestor-hs-1-1", "author": "Peter Comestor", "tradition": "latin", "date": 1170, "datelabel": "1169–1173", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["read-it-twice", "principio-in-filio", "principio-temporis", "principio-first-of-all"], "senses": ["literal", "allegorical"], "lemma": {"la": "iterandum est in principio", "en": "'in the beginning' is to be repeated"}, "en": "But Moses prophesied God alone to be eternal, and the world created without pre-existing matter. And it was created in the beginning, that is, in the Son; and 'in the beginning' is to be repeated thus: In the beginning God created heaven and earth, in the beginning, namely, of time. For the world and time are coeval. And as God alone is eternal, so the world is everlasting, that is, always eternal, eternal in a temporal way; the angels too are everlasting. Or: in the beginning of all creatures he created heaven and earth, that is, he made these primordial creatures, and made them at once.", "translator": "claude-draft-approved", "orig": "Moyses vero solum Deum aeternum prophetavit, et sine praejacenti materia mundum creatum. Creatus autem est in principio, id est in Filio, et iterandum est in principio sic: In principio creavit Deus coelum et terram, in principio scilicet temporis. Coaeva enim sunt mundus et tempus. Sicut autem solus Deus aeternus, sic mundus sempiternus, id est semper aeternus, temporaliter aeternus angeli quoque sempiterni. Vel in principio omnium creaturarum, creavit coelum et terram, id est has creaturas primordiales fecit, et simul.", "olang": "la", "source": "PL 198, col. 1056A", "notes": "The settlement, stated as a rule of reading: iterandum est in principio — say the phrase twice. Once it means in the Son, once it means at the beginning of time, and Comestor then adds Bruno's third sense as an alternative, in the beginning of all creatures. Augustine had listed the three as questions; the handbook that taught Europe the Bible for three hundred years prints all three as the answer and instructs the reader to take the words over again for each. Note the distinction Comestor needs and that the English must keep: God alone is aeternus, the world and the angels are sempiternus, everlasting — 'eternal in a temporal way'. The preceding columns, where he sets Plato, Aristotle and Epicurus against Moses, are not sliced here; that doxography is Remigius' material and belongs with K4.", "slot": false}, {"id": "glossa-1-2-ruach", "short": "Glossa (slot)", "author": "Glossa ordinaria (school of Laon)", "tradition": "latin", "date": 1120, "datelabel": "compilation 1110–1130", "place": "Laon", "lat": 49.56, "lon": 3.62, "answers": ["power-not-place", "brooding-warmth", "trinity", "heart"], "senses": ["literal", "allegorical"], "lemma": {"la": "Et Spiritus Domini ferebatur super aquas", "en": "And the Spirit of the Lord was borne over the waters"}, "en": "« And the Spirit of the Lord was borne over the waters. » [var: Vulg. Gen. 1:2 *Spiritus Dei*, \"the Spirit of God\"] [n: (AUG., lib. I de Gen. ad lit., c. 5, tom. III.)] Either he called the whole corporeal matter water, that he might intimate whence were made and formed all the things which we see formed on the earth out of a moist nature through divers species; or the spiritual life, as it were floating, before the [0070B] form of its conversion. The Spirit of God was borne above, because that which he had begun to be formed and perfected lay beneath the good will of the Creator. It is also said, « The Spirit of the Lord was borne over the waters. » Lest, by doing works, God should be thought to love through the necessity of want rather than through the abundance of beneficence. For fittingly is something first intimated to have been begun, over which he might be borne: not in place, but by a power surpassing all things.\n\n« And the Spirit of the Lord was borne, » etc. [n: (HIERON. in Gen. t. III, col. 939.)] In the Hebrew it has *merahephet,* that is, it brooded, or cherished, after the manner of a bird warming eggs with the heat of a living thing. We understand therefore that this is not said of the spirit of the world, as many suppose; but of the [0070C] Holy Spirit, who is himself the quickener of all things: and if the quickener, also the founder; if the founder, also God. Psal. CIII: « Send forth, he says, thy Spirit, and they shall be created. » [var: Vulg. Ps. 103:30 *Emittes*, \"Thou shalt send forth\"]\n\n« And the Spirit, » etc. In whom, subsisting, we might rest, quickened by his breath and washed by the wave of baptism. « And the Spirit of the Lord was borne over the waters, » etc. As God, namely, and Creator, he presided over the floating and confused matter, that he might distinguish it when he willed. The whole Trinity therefore is understood to have worked here, God, that is, the Father; the beginning, the Son; the Spirit of God, the Holy Spirit.\n\n« And the Spirit, » etc. [n: (ISID., in Gen.? )] The hearts, namely, that were tossing to and fro, which had lost the quiet of the mind, [0070D] because the Spirit did not rest upon them, but was borne above them: as one able to call back their nature from confusion into something better. Then throughout the whole text of this Scripture we see certain six laborious ages, though distinguished as it were by neighbouring bounds, so that in the seventh rest may be hoped for; and we see that they have a likeness to the six days in which those things were made which Scripture records God to have made. For the first beginning of the human race, in which it began to enjoy this light, is compared to the first day, on which God made light. This age is as it were the infancy of the whole worl
