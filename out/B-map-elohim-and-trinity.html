<script>
const D = {"crux": {"id": "elohim-and-trinity", "question": {"en": "Who is the God who creates, and what do grammar and word order say about plurality?", "la": "Quis est Deus qui creat, et quid de Trinitate?", "he": "מִי הוּא אֱלֹהִים הַבּוֹרֵא, וּמַה מַּשְׁמָע לְשׁוֹן רַבִּים?"}, "summary": "Megillah 9a is a Jewish witness to a Greek interpretive move that reaches the Latin bench through the Vetus Latina.", "finding": "One grammatical fact, three benches, three incompatible conclusions — and it is the same fact each time. Bereshit Rabbah 1:7 observes that the plural-looking Elohim takes singular verbs throughout: vaydaberu is not written but vaydaber, vayomeru is not written but vayomer, bare'u is not written but bara — and concludes that no creature can say that two authorities created the world. Abelard, at the Paraclete about 1133, asks the identical question in Latin — unde dictum est Eloim creavit, non creaverunt? — and answers that a singular verb is referred to a plural noun so that in those three persons one creator should be understood and not three, from which he derives the technical doctrine that the works of the Trinity are undivided. Ibn Ezra, at Lucca about 1155, closes the same argument with the same clause — 'and for this reason Scripture says bara and not bare'u' — having first shown that the plural is simply how the Holy Tongue speaks of the great, as adonim and be'alim are plural for one master and as a king in Arabic speaks of himself in the plural. And Ramban, a century later with Ibn Ezra in front of him, refuses to let the plural be empty at all: the word is a compound, el hem, the force and all the other forces, and 'a secret will yet be disclosed in connection with this'. Nobody is answering anybody. Three of the four could not have read each other, and the fourth is reading only within his own bench.\n\nWhat makes Abelard's page the strangest thing on this daf is that the Latin bench had the information for six hundred years and never used it here. Jerome knew that the Hebrew word is common in number and said so — verbum Hebraicum ELOIM communis est numeri, et Deus quippe et dii similiter appellantur — but he says it at Genesis 6:2, about the sons of God, and Rabanus copies him there verbatim, and neither brings it forward to the first verse. Every other Latin witness on this crux gets its Trinity from the sequence of the sentences rather than from any Hebrew word: the Father in the name of God, the Son in the name of the Beginning, the Spirit borne over the waters. That is Augustine's triad, and he calls it a riddle — ecce apparet mihi in aenigmate Trinitas — and states the order of his own search plainly, that he already held two of the three and believed the third and went looking for it in the holy sayings. Bede, Bruno, Honorius and the Glossa repeat the triad and none of them repeats the word riddle. In the unfinished commentary Augustine is franker still: he sets out the catholic faith before expounding a syllable, because many heretics drag the Scriptures to their own opinion.\n\nThe rabbinic bench, meanwhile, preserves a memory of the whole problem as a translation problem. Megillah 9a's baraita has seventy-two elders shut in seventy-two houses writing the Torah for Ptolemy, and the first two things on the list of what they changed are the two verses the Latin bench builds on: they wrote 'God created in the beginning', moving the divine name to the front so that bereshit could not be read as a subject, and they wrote 'I shall make a human', singular, for the 'let us make' of Gen 1:26. Both changes remove a plurality from the opening of Genesis. Neither is in the Septuagint the Church actually inherited, whose first verse keeps the Hebrew order and whose Gen 1:26 keeps the plural. So the Latin reading of both verses stands in exactly the space the elders are said to have closed — and Bruno of Segni, refuting it at Segni about 1090, refuses the plurality in the rabbinic bench's own words: was he speaking to the angels? God forbid, for otherwise there would be not one creator but many."}, "witnesses": [{"id": "br-1-7", "short": "br-1-7", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["one-authority-singular-verb"], "senses": ["literal"], "lemma": {"he": "בְּרֵאשִׁית בָּרְאוּ אֱלֹהִים, אֵין כְּתִיב כָּאן", "en": "'In the beginning the gods created' is not written here"}, "en": "Rabbi Yitzḥak began: “The beginning of Your word is truth…” (Psalms 119:160) – Rabbi Yitzḥak said: Right from the beginning of the creation of the world [it can be seen that] “the beginning of Your word is truth” – “in the beginning, God created.” “But My Lord God is truth” (Jeremiah 10:10), “All Your righteous laws are eternal” (Psalms 119:160) – as each and every edict that You decree upon Your creations, they accept the judgment upon themselves and receive it faithfully, and no person can come and say that two authorities created the world: “God [Elohim] spoke [vaydaberu]” is not written here [in plural], but rather [in singular], “God spoke [vaydaber];” “God [Elohim] said [vayomeru]” is not written here [in plural], but rather [in singular], “God said [vayomer]”; “In the beginning God created [bare’u]” is not written here [in plural], but rather [in singular], “God created [bara].”", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "ר' יצחק פתח (תהלים קיט, קס): \"ראש דברך אמת וגו'\" א\"ר יצחק מתחלת ברייתו של עולם ראש דברך אמת \"בְּרֵאשִׁית בָּרָא אֱלֹהִים\" (ירמיה י, י): \"וה' אלהים אמת\". \"ולעולם כל משפט צדקך\" שכל גזרה וגזרה שאתה גוזר על בריותיך הן מצדיקין עליהם את הדין ומקבלין אותו באמונה ואין כל בריה יכולה לומר שתי רשויות בראו העולם וידברו אלהים אין כתיב כאן אלא וידבר אלהים ויאמרו אלהים אין כתיב כאן אלא ויאמר אלהים בראשית בראו אלהים אין כתיב כאן אלא ברא אלהים:", "olang": "he", "source": "Bereshit Rabbah 1:7 (Vilna numbering)", "notes": "The rabbinic answer to this crux, and it is a grammatical argument made three times over. R. Yitzḥak reads Ps 119:160, 'the beginning of your word is truth', of the opening of Genesis: from the beginning of the creation of the world the head of your word is truth, 'in the beginning God created', and the Lord God is truth (Jer 10:10). Then the point: no creature can come and say that two authorities created the world — vaydaberu Elohim is not written here but vaydaber Elohim; vayomeru Elohim is not written here but vayomer Elohim; bereshit bare'u Elohim is not written here but bara Elohim. Three verbs, all singular, against a noun that is plural in form. The observation is exactly Abelard's at the Paraclete seven hundred years later and Ibn Ezra's at Lucca, and the three of them draw three different conclusions from it. Note what the argument is aimed at: not idolatry in general but shtei reshuyot, two authorities — the dualism the same midrash elsewhere calls minut — and the verse is being used as a proof text against it.", "slot": false}, {"id": "br-1-12", "short": "br-1-12", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["word-order-is-modesty"], "senses": ["literal"], "lemma": {"he": "בְּרֵאשִׁית בָּרָא, וְאַחַר כָּךְ אֱלֹהִים", "en": "'In the beginning created', and only then 'God'"}, "en": "Rabbi Yudan said in the name of Akilas: To this One it is fitting to call God. The ordinary way of the world is that a flesh-and-blood king is praised in his province though he has not yet built any public baths in it and has not yet built private baths in it. First he proclaims his name and then presents his works. The Unique One of the world, however, first acted and then He was praised. Shimon ben Azai says: “Your humility has made me great” (II Samuel 22:36) – a flesh-and-blood [king] mentions his name first and then his title of praise: So-and-so Augustoli, So-and-so Pro titulo. But the Holy One blessed be He is not so; instead, after creating the needs of his world, only then does He mention His name: “In the beginning…created [bereshit bara]” and then “God [Elohim].”", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "רבי יודן בשם עקילוס אמר לזה נאה לקראו אלוה בנוהג שבעולם מלך ב\"ו מתקלס במדינה ועדיין לא בנה לה דמוסיות ועדיין לא בנה לה פריבטאות בתחלה מזכיר שמו ולבסוף קטיזמה שלו ברם יחידו של עולם בתחלה פעל ולבסוף נתקלס. שמעון בן עזאי אומר (ש\"ב כב, לו): \"וַעֲנֹתְךָ תַּרְבֵּנִי\" ב\"ו מזכיר שמו ואח\"כ שבחו פלן אגוסטולי פלן פראטאטא אבל הקב\"ה אינו כן אלא משברא צורכי עולמו אחר כך מזכיר שמו \"בְּרֵאשִׁית בָּרָא\" ואח\"כ \"אֱלֹהִים\":", "olang": "he", "source": "Bereshit Rabbah 1:12 (Vilna numbering)", "notes": "Why the divine name comes third in the sentence, answered from court protocol and in Greek loanwords. R. Yudan in the name of Akilas — Aquila the proselyte, the translator — says: to this one it is fitting to call God. A flesh-and-blood king is acclaimed in a province before he has built it a public bath or a private one; he proclaims his name first and produces his works afterwards. The Unique One of the world acted first and was praised afterwards. Ben Azzai gets the same from 2 Sam 22:36, 'your humility has made me great': mortals put the name first and the titles after — So-and-so Augustalis, So-and-so pro titulo — but the Holy One, after creating the needs of his world, only then mentions his name: bereshit bara, and after that Elohim. The interest for this crux is that the rabbinic bench has a positive account of the Hebrew word order that the Greek elders were obliged to destroy, and its terms are the honorifics of the Roman provincial administration.", "slot": false}, {"id": "b-meg-9a", "short": "b-meg-9a", "author": "Babylonian Talmud", "tradition": "rabbinic", "date": 550, "datelabel": "redaction 500–600", "place": "Babylonia (Sura / Pumbedita)", "lat": 32.5, "lon": 44.4, "answers": ["word-order-is-dangerous", "one-authority-singular-verb"], "senses": ["translation", "literal"], "lemma": {"he": "אֱלֹהִים בָּרָא בְּרֵאשִׁית", "en": "God created in the beginning"}, "en": "For it was taught: [This is] the case of Ptolemy the King, who gathered seventy-two elders and entered them into seventy-two houses, and he did not reveal to them for what he gathered them. He then met each of them individually and he said to them: \"Write for me the Torah of Moses your teacher [in Greek].\" The Holy One, Blessed Be He put counsel into the heart of each one, and all of them harmonized to one understanding. And they wrote for him: \"God created in the beginning.\" (Genesis 1:1) \"I shall make a human in image and likeness.\" (Genesis 1:26)", "translator": "Sefaria Community Translation", "orig": "ומשום מעשה דתלמי המלך דתניא מעשה בתלמי המלך שכינס שבעים ושנים זקנים והכניסן בשבעים ושנים בתים ולא גילה להם על מה כינסן ונכנס אצל כל אחד ואחד ואמר להם כתבו לי תורת משה רבכם נתן הקב\"ה בלב כל אחד ואחד עצה והסכימו כולן לדעת אחת וכתבו לו אלהים ברא בראשית (בראשית א, א) אעשה אדם בצלם ובדמות (בראשית א, כו)", "olang": "arc", "source": "b. Megillah 9a (Vilna)", "notes": "The rabbinic bench's own account of how the Greek Bible came to read as it does, and the first two items on the list are the two verses the Latin bench builds its plurality on. Ptolemy shut seventy-two elders in seventy-two houses and told each to write him the Torah of Moses; God put counsel in each one's heart and they all agreed on one understanding. And they wrote for him: 'God created in the beginning' — Elohim bara bereshit, the divine name moved to the front so that bereshit could not be read as the subject, that is, as a deity who made God — and 'I shall make a human in image and likeness', singular, for the plural na'aseh of Gen 1:26. Both changes are aimed at plurality in the opening of Genesis. Neither is in the Septuagint the Church actually inherited: its Gen 1:1 keeps the Hebrew order, en archē epoiēsen ho theos, and its Gen 1:26 keeps the plural, poiēsōmen anthrōpon. So the baraita is a tradition about a Greek Torah rather than a description of one, and the Latin reading of both verses exists in the space the described changes would have closed.", "slot": false}, {"id": "ramban-1-1-elohim", "short": "ramban-1-1-elohim", "author": "Moses ben Naḥman (Naḥmanides)", "tradition": "rabbinic", "date": 1267, "datelabel": "1263–1270", "place": "Girona", "lat": 41.98, "lon": 2.82, "answers": ["elohim-is-plural-of-powers"], "senses": ["literal", "spiritual"], "lemma": {"he": "אֱלֹהִים בַּעַל הַכֹּחוֹת כֻּלָּם", "en": "Elohim, the Master of all the forces"}, "en": "AND ‘ELOKIM’ (G-D) SAID. The word Elokim means “the Master of all forces,” for the root of the word is e-il, meaning force, and the word Elokim is a composite consisting of the words e-il heim, as if the word e-il is in a construct state, and heim, [literally] “they,” alludes to all other forces. Thus Elokim means “the Force of all forces.” A secret will yet be disclosed in connection with this.", "translator": "Charles B. Chavel, 1971–76", "orig": "וְאָמַר אֱלֹהִים בַּעַל הַכֹּחוֹת כֻּלָּם, כִּי הַמִּלָּה עִקָּרָהּ \"אֵל\", שֶׁהוּא כֹּחַ, וְהִיא מִלָּה מֻרְכֶּבֶת, \"אֵל הֵם\", כְּאִלּוּ \"אֵל\" סָמוּךְ, \"וְהֵם\" יִרְמֹז לְכָל שְׁאָר הַכּוֹחוֹת; כְּלוֹמַר, כֹּחַ הַכּוֹחוֹת כֻּלָּם. וְעוֹד יִתְבָּאֵר סוֹד בָּזֶה.", "olang": "he", "source": "Ramban on Gen 1:1, s.v. אלהים", "notes": "Ramban takes the plural seriously and makes it mean something other than persons. The word is a compound: its root is el, which is force, and it is put together as el hem, as though el were in the construct and hem, 'they', pointed to all the other forces — so that Elohim is the force of all forces, the master of them all. Then the sentence that stops the paragraph: 'a secret will yet be disclosed in connection with this', which is his standard signal that a kabbalistic doctrine lies underneath and will not be printed. So on the one bench a plural noun points to a plurality within God that may not be spoken, and on the other, at almost the same date, it points to three persons that may be preached. Neither Ibn Ezra's honorific plural nor Abelard's three persons is what Ramban means, and his answer is the only one of the three that treats the plurality as real and as not a plurality of creators.", "slot": false}, {"id": "ibn-ezra-1-1-elohim", "short": "ibn-ezra-1-1-elohim", "author": "Abraham ibn Ezra", "tradition": "rabbinic", "date": 1155, "datelabel": "c. 1155", "place": "Lucca", "lat": 43.84, "lon": 10.5, "answers": ["elohim-is-honorific-plural", "one-authority-singular-verb"], "senses": ["literal"], "lemma": {"he": "עַל כֵּן יֹאמַר הַכָּתוּב בָּרָא, וְלֹא בָּרְאוּ", "en": "for this reason Scripture says 'he created' and not 'they created'"}, "en": "“E-lohim” – After we have found [the word] e-loah, we know that E-lohim is its plural form, and the root [of this] is in the nature of language. For every language has a formal form. The way of expressing formality in non-Hebrew languages is by the lesser using the plural in the presence of the greater. In Arabic the way of formal expression is for the greater to speak, as royalty, in the plural. In the Holy Tongue, the way is to refer to the greater in the plural. Like “master” (adonim), “owner” b’alim as they said, “a harsh master” (b’alim) Isaiah 19:4, “his master (b’alim) shall take”. Likewise the word “upon him” (alav), “to him” (elav), “until him” (adav). For this reason does Scripture state “He created” and not “they created”.", "translator": "Sefaria Community Translation", "orig": "אלהים, אחר שמצאנו אלוה, ידענו כי אלהים לשון רבים, ושרש זה מדרך הלשון, כי כל לשון יש לו דרך כבוד, וכבוד לשון לועז שיאמר הקטן לנכח הגדול לשון רבים, ובלשון ישמעאל דרך כבוד שידבר הגדול כמו המלך בלשון רבים, ובלשון הקדש דרך כבוד לומר על הגדול לשון רבים כמו \"אדנים\" \"ובעלים\", שאמרו \"אדנים קשה\" (ישעי' י\"ט ד'), \"ולקה בעליו\" (שמות כ\"ב, י') וכן מלת עליו, אליו, ועדיו, על כן יאמר הכתוב ברא, ולא בראו", "olang": "he", "source": "Ibn Ezra on Gen 1:1, s.v. אלהים", "notes": "The grammarian's answer, and it is comparative philology two hundred years before anyone calls it that. Having found eloah, we know that Elohim is its plural, and the root of the usage is in the nature of language itself: every language has a way of showing honour. In the vernacular tongues the lesser addresses the greater in the plural; in Arabic the greater — a king — speaks of himself in the plural; in the Holy Tongue the way is to speak of the greater in the plural, as with adonim, 'master', and be'alim, 'owner', which take plural forms for a single person (Isa 19:4, Exod 22:10). And therefore: Scripture says bara and not bare'u. That last clause is word for word what Abelard asks at the Paraclete twenty years earlier — unde dictum est Eloim creavit, non creaverunt? — and the two men give opposite answers to it, neither having heard of the other.", "slot": false}, {"id": "basil-hex-2-6b", "short": "basil-hex-2-6b", "author": "Basil of Caesarea", "tradition": "greek", "date": 380, "datelabel": "370–380", "place": "Caesarea in Cappadocia", "lat": 38.72, "lon": 35.49, "answers": ["trinity-in-the-triad", "spirit-is-holy-spirit"], "senses": ["literal"], "lemma": {"la": "venerabilis Trinitatis expletor", "en": "the completer of the venerable Trinity"}, "en": "And the Spirit of God, it says, was borne over the water. If by 'spirit' he means the diffusion of this air of ours, understand that the writer is enumerating for you the several portions of the world; for he says that God made heaven and earth, water and air, this liquid and diffused element. Or else — which I judge the truer, and which was approved by those who were before us — by 'the Spirit of God' he means the Holy Spirit. For Scripture reserved it, that it might fittingly declare the special mention of this name; and we ought to believe that no other spirit is spoken of but the Holy, who is the completer of the blessed and venerable Trinity. And taking this understanding, you will find that a greater profit is thereupon conferred on you.", "translator": "claude-draft-approved", "orig": "Et spiritus, inquit, Dei ferebatur super aquam. Sive diffusionem aeris istius, spiritum dicit, percipe scriptorem portiones tibi mundi singulas enumerantem; nam fecisse Deum dicit coelum et terram, aquam et aerem, hunc liquidum atque diffusum; sive, quod verum magis existimo, et quod his qui ante nos fuere probatum est, Spiritum Dei dicit, id est sanctum. Reservavit enim Scriptura, ut praecipuam hujus competenter mentionem nominis declararet: nullumque alium spiritum dictum debemus credere, nisi sanctum, qui beatae ac venerabilis Trinitatis expletor est, et hunc intellectum capiens, majus tibi subinde commodum conferri reperies.", "olang": "la", "source": "PL 53, col. 886B", "notes": "The Greek bench identifying the third term, and doing it as a decision between two readings rather than as an assumption. Either the spirit of v. 2 is the diffusion of the air, in which case the verse is finishing an inventory of the elements — heaven, earth, water, air — or it is the Holy Spirit; and Basil takes the second, on the authority of those before him, with a reason drawn from the shape of the sentence: Scripture held the word back so that the mention of this name should carry its full weight. The word he uses for the Spirit is expletor, the one who completes or fills out the Trinity, which is an odd and strong term and is the whole of the Latin bench's argument in one noun: the Father and the Son are in the first verse, and the third person has been kept for the second. Ambrose, who is reading Basil, makes the same choice at Milan a few years later and says so.", "slot": false}, {"id": "aug-gnl-imp-1-2", "short": "aug-gnl-imp-1-2", "author": "Augustine", "tradition": "latin", "date": 393, "datelabel": "c. 393", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["trinity-is-brought-to-the-text"], "senses": ["literal"], "lemma": {"la": "ante tractationem hujus libri catholica fides breviter explicanda est", "en": "before treating this book, the catholic faith must briefly be set out"}, "en": "And since many heretics have been accustomed to drag the exposition of the divine Scriptures to their own opinion, which is beside the faith of catholic teaching, before the treatment of this book the catholic faith must briefly be set out. It is this: that God the Father almighty made and established the whole creation through his only-begotten Son, that is, his Wisdom and Power, consubstantial with him and coeternal, in the unity of the Holy Spirit, himself also consubstantial and coeternal. That this Trinity, then, is called one God, and that he made and created all things that are, in so far as they are, catholic teaching bids us believe; so that every creature, whether intellectual or corporeal — or, as it may be more briefly said in the words of the divine Scriptures, whether invisible or visible — is made not of God's nature but by God out of nothing: and that there is nothing in it belonging to the Trinity, except that the Trinity founded it and it was founded. Wherefore it is not lawful to say or believe that the whole creation is either consubstantial with God or coeternal.", "translator": "claude-draft-approved", "orig": "Et quoniam multi haeretici ad suam sententiam, quae praeter fidem est catholicae disciplinae, expositionem Scripturarum divinarum trahere consueverunt; ante tractationem hujus libri catholica fides breviter explicanda est. 2. Est autem haec: Deum Patrem omnipotentem universam creaturam fecisse atque constituisse per Filium suum unigenitum, id est Sapientiam et Virtutem suam consubstantialem sibi et coaeternam, in unitate Spiritus sancti, et ipsius consubstantialis et coaeterni. Hanc ergo Trinitatem dici unum Deum, eumque fecisse et creasse omnia quae sunt, in quantum sunt, catholica disciplina credi jubet; ita ut creatura omnis sive intellectualis sive corporalis, vel quod brevius dici potest secundum verba divinarum Scripturarum, sive invisibilis sive visibilis, non de Dei natura, sed a Deo sit facta de nihilo: nihilque in ea esse quod ad Trinitatem pertineat, nisi quod Trinitas condidit, ista condita est. Quapropter creaturam universam neque consubstantialem Deo, neque coaeternam fas est dicere aut credere.", "olang": "la", "source": "PL 34, col. 221", "notes": "Augustine states, before he has expounded a word of Genesis, what the exposition will have to come out to, and gives the reason: many heretics drag the divine Scriptures to their own opinion. So the Trinity is the rule under which the first chapter will be read, not a conclusion drawn from it — which is worth having on the daf, because every other Latin witness here proceeds as though the three persons were found in the words. The content of the rule is exactly what a reader of Gen 1:1–2 needs: the Father made everything through the Son who is his Wisdom, in the unity of the Spirit; the three are one God; and nothing in the creature belongs to the Trinity except that the Trinity made it. That last clause is aimed at the Manichees and does on the Latin bench what R. Yitzḥak's 'no creature can say that two authorities created the world' does on the rabbinic: it forecloses a dualism.", "slot": false}, {"id": "aug-conf-13-5", "short": "aug-conf-13-5", "author": "Augustine", "tradition": "latin", "date": 400, "datelabel": "397–401", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["trinity-in-the-triad", "trinity-is-brought-to-the-text"], "senses": ["allegorical", "spiritual"], "lemma": {"la": "Ecce Trinitas Deus meus, Pater et Filius et Spiritus sanctus", "en": "Behold the Trinity, my God, Father and Son and Holy Spirit"}, "en": "Behold, the Trinity appears to me in a riddle, which you are, my God; since you, Father, in the Beginning of our wisdom — which is your Wisdom, born of you, equal to you and coeternal, that is, in your Son — made heaven and earth. And we have said many things about the heaven of heaven, and about the earth invisible and unordered, and about the darksome deep, according to the wandering falls of a spiritual formlessness, unless it were turned to him from whom it had whatever life it had, and by illumination were made a beautiful life, and were the heaven of that heaven which was afterwards made between water and water. And I already held the Father in the name of God, who made these things, and the Son in the name of the Beginning, in whom he made these things; and believing my God to be a Trinity, as I did believe, I sought it in his holy sayings — and behold, your Spirit was borne over the waters. Behold the Trinity, my God, Father and Son and Holy Spirit, creator of all creation.", "translator": "claude-draft-approved", "orig": "Ecce apparet mihi in aenigmate Trinitas, quod es Deus meus; quoniam tu, Pater, in Principio sapientiae nostrae quod est tua Sapientia de te nata, aequalis tibi et coaeterna, id est in Filio tuo, fecisti coelum et terram. Et multa diximus de coelo coeli, et de terra invisibili et incomposita, et de abysso tenebrosa, secundum spiritualis informitatis vagabunda deliquia, nisi converteretur ad eum a quo erat qualiscumque vita, et illuminatione fieret speciosa vita, et esset coelum coeli ejus, quod inter aquam et aquam postea factum est; et tenebam jam Patrem in Dei nomine, qui fecit haec, et Filium in Principii nomine in quo fecit haec; et Trinitatem credens Deum meum, sicuti credebam, quaerebam in eloquiis sanctis ejus, et ecce Spiritus tuus superferebatur super aquas. Ecce Trinitas Deus meus, Pater et Filius et Spiritus sanctus, creator universae creaturae.", "olang": "la", "source": "PL 32, col. 847", "notes": "The three-term reading in its classical form, and it is autobiography rather than exegesis: the Father in the name of God, the Son in the name of the Beginning, and then — 'believing my God to be a Trinity, as I did believe, I sought it in his holy sayings, and behold, your Spirit was borne over the waters.' The order of the sentence is the order of the search. He held two of the three from the first verse, he already believed the third, and he went looking for it in the text; and the chapter heading the editors gave it says what he does not, that the Trinity which is God is understood from the first words of Genesis. Augustine himself calls it a riddle, in aenigmate. This is the passage that Bede, the Glossa, Bruno, Honorius and Abelard are all repeating, and none of them keeps the word riddle.", "slot": false}, {"id": "wigbod-gen-1-1d", "short": "wigbod-gen-1-1d", "author": "Wigbod", "tradition": "latin", "date": 790, "datelabel": "c. 790", "place": "Tours", "lat": 47.39, "lon": 0.69, "answers": ["principium-is-the-son", "trinity-in-the-triad"], "senses": ["literal"], "lemma": {"la": "in principio sibi coaeterno", "en": "in a Beginning coeternal with himself"}, "en": "M[aster]. Let us say that in a Beginning coeternal with himself God made heaven and earth — in the only-begotten Son, who is the Wisdom of the Father, of whom the Apostle says: Christ the power of God and the wisdom of God (1 Cor 1:24).", "translator": "claude-draft-approved", "orig": "M. Dicamus quia in principio sibi coaeterno fecit Deus coelum et terram, in unigenito Filio qui est sapientia Patris, de quo dicit Apostolus, Christum Dei virtutem et Dei sapientiam (I Cor. I, 24) .", "olang": "la", "source": "PL 96, col. 1115A", "notes": "The Carolingian dialogue's answer to the question its pupil has just asked — in what beginning, the beginning of time, or a beginning that was the start of the creature? — and it refuses the alternative by making the Beginning a person: one coeternal with God himself, the only-begotten Son who is the Father's Wisdom, with 1 Cor 1:24 for the identification. What the schoolroom form makes visible is how short the step is. The pupil asked a question about time; the master answered with a doctrine of the second person, and neither notices that the question has been changed.", "slot": false}, {"id": "remigius-gen-1-1c", "short": "remigius-gen-1-1c", "author": "Remigius of Auxerre", "tradition": "latin", "date": 890, "datelabel": "c. 890", "place": "Auxerre", "lat": 47.8, "lon": 3.57, "answers": ["principium-is-the-son"], "senses": ["allegorical"], "lemma": {"la": "Deus enim Pater principium est, sed non de principio", "en": "for God the Father is a beginning, but not from a beginning"}, "en": "Allegorically, in what is said, In the beginning God made heaven and earth, by the name of 'beginning' we may not inappropriately understand the Son of God, as he himself said of himself to the Jews: I am the beginning, who also speak to you (John 8:25). For God the Father is a beginning, but not from a beginning, since he was not made or created by the Father but begotten; through which Beginning God the Father created heaven and earth, that is, the heavenly and the earthly. For by 'heaven' are signified the heavenly, or those leading a heavenly life; by 'earth', those gaping after earthly business. Both of these were created through the Beginning, because when Jesus Christ was born it became plain who were heavenly and who were earthly.", "translator": "claude-draft-approved", "orig": "Allegorice quod dictum est: in principio fecit Deus coelum et terram, nomine principii Filium Dei non incongrue possumus accipere, sicut ipse de se Judaeis dixit: ego principium qui et loquor vobis (Joan. VIII, 28) . Deus enim Pater principium est, sed non de principio, quia a Patre non factus nec creatus, sed genitus est: per quod principium Deus Pater coelum et terram creavit, id est coelestes et terrenos. Per coelum enim coelestes sive coelestem vitam ducentes: per terram vero terrenis negotiis inhiantes signantur. Qui utrique per principium creati sunt, quia nato Jesu Christo patuit qui essent coelestes, quique terreni.", "olang": "la", "source": "PL 131, col. 55C", "notes": "A distinction made in passing that nobody else on this daf bothers with: the Father too is a beginning — but not from a beginning, since he is not made or created but begotten. Remigius has noticed that if 'in the beginning' names the Son because the Son is a principium, the word will also fit the Father, and he heads it off with the credal formula. The rest is the standard identification with John 8:25 and then the ecclesial reading, in which heaven and earth are the heavenly-minded and the earthly-minded and the division became visible only at the Incarnation. Set beside R. Yudan's 'to this one it is fitting to call God', the two benches are doing the same thing with the same clause — asking what may properly be predicated of the creator, and answering out of the word order.", "slot": false}, {"id": "bruno-gen-1-1c", "short": "bruno-gen-1-1c", "author": "Bruno of Segni", "tradition": "latin", "date": 1085, "datelabel": "1078–1100", "place": "Segni", "lat": 41.69, "lon": 13.02, "answers": ["trinity-in-the-triad", "not-to-angels"], "senses": ["literal", "allegorical"], "lemma": {"la": "Nunquid ad angelos? Absit!", "en": "Was it to the angels? God forbid!"}, "en": "It is God, then, who speaks. Was it to the angels? God forbid! For man was not created by angels; otherwise there would be not one but many creators, whereas God alone is the Creator of all. For thus it is written: The Creator of all, terrible and strong (2 Macc 1:24). And again: You have made all things in wisdom (Ps 104:24 [Vg 103:24]). If therefore it is true, as cannot be denied, that God alone created all things, whom was he inviting to the making of man when he said, Let us make man? Let us hear, then, what is said at the head of this book: In the beginning God created heaven and earth. You have therefore God, that is, the Father; you have also a beginning, that is, the Son — for so he himself says: I am the beginning, who also speak to you (John 8:25). But what follows? And the Spirit of God was borne over the waters. You have therefore the Holy Spirit also. And that not the Father alone created heaven, but the Son and the Holy Spirit together with him, let the psalmist say: By the word of the Lord the heavens were established, and all their power by the spirit of his mouth (Ps 33:6 [Vg 32:6]). Now the whole Trinity, that is, God and his Word and his Spirit, is one God; and it is he who says, Let us make man — not seeking help outside himself, but disposing all things within himself with his Son and the Holy Spirit.", "translator": "claude-draft-approved", "orig": "Deus ergo est qui loquitur. Nunquid ad angelos? Absit! Non enim ab angelis creatus est homo; alioquin non unus, sed multi creatores essent, ut solus Deus est omnium Creator. Sic enim scriptum est: « Creator omnium terribilis, et fortis (II Machab. I, 24) . » Itemque: « Omnia in sapientia fecisti (Psal. CIII, 24) . » Si igitur verum est, quod negari non potest, solus Deus creavit omnia; quos ad hominem creandum invitabat, dicens: « Faciamus hominem. » Audiamus igitur quid in capite libri hujus dicatur: « In principio creavit Deus coelum et terram. » Habes ergo Deum, id est Patrem; habes et principium, id est Filium; sic enim ipse ait: « Ego principium qui et loquor vobis (Joan. VIII, 25) . » Sed quid sequitur? « Et Spiritus Dei ferebatur super aquas. » Habes igitur et Spiritum sanctum. Quod autem non solus Pater coelum creaverit, sed simul cum eo Filius quoque, et Spiritus sanctus, dicat Psalmista: « Verbo, inquit, Domini coeli firmati sunt, et Spiritu oris ejus omnis virtus eorum (Psal. XXXII, 6) . » Tota autem Trinitas, id est Deus, et Verbum ejus, et Spiritus ejus, unus Deus, et iste quidem dicit: « Faciamus hominem; » non extra se auxilium petens, sed in se cum Filio suo, et Spiritu sancto cuncta disponens.", "olang": "la", "source": "PL 164, col. 157A", "notes": "The one Latin witness on this crux who states the negative half of the question, and he states it in the rabbinic bench's own terms. Whom was God inviting when he said 'let us make man'? Not the angels — for man was not created by angels, and otherwise there would be not one creator but many. That is R. Yitzḥak's 'no creature can say that two authorities created the world', with the angels in the place of the second authority and with the same horror of it. Having refused the answer, Bruno goes back to the head of the book for the right one, and lays the triad out in three short moves: you have God, that is the Father; you have a beginning, that is the Son; and what follows? — the Spirit of God borne over the waters, so you have the Holy Spirit too. Nothing in the argument is his own except its shape, which is a schoolman's: the wrong answer refuted first, from a premise both benches share.", "slot": false}, {"id": "abelard-hex-1-1-eloim", "short": "abelard-hex-1-1-eloim", "author": "Peter Abelard", "tradition": "latin", "date": 1133, "datelabel": "c. 1133", "place": "The Paraclete (Nogent-sur-Seine)", "lat": 48.49, "lon": 3.5, "answers": ["elohim-is-plural-of-persons", "one-authority-singular-verb", "trinity-in-the-triad"], "senses": ["literal", "translation"], "lemma": {"la": "Eloim creavit, non creaverunt", "en": "Eloim created, not 'they created'"}, "en": "It is to be noted that in this very opening of Genesis the prophet carefully expressed the foundation of our faith concerning the unity of God and the Trinity. For when he said 'the Spirit of the Lord', he plainly distinguished at once both the person of the Holy Spirit and that of the Father, from whom that Spirit principally proceeds, as blessed Augustine records. But in that he added 'God said', he openly expressed God's own saying, that is, his Word, which is the Son, together with the Father himself. For no one of sound head can be so foolish as to reckon this saying corporeal, since the Godhead is not corporeal, nor has it to speak in a bodily way, nor was there yet anyone present to whom it would have had to speak bodily. Now where we say 'God created', for what is 'God' the Hebrew has Eloim, which shows a plurality of divine persons. For El is singular, which is interpreted 'God'; but Eloim is plural, by which we understand the diversity of the persons, of which each one is God. But why is it said 'Eloim created' and not 'they created'? — namely, so that a singular verb should be referred to a plural noun; in order that it might be intimated that in those three persons not three creators but one only is to be understood. When therefore he said 'Eloim created', in which he taught that the divine persons work equally together, he assuredly laid down beforehand that the works of the Trinity are undivided. And when afterwards, as we have said, he distinguished the persons of the Father and the Spirit and the Word, he determined wherein that Trinity consists.", "translator": "claude-draft-approved", "orig": "Notandum vero in hoc ipso Genesis exordio fidei nostrae fundamentum circa unitatem Dei ac Trinitatem prophetam diligenter expressisse. Cum enim dixerit Spiritus Domini, simul et personam Spiritus sancti et Patris, a quo ipse Spiritus, ut beatus meminit Augustinus, principaliter procedit, manifeste distinxit. In eo vero quod addidit: Dixit Deus, dictum ipsius Dei, id est Verbum ejus, quod est Filius, cum ipso pariter Patre patenter expressit. Nemo etenim sani capitis ita desipere potest, ut hoc dictum corporale aestimet, cum nec corporalis sit divinitas, nec loqui corporaliter habeat, nec adhuc cui eum loqui corporaliter oporteret, assisteret. Ubi autem nos dicimus: Creavit Deus, pro eo quod est Deus, in Hebraeo habetur Eloim, quod divinarum personarum pluralitatem ostendit. El quippe singulare est quod interpretatur Deus; Eloim vero plurale est, per quod diversitatem personarum, quarum unaquaeque Deus est, intelligimus. Unde autem dictum est: Eloim creavit, non creaverunt? ut videlicet ad plurale nomen singulare verbum referretur; quatenus insinuaretur in tribus illis personis non tres creatores, sed unum tantum debere intelligi. Cum igitur dixit Eloim creavit, in quo divinas personas pariter cooperari docuit, profecto indivisa esse opera Trinitatis praefixit. Cum autem postmodum, ut diximus, Patris et Spiritus et Verbi personas distinxit, in quo illa consisteret Trinitas determinavit.", "olang": "la", "source": "PL 178, col. 739B", "notes": "The star witness of this crux, and the only place on the Latin bench where the Hebrew word is brought to Gen 1:1 at all. Abelard knows that El is singular and Eloim plural, and he asks the exact question the midrash asks — why 'Eloim created' and not 'they created'? — and answers it by the concord: a singular verb referred to a plural noun, so that in those three persons one creator is understood and not three. From which he draws the technical doctrine, opera Trinitatis indivisa. Where he got the grammar is unknown: Jerome's note that the Hebrew word is common in number sits at Gen 6:2 and is about the sons of God, and no Latin before Abelard brings it forward to the first verse. What he does not have is the rest of the Hebrew: he reads the plural as a plurality of persons, which is the one thing the rabbinic bench never lets it mean, and Ibn Ezra will refute the reading twenty years later without ever having heard of him. Note also the first half of the passage, where the Trinity is got out of the sequence of the verses rather than the noun — Spirit and Father from 'the Spirit of the Lord', Word and Father from 'God said' — which is Augustine's method and needs no Hebrew at all.", "slot": false}, {"id": "rupert-gen-1-3-trinitas", "short": "rupert-gen-1-3-trinitas", "author": "Rupert of Deutz", "tradition": "latin", "date": 1117, "datelabel": "1112–1117", "place": "Liège", "lat": 50.63, "lon": 5.57, "answers": ["trinity-in-the-formula"], "senses": ["allegorical", "spiritual"], "lemma": {"la": "ubique tria consonant testimonii verba", "en": "everywhere three words of testimony agree"}, "en": "Because these are the works of the creating Trinity, holy Scripture rightly triples its testimony everywhere. For there are three sayings, or rather one and the same thing said three times. God said, whose saying is doing. And so it was done, and the earth brought forth. And the first is according to the evening, that is, the secret of the Word of God, in which was life; whatever is according to the morning, that is, by the substantial bringing forth of things; and another was done according to this same morning, and a third according to the continuing day of the creature persevering in whatever manner. You will find this in all the works of the six days: God said, Let there be luminaries, and it was so, and God made two great luminaries. Again: Let the waters bring forth creeping things, and God created the great sea-creatures, and God blessed them, and so on. But in the creation of the light, God said: Let there be light, and light was made, and he divided the light and the darkness. Everywhere three words of testimony agree, because everywhere, at evening and at morning and through the whole day, the creating Trinity works. And this is the original cause of the holy and just law by which the same writer laid down that no judicial case needs more than three witnesses.", "translator": "claude-draft-approved", "orig": "Quia creatricis Trinitatis haec sunt opera, bene testimonium suum sancta Scriptura ubique triplicat. Tria nempe dicat sunt, imo ter unum idemque dictum est. Dixit Deus, cujus dixisse fecisse est. Factumque est ita, et protulit terra. Et primum quidem secundum vespere est, id est verbi Dei secretum, in quo vita erat; quidquid mane, id est substantiali rerum productione; factumque est aliud secundum hoc ipsum mane, tertium secundum diem continuum quomodocunque perseverantis creaturae. Hoc in cunctis sex dierum operibus invenies: Dixit Deus: Fiant luminaria, et factum est ita, et fecit Deus duo luminaria magna. Item: Producant aquae reptilia, creavitque Deus cete grandia, benedixitque illis Deus, etc. Sed in creatione lucis dixit Deus: Fiat lux, et facta est lux, et divisit lucem et tenebras. Ubique tria consonant testimonii verba, quia tota ubique vespere et mane et tota die creatrix operatur Trinitas. Et haec est sanctae ac justae legis originalis causa, qua scriptor idem sanxit, ut testibus plus quam tribus nulla judicialis indigeat causa.", "olang": "la", "source": "PL 167, col. 229D", "notes": "Rupert's whole design for the Hexaemeron in one paragraph, and it is the boldest thing said on this crux: the threefold formula that runs through the six days — God said, and it was so, and God made — is itself the trace of the Trinity, because the creating Trinity is at work everywhere, and Moses laid down the law of three witnesses for the same reason he wrote the chapter this way. Augustine had entertained precisely this reading at De Genesi ad litteram II and rejected it, on the ground that it would make the Son appear to act under orders and the Spirit merely to approve. Rupert takes it up anyway and generalises it past the point where Augustine's objection can be raised, by making the three words a testimony rather than a distribution of labour — and then, having done so, ties it to the law of evidence, which is a claim about how Scripture was written rather than about what happened.", "slot": false}, {"id": "basil-hex-1-26-judaei", "short": "basil-hex-1-26-judaei", "author": "Basil of Caesarea", "tradition": "greek", "date": 380, "datelabel": "370–380", "place": "Caesarea in Cappadocia", "lat": 38.72, "lon": 35.49, "answers": ["not-to-angels", "faciamus-to-the-son", "one-authority-singular-verb"], "senses": ["literal"], "lemma": {"la": "Ferunt enim, quod angelis dixerit: Faciamus hominem", "en": "For they say that he said it to the angels: let us make a human"}, "en": "And God said, let us make a human. Where are the Jews now, who in what follows — where the light of the Godhead shines as if through certain caverns, and a second person is indeed declared mystically though not yet plainly seen — used to fight back, saying that God was speaking to himself, since he himself said and he himself made, 'let there be light', and there was light? Their absurdities were ready to hand then, as they are now brought out. For what blacksmith, or carpenter, or tanner of hides, standing alone in his workshop with no partner in the craft at hand, says to himself, let us make a sword, or let us put together a plough, or let us shape a shoe — and does not rather begin in silence upon the thing he has settled in his mind? It is empty chatter that any human being should sternly command something to himself, like a judge or a censor. Though what will these men not say, who crucified the Lord, having tongues trained to lying, even though the very voice now present has stopped their mouths altogether? And God said, let us make a human. So long, then, as there was no one to be taught, the preaching of the Godhead lay hidden in the deep. But when the creation of a human began to be looked for, faith was revealed, and the teaching of the truth plainly flashed out. Listen, Jew, you fighter against Christ, how he addresses the partner of the world's making, through whom he made the ages, who does all things by the word of his power: but your mind does not receive the words of piety. For as wild beasts, when they are shut in cages, gnaw at their own wombs with their teeth, showing their own bitterness and yet unable to work off their fury, so the Jew, the adversary of the truth, hemmed in by the straits of these bindings, asserts that there are many persons to whom the Word of God went out, and lies in saying it. For they say that he said it to the angels: let us make a human. A Jewish fiction, truly, and a fabling worthy of their perfidy! So as not to receive one, they confess many; they take the Son into fellowship with servants by a sharing of dignity, and make our fellow slaves the authors of the human form, and want the one who perfected the human to be equalled with angels — when it is absurd that any thing made should be equal to its maker. Let us consider what follows too: let us make a human to our image. What do you answer? Is there one image of God and of the angels? For the Father's must necessarily be the same as the Son's, yet in such a way that the figure is understood as befits God, that is, not consisting in bodily form but in the divine property. Listen, you too, who come forward out of the new circumcision, commending the cult of Judaism under a pretence of Christianity. To whom does he say, to our image, if not to the radiance of the glory and the stamp of the paternal substance, which is the image of the invisible God? He speaks, then, to his own image, which said: I and the Father are one; and, whoever sees me sees my Father also — to this one he says: let us make a human to our image. For where there is a unity of image, nothing can be unlike. For he did not say, to our images, as Scripture also testifies: God made, it says, the human: they did not make. He prudently avoided a multitude of persons here: so that where he confounded the Jew, here he might shut out the rite of the gentiles. Therefore he called to mind the unity, so that you might know the Son to be together with the Father, and might avoid the danger of a multitude of persons.", "translator": "claude-draft", "orig": "Et dixit Deus, faciamus hominem. Ubi sunt nunc Judaei, qui in sequentibus velut per quasdam cavernas Deitatis luce fulgente, secundaque persona quae mystice quidem declaratur, necdum tamen manifeste conspicitur, repugnabant dicentes sibimet ipsum loqui Deum, quoniam ipse dixit et ipse fecit, Fiat lux, et facta est lux? Erant quidem in promptu, et nunc quae modo proferuntur ab eis ineptiae. Quis enim faber ferrarius, aut carpentarius, aut coriorum confector solus in suo consistens ergastulo, cui nullus artis socius praesto est, sibimet ipse dicit, faciamus gladium, vel aratrum compaginemus, aut formemus calceum; et non magis tacitus speciem quam mente destinavit inceptat? Etenim vana garrulitas est, hominum quempiam, velut judicem aut censorem districte sibimet aliquid imperare. Quanquam hi quoque qui Dominum crucifixerunt, quid non dicturi sint, exercitatas ad mendacium linguas habentes, licet praesens vox eorum penitus ora praecluserit? Et dixit Deus, Faciamus hominem. Donec igitur minime qui doceretur existeret, in profundo fuit abdita praedicatio Deitatis. Ubi vero coepit hominis exspectari creatio, revelata est fides, et evidenter dogma veritatis emicuit. Ausculta, Judaee Christi repugnator, quomodo socium mundificationis alloquitur, per quem saecula fecit, qui agit omnia verbo potentiae suae: sed tuus animus verba non recipit pietatis. Sicut enim ferae cum includuntur in caveis, vulvas earum dentibus exedunt, amaritudinem propriam demonstrantes, furorem tamen suum nequeunt explere: sic Judaeus adversarius veritatis, alligationum coarctatus angustiis, multas asserit esse personas ad quas Verbum Dei processisse mentitur. Ferunt enim, quod angelis dixerit: Faciamus hominem. Judaica vere fictio, suaeque digna perfidiae fabulositas! Ut unum non recipiant, plurimos confitentur, filiumque famulis per participationem dignitatis asciscunt, et conlibertos nostros auctores humanae formationis efficiunt, hominisque perfectorem volunt angelis coaequare, cum sit absurdum ut quaelibet factura possit aequalis esse factori. Consideremus quoque sequentia: Faciamus hominem ad imaginem nostram. Quid respondes? Nunquid Dei et angelorum una imago est? Nam Patris necesse est eamdem esse quam Filii, sic tamen, ut Deo decens intelligatur esse figura, id est, non in habitu corporeo, sed in divina proprietate consistens. Ausculta tu etiam, qui de nova circumcisione progrederis, Judaismi cultum sub Christianitatis simulatione commendans. Cui dicit, Ad imaginem nostram (Hebr. I, 3) , nisi illuminationi gloriae, et titulo paternae substantiae, quae est imago Dei invisibilis? Suae ergo loquitur imagini, quae dixit: Ego et Pater unum sumus (Joan. X, 30) ; et, Qui me videt et Patrem meum videt (Joan. XIV, 9) , huic dicit: Faciamus hominem ad imaginem nostram. Etenim ubi unitas imaginis est, nihil potest esse dissimile. Non enim dixit ad imagines nostras, sicut et Scriptura testatur: Fecit Deus, inquit, hominem: non fecerunt. Prudenter vitavit nunc multitudinem personarum: ut ubi quidem Judaeum confunderet, hic ritum gentilitatis excluderet. Ideo commemoravit unitatem, ut et Filium simul esse cum Patre cognosceres: et periculum de personarum multitudine declinares.", "olang": "la", "source": "PL 53, col. 964A", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. The most violent page on the site, and the one that proves the two benches were in contact on this question, because it is an answer to an argument the rabbinic bench is on record making. Basil — in Eustathius's Latin, which is how the Latin bench read him — knows three Jewish readings of the plural and takes them in order: that God spoke to himself, which he answers with the workshop analogy (no smith alone says 'let us make a sword'); that God spoke to the angels, which he calls a Jewish fiction and answers from the image (there is not one image of God and of the angels); and, underneath both, that the plural cannot mean persons. Then the sentence that matters most for this daf: Fecit Deus, inquit, hominem: non fecerunt — 'God made the human: they did not make'. That is the singular-verb argument of Bereshit Rabbah 1:7 and of R. Simlai at Bereshit Rabbah 8:9, in Latin, used to the opposite end. The abuse is not incidental and is not softened here: the Jew is a beast gnawing its own womb, the reading is perfidia, and the passage ends by turning on judaizing Christians. It is also, and this is the point for the finding, a Christian text that knows what the other bench says and answers it by name.", "slot": false}, {"id": "ambrose-hex-6-7-40", "short": "ambrose-hex-6-7-40", "author": "Ambrose", "tradition": "latin", "date": 387, "datelabel": "c. 387", "place": "Milan", "lat": 45.46, "lon": 9.19, "answers": ["not-to-angels", "faciamus-to-the-son"], "senses": ["literal"], "lemma": {"la": "Cui dicit? Non sibi utique, quia non dicit, faciam, sed faciamus", "en": "To whom does he say it? Not to himself, surely, for he does not say 'I shall make' but 'let us make'"}, "en": "Let us make, he says, a human to our image and to our likeness (Gen 1:26). Who says this? Is it not God, who made you? What is God? Flesh, or spirit? Not flesh, surely, but spirit, whose likeness flesh cannot be; because he is incorporeal and invisible, whereas flesh is grasped and seen. To whom does he say it? Not to himself, surely, for he does not say, I shall make, but, let us make. Not to angels; because they are servants; and servants with their lord, and works with their author, cannot have a partnership of working: but he says it to the Son, even if the Jews are unwilling, even if the Arians fight back. Let the Jews be silent, and let the Arians be struck dumb along with their parents, who, while they shut one out from the fellowship of the divine working, bring in many; and the prerogative they deny to the Son they make a gift of to little servants. But be it so — that God should seem to you to have needed the support of little servants in order to work. If the working is common to God with the angels, is the image then common to God and the angels? Would he say to angels: let us make a human to our image and to our likeness?", "translator": "claude-draft", "orig": "Faciamus, inquit, hominem ad nostram imaginem, et ad similitudinem nostram (Gen., I, 26) . Quis hoc dicit? Nonne Deus, qui te fecit? Quid est Deus? Caro, an spiritus? Non caro utique, sed spiritus, cujus similis caro esse non potest; quia ipse incorporeus et invisibilis est, 128 caro autem comprehenditur et videtur. Cui dicit? Non sibi utique, quia non dicit, faciam, sed faciamus. Non Angelis; quia ministri sunt; servi autem cum domino, et opera cum auctore non possunt operationis habere consortium: sed dicit Filio: etiamsi Judaei nolint; etiamsi Ariani repugnent. Sed et Judaei conticescant, et Ariani cum suis parentibus obmutescant, qui dum unum a consortio divinae operationis excludunt, plures inserunt; et praerogativam quam Filio negant, servulis donant. 41. Sed esto; ut adminiculo servulorum ad operandum Deus vobis indiguisse videatur. Si operatio communis est cum angelis Deo, numquid Deo et angelis imago communis est? Numquid angelis diceret: Faciamus hominem ad nostram imaginem, et ad similitudinem nostram?", "olang": "la", "source": "PL 14, col. 257A", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. Ambrose puts the question in the sharpest possible form — cui dicit?, to whom does he say it? — and works through the same three candidates as Basil, whom he is reading, in the same order: not to himself, because the verb is not faciam; not to the angels, because a servant is no partner in the master's work; therefore to the Son. What he adds to Basil is the polemical pairing: the Jews and the Arians are refuted in one breath, and by the same argument, that whoever denies the Son a share in the working has to give that share to somebody, and ends by handing it to servuli, little servants. The rabbinic bench's own answer — that God took counsel with the household above — is thus not merely rejected on this daf but is treated as the position a Christian falls into by mistake if he gets the Son wrong. Note also that the Latin argument turns on a Latin fact: faciam against faciamus is exactly the alternative Rashi weighs at Troyes seven hundred years later, in Hebrew, when he writes that had it said e'eseh adam we could not have learned that God speaks with his court.", "slot": false}, {"id": "aug-gnl-imp-16-61", "short": "aug-gnl-imp-16-61", "author": "Augustine", "tradition": "latin", "date": 393, "datelabel": "c. 393", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["image-of-the-whole-trinity", "faciamus-is-the-trinity"], "senses": ["literal"], "lemma": {"la": "a qua pluralitate Spiritum sanctum separare quis audeat?", "en": "who would dare to separate the Holy Spirit from that plurality?"}, "en": "But that sense is rather to be chosen in these divine words, that we should understand it as said not in the singular but in the plural — let us make a human to our image and likeness — because the human was made not to the image of the Father alone, or of the Son alone, or of the Holy Spirit alone, but to the image of the Trinity itself. Which Trinity is so a Trinity that it is one God; is so one God that it is a Trinity. For he does not say, speaking to the Son, let us make a human to your image, or, to my image: but he says in the plural, to our image and likeness: and who would dare to separate the Holy Spirit from that plurality? And since that plurality is not three gods but one God, it is therefore to be understood that Scripture afterwards brought it in in the singular, and said, and God made the human to the image of God; so that it should not be taken as though God the Father made him to the image of God, that is, of his Son: otherwise how is it true, what was said, to our image, if the human was made to the image of the Son alone? And by this, since what God says is true, to our image, it was said, God made the human to the image of God, as though it were said, to his own image, which is the Trinity itself.", "translator": "claude-draft", "orig": "Ille autem sensus est potius in his divinis verbis eligendos, ut ideo non dictum intelligamus singulariter, sed pluraliter, Faciamus hominem ad imaginem et similitudinem nostram; quia non ad solius Patris, aut solius Filii, aut solius Spiritus sancti, sed ad ipsius Trinitatis imaginem factus est homo. Quae Trinitas ita est Trinitas, ut unus Deus sit; ita est unus Deus, ut Trinitas sit. Non enim ait Filio loquens, Faciamus hominem ad imaginem tuam; aut, ad imaginem meam: sed pluraliter ait, ad imaginem et similitudinem nostram: a qua pluralitate Spiritum sanctum separare quis audeat? Quae pluralitas, quoniam non tres dii, sed unus est Deus, ideo intelligendum est postea Scripturam singulariter intulisse, atque dixisse, Et fecit Deus hominem ad imaginem Dei; ut non sic accipiatur, tanquam Deus Pater ad imaginem Dei, hoc est Filii sui: alioquin quomodo verum est, quod dictum est, ad imaginem nostram, si ad Filii solius imaginem factus est homo? Ac per hoc quia verum est quod ait Deus, ad imaginem nostram; ita dictum est, Fecit Deus hominem ad imaginem Dei, tanquam diceretur ad imaginem suam, quod est ipsa Trinitas.", "olang": "la", "source": "PL 34, col. 244", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. Augustine refuses the reading Ambrose and Basil had settled on, and he does it on grammatical grounds. If the Father is speaking to the Son, then ad imaginem nostram would have to mean 'to your image' or 'to my image', and it says neither; and if the plural is the Father and the Son only, who would dare to shut the Holy Spirit out of it? So the plural is neither a conversation nor a plural of two: it is the Trinity speaking about itself, and the human is made to the image of the whole. Then the second half, which is the move the whole Latin bench inherits: the plural of v. 26 and the singular of v. 27 are read as one argument, the plural giving the persons and the singular the one God. That pairing is the exact formal structure of R. Simlai's answer to the minim at Bereshit Rabbah 8:9 — let us make is met with and he created, not and they created — with the conclusion reversed. Augustine is not answering the midrash and cannot have known it; he has arrived at the same reading of the same two verses as a pair, and taken the plural to be real.", "slot": false}, {"id": "aug-gnl-3-19-29", "short": "aug-gnl-3-19-29", "author": "Augustine", "tradition": "latin", "date": 401, "datelabel": "401–415", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["faciamus-is-the-trinity", "image-of-the-whole-trinity"], "senses": ["literal"], "lemma": {"la": "ad insinuandam pluralitatem personarum", "en": "to intimate a plurality of persons"}, "en": "This first we say briefly, that it is not to be taken as a matter of indifference that in the other works it is said, God said, let it be; but here, God said, let us make a human to our image and likeness: namely, to intimate, if I may so put it, a plurality of persons on account of the Father, and the Son, and the Holy Spirit. Yet he at once warns us that the unity of the deity is to be understood, saying, and God made the human to the image of God; not as though the Father to the image of the Son, or the Son to the image of the Father; otherwise it was not truly said, to our image, if the human was made to the image of the Father alone, or of the Son alone: but it was said thus, God made to the image of God, as though it were said, God made to his own image. And since it now says, to the image of God, when it had said above, to our image, it is signified that that plurality of persons does not work so that we should either say, or believe, or understand many gods; but that we should take the Father and the Son and the Holy Spirit — on account of which Trinity it was said, to our image — as one God, on account of which it was said, to the image of God.", "translator": "claude-draft", "orig": "hoc primum breviter dicimus, non indifferenter accipiendum quod in aliis operibus dicitur, Dixit Deus, Fiat; hic autem, Dixit Deus, Faciamus hominem ad imaginem et similitudinem nostram: ad insinuandam scilicet, ut ita dicam, pluralitatem personarum propter Patrem, et Filium, et Spiritum sanctum. Quam tamen deitatis unitatem intelligendam statim admonet, dicens, Et fecit Deus hominem ad imaginem Dei; non quasi Pater ad imaginem Filii, aut Filius ad imaginem Patris; alioquin non vere dictum est, ad imaginem nostram, si ad Patris solius, aut Filii solius imaginem factus est homo: sed ita dictum est, fecit Deus ad imaginem Dei: tanquam diceretur, fecit Deus ad imaginem suam. Cum autem nunc dicitur, ad imaginem Dei, cum superius dictum sit, ad imaginem nostram; significatur quod non id agat illa pluralitas personarum, ut plures deos vel dicamus, vel credamus, vel intelligamus; sed Patrem et Filium et Spiritum sanctum, propter quam Trinitatem dictum est ad imaginem nostram, unum Deum accipiamus, propter quod dictum est, ad imaginem Dei.", "olang": "la", "source": "PL 34, col. 291", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. The mature statement of the same reading, twenty years after the unfinished commentary, and the sentence the twelfth century will read as the settled Latin answer: the change of formula is not indifferent. Everywhere else dixit Deus, fiat; here dixit Deus, faciamus — and the difference is there to intimate a plurality of persons. Augustine's whole argument is an argument from the shape of the sentence and from nothing else: he has no Hebrew, no grammatical claim about the verb, and no interest in what the word for God is. The observation that the formula changes at this one verse is, on the other bench, R. Yeshoshua's and R. Ami's question at Bereshit Rabbah 8:3 — be-mi nimlakh, with whom did he take counsel — and Rupert of Deutz will state it as mutavit vocem suam, he changed his voice. It is this passage, and not the Confessions, that the Glossa prints on Gen 1:26 under Augustine's name, so it is the form in which the schoolroom of 1150 receives the question.", "slot": false}, {"id": "aug-civ-16-6", "short": "aug-civ-16-6", "author": "Augustine", "tradition": "latin", "date": 417, "datelabel": "413–427", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["not-to-angels", "faciamus-is-the-trinity", "one-authority-singular-verb"], "senses": ["literal"], "lemma": {"la": "Qualis intelligenda sit esse locutio, qua Deus Angelis loquitur", "en": "What kind of speech is to be understood, by which God speaks to the angels"}, "en": "That too, when the human was made, could have been understood of the angels — what was said, let us make a human, since he did not say, I shall make: but because there follows, to our image; and it is not lawful to believe that the human was made to the image of the angels, or that the image of the angels and of God is the same; therefore the plurality of the Trinity is rightly understood there. Which Trinity, however, because it is one God, even when he had said, let us make, it says, and God made the human to the image of God: he did not say, the gods made, or, to the image of the gods. Here too the same Trinity could be understood, as though the Father had said to the Son and the Holy Spirit, come, and going down let us confound their language there — if there were anything to prevent the angels being understood: to whom it rather belongs to come to God by holy motions, that is, by pious thoughts, by which the unchangeable Truth is consulted by them, as an eternal law in that supernal court of theirs.", "translator": "claude-draft", "orig": "Poterat et illud, quando factus est homo, de Angelis intelligi quod dictum est, Faciamus hominem, quia non dixit, Faciam: sed quia sequitur, ad imaginem nostram; nec fas est credere ad imaginem Angelorum hominem factum, aut eamdem esse imaginem Angelorum et Dei; ideo recte illic intelligitur pluralitas Trinitatis. Quae tamen Trinitas, quia unus est Deus, etiam cum dixisset, Faciamus: Et fecit, inquit, Deus hominem ad imaginem Dei (Gen. I, 26, 26) : non dixit, Fecerunt dii, aut, ad imaginem deorum. Poterat et hic eadem intelligi Trinitas, tanquam Pater dixerit ad Filium et Spiritum sanctum, Venite, et descendentes confundamus ibi linguam eorum; si aliquid esset, quod Angelos prohiberet intelligi: quibus potius convenit venire ad Deum motibus sanctis, hoc est cogitationibus piis, quibus ab eis consulitur incommutabilis Veritas, tanquam lex aeterna in illa eorum curia superna.", "olang": "la", "source": "PL 41, col. 483", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. The chapter is headed what kind of speech is to be understood, by which God speaks to the angels, and it is the closest the two benches come to holding the same page open. Augustine treats Gen 1:26 and Gen 11:7 — venite, et descendentes confundamus ibi linguam eorum — as one problem with one shape: both are plural, both could be addressed to angels, and each has to be decided on its own evidence. At Gen 1:26 he decides against the angels, because of ad imaginem nostram; at Gen 11:7, where there is no image clause, he grants that nothing prevents the angels being understood, and takes it that way. Now the other bench pairs the same two verses. R. Yoḥanan at b. Sanhedrin 38b lists the places where the minim found an opening and the refutation beside each: 'let us make a human in our image' answered by 'and God created the human in his image', and 'come, let us go down and confound their language' answered by 'and the LORD came down to see the city and the tower'. The same two verses, chosen for the same reason — a plural verb of divine speech — and set out as a pair. Augustine is refuting the angel reading of the first and accepting it for the second; R. Yoḥanan is refuting a plurality of makers in both. Neither knows the other. The pairing is not a topic they share but a structure the Hebrew text itself imposes, and both benches found it.", "slot": false}, {"id": "bede-gen-1-26", "short": "bede-gen-1-26", "author": "Bede", "tradition": "latin", "date": 720, "datelabel": "c. 720", "place": "Jarrow", "lat": 54.98, "lon": -1.49, "answers": ["faciamus-is-the-trinity", "not-to-angels", "trinity-in-the-formula"], "senses": ["literal"], "lemma": {"la": "In eo enim quod dicitur Faciamus, una ostenditur trium personarum operatio", "en": "For in the fact that it says 'let us make', one working of three persons is shown"}, "en": "But when it is said, let us make a human to our image and likeness, the unity of the holy Trinity is openly commended. For indeed the same undivided Trinity had been mystically intimated in the preceding forming of things, when it was said: and God said, let it be; and God made; and God saw that it was good. Now, however, this same thing is intimated more plainly, when it is said: let us make a human to our image and likeness — and rightly, because so long as there was no one who might be taught, the preaching of the Godhead lay hidden in the deep; but when the creation of a human began to be looked for, faith was revealed, and the teaching of truth plainly flashed out. For in the fact that it says, let us make, one working of three persons is shown; and in what follows, to our image and likeness, the one and equal substance of that same holy Trinity is indicated. For how would the image and likeness be one, if the Son were less than the Father, if the Holy Spirit were less than the Son, if the glory of the whole Trinity were not consubstantial and of the same power? Or how would it be said, let us make, if the cooperating power of three persons in one deity did not exist? For it could not be said to angels by God, let us make a human to our image and likeness, since no reasoning whatever allows us to believe that the image and likeness of God and of the angels is one and the same.", "translator": "claude-draft", "orig": "Cum autem dicitur faciamus hominem ad imaginem et similitudinem nostram, unitas sanctae Trinitatis aperte commendatur. Si quidem eadem individua Trinitas in praecedente rerum formatione mystice erat insinuata, quando dicebatur: et dixit Deus: Fiat, et fecit Deus; et vidit Deus quod esset bonum. Nunc autem manifestius haec ipsa insinuatur, cum dicitur: Faciamus hominem ad imaginem et similitudinem nostram, et recte, quia donec is qui doceretur non erat, in profundo fuit abdita praedicatio Deitatis; ubi vero coepit hominis exspectari creatio, revelata est fides, et evidenter dogma veritatis emicuit. In eo enim quod dicitur. Faciamus, una ostenditur trium personarum operatio; in eo vero quod sequitur, ad imaginem et similitudinem nostram, una et aequalis substantia ejusdem sanctae Trinitatis indicatur. Quomodo enim una esset imago et similitudo, si minor Patre Filius, si minor esset Filio Spiritus sanctus, si non consubstantialis ejusdem potestatis esset gloria totius Trinitatis? aut quomodo diceretur Faciamus, si trium in una deitate personarum cooperatrix virtus non esset? neque enim angelis a Deo dici poterat Faciamus hominem ad imaginem et similitudinem nostram, quia nulla prorsus ratio sinit ut Dei et angelorum unam esse eamdemque imaginem sive similitudinem credamus.", "olang": "la", "source": "PL 91, col. 28C", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. Bede takes the whole question over from the Latin Basil — 'so long as there was no one who might be taught, the preaching of the Godhead lay hidden in the deep' is Eustathius's sentence word for word — and turns a polemic into a lesson. The Jews are gone; what is left is a clean division of the verse into two proofs: faciamus gives one working of three persons, ad imaginem nostram gives one substance, and the angels are excluded by a ratio rather than by abuse. He also does something Augustine does not, and it is Rupert's argument three centuries early: the Trinity was already intimated mystically in the threefold formula of the earlier days — God said, God made, God saw that it was good — and is intimated more plainly here. This is the version that travels. Rabanus copies it verbatim at Fulda (PL 107:459C) and Angelomus at Luxeuil (PL 115:145A); neither is on this daf, because neither adds a word.", "slot": false}, {"id": "alcuin-int-36-37", "short": "alcuin-int-36-37", "author": "Alcuin", "tradition": "latin", "date": 796, "datelabel": "c. 796", "place": "Tours", "lat": 47.39, "lon": 0.69, "answers": ["faciamus-is-the-trinity", "dignity-of-the-creature"], "senses": ["literal"], "lemma": {"la": "Cur plurali numero dixit: Faciamus?", "en": "Why did he say it in the plural number: let us make?"}, "en": "Question 36. Why is it said of the human alone: let us make a human (Gen 1:26); whereas of the other creatures we read: God said? — Answer. So that, since a rational creature was being founded, it might be seen to be made with counsel, and so that its nobility might be shown. Question 37. Why did he say it in the plural number: let us make? — Answer. So that one working of three persons might be shown.", "translator": "claude-draft", "orig": "Inter. 36. Quare de solo homine dictum est: Faciamus hominem (Gen. I, 26) ; de aliis autem creaturis legitur: Dixit Deus?--Resp. Ut videlicet, quae [ Ms., quia] rationabilis creatura condebatur, cum consilio facta videretur, et ut ejus nobilitas ostenderetur. Inter. 37. Cur plurali numero dixit: Faciamus?--Resp. Ut ostenderetur trium una operatio personarum.", "olang": "la", "source": "PL 100, col. 520B", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. The whole crux reduced to two questions and twenty-eight words of answer, which is what the Interrogationes are for, and worth having on the daf precisely because it shows what the Carolingian school thought a pupil needed. Two distinct answers are given and neither cancels the other: the consultative form marks the dignity of the rational creature, and the plural number shows one working of three persons. Note that the first of these is the only thing Alcuin says about the change of formula, and it is not a Trinitarian point at all — it is an argument about the honour of the thing made, which is Bereshit Rabbah 8:8's argument for why the plural was worth the risk (Moses is told to write it anyway, so that the great should learn to consult the small) with the moral swapped from humility to nobility. Four questions later, at Inter. 40, Alcuin returns to it and gives the Augustinian pairing — cur iterum dixit: Creavit Deus hominem ad imaginem suam, cum antea dixisset: ad imaginem nostram? … ut utrumque, et pluralitas personarum, et unitas substantiae insinuaretur — but that is a distinct argument and is not merged into this slice. ⛔ Alcuin does not answer a lemma grep on this crux's Latin words: the Interrogationes are organised as questions and the lemma sits in the question, not in a running exposition.", "slot": false}, {"id": "wigbod-gen-1-26", "short": "wigbod-gen-1-26", "author": "Wigbod", "tradition": "latin", "date": 790, "datelabel": "c. 790", "place": "Tours", "lat": 47.39, "lon": 0.69, "answers": ["faciamus-is-the-trinity"], "senses": ["literal"], "lemma": {"la": "D. … M. Ad insinuandum pluralitatem personarum", "en": "D. … M. To intimate a plurality of persons"}, "en": "D. This first we say briefly, that it is not to be taken as a matter of indifference that in the other works it is said, God said, let it be; but here, God said, let us make. M. To intimate, if I may so put it, a plurality of persons, on account of the Father and the Son and the Holy Spirit — yet he at once warned that the unity of the deity is to be understood, saying: and God made the human to his own image.", "translator": "claude-draft", "orig": "D. Hoc primum breviter dicimus non indifferenter accipiendum, quod in aliis operibus dicitur, dixit Deus, Fiat, hic autem dixit Deus, Faciamus. M. Ad insinuandum, ut ita dicam, pluralitatem personarum, propter Patrem et Filium et Spiritum sanctum, quam tamen deitatis unitatem intelligendam statim admonuit dicens: Et fecit Deus hominem ad imaginem suam.", "olang": "la", "source": "PL 96, col. 1132C", "notes": "⚠ Anchor note: this is a comment on Gen 1:26, not on Gen 1:1–5. It is on the daf under the second clause of the anchor rule — it argues the same philological question the Elohim of Gen 1:1 raises, whether a plural form of speech about God implies a plurality in God — and is anchored on Gen 1:2 beside that material. Augustine's sentence from De Genesi ad litteram III.19 cut in half and given to two speakers, D and M, so that the observation beco
