 keeps everything after it. This is the Carolingian method visible in one paragraph: an inherited exposition, silently abridged, with the compiler's own thesis set at its head. On the id: K7 already holds a witness called rabanus-gen-1-1 which is in fact on Gen 1:2, so this one takes the b suffix (see notes/SOURCES-FINDINGS.md).", "slot": false}, {"id": "angelom-gen-1-1", "short": "angelom-gen-1-1", "author": "Angelomus of Luxeuil", "tradition": "latin", "date": 845, "datelabel": "c. 845", "place": "Luxeuil", "lat": 47.82, "lon": 6.38, "answers": ["bereshit-book-name"], "senses": ["translation"], "lemma": {"la": "Unde Bresith Hebraice, Latine non immerito Genesis interpretatur", "en": "whence Bresith in Hebrew is not undeservedly rendered Genesis in Latin"}, "en": "It is worth asking why this volume is called Genesis in particular, since many things are recorded in it which are known not to pertain to generation — unless it be that the Hebrews have the custom of imposing the names of books from their openings, as Exodus and many others are named. Whence Bresith in Hebrew is not undeservedly rendered Genesis in Latin: because in its very opening the creation of heaven and earth, and the generation of men and living creatures, is narrated.", "translator": "claude-draft-approved", "orig": "libet inquirere quare volumen istud specialiter Genesis vocetur, cum in eo multa commemorantur quae ad generationem non pertinere noscuntur, nisi quia consuetudo est Hebraeorum ex principiis nomina librorum imponere, sicut Exodus, et multi alii nuncupantur. Unde Bresith Hebraice, Latine non immerito Genesis interpretatur: eo quod in ipso exordio de creatione coeli, ac terrae, et generatione hominum animantiumque narratur.", "olang": "la", "source": "PL 115, col. 111A", "notes": "Jerome's last remark on the verse, promoted to the first question of a commentary. Angelomus keeps the Hebrew custom of naming books from their first words and draws from it a conclusion Jerome did not: that Bresith is properly rendered Genesis, because what stands at the opening is generation. The Latin bench thus ends by treating the crux word as the title of a book rather than as a word in a sentence. The rabbinic bench never loses the sentence, because for it the word governs what follows — either the Torah, by which God created, or, in Rashi's plain sense, the clause 'when God began to create'.", "slot": false}, {"id": "remigius-gen-1-1", "short": "remigius-gen-1-1", "author": "Remigius of Auxerre", "tradition": "latin", "date": 900, "datelabel": "c. 900", "place": "Auxerre", "lat": 47.8, "lon": 3.57, "answers": ["principio-temporis", "world-has-a-beginning"], "senses": ["literal"], "lemma": {"la": "In principio, et subauditur: temporis", "en": "'In the beginning' — and 'of time' is understood"}, "en": "At the beginning of this volume the philosophers are refuted, who tried to argue about the creation of the world: Plato, for instance, who said there were three principles, namely God, the exemplar, and matter, and that God did not create all things from nothing as their author, but that matter furnished help to him as to a workman in the making of things. Aristotle said there were two principles, namely matter and form, and something third which he wished to call, I know not what, the operative. Opposing their errors, Moses, as chosen by God, is said to have shown the truth, showing that God formed all things at once out of nothing — not indeed in time, but at the beginning of time, saying 'In the beginning', with 'of time' understood; whence it is beyond doubt that time then began, which before was not at all.", "translator": "claude-draft-approved", "orig": "In principio hujus voluminis philosophi confutantur, qui de mundi creatione conati disputare, sicut Plato, qui tria dixit esse principia, Deum videlicet, exemplar, et materiam, et Deum non quasi auctorem ex nihilo cuncta creasse, sed quasi opifici in rebus creandis materiam adjutorium praestitisse. Aristoteles autem duo dixit esse principia, materiam scilicet et speciem, tertium quiddam nescio quid volens dicere operatorium appellavit. Quorum erroribus obvians Moyses utpote a Deo electus veritatem dicitur demonstrasse, ostendens Deum cuncta simul ex nihilo formasse, non quidem in tempore, sed in initio temporis dicens: In principio, et subauditur: temporis, patet procul dubio tunc tempus coepisse quod antea minime erat.", "olang": "la", "source": "PL 131, col. 53D", "notes": "Remigius makes the temporal reading do the polemical work Ambrose gave it, and does the crux's grammar out loud: 'In principio, and of time is understood' — a supplied genitive, which is what every Latin reader is doing silently. The named opponents are Plato with his three principles and Aristotle with his two, and the distinction he needs is not in time but at the beginning of time. His neighbour on the rabbinic bench is Bereshit Rabbah 1:9, where a philosopher tells Rabban Gamliel that God is a great artisan who found good materials to hand and is told the list of them is a list of things created — the same refutation of the same philosophy, on the same verse, with the same absence of contact. That section is K4's.", "slot": false}, {"id": "glossa-1-1", "short": "glossa-1-1", "author": "Glossa ordinaria (school of Laon)", "tradition": "latin", "date": 1120, "datelabel": "compilation 1110–1130", "place": "Laon", "lat": 49.56, "lon": 3.62, "answers": ["principio-in-filio", "principio-temporis"], "senses": ["literal", "allegorical", "spiritual"], "lemma": {"la": "« In principio. » Filio", "en": "'In the beginning.' In the Son"}, "en": "Verse 1. 'In the beginning he created,' etc. He does not say: In the beginning God says, Let heaven and earth be made. But he said, 'Let there be light, and light was made' — because under the name of heaven and earth was to be comprehended universally whatever God made, and then it was to be set out in parts how he made it. Whence there follows: 'God said, Let it be' — that is, he made it through his Word. Or, because when formless matter, spiritual or bodily, was first coming to be, it was not to be said 'God said, Let it be'; for it was unfitting that 'let it be' should be said by God, since imperfection does not imitate the form of the Word except when a creature is perfected by the turning of its kind to the Creator; so that when it is said 'God said, Let it be', we may understand him to be calling the creature's imperfection back to himself. When therefore it is said 'In the beginning God made heaven and earth', mention is made of the Son, because he is the Beginning; but when it is said 'God said, Let it be', mention is made that he is the Word. By 'beginning' he notes the origin of the creature existing from him; by 'Word', the perfecting of the creature called back from him to himself, that it may be formed by imitating the unchangeable form of the Word. […] 'In the beginning,' etc. (BEDE, Hexaemeron I, vol. II, col. 13.) Scripture, in intimating the creation of the world, shows in its first word the eternity and omnipotence of God: for him whom it declares to have created the world in the beginning of times, it signifies to have existed eternally before times. […] 'In the beginning,' etc. Heaven — not the visible firmament, but the empyrean, that is, the fiery or intellectual heaven, so called not from burning but from splendour, which was at once filled with angels. […] (ALCUIN, on Genesis, vol. I.) 'In the beginning.' In the Son, by whose becoming man it became plain who were the heavenly and who the earthly. Heaven, the spiritual creature, perfect and blessed from its outset. Earth, bodily matter, still imperfect. […] Mystically. 'In the beginning God created heaven' — namely those who bore the image of the heavenly. 'And earth', that is, those who afterwards, by growing proud, bore the earth, that is, the image of the earthly man, and made themselves deformed. 'But the earth was empty', because it had laid aside its good form. 'And void', of the fruit of good work. 'And there were darknesses', namely the privation of the true light; 'over the face of the abyss', namely the hearts of the proud.", "translator": "claude-draft-approved", "orig": "VERS. 1.-- « In principio creavit, » etc. Non dicit: In principio dicit Deus, Fiat coelum et terra. Sed dixit: « Fiat lux, et facta est lux, » quoniam universaliter nomine coeli et terrae comprehendendum erat quidquid fecit Deus, deinde per partes explicandum quomodo fecit. Unde sequitur: « Dixit Deus, Fiat, » id est, per verbum suum fecit. Vel quia cum primum fiebat informis materia spiritualis, vel corporalis, non erat dicendum: « Dixit Deus, Fiat; » incongruum enim erat a Deo dici, « fiat, » quia formam verbi non imitatur imperfectio, nisi cum generis sui conversione ad creatorem sit perfecta creatura; ut cum dicitur: « Dixit Deus, Fiat, » intelligamus eum ad se imperfectionem creaturae revocare. Cum ergo dicitur: « In principio fecit Deus coelum et terram, » commemoratio Filii fit, quia principium est; sed cum dicitur: « Dixit Deus, Fiat, » commemoratur quia Verbum est. Per principium notat exordium creaturae existentis ab illo; per Verbum, perfectionem creaturae ab illo ad ipsum revocatae, ut formetur imitando formam Verbi incommutabilem. Non enim habet vitam informem Verbum Dei, cui est idem esse quod vivere; imo idem vivere quod beate vivere. Creatura vero spiritualis habet informem vitam, cui non est hoc esse quod vivere; nec vivere quod beate vivere: quia, aversa a sapientia Dei, stulte et misere vivit. « In principio, » etc. (BEDA, Hexaem. lib. I, tom. II, col. 13 ª.) Creationem mundi insinuans Scriptura, primo verbo aeternitatem et omnipotentiam Dei ostendit: quem enim in principio temporum mundum creasse perhibet, eumdem ante tempora aeternaliter significat exstitisse. Et quem in conditionis initio coelum et terram creasse narrat, tanta celeritate operationis omnipotentem esse declarat, cui voluisse, facere est. Bene ergo dicitur: « In principio creavit, » etc. Utrumque scilicet, simul, quamvis utrumque simul ab homine non dicatur. Unde propheta terram in initio factam ostendit dicens, psal. CI: « Initio tu, Domine, terram fundasti, » etc. « In principio, » etc. Coelum non visibile firmamentum, sed empyreum, id est, igneum vel intellectuale, quod non ab ardore, sed a splendore dicitur, quod statim repletum est angelis. Unde in Job XXXVIII: « Ubi eras cum me laudarent astra matutina, » etc. Et nota tria hic commemorari elementa. Nomine coeli, aerem intelligimus. Nomine terrae, ipsam et ignem qui in ea latet. Quarti, id est, aquae in sequentibus fit mentio. (ALCUIN. in Gen. tom. I.) « In principio. » Filio, quo humanato patuit qui essent coelestes, qui terreni. Coelum, creatura spiritualis, ab exordio perfecta et beata. Terra, corporalis materies adhuc imperfecta. Coelum, informem materiam spiritualis vitae, sicut in se potest existere non conversa ad Creatorem in quo formatur. Terram, corporalem, sine omni qualitate quae apparet in materia formata. (BEDA in Gen., tom. II, col. 191.) Scriptura ait: « Qui fecisti mundum de materia informi (Sap. XI) . » Materia facta est de nihilo. Species mundi de materia informi. Proinde duas res fecit Deus ante omne tempus, angelicam creaturam et materiam informem. Quamvis enim Salomon dicat: « Qui vivit in « aeternum, creavit omnia simul (Eccli. XVIII) , secundum originem tamen informis materies antecedit formatam speciem. Itaque mundum, et angelos, et animam de nihilo fecit Deus: hominem et creaturas caeteras de aliquo. (Ibid., col. 192.) Septem sunt coeli, quorum haec sunt nomina, aer, aether, olympus, spatium vel igneum, firmamentum, coelum angelorum, et Trinitatis. Hieronymus autem dicit coelum Trinitatis primum, secundum angelorum, tertium firmamentum. Mystice. « In principio creavit Deus coelum. » Eos scilicet qui coelestis imaginem portaverunt. « Et terram, » id est eos qui postea superbiendo, terram, id est terreni hominis imaginem, portantes, se recerunt deformes. « Terra autem erat inanis, » quia deposuerat formam bonam. « Et vacua, » boni operis fructu. « Et tenebrae erant, » veri scilicet luminis privatio; « super faciem abyssi, » corda scilicet superborum.", "olang": "la", "source": "PL 113, col. 67B", "notes": "The margin as a settlement rather than an argument. Five glosses stand on this verse: an unattributed Augustinian one distinguishing Beginning from Word (the Son is called the Beginning where origin is meant and the Word where perfecting is meant); three from Bede, on eternity, on the simultaneity of heaven and earth, and on the empyrean heaven; and then Alcuin's, which is one word — Filio. That is the whole apparatus a twelfth-century reader met: Jerome's refutation is nowhere on the page, and the reading he had called false stands unargued in the margin under a great name. Elisions marked […] are Bede's house-building simile, his Ps 102 argument, the seven heavens list with Jerome's three, and the Sapientia 11 gloss on unformed matter, all of which are on the making rather than on the word 'beginning'. Wilson's edition of the Glossa (migne.app/glossa) supersedes this draft when its English reaches Gen 1:1.", "slot": false}, {"id": "bruno-gen-1-1", "short": "bruno-gen-1-1", "author": "Bruno of Segni", "tradition": "latin", "date": 1090, "datelabel": "1079–1123", "place": "Segni", "lat": 41.69, "lon": 13.02, "answers": ["principio-first-of-all", "world-has-a-beginning"], "senses": ["literal"], "lemma": {"la": "In principio creaturarum omnium", "en": "In the beginning of all creatures"}, "en": "'In the beginning,' he says, and before every creature, God created heaven and earth. For this the Psalmist too testifies, saying: 'And you, God, in the beginning founded the earth, and the heavens are the works of your hands' (Ps 102:25 [Vg 101:26]). Not, therefore, heaven before earth, but God created heaven and earth together. Whence also this: 'He who lives for ever created all things at once' (Sir 18:1). For even if God is narrated in this same book to have made all things in six days, it is not to be doubted that he nevertheless created all things at once out of nothing. He created at once the very matter of all things, out of which he commanded the rest to be made at distinct times, as he willed. Let it be said, then: In the beginning of all creatures God created heaven — and those things, namely, which are contained in it, that is, the angels and the heavenly powers — and the earth, already as it were pregnant and in labour, and the matter and mother of all those things that arise from it.", "translator": "claude-draft-approved", "orig": "In principio, inquit, et ante omnem creaturam creavit Deus coelum et terram. Hoc enim et Psalmista testatur, dicens: « Et tu in principio Deus terram fundasti, et opera manuum tuarum sunt coeli (Psal. CI, 26) . » Non igitur prius coelum, quam terram, sed simul et coelum Deus creavit et terram. Unde et istud: « Qui vivit in aeternum creavit omnia simul (Eccli. XVIII, 1) . » Nam et si sex diebus omnia Deus hoc eodem in libro fecisse narratur, simul tamen ex nihilo cuncta creasse dubitari non debet. Ipsam omnium rerum materiam simul creavit, ex qua discretis temporibus caetera, prout voluit, fieri praecepit. Dicatur ergo: In principio creaturarum omnium creavit Deus coelum, et ea scilicet quae continentur in eo, id est angelos, virtutesque coelestes, et terram jam quasi praegnantem et parturientem, omniumque eorum materiam et matrem quae ex ea oriuntur.", "olang": "la", "source": "PL 164, col. 147B", "notes": "Bruno takes the second of Augustine's three readings, the one nobody else on the bench builds on: not in the beginning of time and not in the Son but 'in the beginning of all creatures', that is, before anything else — and he takes it in order to get simul out of the verse, so that Sir 18:1 and the six days can both stand. His pregnant earth, matter and mother of what rises from it, is the same instinct as Bereshit Rabbah 1:1's architect's plans: read the first verse as a statement about what was available to the maker. The Corpus Corporum text of Bruno is the dirtiest on the bench (K7 found Dei. vero, K10 found tuce for luce); nothing in this slice looks corrupt, but it is not collated.", "slot": false}, {"id": "bruno-gen-1-1b", "short": "bruno-gen-1-1b", "author": "Bruno of Segni", "tradition": "latin", "date": 1090, "datelabel": "1079–1123", "place": "Segni", "lat": 41.69, "lon": 13.02, "answers": ["principio-in-filio"], "senses": ["allegorical"], "lemma": {"la": "In quo principio? In eo utique qui ait: Ego principium", "en": "In what beginning? In him, surely, who says: I am the Beginning"}, "en": "In what beginning? In him, surely, who says: 'I am the Beginning, who also speak to you' (John 8:25) — 'for all things were made through him, and without him was made nothing' (John 1:3). In this beginning, therefore, God created from the outset the whole fabric of the world and the very orders of the angels.", "translator": "claude-draft-approved", "orig": "In quo principio? In eo utique qui ait: « Ego principium qui et loquor vobis (Joan. VIII, 26) .-- Omnia enim per ipsum facta sunt, et sine ipso factum est nihil (Joan. I, 3) . » In hoc igitur principio omnem mundi fabricam, ipsosque angelorum ordines ab exordio creavit Deus.", "olang": "la", "source": "PL 164, col. 150A", "notes": "The same commentator, the same verse, the other answer — and the structure is the point. Bruno finishes the literal exposition of the whole first day, and only then turns back: 'having set these things out to the letter, let us see what they also signify allegorically. In what beginning? In him, surely, who says: I am the Beginning.' The two readings are not rivals for him but layers, taken in order, and he does not ask which is the sense of the word. This is how the Latin bench keeps three answers alive for seven centuries without ever having to lose two of them; Peter Comestor's 'the phrase is to be repeated' is the same manoeuvre, made explicit.", "slot": false}, {"id": "rupert-gen-1-1", "short": "rupert-gen-1-1", "author": "Rupert of Deutz", "tradition": "latin", "date": 1117, "datelabel": "1112–1117", "place": "Liège", "lat": 50.63, "lon": 5.57, "answers": ["principio-in-filio", "world-has-a-beginning"], "senses": ["literal", "allegorical"], "lemma": {"la": "vitium est in superfluitate dictionis", "en": "it is a vice of superfluity of expression"}, "en": "Since the creation itself is the beginning of the world, why was it said thus: 'In the beginning he created'? For it is the same as if it were said: In the beginning he made the beginning; and if you take 'beginning' here in the ordinary way when it is said 'in the beginning he created', it is a vice of superfluity of expression. Well, therefore, is 'beginning' taken in this place as a kind of proper name of the Son, because he himself so willed it, who when he was asked by the Jews, 'Who are you?', said: 'The Beginning, who also speak to you' (John 8:25). For truly in this Beginning God created heaven and earth, because all things were made through him (John 1:3). Another Scripture confesses this too when it says: 'You have made all things in wisdom' (Ps 104:24 [Vg 103:24]) — which wisdom is none other than the Word of God, the Word God, who, as has been said, named himself the beginning. Not indeed that the native tongue of this Scripture, that is Hebrew, signifies son and beginning by one word: for son is ben in that language, and beginning is bresith. But we say this too, that though not in word, yet in sense the Son is the Beginning. He is Son, because born of God; Beginning, because he is shown to be the first and efficient cause of all creatures. And so in the beginning, that is, in the Son, in his Word, in his Wisdom, God created heaven and earth. Created, I say — that is, not, as the philosophers of the gentiles vainly supposed, that he had matter or hyle coeval with himself, but he made the substance of heaven and earth out of nothing.", "translator": "claude-draft-approved", "orig": "Cum ipsa creatio principium mundi sit, cur sic dictum est: In principio creavit? Idem enim est ac si diceretur: In principio principium fecit; sed si hoc modo vulgariter hic accipias principium, cum dicitur in principio creavit, vitium est in superfluitate dictionis. Bene ergo hoc loco principium sic accipitur, tanquam proprium quoddam Filii vocabulum, quia videlicet sic ipse voluit, qui cum interrogaretur a Judaeis: Tu quis es? Principium, ait, qui et loquor vobis (Joan. VIII) . Nam vere in hoc principio creavit coelum et terram Deus, quia omnia per ipsum facta sunt (Joan. I) . Hoc et alia Scriptura fatetur, cum dicit: Omnia in sapientia fecisti (Psal. CIII) , quae videlicet sapientia non est alia quam Verbum Dei, Verbum Deus, qui, ut jam dictum est, seipsum principium nuncupavit. Non quidem nativa Scripturae hujus lingua, scilicet Hebraica filium et principium eadem voce significat, filius quippe ben, principium vero bresith dicitur in illa lingua, sed et hoc dicimus, quod et si non voce, sensu tamen Filius principium est. Filius est, quia de Deo natus. Principium, quia creaturarum omnium prima et efficiens causa esse probatur. Itaque in principio, id est in Filio, in Verbo suo, in sapientia sua creavit Deus coelum et terram. Creavit, inquam, id est, non ut philosophi gentilium vane putaverunt, sibi coaevam habuit hylen, sive materiam, sed de nihilo fecit coeli et terrae substantiam.", "olang": "la", "source": "PL 167, col. 202A", "notes": "The best argument the Latin bench produces on this crux, and the one that shows it had absorbed Jerome. Rupert does not begin from the proof texts; he begins from a defect in the sentence. If the creation is itself the world's beginning, then 'in the beginning he created' says 'in the beginning he made the beginning', which as ordinary Latin is a vitium, a redundancy. A word that would be superfluous in the common sense must be a proper name — so principium here names the Son. Then, having reached Jerome's conclusion by a route Jerome never took, he concedes Jerome's philology in Jerome's own terms and with the Hebrew words in his mouth: son is ben, beginning is bresith, they are not one word, and the identity is of sense and not of speech. That is the twelfth century answering the fourth on the fourth century's ground.", "slot": false}, {"id": "abelard-hex-1-1", "short": "abelard-hex-1-1", "author": "Peter Abelard", "tradition": "latin", "date": 1133, "datelabel": "1130–1135", "place": "The Paraclete (Nogent-sur-Seine)", "lat": 48.49, "lon": 3.5, "answers": ["principio-first-of-all", "principio-temporis"], "senses": ["literal"], "lemma": {"la": "ac si diceretur: In prima die", "en": "as if it were said: On the first day"}, "en": "But when in what follows he says a second day and a third and the rest, he means by the first day that on which heaven and earth were created, as it was said: 'In the beginning God created heaven and earth', on which also light was created or divided from the darkness. For to the works of the first day there belongs only the creation of heaven and earth, which is to be assigned to the first day, in respect of which first day the second or third day is so called; so that 'in the beginning he created' is as if it were said: On the first day — that is, before the other works that follow.", "translator": "claude-draft-approved", "orig": "Cum vero in sequentibus dicit diem secundum et tertium, etc. diem primum intelligit quo coelum et terra creata sunt, sicut dictum est: In principio creavit Deus coelum et terram, in quo etiam lux est creata vel a tenebris divisa. Ad opera quippe primae diei sola creatio coeli et terrae pertinet quae primo diei deputanda est, respectu cujus videlicet primae diei secundus aut tertius dies dicatur, ut tale sit in principio creavit ac si diceretur: In prima die, hoc est ante caetera quae sequuntur opera.", "olang": "la", "source": "PL 178, col. 741A", "notes": "Abelard reads the word as a position in a series and nothing more: 'in the beginning' means 'on the first day', because a second and a third day are named afterwards and something must be first for them to be second to. Of everything on the Latin bench this is the closest to Rashi's plain sense — both make the phrase relative to what follows rather than absolute — and it is arrived at from the opposite end, Rashi from the construct state of a Hebrew noun and Abelard from the ordinals of the Latin chapter. Abelard is also the Latin witness that K7 found reporting the Hebrew against Jerome (volitabat at PL 178:735B): he is the one commentator on this bench who habitually asks what the words are doing rather than what they signify.", "slot": false}, {"id": "hugh-sacr-1-1", "short": "hugh-sacr-1-1", "author": "Hugh of St Victor", "tradition": "latin", "date": 1134, "datelabel": "1130–1137", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["principio-temporis", "world-has-a-beginning"], "senses": ["literal"], "lemma": {"la": "in principio temporis, vel potius cum ipso tempore", "en": "in the beginning of time, or rather with time itself"}, "en": "For that that first matter of all things arose in the beginning of time, or rather with time itself, is clear from what was said: 'In the beginning God created heaven and earth.' But how long it remained in this unformedness or confusion, Scripture does not plainly show. To me, however, it seems, so far as I can conjecture, that between the creation and the disposing of things there was indeed an order of time but no delay interposed; so that it can truly be said that this was made after that, yet that between this making and that no postponement whatever came between.", "translator": "claude-draft-approved", "orig": "Nam quod illa prima rerum omnium materia, in principio temporis, vel potius cum ipso tempore exorta sit, constat ex eo quod dictum est: In principio creavit Deus coelum et terram. Quamdiu autem in hac informitate sive confusione permanserit, Scriptura manifeste non ostendit. Mihi autem videtur (quantum ego conjicere valeo) inter creationem et dispositionem rerum, ordinem quidem temporis sed nullam fuisse moram interjectam; ita ut vere quidem dici possit, hoc post illud factum fuisse; sed inter hoc factum et illud nullam omnino dilationem intervenisse.", "olang": "la", "source": "PL 176, col. 192A", "notes": "Hugh sharpens the temporal reading to the point where it stops being a place in time at all: not in the beginning of time but 'or rather with time itself', so that the verse dates nothing, it institutes the possibility of dating. From that he draws the conclusion the schools needed — that between creation and the ordering of things there was an order of time but no interval — which is how a literal six days can be held together with 'he created all things at once'. Compare b. Chagigah 12a, where the measure of the day and the measure of the night are themselves among the ten things made on the first day: both benches, asked what the beginning is the beginning of, answer that time is inside the creature and not outside it.", "slot": false}, {"id": "honorius-hex-1-1", "short": "honorius-hex-1-1", "author": "Honorius Augustodunensis", "tradition": "latin", "date": 1120, "datelabel": "1110–1130", "place": "Regensburg", "lat": 49.02, "lon": 12.1, "answers": ["principio-in-filio"], "senses": ["allegorical"], "lemma": {"la": "Moyses propheta Filium principium, Joannes autem Patrem principium", "en": "Moses the prophet has the Son as the beginning, but John the Father"}, "en": "And it is to be noted that Moses the prophet records the Son as the beginning, and all things created in him; but John the apostle proclaims the Father as the beginning, and that the Son always remained in him, coequal to him, and that all things were made through him. For without doubt they announce to us in concord the one substance of both. It is said therefore (Gen 1): 'In the beginning God created heaven and earth' — that is, God the Father created in the Son, at once, the heavenly and the earthly, the visible and the invisible.", "translator": "claude-draft-approved", "orig": "Et notandum, quod Moyses propheta Filium principium, et in eo omnia creata commemorat: Joannes autem apostolus Patrem principium, et Filium in eo semper, ei coaequalem mansisse, et omnia per ipsum facta praedicat. Quia nimirum unam utriusque substantiam concorditer nobis denuntiant. Dicitur itaque (Gen. I) : In principio creavit Deus coelum et terram, hoc est, Deus Pater creavit in Filio simul coelestia, et terrestria, visibilia et invisibilia.", "olang": "la", "source": "PL 172, col. 254B", "notes": "The neatest thing said on this crux in the twelfth century, and the neatness is the problem. Honorius observes that Genesis and John begin with the same words and mean opposite persons by them: in Genesis 'the beginning' is the Son, in whom all is created; in John 'the beginning' is the Father, in whom the Son always was. The two openings had been read together since Jerome as evidence for one another; Honorius is the first on this bench to notice that reading them together requires the same phrase to name two different persons, and he resolves it not by choosing but by an appeal to the single substance. Honorius has already appeared on K7 (PL 172:254C) and K10 (255D) from the same columns of the same work.", "slot": false}, {"id": "comestor-hs-1-1", "short": "comestor-hs-1-1", "author": "Peter Comestor", "tradition": "latin", "date": 1170, "datelabel": "1169–1173", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["read-it-twice", "principio-in-filio", "principio-temporis", "principio-first-of-all"], "senses": ["literal", "allegorical"], "lemma": {"la": "iterandum est in principio", "en": "'in the beginning' is to be repeated"}, "en": "But Moses prophesied God alone to be eternal, and the world created without pre-existing matter. And it was created in the beginning, that is, in the Son; and 'in the beginning' is to be repeated thus: In the beginning God created heaven and earth, in the beginning, namely, of time. For the world and time are coeval. And as God alone is eternal, so the world is everlasting, that is, always eternal, eternal in a temporal way; the angels too are everlasting. Or: in the beginning of all creatures he created heaven and earth, that is, he made these primordial creatures, and made them at once.", "translator": "claude-draft-approved", "orig": "Moyses vero solum Deum aeternum prophetavit, et sine praejacenti materia mundum creatum. Creatus autem est in principio, id est in Filio, et iterandum est in principio sic: In principio creavit Deus coelum et terram, in principio scilicet temporis. Coaeva enim sunt mundus et tempus. Sicut autem solus Deus aeternus, sic mundus sempiternus, id est semper aeternus, temporaliter aeternus angeli quoque sempiterni. Vel in principio omnium creaturarum, creavit coelum et terram, id est has creaturas primordiales fecit, et simul.", "olang": "la", "source": "PL 198, col. 1056A", "notes": "The settlement, stated as a rule of reading: iterandum est in principio — say the phrase twice. Once it means in the Son, once it means at the beginning of time, and Comestor then adds Bruno's third sense as an alternative, in the beginning of all creatures. Augustine had listed the three as questions; the handbook that taught Europe the Bible for three hundred years prints all three as the answer and instructs the reader to take the words over again for each. Note the distinction Comestor needs and that the English must keep: God alone is aeternus, the world and the angels are sempiternus, everlasting — 'eternal in a temporal way'. The preceding columns, where he sets Plato, Aristotle and Epicurus against Moses, are not sliced here; that doxography is Remigius' material and belongs with K4.", "slot": false}], "threads": [{"id": "t-k1-01", "from": "jerome-hq-1-1", "to": "lxx-1-1", "type": "cites", "evidence": "Jerome names the Seventy as his first witness against the reading 'in the Son': 'Nam et Septuaginta Interpretes, et Symmachus, et Theodotion, in principio, transtulerunt.' The Greek is what decides the Latin.", "crux": "beginning-of-what"}, {"id": "t-k1-02", "from": "vulgate-1-1", "to": "lxx-1-1", "type": "transmits", "evidence": "in principio renders ἐν ἀρχῇ and nothing else, and the translator says in the Hebrew Questions why he refused in Filio. Every Latin argument on this crux is conducted on a word Jerome chose against pressure to choose another.", "crux": "beginning-of-what"}, {"id": "t-k1-03", "from": "targ-onk-1-1", "to": "lxx-1-1", "type": "parallel", "evidence": "be-qadmin and ἐν ἀρχῇ make the same decision independently: turn the Hebrew word into a plain adverb of time, supply nothing, and let no construct be heard. Pseudo-Jonathan's min avvela does the same a third time.", "crux": "beginning-of-what"}, {"id": "t-k1-04", "from": "targ-neof-1-1", "to": "targ-onk-1-1", "type": "contests", "evidence": "Two Aramaic versions of one Hebrew word, and only one of them interprets: Onkelos writes be-qadmin, 'in former times'; Neofiti writes min qadmin be-ḥokhmah, 'from the first, in wisdom', and adds a second verb, 'and finished'. What Onkelos leaves as a time, Neofiti makes an instrument.", "crux": "beginning-of-what"}, {"id": "t-k1-05", "from": "targ-psj-1-1", "to": "targ-onk-1-1", "type": "parallel", "evidence": "min avvela beside be-qadmin: the same refusal to interpret, in a different word. Three targums on one verse give three renderings of bereshit and only Neofiti's carries a doctrine.", "crux": "beginning-of-what"}, {"id": "t-k1-06", "from": "br-1-4", "to": "br-1-1", "type": "echoes", "evidence": "The same proof text put to the same use two sections later: 'The Lord made me reshit of his way' (Prov 8:22) makes the Torah the reshit in 1:1, and in 1:4 makes the Torah the first of the six things that preceded the world and settles its precedence over the Throne of Glory.", "crux": "beginning-of-what"}, {"id": "t-k1-07", "from": "br-1-8", "to": "br-1-1", "type": "echoes", "evidence": "1:1 reads Prov 8:30's amon as uman, artisan; 1:8 counts the builder's six materials against Prov 8:22–23's six words of precedence. Both treat Proverbs 8 not as a proof text reached for but as the chapter that comments on Genesis 1:1.", "crux": "beginning-of-what"}, {"id": "t-k1-08", "from": "rashi-1-1b", "to": "br-1-1", "type": "cites", "evidence": "Rashi reproduces the midrashic answer with its two proof texts — the Torah called reshit darko (Prov 8:22) and Israel called reshit tevu'ato (Jer 2:3) — and marks it as what 'our rabbis expounded', before setting his own plain sense against it.", "crux": "beginning-of-what"}, {"id": "t-k1-09", "from": "rashi-1-1b", "to": "br-1-4", "type": "echoes", "evidence": "Bereshit Rabbah 1:4 derives a series of referents for reshit from a series of verses — Torah, ḥalla, tithes, first fruits; Rashi keeps the method and reduces the list to two, Torah and Israel, which are the two that make the verse a claim about election.", "crux": "beginning-of-what"}, {"id": "t-k1-10", "from": "ibn-ezra-1-1", "to": "rashi-1-1b", "type": "parallel", "evidence": "The same conclusion from the same evidence with no acknowledgement: bereshit is a construct, like 'in the reshit of the reign of Jehoiakim' (Jer 26:1), and the objection that a construct cannot govern a finite verb is answered from Hos 1:2 by both. Ramban, reading them side by side, says Ibn Ezra 'explained it in an identical way'.", "crux": "beginning-of-what"}, {"id": "t-k1-11", "from": "ramban-1-1", "to": "rashi-1-1b", "type": "contests", "evidence": "Ramban quotes Rashi's plain sense verbatim and then breaks its premise: reshit is not everywhere construct — 'declaring the end mereshit' (Isa 46:10) and 'he chose reshit for himself' (Deut 33:21) stand absolute. The grammatical argument that made the modern translations is refuted inside the tradition that made it, two centuries on.", "crux": "beginning-of-what"}, {"id": "t-k1-12", "from": "ramban-1-1", "to": "ibn-ezra-1-1", "type": "cites", "evidence": "Ramban names R. Abraham and reports the refinement that is Ibn Ezra's own and not Rashi's — that the vav of ve-ha'aretz serves as 'when' — and draws its consequence, that on Ibn Ezra's reading only light was created on the first day.", "crux": "beginning-of-what"}, {"id": "t-k1-13", "from": "targ-neof-1-1", "to": "br-1-4", "type": "parallel", "evidence": "R. Banai proves that the world was created for the merit of the Torah from Prov 3:19, 'the Lord founded the earth be-ḥokhmah, with wisdom'; Neofiti puts that same be-ḥokhmah inside Genesis 1:1 as the translation of bereshit. A proof text in one place is the text itself in the other.", "crux": "beginning-of-what"}, {"id": "t-k1-14", "from": "aug-civ-11-32", "to": "br-1-1", "type": "parallel", "evidence": "The identical inference on both benches. Augustine: in principio means in the Son, because Ps 104:24 says 'you have made all things in wisdom' and Wisdom is the Son. Bereshit Rabbah: bereshit means by the Torah, because Prov 8:22 says 'the Lord made me reshit of his way' and that speaker is the Torah. One move, one kind of proof text, two Wisdoms, and no contact in either direction.", "crux": "beginning-of-what"}, {"id": "t-k1-15", "from": "aug-conf-11-9", "to": "targ-neof-1-1", "type": "parallel", "evidence": "'In this Beginning, God, you made heaven and earth: in your Word, in your Son, in your Wisdom' is, as a sentence, what Neofiti prints as the text of Genesis 1:1. A Latin bishop's prayer and a Palestinian targumist's translation arrive at the same clause, and mean by Wisdom the second person of the Trinity and the Torah respectively.", "crux": "beginning-of-what"}, {"id": "t-k1-16", "from": "abelard-hex-1-1", "to": "rashi-1-1b", "type": "parallel", "evidence": "Both make the first word relative to what follows rather than absolute — Abelard because a second and third day are named and something must be first for them to be second to, Rashi because reshit is a construct and the clause is subordinate. The closest the two benches come on this crux, reached from opposite ends of two grammars.", "crux": "beginning-of-what"}, {"id": "t-k1-17", "from": "remigius-gen-1-1", "to": "ramban-1-1", "type": "parallel", "evidence": "The same doctrinal stake stated on both benches at the same place in the commentary: for Remigius the verse exists to refute Plato and Aristotle and prove that time began; for Ramban whoever thinks the world eternal 'denies the essential principle and has no Torah at all'.", "crux": "beginning-of-what"}, {"id": "t-k1-18", "from": "aug-gnm-1-2", "to": "ambrose-hex-1-2", "type": "echoes", "evidence": "The John 8:25 answer, taken over from the man Augustine had been hearing preach at Milan a year or two before: 'or he himself is the beginning of all things … the Son of God answered, The Beginning, who also speak to you.' After Ambrose no Latin witness on this crux argues without that verse.", "crux": "beginning-of-what"}, {"id": "t-k1-19", "from": "aug-gnl-imp-2-6", "to": "aug-gnm-1-2", "type": "echoes", "evidence": "The same author returning to the same question with the terms sharpened: what had been 'not in the beginning of time but in Christ' becomes a distinction — a Beginning without a beginning, who is the Father, and a Beginning with another beginning, who is the Son.", "crux": "beginning-of-what"}, {"id": "t-k1-20", "from": "aug-gnl-1-1", "to": "aug-gnl-imp-2-6", "type": "echoes", "evidence": "The unfinished commentary asks whether 'in the beginning' means time or the Wisdom of God; the finished one opens by listing three possibilities instead of two, adding 'or because they were made first of all', and declining to choose among them.", "crux": "beginning-of-what"}, {"id": "t-k1-21", "from": "aug-conf-11-9", "to": "aug-gnm-1-2", "type": "echoes", "evidence": "The argument of the anti-Manichaean book turned into prayer: 'in Christ, since the Word was with the Father' becomes 'in your Word, in your Son, in your Strength, in your Wisdom, in your Truth' — five names where the treatise had one, and no opponent in view.", "crux": "beginning-of-what"}, {"id": "t-k1-22", "from": "aug-civ-11-32", "to": "aug-conf-11-9", "type": "echoes", "evidence": "The same identification with its proof supplied: the Confessions name the Beginning as Wisdom without arguing, and the City of God adds the psalm that licenses it, 'omnia in sapientia fecisti' (Ps 104:24).", "crux": "beginning-of-what"}, {"id": "t-k1-23", "from": "aug-civ-11-32", "to": "ambrose-hex-1-3", "type": "echoes", "evidence": "Ps 104:24 is Ambrose's proof text on this verse before it is Augustine's, and it does different work for each: Ambrose cites it to show that the world was given a beginning at all, Augustine to show that the beginning is the Son.", "crux": "beginning-of-what"}, {"id": "t-k1-24", "from": "isidore-quaest-1-1", "to": "ambrose-hex-1-2", "type": "echoes", "evidence": "'Principium Christus est', with John 8:25 attached and no argument at all. What Ambrose offered as one limb of a vel and Augustine as one of three readings has become a premise from which the allegory starts.", "crux": "beginning-of-what"}, {"id": "t-k1-25", "from": "bede-gen-1-1", "to": "aug-gnl-1-1", "type": "echoes", "evidence": "Bede takes Augustine's three undecided readings and ranks them: the beginning of times at length and first, the Only-begotten Son last and qualified as 'not improbable'. The hierarchy, not the list, is what the Carolingians inherit.", "crux": "beginning-of-what"}, {"id": "t-k1-26", "from": "rabanus-gen-1-1b", "to": "bede-gen-1-1", "type": "cites", "evidence": "Bede's exposition reproduced almost entire and unattributed — the simultaneity argument, Ps 115:3, Ps 102:25, the 'not improbably … in his Only-begotten Son' — with the house-building simile cut and Rabanus' own thesis set at its head. The same silent copying the K7 and K10 threads trace at PL 107:447C and 448D.", "crux": "beginning-of-what"}, {"id": "t-k1-27", "from": "rabanus-gen-1-1b", "to": "aug-gnm-1-2", "type": "echoes", "evidence": "The sentence Rabanus adds in front of Bede is Augustine's answer to the Manichees compressed to an axiom: 'time is from this world, not before the world; and a day is a portion of time, not its beginning.'", "crux": "beginning-of-what"}, {"id": "t-k1-28", "from": "wigbod-gen-1-1", "to": "jerome-hq-1-1", "type": "cites", "evidence": "Verbatim Jerome, minus the argument: the three Greek versions, Bresith, Aquila's in capitulo, the forehead of Genesis, Ps 40:8, John 1:3 and the Hebrew custom of naming books are all kept, while the authorities who read 'in the Son' and Jerome's refutation of them — including the decisive point that the Hebrew for 'in the son' would be ba-ben — are dropped. The concession survives; the correction does not.", "crux": "beginning-of-what"}, {"id": "t-k1-29", "from": "angelom-gen-1-1", "to": "jerome-hq-1-1", "type": "echoes", "evidence": "Jerome's closing remark, that the Hebrews name volumes from their opening words, becomes the first question of Angelomus' commentary and acquires a conclusion Jerome did not draw: that Bresith is therefore rightly rendered Genesis.", "crux": "beginning-of-what"}, {"id": "t-k1-30", "from": "alcuin-int-26", "to": "jerome-hq-1-1", "type": "contests", "evidence": "The reading Jerome had declared false, printed as the answer to the question and in four words: 'In Filio perfecit Deus coelum et terram.' No Hebrew, no versions, no 'according to the sense rather than the word'.", "crux": "beginning-of-what"}, {"id": "t-k1-31", "from": "remigius-gen-1-1", "to": "bede-gen-1-1", "type": "echoes", "evidence": "Remigius takes over Bede's empyrean heaven — fiery or intellectual, so called not from burning but from splendour, filled at once with angels, proved from Job 38:7 — and puts it after a doxography of Plato and Aristotle that Bede does not have.", "crux": "beginning-of-what"}, {"id": "t-k1-32", "from": "remigius-gen-1-1", "to": "ambrose-hex-1-3", "type": "echoes", "evidence": "Ambrose's polemical use of the verse, given names: what Ambrose argued against those who would make the world anarchon, Remigius argues against Plato's three principles and Aristotle's two, and supplies the missing word out loud — 'In principio, and of time is understood'.", "crux": "beginning-of-what"}, {"id": "t-k1-33", "from": "glossa-1-1", "to": "bede-gen-1-1", "type": "cites", "evidence": "Three of the five glosses on this verse are Bede, the first of them cited by book and Migne column ('BEDA, Hexaem. lib. I, tom. II, col. 13'), and the margin keeps his eternity argument, his simultaneity argument and his empyrean heaven while dropping the house-building simile that carried them.", "crux": "beginning-of-what"}, {"id": "t-k1-34", "from": "glossa-1-1", "to": "alcuin-int-26", "type": "cites", "evidence": "The Glossa prints Alcuin's answer as a gloss of one word — '(ALCUIN. in Gen. tom. I.) « In principio. » Filio' — so that the twelfth-century reader meets the reading Jerome refuted as a bare equation under a great name, with nothing on the page to argue with.", "crux": "beginning-of-what"}, {"id": "t-k1-35", "from": "glossa-1-1", "to": "isidore-quaest-1-1", "type": "parallel", "evidence": "The Glossa's Mystice paragraph reads heaven and earth as those who bore the image of the heavenly and those who grew proud and bore the earthly; Isidore's Quaestiones read the same two words as the spiritual and the carnal in the Church. Same allegory, same verse, five centuries apart, and the Glossa does not name him.", "crux": "beginning-of-what"}, {"id": "t-k1-36", "from": "bruno-gen-1-1b", "to": "bruno-gen-1-1", "type": "parallel", "evidence": "One commentator giving both answers in order and treating them as layers rather than rivals: the literal exposition takes in principio as 'in the beginning of all creatures', and then, the letter disposed of, 'in what beginning? in him, surely, who says: I am the Beginning.' Neither reading is asked to yield to the other.", "crux": "beginning-of-what"}, {"id": "t-k1-37", "from": "bruno-gen-1-1", "to": "aug-gnl-1-1", "type": "echoes", "evidence": "Augustine's second reading — 'or because they were made first of all' — is the one Bruno builds on, and he builds on it to get simul out of the verse, so that Sir 18:1's 'he created all things at once' and the six days can both stand.", "crux": "beginning-of-what"}, {"id": "t-k1-38", "from": "rupert-gen-1-1", "to": "jerome-hq-1-1", "type": "echoes", "evidence": "Rupert concedes Jerome's philology in Jerome's own terms and with the Hebrew words in his mouth — 'son is ben in that language, and beginning is bresith' — and then holds the Christological reading anyway, on the ground that the identity is of sense and not of speech. He reaches Jerome's conclusion about the word and refuses Jerome's conclusion about the sense.", "crux": "beginning-of-what"}, {"id": "t-k1-39", "from": "rupert-gen-1-1", "to": "aug-civ-11-32", "type": "echoes", "evidence": "The Ps 104:24 chain taken over entire — 'you have made all things in wisdom, which wisdom is none other than the Word of God' — but reached only after an argument Augustine never makes, that principium in the common sense would be a superfluity of expression and so must be a proper name.", "crux": "beginning-of-what"}, {"id": "t-k1-40", "from": "honorius-hex-1-1", "to": "jerome-hq-1-1", "type": "echoes", "evidence": "Jerome had read Genesis and John together as evidence for one another; Honorius notices what that costs — in Genesis the beginning is the Son, in John the beginning is the Father — and resolves it by the unity of substance rather than by choosing.", "crux": "beginning-of-what"}, {"id": "t-k1-41", "from": "hugh-sacr-1-1", "to": "aug-gnm-1-2", "type": "echoes", "evidence": "Augustine's 'time began together with heaven and earth' becomes Hugh's 'in the beginning of time, or rather with time itself', and Hugh draws the school's conclusion from it: between creation and the disposing of things there was an order of time but no delay interposed.", "crux": "beginning-of-what"}, {"id": "t-k1-42", "from": "abelard-hex-1-1", "to": "bruno-gen-1-1", "type": "parallel", "evidence": "Both read the phrase as a place in a series — Bruno 'in the beginning of all creatures', Abelard 'as if it were said, on the first day' — and both do it to keep the six days without losing the simultaneity of the first making.", "crux": "beginning-of-what"}, {"id": "t-k1-43", "from": "comestor-hs-1-1", "to": "aug-gnl-1-1", "type": "echoes", "evidence": "Augustine's three questions, printed as three answers with an instruction: 'in the beginning' is to be repeated, once for the Son and once for time, with 'in the beginning of all creatures' offered as a third. The handbook that taught Europe the Bible resolves the crux by refusing to resolve it.", "crux": "beginning-of-what"}, {"id": "t-k1-45", "from": "jerome-hq-1-1", "to": "origen-hom-gen-1-1", "type": "contests", "evidence": "Phase 6. Jerome refutes the reading this homily states, and names his opponents: the Altercation of Jason and Papiscus, Tertullian against Praxeas, Hilary on a Psalm. Origen is not among them — and could not have been, since Rufinus's Latin is a decade later than the Quaestiones. But notice what Jerome actually refutes and what he concedes. He refutes the claim that the HEBREW has 'in the Son', with the philology: the Seventy, Symmachus and Theodotion all render 'in the beginning', the Hebrew is BRESITH and not BABEN. Origen never made that claim; his is an exegetical claim about what in principio means. And Jerome's own last sentence grants it — 'it can therefore be taken of Christ rather according to the sense than according to the translation of the word'. The distinction the Latin bench will need for nine hundred years is Jerome's, made in the act of refusing the reading he then allows.", "crux": "beginning-of-what"}, {"id": "t-k1-46", "from": "ambrose-hex-1-2", "to": "origen-hom-gen-1-1", "type": "parallel", "evidence": "Phase 6. The same conclusion from different verses, and the difference is the whole later history. Origen gets the Son out of in principio by John 1:1–3 and Col 1:15 — the Word through whom all things were made, the firstborn of every creature — and never says wisdom. Ambrose gets him out of John 8:25, 'The Beginning, who also speak to you', which makes Principium a name rather than an instrument. Ambrose's route is the one the Latin bench takes; and it is Ambrose, three columns later, who adds Ps 104:24 and so brings in the wisdom the rabbinic bench is arguing about at the same moment, meaning something else by it.", "crux": "beginning-of-what"}, {"id": "t-k1-44", "from": "comestor-hs-1-1", "to": "bruno-gen-1-1", "type": "echoes", "evidence": "Comestor's third sense, 'in the beginning of all creatures he created heaven and earth, that is, he made these primordial creatures, and made them at once', is Bruno's opening sentence and Bruno's simul, carried into the schools' handbook.", "crux": "beginning-of-what"}], "answers": {"borne-over": {"label": "Borne over", "gloss": "The verb is motion: a spirit carried above the water (LXX ἐπεφέρετο, Vulgate ferebatur)."}, "wind": {"label": "A wind", "gloss": "Ruach is weather, not a person; Onkelos keeps God at a remove."}, "spirit-of-mercy": {"label": "Spirit of mercy", "gloss": "A divine disposition blowing over the waters (Palestinian targums)."}, "messiah": {"label": "Spirit of the Messiah", "gloss": "Resh Lakish: the ruach of Isa 11:2, brought by repentance-as-water."}, "bird-hovering": {"label": "Dove hovering, not touching", "gloss": "Ben Zoma and Rashi: the bird measures a gap; it does not land."}, "fluttering": {"label": "Fluttering", "gloss": "Abelard's report of the Hebrew: volitabat, as the eagle of Deut 32:11."}, "brooding-warmth": {"label": "Bird brooding, warming", "gloss": "Jerome from the Hebrew, Basil's Syrian, then the Latin schools: the Spirit quickens matter like a hen on eggs."}, "power-not-place": {"label": "Power, not place", "gloss": "Augustine: 'above' means sovereignty, not position; the Manichees misread it."}, "craftsman": {"label": "The craftsman's will", "gloss": "The Spirit over the waters as the maker's intention over the wood."}, "love-gift": {"label": "Love, gift, weight", "gloss": "Confessions XIII: why the Spirit alone is said to be above; pondus meum amor meus."}, "trinity": {"label": "The Trinity named", "gloss": "The verse completes Father (in principio), Son (principium), Spirit."}, "heart": {"label": "Over the heart", "gloss": "Isidore's moral reading: the waters are our fluid, dark heart."}, "throne": {"label": "Throne of Glory", "gloss": "Rashi: the throne stands in the air, held by the breath of God's mouth."}, "unus-cardinal": {"label": "The versions keep the cardinal", "gloss": "ἡμέρα μία, dies unus, yoma chad: 'one', not 'first', in every ancient version."}, "unus-grammatical": {"label": "'First' needs a second", "gloss": "The series 'one, second, third' is improper (Bereshit Rabbah); or, first and second are relatives and there was no second yet (Bruno)."}, "unus-alone": {"label": "God was alone that day", "gloss": "Yachid in his world: no angels were made on the first day, so there was no second anything (Bereshit Rabbah, Rashi)."}, "unus-yom-kippur": {"label": "The one day given to Israel", "gloss": "'One day' is the Day of Atonement, the day the Holy One gave them."}, "unus-24-hours": {"label": "One circuit, twenty-four hours", "gloss": "Day and night together make one revolution, and the whole is named from the day alone."}, "unus-repeated": {"label": "The same day repeated", "gloss": "There is one day only — the angelic light — presented once for each kind of thing made (Augustine)."}, "unus-all-time": {"label": "One day = all time", "gloss": "The word holds the whole span of the ages, or the whole work of the six days (Augustine's set-aside reading; Abelard's own)."}, "unus-angelic-unity": {"label": "The unity of angelic dignity", "gloss": "'One' names the undivided attention of the angelic mind, not a place in a series (Angelomus)."}, "unus-eternal-day": {"label": "The true first day is eternal", "gloss": "This day is first only by number and order of creation; the day that is first by nature is uncreated light (Rupert)."}, "day-precedes-night": {"label": "Day before night", "gloss": "Evening is the end of a finished day, morning the end of the night; days are counted from morning to morning."}, "day-follows-night": {"label": "Night before day", "gloss": "'One day' rules that reckoning begins at evening (Ben Zoma, b. Chullin 83a)."}, "night-for-rest": {"label": "Night made for rest", "gloss": "Day is for labour and night for rest, so only the day's bounds are counted."}, "day-is-a-measure": {"label": "The day's measure is a creature", "gloss": "The measure of day and of night was itself made on day one (b. Chagigah 12a)."}, "evening-is-completion": {"label": "Evening completes a work", "gloss": "Vespera is a work perfected, mane the beginning of the next — the Carolingian formula."}, "evening-is-self-knowledge": {"label": "Evening and morning knowledge", "gloss": "The creature known in itself is evening; known in the Word and referred back in praise, morning (Augustine)."}, "evening-moral": {"label": "Evening as sin or temptation", "gloss": "Evening and morning are the deeds of the wicked and the righteous, or sin and renewal, or temptation and the light of justice."}, "simul": {"label": "All things made at once", "gloss": "Creavit omnia simul (Sir 18:1): the days are not successive."}, "six-days-literal": {"label": "Six real days", "gloss": "Created at once in matter, distinguished in form through six successive days (the common doctors, Bonaventure)."}, "principio-temporis": {"label": "In the beginning of time", "gloss": "The word dates the making: time began with the world, and there was no before (Onkelos, Bede, Rabanus, Remigius, Hugh)."}, "principio-in-filio": {"label": "In the Son", "gloss": "Principium is a proper name of the Word, on the strength of John 8:25 and Ps 104:24 (Ambrose, Augustine, Isidore, Alcuin, the Glossa, Rupert, Honorius)."}, "principio-first-of-all": {"label": "First of all things", "gloss": "'In the beginning' means before everything else that follows — in the beginning of the creatures, or on the first day (Augustine's second reading; Bruno, Abelard)."}, "principio-is-first-creature": {"label": "The first creature is a beginning", "gloss": "The first intellectual creature may be called a beginning to the things it heads (Augustine, De Genesi imperfectus)."}, "beginning-is-wisdom": {"label": "In Wisdom", "gloss": "The beginning is Wisdom — which is the Torah on one bench (Prov 8:22, Prov 3:19, Neofiti) and the Son on the other (Ps 104:24)."}, "reshit-is-torah": {"label": "The beginning is the Torah", "gloss": "Reshit is the Torah, called reshit darko: God looked into it as an architect into his plans and created the world (Bereshit Rabbah, Rashi)."}, "reshit-is-israel": {"label": "For the sake of Israel", "gloss": "Reshit is Israel, called reshit tevu'ato (Jer 2:3); the world was made for their sake."}, "reshit-construct": {"label": "'When God began to create'", "gloss": "Bereshit is a construct and the verse a subordinate clause: at the beginning of God's creating (Rashi's plain sense, Ibn Ezra; contested by Ramban)."}, "world-has-a-beginning": {"label": "The world is not eternal", "gloss": "The point of saying 'in the beginning' at all is that the world had one, against the philosophers (Ambrose, Remigius, Hugh, Ramban)."}, "bereshit-book-name": {"label": "It is the book's name", "gloss": "The Hebrews name volumes from their opening words, so bresith is the title of Genesis (Jerome, Wigbod, Angelomus)."}, "six-preceded": {"label": "Six things preceded the world", "gloss": "Torah and the Throne of Glory were made before it; the patriarchs, Israel, the Temple and the Messiah's name were contemplated (Bereshit Rabbah 1:4)."}, "read-it-twice": {"label": "Say the phrase twice", "gloss": "In principio is to be repeated — once in the Son, once at the beginning of time — rather than decided (Comestor)."}, "lux-corporalis": {"label": "A bodily light", "gloss": "A material light made to light material things, standing in the sun's place until the fourth day (Basil, Ambrose, Bede, Hugh, Honorius, Comestor, Bonaventure)."}, "lux-angelica": {"label": "The angelic creation", "gloss": "The light is the spiritual creature called 'heaven' in v. 1, made light by turning to its Creator (Augustine, Angelomus, Rupert)."}, "lux-hidden": {"label": "Stored for the righteous", "gloss": "Too good for the wicked, it was hidden away and is kept for the righteous in the time to come (Bereshit Rabbah, b. Chagigah, Rashi)."}, "lux-garment": {"label": "From the light of his garment", "gloss": "God wrapped himself in it like a garment (Ps 104:2); the heavens were stretched out of it (Bereshit Rabbah, Pirkei de-Rabbi Eliezer)."}, "lux-from-temple": {"label": "From the site of the Temple", "gloss": "The light was created from the place of the sanctuary (Ezek 43:2; Jer 17:12)."}, "lux-becomes-luminaries": {"label": "The luminaries were made from it", "gloss": "The nature of light was made on day one and hung in the firmament on day four (the sages in b. Chagigah 12a; an unnamed opinion in Augustine)."}, "lux-twilight": {"label": "A light like the dawn", "gloss": "Not the sun's brightness but what the sky is before sunrise or after sunset (Remigius, Honorius, Comestor, Hugh)."}, "lux-is-day": {"label": "'Light' just means day", "gloss": "The verse answers itself: he called the light Day, so light here is put for day (Bruno)."}, "lux-is-distinction": {"label": "The distinguishing of the works", "gloss": "The light is the confused heap becoming distinct and knowable, not a thing at all (Abelard)."}, "fiat-is-instantaneous": {"label": "Speaking is making", "gloss": "No interval between the command and the thing: the Hebrew says only 'let it be, and it was' (Ambrose, Basil, Angelomus, Abelard)."}, "pair-is-formless-matter": {"label": "Unformed matter", "gloss": "The pair names the matter God had made and not yet given form to (Augustine, Angelomus, Hugh, Comestor)."}, "pair-is-under-water": {"label": "Hidden under the waters", "gloss": "Invisible because the waters covered it, and because there was neither light nor anyone to see (Basil, Alcuin, Angelomus, Ibn Ezra)."}, "pair-is-unfurnished": {"label": "No seed, no living thing", "gloss": "Empty of shoots and void of animals: a list of what was not there yet (Bede, Remigius, Rupert, Abelard, Hugh, Comestor, the targums)."}, "pair-is-a-name-for-us": {"label": "A name fitted to slow minds", "gloss": "Not a description but the most serviceable word for formlessness, since earth and the deep are the least comely things men know (Augustine, Confessions XII)."}, "pair-many-senses": {"label": "More than one true reading", "gloss": "Five readings of the clause are all true and none can be shown to be Moses' own (Augustine, Confessions XII.21)."}, "pair-is-two-things": {"label": "A green line and slimy stones", "gloss": "Tohu and bohu are two creatures made on the first day: a line encircling the world, and stones sunk in the deep (b. Chagigah 12a, Sefer Yetzirah)."}, "pair-is-matter-and-form": {"label": "Matter and its form", "gloss": "Tohu is the hyle, which can hold no name; bohu is bo hu, the form it puts on (Ramban)."}, "pair-is-astonishment": {"label": "Astonishment", "gloss": "Tohu is what astonishes whoever looks at it — the earth bewildered at her lot, or the reader appalled at the emptiness (Bereshit Rabbah 2:2, Rashi, the Bahir)."}, "pair-is-history": {"label": "The verse tells history", "gloss": "The clause is the first term of a periodization: the generations from Adam, the four kingdoms, or the Church before her children (Bereshit Rabbah 2:1, 2:3, 2:4; Bruno)."}, "pair-is-our-flesh": {"label": "The earth of our flesh", "gloss": "The soul before it has taken the form of doctrine (Isidore, Wigbod, Rabanus, Remigius, Bruno)."}, "pair-is-not-of-heaven": {"label": "Said of earth, not of heaven", "gloss": "The phrase is withheld from heaven, which was filled with angels as soon as it was made (Bede, the Glossa, Angelomus, Abelard)."}, "heaven-first": {"label": "Heaven first", "gloss": "Beit Shammai: the word order is the order of the acts, and a king has his throne made before its footstool (Isa 66:1)."}, "earth-first": {"label": "Earth first", "gloss": "Beit Hillel: a builder raises the lower storey first (Amos 9:6), and Gen 2:4 and Ps 102:26 name the earth before the heavens."}, "both-at-once": {"label": "Both together", "gloss": "The sages, and R. Shimon ben Yoḥai's stewpot and its lid (Isa 48:13); Ambrose, that the order of naming gives heaven no privilege of the firstborn."}, "order-of-dignity": {"label": "Named for dignity, not order", "gloss": "Heaven stands first because it is worthier, or because the account is about to turn to the earth (Hugh of St Victor; R. Yoḥanan's creation-and-completion)."}, "created-then-stretched": {"label": "Created in one order, stretched in the other", "gloss": "Resh Lakish: heaven was created first, the earth was stretched out first — so both proof-texts stand."}, "heaven-earth-is-everything": {"label": "A name for the whole creation", "gloss": "Two visible words standing for all that God made, given so for the weakness of little ones (Augustine, Alcuin, Angelomus, Comestor)."}, "heaven-is-empyrean": {"label": "The empyrean heaven", "gloss": "Not the visible firmament but a fiery — from brightness, not heat — and intellectual heaven, filled with angels as soon as it was made (Remigius, the Glossa, Comestor)."}, "heaven-earth-four-elements": {"label": "The four elements", "gloss": "Heaven names fire and air, earth names earth and water; the verse announces the material first principles of bodies (Ambrose, Abelard, Ramban, Comestor)."}, "et-includes": {"label": "The particle includes", "gloss": "Et ha-shamayim brings in the sun, moon and constellations; ve-et ha-aretz the trees, the plants and the Garden of Eden (Bereshit Rabbah 1:14, b. Chagigah 12a, Ramban)."}, "shamayim-is-water": {"label": "Sham mayim — 'there is water'", "gloss": "The name itself says what heaven is made of: water, or fire and water mingled into the firmament (b. Chagigah 12a)."}, "one-earth-only": {"label": "One earth, and no heaven of heavens here", "gloss": "If the heavens of v. 1 were the intelligible heaven, the earth beside it could not be the ground; the seven earths are seven regions of the one (Ibn Ezra; Abelard, from the other end)."}, "whole-then-parts": {"label": "The whole first, then the parts", "gloss": "V. 1 is a heading: Scripture commends everything God made in two words before going through it with 'God said' (Augustine, Angelomus, the Glossa)."}, "de-nihilo": {"label": "Out of nothing", "gloss": "God made the world, and the matter of the world, from nothing whatever."}, "matter-then-formed": {"label": "Matter first, then formed", "gloss": "Formless matter was created first — first in origin, not in time — and everything else made out of it."}, "matter-is-coeval": {"label": "Matter was already there", "gloss": "God is a craftsman working on a material he did not make. Reported on both benches, held by neither."}, "three-principles": {"label": "God, exemplar, matter", "gloss": "The philosophers' three principles without a principle, named as the position to be refuted."}, "all-of-them-created": {"label": "Of every one of them, creation is written", "gloss": "Each thing the objector calls a pre-existing material has its own verse saying God created it."}, "bara-is-not-ex-nihilo": {"label": "'Created' does not mean from nothing", "gloss": "The verb bara is used of the sea-creatures and of man, who were made from something."}, "creare-vs-formare": {"label": "Created, not formed", "gloss": "Scripture keeps two verbs apart: what has no pre-existing matter is created, what is shaped out of matter is formed."}, "hyle-is-tohu": {"label": "The hyle is tohu", "gloss": "The one created thing is a substance without form, which the Greeks call hyle and Scripture calls tohu."}, "made-from-something-of-god": {"label": "From the light and the snow", "gloss": "Heaven from the light of his garment, earth from the snow beneath the Throne of Glory."}, "craftsman-needs-matter": {"label": "A craftsman needs a material", "gloss": "Wood helps the carpenter, silver the silversmith — the analogy that makes creation from nothing unthinkable."}, "silence-proves-nothing": {"label": "Scripture's silence proves nothing", "gloss": "That Genesis does not say when a thing was made does not make it coeternal with God."}, "world-from-tohu": {"label": "The world was made out of tohu va-vohu", "gloss": "Said with embarrassment, and only because the verse says it."}, "tenebrae-privatio": {"label": "Darkness is not a thing", "gloss": "Darkness is the absence of light, as silence is the ceasing of voice and nakedness the absence of a garment; Scripture never says God made it (Augustine, Angelomus, Hugh)."}, "tenebrae-creatura": {"label": "God made the darkness too", "gloss": "The darkness is a work of God like the light — it is called with the light to bless the Lord in Dan 3, and it is on the rabbinic lists of what was made on the first day (Remigius, the Glossa, Wigbod's pupil; Pirkei de-Rabbi Eliezer, R. Tanḥuma)."}, "tenebrae-angeli": {"label": "The darkness is the apostate angels", "gloss": "The light of day one is the angelic creation and the division is between the holy angels and the unclean (Augustine, City of God XI.19; Angelomus, Hugh, Rupert, Comestor)."}, "tenebrae-peccatores": {"label": "The wicked, or their deeds", "gloss": "The division is moral: the just from sinners (Isidore, Remigius, the Glossa), or the deeds of the righteous from the deeds of the wicked (R. Yanai, R. Abahu)."}, "tenebrae-ignis": {"label": "Darkness names the element of fire", "gloss": "'Darkness' in v. 2 is elemental fire, which is dark; the deep is water and the spirit is air (Ramban)."}, "divisio-loci": {"label": "Divided by place and quality", "gloss": "The two were set apart in space and time — light over the upper part of the world, twelve hours above and twelve below, opposite hemispheres in turn (Basil, Bede, Rabanus, Honorius, Comestor; and R. Yoḥanan's two generals, each given his bound)."}, "divisio-nominis": {"label": "The dividing is the naming", "gloss": "There is no separate act of separation: 'and he divided' means by the calling of names (Ibn Ezra; entertained once by Augustine and dropped)."}, "divisio-est-ordinatio": {"label": "He did not make it but ordered it", "gloss": "God makes the forms and orders the privations, as a singer orders his rests and a painter his shadows, so that even a nothing has its place (Augustine)."}, "divisio-est-judicium": {"label": "The division is a judgement", "gloss": "A sentence passed, and irreversible: on the devil and his angels (Rupert, Hugh), or on the just and sinners by foreknowledge (Isidore)."}, "divisio-est-instantanea": {"label": "The division needed no second act", "gloss": "The two were never mixed: by the very fact that light was made, the division followed, as putting on a garment ends nakedness (Augustine, Hugh)."}, "formatum-ab-informi": {"label": "The formed from the unformed", "gloss": "The dividing is the distinction of the formed thing from the unformed, of the perfect from the imperfect and the distinct from the confused (Wigbod, Abelard, Honorius)."}, "bonum-approbatio": {"label": "'He saw' is approval, not discovery", "gloss": "God did not learn that the light was good: what pleased him to be made pleased him to remain (Alcuin, Comestor), or the seeing is in the thought (Ibn Ezra), or a good work attests itself when seen (Ambrose)."}, "bonum-withheld": {"label": "The approval is deliberately withheld", "gloss": "'It was good' is not repeated after the division, and the divine name is dropped from the naming of the night, so that the darkness should not be approved along with the light (Augustine, Wigbod; R. Elazar, R. Abahu)."}, "havdala-derived": {"label": "The verse is the source of the havdala rule", "gloss": "'He saw … and he divided' — one does not bless over the lamp until he has used its light (R. Ze'eira of Caesarea)."}, "lux-hivdil-set-aside": {"label": "He set the light aside", "gloss": "Va-yavdel means he separated it off — for himself (R. Yehuda bar Simon), or for the righteous in the time to come, like a king setting aside a fine portion for his son (the Rabbis)."}, "one-authority-singular-verb": {"label": "The verb is singular, so one maker", "gloss": "Not vaydaberu but vaydaber, not bare'u but bara — no one may say that two authorities created the world (Bereshit Rabbah 1:7; Ibn Ezra; and, to the opposite end, Abelard)."}, "elohim-is-plural-of-persons": {"label": "Eloim is plural: three persons", "gloss": "El is singular and Eloim plural, showing a diversity of persons each of which is God; the singular verb shows that they are one creator and their works undivided (Abelard)."}, "elohim-is-honorific-plural": {"label": "A plural of honour", "gloss": "Every language honours the great with a plural — adonim, be'alim, the king speaking of himself in Arabic — so Elohim is the plural of eloah and means nothing more (Ibn Ezra). This is his account of the NOUN. He refuses the same reading of the plural VERB at Gen 1:26, where Saadia offers it to him: see plural-of-majesty-refused."}, "elohim-is-plural-of-powers": {"label": "The force of all forces", "gloss": "El hem: the root el is force, and 'they' points to all the other forces, so Elohim is the master of them all — with a secret not disclosed (Ramban)."}, "trinity-in-the-triad": {"label": "Father, Beginning, Spirit", "gloss": "The three persons are named in order across the first two verses: God the Father, the Beginning who is the Son, the Spirit borne over the waters (Augustine, Basil, Ambrose, Bede, Bruno, Honorius, the Glossa)."}, "trinity-in-the-formula": {"label": "The threefold formula of the six days", "gloss": "God said — and it was so — and God made: the testimony is tripled everywhere because the creating Trinity works everywhere (Rupert; considered and refused by Augustine)."}, "trinity-is-brought-to-the-text": {"label": "The rule of faith comes first", "gloss": "The catholic faith is set out before the exposition begins, because heretics drag Scripture to their own opinion; the doctrine is what the chapter is read under (Augustine, De Genesi ad litteram imperfectus)."}, "spirit-is-holy-spirit": {"label": "The spirit of v. 2 is the Holy Spirit", "gloss": "Not the air and not a wind: Scripture reserved the name, and no other spirit is meant but the one who completes the Trinity (Basil, Ambrose)."}, "principium-is-the-son": {"label": "The Beginning is the Son", "gloss": "'I am the beginning, who also speak to you' (John 8:25) — though the Father too is a beginning, and not from a beginning (Wigbod, Remigius, Bruno)."}, "not-to-angels": {"label": "Not spoken to the angels", "gloss": "Whoever the 'let us' addresses, it is not angels: man was not created by angels, or there would be many creators and not one (Bruno)."}, "word-order-is-modesty": {"label": "God is named after his works", "gloss": "A mortal king proclaims his name and builds afterwards; the Holy One made the needs of his world and was named after — bereshit bara, and only then Elohim (R. Yudan in the name of Akilas; Ben Azzai)."}, "word-order-is-dangerous": {"label": "The word order had to be changed", "gloss": "The seventy-two elders wrote 'God created in the beginning' for Ptolemy, so that bereshit could not be read as the subject (b. Megillah 9a)."}, "should-have-begun-at-exodus": {"label": "It should have begun at Exodus 12:2", "gloss": "The Torah is Israel's law book and ought to have opened with the first commandment given to Israel; the creation account has to be accounted for (R. Isaac, in Rashi)."}, "claim-on-the-land": {"label": "Title to the land", "gloss": "'He declared to his people the power of his works, to give them the inheritance of the nations' (Ps 111:6) — so that Israel may answer the charge of robbery (Bereshit Rabbah 1:2; Rashi)."}, "do-not-expound-it": {"label": "It may not be expounded", "gloss": "Not before two, and not the four questions — what is above, what is below, what is before, what is after (m. Chagigah 2:1; Bereshit Rabbah 1:5 and 1:10)."}, "honour-of-the-maker": {"label": "For the honour of the Maker", "gloss": "Whoever has no care for the honour of his Maker, it were fitting he had not come into the world; and the concealed matters are not to be published for the expositor's own glory (m. Chagigah 2:1; Rav Huna in the name of Bar Kappara)."}, "the-bet-is-closed": {"label": "The bet is closed behind", "gloss": "The world was made with a bet, closed on three sides and open in front: you may ask only from the day of creation onward (R. Yona in the name of R. Levi)."}, "beginning-is-blessing": {"label": "Bet for blessing, not alef for curse", "gloss": "Made with the letter of berakhah rather than of arirah, so that the heretics could not say the world was created with a curse (Bereshit Rabbah 1:10)."}, "moses-is-a-witness": {"label": "Moses wrote as a witness", "gloss": "Not in the persuasion of human wisdom nor in the counterfeit disputations of philosophy, but in the showing of the Spirit and of power, as a witness of the divine work (Ambrose)."}, "against-the-philosophers": {"label": "Against the philosophers", "gloss": "Plato's three principles and the atomists' concourse are a spider's web; the divine mind alone contains the origins and causes of things (Ambrose)."}, "against-the-heretics": {"label": "Because the heretics attack it", "gloss": "The Manichees mock the Old Testament before the unlearned, so the first book must be defended, and defended plainly (Augustine)."}, "written-for-the-unlearned": {"label": "In plain speech, for the unlearned", "gloss": "Not with ornate and polished speech but with plain facts — the usual and simple speech the learned also understand (Augustine)."}, "the-work-shows-the-maker": {"label": "The work shows the worker", "gloss": "The world is a specimen of the divine working: like building and weaving, it shows the craftsman's skill even when the craftsman is silent (Ambrose)."}, "scripture-is-about-restoration": {"label": "Scripture is about restoration", "gloss": "The matter of all divine Scripture is the works of human restoration, completed not in six days but in six ages (Hugh of St Victor)."}, "foundation-is-for-secular-writings": {"label": "Foundation belongs to secular writings", "gloss": "The works of foundation are the matter of worldly writings; divine Scripture only descends through them on its way to the Incarnation (Hugh of St Victor)."}, "history-is-the-foundation": {"label": "History is the foundation", "gloss": "Scripture is a hall with foundation, wall and roof — history, allegory, tropology — and nothing can be built before the foundation is laid (Comestor)."}, "faciamus-is-the-trinity": {"label": "'Let us make' is the Trinity", "gloss": "The formula changes at this one verse — everywhere else 'let it be', here 'let us make' — to intimate a plurality of persons; the singular of v. 27 then gives the unity of the deity (Augustine, Bede, Alcuin, Wigbod, Remigius, the Glossa, Rupert, Abelard, Hugh, Comestor)."}, "faciamus-to-the-son": {"label": "The Father speaks to the Son", "gloss": "Not to himself, since the verb is not 'I shall make', and not to servants: the address is to the Son, who is the image (Basil, Ambrose, Comestor; refused by Augustine, since 'to our image' would then have to be 'to yours')."}, "faciamus-to-the-angels": {"label": "He said it to the angels", "gloss": "God took counsel with, or spoke to, the ministering angels — stated outright by Pseudo-Jonathan, argued by Rashi and Ibn Ezra, reported as an option by Remigius, taught with a moral by Hugh, printed at Gen 11:7 by the Glossa, and called a Jewish fiction by Basil."}, "image-of-the-whole-trinity": {"label": "To the image of the Trinity itself", "gloss": "Not to the image of the Father alone, or the Son alone, or the Spirit alone — and who would dare separate the Holy Spirit from that plurality? (Augustine, and the Gloss after him)."}, "counsel-with-the-household-above": {"label": "He took counsel with the household above", "gloss": "Be-mi nimlakh — with the ministering angels, the court that stands to right and left, out of the humility of the Holy One (Bereshit Rabbah 8:3 and 8:8, b. Sanhedrin 38b, Rashi)."}, "consilium-not-senate": {"label": "A soliloquy, not a senate", "gloss": "The counsel was held inwardly — be-libbo nimlakh, he took counsel with his heart; non tam senatu quam soliloquio — though the rabbinic bench draws from it that no second party was present and the Latin bench that three persons were (R. Ami, Rupert, Abelard)."}, "refutation-beside-the-claim": {"label": "The refutation is beside the opening", "gloss": "Wherever the verse gives the minim an opening, the answer stands next to it: 'let us make' answered by 'and he created', 'let us go down' by 'and the LORD came down' (R. Simlai, R. Yoḥanan, Rashi)."}, "dignity-of-the-creature": {"label": "The consultative form marks the creature's standing", "gloss": "A rational creature is made with counsel, so that its nobility may be shown — or, on the other bench, so that the great may learn to ask leave of the lesser (Alcuin, Bede, Hugh, Abelard; Bereshit Rabbah 8:8)."}, "plural-of-majesty-refused": {"label": "Not a plural of majesty", "gloss": "Saadia's reading of na'aseh as royal speech is refused and
