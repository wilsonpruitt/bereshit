<script>
const D = {"crux": {"id": "beginning-of-what", "question": {"en": "The beginning of what — time, a principle, or a person?", "la": "In principio: cujus principio?", "he": "בְּרֵאשִׁית — רֵאשִׁית שֶׁל מָה?"}, "summary": "Neofiti's 'with wisdom' and the Latin 'in the Son' are the same move made from opposite ends of Prov 8:22–30.", "finding": "Both benches gloss the first word of Scripture as 'in wisdom', prove it from a wisdom text, and mean opposite things by it. Targum Neofiti does not translate bereshit but interprets it — min qadmin be-ḥokhmah — and Bereshit Rabbah reaches the same gloss by proof text, R. Banai from Prov 3:19 ('the Lord founded the earth with wisdom') and R. Hoshaya from Prov 8:22 ('the Lord made me reshit of his way'), where the Wisdom that speaks is the Torah, the architect's plan the King builds from. Augustine, Ambrose, Bede, Bruno and Rupert reach it from Ps 104:24 ('you have made all things in wisdom'), where the Wisdom is the Son. Neither side knows the other is there, and the shared conclusion is the least noticed thing about the crux — which is what the Latin bench looks like from the inside, and is not the whole truth. **The contact existed at the head of the tradition and the Latin transmission lost it.** Chalcidius, writing Latin in the fourth century, reports of Origen — whose homily is the source of everything the Latins say here — that he was persuaded of the non-temporal beginning *ab Hebraeis*, by the Hebrews; that *initium minime temporarium dici*, no beginning in time, since there was no time before the world was furnished; and that there is nevertheless one beginning of all things, *de quo Salomo in proverbiis: creavit me Deus progressionis suae primitiam* — Prov 8:22 quoted at length, and the conclusion drawn that *praeeunte divina sapientia caelum terramque factam*, that divine Wisdom is the *primordium* of the universe. That is the rabbinic bench's verse and the rabbinic bench's word, attributed to Hebrew informants, in a Latin commentary of the same century as Jerome. And it went nowhere: **Prov 8:22 is cited by four witnesses on this daf and every one of them is rabbinic; Ps 104:24 is cited by four and every one of them is Latin.** The Latin bench reached wisdom by a different verse, turned it into the Son, and never met the text that had already got there from the other side. What separates them is not the gloss but what happened to the philology. Jerome, the one Latin who read the Hebrew, refuted the Christological reading outright — the three Greek versions all say 'in the beginning', the Hebrew is bresith, and the Hebrew for 'in the son' would be ba-ben — and then conceded that Christ might be understood 'according to the sense rather than the translation of the word'. Wigbod copies the passage almost entire and drops precisely the refutation, keeping the concession; Alcuin's schoolbook reduces the whole question to four words, In Filio perfecit Deus; and the Glossa prints Alcuin's answer in the margin as a single word, Filio, so that the twelfth century met a reading its best philologist had disproved with nothing on the page to argue against. Rupert of Deutz is the one who repairs it, four hundred years later, by stating the Hebrew evidence himself — 'son is ben in that language, and beginning is bresith' — and then holding the reading anyway on the ground that the identity is of sense and not of speech. Meanwhile the modern translations settle the crux by removing it, as they did at K10: the JPS Tanakh prints 'When God began to create heaven and earth', which is Rashi's plain sense and Ibn Ezra's construct, adopted as the text — the one reading no Latin witness on this bench could have raised, and the one Ramban had already refuted from Isa 46:10 and Deut 33:21."}, "witnesses": [{"id": "lxx-1-1", "short": "lxx-1-1", "author": "The Seventy", "tradition": "greek-jewish", "date": -250, "datelabel": "c. 250 BCE", "place": "Alexandria", "lat": 31.2, "lon": 29.92, "answers": ["principio-temporis"], "senses": ["translation"], "lemma": {"el": "ἐν ἀρχῇ", "en": "in the beginning"}, "en": "In the beginning God made the heaven and the earth.", "translator": "claude-draft-approved", "orig": "ἐν ἀρχῇ ἐποίησεν ὁ θεὸς τὸν οὐρανὸν καὶ τὴν γῆν.", "olang": "el", "source": "LXX Gen 1:1 (Rahlfs)", "notes": "ἐν ἀρχῇ without an article and without a governing noun: the Greek turns a Hebrew word that may be construct into an adverbial phrase, and in doing so closes off the reading Rashi and Ibn Ezra will call the plain sense. Note also ἐποίησεν, 'made', where the Vulgate will write creavit: the Latin bench's whole argument that creare means to make from nothing has no purchase on the Greek. Every Latin witness here quotes fecit or creavit according to which Latin text is in front of him, and the variation is evidence, not noise.", "slot": false}, {"id": "vulgate-1-1", "short": "vulgate-1-1", "author": "Jerome", "tradition": "latin", "date": 392, "datelabel": "c. 392", "place": "Bethlehem", "lat": 31.7, "lon": 35.2, "answers": ["principio-temporis"], "senses": ["translation"], "lemma": {"la": "In principio", "en": "In the beginning"}, "en": "In the beginning God created the heaven and the earth.", "translator": "claude-draft-approved", "orig": "In principio creavit Deus coelum et terram.", "olang": "la", "source": "PL 28, col. 163C", "notes": "Jerome translates in principio and not in Filio, and in the Hebrew Questions he says in so many words why: the reading 'in the Son' is false as a translation, however true as a sense. But he also writes creavit where the Old Latin his own contemporaries quote has fecit — Augustine, Ambrose, Bede and the Glossa all argue from fecit — so the Latin bench spends seven centuries reasoning about a verse in two versions at once.", "slot": false}, {"id": "targ-onk-1-1", "short": "targ-onk-1-1", "author": "Targum Onkelos", "tradition": "rabbinic", "date": 200, "datelabel": "100–300", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["principio-temporis"], "senses": ["translation"], "lemma": {"arc": "בְּקַדְמִין", "en": "in former times"}, "en": "In the beginning the LORD created the heavens and the earth.", "translator": "claude-draft-approved", "orig": "בְּקַדְמִין בְּרָא יְיָ יָת שְׁמַיָּא וְיָת אַרְעָא", "olang": "arc", "source": "Sefaria, 'Onkelos Genesis'", "notes": "be-qadmin, a plain adverb of time and nothing else: no construct, no wisdom, no first thing. Onkelos hears the verse as the Greek does. Etheridge's Onkelos did not return from Sefaria by version title (see notes/SOURCES-FINDINGS.md) and the Metsudah English is CC BY-NC, so the English is a fresh draft.", "slot": false}, {"id": "targ-psj-1-1", "short": "targ-psj-1-1", "author": "Targum Pseudo-Jonathan", "tradition": "rabbinic", "date": 750, "datelabel": "600–800", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["principio-temporis"], "senses": ["translation"], "lemma": {"arc": "מִן אַוְולָא", "en": "from the first"}, "en": "At the beginning the LORD created the heavens and the earth.", "translator": "J. W. Etheridge, 1862", "orig": "מִן אַוְולָא בְּרָא יְיָ יַת שְׁמַיָא וְיַת אַרְעָא", "olang": "arc", "source": "Sefaria, 'Targum Jonathan on Genesis'", "notes": "A third Aramaic word for the same Hebrew one: min avvela, 'from the first'. Etheridge prints the Aramaic in transliteration inside his English ('At the beginning (min avella)'), which is why his sentence carries a gloss no other version has; the parenthesis is his.", "slot": false}, {"id": "targ-neof-1-1", "short": "targ-neof-1-1", "author": "Targum Neofiti", "tradition": "rabbinic", "date": 300, "datelabel": "100–400", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["beginning-is-wisdom"], "senses": ["translation"], "lemma": {"arc": "מלקדמין בחכמה", "en": "from the first, in wisdom"}, "en": "In the beginning and in great wisdom, God created and finished the heavens and the earth.", "translator": "Sefaria Community Translation", "orig": "מלקדמין בחכמה [בחוכמתא] ברא (ד)יי שכלל [ושכלל] ית שמיא וית ארעא:", "olang": "arc", "source": "Targum Neofiti, Gen 1:1 (Vatican, Neofiti 1)", "notes": "The single most consequential word on this crux: Neofiti does not translate bereshit, it interprets it — min qadmin be-ḥokhmah, 'from the first, in wisdom' — and then adds a second verb, shakhlel, 'and finished'. A Palestinian targumist and the Latin fathers reach the same gloss on the same word, 'in Wisdom', and then part company entirely over what Wisdom is: for Bereshit Rabbah it is the Torah, for Augustine and Bede it is the Son. Neither side knows the other is there. The CC0 English prints 'in great wisdom'; there is no word for 'great' in the Aramaic, and the reading בחוכמתא recorded in the manuscript's own margin is simply the emphatic state. Note that this witness and K7's targ-neof-1-2 are two slices of one Sefaria segment: the whole of Gen 1:1–5 comes back as a single block.", "slot": false}, {"id": "br-1-1", "short": "br-1-1", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["reshit-is-torah", "beginning-is-wisdom"], "senses": ["allegorical", "literal"], "lemma": {"he": "אָמוֹן — אֻמָּן", "en": "amon — artisan"}, "en": "Rabbi Hoshaya the Great began: “I was with Him as an amon, a delight day after day…” (Proverbs 8:30) – amon means a child’s caretaker, amon means covered, amon means hidden, and some say amon means greatness. Amon means a child’s caretaker, as it says: “As a caretaker [omen] carries a nursing child” (Numbers 11:12). Amon means covered, as it says: “Those covered [ha’emunim] in scarlet…” (Lamentations 4:5). Amon means hidden, as it says: “He was omen Hadassa” (Esther 2:7). Amon means great, as it says: “Are you better than No Amon [which sits in the rivers]?” (Nahum 3:8), which we translate in Targum as: Are you better than the great city of Alexandria, which is located among the rivers? Another matter, amon means artisan [uman]. The Torah is saying: ‘I was the tool of craft of the Holy One blessed be He.’ The way of the world is that when a flesh-and-blood king builds a palace he does not build it based on his own knowledge, but rather based on the knowledge of an artisan. And the artisan does not build it based on his own knowledge, but rather, he has [plans on] sheets and tablets by which to ascertain how he should build its rooms, how he should build its doors. So too, the Holy One blessed be He looked in the Torah and created the world. The Torah says: “Bereshit God created” (Genesis 1:1), and reshit is nothing other than the Torah, as it says: “The Lord made me at the beginning of [reshit] His way” (Proverbs 8:22).", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "רַבִּי הוֹשַׁעְיָה רַבָּה פָתַח, (משלי ח, ל): \"וָאֶהְיֶה אֶצְלוֹ אָמוֹן וָאֶהְיֶה שַׁעֲשֻׁעִים יוֹם יוֹם וְגוֹ'\". \"אָמוֹן\", פַּדְגּוֹג. \"אָמוֹן\", מְכוּסֶּה. \"אָמוֹן\", מוּצְנָע. וְאִית דְּאָמַר: \"אָמוֹן\", רַבְּתָא. \"אָמוֹן\", פַּדְגּוֹג – הֵיךְ מָה דְאַתְּ אָמַר (במדבר יא, יב): \"כַּאֲשֶׁר יִשָּׂא הָאֹמֵן אֶת הַיֹּנֵק\". \"אָמוֹן\" מְכוּסֶּה – הֵיךְ מָה דְאַתְּ אָמַר (איכה ד, ה): \"הָאֱמֻנִים עֲלֵי תוֹלָע חִבְּקוּ אַשְׁפַּתּוֹת\". \"אָמוֹן\", מוֹצְנָע – הֵיךְ מָה דְאַתְּ אָמַר (אסתר ב, ז): \"וַיְהִי אֹמֵן אֶת הֲדַסָּה\". אמון, רבתא – כמה דתימא: (נחום ג, ח): \"הֲתֵיטְבִי מִנֹּא אָמוֹן\", ומתרגמינן: \"האת טבא מאלכסנדריא רבתא דיתבא בין נהרותא?\"דבר אחר: אמון – אומן. התורה אומרת: אני הייתי כלי אומנותו של הקב\"ה. בנוהג שבעולם, מלך בשר ודם בונה פלטין, אינו בונה אותה מדעת עצמו אלא מדעת אומן, והאומן אינו בונה אותה מדעת עצמו, אלא דיפתראות, ופינקסאות יש לו, לדעת היאך הוא עושה חדרים, היאך הוא עושה פשפשין, כך היה הקב\"ה מביט בתורה, ובורא את העולם, והתורה אמרה בראשית ברא אלהים, ואין ראשית אלא תורה, היאך מה דאת אמר (משלי ח, כב): \"ה' קָנָנִי רֵאשִׁית דַּרְכּוֹ\".", "olang": "he", "source": "Bereshit Rabbah 1:1 (Vilna numbering; Theodor–Albeck differs)", "notes": "The opening of the whole midrash, and the rabbinic answer to this crux in its classic form. R. Hoshaya reads Proverbs 8:30, 'I was with him as an amon', through four homonyms and then a fifth: amon is uman, artisan. The Torah speaks: I was the tool of the craft of the Holy One. A king does not build a palace out of his own head but from an architect's sheets and tablets; so the Holy One looked into the Torah and created the world. And then the philological hinge on which everything turns — 'reshit is nothing other than the Torah, as it says: The Lord made me reshit of his way' (Prov 8:22). Bereshit therefore means 'by means of the beginning', that is, by the Torah. On the Latin side Augustine, Bede, Bruno and Rupert prove that in principio means 'in Wisdom' from Ps 104:24 [Vg 103], 'you made all things in wisdom'; here the proof text is Prov 8:22 and the Wisdom is the Torah. The two benches share a chapter of Proverbs and a conclusion, and disagree about what the Wisdom is.", "slot": false}, {"id": "br-1-4", "short": "br-1-4", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["six-preceded", "reshit-is-torah", "reshit-is-israel", "beginning-is-wisdom"], "senses": ["literal", "allegorical"], "lemma": {"he": "שִׁשָּׁה דְבָרִים קָדְמוּ לִבְרִיאַת הָעוֹלָם", "en": "six things preceded the creation of the world"}, "en": "“In the beginning, God created” – six items preceded the creation of the world; some of them were [actually] created, and some of them God contemplated creating, [though He did not actually do so]. The Torah and the Throne of Glory were created. Torah, from where is it derived? As it is stated: “The Lord made me at the beginning of His way” (Proverbs 8:22). The Throne of Glory, from where is it derived? “Your throne stands firm from earliest time, [You are from eternity]” (Psalms 93:2). The patriarchs, Israel, the Temple, and the name of the messianic king – God contemplated creating them [before the world, but did not]. The patriarchs, from where is it derived? “Like grapes in the wilderness [I found Israel, like a first fruit on the fig tree, at its beginning [bereshitah] I saw your fathers]” (Hosea 9:10). Israel, from where is it derived? “Remember Your congregation, that You acquired from old times” (Psalms 74:2). The Temple, from where is it derived? “Throne of glory, exalted from the beginning, [is the place of our Temple]” (Jeremiah 17:12). The name of the messianic king, from where is it derived? “May his name endure forever. His name is praised before the sun” (Psalms 72:17). Rabbi Ahava ben Rabbi Ze’eira said: Repentance as well, as it is stated: “Before the birth of mountains” (Psalms 90:2), and at that same time, “You bring man down until he is crushed, [and then You say: Return, sons of man]” (Psalms 90:3). But I do not know which of them was first – did the Torah precede the Throne of Glory, or did the Throne of Glory precede the Torah? Rabbi Abba bar Kahana said: The Torah preceded the Throne of Glory, as it is stated: “The Lord made me at the beginning of His way, [before His undertakings of old times]” (Proverbs 8:22) – before that in whose regard it is written: “Your throne stands firm from earliest time” (Psalms 93:2). Rabbi Huna and Rabbi Yirmeya said in the name of Rabbi Shmuel bar Rabbi Yitzḥak: The contemplation about [creating] Israel preceded all other things. This is analogous to a king who married a noblewoman, but did not have a son from her. Once the king was found passing in the marketplace. He said: ‘Take this ink and inkwell for my son.’ Everyone was saying: ‘He has no son and yet he says: Take this ink and inkwell for my son?’ Then they said: ‘The king is a great astrologer, had it not been that he is destined to beget a son from her, he would not have said: Take this ink and inkwell for my son.’ So, too, had it not been that the Holy One blessed be He foresaw that after twenty-six generations Israel was destined to receive the Torah, He would not have written in the Torah: “Command the children of Israel”; “speak to the children of Israel.” Rabbi Banai said: The world and its contents were created only due to the merit of the Torah, as it is stated: “The Lord founded the earth with wisdom [beḥochma]” (Proverbs 3:19). Rabbi Berekhya said: It was due to the merit of Moses, as it is stated: “He saw the first [reshit] for himself, [as there the portion of the lawgiver is hidden]” (Deuteronomy 33:21). Rav Huna said in the name of Rav Matana: The world was created for the sake of three things: For the sake of ḥalla, for the sake of tithes, and for the sake of first fruits. What is the source? “In the beginning, [bereshit] God created,” and reshit is nothing other than ḥalla, as it is stated: “The first of [reshit] your kneading basket” (Numbers 15:20). Reshit is nothing other than tithes, as it says: “The first [reshit] of your grain” (Deuteronomy 18:4). And reshit is nothing other than first fruits, as it is stated: “The choicest of [reshit] the first fruits of your land…” (Exodus 23:19).", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "\"בְּרֵאשִׁית בָּרָא אֱלֹהִים\" ששה דברים קדמו לבריאת העולם יש מהן שנבראו ויש מהן שעלו במחשבה להבראות. התורה והכסא הכבוד נבראו תורה מנין שנאמר (משלי ח, כב): \"ה' קנני ראשית דרכו\" כסא הכבוד מנין דכתיב (תהלים צג, ב): \"נכון כסאך מאז וגו'\". האבות וישראל ובית המקדש ושמו של משיח, עלו במחשבה להבראות האבות מנין שנאמר (הושע ט, י): \"כענבים במדבר וגו'\" ישראל מנין שנאמר (תהלים עד, ב): \"זכור עדתך קנית קדם\" בית המקדש מנין שנאמר (ירמיה יז, יב): \"כסא כבוד מרום מראשון וגו'\" שמו של משיח מנין שנאמר (תהלים עב, יז): \"יהי שמו לעולם וגו' [לפני שמש ינון שמו]\" רבי אהבה ברבי זעירא אמר אף התשובה שנאמר (שם צ, ב) \"בטרם הרים יולדו\" ואותה השעה (שם, ג) \"תשב אנוש עד דכא וגו'\" אבל איני יודע איזה מהם קודם אם התורה קדמה לכסא הכבוד ואם כסא הכבוד קודם לתורה א\"ר אבא בר כהנא התורה קדמה לכסא הכבוד שנאמר \"ה' קנני ראשית דרכו [קדם מפעלו מאז]\" קודם לאותו שכתוב בו \"נכון כסאך \"מאז\"\". ר' הונא ור' ירמיה בשם רבי שמואל בר ר' יצחק אמרו מחשבתן של ישראל קדמה לכל דבר משל למלך שהיה נשוי למטרונה אחת ולא היה לו ממנה בן פעם אחת נמצא המלך עובר בשוק אמר טלו מילנין וקלמין זו לבני והיו הכל אומרין בן אין לו והוא אומר טלו מילנין וקלמין זו לבני והיו הכל אומרין בן אין לו והוא אומר טלו אלולי שצפה המלך שהוא עתיד להעמיד ממנה בן לא היה אומר טלו מילנין וקלמין לבני כך אילולי שצפה הקב\"ה שאחר כ\"ו דורות ישראל עתידין לקבל את התורה לא היה כותב בתורה צו את בני ישראל דבר אל בני ישראל א\"ר בנאי העולם ומלואו לא נברא אלא בזכות התורה שנאמר (משלי ג, יט): \"ה' בחכמה יסד ארץ וגו'\" רבי ברכיה אמר בזכות משה שנאמר (דברים לג,כא): \"וירא ראשית לו\". ר' הונא בשם ר' מתנה אמר בזכות ג' דברים נברא העולם בזכות חלה ובזכות מעשרות ובזכות בכורים ומה טעם \"בְּרֵאשִׁית בָּרָא אֱלֹהִים\" ואין ראשית אלא חלה שנאמר (במדבר טו, כ): \"רֵאשִׁית עֲרִסֹתֵכֶם\" ואין ראשית אלא מעשרות היך דאת אמר (דברים יח, ד): \"ראשית דגנך\" ואין ראשית אלא בכורים שנאמר (שמות כג, יט): \"ראשית בכורי אדמתך וגו'\":", "olang": "he", "source": "Bereshit Rabbah 1:4 (Vilna numbering)", "notes": "If the world has a reshit, what stands in it? Six things precede the creation: the Torah and the Throne of Glory were actually made, while the patriarchs, Israel, the Temple and the name of the Messiah were contemplated. Every one is proved from a verse containing reshit or a synonym, and the Torah's proof is again Prov 8:22. Then the question the section cannot leave alone — which came first, the Torah or the Throne — and R. Abba bar Kahana rules for the Torah. Two other answers close it out: R. Banai, that the world was created only for the merit of the Torah, quoting Prov 3:19, 'the Lord founded the earth be-ḥokhmah, with wisdom' — the very phrase Targum Neofiti puts into Genesis 1:1 itself; and Rav Huna in the name of Rav Matana, that reshit is ḥalla, tithes and first fruits, which turns the first word of Scripture into a warrant for the priestly dues.", "slot": false}, {"id": "br-1-8", "short": "br-1-8", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["reshit-is-torah"], "senses": ["literal"], "lemma": {"he": "שֵׁשׁ לְשׁוֹנוֹת שֶׁל קְדִימָה", "en": "six expressions of precedence"}, "en": "Rabbi Yehoshua ben Levi said in the name of Rabbi Levi: A builder requires six items: Water, dirt, wood, stones, reeds, and iron. If you say that he is wealthy and does not need reeds [to build with], he still needs to use them as a measuring rod, as it is stated: “A linen thread and a measuring rod” (Ezekiel 40:3). So, too, the Torah employed these six expressions of precedence: “Of old [kedem]…from earliest time [me’az], from ancient times [meolam]…from the beginning [merosh], from before [mikadmei]…” (Proverbs 8:22–23) – which counts as two, in the section of “the Lord made me” (Proverbs 8:22).", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "רבי יהושע בן לוי בשם ר' לוי אמר זה שהוא בונה צריך ששה דברים מים ועפר ועצים ואבנים וקנים וברזל וא\"ת עשיר הוא ואינו צריך לקנים הרי הוא צריך לקני המדה שנאמר (יחזקאל מ, ג): \"ופתיל פשתים בידו וקנה המדה\" כך התורה קדמה אותן שש קדימות \"קדם\" ו\"מאז\" ו\"מעולם\" ו\"מראש\" ו\"מקדמי\" תרין, בפרשה (משלי ח , כב-כג): \"ה' קנני\":", "olang": "he", "source": "Bereshit Rabbah 1:8 (Vilna numbering)", "notes": "A small section that shows the machinery. A builder needs six materials, down to the reed he measures with; so the Torah used six words of precedence in Proverbs 8:22–23 — of old, from earliest time, from ancient times, from the beginning, from before, counted as two. The point is that Prov 8 is not a proof text the midrash reaches for occasionally but the passage it treats as Genesis 1:1's own commentary. Ambrose, Augustine and Bede reach for the same chapter of Proverbs by way of the Septuagint's ἔκτισέν με, 'the Lord created me', and spend the fourth century arguing about whether it makes the Son a creature. Neither bench mentions the other's use.", "slot": false}, {"id": "rashi-1-1b", "short": "rashi-1-1b", "author": "Rashi", "tradition": "rabbinic", "date": 1090, "datelabel": "1080–1105", "place": "Troyes", "lat": 48.3, "lon": 4.08, "answers": ["reshit-is-torah", "reshit-is-israel", "reshit-construct"], "senses": ["literal", "allegorical"], "lemma": {"he": "בְּרֵאשִׁית בָּרָא", "en": "In the beginning God created"}, "en": "בראשית ברא IN THE BEGINNING GOD CREATED — This verse calls aloud for explanation in the manner that our Rabbis explained it: God created the world for the sake of the Torah which is called (Proverbs 8:22) “The beginning (ראשית) of His (God’s) way”, and for the sake of Israel who are called (Jeremiah 2:3) “The beginning (ראשית) of His (God’s) increase’’. If, however, you wish to explain it in its plain sense, explain it thus: At the beginning of the Creation of heaven and earth when the earth was without form and void and there was darkness, God said, “Let there be light”. The text does not intend to point out the order of the acts of Creation — to state that these (heaven and earth) were created first; for if it intended to point this out, it should have written 'בראשונה ברא את השמים וגו “At first God created etc.” And for this reason: Because, wherever the word ראשית occurs in Scripture, it is in the construct state. E. g., (Jeremiah 26:1) “In the beginning of (בראשית) the reign of Jehoiakim”; (Genesis 10:10) “The beginning of (ראשית) his kingdom”; (Deuteronomy 18:4) “The first fruit of (ראשית) thy corn.” Similarly here you must translate בראשית ברא אלהים as though it read בראשית ברוא, at the beginning of God’s creating. A similar grammatical construction (of a noun in construct followed by a verb) is: (Hosea 1:2) תחלת דבר ה' בהושע, which is as much as to say, “At the beginning of God’s speaking through Hosea, the Lord said to Hosea.” Should you, however, insist that it does actually intend to point out that these (heaven and earth) were created first, and that the meaning is, “At the beginning of everything He created these, admitting therefore that the word בראשית is in the construct state and explaining the omission of a word signifying “everything” by saying that you have texts which are elliptical, omitting a word, as for example (Job 3:10) “Because it shut not up the doors of my mother’s womb” where it does not explicitly explain who it was that closed the womb; and (Isaiah 8:4) “He shall take away the spoil of Samaria” without explaining who shall take it away; and (Amos 6:12) “Doth he plough with oxen,\" and it does not explicitly state, “Doth a man plough with oxen”; (Isaiah 46:10) “Declaring from the beginning the end,” and it does not explicitly state, “Declaring from the beginning of a thing the end of a thing’ — if it is so (that you assert that this verse intends to point out that heaven and earth were created first), you should be astonished at yourself, because as a matter of fact the waters were created before heaven and earth, for, lo, it is written, (v. 2) “The Spirit of God was hovering on the face of the waters,” and Scripture had not yet disclosed when the creation of the waters took place — consequently you must learn from this that the creation of the waters preceded that of the earth. And a further proof that the heavens and earth were not the first thing created is that the heavens were created from fire (אש) and water (מים), from which it follows that fire and water were in existence before the heavens. Therefore you must admit that the text teaches nothing about the earlier or later sequence of the acts of Creation.", "translator": "Rosenbaum–Silbermann 1929–34", "orig": "בראשית ברא אֵין הַמִּקְרָא הַזֶּה אוֹמֵר אֶלָּא דָּרְשֵׁנִי, כְּמוֹ שֶׁדְּרָשׁוּהוּ רַבּוֹתֵינוּ בִּשְׁבִיל הַתּוֹרָה שֶׁנִקְרֵאת רֵאשִׁית דַּרְכּוֹ (משלי ח'), וּבִשְׁבִיל יִשְׂרָאֵל שֶׁנִקְרְאוּ רֵאשִׁית תְּבוּאָתוֹ (ירמיה ב'); וְאִם בָּאתָ לְפָרְשׁוֹ כִּפְשׁוּטוֹ, כָּךְ פָּרְשֵׁהוּ בְּרֵאשִׁית בְּרִיאַת שָׁמַיִם וָאָרֶץ, וְהָאָרֶץ הָיְתָה תֹהוּ וָבֹהוּ וְחֹשֶׁךְ וַיֹּאמֶר אֱלֹהִים יְהִי אוֹר וְלֹא בָא הַמִּקְרָא לְהוֹרוֹת סֵדֶר הַבְּרִיאָה לוֹמַר שֶׁאֵלּוּ קָדְמוּ, שֶׁאִם בָּא לְהוֹרוֹת כָּךְ, הָיָה לוֹ לִכְתֹּב בָּרִאשׁוֹנָה בָּרָא אֶת הַשָּׁמַיִם וְגוֹ' שֶׁאֵין לְךָ רֵאשִׁית בַּמִּקְרָא שֶׁאֵינוֹ דָבוּק לַתֵּבָה שֶׁלְּאַחֲרָיו, כְּמוֹ בְּרֵאשִׁית מַמְלֶכֶת יְהוֹיָקִים (שׁם כ\"ז), רֵאשִׁית מַמְלַכְתּוֹ (בראשית י'), רֵאשִׁית דְּגָנְךָ (דברים י\"ח, ד'), – אַף כָּאן אַתָּה אוֹמֵר בְּרֵאשִׁית בָּרָא אֱלֹהִים וְגוֹ', כְּמוֹ בְּרֵאשִׁית בְּרֹא; וְדוֹמֶה לוֹ תְּחִלַּת דִּבֶּר ה' בְּהוֹשֵׁעַ (הושע א'), כְּלוֹמַר תְּחִלַת דִּבּוּרוֹ שֶׁל הַקָּבָּ\"ה בְּהוֹשֵׁעַ, וַיֹּאמֶר ה' אֶל הוֹשֵׁעַ וְגוֹ'. וְאִ\"תֹּ לְהוֹרוֹת בָּא שֶׁאֵלּוּ תְּחִלָּה נִבְרְאוּ, וּפֵרוּשׁוֹ בְּרֵאשִׁית הַכֹּל בָּרָא אֵלוּ – וְֵישׁ לְךָ מִקְרָאוֹת שֶׁמְּקַצְּרִים לְשׁוֹנָם וּמְמַעֲטִים תֵּבָה אַחַת, כְּמוֹ כִּי לֹא סָגַר דַּלְתֵי בִטְנִי (איוב ג'), וְלֹא פֵּרֵשׁ מִי הַסּוֹגֵר וּכְמוֹ יִשָּׂא אֶת חֵיל דַּמֶּשֶׂק (ישעיהו ח'), וְלֹא פֵּרֵשׁ מִי יִשָּׂאֶנּוּ; וּכְמוֹ אִם יַחֲרוֹשׁ בַּבְּקָרִים (עמוס ו'), וְלֹא פֵּרֵשׁ אִם יַחֲרוֹשׁ אָדָם בַּבְּקָרִים, וּכְמוֹ מַגִּיד מֵרֵאשִׁית אַחֲרִית (ישעיהו מ\"ו), וְלֹא פֵּרֵשׁ מַגִּיד מֵרֵאשִׁית דָּבָר אַחֲרִית דָּבָר – אִ\"כֵּ, תְּמַהּ עַל עַצְמְךָ, שֶׁהֲרֵי הַמַּיִם קָדְמוּ, שֶׁהֲרֵי כְתִיב וְרוּחַ אֱלֹהִים מְרַחֶפֶת עַל פְּנֵי הַמָּיִם, וְעַדַיִין לֹא גִלָּה הַמִּקְרָא, בְּרִיאַת הַמַּיִם מָתַי הָיְתָה, הָא לָמַדְתָּ, שֶׁקָּדְמוּ הַמַּיִם לָאָרֶץ, וְעוֹד, שֶׁהַשָּׁמַיִם מֵאֵשׁ וּמַיִם נִבְרְאוּ, עַל כָּרְחֲךָ לֹא לִמֵּד הַמִּקְרָא סֵדֶר הַמֻּקְדָמִים וְהַמְאֻחָרִים כְּלוּם:", "olang": "he", "source": "Rashi on Gen 1:1, s.v. בראשית ברא", "notes": "Rashi gives both answers and marks which is which. First the received one: the verse cries out to be expounded, and our rabbis expounded it — for the sake of the Torah, called reshit of his way (Prov 8:22), and for the sake of Israel, called reshit of his increase (Jer 2:3). Then, and this is the sentence that changes the history of the verse, 'if you wish to explain it in its plain sense' — reshit is everywhere in Scripture a construct, as in 'in the reshit of the reign of Jehoiakim', so read bereshit bara as though it were bereshit bero, at the beginning of God's creating; the verse is a subordinate clause and the main verb is 'God said, Let there be light.' The chapter is therefore not teaching the order of creation at all, and Rashi proves it from the water, which is already there in verse 2 and whose making is never narrated. Nothing on the Latin bench does this: the Vulgate's in principio is not a construct and cannot be read as one.", "slot": false}, {"id": "ibn-ezra-1-1", "short": "ibn-ezra-1-1", "author": "Abraham ibn Ezra", "tradition": "rabbinic", "date": 1155, "datelabel": "c. 1155", "place": "Lucca", "lat": 43.84, "lon": 10.5, "answers": ["reshit-construct"], "senses": ["literal"], "lemma": {"he": "בְּרֵאשִׁית — סָמוּךְ", "en": "bereshit — a construct"}, "en": "Our sages have said that the [letter] bet was added, like the bet in barishonah (“in the beginning”) Bereshit 13:4, for you find “at the beginning (rishonah) they travelled” Bamidbar 2:9. But were that the meaning, the bet would have been vocalized with a kamatz gadol. And there are those who say that [the word] bereshit always [appears in] attached [form], where the meaning is “at the beginning of the evening, or the night, or the darkness”. But behold, they forgot “he saw a beginning reishit for himself” Devarim 33:21. And there are those who say that the bet is a subject without meaning. Their reason is that it is unthinkable that there is no beginning to the heavens and the earth. Therefore, it said “bereshit. But according to my opinion, it is indeed an attached form, like “At the beginning (bereshit) of the rule of Yehoyakim” Yirmiyahu 26:1. Now don’t wonder how can it be attached to a past tense verb [instead of a noun], for behold, thus: “At the beginning (techilat) spoke Hashem with Hoshea, and Hashem said to Hoshea” Hoshea 1:2, “The city (kiryat) where David camped” Yishayahu 29:1. The meaning [of this usage] will be explained for you in the second verse.", "translator": "Sefaria Community Translation", "orig": "בראשית חכמינו אמרו שהבי\"ת נוסף כבי\"ת בָראשונָה (בראשית י\"ג ד'), כי נמצא \"ראשונה יסעו\" (במדבר ב' ט') ואילו היה טעמו כן, היה הבי\"ת נקמץ בקמץ גדול וי\"א כי בראשית לעולם סמוך והטעם בראשית הערב או הלילה או החשך והנה שכחו \"וירא ראשית לו\" (דבר' ל\"ג כ\"א), וי\"א שהבי\"ת נושא (צ\"ל נוסף) בלי טעם וטעמם שלא יעלה על לב שאין ראשית לשמים ולארץ ע\"כ אמר בראשית, ולפי דעתי שהוא סמוך, כמו, \"בראשית ממלכת יהויקים\" (ירמי' כ\"ו א'), ואל תתמה איך נסמך על פועל עבר והנה כן \"תחלת דבר ד' בהושע ויאמר ד' אל הושע\" (הושע א' ב'), קרית חנה דוד (ישעי' כ\"ט א') והטעם יתבאר לך בפסוק השני,", "olang": "he", "source": "Ibn Ezra on Gen 1:1, s.v. בראשית", "notes": "The crux conducted purely as grammar, with the theology left out. Ibn Ezra sets down three opinions and refutes each from a counter-example: that the bet is otiose (then it would carry a long qamats); that bereshit is always construct and means 'at the beginning of the evening, or the night' (they forgot Deut 33:21, 'he saw a reshit for himself', where it is absolute); that the bet carries no sense at all and was written only so that no one should think heaven and earth had no beginning. His own view is Rashi's — a construct, like 'in the reshit of the reign of Jehoiakim' — and he answers in advance the objection that a construct cannot govern a finite verb by citing Hos 1:2 and Isa 29:1. Then he stops: 'the meaning will be explained for you at the second verse.' The Latin bench never argues at this level about in principio, because in Latin there is nothing to argue about.", "slot": false}, {"id": "ramban-1-1", "short": "ramban-1-1", "author": "Moses ben Naḥman (Naḥmanides)", "tradition": "rabbinic", "date": 1267, "datelabel": "1263–1270", "place": "Girona", "lat": 41.98, "lon": 2.82, "answers": ["reshit-construct", "world-has-a-beginning"], "senses": ["literal"], "lemma": {"he": "בְּרֵאשִׁית", "en": "In the beginning"}, "en": "IN THE BEGINNING. Rashi wrote: “If you wish to explain it [the word bereshith] in accordance with its plain meaning, explain it thus: at the beginning of the creation of the heaven and earth, and the earth was formless and void and there was darkness, the Holy One, blessed be He, said, Let there be light.” If so, the whole text leads into the creation of light. Rabbi Abraham ibn Ezra explained it in an identical way. However, he established that the letter vav in the word veha’aretz (and the earth) does not şerve [as a connecting letter as it normally does and which would mean “and,” but it serves rather as the word “when.”] There are many such examples in Scripture. The meaning then according to Rabbi Abraham would be: at the beginning of the creation of heaven and dry land, there was no habitable place on earth; rather, it was unformed and void and covered with water, and G-d said, Let there be light. According to Abraham ibn Ezra’s opinion, only light was created on the first day. The difficulty which Rabbi Shlomo [Rashi] had which led him to the above interpretation is, as he said: For if Scripture intended to teach the order in which the acts of creation took place, it should have written barishonah [instead of bereshith], since wherever the word reshith occurs in Scripture it is in the construct state. But there is the verse, Declaring the end ‘mereshith’ [from the beginning]. And if one will connect it with the missing word davar [thing — thus making the verse read: “Declaring the end of a thing from the beginning of a thing”—] here too it could be connected to a missing word. There is also the verse, And he chose ‘reshith’ (a first part) for himself. [Here again the word reshith is not used in the construct state.] And Rashi raised other objections.", "translator": "Charles B. Chavel, 1971–76", "orig": "בְּרֵאשִׁית כָּתַב רַשִׁ\"י (רש\"י על בראשית א':א'): וְאִם בָּאתָ לְפָרְשׁוֹ כִּפְשׁוּטוֹ כָּךְ פָּרְשֵׁהוּ: בְּרֵאשִׁית בְּרִיַּת שָׁמַיִם וָאָרֶץ, וְהָאָרֶץ הָיְתָה תֹהוּ וָבֹהוּ וְחֹשֶׁךְ, וַיֹּאמֶר הקב\"ה יְהִי אוֹר. אִם כֵּן, הַכֹּל נִמְשַׁךְ לִבְרִיאַת הָאוֹר. וְרַבִּי אַבְרָהָם פֵּרֵשׁ כְּעִנְיָן זֶה בְּעַצְמוֹ, אֲבָל תִּקֵּן כִּי הַו\"ו בְּמִילַת \"וְהָאָרֶץ\" אֵינָהּ מְשַׁמֶּשֶׁת, וְרַבּוֹת כֵּן בַּמִּקְרָאוֹת. וְהַטַּעַם, כִּי בְּרֵאשִׁית בְּרִיאַת הָרָקִיעַ וְהַיַּבָּשָׁה לֹא הָיָה בָּאָרֶץ יִשּׁוּב, אֲבָל הָיְתָה תֹהוּ וָבֹהוּ מְכֻסָּה בְּמַיִם, וַיֹּאמֶר אֱלֹהִים יְהִי אוֹר. וּלְפִי דַּעְתּוֹ, לֹא נִבְרָא בְּיוֹם רִאשׁוֹן רַק הָאוֹר. וְהַקֻּשְׁיָא לְרַבֵּינוּ שְׁלֹמֹה בַּפֵּרוּשׁ הַזֶּה, כִּי אָמַר, שֶׁאִם בָּא לְהוֹרוֹת סֵדֶר הַבְּרִיאָה בְּאֵלּוּ לוֹמַר שֶׁהֵם קָדְמוּ – הָיָה לוֹ לִכְתֹּב \"בָּרִאשׁוֹנָה\", שֶׁאֵין \"רֵאשִׁית\" בַּמִּקְרָא שֶׁאֵינוֹ סָמוּךְ. וְהִנֵּה \"מַגִּיד מֵרֵאשִׁית אַחֲרִית\" (ישעיהו מו י). וְאִם יִסְמֹךְ אוֹתוֹ לְ\"דָּבָר\", גַּם זֶה תִּסְמֹךְ אוֹתוֹ. וְעוֹד, \"וַיַּרְא רֵאשִׁית לוֹ\" (דברים לג כא). וְטָעַן בָּזֶה עוֹד טְעָנוֹת.", "olang": "he", "source": "Ramban on Gen 1:1, s.v. בראשית", "notes": "Two centuries after Rashi, the plain-sense reading is refuted from inside the tradition that produced it. Ramban reports Rashi's construct-state argument and Ibn Ezra's version of it — with Ibn Ezra's refinement that the vav of ve-ha'aretz means 'when', so that only light was made on the first day — and then breaks the grammatical premise with two counter-examples: Isa 46:10, 'declaring the end mereshit', and Deut 33:21, 'and he chose reshit for himself', where reshit stands absolute. The Hebrew slice here begins at Ibn Ezra's name and is shorter than the English, which opens at Rashi; the two are aligned on the same argument, not sentence for sentence. Chavel's English shows on Sefaria as CC BY, which is surprising for a 1971 Shilo text: licence key chavel-ramban is marked for checking before publication. Ramban's own answer, that bara names creation from absolute nothing and that the primary matter is what the Greeks call hyle, belongs to K4 and is not sliced here.", "slot": false}, {"id": "origen-hom-gen-1-1", "short": "origen-hom-gen-1-1", "author": "Origen", "tradition": "latin", "date": 240, "datelabel": "238–244", "place": "Caesarea Maritima", "lat": 32.5, "lon": 34.89, "answers": ["principio-in-filio"], "senses": ["literal", "allegorical"], "lemma": {"la": "Non ergo hic temporale aliquod principium dicit, sed in principio, id est in Salvatore", "en": "He does not, then, say here any temporal beginning, but that it was made in the beginning, that is, in the Saviour"}, "en": "'In the beginning God made heaven and earth.' What is the beginning of all things but our Lord and 'Saviour of all' Jesus Christ, 'the firstborn of every creature'? In this Beginning, then, that is, in his Word, 'God made heaven and earth', as the Evangelist John also says at the opening of his Gospel: 'in the beginning was the Word, and the Word was with God, and the Word was God. This was in the beginning with God. All things were made through him, and without him was made nothing.' He does not, then, say here any temporal beginning, but says that heaven and earth and all things that were made were made 'in the beginning', that is, in the Saviour. 'And the earth was invisible and unordered, and darkness was over the abyss, and the Spirit of God was borne over the waters.' 'The earth was invisible and unordered' before God said, 'let there be light', and before he 'divided between the light and the darkness', according to what the order of the discourse declares.", "translator": "claude-draft", "orig": "»In principio fecit Deus coelum et terram«. Quod est omnium principium nisi Dominus noster et »Salvator omnium« Iesus Christus »primogenitus omnis creaturae«? In hoc ergo principio, hoc est in verbo suo, »Deus coelum et terram fecit«, sicut et Evangelista Iohannes in initio Evangelii sui ait dicens: »in principio erat verbum, et verbum erat apud Deum, et Deus erat verbum. Hoc erat in principio apud Deum. Omnia per ipsum facta sunt, et sine ipso factum est nihil«. Non ergo hic temporale aliquod principium dicit, sed »in principio«, id est in Salvatore, factum esse dicit coelum et terram et omnia, quae facta sunt. »Terra autem erat invisibilis et incomposita, et tenebrae erant super abyssum, et spiritus Dei ferebatur super aquas«. »Invisibilis et incomposita terra erat«, antequam Deus diceret: »fiat lux« et antequam »divideret inter lucem et tenebras«, secundum quod sermonis ordo declarat.", "olang": "la", "source": "Hom. in Gen. I.1 (GCS 29, ed. W. A. Baehrens, Leipzig 1920, p. 1, lines 1–14)", "notes": "The head of the stream. Every Latin who reads in principio as the Son is downstream of this paragraph, and it states the reading in its strongest form: the beginning of all things is Christ, in principio means in the Word, and — the sentence the tradition kept — non ergo hic temporale aliquod principium dicit. John 1:1–3 is the proof, exactly as it will be in Ambrose and Augustine and the Glossa. Two things are worth noticing against what the later bench does with it. First, Origen reaches the Son without Ps 104:24 and without the word wisdom: the argument is from Col 1:15 and John, not from Solomon. Second, he runs straight on into Gen 1:2 and reads invisibilis et incomposita as a statement about what was so BEFORE the light and the division — a chronology, not a metaphysics — which is not what the Latin bench will make of the phrase. ✅ **Verified at Phase 6 and now in the crux finding**: Baehrens's apparatus to this page cites Chalcidius, *Comm. in Tim.* 276, and the passage was checked against the 1617 Meursius edition independently of Baehrens. Chalcidius reports that Origen had the non-temporal *initium* *ab Hebraeis* and grounds it on Prov 8:22 at length, reaching divine Wisdom as the *primordium* — the rabbinic bench's verse and the rabbinic bench's word, in a Latin commentary of Jerome's century, going nowhere. Chalcidius is **not** built as a witness: the only free text of him is uncorrected OCR of a 1617 print whose page images carry a ProQuest notice, and this edition does not embed Latin it cannot check against a clean page. He needs Waszink's Plato Latinus. The Catena notice in the same apparatus (Origen reads *ἐν ἀρχῇ* as *ἐν σοφίᾳ, τουτέστι τῷ υἱῷ*) is **still unverified** and is deliberately not used in the finding.", "slot": false}, {"id": "jerome-hq-1-1", "short": "jerome-hq-1-1", "author": "Jerome", "tradition": "latin", "date": 392, "datelabel": "c. 392", "place": "Bethlehem", "lat": 31.7, "lon": 35.2, "answers": ["principio-in-filio", "bereshit-book-name"], "senses": ["translation", "literal", "allegorical"], "lemma": {"la": "In filio fecit Deus coelum et terram", "he": "בְּרֵאשִׁית", "en": "In the Son God made heaven and earth"}, "en": "In the beginning God made heaven and earth. Very many suppose — as is written also in the Altercation of Jason and Papiscus, and as Tertullian argues in his book against Praxeas, and as Hilary too asserts in his exposition of a certain Psalm — that the Hebrew has: 'In the Son God made heaven and earth.' That this is false, the truth of the thing itself proves. For both the Seventy Translators and Symmachus and Theodotion rendered 'in the beginning'; and in the Hebrew it is written BRESITH, which Aquila translates 'in the head', and not BABEN, which is rendered 'in the son'. It can therefore be taken of Christ rather according to the sense than according to the translation of the word: he who, both at the very forehead of Genesis, which is the head of all the books, and also at the beginning of John the Evangelist, is shown to be the founder of heaven and earth. Whence also in the Psalter he says of himself: 'In the head of the book it is written of me' (Ps 40:8 [Vg 39:9]) — that is, in the beginning of Genesis. And in the Gospel: 'All things were made through him, and without him was made nothing' (John 1:3). But this too is to be known, that among the Hebrews this book is called BRESITH: they have the custom of giving volumes their names from their opening words.", "translator": "claude-draft-approved", "orig": "In principio fecit Deus coelum et terram. Plerique existimant, sicut in Altercatione quoque Jasonis et Papisci scriptum est, et Tertullianus in libro contra Praxeam disputat: necnon Hilarius in expositione cujusdam Psalmi affirmat, in Hebraeo haberi: In filio fecit Deus coelum et terram: quod falsum esse, ipsius rei veritas comprobat. Nam et Septuaginta Interpretes, et Symmachus, et Theodotion, in principio, transtulerunt. Et in Hebraeo scriptum est, BRESITH ( ); quod Aquila interpretatur, in capitulo: et non BABEN ( ), quod appellatur [ Al. interpretatur], in filio. Magis itaque secundum sensum quam secundum verbi translationem de Christo accipi potest: qui tam in ipsa fronte Geneseos, quae caput librorum omnium est, quam etiam in principio Joannis Evangelistae, coeli et terrae conditor approbatur. Unde et in Psalterio (Psal. XXXIX, 9) de seipso ait: In capitulo [Al. capite] libri scriptum est de me, id est, in principio 306 Geneseos. Et in Evangelio: Omnia per ipsum facta sunt, et sine ipso factum est nihil (Joan. I, 3) . Sed et hoc sciendum, quod apud Hebraeos liber hic BRESITH vocatur: hanc habentes consuetudinem, ut voluminibus ex principiis eorum nomina imponant.", "olang": "la", "source": "PL 23, col. 937C", "notes": "The pivot of the Latin side of this crux, and it goes against the Latin side. Jerome names three authorities who had said the Hebrew reads 'in the Son' — the lost Altercation of Jason and Papiscus, Tertullian, Hilary — and refutes them from the languages: the three Greek versions all have 'in the beginning', the Hebrew word is bresith, which Aquila renders ἐν κεφαλαίῳ, 'in the head', and the Hebrew for 'in the son' would be ba-ben, which is not what is written. Then the concession that is quoted for the next seven hundred years while the refutation is not: it may still be taken of Christ 'according to the sense rather than the translation of the word', because Genesis and John begin alike. Aquila's in capitulo is rendered 'in the head' here to keep Jerome's pun working — capitulum is what lets him bind bresith to caput librorum and to Ps 40:8's in capite libri. Wigbod reproduces this passage almost entire and drops the refutation.", "slot": false}, {"id": "ambrose-hex-1-2", "short": "ambrose-hex-1-2", "author": "Ambrose", "tradition": "latin", "date": 387, "datelabel": "c. 387", "place": "Milan", "lat": 45.46, "lon": 9.19, "answers": ["principio-in-filio", "principio-temporis", "world-has-a-beginning"], "senses": ["literal", "allegorical"], "lemma": {"la": "vel ipsum esse initium universorum", "en": "or that he himself is the beginning of all things"}, "en": "Whence holy Moses, foreseeing by the divine Spirit that these errors of men would come, and had perhaps already begun, speaks thus at the opening of his discourse: 'In the beginning God made heaven and earth' (Gen 1:1) — comprehending the beginning of things, the author of the world, and the creation of matter; so that you might know that God is before the beginning of the world, or that he himself is the beginning of all things, as in the Gospel the Son of God answered those who said to him 'Who are you?': 'The Beginning, who also speak to you' (John 8:25); and that he himself gave a beginning to the things to be brought forth, and that he himself is the creator of the world, not an imitator of matter with some idea for his guide, out of which he would shape his works, not at his own will, but to a form set before him. Beautifully too he says 'in the beginning he made', so as to express the incomprehensible speed of the work, since he set forth the effect of the operation completed before any sign of its being begun.", "translator": "claude-draft-approved", "orig": "Unde divino spiritu praevidens sanctus Moyses hos hominum errores fore, et forte jam coepisse, in exordio sermonis sui sic ait, In principio fecit Deus coelum et terram (Gen. I, 1) ; initium rerum, auctorem mundi, creationem materiae comprehendens; ut Deum cognosceres ante initium mundi esse, vel ipsum esse initium universorum; sicut in Evangelio Dei Filius dicentibus sibi, Tu quis es? respondit: Initium quod et loquor vobis (Joan. VIII. 25) : et ipsum dedisse gignendis rebus initium, et ipsum esse creatorem mundi, non idea quadam duce imitatorem materiae, ex qua non ad arbitrium suum, sed ad speciem propositam sua opera formaret. Pulchre quoque ait, In principio fecit; ut incomprehensibilem celeritatem operis exprimeret, cum effectum prius operationis impletae, quam indicium coeptae explicuisset.", "olang": "la", "source": "PL 14, col. 124B", "notes": "Ambrose gets all three answers into one sentence and does not choose between them. 'In the beginning' comprehends at once the beginning of things, the author of the world and the creation of matter; God is before the beginning of the world, 'or he himself is the beginning of all things' — and that vel is doing the work, because it holds the temporal and the personal readings side by side without ranking them. The Son's self-naming at John 8:25 is quoted here for the first time in the Latin bench, and after Ambrose no witness on this crux argues without it: Augustine, Isidore, Bede, Rabanus, Bruno, Rupert and Isidore's ecclesial allegory all rest on the same verse. Ambrose's word throughout is initium, not principium; the Vulgate's word had not yet displaced the Old Latin he preached from.", "slot": false}, {"id": "ambrose-hex-1-3", "short": "ambrose-hex-1-3", "author": "Ambrose", "tradition": "latin", "date": 387, "datelabel": "c. 387", "place": "Milan", "lat": 45.46, "lon": 9.19, "answers": ["world-has-a-beginning", "beginning-is-wisdom"], "senses": ["literal"], "lemma": {"la": "cognoscerent principium esse mundi", "en": "that they might know the world has a beginning"}, "en": "'In the beginning,' he says. What a good order — that he should assert first the very thing they are accustomed to deny, and that they might know the world has a beginning, lest men should think the world is without a beginning. Whence David also, when he was speaking of heaven and earth and sea, said, 'You have made all things in wisdom' (Ps 104:24 [Vg 103:25]). He gave the world a beginning, then, and gave the creature weakness too, lest we should believe it uncaused, uncreated, and a partaker of the divine substance. And beautifully he added 'he made', lest it be supposed there was any delay in the making; that in this way at least men might understand how incomparable a worker he is, who completed so great a work in the brief and slender moment of his operating, so that the effect of his will outran the sense of time.", "translator": "claude-draft-approved", "orig": "In principio, inquit. Quam bonus ordo, ut illud primum assereret, quod negare consueverunt, et cognoscerent principium esse mundi, ne sine principio mundum esse homines arbitrarentur. Unde et David cum de coelo, et terra, et mari loqueretur, ait, Omnia in sapientia fecisti (Ps. CIII, 25) . Dedit ergo principium mundo, dedit etiam creaturae infirmitatem, ne anarchon, ne increatum, et divinae consortem substantiae crederemus. Et pulchre addidit, Fecit, ne mora in faciendo fuisse existimaretur; ut vel sic intelligerent homines quam incomparabilis operator esset, qui tantum opus brevi 5 exiguoque momento suae operationis absolveret, ut voluntatis effectus sensum temporis praeveniret.", "olang": "la", "source": "PL 14, col. 126A", "notes": "The other Latin answer, and the polemical one: the beginning is the world's own, and the point of saying so is that the world is not eternal — anarchon, uncaused, a sharer in the divine substance. Remigius will make this the whole content of the verse and name Plato and Aristotle as the opponents; Ramban, from the other bench, says the same thing in the same place, that whoever thinks the world eternal 'denies the essential principle and has no Torah at all'. Note the proof text: Ps 104:24, 'you have made all things in wisdom' — the verse the Latin bench uses to get from in principio to in Sapientia, and so to the Son. The rabbinic bench gets to wisdom from Prov 8:22 and Prov 3:19 and arrives at the Torah.", "slot": false}, {"id": "aug-gnm-1-2", "short": "aug-gnm-1-2", "author": "Augustine", "tradition": "latin", "date": 389, "datelabel": "c. 389", "place": "Thagaste", "lat": 36.29, "lon": 7.95, "answers": ["principio-in-filio", "principio-temporis"], "senses": ["literal", "allegorical"], "lemma": {"la": "non in principio temporis, sed in Christo", "en": "not in the beginning of time, but in Christ"}, "en": "As to what is written, 'In the beginning God made heaven and earth', they ask, in what beginning; and they say: If God made heaven and earth in some beginning of time, what was he doing before he made heaven and earth? And why did it suddenly please him to make what he had never made before through eternal ages? To these we answer that God made heaven and earth in the beginning not in the beginning of time, but in Christ, since the Word was with the Father, through whom and in whom all things were made (John 1:1, 3). For our Lord Jesus Christ, when the Jews had asked him who he was, answered: 'The Beginning, because I also speak to you' (John 8:25). But even if we do believe that God made heaven and earth in the beginning of time, we ought certainly to understand that before the beginning of time there was no time. For God made the times too; and therefore before he made the times, there were no times. We cannot then say that there was some time when God had not yet made anything. For how was there a time that God had not made, since he himself is the fashioner of all times? And if time began together with heaven and earth, no time can be found in which God had not yet made heaven and earth.", "translator": "claude-draft-approved", "orig": "Quod scriptum est, In principio fecit Deus coelum et terram, quaerunt, in quo principio; et dicunt: Si in principio aliquo temporis fecit Deus coelum et terram, quid agebat antequam faceret coelum et terram? et quid ei subito placuit facere, quod nunquam antea fecerat per tempora aeterna? His respondemus, Deum in principio fecisse coelum et terram, non in principio temporis, sed in Christo, cum Verbum esset apud Patrem, per quod facta et in quo facta sunt omnia (Joan. I, 1, 3) . Dominus enim noster Jesus Christus, cum eum Judaei interrogassent quis esset, respondit, Principium, quia et loquor vobis (Id. VIII, 25) . Sed etsi in principio temporis Deum fecisse coelum et terram credamus, debemus utique intelligere quod ante principium temporis non erat tempus. Deus enim fecit et tempora: et ideo antequam faceret tempora, non erant tempora. Non ergo possumus dicere fuisse aliquod tempus quando Deus nondum aliquid fecerat. Quomodo enim erat tempus quod Deus non fecerat, cum omnium temporum ipse sit fabricator? Et si tempus cum coelo et terra esse coepit, non potest inveniri tempus quo Deus nondum fecerat coelum et terram.", "olang": "la", "source": "PL 34, col. 174", "notes": "Augustine's earliest answer, given under pressure. The Manichaean objection is not about grammar but about God's idleness — what was he doing before? — and Augustine takes the shortest road out: the beginning is not a time at all, it is Christ. Then, in the second half, he grants the temporal reading anyway and disarms the objection a second way, by making time itself a creature, so that there is no 'before'. Both moves survive him: the Christological one becomes the Latin commonplace, and the argument that time began with the world is what Rabanus compresses to 'time is from this world, not before the world', and Hugh of St Victor restates as 'in the first beginning of time, or rather with the beginning of time itself'.", "slot": false}, {"id": "aug-gnl-1-1", "short": "aug-gnl-1-1", "author": "Augustine", "tradition": "latin", "date": 410, "datelabel": "401–415", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["principio-temporis", "principio-first-of-all", "principio-in-filio"], "senses": ["literal"], "lemma": {"la": "utrum in principio temporis; an quia primo omnium facta sint; an in principio, quod est Verbum Dei", "en": "whether in the beginning of time; or because they were made first of all; or in the beginning which is the Word of God"}, "en": "If, then, that Scripture is to be searched in both ways, let us ask how it was said, apart from the allegorical signification, 'In the beginning God made heaven and earth': whether in the beginning of time; or because they were made first of all; or in the beginning which is the Word of God, the only-begotten Son.", "translator": "claude-draft-approved", "orig": "Si ergo utroque modo illa Scriptura scrutanda est, quaeramus quomodo dictum est praeter allegoricam significationem, In principio fecit Deus coelum et terram: utrum in principio temporis; an quia primo omnium facta sint; an in principio, quod est Verbum Dei unigenitus Filius.", "olang": "la", "source": "PL 34, col. 247", "notes": "The crux stated as a crux, by the man who made it one. Three readings, set out in a single sentence at the head of the literal commentary and deliberately not decided: in the beginning of time, first of all things, or in the Word. Everything else on the Latin bench is an attempt at one of these three, and Peter Comestor's twelfth-century settlement — read the phrase twice, once for the Son and once for time — is a refusal to choose between the first and the third. The one possibility Augustine does not list is the one Rashi will make the plain sense: that bereshit is a construct and the sentence is subordinate. Latin cannot raise it.", "slot": false}, {"id": "aug-gnl-imp-2-6", "short": "aug-gnl-imp-2-6", "author": "Augustine", "tradition": "latin", "date": 393, "datelabel": "c. 393", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["principio-in-filio", "principio-temporis", "principio-is-first-creature"], "senses": ["literal", "allegorical"], "lemma": {"la": "Est enim Principium sine principio, et est Principium cum alio principio", "en": "For there is a Beginning without a beginning, and a Beginning with another beginning"}, "en": "This, then, that is written, 'In the beginning God made heaven and earth', may be asked about: whether it is to be taken only according to history, or whether it also signifies something figuratively, and how it agrees with the Gospel, and for what cause this book was begun so. According to history it is asked what 'In the beginning' is — that is, whether in the beginning of time, or in the beginning which is the very Wisdom of God, since the Son of God also called himself the beginning, when it was said to him, 'Who are you?', and he said, 'The Beginning, who also speak to you' (John 8:25). For there is a Beginning without a beginning, and there is a Beginning with another beginning. The Beginning without a beginning is the Father alone, and therefore we believe all things to be from one beginning; but the Son is a Beginning in such a way as to be from the Father. The first intellectual creature itself can also be called a beginning to those things of which it is the head, which God made. For since a head may rightly be called a beginning, in that gradation the Apostle nevertheless did not call the woman the head of anything. For he called the man the head of the woman, and Christ the head of the man, and God the head of Christ (1 Cor 11:3): so is the creature bound beneath the Creator.", "translator": "claude-draft-approved", "orig": "Hoc ergo quod scriptum est, In principio fecit Deus coelum et terram, quaeri potest utrum tantummodo secundum historiam accipiendum sit, an etiam figurate aliquid significet, et quomodo congruat Evangelio, et qua causa liber iste sic inchoatus sit. Secundum historiam autem quaeritur quid sit In principio, id est, utrum in principio temporis, an in principio in ipsa Sapientia Dei, quia et ipse Dei Filius principium se dixit, quando ei dictum est, Tu quis es; et dixit, Principium quod et loquor vobis (Joan. VIII, 25) . Est enim Principium sine principio, et est Principium cum alio principio. Principium sine principio solus Pater est, ideo ex uno principio esse omnia credimus: Filius autem ita Principium est, ut de Patre sit. Ipsa etiam prima creatura intellectualis potest dici principium iis quibus caput est, quae fecit Deus. Cum enim recte appelletur principium caput, in illa gradatione Apostolus mulierem tamen non dixit caput alicujus. Nam et virum dixit caput mulieris, et caput viri Christum, et caput Christi Deum (I Cor. XI, 3) : ita Creatori creatura subnectitur.", "olang": "la", "source": "PL 34, col. 222", "notes": "The unfinished commentary is where Augustine works out what 'beginning' can mean before he decides what it means here, and the distinction he coins is exact: a Beginning without a beginning (the Father) and a Beginning that has another beginning (the Son, who is from the Father). Then a third possibility that no one else on this crux takes up: the first intellectual creature is a beginning to the things it heads, so 'in the beginning' might name the angelic creation. Bereshit Rabbah 1:4's list of six things that preceded the world is doing something formally similar — populating the beginning with a created thing — and reaches the Torah and the Throne of Glory instead.", "slot": false}, {"id": "aug-conf-11-9", "short": "aug-conf-11-9", "author": "Augustine", "tradition": "latin", "date": 398, "datelabel": "397–401", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["principio-in-filio", "beginning-is-wisdom"], "senses": ["allegorical", "spiritual"], "lemma": {"la": "In hoc Principio, Deus, fecisti coelum et terram", "en": "In this Beginning, God, you made heaven and earth"}, "en": "In this Beginning, God, you made heaven and earth: in your Word, in your Son, in your Strength, in your Wisdom, in your Truth, speaking in a wondrous way and in a wondrous way making. Who shall grasp it? who shall tell it?", "translator": "claude-draft-approved", "orig": "In hoc Principio, Deus, fecisti coelum et terram, in Verbo tuo, in Filio tuo, in Virtute tua, in Sapientia tua, in Veritate tua, miro modo dicens, et miro modo faciens. Quis comprehendet? quis enarrabit?", "olang": "la", "source": "PL 32, col. 813", "notes": "Two sentences, and the crux's Latin answer at its highest pitch: the Beginning is named five times over — Word, Son, Strength, Wisdom, Truth — and the naming is prayer, not argument. This is also the clearest place to see how close the two benches come without touching. 'In your Wisdom you made heaven and earth' is, as a sentence, what Targum Neofiti prints as the text of Genesis 1:1, and what Prov 3:19 says in the mouth of R. Banai at Bereshit Rabbah 1:4. Augustine is confessing to the second person of the Trinity; Neofiti is translating a Hebrew word; R. Banai means the Torah.", "slot": false}, {"id": "aug-civ-11-32", "short": "aug-civ-11-32", "author": "Augustine", "tradition": "latin", "date": 417, "datelabel": "413–427", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["principio-in-filio", "beginning-is-wisdom"], "senses": ["allegorical"], "lemma": {"la": "ut Pater fecisse intelligatur in Filio", "en": "so that the Father is understood to have made in the Son"}, "en": "For when it is said thus, 'In the beginning God made heaven and earth', so that the Father is understood to have made in the Son — as the Psalm bears witness, where it reads, 'How magnified are your works, O Lord! you have made all things in wisdom' (Ps 104:24 [Vg 103:24]) — most fittingly a little after the Holy Spirit also is mentioned. For when it had been said what kind of earth God first made, or what mass and matter he had called by the name of heaven and earth for the construction of the world to come, by subjoining and adding, 'But the earth was invisible and unordered, and darkness was over the abyss', at once, that the mention of the Trinity might be completed, 'And the Spirit,' he says, 'of God was borne above the water' (Gen 1:1–3).", "translator": "claude-draft-approved", "orig": "Cum enim ita dicitur, In principio fecit Deus coelum et terram, ut Pater fecisse intelligatur in Filio, sicut attestatur Psalmus, ubi legitur, Quam magnificata sunt opera tua, Domine! omnia in sapientia fecisti (Psal. CIII, 24) : convenientissime paulo post commemoratur etiam Spiritus sanctus. Cum enim dictum esset, qualem terram Deus primitus fecerit, vel quam molem materiamve futurae constructionis mundi coeli et terrae nomine nuncupaverit, subjiciendo et addendo, Terra autem erat invisibilis et incomposita, et tenebrae erant super abyssum: mox ut Trinitatis commemoratio compleretur, Et spiritus, inquit, Dei superferebatur super aquam (Gen. I, 1-3) .", "olang": "la", "source": "PL 41, col. 345", "notes": "The mature statement of the same reading, and the one that shows the machinery: 'in the beginning' means 'in the Son' because Ps 104:24 says all things were made in wisdom, and Wisdom is the Son. That is an inference through a proof text, not a philological claim, and Jerome had already ruled out the philological claim. The witness is here rather than under K3 because the argument turns on what in principio names; the Trinitarian reading of the whole opening belongs with elohim-and-trinity.", "slot": false}, {"id": "isidore-quaest-1-1", "short": "isidore-quaest-1-1", "author": "Isidore of Seville", "tradition": "latin", "date": 630, "datelabel": "c. 630", "place": "Seville", "lat": 37.39, "lon": -5.99, "answers": ["principio-in-filio"], "senses": ["allegorical", "spiritual"], "lemma": {"la": "Principium Christus est", "en": "The Beginning is Christ"}, "en": "'In the beginning God made heaven and earth.' The Beginning is Christ, as he himself answered in the Gospel to the Jews when they questioned him: 'I am the Beginning, who also speak to you' (John 8:25). In this beginning, therefore, God made heaven — that is, the spiritual, who meditate on and seek heavenly things; and in him he made the carnal also, who have not yet laid aside the earthly man.", "translator": "claude-draft-approved", "orig": "In principio fecit Deus coelum et terram. Principium Christus est, sicut ipse in Evangelio Judaeis interrogantibus respondit: Ego principium, qui et loquor vobis (Joan. VIII, 25) . In hoc igitur principio fecit Deus coelum, id est, spirituales, qui coelestia meditantur et quaerunt; in ipso fecit et carnales, qui necdum terrenum hominem deposuerunt.", "olang": "la", "source": "PL 83, col. 209B", "notes": "What the Christological reading becomes once it is settled: not an argument but a premise, and one that immediately turns ecclesial. Isidore states 'the Beginning is Christ' flatly, with John 8:25 and no discussion, and then reads heaven and earth as two kinds of Christian, the spiritual and the carnal. The Glossa's Mystice paragraph on this verse does the same thing in the same words four centuries later. Isidore's Quaestiones announce at the head that the historical sense has been read and the spiritual is what they are for, so the absence of argument is a genre, not a lapse.", "slot": false}, {"id": "bede-gen-1-1", "short": "bede-gen-1-1", "author": "Bede", "tradition": "latin", "date": 720, "datelabel": "717–725", "place": "Jarrow", "lat": 54.98, "lon": -1.49, "answers": ["principio-temporis", "principio-in-filio", "world-has-a-beginning"], "senses": ["literal", "allegorical"], "lemma": {"la": "in principio temporum … in Unigenito Filio suo", "en": "in the beginning of times … in his Only-begotten Son"}, "en": "Divine Scripture, in intimating the creation of the world, aptly shows in its very first word the eternity and omnipotence of God the creator. For him whom it declares to have created the world in the beginning of times, it thereby designates as having existed eternally before times. And him whom it relates to have created heaven and earth at the very outset of the founding, it declares to be omnipotent in so great a speed of operation, for whom to have willed is to have done. For when human frailty makes anything — when, for instance, we build a house — at the beginning of the work we prepare the material, and after that beginning we dig deep, then we lay stones in the foundation, then we set up the walls with courses of stone rising, and so little by little we come to the completion of the work proposed. But God, whose hand is omnipotent to accomplish his work, needed no delay of times, because it is written: 'Whatever he willed, he did' (Ps 115:3 [Vg 113B:3]). Whence it is well pleasing that in the beginning God created heaven and earth, so that it may be plainly understood that both were made by God at once, although both cannot be said at once by a man. And then the prophet says: 'In the beginning, Lord, you founded the earth' (Ps 102:25 [Vg 101:26]); but here the Lord is related to have created heaven and earth in the beginning; whence it is plainly gathered that the making of both elements was completed together, and this with such swiftness of divine power that not even the first moment of the world's birth had been passed. It can also be understood, not improbably, that God made heaven and earth in the beginning in his Only-begotten Son, who answered the Jews when they asked what they should believe him to be: 'The Beginning, who also speak to you' (John 8:25).", "translator": "claude-draft-approved", "orig": "Creationem mundi insinuans Scriptura divina, apte primo statim verbo aeternitatem atque omnipotentiam Dei creatoris ostendit. Quem enim in principio temporum mundum creasse perhibet, ipsum profecto ante tempora aeternaliter exstitisse designat. Et quem ipso conditionis initio coelum et terram creasse narrat, in tanta celeritate operationis omnipotentem esse declarat cui voluisse fecisse est. Nam humana fragilitas cum aliquid operatur; verbi gratia, cum domum aedificamus, in principio operis materiam praeparamus, et post hoc principium fodimus in altum, deinde immittimus lapides in fundamentum, deinde parietes augescentibus lapidum ordinibus apponimus, sicque paulatim ad perfectionem operis propositi proficiendo pervenimus. Deus autem cujus omnipotens manus est ad explendum opus suum, non eguit mora temporum, quia scriptum est: Omnia quaecunque voluit fecit (Psal. CXIII, 3) . Unde beneplacitum est, quia in principio creavit Deus coelum et terram, ut aperte detur intelligi quod utrumque simul a Deo factum est, quamvis utrumque simul ab homine dici non possit. Denique dicit propheta: Initio terram tu fundasti, Domine (Psal. CI, 26) . Hic autem Dominus, in principio coelum et terram creasse narratur; unde liquido colligitur quia factura est utriusque elementi pariter expleta, et hoc tanta velocitate divinae virtutis, ut necdum primum mundi nascentis momentum esset transcensum. Potest autem non improbabiliter intelligi in principio fecisse Deum coelum et terram in Unigenito Filio suo, qui interrogantibus se Judaeis, quid eum credere deberent, respondit: Principium quod et loquor vobis (Joan. VIII, 25) .", "olang": "la", "source": "PL 91, col. 13A", "notes": "Bede takes Augustine's three readings and orders them: the temporal one first and at length, the Christological one last and hedged — 'not improbably'. In between comes the argument the whole Carolingian line will repeat, that in principio proves the two were made at once, since a man cannot say two words at once but God can do two things at once, and Ps 102:25's 'in the beginning you founded the earth' names the earth where Genesis names heaven first. This paragraph is the single most-copied piece of Latin on the crux: Rabanus reproduces it almost entire, the Glossa cuts it into three marginal glosses, and Remigius takes over its empyrean heaven word for word.", "slot": false}, {"id": "alcuin-int-26", "short": "alcuin-int-26", "author": "Alcuin", "tradition": "latin", "date": 800, "datelabel": "c. 800", "place": "Tours", "lat": 47.39, "lon": 0.69, "answers": ["principio-in-filio"], "senses": ["allegorical"], "lemma": {"la": "In Filio perfecit Deus coelum et terram", "en": "In the Son God completed heaven and earth"}, "en": "Question 26. What is: 'In the beginning God created heaven and earth'? — Answer. In the Son God completed [ms.: made] heaven and earth.", "translator": "claude-draft-approved", "orig": "Inter. 26. Quid est: In principio creavit Deus coelum et terram?--Resp. In Filio perfecit [ Ms., fecit] Deus coelum et terram?", "olang": "la", "source": "PL 100, col. 519C", "notes": "The whole crux in eleven words, question and answer, with nothing left of the argument. Jerome had denied that the Hebrew says 'in the Son'; Augustine had offered it as one of three; Bede had called it not improbable. In the Carolingian schoolroom it is simply the answer, and it is the answer a boy memorises. The Glossa will later print exactly this — a single word, Filio — as its own gloss on in principio, under Alcuin's name. Migne prints perfecit with a manuscript variant fecit; the variant is kept in the English in brackets because the choice is not indifferent, perficere making the Son the completion of the work and facere merely its instrument.", "slot": false}, {"id": "wigbod-gen-1-1", "short": "wigbod-gen-1-1", "author": "Wigbod", "tradition": "latin", "date": 790, "datelabel": "c. 790", "place": "Aachen", "lat": 50.78, "lon": 6.08, "answers": ["principio-in-filio", "bereshit-book-name"], "senses": ["translation", "allegorical"], "lemma": {"la": "secundum sensum magis quam secundum verbi translationem, de Christo accipi potest", "en": "it can be taken of Christ according to the sense rather than the translation of the word"}, "en": "D. Whence did Genesis take this name? — M. For the Seventy Translators, Symmachus and Theodotion rendered 'in the beginning', and in the Hebrew it is written Bresith, which Aquila translates 'in the head'. And therefore it can be taken of Christ according to the sense rather than according to the translation of the word: he who, both at the very forehead of Genesis, which is the head of all the books, and at the beginning of John the Evangelist, is shown to be the founder of heaven and earth. Whence also in the Psalter he says of himself: 'In the head of the book it is written of me' (Ps 40:8 [Vg 39:8]) — that is, in the beginning of Genesis. And in the Gospel, 'All things were made through him, and without him was made nothing' (John 1:3). Therefore it is to be known that this book is called Bresith among the Hebrews, they having the custom of giving volumes their names from their opening words.", "translator": "claude-draft-approved", "orig": "D. Genesis unde hoc nomen accepit? M. LXX etenim Interpretes, Symmachus et Theodotion in principio transtulerunt, et in Hebraeo scriptum est Bresith, quod Aquila interpretatur in capitulo. Et ideo secundum sensum magis quam secundum verbi translationem, de Christo accipi potest, qui tam in ipso fronte Geneseos, qui caput omnium librorum est, quam in principio Joannis evangelistae, coeli et terrae conditor approbatur. Unde et in Psalterio de seipso ait: In capite libri scriptum est de me (Psal. XXXIX, 8) . Id est in principio Geneseos. Et in Evangelio, Omnia per ipsum facta sunt, et sine ipso factum est nihil (Joan. I, 3) . Ideo sciendum quod liber hic apud Hebraeos Bresith vocetur, hanc habentes consuetudinem ut voluminibus ex principibus eorum nomina imponant.", "olang": "la", "source": "PL 96, col. 1105C", "notes": "A Carolingian catena copying Jerome, and the copying is the finding. Wigbod reproduces the Hebrew Questions on this verse almost word for word — the three Greek versions, Bresith, Aquila's 'in the head', the forehead of Genesis, Ps 40:8, John 1:3, the Hebrew custom of naming books from their openings — and drops exactly two things: the list of authorities who said the Hebrew reads 'in the Son', and Jerome's refutation of them, including the decisive philological sentence that the Hebrew for 'in the son' is ba-ben and is not what is written. What survives is the concession without the correction, and Wigbod reaches it under a question about the book's title rather than about the verse. The K7 threads found him doing the same thing to Jerome on 1:2 under the label HIERONYMUS; here he does not name Jerome at all. Migne's ex principibus is a misprint for Jerome's ex principiis.", "slot": false}, {"id": "rabanus-gen-1-1b", "short": "rabanus-gen-1-1b", "author": "Rabanus Maurus", "tradition": "latin", "date": 822, "datelabel": "819–822", "place": "Fulda", "lat": 50.55, "lon": 9.68, "answers": ["principio-temporis", "principio-in-filio"], "senses": ["literal", "allegorical"], "lemma": {"la": "Tempus enim ab hoc mundo, non ante mundum", "en": "For time is from this world, not before the world"}, "en": "In the beginning of time, therefore, God made heaven and earth. For time is from this world, not before the world; and a day is a portion of time, not its beginning. But God, whose hand is omnipotent, needed no delay of times to accomplish his work, because, as it is written, 'Whatever he willed, he did' (Ps 115:3 [Vg 113B:3]). Whence it is well said that in the beginning God created heaven and earth, so that it may be plainly understood that both were made by him at once, although both cannot be said at once by a man. And then the prophet says: 'In the beginning, Lord, you founded the earth' (Ps 102:25 [Vg 101:26]); but here the Lord is related to have created heaven and earth in the beginning. Whence it is plainly gathered that the making of both elements was completed together, and this with such swiftness of divine power that not even the first moment of the world's birth had been passed. It can also be understood, not improbably, that God made heaven and earth in the beginning in his Only-begotten Son, who answered the Jews when they asked what they should believe him to be: 'The Beginning, who also speak to you' (John 8:25); because in him, as the Apostle says, 'all things were created in the heavens and on the earth' (Col 1:16).", "translator": "claude-draft-approved", "orig": "In principio itaque temporis, coelum et terram Deus fecit. Tempus enim ab hoc mundo, non ante mundum: dies autem temporis est portio, non principium. Deus autem, cujus omnipotens manus est, ad explendum opus suum non eguit mora temporum: quia, sicut scriptum est, Omnia quaecunque voluit fecit (Psal. CXIII) . Unde bene dictum est: quia in principio creavit Deus coelum et terram: ut aperte detur intelligi, quia utrumque simul ab eo factum est, quamvis utrumque simul ab homine dici non possit. Denique dicit Propheta: Initio terram tu fundasti, Domine (Psal. CI) : hic autem Dominus in principio coelum et terram creasse narratur. Unde liquido colligitur, quia factura est elementi utriusque pariter expleta, et hoc tanta velocitate divinae virtutis, ut necdum primum mundi nascentis momentum esset transcensum. Potest autem non improbabiliter intelligi, in principio fecisse Deum coelum et terram in unigenito Filio suo, qui interrogantibus se Judaeis quid eum credere deberent, respondit: Principium qui et loquor vobis (Joan. VIII) ; quia in ipso, ut ait Apostolus, condita sunt omnia in coelis et terra (Coloss. I)", "olang": "la", "source": "PL 107, col. 444B", "notes": "Bede's paragraph again, taken over silently and unattributed, exactly as the K7 threads found at PL 107:447C and the K10 threads at 448D — but with a sentence in front of it that is not Bede's and that answers the crux more sharply than Bede does: 'in the beginning of time, therefore, God made heaven and earth. For time is from this world, not before the world; and a day is a portion of time, not its beginning.' Rabanus also drops Bede's long house-building simile and
