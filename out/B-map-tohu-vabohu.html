<script>
const D = {"crux": {"id": "tohu-vabohu", "question": {"en": "What does the pair mean, and is it a state or a thing?", "la": "Quid est inanis et vacua?", "he": "מַהוּ תֹהוּ וָבֹהוּ?"}, "summary": "The Vulgate's inanis et vacua is a witness in its own right: Latin readers inherited an interpretation, not a transliteration.", "finding": "The Latin bench is not reading one verse but two. Augustine, Ambrose, Basil-in-Latin and Alcuin expound 'invisibilis et incomposita', the Old Latin of the Septuagint's ἀόρατος καὶ ἀκατασκεύαστος, and answer a question about visibility and order; Jerome's 'inanis et vacua' asks instead what the earth lacked, and its heirs answer with seeds, shoots and living things. Wigbod prints both, five columns apart, without noticing; Angelomus splices them in one paragraph; Hugh of St Victor is the first to tell a reader plainly that there is another translation. Jerome himself never glosses the pair he made — the Hebrew Questions go straight from 'in principio' to 'Spiritus Dei ferebatur', and the phrase that shaped the Latin Middle Ages on this verse is left without a note by the man who wrote it."}, "witnesses": [{"id": "br-2-1", "short": "br-2-1", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["pair-is-history"], "senses": ["allegorical"], "lemma": {"he": "גַּם בְּמַעֲלָלָיו יִתְנַכֶּר נָעַר", "en": "even a boy is known by his deeds"}, "en": "“The earth was emptiness and disorder, and darkness was upon the face of the depths, and the spirit of God hovered over the surface of the water” (Genesis 1:2). “The earth was emptiness and disorder [tohu vavohu]” – Rabbi Berekhya began: “Even a boy is recognized through his deeds” (Proverbs 20:11) – Rabbi Berekhya said: While the plant was still immature, it produced thorns. This is what the prophet would one day prophesy in its regard: “I have seen the land, and behold, it is emptiness and disorder” (Jeremiah 4:23).", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "\"וְהָאָרֶץ הָיְתָה תֹהוּ וָבֹהוּ\" רבי ברכיה פתח (משלי כ, יא): \"גם במעלליו יתנכר נער\" א\"ר ברכיה עד דהיא פגה אפיקת כובייא הוא מה שהנביא עתיד להתנבאות עליה בסוף (ירמיה ד, כג): \"ראיתי את הארץ והנה תהו ובהו\":", "olang": "he", "source": "Bereshit Rabbah 2:1 (Vilna numbering)", "notes": "The opening of the section, and it settles in one move what the whole rabbinic side of this crux will do with the pair: it reads it through Jeremiah. R. Berekhya begins from Prov 20:11, 'even a boy is known by his deeds' — while the plant was still unripe it put out thorns — and lands on Jer 4:23, 'I have seen the land, and behold, it is tohu va-vohu.' The prophet used the phrase of a land under judgement; so the phrase in Gen 1:2 can be read as a verdict rather than a description, and the four readings that follow in 2:2–2:5 all take that licence. Nothing on the Latin bench cites Jer 4:23 at all.", "slot": false}, {"id": "br-2-2", "short": "br-2-2", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["pair-is-astonishment"], "senses": ["allegorical"], "lemma": {"he": "תּוֹהָה וּבוֹהָה", "en": "bewildered and astonished"}, "en": "Rabbi Abahu and Rabbi Yehuda bar Simon, Rabbi Abahu said: This is analogous to a king who purchased two slaves for himself, both of them with one bill of sale and with one sum. He decreed for one of them that he should be supported from the royal treasury, and for the other that he would have to toil to eat. That one sat, bewildered and astonished [toheh uvoheh]. He said: ‘Both of us were purchased with one bill of sale and one sum, yet this one is supported from the royal treasury, and I, if I do not toil, I do not eat?’ So, too, the earth sat bewildered and astonished. It said: ‘The celestial beings and the terrestrial beings were created simultaneously. The celestial beings are sustained from the radiance of the Divine Presence; as for the terrestrial beings, if they do not toil they do not eat.’ Rabbi Yehuda bar Simon said: It is analogous to a king who purchased two maidservants, both of them with one bill of sale and with one sum. He decreed for one of them that she should not depart from the palace, and for the other he decreed banishment. That maidservant sat bewildered and astonished [toha uvoha]. She said: ‘Both of us were purchased with one bill of sale and one sum, and this one does not go out and depart from the palace, but for me he decrees banishment?’ So, too, the earth sat bewildered and astonished [toha uvoha]. It said: ‘The celestial beings and the terrestrial beings were created simultaneously. The celestial beings live forever and the terrestrial beings die.’ That is why “the earth was emptiness and disorder [tohu vavohu].” Rabbi Tanḥuma said: It is analogous to the son of a king, who was sleeping in his cradle, and his wet nurse was bewildered and astonished [toha uvoha], as she knew that she would ultimately receive her punishment on his account. So, the earth foresaw that it was destined to receive its punishment on account of man, as it is stated: “Cursed is the ground on your account” (Genesis 3:17). That is why “the earth was emptiness and disorder [tohu vavohu].”", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "רבי אבהו ורבי יהודה בר סימון רבי אבהו אמר משל למלך שקנה לו שני עבדים שניהם באוני אחת ובטימי אחת על אחד גזר שיהא ניזון מטמיון ועל אחד גזר שיהא יגע ואוכל ישב לו אותו תוהא ובוהא אמר שנינו באוני אחת ובטימי אחת זה ניזון מטמיון ואני אם איני יגע איני אוכל, כך ישבה הארץ תוהא ובוהא אמרה העליונים והתחתונים נבראו בבת אחת העליונים ניזונין מזיו השכינה התחתונים אם אינם יגעים אינם אוכלים. ור' יהודה בר סימון אמר משל למלך שקנה לו שתי שפחות שתיהן באוני אחת ובטימי אחת על אחת גזר שלא תזוז מפלטין ועל אחת גזר טירודין ישבה לה אותה השפחה תוהא ובוהא אמרה שנינו באוני אחת ובטימי אחת זו אינה יוצאה וזזה מפלטין ועלי גוזר טירודין, כך ישבה לה הארץ תוהא ובוהא אמרה העליונים והתחתונים נבראו בבת אחת העליונים חיים והתחתונים מתים לפיכך \"וְהָאָרֶץ הָיְתָה תֹהוּ וָבֹהוּ\". א\"ר תנחומא לבן מלך שהיה ישן ע\"ג עריסה והיתה מניקתו תוהא ובוהא למה שהיתה יודעת שהיא עתידה ליטול את שלה מתחת ידיו כך צפתה הארץ שהיא עתידה ליטול את שלה מתחת ידיו של אדם שנאמר \"אֲרוּרָה הָאֲדָמָה בַּעֲבוּרֶךָ\" לפיכך \"וְהָאָרֶץ הָיְתָה תֹהוּ וָבֹהוּ\":", "olang": "he", "source": "Bereshit Rabbah 2:2 (Vilna numbering)", "notes": "The etymology Rashi will give as lexicography is here still a parable, and the parable is about grievance. A king buys two slaves with one bill of sale and one price and decrees that one shall be fed from the treasury and the other must work to eat; the second sits toheh u-voheh — bewildered and astonished — saying, we were bought together, why him and not me? So the earth sat toheh u-voheh: the celestials and the terrestrials were created together, the celestials are fed on the radiance of the Presence and we must toil. R. Yehuda bar Simon tells it again with two maidservants, one kept in the palace and one banished, and the earth's complaint becomes mortality: they live for ever and we die. The pair is not a state of matter here but a state of mind, and it belongs to the earth, who is a person with a case to make.", "slot": false}, {"id": "br-2-3", "short": "br-2-3", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["pair-is-history"], "senses": ["allegorical"], "lemma": {"he": "פָּתַר קְרָיָא בַּדּוֹרוֹת", "en": "he interpreted the verse of the generations"}, "en": "Rabbi Yehuda bar Simon interpreted the verses regarding the generations. “The earth was emptiness and disorder” – this is Adam the first man, who became oblivion and nothingness. “And disorder” – this is Cain, who sought to restore the world to emptiness and disorder. “And darkness” – this is the generation of Enosh, based on the verse: “Their actions are in the dark and they say: Who sees us and who knows of us?” (Isaiah 29:15). “Upon the face of the depths” – this is the generation of the Flood, as it is stated: “On that day all the wellsprings of the great depths were breached” (Genesis 7:11). “And the spirit [ruaḥ] of God was hovering over the surface of the water” – based on the verse: “God passed a wind [ruaḥ] over the earth” (Genesis 8:1). The Holy One blessed be He said: ‘Until when will the world conduct itself in darkness? Let some light come.’ “God said: Let there be light” (Genesis 1:3) – this is Abraham. That is what is written [regarding Abraham]: “Who roused [he’ir] righteousness from the east?” (Isaiah 41:2). Do not read it as he’ir, but rather, he’ir. “God called the light, Day, and the darkness, He called Night. It was evening and it was morning, one day” (Genesis 1:5). “God called the light, Day” – this is Jacob. “And the darkness, He called Night” – this is Esau. “It was evening” – this is Esau; “and it was morning” – this is Jacob. “It was evening” – the evening of Esau; “and it was morning” – the morning of Jacob. “One day” – as it is stated: “There will be one day, it will be known to the Lord, that is not day and not night…” (Zechariah 14:7). Alternatively, “one day” – which the Holy One blessed be He provided him. Which is that? It is Yom Kippur.", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "רבי יהודה בר סימון פתר קריא בדורות. \"וְהָאָרֶץ הָיְתָה תֹהוּ וָבֹהוּ\" זה אדם הראשון שהיה ללמה ולא כלום. \"וָבֹהוּ\" זה קין שבקש להחזיר את העולם לתוהו ובוהו. \"וְחֹשֶׁךְ\" זה דורו של אנוש על שם (ישעיה כט, טו): \"וְהָיָה בְמַחְשָׁךְ מַעֲשֵׂיהֶם וַיֹּאמְרוּ מִי וְגוֹ'\". \"עַל פְּנֵי תְהוֹם\" זה דור המבול שנאמר (בראשית ז, יא): \"ביום הזה נבקעו כל מעינות תהום\". \"וְרוּחַ אֱלֹהִים מְרַחֶפֶת עַל פְּנֵי הַמָּיִם\" על שם (שם ח, א) \"וַיַּעֲבֵר אֱלֹהִים רוּחַ עַל הָאָרֶץ\" אמר הקדוש ברוך הוא עד מתי יהא העולם מתנהג באפילה תבא האורה. \"וַיֹּאמֶר אֱלֹהִים יְהִי אוֹר\" זה אברהם הה\"ד (ישעיה מא, ב): \"מִי הֵעִיר מִמִּזְרָח צֶדֶק וגו'\" אל תקרא העיר אלא האיר. \"וַיִּקְרָא אֱלֹהִים לָאוֹר יוֹם\" זה יעקב. \"וְלַחֹשֶׁךְ קָרָא לַיְלָה\" זה עשו. \"וַיְהִי עֶרֶב\" זה עשו \"וַיְהִי בֹקֶר\" זה יעקב ויהי ערב ערבו של עשו ויהי בקר בוקרו של יעקב \"יוֹם אֶחָד\" שנאמר (זכריה יד, ז): \"והיה יום אחד הוא יודע לה' לא יום ולא לילה וגו'\". דבר אחר \"יוֹם אֶחָד\" שנתן לו הקדוש ברוך הוא ואיזה זה יום הכפורים:", "olang": "he", "source": "Bereshit Rabbah 2:3 (Vilna numbering)", "notes": "The verse read straight through as a history of the generations: tohu is Adam, who came to nothing; va-vohu is Cain, who sought to return the world to tohu va-vohu; the darkness is the generation of Enosh; the face of the deep is the generation of the Flood; the spirit of God is the wind God made pass over the earth (Gen 8:1); and 'let there be light' is Abraham. Then day and night are Jacob and Esau. The move is exactly Bruno of Segni's in the twelfth century — the verse as a periodization running from the first man to the last redemption — and neither could have known the other; the difference is whose history it is. Note that Resh Lakish's reading of the same verse as the four kingdoms follows immediately in 2:4, which is built as a K7 witness for the Messiah's spirit; its first half belongs here too (see notes/cross-crux.md).", "slot": false}, {"id": "b-chag-12a-tohu", "short": "b-chag-12a-tohu", "author": "Babylonian Talmud", "tradition": "rabbinic", "date": 550, "datelabel": "redaction 500–600", "place": "Babylonia (Sura / Pumbedita)", "lat": 32.5, "lon": 44.4, "answers": ["pair-is-two-things"], "senses": ["literal"], "lemma": {"he": "תֹּהוּ קַו יָרוֹק שֶׁמַּקִּיף אֶת כָּל הָעוֹלָם", "en": "tohu is a green line encircling the whole world"}, "en": "It was taught in a Baraita, Chaos is a green line encompassing all the world, and from it darkness springs, as it is said, (Psalms 18:12) \"He made darkness His hiding place round about Him.\" Desolation, these are smooth stones sunk in the deep, from which waters come forth, as it is said, (Isaiah 34:11) \"and He shall stretch upon it the line of chaos and the stones of desolation.\"", "translator": "Sefaria Community Translation", "orig": "תנא תהו קו ירוק שמקיף את כל העולם כולו שממנו יצא חשך שנאמר (תהלים יח, יב) ישת חשך סתרו סביבותיו בהו אלו אבנים המפולמות המשוקעות בתהום שמהן יוצאין מים שנאמר (ישעיהו לד, יא) ונטה עליה קו תהו ואבני בהו", "olang": "arc", "source": "b. Chagigah 12a (Vilna)", "notes": "Two sentences, and they answer the crux's second question in the way no Latin does: the pair names two things, and you could point at them. Tohu is a green line that encircles the whole world and darkness comes out of it (Ps 18:12); bohu are the slimy stones sunk in the deep from which the waters come out — and the proof is Isa 34:11, 'he shall stretch over it the line of tohu and the stones of bohu', read as an inventory rather than as a curse. The baraita stands in the list of the ten things created on the first day (segments 4–5 here, which are K5's text), so tohu and bohu are creatures with a day of creation. Ibn Ezra knows this tradition from Sefer Yetzirah and sets it aside; Ramban knows it and keeps the proof-text while turning the line into a builder's measuring cord.", "slot": false}, {"id": "rashi-1-2a", "short": "rashi-1-2a", "author": "Rashi", "tradition": "rabbinic", "date": 1090, "datelabel": "1080–1105", "place": "Troyes", "lat": 48.3, "lon": 4.08, "answers": ["pair-is-astonishment", "pair-is-unfurnished"], "senses": ["literal"], "lemma": {"he": "תֹּהוּ לְשׁוֹן תֵּמַהּ וְשִׁמָּמוֹן", "en": "tohu is a word for astonishment and desolation"}, "en": "תהו ובהו DESOLATE AND VOID — The word תהו signifies astonishment and amazement, for a person would have been astonished and amazed at its emptiness. תהו is estordison in old French. בהו VOID — The word signifies emptiness and empty space.", "translator": "Rosenbaum–Silbermann 1929–34", "orig": "תהו ובהו. תֹּהוּ לְשׁוֹן תֵּמַהּ וְשִׁמָּמוֹן, שֶׁאָדָם תּוֹהֵא וּמִשְׁתּוֹמֵם עַל בֹּהוּ שֶׁבָּהּ: תהו. אשטורדי\"שון בְּלַעַ\"ז: בהו. לְשׁוֹן רֵקוּת וְצָדוּ:", "olang": "he", "source": "Rashi on Gen 1:2, s.v. תהו ובהו", "notes": "Three lines that turn the parable of BR 2:2 into a lexicon. Tohu is a word for astonishment and desolation, because a person would be astonished and appalled at the bohu in it — the emptiness is the thing seen and the astonishment is what seeing it does. Then the la'az: tohu is estordison in Old French, from estordir, to stun or daze, the word for the swimming in the head after a blow; Rashi gives the reader the sensation rather than the definition. Bohu he glosses reikut ve-tzadu, emptiness and waste — which are the two Aramaic words Onkelos used for the whole pair, in the other order. The Latins who answer this crux describe what was missing from the earth; Rashi describes what looking at it would do to you.", "slot": false}, {"id": "ibn-ezra-1-2", "short": "ibn-ezra-1-2", "author": "Abraham ibn Ezra", "tradition": "rabbinic", "date": 1155, "datelabel": "c. 1155", "place": "Lucca", "lat": 43.84, "lon": 10.5, "answers": ["pair-is-under-water", "pair-is-unfurnished"], "senses": ["literal"], "lemma": {"he": "תֹהוּ", "en": "tohu"}, "en": "“Void” (tohu) – The Ga’on [Rav Sa’adiah] said that [this word] is from “deep” (tehom), but that is not possible, since the mem of tehom is a root letter, like the mem of hadom. Now in Sefer Yetzira: “tohu - this [refers to] the green line”, and bohu - this [refers to] MEFULAM stones”. What’s correct is as the Aramaic translator has said, and likewise with “the howling, desolate tohu Deuteronomy 32:10, and likewise, “after tohu” Samuel I 12:21 – without substance. “And confused” – \"The brother of\", and the vav in place of the hey, like the vav in [the word] vayishtachu (“and he bowed”) Genesis 18:2, “and they pastured amongst he reeds (achu)” Genesis 41:2. The meaning is [as follows:] The creation of the firmament and the dry land was not in a area to be settled, since it was covered with water, and thus G-d placed its generative power to be beneath the water.", "translator": "Sefaria Community Translation", "orig": "תהו, אמר הגאון תהו שהוא מתהום, וזה לא יתכן כי מ\"ם תהום שרש כמו מ\"ם \"הדום\", ובס' יצירה תהו זה קו ירוק ובהו אלו אבנים מפולמות והנכון כאשר אמר המתרגם ארמית, וכן \"ובתהו יליל ישימון\" (דבר' לב י), וכן \"אחרי התהו\" (ש\"א יב כא) שאין בו ממש: ובהו אחי תהו, והווי\"ן תהת ה\"א, כוי\"ו \"וישתחו\" (בראשית יח ב) \"ותרענה באחו\" (בראשית מא ב), והטעם כי בראשית בריאת הרקיע והיבשה לא היה בארץ יישוב כי היתה מכוסה במים וכן שם אלהים כח תולדתה להיות למטה מהמים", "olang": "he", "source": "Ibn Ezra on Gen 1:2, s.v. תהו", "notes": "A grammarian clearing the ground. Saadia Gaon had derived tohu from tehom, the deep; Ibn Ezra refuses it, because the mem of tehom is a root letter, as in hadom. Then he names Sefer Yetzirah's green line and slimy stones — the baraita of b. Chagigah 12a in its other home — and sets it aside in four words: 'what is correct is as the Aramaic translator said', that is, Onkelos' tzadya ve-reikanya, waste and empty; and he proves it from 'the howling waste of tohu' (Deut 32:10) and 'after tohu' (1 Sam 12:21), where the word means without substance. Bohu is 'the brother of' tohu, its vav standing for a hey. His own answer is then physical and is Basil's: at the creation of the firmament and the dry land there was no settled place on the earth, because it was covered with water. The community translation embedded here leaves mefulamot untranslated and renders bohu as 'and confused'; it is CC0 and is kept as it stands.", "slot": false}, {"id": "ramban-1-2-tohu", "short": "ramban-1-2-tohu", "author": "Moses ben Naḥman (Naḥmanides)", "tradition": "rabbinic", "date": 1267, "datelabel": "1263–1270", "place": "Girona", "lat": 41.98, "lon": 2.82, "answers": ["pair-is-matter-and-form", "pair-is-astonishment"], "senses": ["literal"], "lemma": {"he": "תֹּהוּ … בֹּהוּ", "en": "tohu … bohu"}, "en": "This substance, which the Greeks called hyly, is called in the sacred language tohu, the word being derived from the expression of the Sages: “betohei (when the wicked bethinks himself) of his doings in the past.” If a person wants to decide a name for it [this primordial matter], he may bethink himself, change his mind and call it by another name since it has taken on no form to which the name should be attached. The form which this substance finally takes on is called in the sacred language bohu, which is a composite word made up of the two words bo hu (in it there is [substance]). This may be compared to the verse, Thou art not able ‘asohu’ (to perform it), in which case the word asohu is missing a vav and an aleph [and is a composite of the two words] aso hu. It is this which Scripture says, And he shall stretch over it the line of ‘tohu’ (confusion) and the stones of ‘bohu.’ [The tohu in Hebrew or hyly in Greek] is the line by which the craftsman delineates the plan of his structure and that which he hopes to make. This is derived from the expression, Kavei (Hope) unto G-d. The stones are forms in the building. Similarly it is written, They are accounted by Him as nought and ‘tohu,’ as tohu comes after nothingness and there is nothing yet in it. So the Rabbis have also said in Sefer Yetzirah: “He created substance from tohu, and made that which was nothing something.” They have furthermore said in the Midrash of Rabbi Nechunya ben Hakanah: “Rabbi Berachyah said: ‘What is the meaning of the verse, And the earth was ‘tohu’ (without form) ‘vavohu’ (and void)? What is the meaning of the word “was?” It had already been tohu. And what is tohu? It is a thing which astonishes people. It was then turned into bohu. And what is bohu? It is a thing which has substance, as it is written, [bohu is a composite of the two words] ‘bo hu’ (in it there is substance)", "translator": "Charles B. Chavel, 1971–76", "orig": "וְהַחֹמֶר הַזֶּה, שֶׁקָּרְאוּ הִיּוּלִי, נִקְרָא בִּלְשׁוֹן הַקֹּדֶשׁ \"תֹּהוּ\", וְהַמִּלָּה נִגְזְרָה מִלְּשׁוֹנָם (קידושין מ ב): \"בְּתוֹהֶא עַל הָרִאשׁוֹנוֹת\". מִפְּנֵי שֶׁאִם בָּא אָדָם לִגְזֹר בּוֹ שֵׁם, תּוֹהֶא וְנִמְלָךְ לְקוֹרְאוֹ בְּשֵׁם אַחֵר, כִּי לֹא לָבַשׁ צוּרָה שֶׁיִּתָּפֵשׂ בָּהּ הַשֵּׁם כְּלָל. וְהַצּוּרָה הַנִּלְבֶּשֶׁת לַחֹמֶר הַזֶּה נִקְרֵאת בִּלְשׁוֹן הַקֹּדֶשׁ \"בֹּהוּ\", וְהַמִּלָּה מֻרְכֶּבֶת, כְּלוֹמַר \"בּוֹ הוּא\", כְּמִלַּת \"לֹא תוּכַל עֲשֹׂהוּ\" (שמות יח יח), שֶׁמְּחֻסַּר הַו\"ו וְהָאָלֶ\"ף, עֲשׂוֹ הוּא. וְזֶהוּ שֶׁאָמַר הַכָּתוּב (ישעיהו לד יא): \"וְנָטָה עָלֶיהָ קַו תֹהוּ וְאַבְנֵי בֹהוּ\", כִּי הוּא הַקַּו אֲשֶׁר בּוֹ יְתַחֵם הָאֻמָּן מַחְשֶׁבֶת בִּנְיָנוֹ וּמָה שֶׁיְּקַוֶּה לַעֲשׂוֹת, נִגְזַר מִן \"קַוֵּה אֶל ה'\" (תהלים כז יד), וְהָאֲבָנִים הֵם צוּרוֹת בַּבִּנְיָן. וְכֵן כָּתוּב: \"מֵאֶפֶס וָתֹהוּ נֶחְשְׁבוּ לוֹ\" (ישעיהו מ יז), כִּי הַתֹּהוּ אַחַר הָאֶפֶס, וְאֵינֶנּוּ דָּבָר. וְכָךְ אָמְרוּ בְּסֵפֶר יְצִירָה: \"יָצַר מִתֹּהוּ מַמָּשׁ וְעָשָׂה אֵינוֹ יֶשְׁנוֹ\". וְעוֹד אָמְרוּ בְּמִדְרַשׁ רַבִּי נְחוּנְיָא בֶּן הַקָּנָה (ספר הבהיר): אָמַר רַבִּי בֶּרֶכְיָה, מַאי דִכְתִיב: \"וְהָאָרֶץ הָיְתָה תֹהוּ וָבֹהוּ\"? מַאי מַשְׁמַע \"הָיְתָה\"? שֶׁכְּבָר הָיְתָה תֹּהוּ. וּמַאי \"בֹּהוּ\"? אֶלָּא תֹּהוּ הָיְתָה, וּמַאי \"תֹּהוּ\"? דָּבָר הַמַּתְהֶא בְּנֵי אָדָם, וְחָזְרָה לְבֹהוּ. וּמַאי \"בֹּהוּ\"? דָּבָר שֶׁיֵּשׁ בּוֹ מַמָּשׁ, דִּכְתִיב \"בּוֹ הוּא\"", "olang": "he", "source": "Ramban on Gen 1:1, s.v. בראשית (the tohu–bohu paragraph)", "notes": "The one witness on either bench that makes the pair a matched technical vocabulary. The primary matter, which the Greeks call hyle, is called in the holy tongue tohu — the word derived from the rabbinic betohe, of a man who bethinks himself of what he has done, because if a man came to fix a name to this matter he would think again and call it something else, having no form to fasten a name on. The form that the matter puts on is called bohu, a compound word, bo hu, 'in it there is'. Then Isa 34:11 read as a workshop: the line of tohu is the cord by which the craftsman marks out the plan of his building, the stones of bohu are the forms in it — the same verse the Chagigah baraita read as a green line round the world and stones in the deep. He closes with Sefer Yetzirah and with the Bahir's R. Berekhya, who defines tohu as 'a thing which astonishes people' — Rashi's etymology, now describing a substance rather than a viewer. Chavel's English shows on Sefaria as CC BY, which is surprising for a 1971 Shilo text: licence key chavel-ramban is marked for checking before publication. The paragraph that precedes this one — creation from absolute nothing, and the hyle as the only thing created — belongs to K4 and is not sliced here.", "slot": false}, {"id": "basil-hex-2-4", "short": "basil-hex-2-4", "author": "Basil of Caesarea", "tradition": "latin", "date": 400, "datelabel": "c. 400", "place": "Caesarea in Cappadocia", "lat": 38.72, "lon": 35.49, "answers": ["pair-is-under-water", "pair-is-unfurnished"], "senses": ["literal"], "lemma": {"la": "Terra autem erat invisibilis et incomposita", "en": "But the earth was invisible and unordered"}, "en": "'But the earth,' he says, 'was invisible and unordered.' How then, when both elements, that is heaven and earth, were built with equal honour, was heaven complete while the ground was still unordered? Or what cause was there at all that it should be less than finished, and should not be visible? The full ordering of the earth is its own fruitfulness — that is, the sprouting of all plants, and the abundance of trees bearing fruit and bearing none, and the colours and scents of flowers, and the other things which, brought forth a little later at the divine command, adorned the ground. Since none of these yet existed, the word of Scripture rightly called it unordered. And we shall be right to say the same of heaven as unfinished, since it had not taken up its own adornment either, having not yet been lit by the brightness of the sun and the moon, nor crowned with the choirs of the stars. So you will not seem to turn aside from the truth if you call heaven too unordered. But he called the earth invisible for two reasons: either because man, the beholder of it, had not yet come forth, or because, lying hidden under the waters that then stood over it, it could in no way be seen. For the waters had not yet been gathered into their own basins, which the Lord afterwards, when they were collected into one, named seas. A thing is invisible either because it cannot be grasped by bodily eyes, as our mind cannot, or because it can indeed be seen by nature but is hidden by the covering of some body drawn over it, as iron is that lies in the deep. It is in this sense, then, that the earth is now to be thought called invisible, inasmuch as it was covered by the surface of the waters. And then, since light was not yet established, it is no wonder if it was held invisible, when the air itself, lacking brightness, was dark.", "translator": "claude-draft-approved", "orig": "Terra autem, inquit, erat invisibilis et incomposita. Quomodo igitur utrisque elementis, id est coelo et terra, pari honore constructis, coelum quidem perfectum fuerat, tellus vero adhuc incomposita est? Aut quid omnino causae fuit, quo minus perficeretur, et visibilis non esset? Igitur terrae plena compositio est propria fecunditas, id est universarum germinatio plantarum, et arborum fructiferarum vel infructiferarum copia, nec non colores odoresque florei, et alia quae paulo post divino jussu progenita, decoravere tellurem. Quorum quia nondum aliquid exstiterat, merito eam sermo Scripturae incompositam nominavit. Haec autem etiam de coelo imperfecto rite dicemus, quoniam nec ipsum proprium sumpsisset ornatum, quippe quod minime solis adhuc et lunae fuerat fulgore lustratum, nec choris siderum coronatum. Ita non videberis a veritate deflectere, si etiam coelum incompositum dixeris. Terram autem invisibilem dixit ob duas causas, aut quia necdum spectator ejus processerat homo, aut quia sub aquis, quae tunc ei supererant, latens, nullo modo cernebatur. Nondum enim aquae congregatae fuerant in propriis conceptaculis, quas in unum postea collectas Dominus maria nuncupavit. Invisibile itaque est, vel quod oculis non potest carnalibus comprehendi, sicut mens nostra, vel illud quod natura quidem cerni potest, sed propter obductum sibi velamentum corporis alicujus absconditur, sicut ferrum quod in profundo jacet. Hac itaque ratione nunc invisibilem terram dictam esse putandum est, ut pote quae aquarum superficie tegebatur. Deinde quia necdum luce constituta, mirum non est si haberetur invisibilis: cum aer ipse splendore carens esset obscurus.", "olang": "la", "source": "PL 53, col. 879C", "notes": "The Greek pair expounded as a report on conditions, and every answer is a physical one. Unordered means not yet fruitful — and Basil is willing to say heaven was unordered too, since it had no sun or stars yet, which no Latin after him will say. Invisible means either that there was no one to see it, or that it was under water; and he adds a small definition of invisibility that a modern reader can use — invisible as a mind is invisible, or invisible as iron lying at the bottom of the sea. Ibn Ezra reaches the second of these in Lucca seven centuries later from the Aramaic rather than the Greek. The paragraph that follows in Eustathius (PL 53:880C), against those who take the pair to prove an unbegotten matter, is a different argument and belongs to K4.", "slot": false}, {"id": "ambrose-hex-1-7-25", "short": "ambrose-hex-1-7-25", "author": "Ambrose", "tradition": "latin", "date": 387, "datelabel": "c. 387", "place": "Milan", "lat": 45.46, "lon": 9.19, "answers": ["world-has-a-beginning", "pair-is-unfurnished"], "senses": ["literal"], "lemma": {"la": "Quid est, Erat", "en": "What does 'was' mean?"}, "en": "'But the earth was invisible and unordered' (Gen 1:2). A good craftsman lays the foundation first; afterwards, the foundation laid, he distinguishes the parts of the building and adds the adornment. So, the foundation of the earth having been laid and the substance of heaven made firm — for these two are as it were the hinges of things — he wove in below: 'But the earth was invisible and unordered.' What does 'was' mean, unless it is said lest they stretch their opinion out to infinity and without a beginning, and say: See, matter, that is hyle, as the philosophers say, had no beginning even according to divine Scripture. But to those who say this you will answer that it is written: 'And Cain was a worker of the earth' (Gen 4:2). And of the man called Jubal, Scripture has: 'He was the father who showed forth the psaltery and the lyre' (Gen 4:21). And, 'There was a man in the land of Uz, whose name was Job' (Job 1:1). Let them stop raising a question about the word, especially since Moses has said beforehand that God made the earth. It was, then, from the time it was made.", "translator": "claude-draft-approved", "orig": "Terra autem erat invisibilis et incomposita (Gen. I, 2) . Bonus artifex prius fundamentum ponit: postea, fundamento posito, aedificationis membra distinguit, et adjungit ornatum. Posito igitur fundamento terrae, et confirmata coeli substantia, duo enim ista sunt velut cardines rerum, subtexuit: Terra autem erat invisibilis et incomposita. Quid est, Erat, nisi ne forte in infinitum et sine principio extendant opinionem suam, et dicant: Ecce quia materia, id est, hyle, sicut philosophi dicunt, etiam secundum Scripturam divinam non habuit initium. Verum hoc dicentibus respondebis, quia scriptum est: Erat autem Cain operarius terrae (Gen. IV, 2) . Et 14 de eo qui Jubal dictus est, habet Scriptura: Hic erat pater qui demonstravit psalterium et citharam (Ibid., 21) . Et, Homo erat in Ausitide regione, cui nomen Job (Job. I, 1) . Desinant ergo de verbo quaestionem movere, cum praesertim praemiserit Moyses, quia fecit Deus terram. Erat ergo, ex quo facta est.", "olang": "la", "source": "PL 14, col. 135D", "notes": "Ambrose does not argue about the pair at all; he argues about the verb standing in front of it. If the earth 'was' invisible and unordered, someone will say that the matter it was made of has no beginning, which is what the philosophers say of hyle — and the answer is grammatical and slightly impatient: Scripture says Cain 'was' a worker of the earth and Job 'was' in the land of Uz, and nobody makes them eternal. It was, from the time it was made. The image before it is the builder's: foundation first, then the parts distinguished, then the adornment, which is the order of the six days and is Basil's answer to the same question turned into a plan of work.", "slot": false}, {"id": "aug-gnm-1-3-5", "short": "aug-gnm-1-3-5", "author": "Augustine", "tradition": "latin", "date": 389, "datelabel": "388–389", "place": "Thagaste", "lat": 36.29, "lon": 7.95, "answers": ["pair-is-formless-matter"], "senses": ["literal"], "lemma": {"la": "Quomodo fecit Deus in principio coelum et terram, si jam et terra erat invisibilis?", "en": "How did God make heaven and earth in the beginning, if the earth was already invisible?"}, "en": "What follows in the book of Genesis, 'But the earth was invisible and unordered', the Manichaeans find fault with in this way, saying: How did God make heaven and earth in the beginning, if the earth was already invisible and unordered? So, wanting to blame the divine Scriptures before they know them, they fail to understand even the plainest things. For what could have been said more plainly than what is said here: 'In the beginning God made heaven and earth; but the earth was invisible and unordered' — that is, In the beginning God made heaven and earth; but that very earth which God made was invisible and unordered, before God set out the forms of all things in their places and seats by an ordered distinction: before he said, 'Let there be light', and 'Let there be a firmament', and 'Let the waters be gathered', and 'Let the dry land appear', and the rest, which are set forth in order in the same book in such a way that little ones can take them in? All of which hold mysteries so great that whoever has learned them either grieves over the emptiness of all the heretics, because they are men, or laughs at it, because they are proud.", "translator": "claude-draft-approved", "orig": "Quod autem sequitur in libro Geneseos, Terra autem erat invisibilis et incomposita, sic reprehendunt Manichaei, ut dicant: Quomodo fecit Deus in principio coelum et terram, si jam et terra erat invisibilis et incomposita? Ita, cum volunt Scripturas divinas prius vituperare quam nosse, etiam res apertissimas non intelligunt. Quid enim manifestius dici potuit, quam hoc dictum est, In principio fecit Deus coelum et terram; terra autem erat invisibilis et incomposita; id est, In principio fecit Deus coelum et terram; terra autem ipsa quam fecit Deus, invisibilis erat et incomposita, antequam Deus omnium rerum formas locis et sedibus suis ordinata distinctione disponeret: antequam diceret, Fiat lux, et, Fiat firmamentum, et Congregentur aquae, et, Appareat arida, et caetera quae in eodem libro sic exponuntur per ordinem, quemadmodum possint ea parvuli capere? Quae omnia continent tam magna mysteria, ut quisquis ea didicerit, omnium haereticorum vanitatem vel doleat quia homines sunt, vel derideat quia superbi sunt.", "olang": "la", "source": "PL 34, col. 176", "notes": "The crux in the sharpest form anyone puts it, and it is put by an opponent: if God made the earth in the beginning, how was it already invisible and unordered? The objection assumes the pair describes something God had not yet made, and Augustine's whole answer is a single word of grammar — 'that very earth which God made was invisible and unordered', before he distinguished the forms of things. Everything the Latin bench does with this verse for the next eight hundred years is a development of that reading of the sentence. Note the lemma: Augustine's text is the Old Latin invisibilis et incomposita, from the Greek, and not Jerome's inanis et vacua, which he never quotes.", "slot": false}, {"id": "aug-conf-12-4", "short": "aug-conf-12-4", "author": "Augustine", "tradition": "latin", "date": 400, "datelabel": "c. 400", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["pair-is-a-name-for-us"], "senses": ["literal"], "lemma": {"la": "Quid ergo vocaretur … nisi usitato aliquo vocabulo?", "en": "What then was it to be called, if not by some familiar word?"}, "en": "What then was it to be called, so as to be conveyed even to those slower of understanding, if not by some familiar word? And what can be found in all the parts of the world nearer to complete formlessness than earth and the deep? For they are less comely, in their lowest degree, than all the other higher things, translucent and full of light. Why then should I not accept that the formlessness of matter — which you had made without form, that from it you might make a world of form — was so conveniently intimated to men that it should be called 'earth invisible and unordered'? [Chapter V. Why formless matter seems to be so called.] So that when thought searches in it for what sense may reach, and says to itself, It is not an intelligible form like life, like justice, since it is the matter of bodies; nor is it perceptible by sense, since what may be seen and what may be felt is not in the invisible and unordered — while human thought says this to itself, let it try either to know it by not knowing, or to be ignorant of it by knowing.", "translator": "claude-draft-approved", "orig": "Quid ergo vocaretur, quod etiam sensu tardioribus utcumque insinuaretur, nisi usitato aliquo vocabulo? Quid autem in omnibus mundi partibus reperiri potest propinquius informati omnimodae, quam terra et abyssus? Minus enim speciosa sunt, pro suo gradu infimo, quam caetera superiora perlucida et luculenta omnia. Cur ergo non accipiam informitatem materiae, quam sine specie feceras, unde speciosum mundum faceres, ita commode hominibus intimatam, ut appellaretur terra invisibilis et incomposita? CAPUT V. Cur sic appellata videtur materia informis. 5. Ut cum in ea quaerit cogitatio quid sensus attingat, et dicit sibi, Non est intelligibilis forma sicut vita, sicut justitia, quia materies est corporum; neque sensibilis, quoniam quod videatur et quod sentiatur in invisibili et incomposita non est: dum sibi haec dicit humana cogitatio, conetur eam vel nosse ignorando, vel ignorare noscendo.", "olang": "la", "source": "PL 32, col. 827", "notes": "The answer that takes the question away. The pair is not a description of the earth and not the name of a thing: it is the most serviceable word available for formlessness, chosen because earth and the deep are what slower minds already know as the least comely things there are. Augustine keeps it strictly as a name — formless matter is neither an intelligible form like justice nor anything the senses can reach, so the mind can only try to know it by not knowing. That is the exact opposite of the Chagigah baraita, which answers the same question by pointing at a green line and a heap of stones.", "slot": false}, {"id": "aug-conf-12-21", "short": "aug-conf-12-21", "author": "Augustine", "tradition": "latin", "date": 400, "datelabel": "c. 400", "place": "Hippo Regius", "lat": 36.88, "lon": 7.75, "answers": ["pair-many-senses", "pair-is-formless-matter"], "senses": ["literal"], "lemma": {"la": "Aliud sibi tollit qui dicit", "en": "One man takes one thing for himself when he says"}, "en": "Again, as regards the understanding of the words that follow, out of all those true meanings one man takes this for himself when he says: 'But the earth was invisible and unordered, and darkness was over the deep' — that is, That bodily thing which God made was still the formless matter of bodily things, without order, without light. Another when he says: 'But the earth was invisible and unordered, and darkness was over the deep' — that is, This whole which was called heaven and earth was still formless and dark matter, out of which bodily heaven and bodily earth were to be made, with all the things in them known to the bodily senses. Another when he says: 'But the earth was invisible and unordered, and darkness was over the deep' — that is, This whole which was called heaven and earth was still formless and dark matter, out of which was to be made the intelligible heaven, which is elsewhere called the heaven of heaven (Ps 115:16 [Vg 113:16]); and earth, that is, every bodily nature, under which name this bodily heaven too is to be understood: that is, out of which every invisible and visible creature was to be made. Another when he says: 'But the earth was invisible and unordered, and darkness was over the deep' — Scripture did not call that formlessness by the name of heaven and earth; rather, he says, that formlessness which he named 'earth invisible and unordered' and 'the dark deep' already was, and out of it, as he had said beforehand, God made heaven and earth, that is, the spiritual and the bodily creature. Another when he says: 'But the earth was invisible and unordered, and darkness was over the deep' — that is, A certain formlessness was already the matter out of which Scripture said beforehand that God made heaven and earth: namely the whole bodily mass of the world, divided into two greatest parts, the upper and the lower, with all the familiar and known creatures in them.", "translator": "claude-draft-approved", "orig": "Item quod attinet ad intellectum verborum sequentium, ex illis omnibus veris, aliud sibi tollit qui dicit: Terra autem erat invisibilis et incomposita, et tenebrae erant super abyssum, id est, Corporale illud quod fecit Deus, adhuc materies erat corporearum rerum informis, sine ordine, sine luce. Aliud qui dicit: Terra autem erat invisibilis et incomposita, et tenebrae erant super abyssum, id est, Hoc totum quod coelum et terra appellatum est, adhuc informis et tenebrosa materies erat, unde fieret coelum corporeum et terra corporea, cum omnibus quae in eis sunt corporeis sensibus nota. Aliud qui dicit: Terra autem erat invisibilis et incomposita, et tenebrae erant super abyssum, id est, Hoc totum quod coelum et terra appellatum est, adhuc informis et tenebrosa materies erat, unde fieret coelum intelligibile quod alibi dicitur coelum coeli (Psal. CXIII, 16) ; et terra, scilicet omnis natura corporea, sub quo nomine intelligatur etiam hoc coelum corporeum; id est unde fieret omnis invisibilis visibilisque creatura. Aliud qui dicit: Terra autem erat invisibilis et incomposita, et tenebrae erant super abyssum; non illam informitatem nomine coeli et terrae Scriptura appellavit; sed jam erat, inquit, ipsa informitas quam terram invisibilem et incompositam tenebrosamque abyssum nominavit, de qua coelum et terram Deum fecisse praedixerat, spiritualem scilicet, corporalemque creaturam. Aliud qui dicit: Terra autem erat invisibilis et incomposita, et tenebrae erant super abyssum, id est, Informitas quaedam jam materies erat, unde coelum et terram Deum fecisse Scriptura praedixit: totam scilicet corpoream mundi molem, in duas maximas partes, superiorem atque inferiorem distributam, cum omnibus quae in eis sunt usitatis notisque creaturis.", "olang": "la", "source": "PL 32, col. 837", "notes": "Augustine sets out five readings of this one clause, each introduced with the same formula, and does not choose. They differ over what the formlessness is the matter of — bodies only, or the whole of heaven and earth, or the intelligible heaven as well — and over whether Scripture called that formlessness 'heaven and earth' in verse 1 or only named it here. His point is that all five are true and none of them can be shown to be Moses' own, so a reader who insists on one against the others is defending himself rather than Scripture. This is the only place on either bench where the plurality of answers is itself the answer, and it is worth setting beside Bereshit Rabbah 2, which likewise prints four readings of the pair without adjudicating — though there the readings are of history and here they are of physics.", "slot": false}, {"id": "isidore-quaest-1-2", "short": "isidore-quaest-1-2", "author": "Isidore of Seville", "tradition": "latin", "date": 620, "datelabel": "c. 620", "place": "Seville", "lat": 37.39, "lon": -5.99, "answers": ["pair-is-our-flesh"], "senses": ["allegorical"], "lemma": {"la": "Terra scilicet carnis nostrae", "en": "the earth, that is, of our flesh"}, "en": "'But the earth was empty and void.' The earth, that is, of our flesh was empty and void, before it received the form of doctrine. 'And darkness was upon the face of the deep', because the blindness of our sins and the deep obscurity of ignorance covered our hearts.", "translator": "claude-draft-approved", "orig": "Terra autem erat inanis et vacua. Terra scilicet carnis nostrae inanis erat et vacua, priusquam doctrinae acciperet formam. Et tenebrae erant super faciem abyssi, quia delictorum caecitas et ignorantiae profunda obscuritas corda nostra tegebat.", "olang": "la", "source": "PL 83, col. 209B", "notes": "Two sentences that found a lineage. Isidore is not asking what the earth was; he says at the head of the work that he is setting down how the Church's teachers take these things spiritually, and the earth is the flesh of the reader before it has taken the form of doctrine. Wigbod copies it verbatim, Rabanus copies it verbatim (PL 107:467A), Remigius has it at PL 131:55D, and Bruno of Segni turns the same move on the Church rather than the soul. It is the one Latin reading of the pair that does not ask a question about the world at all — and it is, in its structure, what Bereshit Rabbah 2:3 does with the generations.", "slot": false}, {"id": "alcuin-int-30", "short": "alcuin-int-30", "author": "Alcuin", "tradition": "latin", "date": 796, "datelabel": "c. 796", "place": "Tours", "lat": 47.39, "lon": 0.69, "answers": ["pair-is-under-water", "pair-is-formless-matter"], "senses": ["literal", "translation"], "lemma": {"la": "Invisibilis propter obscuritatem; incomposita propter deformitatem", "en": "Invisible because of darkness; unordered because of shapelessness"}, "en": "Question 30. What is: 'But the earth was invisible and unordered' (ibid., from the Septuagint version)? — Answer. Invisible because of darkness; unordered because of shapelessness.", "translator": "claude-draft-approved", "orig": "Inter. 30. Quid est: Terra autem erat invisibilis et incomposita (Ibid. ex vers. LXX) ?-- Resp. Invisibilis propter obscuritatem; incomposita propter deformitatem.", "olang": "la", "source": "PL 100, col. 519D", "notes": "The whole crux compressed into eight words for the schoolroom, and the most interesting thing about it is the parenthesis: 'ex vers. LXX'. Alcuin knows he is expounding a lemma that is not in the Bible his pupils carry, and says so. He splits the pair between the two answers the Latin bench will keep — invisible has to do with light, unordered with form — and gives no reason for either. Angelomus takes this answer over word for word two generations later and puts it inside a discussion of Jerome's text, where it becomes a gloss on 'the other translation'.", "slot": false}, {"id": "wigbod-gen-1-2-tohu", "short": "wigbod-gen-1-2-tohu", "author": "Wigbod", "tradition": "latin", "date": 790, "datelabel": "c. 790", "place": "Aachen", "lat": 50.78, "lon": 6.08, "answers": ["pair-is-unfurnished", "pair-is-our-flesh"], "senses": ["literal", "allegorical"], "lemma": {"la": "Cur inanis et vacua?", "en": "Why 'empty and void'?"}, "en": "D. 'But the earth was empty and void' (Gen 1:2). Why empty and void? M. That is, because it was not divided off from the sea; void, he says, because it was not surrounded by shores, nor adorned with its own furnishings, that is, with trees and animals. Likewise spiritually: the earth, namely, of our flesh was empty and void, before it received the form of doctrine.", "translator": "claude-draft-approved", "orig": "D. Terra autem erat inanis et vacua (Gen. I, 2) . Cur inanis et vacua? M. Id est quia non erat a mari distincta; vacua, inquit, quia littoribus non erat circumdata, vel vicibus suis ornata, id est arboribus et animalibus. Item spiritaliter: Terra scilicet carnis nostrae inanis et vacua erat, priusquam doctrinae acceperit formam.", "olang": "la", "source": "PL 96, col. 1116B", "notes": "The crux asked as a schoolroom question — Cur inanis et vacua? — and answered twice, once about coastlines and once about the soul; the second answer is Isidore word for word. What makes this witness matter is not the answer but where it stands. Five columns earlier, at PL 96:1111B, the same compilation prints Augustine's Manichaean paragraph on the same verse under the Old Latin lemma, terra invisibilis et incomposita, and at 1114C it prints Augustine again on the same words. Here it reads the Vulgate's lemma and asks a different question of it. Wigbod does not notice, and neither does the reader: the two Latin texts of Gen 1:2 sit in one book without a seam.", "slot": false}, {"id": "angelom-gen-1-2-tohu", "short": "angelom-gen-1-2-tohu", "author": "Angelomus of Luxeuil", "tradition": "latin", "date": 850, "datelabel": "c. 850", "place": "Luxeuil", "lat": 47.82, "lon": 6.38, "answers": ["pair-is-formless-matter", "pair-is-under-water", "pair-is-not-of-heaven"], "senses": ["literal", "translation"], "lemma": {"la": "Unde alia translatio dicit: Invisa et incomposita", "en": "Whence another translation says: unseen and unordered"}, "en": "There follows, verse 2: 'But the earth was empty and void.' Since he said above, 'God created heaven and earth', why is it said, 'But the earth was empty and void'? — unless because that formless matter, which is called by the name of earth, was empty and void. Empty, that is, unordered and not yet gathered into its own kinds. Void, because it was free of any fruits to be brought forth. Whence another translation says: 'unseen and unordered'. Unseen because of darkness, unordered because of shapelessness, since it was still wholly covered by the deep, that is, by the measureless depth of the waters. Whence, by what he says — 'But the earth was empty and void' — it can be understood what kind of heaven it was that he had made first: namely that, set apart from all the turning state of this world, it remains always at rest in the divine presence.", "translator": "claude-draft-approved", "orig": "Sequitur: VERS. 2.-- Terra autem erat inanis et vacua. Cum superius ait: Creavit Deus coelum et terram, cur dicitur: Terra autem erat inanis et vacua? nisi quia ipsa informis materia, quae nomine terrae dicta est, inanis erat et vacua. Inanis videlicet, id est incomposita et necdum coadunata in species suas. Vacua vero, quia vacabat a gignendis fructibus. Unde alia translatio dicit: Invisa et incomposita. Invisa propter obscuritatem, Incomposita propter deformitatem, quia adhuc tota abysso, id est, immensa profunditate tegebatur aquarum. Unde per hoc quod ait: Terra autem erat inanis et vacua, quale sit coelum, quod primum condiderat, potest intelligi, videlicet quod ab omni hujus mundi volubili statu secretum, divinae praesentiae manet semper quietum.", "olang": "la", "source": "PL 115, col. 114D", "notes": "A ninth-century compiler doing, in one paragraph, what this crux exists to show. He asks the Vulgate's question, answers it with Augustine's unformed matter, then reaches for the other version — 'unseen and unordered' — and glosses it with Alcuin's eight words from Interrogatio 30, unattributed; then he turns to Bede's argument that the phrase is withheld from heaven, and copies Bede's sentence about the heaven set apart from the turning of this world. Three sources and two Latin translations, spliced without a join. His 'invisa' for 'invisibilis' is his own or his exemplar's.", "slot": false}, {"id": "remigius-gen-1-2-tohu", "short": "remigius-gen-1-2-tohu", "author": "Remigius of Auxerre", "tradition": "latin", "date": 900, "datelabel": "c. 900", "place": "Auxerre", "lat": 47.8, "lon": 3.57, "answers": ["pair-is-unfurnished", "pair-is-under-water"], "senses": ["literal"], "lemma": {"la": "Inutilis, infructuosa et incomposita", "en": "Useless, unfruitful, and unordered"}, "en": "Verse 2. 'But the earth was empty and void.' That is, useless, unfruitful, and unordered. For all the elements were mingled and confused, and this whole space of air which is from the earth up to heaven was full of waters — which, however, were not of the same quality as they now are, but thin, after the manner of clouds, a quality which those waters above the heavens still keep.", "translator": "claude-draft-approved", "orig": "Vers. 2. Terra autem inanis et vacua. Id est, inutilis, infructuosa et incomposita. Omnia enim elementa commista erant et confusa, et totum hoc aeris spatium quod est a terra usque ad coelum plenum erat aquis, quae tamen non erant ejusmodi qualitatis cujus nunc sunt, sed in modum nubium tenues, quam qualitatem adhuc illae supercoelestes aquae retinent.", "olang": "la", "source": "PL 131, col. 55A", "notes": "Three adjectives that outlived their author. 'Useless, unfruitful, and unordered' is the gloss the Glossa Ordinaria prints on this lemma under the siglum STRAB., word for word and with the sentence about the mingled elements and the thin waters after it; from the Glossa it reaches Comestor, who keeps 'useless and unfruitful' and drops 'unordered'. The last clause is worth noticing on its own: the waters above the firmament still have the quality the primordial waters had, so that a reader can look up and see what verse 2 was talking about.", "slot": false}, {"id": "bede-gen-1-2-tohu", "short": "bede-gen-1-2-tohu", "author": "Bede", "tradition": "latin", "date": 720, "datelabel": "c. 720", "place": "Jarrow", "lat": 54.98, "lon": -1.49, "answers": ["pair-is-not-of-heaven", "pair-is-unfurnished"], "senses": ["literal"], "lemma": {"la": "Ut quid enim haec de terra, praetermisso coelo, intulit?", "en": "Why did he say these things of the earth and pass heaven by?"}, "en": "'But the earth was empty and void, and darkness upon the face of the deep.' For why did he say these things of the earth, passing heaven by, unless because he wanted nothing of the sort understood of heaven? For that is the heaven above, which, set apart from all the turning state of this world, remains always at rest [in the glory of the divine foreknowledge]. As for our heaven, in which are set the lights necessary to this age, Scripture declares in what follows both how and when it was made. That heaven above, then, which is unreachable by the sight of all mortals, was not created empty and void as the earth was, which in its first creation brought forth nothing of green shoots or of living creatures — because, of course, as soon as it was created it was filled with its own inhabitants, that is, with the most blessed ranks of the angels; and that these were founded in the beginning together with heaven and earth, and at once referred their own founding, and that of the whole first creation, to the praise of the Creator, the Founder himself bears witness, who speaking to his holy servant Job says: 'Where were you when I laid the foundations of the earth?' (Job 38:4), and a little after: 'When the morning stars praised me together, and all the sons of God shouted for joy' (Job 38:7).", "translator": "claude-draft-approved", "orig": "Terra autem erat inanis et vacua, et tenebrae super faciem abyssi. Ut quid enim haec de terra, praetermisso coelo, intulit, nisi quia nihil tale de coelo intelligi voluit? Ipsum est enim coelum superius, quod ab omni hujus mundi volubili statu secretum divinae gloria praescientiae manet semper quietum. Nam de nostro coelo, in quo sunt posita luminaria, huic saeculo necessaria, in sequentibus scriptura, vel quomodo, vel quando sit factum declarat. Non ergo superius illud coelum, quod mortalium omnium est inaccessibile conspectibus, inane creatum est et vacuum in terra, quae nihil in prima sua creatione virentium germinum vel viventium produxit animantium, quia nimirum suis incolis mox creatum, hoc est beatissimis angelorum agminibus impletum est; quos in principio cum coelo et terra conditos esse, ac mox conditionem suam simul et totius creaturae primordialis ad laudem creatoris retulisse, testatur ipse Conditor, qui loquens ad sanctum famulum suum Job dicit: Ubi eras quando ponebam fundamenta terrae (Job. XXXVIII, 4) ? Et paulo post: Cum me laudarent simul astra matutina, et jubilarent omnes filii Dei (Ibid., 7)", "olang": "la", "source": "PL 91, col. 13C", "notes": "Bede answers the crux by asking what the verse does not say. The pair is predicated of the earth and withheld from heaven, and that silence is information: the upper heaven was not empty, because it was filled with its inhabitants as soon as it was made, and Job 38:7 supplies the angels singing at the founding. It is the argument Abelard will make four hundred years later from the adversative conjunction, and the Glossa carries it in the margin at the head of verse 2. The Corpus Corporum text reads 'divinae gloria praescientiae' where Angelomus and the Glossa both have 'divinae praesentiae'; the English brackets the phrase. [CHECK the PL plate.]", "slot": false}, {"id": "glossa-1-2-terra", "short": "glossa-1-2-terra", "author": "Glossa ordinaria (school of Laon)", "tradition": "latin", "date": 1120, "datelabel": "compilation 1110–1130", "place": "Laon", "lat": 49.56, "lon": 3.62, "answers": ["pair-is-not-of-heaven"], "senses": ["literal"], "lemma": {"la": "Terra autem erat inanis", "en": "But the earth was empty"}, "en": "Verse 2. « But the earth was empty, » etc. [n: (BEDE, Hexaemeron, vol. II.)] He shows which heaven, and of what kind, was made in the beginning together with the earth. For he adds this of the earth, which he did not want understood of heaven. For that upper heaven, which is set apart from the turning of the world, as soon as it was created was filled with the holy angels — whom the Lord bears witness were founded in the beginning together with heaven and earth, saying in Job 38: « Where were you when the morning stars praised me, and all the sons of God shouted for joy? » He calls the same angels morning stars and sons of God. For of the heaven in which the lights are set, he says afterwards how and when it was made.", "translator": "claude-draft-approved", "orig": "VERS. 2.-- « Terra autem erat inanis, » etc. (BEDA, Hexaem. tom. II.) Quod vel quale coelum in principio cum terra factum est, ostendit. Hoc enim de terra subdit, quod de coelo intelligi noluit. Hoc enim superius coelum quod a volubilitate mundi secretum est, mox ut creatum est, sanctis angelis est impletum: quos in principio cum coelo et terra conditos testatur Dominus dicens Job XXXVIII: « Ubi eras cum me laudarent astra matutina, et jubilarent omnes filii Dei? » Astra matutina eosdem angelos et filios Dei vocat. De coelo enim in quo posita sunt luminaria, quomodo vel quando factum sit postea dicit.", "olang": "la", "source": "PL 113, col. 69C", "notes": "The gloss that stands at the head of verse 2 in the margin, labelled BEDA and compressing his paragraph to five sentences, keeping Job 38:7 and the two heavens. The second gloss on this lemma — Walahfrid's 'useless, unfruitful, and unordered', which is Remigius verbatim — is already on the site inside the K7 witness glossa-1-2-ruach, where Wilson's edition appended it; it is not sliced again here. A third gloss, again from Bede, follows on 'and there was darkness' and ends by naming earth and water as the unformed matter: that belongs to K4. English here is a fresh draft, superseded when Wilson's Glossa edition reaches this lemma.", "slot": false}, {"id": "bruno-gen-1-2-tohu", "short": "bruno-gen-1-2-tohu", "author": "Bruno of Segni", "tradition": "latin", "date": 1100, "datelabel": "c. 1100", "place": "Segni", "lat": 41.69, "lon": 13.02, "answers": ["pair-is-history", "pair-is-our-flesh"], "senses": ["allegorical"], "lemma": {"la": "absque liberis erat Ecclesia", "en": "the Church was without children"}, "en": "Still, however, the earth was empty and void, still unfruitful, and the Church was without children — she whom the prophet also, comforting her for her barrenness and promising fruitfulness, addressed: « Rejoice, barren one, who do not bear; break forth and cry out, you who do not travail, for many are the children of the desolate, more than of her who has a husband » (Isa 54:1; Gal 4:27). But why empty and void? Because darkness was still upon the face of the deep. For no one understood the Scriptures, deep as they are and wrapped in the darkness of ignorance — which, that they may be understood, « deep calls unto deep » (Ps 42:7 [Vg 41:8]). But Christ took away this darkness when he opened the apostles' understanding, that they might understand the Scriptures. For if the Jews understood them, they would take refuge in the Church; but because, as the Apostle says, « to this day, while Moses is read, a veil is placed over their hearts » (2 Cor 3:15), they are not able to understand them. But when the fullness of the Gentiles has come in, then, the veil taken away, Israel shall be saved (Rom 11:25). For our earth shall no longer be called empty and void, inhabited by the fullness of so many sons.", "translator": "claude-draft-approved", "orig": "Adhuc tamen inanis et vacua erat terra, adhuc infecunda, et absque liberis erat Ecclesia, quam etiam propheta de sterilitate consolans, fecunditatemque promittens, dicebat: « Laetare, sterilis, quae non paris; erumpe, et clama, quae non parturis, quia multi filii desertae magis, quam ejus quae habet virum (Isa. LIV, 1; Gal. IV, 27) . » Sed quare inanis et vacua? Quia adhuc tenebrae erant super faciem abyssi. Nemo enim Scripturas intelligebat, utpote profundas et ignorantiae tenebris obvolutas, quae quidem ut intelligi valeant, « abyssus abyssum invocat (Psal. XLI, 8) . » Has autem tenebras Christus amovit, quando apostolis sensum aperuit, ut Scripturas intelligerent. Si enim Judaei has intelligerent, 3 ad Ecclesiam confugerent; sed quia, ut Apostolus ait: « Usque hodie dum legitur Moyses, velamen positum est super corda eorum (II Cor. III, 15) , » eas quidem intelligere non valent. Cum autem plenitudo gentium introierit, tunc amoto velamine Israel salvus fiet (Rom. XI, 25) . Neque enim ulterius inanis, et vacua terra nostra vocabitur, tantorum filiorum plenitudine inhabitata.", "olang": "la", "source": "PL 164, col. 150B", "notes": "Isidore's allegory moved off the individual soul and onto history: the empty earth is the Church before she had children, the darkness on the deep is the unread Scripture, and the emptiness ends not at the third day but at the end — when the fullness of the Gentiles has come in and Israel is saved, the earth will no longer be called empty and void. Structurally this is Bereshit Rabbah 2:3, which reads the same clause as the generations from Adam to Abraham and ends with the morning of Jacob; and it is Resh Lakish's four kingdoms in 2:4, which ends with the spirit of the Messiah. Three readings of one clause as a periodization of sacred history, with the same shape and opposite contents, and no possible contact. Bruno's Corpus Corporum text carries a stray '3' before 'ad Ecclesiam confugerent', which is dropped here as a printer's mark.", "slot": false}, {"id": "rupert-gen-1-2-tohu", "short": "rupert-gen-1-2-tohu", "author": "Rupert of Deutz", "tradition": "latin", "date": 1114, "datelabel": "c. 1114", "place": "Liège", "lat": 50.63, "lon": 5.57, "answers": ["pair-is-unfurnished"], "senses": ["literal"], "lemma": {"la": "inanis ab omni germine … vacua a cunctis animantibus", "en": "empty of every shoot … void of all living things"}, "en": "For the rest, according to what has already been said, the earth was empty and void, because the Creator had not yet separated it as dry land from the waters, had not yet made it firm, had not yet clothed it with the mantle of the stars of this heaven, had not yet furnished it with so many kinds of creatures. And so, if you consider the letter carefully, the earth was not created in the beginning with the visible appearance of its own which it now shows, but was empty — empty, that is, of every shoot which is now rooted in it — and void, namely of all the living things which now move in it.", "translator": "claude-draft-approved", "orig": "Caeterum secundum quod jam dictum est, terra erat inanis et vacua, quia nondum illam Creator ab aquis aridam segregaverat, nondum firmaverat, nondum sidera coeli hujus palla vestiverat, nondum tot creaturarum generibus exornaverat. Itaque si diligenter litteram consideres, non cum sua, quae tunc apparet visibili specie, creata est in principio terra, sed erat inanis, inanis scilicet ab omni germine, quod nunc in ea radicatur, et vacua, videlicet a cunctis animantibus quae nunc in ea moventur.", "olang": "la", "source": "PL 167, col. 205A", "notes": "'If you consider the letter carefully' — and the letter, considered carefully, yields a list of what was not there yet: dry land, firmness, stars, kinds. Rupert then splits the pair the way the twelfth century regularly splits it, empty of shoots and void of animals, which is Abelard's division (fruit and inhabitant) and Hugh's in the Adnotationes (seeds and shoots) with the terms moved about. None of the three cites another, and the distribution of the two terms differs each time: what they share is the conviction that the pair is a pair, and that each word must be given its own privation.", "slot": false}, {"id": "abelard-hex-1-2-tohu", "short": "abelard-hex-1-2-tohu", "author": "Peter Abelard", "tradition": "latin", "date": 1130, "datelabel": "c. 1130", "place": "The Paraclete (Nogent-sur-Seine)", "lat": 48.49, "lon": 3.5, "answers": ["pair-is-unfurnished", "pair-is-not-of-heaven"], "senses": ["literal"], "lemma": {"la": "ex illa apposita conjunctione adversativa", "en": "from that adversative conjunction set beside it"}, "en": "'But the earth was empty and void.' Since this treatise looks especially to the creation of man, who was to be formed from the earth and to live on the earth — in which the prophet, as we have said, intending to draw man to the worship of God, turned his pen to earthly works, passing over the creation of the heavenly and higher nature, that is the angelic; lest perhaps, if he examined it and displayed its excellence to the praise of its Creator, he should draw man less to the love of God, seeing another nature preferred to himself. And so, having said first that the earth in its creation stood empty and void, he declares by the works of the later days how the divine working afterwards saw to its emptiness and its voidness. He calls the earth empty of fruit, which it had not yet brought forth; void of an inhabitant, not only of man but of every kind of living thing whatever, since as yet no dwelling, whether of land or of water, held any living things — both of which, as we have said, he takes in under the word 'earth'. And so he calls 'earth', according to what has been set out, this lower region of the world consisting of the heavy elements. And it is to be noted that when he says 'but the earth was empty and void', he hints, from that adversative conjunction set beside it, that heaven is not to be so understood — since the angels are understood to have been created either before heaven itself or together with heaven, and are called, as it were, the dwellers in heaven; so that although the prophet does not pursue their creation, he yet touches it in passing, lest anything should seem missing from his account of the divine works.", "translator": "claude-draft-approved", "orig": "Terra autem erat inanis et vacua. Quoniam ad hominis creationem de terra formandi et in terra conversaturi specialiter iste spectat tractatus, quo propheta, ut diximus, ad cultum Dei hominem allicere intendens, ad terrena opera stylum convertit, coelestis et superioris naturae, id est angelicae creatione praeterita; ne forte,, si eam perscrutaretur et ad Creatoris sui laudem ejus excellentiam ostenderet, minus hominem ad amorem Dei alliceret, qui sibi aliam praeferri naturam conspiceret. Praemittens itaque terram in creatione sua inanem et vacuam exstitisse, quomodo postmodum ejus inanitati et vacuitati divina operatio consuluerit posteriorum dierum operibus declarat. Inanem, dicit terram a fructu, quem nondum produxerat; vacuam, ab habitatore, non solum homine, verum etiam ab omni penitus animantium genere, cum nulla adhuc animantia vel terrestris vel aquatica mansio contineret, quae utraque, ut diximus, terrae vocabulo comprehendit. Terram itaque dicit, secundum quod expositum est, hanc ex elementis gravibus constantem inferiorem mundi regionem. Et notandum quod, dum ait, terra autem erat inanis et vacua, subinnuit ex illa apposita conjunctione adversativa de coelo non sic esse intelligendum, cum videlicet angeli vel ante ipsum coelum vel cum coelo creati esse intelligantur, qui quasi coelestes habitatores dicuntur, ut, licet eorum creationem propheta non exsequatur, in transitu tamen eam perstringat, ne quid ejus narrationi de divinis operibus deesse videatur.", "olang": "la", "source": "PL 178, col. 734C", "notes": "Abelard gets Bede's conclusion out of a single word. 'Terra AUTEM erat inanis et vacua': the adversative conjunction implies a contrast, so what is said of the earth is being denied of heaven, and heaven is not empty because the angels are its inhabitants — whose creation Moses passes over on purpose, lest man, drawn to the worship of God, should see another nature preferred to himself. That last reason is Abelard's own and belongs to no one else on this crux. The division of the pair — empty of fruit, void of an inhabitant — matches Rupert's and Hugh's without citing either.", "slot": false}, {"id": "hugh-adnot-1-2-tohu", "short": "hugh-adnot-1-2-tohu", "author": "Hugh of St Victor", "tradition": "latin", "date": 1130, "datelabel": "c. 1130", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["pair-is-unfurnished"], "senses": ["literal"], "lemma": {"la": "Inanis a seminibus; vacua a germinibus", "en": "Empty of seeds; void of shoots"}, "en": "'But the earth was empty and void.' Empty of seeds; void of shoots; or empty on account of its hollowness; void, because in so great a hollowness of the earth there was nothing but air and mist.", "translator": "claude-draft-approved", "orig": "Terra autem erat inanis et vacua. Inanis a seminibus; vacua a germinibus; vel inanis propter concavitatem: vacua, quia in tanta concavitate terrae non erat nisi aer et nebula.", "olang": "la", "source": "PL 175, col. 35D", "notes": "The school formula at its shortest, and it gives two distributions rather than one: empty of seeds and void of shoots — or else empty because the earth was hollow and void because there was nothing in the hollow but air and mist. The second is a physical picture, and it is the one Hugh's own Adnotationes go on to develop in the sentences on the mist, the deep and the waters that are built as the K7 witness hugh-adnot-gen-1-2, immediately after this.", "slot": false}, {"id": "hugh-sacr-1-1-tohu", "short": "hugh-sacr-1-1-tohu", "author": "Hugh of St Victor", "tradition": "latin", "date": 1134, "datelabel": "1130–1137", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["pair-is-formless-matter"], "senses": ["translation", "literal"], "lemma": {"la": "sive, ut alia translatio habet, incomposita", "en": "or, as another translation has it, unordered"}, "en": "'But the earth was empty and void' (Gen 1) — or, as another translation has it, « unordered » — 'and darkness was upon the face of the deep' (ibid.). For by 'heaven and earth' I think there is signified in this place that matter of all things heavenly and earthly, out of which were afterwards made, one after another, in form, the things which had first been created in it together in their essence. For there 'earth' was the element of earth itself, and 'heaven' was that mobile and light confusion of the remaining three, which was carried suspended around the earth lying in the middle; and in these two was contained the matter of all bodies, heavenly or earthly, that were to be formed.", "translator": "claude-draft-approved", "orig": "Terra autem erat inanis et vacua (Gen. I) ; sive, ut alia translatio habet, « incomposita, » et tenebrae erant super faciem abyssi (ibid.) . Per coelum namque et terram, materiam illam omnium coelestium terrestriumque, hoc loco significari puto, de qua postea succedenter in forma facta sunt quae in ipsa prius per essentiam simul creata fuerunt. Ibi namque terra erat ipsum terrae elementum, et coelum mobile erat illa et levis confusio reliquorum trium quae in circuitu medio jacentis terrae suspensa ferebatur; et his duobus omnium corporum coelestium sive terrestrium formandorum materia continebatur.", "olang": "la", "source": "PL 176, col. 190D", "notes": "The first plain statement on the Latin bench that there is another translation of this clause. Hugh quotes the Vulgate's lemma, gives the Old Latin word in the same breath, and then goes on to Augustine's reading — heaven and earth name the matter of everything, in which all things were made together in essence before they were made one after another in form. He does not say which text is better, or where the other comes from; he simply will not let a reader think there is only one. Alcuin had named the Septuagint three hundred years earlier and then expounded the Greek lemma as if it were the Bible; Hugh names the variant while expounding the Vulgate. Wigbod printed both, five columns apart, and said nothing.", "slot": false}, {"id": "comestor-hs-1-2-tohu", "short": "comestor-hs-1-2-tohu", "author": "Peter Comestor", "tradition": "latin", "date": 1170, "datelabel": "c. 1170", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["pair-is-unfurnished", "pair-is-formless-matter"], "senses": ["literal"], "lemma": {"la": "machina mundialis adhuc erat inutilis", "en": "the world-machine was still useless"}, "en": "'But the earth was empty and void' (Gen 1) — that is, the world-machine was still useless, and unfruitful, and void of its adornment. 'And darkness was upon the face of the deep.' The same machine which he had called earth he calls the deep, on account of its confusion and darkness. Whence the Greek called it chaos.", "translator": "claude-draft-approved", "orig": "Terra autem erat inanis et vacua (Gen. I) , id est machina mundialis adhuc erat inutilis, et infructuosa, et vacua ornatu suo. Et tenebrae erant super faciem abyssi. Eamdem machinam quam terram dixerat, abyssum vocat pro sui confusione et obscuritate. Unde et Graecus eam chaos dixit.", "olang": "la", "source": "PL 198, col. 1056B", "notes": "The gloss arrives at the Paris schools in its final form: Remigius' three adjectives, minus one, applied not to the earth but to the machina mundialis, the world considered as a piece of apparatus not yet fit for use. Comestor then identifies the deep with what the Greeks call chaos, which is the classical name the earlier bench avoids — Abelard, in the sentences that follow the slice built here (PL 178:734D), had said that 'certain of the philosophers or poets called this confusion chaos' and kept his distance; Comestor states it as a fact of vocabulary. From here it goes into the Historia's readership, which is everyone.", "slot": false}, {"id": "br-2-4", "short": "Bereshit Rabbah 2:4", "author": "Bereshit Rabbah", "tradition": "rabbinic", "date": 450, "datelabel": "compilation 400–500", "place": "Galilee (Tiberias / Sepphoris)", "lat": 32.79, "lon": 35.53, "answers": ["messiah", "bird-hovering"], "senses": ["allegorical", "literal"], "lemma": {"he": "וְרוּחַ אֱלֹהִים מְרַחֶפֶת", "en": "and the spirit of God was hovering"}, "en": "“And the spirit of God was hovering” – this is the spirit of the messianic king, as it says: “The spirit of the Lord will rest upon him” (Isaiah 11:2). By what merit will it [the Messianic kingdom] come? “Hovering over the surface of the water” – by the merit of repentance, that is likened to water, as it is stated: “Pour out your heart like water [before the face of the Lord]” (Lamentations 2:19). Rabbi Ḥagai said in the name of Rabbi Pedat: A covenant is made with the water, that even when the weather is hot, the wind blows over it. It happened once that Rabbi Shimon ben Zoma was sitting, entranced in thought. Rabbi Yehoshua passed and greeted him once, twice, but he did not answer him. The third time, he answered him with a start. He said to him: ‘Ben Zoma, where were your thoughts?’ He said to him: ‘I have been contemplating.’ He said to him: ‘As the heavens and the earth are my witnesses, I shall not move from here until you inform me where your thoughts were.’ He said to him: ‘I was looking at the act of Creation, and [I saw that] between the upper waters and the lower waters there were only two or three fingerbreadths. “The spirit of the Lord was blowing” is not written, but rather, “was hovering” – like a bird that flaps its wings, they touch [the nest] but do not quite touch.’ Rabbi Yehoshua turned and said to his disciples: Ben Zoma is gone. Not even a few days passed with ben Zoma still in the world.", "translator": "The Sefaria Midrash Rabbah, 2022", "orig": "וְרוּחַ אֱלֹהִים מְרַחֶפֶת\" זה רוחו של מלך המשיח היאך מה דאת אמר (ישעיה יא, ב): \"ונחה עליו רוח ה'\" באיזו זכות ממשמשת ובאה המרחפת על פני המים בזכות התשובה שנמשלה כמים שנאמר (איכה ב, יט): \"שפכי כמים לבך\". רבי חגי בשם רבי פדת אמר ברית כרותה למים שאפילו בשעת שרב רוחה שייפה. וכבר היה ר\"ש בן זומא יושב ותוהא ועבר רבי יהושע ושאל בשלומו פעם ושתים ולא השיבו בשלישית השיבו בבהילות א\"ל בן זומא מאין הרגלים אמר לו מעיין הייתי א\"ל מעיד אני עלי שמים וארץ שאיני זז מכאן עד שתודיעני מאין הרגלים א\"ל מסתכל הייתי במעשה בראשית ולא היה בין מים העליונים למים התחתונים אלא כשתים ושלש אצבעות. ורוח אלהים מנשבת אין כתיב כאן אלא מרחפת כעוף הזה שהוא מרפרף בכנפיו וכנפיו נוגעות ואינן נוגעות נהפך רבי יהושע ואמר לתלמידיו הלך לו בן זומא ולא שהו ימים מועטים ובן זומא בעולם:", "olang": "he", "source": "Bereshit Rabbah 2:4 (Vilna numbering; Theodor–Albeck differs)", "notes": "Two answers in one section. Resh Lakish: the ruach is the spirit of the King Messiah (Isa 11:2), brought by repentance-as-water. Then the Ben Zoma story: 'blowing' is not written but 'hovering' — like a bird beating its wings, touching and not touching. Note the bird is an unspecified 'of' and the claim is touching-and-not-touching; the Bavli's version has a dove and no touching at all.", "slot": false}, {"id": "glossa-1-2-ruach", "short": "Glossa (slot)", "author": "Glossa ordinaria (school of Laon)", "tradition": "latin", "date": 1120, "datelabel": "compilation 1110–1130", "place": "Laon", "lat": 49.56, "lon": 3.62, "answers": ["power-not-place", "brooding-warmth", "trinity", "heart"], "senses": ["literal", "allegorical"], "lemma": {"la": "Et Spiritus Domini ferebatur super aquas", "en": "And the Spirit of the Lord was borne over the waters"}, "en": "« And the Spirit of the Lord was borne over the waters. » [var: Vulg. Gen. 1:2 *Spiritus Dei*, \"the Spirit of God\"] [n: (AUG., lib. I de Gen. ad lit., c. 5, tom. III.)] Either he called the whole corporeal matter water, that he might intimate whence were made and formed all the things which we see formed on the earth out of a moist nature through divers species; or the spiritual life, as it were floating, before the [0070B] form of its conversion. The Spirit of God was borne above, because that which he had begun to be formed and perfected lay beneath the good will of the Creator. It is also said, « The Spirit of the Lord was borne over the waters. » Lest, by doing works, God should be t
