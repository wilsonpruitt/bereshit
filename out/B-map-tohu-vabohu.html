hought to love through the necessity of want rather than through the abundance of beneficence. For fittingly is something first intimated to have been begun, over which he might be borne: not in place, but by a power surpassing all things.\n\n« And the Spirit of the Lord was borne, » etc. [n: (HIERON. in Gen. t. III, col. 939.)] In the Hebrew it has *merahephet,* that is, it brooded, or cherished, after the manner of a bird warming eggs with the heat of a living thing. We understand therefore that this is not said of the spirit of the world, as many suppose; but of the [0070C] Holy Spirit, who is himself the quickener of all things: and if the quickener, also the founder; if the founder, also God. Psal. CIII: « Send forth, he says, thy Spirit, and they shall be created. » [var: Vulg. Ps. 103:30 *Emittes*, \"Thou shalt send forth\"]\n\n« And the Spirit, » etc. In whom, subsisting, we might rest, quickened by his breath and washed by the wave of baptism. « And the Spirit of the Lord was borne over the waters, » etc. As God, namely, and Creator, he presided over the floating and confused matter, that he might distinguish it when he willed. The whole Trinity therefore is understood to have worked here, God, that is, the Father; the beginning, the Son; the Spirit of God, the Holy Spirit.\n\n« And the Spirit, » etc. [n: (ISID., in Gen.? )] The hearts, namely, that were tossing to and fro, which had lost the quiet of the mind, [0070D] because the Spirit did not rest upon them, but was borne above them: as one able to call back their nature from confusion into something better. Then throughout the whole text of this Scripture we see certain six laborious ages, though distinguished as it were by neighbouring bounds, so that in the seventh rest may be hoped for; and we see that they have a likeness to the six days in which those things were made which Scripture records God to have made. For the first beginning of the human race, in which it began to enjoy this light, is compared to the first day, on which God made light. This age is as it were the infancy of the whole world, which we think of, by the proportion of its greatness, as one man. For man, when he is first born into the light, passes his infancy, the first age, which extends from Adam to Noah in ten generations: the flood is as it were the evening of this [0071A] day, because our infancy is blotted out by the flood of forgetfulness.\n\n[n: (STRAB.)] « Void and empty. » Useless, namely, and unfruitful, and unordered. For all the elements were mingled and confused, and this whole space of air was full of waters; not such as they now are, but they were like thin clouds, such as those above the heavens still are.", "translator": "wilson-pruitt", "orig": "« Et Spiritus Domini ferebatur super aquas. » [n: (AUG., lib. I de Gen. ad lit., c. 5, tom. III.)] Sive totam corporalem materiam aquam appellavit, ut insinuaret unde facta et formata sunt omnia quae ex humida natura per species varias in terra formari videmus; sive spiritualem vitam ante conversionis [0070B] formam quasi fluitantem. Spiritus Dei superferebatur, quia subjacebat bonae voluntati Creatoris, quod formandum et perficiendum inchoaverat. Dictum est etiam « Spiritus Domini ferebatur super aquas. » Ne faciendo opera potius per necessitatem indigentiae quam per abundantiam beneficentiae Deus amare putaretur. Commode enim prius insinuatur aliquid inchoatum, cui superferretur: non loco, sed omnia superante potentia.\n\n« Et Spiritus Domini ferebatur, » etc. [n: (HIERON. in Gen. t. III, col. 939.)] In Hebraeo habet *merahephet,* id est, incubabat, vel fovebat, more volucris ova calore animantis. Intelligimus ergo non de spiritu mundi dici, ut putant multi; sed de Spiritu [0070C] sancto, qui et ipse est omnium vivificator: si autem vivificator, et conditor; si conditor, et Deus. Psal. CIII: « Emitte, ait, Spiritum tuum et creabuntur. »\n\n« Et Spiritus, » etc. In quo subsistentes requiesceremus flatu ejus vivificati, et unda baptismi abluti. « Et Spiritus Domini ferebatur super aquas, » etc. Sicut Deus, scilicet et conditor, praeerat fluitanti et confusae materiei, ut distingueret quando vellet. Tota ergo Trinitas hic operata intelligitur, Deus, Pater scilicet; principium, Filius; Spiritus Dei, Spiritus sanctus.\n\n« Et Spiritus, » etc. [n: (ISID., in Gen.? )] Corda scilicet fluctuantia, quae mentis quietem amiserant, [0070D] quia eis spiritus non innitebatur, sed superferebatur: quasi potens naturam a confusione in melius revocare. Deinde per totum hujus Scripturae textum sex quasdam operosas aetates videmus, licet quasi proximis limitibus distinctas, ut in septima quies speretur; et eas habere similitudinem sex dierum, quibus ea facta sunt, quae Deum fecisse Scriptura commemorat. Primordium enim generis humani, quo ista luce frui coepit, comparatur primo diei quo lucem Deus fecit. Haec aetas tanquam infantia est totius saeculi, quod tanquam unum hominem proportione magnitudinis suae cogitamus. Homo enim cum primo nascitur in lucem, infantiam agit primam aetatem, quae tendit ab Adam usque ad Noe generationibus decem: diluvium quasi vespera hujus [0071A] diei est, quia infantia nostra oblivionis diluvio deletur.\n\n[n: (STRAB.)] « Inanis et vacua. » Inutilis scilicet, et infructuosa, et incomposita. Omnia enim elementa commixta, confusa, et totum hoc aeris spatium aquis plenum; non quales nunc sunt, sed sicut nebulae tenues erant, quales adhuc supercoelestes sunt.", "olang": "la", "source": "PL 113, col. 70A–70D (marginal glosses on 1:2, in the order printed; the 'inanis et vacua' gloss from 69D appended)", "notes": "Four glosses stand on the verse in the margin: Augustine Gn. litt. I.5 (water as matter; love not from need; 'not in place but by a power surpassing all'); Jerome's merahephet, cited by PL column; an unlabelled sentence that is Bede's Trinity gloss via Rabanus ('Tota ergo Trinitas hic operata'); and one Migne marks 'ISID. in Gen.?' (the floating hearts, which is Isidore's moral reading in Augustine's wording). The lemma reads 'Spiritus Domini', the Old Latin, not the Vulgate's 'Spiritus Dei' — Wilson's [var:] flags it. The bird enters the Glossa through Jerome only; the Syrian and the craftsman are both absent.", "slot": false}, {"id": "hugh-adnot-gen-1-2", "short": "Hugh of St Victor", "author": "Hugh of St Victor", "tradition": "latin", "date": 1130, "datelabel": "c. 1130", "place": "Paris", "lat": 48.86, "lon": 2.35, "answers": ["craftsman"], "senses": ["literal"], "lemma": {"la": "Spiritum Dei vocat ejus intentionem", "en": "He calls 'the Spirit of God' his intention"}, "en": "'And the Spirit of God was borne over the waters.' He calls 'the Spirit of God' his intention, who like a craftsman presided over the work to be formed; 'the waters' he calls that mist, on account of its mobility; and so he names the same thing now 'abyss' for its depth, now 'darkness' for the absence of light, now 'waters' for its mobility.", "translator": "claude-draft-approved", "orig": "Et spiritus Dei ferebatur super aquas. Spiritum Dei vocat ejus intentionem, qui quasi artifex operi formando praecerat, aquas vocat nebulam illam propter mobilitatem: et ita eamdem rem modo abyssum propter profunditatem, modo tenebras propter absentiam lucis, modo aquas propter mobilitatem appellat.", "olang": "la", "source": "PL 175, col. 36A", "notes": "The most physical Latin reading: the waters are a mist of mixed elements, the Spirit is God's intention. Hugh's Adnotationes are the literal school; his De sacramentis treats the same verse theologically. The TEI reads 'praecerat' for 'praeerat'.", "slot": false}, {"id": "lxx-1-2", "short": "Septuagint", "author": "The Seventy", "tradition": "greek-jewish", "date": -250, "datelabel": "c. 250 BCE", "place": "Alexandria", "lat": 31.2, "lon": 29.92, "answers": ["borne-over"], "senses": ["translation"], "lemma": {"el": "πνεῦμα θεοῦ ἐπεφέρετο ἐπάνω τοῦ ὕδατος", "en": "a spirit of God was borne upon the water"}, "en": "But the earth was unsightly and unfurnished, and darkness was over the deep, and the Spirit of God moved over the water.", "translator": "Brenton 1851", "orig": "ἡ δὲ γῆ ἦν ἀόρατος καὶ ἀκατασκεύαστος, καὶ σκότος ἐπάνω τῆς ἀβύσσου, καὶ πνεῦμα θεοῦ ἐπεφέρετο ἐπάνω τοῦ ὕδατος.", "olang": "el", "source": "LXX Gen 1:2 (Rahlfs)", "notes": "ἐπεφέρετο ('was borne upon') is the reading every Latin 'ferebatur / superferebatur' descends from. The Greek already drops the bird: the verb is motion-over, not brooding.", "slot": false}, {"id": "origen-hom-gen-1-1", "short": "origen-hom-gen-1-1", "author": "Origen", "tradition": "latin", "date": 240, "datelabel": "238–244", "place": "Caesarea Maritima", "lat": 32.5, "lon": 34.89, "answers": ["principio-in-filio"], "senses": ["literal", "allegorical"], "lemma": {"la": "Non ergo hic temporale aliquod principium dicit, sed in principio, id est in Salvatore", "en": "He does not, then, say here any temporal beginning, but that it was made in the beginning, that is, in the Saviour"}, "en": "'In the beginning God made heaven and earth.' What is the beginning of all things but our Lord and 'Saviour of all' Jesus Christ, 'the firstborn of every creature'? In this Beginning, then, that is, in his Word, 'God made heaven and earth', as the Evangelist John also says at the opening of his Gospel: 'in the beginning was the Word, and the Word was with God, and the Word was God. This was in the beginning with God. All things were made through him, and without him was made nothing.' He does not, then, say here any temporal beginning, but says that heaven and earth and all things that were made were made 'in the beginning', that is, in the Saviour. 'And the earth was invisible and unordered, and darkness was over the abyss, and the Spirit of God was borne over the waters.' 'The earth was invisible and unordered' before God said, 'let there be light', and before he 'divided between the light and the darkness', according to what the order of the discourse declares.", "translator": "claude-draft", "orig": "»In principio fecit Deus coelum et terram«. Quod est omnium principium nisi Dominus noster et »Salvator omnium« Iesus Christus »primogenitus omnis creaturae«? In hoc ergo principio, hoc est in verbo suo, »Deus coelum et terram fecit«, sicut et Evangelista Iohannes in initio Evangelii sui ait dicens: »in principio erat verbum, et verbum erat apud Deum, et Deus erat verbum. Hoc erat in principio apud Deum. Omnia per ipsum facta sunt, et sine ipso factum est nihil«. Non ergo hic temporale aliquod principium dicit, sed »in principio«, id est in Salvatore, factum esse dicit coelum et terram et omnia, quae facta sunt. »Terra autem erat invisibilis et incomposita, et tenebrae erant super abyssum, et spiritus Dei ferebatur super aquas«. »Invisibilis et incomposita terra erat«, antequam Deus diceret: »fiat lux« et antequam »divideret inter lucem et tenebras«, secundum quod sermonis ordo declarat.", "olang": "la", "source": "Hom. in Gen. I.1 (GCS 29, ed. W. A. Baehrens, Leipzig 1920, p. 1, lines 1–14)", "notes": "The head of the stream. Every Latin who reads in principio as the Son is downstream of this paragraph, and it states the reading in its strongest form: the beginning of all things is Christ, in principio means in the Word, and — the sentence the tradition kept — non ergo hic temporale aliquod principium dicit. John 1:1–3 is the proof, exactly as it will be in Ambrose and Augustine and the Glossa. Two things are worth noticing against what the later bench does with it. First, Origen reaches the Son without Ps 104:24 and without the word wisdom: the argument is from Col 1:15 and John, not from Solomon. Second, he runs straight on into Gen 1:2 and reads invisibilis et incomposita as a statement about what was so BEFORE the light and the division — a chronology, not a metaphysics — which is not what the Latin bench will make of the phrase. ✅ **Verified at Phase 6 and now in the crux finding**: Baehrens's apparatus to this page cites Chalcidius, *Comm. in Tim.* 276, and the passage was checked against the 1617 Meursius edition independently of Baehrens. Chalcidius reports that Origen had the non-temporal *initium* *ab Hebraeis* and grounds it on Prov 8:22 at length, reaching divine Wisdom as the *primordium* — the rabbinic bench's verse and the rabbinic bench's word, in a Latin commentary of Jerome's century, going nowhere. Chalcidius is **not** built as a witness: the only free text of him is uncorrected OCR of a 1617 print whose page images carry a ProQuest notice, and this edition does not embed Latin it cannot check against a clean page. He needs Waszink's Plato Latinus. The Catena notice in the same apparatus (Origen reads *ἐν ἀρχῇ* as *ἐν σοφίᾳ, τουτέστι τῷ υἱῷ*) is **still unverified** and is deliberately not used in the finding.", "slot": false}, {"id": "targ-neof-1-2", "short": "Neofiti", "author": "Targum Neofiti", "tradition": "rabbinic", "date": 300, "datelabel": "100–400", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["spirit-of-mercy"], "senses": ["translation"], "lemma": {"arc": "וְרוּחַ דְּרַחֲמִין מִן קֳדָם יְיָ הֲוָה מְנַשְּׁבָא", "en": "and a spirit of mercy from before the LORD was blowing"}, "en": "In the beginning, with wisdom, the Word of the LORD created and perfected the heavens and the earth. And the earth was waste and empty, desolate of human and beast, empty of all tillage of plants and of trees; and darkness was spread over the face of the deep, and a spirit of mercy from before the LORD was blowing over the face of the waters.", "translator": "claude-draft-approved", "orig": "מלקדמין בחכמה [בחוכמתא] ברא (ד)יי שכלל [ושכלל] ית שמיא וית ארעא: וארעא הוות תהיא ובהיא וצדי [וצדיה] מן בר נש ומן בעיר וריקנא מן כל פלחן צמחין ומן אילנין וחשוכא פריס על אפי תהומא ורוח דרחמין מן קדם יי הוה מנשבא על אפי מיא: ואמר ממ(רא) [נ\"א ממרה] דיי יהוי נהור והות נהור כגזירת ממריה׃ וגלי קדם יי ית נהורא ארום טב הוא ואפשר ממרא דיי בין נהורא לבין חשוכא׃ וקרא ממרא דיי לנהורא איממ׳ ולחשוכא קרא לליא והוא רמש והוה צפר סדר עבד בראשית יום קדמאיי׃ ואמר ממרא דיי יהוי רקיעא במציעות מיא ויהוי מפרש בין מיא ארעא לבין מיא עיליא׃ וברא יי ית רקיעא ואפרש בין מיא די מן תחות רקיעא ובין מיא די מלעיל לרקיעא [לרקיע שמיא] והוה כן כמימריה׃ וקרא ממרא דיי לרקיעא שמיא והוה רמש והוה צפר סדר עבד בראשית יום תניין׃", "olang": "arc", "source": "Sefaria, Vatican MS Neofiti 1 (whole of 1:1–5 in one segment)", "notes": "'Spirit of mercy' answers the wind/spirit question in a third way: neither the weather nor the Holy Spirit but a divine disposition. Neofiti's 1:1 'with wisdom' is the K1 anchor. Hebrew licence on Sefaria is 'unknown' — the MS transcription is PD in substance; confirm before embedding.", "slot": false}, {"id": "targ-onk-1-2", "short": "Onkelos", "author": "Targum Onkelos", "tradition": "rabbinic", "date": 200, "datelabel": "c. 200", "place": "Babylonia (Sura / Pumbedita)", "lat": 32.5, "lon": 44.4, "answers": ["wind"], "senses": ["translation"], "lemma": {"arc": "וְרוּחָא מִן קֳדָם יְיָ מְנַשְּׁבָא", "en": "and a wind from before the LORD was blowing"}, "en": "And the earth was waste and empty, and darkness was spread over the face of the deep, and a wind from before the LORD was blowing over the face of the waters.", "translator": "claude-draft-approved", "orig": "וְאַרְעָא הֲוַת צָדְיָא וְרֵיקַנְיָא וַחֲשׁוֹכָא פָּרַשׂ עַל אַפֵּי תְהוֹמָא וְרוּחָא מִן קֳדָם יְיָ מְנַשְּׁבָא עַל אַפֵּי מַיָּא", "olang": "arc", "source": "Sefaria, 'Onkelos Genesis'", "notes": "Onkelos makes two decisions at once: ruach is a wind, not a spirit, and 'from before the LORD' keeps God at a remove; merahefet becomes menashva, 'blowing'. No bird, no hovering. Etheridge's PD English exists on Sefaria but did not return by version title; fetch from archive.org.", "slot": false}, {"id": "targ-psj-1-2", "short": "Ps.-Jonathan", "author": "Targum Pseudo-Jonathan", "tradition": "rabbinic", "date": 750, "datelabel": "600–800", "place": "Palestine", "lat": 32.0, "lon": 35.3, "answers": ["spirit-of-mercy"], "senses": ["translation"], "lemma": {"arc": "וְרוּחַ רַחֲמִין מִן קֳדָם יְיָ מְנַתְבָא", "en": "and a spirit of mercies from before the LORD breathed"}, "en": "And the earth was vacancy and desolation, solitary of the sons of men, and void of every animal; and darkness was upon the face of the abyss, and the Spirit of mercies from before the Lord breathed upon the face of the waters.", "translator": "J. W. Etheridge, 1862", "orig": "וְאַרְעָא הֲוַת תַּהֲיָיא וּבַהֲיָיא צַדְיָא מִבְּנֵי נַשׁ וְרֵיקַנְיָא מִן כָּל בְּעִיר וַחֲשׁוֹכָא עַל אַפֵּי תְהוֹמָא וְרוּחַ רַחֲמִין מִן קֳדָם יְיָ מְנַתְבָא עַל אַנְפֵּי מַיָא", "olang": "arc", "source": "Sefaria, 'Targum Jonathan on Genesis'", "notes": "Same 'spirit of mercies' as Neofiti; the verb menatva ('breathed / blew') keeps the Onkelos line. Etheridge embedded verbatim (PD).", "slot": false}, {"id": "vulgate-1-2", "short": "Vulgate", "author": "Jerome", "tradition": "latin", "date": 392, "datelabel": "c. 392", "place": "Bethlehem", "lat": 31.7, "lon": 35.2, "answers": ["borne-over"], "senses": ["translation"], "lemma": {"la": "Spiritus Dei ferebatur super aquas", "en": "the Spirit of God was borne over the waters"}, "en": "But the earth was empty and void, and darkness [was] upon the face of the deep, and the Spirit of God was borne over the waters.", "translator": "claude-draft-approved", "orig": "Terra autem erat inanis et vacua, et tenebrae [ Vulg. addit erant] super faciem abyssi, et Spiritus Dei ferebatur super aquas.", "olang": "la", "source": "PL 28, col. 163C", "notes": "Jerome's own Vulgate keeps the Old Latin/LXX 'ferebatur' even though his Hebrew Questions (same decade) insist the Hebrew means brooding. The Latin bench inherits the verb he declined to change. PL 28 prints Jerome's text without 'erant' and flags the Vulgate's addition.", "slot": false}], "threads": [{"id": "t-k6-01", "from": "vulgate-1-2", "to": "lxx-1-2", "type": "transmits", "evidence": "Jerome renders tohu va-vohu 'inanis et vacua', where the Greek had ἀόρατος καὶ ἀκατασκεύαστος and the Old Latin 'invisibilis et incomposita'. The two Latin lemmas ask different questions — what the earth looked like, and what it lacked — and both are on the bench from the fifth century on.", "crux": "tohu-vabohu"}, {"id": "t-k6-02", "from": "aug-gnm-1-3-5", "to": "lxx-1-2", "type": "transmits", "evidence": "Augustine's lemma throughout is 'terra invisibilis et incomposita', the Old Latin of the Greek pair; he never quotes Jerome's 'inanis et vacua' on this verse, in the Manichaean books, the Confessions or De Genesi ad litteram.", "crux": "tohu-vabohu"}, {"id": "t-k6-03", "from": "basil-hex-2-4", "to": "lxx-1-2", "type": "transmits", "evidence": "Basil expounds ἀόρατος καὶ ἀκατασκεύαστος word by word — invisible for two reasons, unordered because not yet fruitful — and Eustathius' Latin keeps the Old Latin pair, so the Greek argument reaches the Latin bench with its lemma intact.", "crux": "tohu-vabohu"}, {"id": "t-k6-04", "from": "ambrose-hex-1-7-25", "to": "basil-hex-2-4", "type": "echoes", "evidence": "Basil asks why, of two elements built with equal honour, heaven was complete and the earth still unordered; Ambrose answers with the good craftsman who lays a foundation before he distinguishes the parts and adds the adornment. Ambrose is expounding Basil's Hexaemeron through this book (cf. the Syrian at K7).", "crux": "tohu-vabohu"}, {"id": "t-k6-05", "from": "aug-conf-12-21", "to": "aug-gnm-1-3-5", "type": "echoes", "evidence": "The first of the five readings set out in Confessions XII.21 — 'that bodily thing which God made was still the formless matter of bodily things, without order, without light' — is the answer Augustine had given the Manichaeans thirteen years earlier; in the Confessions it is one true reading among five rather than the reading.", "crux": "tohu-vabohu"}, {"id": "t-k6-06", "from": "alcuin-int-30", "to": "lxx-1-2", "type": "transmits", "evidence": "Alcuin's question carries its own source-note, '(Ibid. ex vers. LXX)': he knows the lemma he is glossing is the Septuagint's and not the text his pupils read.", "crux": "tohu-vabohu"}, {"id": "t-k6-07", "from": "angelom-gen-1-2-tohu", "to": "alcuin-int-30", "type": "echoes", "evidence": "'Invisa propter obscuritatem, Incomposita propter deformitatem' is Alcuin's answer to Interrogatio 30 word for word, unattributed, with 'invisa' for 'invisibilis' — and Angelomus has moved it inside a discussion of the Vulgate's lemma, where it glosses 'the other translation'.", "crux": "tohu-vabohu"}, {"id": "t-k6-08", "from": "angelom-gen-1-2-tohu", "to": "bede-gen-1-2-tohu", "type": "echoes", "evidence": "'quale sit coelum, quod primum condiderat, potest intelligi, videlicet quod ab omni hujus mundi volubili statu secretum … manet semper quietum' is Bede's sentence (PL 91:13C), unnamed; Angelomus reads 'divinae praesentiae' where the Corpus Corporum Bede prints 'divinae gloria praescientiae'.", "crux": "tohu-vabohu"}, {"id": "t-k6-09", "from": "glossa-1-2-terra", "to": "bede-gen-1-2-tohu", "type": "cites", "evidence": "The gloss is labelled '(BEDA, Hexaem. tom. II.)' and compresses Bede's paragraph — the two heavens, the upper one filled with angels as soon as it was made, Job 38:7 with the morning stars glossed as the angels — to five sentences.", "crux": "tohu-vabohu"}, {"id": "t-k6-10", "from": "glossa-1-2-ruach", "to": "remigius-gen-1-2-tohu", "type": "cites", "evidence": "The gloss Migne prints under '(STRAB.)' on this lemma — 'Inanis et vacua. Inutilis scilicet, et infructuosa, et incomposita. Omnia enim elementa commixta, confusa, et totum hoc aeris spatium aquis plenum; non quales nunc sunt, sed sicut nebulae tenues' — is Remigius of Auxerre at PL 131:55A, verbatim to the last clause about the waters above the heavens.", "crux": "tohu-vabohu"}, {"id": "t-k6-11", "from": "comestor-hs-1-2-tohu", "to": "glossa-1-2-ruach", "type": "echoes", "evidence": "'machina mundialis adhuc erat inutilis, et infructuosa, et vacua ornatu suo' keeps two of the Glossa's three adjectives and replaces the third ('incomposita') with a phrase of his own; the subject has moved from the earth to the world-machine.", "crux": "tohu-vabohu"}, {"id": "t-k6-12", "from": "wigbod-gen-1-2-tohu", "to": "isidore-quaest-1-2", "type": "cites", "evidence": "'Item spiritaliter: Terra scilicet carnis nostrae inanis et vacua erat, priusquam doctrinae acceperit formam' is Isidore, Quaestiones in Genesim I.2 (PL 83:209B), verbatim.", "crux": "tohu-vabohu"}, {"id": "t-k6-13", "from": "wigbod-gen-1-2-tohu", "to": "aug-gnm-1-3-5", "type": "cites", "evidence": "The same compilation prints Augustine's Manichaean paragraph on this verse verbatim at PL 96:1111B under the Old Latin lemma 'terra invisibilis et incomposita', five columns before it asks 'Cur inanis et vacua?' under the Vulgate's. One book, two Latin texts of Gen 1:2, no seam.", "crux": "tohu-vabohu"}, {"id": "t-k6-14", "from": "abelard-hex-1-2-tohu", "to": "bede-gen-1-2-tohu", "type": "parallel", "evidence": "Both withhold the pair from heaven on the ground that heaven had its inhabitants from the first: Bede from the silence ('why did he say these things of the earth, passing heaven by?'), Abelard from the adversative conjunction in 'terra AUTEM erat inanis'. Abelard does not name Bede, and the reasons for the angels' being passed over are different.", "crux": "tohu-vabohu"}, {"id": "t-k6-15", "from": "abelard-hex-1-2-tohu", "to": "rupert-gen-1-2-tohu", "type": "parallel", "evidence": "The same split of the pair into two privations, sixteen years apart and with the terms distributed differently: Abelard, empty of fruit and void of an inhabitant; Rupert, empty of every shoot and void of all living things. No citation either way.", "crux": "tohu-vabohu"}, {"id": "t-k6-16", "from": "hugh-adnot-1-2-tohu", "to": "abelard-hex-1-2-tohu", "type": "parallel", "evidence": "'Inanis a seminibus; vacua a germinibus' is the same operation again with a third distribution — and Hugh then offers a fourth, hollowness and the mist in the hollow, as an alternative in the same breath. The formula is school property by 1130; no one on this crux claims it.", "crux": "tohu-vabohu"}, {"id": "t-k6-17", "from": "hugh-sacr-1-1-tohu", "to": "lxx-1-2", "type": "cites", "evidence": "'sive, ut alia translatio habet, « incomposita »' names the variant in the act of expounding the Vulgate — the first place on this bench where a reader is told plainly that the clause exists in two Latin forms.", "crux": "tohu-vabohu"}, {"id": "t-k6-18", "from": "hugh-sacr-1-1-tohu", "to": "aug-conf-12-21", "type": "parallel", "evidence": "Hugh's reading — 'heaven and earth' name the matter of all things heavenly and earthly, in which all were created together in essence before they were made one after another in form — is Augustine's fifth reading in Confessions XII.21, reached without citation and stated as the single sense rather than as one of five.", "crux": "tohu-vabohu"}, {"id": "t-k6-19", "from": "bruno-gen-1-2-tohu", "to": "br-2-3", "type": "parallel", "evidence": "The same clause read as a periodization of sacred history, from opposite ends. R. Yehuda bar Simon: tohu is Adam, va-vohu is Cain, the darkness is the generation of Enosh, the deep is the Flood, 'let there be light' is Abraham. Bruno: the earth is empty while the Church is without children, the darkness is the unread Scripture, and the emptiness ends when the fullness of the Gentiles has come in and Israel is saved. No contact is possible; the shape is identical and the contents are opposed.", "crux": "tohu-vabohu"}, {"id": "t-k6-20", "from": "bruno-gen-1-2-tohu", "to": "isidore-quaest-1-2", "type": "echoes", "evidence": "Isidore's 'terra carnis nostrae', the flesh before it takes the form of doctrine, moved from the soul to the Church: Bruno's 'terra nostra' will no longer be called empty and void when it is inhabited by the fullness of so many sons.", "crux": "tohu-vabohu"}, {"id": "t-k6-21", "from": "rashi-1-2a", "to": "br-2-2", "type": "echoes", "evidence": "Rashi's 'tohu is a word for astonishment and desolation, for a person would be astonished and appalled at the bohu in it' is the verb of Bereshit Rabbah 2:2, where the earth sits toheh u-voheh over her lot. The midrash's parable has become a lexical entry, and the one who is astonished has changed from the earth to the reader.", "crux": "tohu-vabohu"}, {"id": "t-k6-22", "from": "rashi-1-2a", "to": "targ-onk-1-2", "type": "echoes", "evidence": "Rashi glosses bohu as 'reikut ve-tzadu', emptiness and waste — the two Aramaic words Onkelos uses to render the whole pair, 'tzadya ve-reikanya', in the other order. Rashi's peshat on the pair is the targum's, split between the two Hebrew words.", "crux": "tohu-vabohu"}, {"id": "t-k6-23", "from": "ibn-ezra-1-2", "to": "b-chag-12a-tohu", "type": "contests", "evidence": "'Now in Sefer Yetzira: tohu — this is the green line, and bohu — these are the mefulamot stones. What is correct is as the Aramaic translator said.' Ibn Ezra names the tradition the Chagigah baraita carries and sets it aside in favour of Onkelos: the pair is a privation, not two objects.", "crux": "tohu-vabohu"}, {"id": "t-k6-24", "from": "ibn-ezra-1-2", "to": "targ-onk-1-2", "type": "cites", "evidence": "'as the Aramaic translator has said' — Onkelos' tzadya ve-reikanya, supported from 'the howling waste of tohu' (Deut 32:10) and 'after tohu' (1 Sam 12:21), where the word means without substance.", "crux": "tohu-vabohu"}, {"id": "t-k6-25", "from": "ramban-1-2-tohu", "to": "b-chag-12a-tohu", "type": "echoes", "evidence": "Both build on Isa 34:11, 'the line of tohu and the stones of bohu', and read it as an inventory of what tohu and bohu are. The baraita: a green line encircling the world, and slimy stones sunk in the deep. Ramban: the cord with which the craftsman marks out the plan of his building, and the stones as the forms in it. Ramban cites Sefer Yetzirah by name in the same paragraph, so the tradition is in front of him.", "crux": "tohu-vabohu"}, {"id": "t-k6-26", "from": "ramban-1-2-tohu", "to": "rashi-1-2a", "type": "echoes", "evidence": "Ramban quotes the Bahir's R. Berekhya — 'what is tohu? a thing which astonishes people' — which is Rashi's etymology from the same root; but in Ramban the thing that astonishes is the primary matter itself, which cannot hold a name, rather than the sight of an empty land.", "crux": "tohu-vabohu"}, {"id": "t-k6-27", "from": "ramban-1-2-tohu", "to": "ibn-ezra-1-2", "type": "contests", "evidence": "Ibn Ezra sets Sefer Yetzirah's green line aside and takes tohu as 'without substance', following Onkelos; Ramban keeps Sefer Yetzirah, cites it approvingly, and makes tohu a substance — the hyle — with bohu for its form. The two commentators Ramban reads side by side on 1:1 divide here on whether the word names anything at all.", "crux": "tohu-vabohu"}, {"id": "t-k6-28", "from": "br-2-3", "to": "br-2-1", "type": "echoes", "evidence": "Both hang on Jer 4:23, 'I have seen the land, and behold, it is tohu va-vohu'. The prophet's re-use of the phrase for a land under judgement is what licenses the whole series of historical readings in Bereshit Rabbah 2; no Latin witness on this crux cites Jer 4:23 at all.", "crux": "tohu-vabohu"}, {"id": "t-k6-x1", "from": "bruno-gen-1-2-tohu", "to": "br-2-4", "type": "parallel", "evidence": "Phase 4. Both read the whole of Gen 1:2 as a periodization of sacred history running to a final redemption, and neither could have known the other. Resh Lakish: tohu is Babylon (Jer 4:23), va-vohu Media, the darkness Greece, the deep Edom, and the spirit hovering is the spirit of the messianic king (Isa 11:2). Bruno of Segni reads the same clause as the ages of the Church. Written at Phase 4 because `br-2-4` was built for K7 and did not carry this crux until then.", "crux": "tohu-vabohu"}], "answers": {"borne-over": {"label": "Borne over", "gloss": "The verb is motion: a spirit carried above the water (LXX ἐπεφέρετο, Vulgate ferebatur)."}, "wind": {"label": "A wind", "gloss": "Ruach is weather, not a person; Onkelos keeps God at a remove."}, "spirit-of-mercy": {"label": "Spirit of mercy", "gloss": "A divine disposition blowing over the waters (Palestinian targums)."}, "messiah": {"label": "Spirit of the Messiah", "gloss": "Resh Lakish: the ruach of Isa 11:2, brought by repentance-as-water."}, "bird-hovering": {"label": "Dove hovering, not touching", "gloss": "Ben Zoma and Rashi: the bird measures a gap; it does not land."}, "fluttering": {"label": "Fluttering", "gloss": "Abelard's report of the Hebrew: volitabat, as the eagle of Deut 32:11."}, "brooding-warmth": {"label": "Bird brooding, warming", "gloss": "Jerome from the Hebrew, Basil's Syrian, then the Latin schools: the Spirit quickens matter like a hen on eggs."}, "power-not-place": {"label": "Power, not place", "gloss": "Augustine: 'above' means sovereignty, not position; the Manichees misread it."}, "craftsman": {"label": "The craftsman's will", "gloss": "The Spirit over the waters as the maker's intention over the wood."}, "love-gift": {"label": "Love, gift, weight", "gloss": "Confessions XIII: why the Spirit alone is said to be above; pondus meum amor meus."}, "trinity": {"label": "The Trinity named", "gloss": "The verse completes Father (in principio), Son (principium), Spirit."}, "heart": {"label": "Over the heart", "gloss": "Isidore's moral reading: the waters are our fluid, dark heart."}, "throne": {"label": "Throne of Glory", "gloss": "Rashi: the throne stands in the air, held by the breath of God's mouth."}, "unus-cardinal": {"label": "The versions keep the cardinal", "gloss": "ἡμέρα μία, dies unus, yoma chad: 'one', not 'first', in every ancient version."}, "unus-grammatical": {"label": "'First' needs a second", "gloss": "The series 'one, second, third' is improper (Bereshit Rabbah); or, first and second are relatives and there was no second yet (Bruno)."}, "unus-alone": {"label": "God was alone that day", "gloss": "Yachid in his world: no angels were made on the first day, so there was no second anything (Bereshit Rabbah, Rashi)."}, "unus-yom-kippur": {"label": "The one day given to Israel", "gloss": "'One day' is the Day of Atonement, the day the Holy One gave them."}, "unus-24-hours": {"label": "One circuit, twenty-four hours", "gloss": "Day and night together make one revolution, and the whole is named from the day alone."}, "unus-repeated": {"label": "The same day repeated", "gloss": "There is one day only — the angelic light — presented once for each kind of thing made (Augustine)."}, "unus-all-time": {"label": "One day = all time", "gloss": "The word holds the whole span of the ages, or the whole work of the six days (Augustine's set-aside reading; Abelard's own)."}, "unus-angelic-unity": {"label": "The unity of angelic dignity", "gloss": "'One' names the undivided attention of the angelic mind, not a place in a series (Angelomus)."}, "unus-eternal-day": {"label": "The true first day is eternal", "gloss": "This day is first only by number and order of creation; the day that is first by nature is uncreated light (Rupert)."}, "day-precedes-night": {"label": "Day before night", "gloss": "Evening is the end of a finished day, morning the end of the night; days are counted from morning to morning."}, "day-follows-night": {"label": "Night before day", "gloss": "'One day' rules that reckoning begins at evening (Ben Zoma, b. Chullin 83a)."}, "night-for-rest": {"label": "Night made for rest", "gloss": "Day is for labour and night for rest, so only the day's bounds are counted."}, "day-is-a-measure": {"label": "The day's measure is a creature", "gloss": "The measure of day and of night was itself made on day one (b. Chagigah 12a)."}, "evening-is-completion": {"label": "Evening completes a work", "gloss": "Vespera is a work perfected, mane the beginning of the next — the Carolingian formula."}, "evening-is-self-knowledge": {"label": "Evening and morning knowledge", "gloss": "The creature known in itself is evening; known in the Word and referred back in praise, morning (Augustine)."}, "evening-moral": {"label": "Evening as sin or temptation", "gloss": "Evening and morning are the deeds of the wicked and the righteous, or sin and renewal, or temptation and the light of justice."}, "simul": {"label": "All things made at once", "gloss": "Creavit omnia simul (Sir 18:1): the days are not successive."}, "six-days-literal": {"label": "Six real days", "gloss": "Created at once in matter, distinguished in form through six successive days (the common doctors, Bonaventure)."}, "principio-temporis": {"label": "In the beginning of time", "gloss": "The word dates the making: time began with the world, and there was no before (Onkelos, Bede, Rabanus, Remigius, Hugh)."}, "principio-in-filio": {"label": "In the Son", "gloss": "Principium is a proper name of the Word, on the strength of John 8:25 and Ps 104:24 (Ambrose, Augustine, Isidore, Alcuin, the Glossa, Rupert, Honorius)."}, "principio-first-of-all": {"label": "First of all things", "gloss": "'In the beginning' means before everything else that follows — in the beginning of the creatures, or on the first day (Augustine's second reading; Bruno, Abelard)."}, "principio-is-first-creature": {"label": "The first creature is a beginning", "gloss": "The first intellectual creature may be called a beginning to the things it heads (Augustine, De Genesi imperfectus)."}, "beginning-is-wisdom": {"label": "In Wisdom", "gloss": "The beginning is Wisdom — which is the Torah on one bench (Prov 8:22, Prov 3:19, Neofiti) and the Son on the other (Ps 104:24)."}, "reshit-is-torah": {"label": "The beginning is the Torah", "gloss": "Reshit is the Torah, called reshit darko: God looked into it as an architect into his plans and created the world (Bereshit Rabbah, Rashi)."}, "reshit-is-israel": {"label": "For the sake of Israel", "gloss": "Reshit is Israel, called reshit tevu'ato (Jer 2:3); the world was made for their sake."}, "reshit-construct": {"label": "'When God began to create'", "gloss": "Bereshit is a construct and the verse a subordinate clause: at the beginning of God's creating (Rashi's plain sense, Ibn Ezra; contested by Ramban)."}, "world-has-a-beginning": {"label": "The world is not eternal", "gloss": "The point of saying 'in the beginning' at all is that the world had one, against the philosophers (Ambrose, Remigius, Hugh, Ramban)."}, "bereshit-book-name": {"label": "It is the book's name", "gloss": "The Hebrews name volumes from their opening words, so bresith is the title of Genesis (Jerome, Wigbod, Angelomus)."}, "six-preceded": {"label": "Six things preceded the world", "gloss": "Torah and the Throne of Glory were made before it; the patriarchs, Israel, the Temple and the Messiah's name were contemplated (Bereshit Rabbah 1:4)."}, "read-it-twice": {"label": "Say the phrase twice", "gloss": "In principio is to be repeated — once in the Son, once at the beginning of time — rather than decided (Comestor)."}, "lux-corporalis": {"label": "A bodily light", "gloss": "A material light made to light material things, standing in the sun's place until the fourth day (Basil, Ambrose, Bede, Hugh, Honorius, Comestor, Bonaventure)."}, "lux-angelica": {"label": "The angelic creation", "gloss": "The light is the spiritual creature called 'heaven' in v. 1, made light by turning to its Creator (Augustine, Angelomus, Rupert)."}, "lux-hidden": {"label": "Stored for the righteous", "gloss": "Too good for the wicked, it was hidden away and is kept for the righteous in the time to come (Bereshit Rabbah, b. Chagigah, Rashi)."}, "lux-garment": {"label": "From the light of his garment", "gloss": "God wrapped himself in it like a garment (Ps 104:2); the heavens were stretched out of it (Bereshit Rabbah, Pirkei de-Rabbi Eliezer)."}, "lux-from-temple": {"label": "From the site of the Temple", "gloss": "The light was created from the place of the sanctuary (Ezek 43:2; Jer 17:12)."}, "lux-becomes-luminaries": {"label": "The luminaries were made from it", "gloss": "The nature of light was made on day one and hung in the firmament on day four (the sages in b. Chagigah 12a; an unnamed opinion in Augustine)."}, "lux-twilight": {"label": "A light like the dawn", "gloss": "Not the sun's brightness but what the sky is before sunrise or after sunset (Remigius, Honorius, Comestor, Hugh)."}, "lux-is-day": {"label": "'Light' just means day", "gloss": "The verse answers itself: he called the light Day, so light here is put for day (Bruno)."}, "lux-is-distinction": {"label": "The distinguishing of the works", "gloss": "The light is the confused heap becoming distinct and knowable, not a thing at all (Abelard)."}, "fiat-is-instantaneous": {"label": "Speaking is making", "gloss": "No interval between the command and the thing: the Hebrew says only 'let it be, and it was' (Ambrose, Basil, Angelomus, Abelard)."}, "pair-is-formless-matter": {"label": "Unformed matter", "gloss": "The pair names the matter God had made and not yet given form to (Augustine, Angelomus, Hugh, Comestor)."}, "pair-is-under-water": {"label": "Hidden under the waters", "gloss": "Invisible because the waters covered it, and because there was neither light nor anyone to see (Basil, Alcuin, Angelomus, Ibn Ezra)."}, "pair-is-unfurnished": {"label": "No seed, no living thing", "gloss": "Empty of shoots and void of animals: a list of what was not there yet (Bede, Remigius, Rupert, Abelard, Hugh, Comestor, the targums)."}, "pair-is-a-name-for-us": {"label": "A name fitted to slow minds", "gloss": "Not a description but the most serviceable word for formlessness, since earth and the deep are the least comely things men know (Augustine, Confessions XII)."}, "pair-many-senses": {"label": "More than one true reading", "gloss": "Five readings of the clause are all true and none can be shown to be Moses' own (Augustine, Confessions XII.21)."}, "pair-is-two-things": {"label": "A green line and slimy stones", "gloss": "Tohu and bohu are two creatures made on the first day: a line encircling the world, and stones sunk in the deep (b. Chagigah 12a, Sefer Yetzirah)."}, "pair-is-matter-and-form": {"label": "Matter and its form", "gloss": "Tohu is the hyle, which can hold no name; bohu is bo hu, the form it puts on (Ramban)."}, "pair-is-astonishment": {"label": "Astonishment", "gloss": "Tohu is what astonishes whoever looks at it — the earth bewildered at her lot, or the reader appalled at the emptiness (Bereshit Rabbah 2:2, Rashi, the Bahir)."}, "pair-is-history": {"label": "The verse tells history", "gloss": "The clause is the first term of a periodization: the generations from Adam, the four kingdoms, or the Church before her children (Bereshit Rabbah 2:1, 2:3, 2:4; Bruno)."}, "pair-is-our-flesh": {"label": "The earth of our flesh", "gloss": "The soul before it has taken the form of doctrine (Isidore, Wigbod, Rabanus, Remigius, Bruno)."}, "pair-is-not-of-heaven": {"label": "Said of earth, not of heaven", "gloss": "The phrase is withheld from heaven, which was filled with angels as soon as it was made (Bede, the Glossa, Angelomus, Abelard)."}, "heaven-first": {"label": "Heaven first", "gloss": "Beit Shammai: the word order is the order of the acts, and a king has his throne made before its footstool (Isa 66:1)."}, "earth-first": {"label": "Earth first", "gloss": "Beit Hillel: a builder raises the lower storey first (Amos 9:6), and Gen 2:4 and Ps 102:26 name the earth before the heavens."}, "both-at-once": {"label": "Both together", "gloss": "The sages, and R. Shimon ben Yoḥai's stewpot and its lid (Isa 48:13); Ambrose, that the order of naming gives heaven no privilege of the firstborn."}, "order-of-dignity": {"label": "Named for dignity, not order", "gloss": "Heaven stands first because it is worthier, or because the account is about to turn to the earth (Hugh of St Victor; R. Yoḥanan's creation-and-completion)."}, "created-then-stretched": {"label": "Created in one order, stretched in the other", "gloss": "Resh Lakish: heaven was created first, the earth was stretched out first — so both proof-texts stand."}, "heaven-earth-is-everything": {"label": "A name for the whole creation", "gloss": "Two visible words standing for all that God made, given so for the weakness of little ones (Augustine, Alcuin, Angelomus, Comestor)."}, "heaven-is-empyrean": {"label": "The empyrean heaven", "gloss": "Not the visible firmament but a fiery — from brightness, not heat — and intellectual heaven, filled with angels as soon as it was made (Remigius, the Glossa, Comestor)."}, "heaven-earth-four-elements": {"label": "The four elements", "gloss": "Heaven names fire and air, earth names earth and water; the verse announces the material first principles of bodies (Ambrose, Abelard, Ramban, Comestor)."}, "et-includes": {"label": "The particle includes", "gloss": "Et ha-shamayim brings in the sun, moon and constellations; ve-et ha-aretz the trees, the plants and the Garden of Eden (Bereshit Rabbah 1:14, b. Chagigah 12a, Ramban)."}, "shamayim-is-water": {"label": "Sham mayim — 'there is water'", "gloss": "The name itself says what heaven is made of: water, or fire and water mingled into the firmament (b. Chagigah 12a)."}, "one-earth-only": {"label": "One earth, and no heaven of heavens here", "gloss": "If the heavens of v. 1 were the intelligible heaven, the earth beside it could not be the ground; the seven earths are seven regions of the one (Ibn Ezra; Abelard, from the other end)."}, "whole-then-parts": {"label": "The whole first, then the parts", "gloss": "V. 1 is a heading: Scripture commends everything God made in two words before going through it with 'God said' (Augustine, Angelomus, the Glossa)."}, "de-nihilo": {"label": "Out of nothing", "gloss": "God made the world, and the matter of the world, from nothing whatever."}, "matter-then-formed": {"label": "Matter first, then formed", "gloss": "Formless matter was created first — first in origin, not in time — and everything else made out of it."}, "matter-is-coeval": {"label": "Matter was already there", "gloss": "God is a craftsman working on a material he did not make. Reported on both benches, held by neither."}, "three-principles": {"label": "God, exemplar, matter", "gloss": "The philosophers' three principles without a principle, named as the position to be refuted."}, "all-of-them-created": {"label": "Of every one of them, creation is written", "gloss": "Each thing the objector calls a pre-existing material has its own verse saying God created it."}, "bara-is-not-ex-nihilo": {"label": "'Created' does not mean from nothing", "gloss": "The verb bara is used of the sea-creatures and of man, who were made from something."}, "creare-vs-formare": {"label": "Created, not formed", "gloss": "Scripture keeps two verbs apart: what has no pre-existing matter is created, what is shaped out of matter is formed."}, "hyle-is-tohu": {"label": "The hyle is tohu", "gloss": "The one created thing is a substance without form, which the Greeks call hyle and Scripture calls tohu."}, "made-from-something-of-god": {"label": "From the light and the snow", "gloss": "Heaven from the light of his garment, earth from the snow beneath the Throne of Glory."}, "craftsman-needs-matter": {"label": "A craftsman needs a material", "gloss": "Wood helps the carpenter, silver the silversmith — the analogy that makes creation from nothing unthinkable."}, "silence-proves-nothing": {"label": "Scripture's silence proves nothing", "gloss": "That Genesis does not say when a thing was made does not make it coeternal with God."}, "world-from-tohu": {"label": "The world was made out of tohu va-vohu", "gloss": "Said with embarrassment, and only because the verse says it."}, "tenebrae-privatio": {"label": "Darkness is not a thing", "gloss": "Darkness is the absence of light, as silence is the ceasing of voice and nakedness the absence of a garment; Scripture never says God made it (Augustine, Angelomus, Hugh)."}, "tenebrae-creatura": {"label": "God made the darkness too", "gloss": "The darkness is a work of God like the light — it is called with the light to bless the Lord in Dan 3, and it is on the rabbinic lists of what was made on the first day (Remigius, the Glossa, Wigbod's pupil; Pirkei de-Rabbi Eliezer, R. Tanḥuma)."}, "tenebrae-angeli": {"label": "The darkness is the apostate angels", "gloss": "The light of day one is the angelic creation and the division is between the holy angels and the unclean (Augustine, City of God XI.19; Angelomus, Hugh, Rupert, Comestor)."}, "tenebrae-peccatores": {"label": "The wicked, or their deeds", "gloss": "The division is moral: the just from sinners (Isidore, Remigius, the Glossa), or the deeds of the righteous from the deeds of the wicked (R. Yanai, R. Abahu)."}, "tenebrae-ignis": {"label": "Darkness names the element of fire", "gloss": "'Darkness' in v. 2 is elemental fire, which is dark; the deep is water and the spirit is air (Ramban)."}, "divisio-loci": {"label": "Divided by place and quality", "gloss": "The two were set apart in space and time — light over the upper part of the world, twelve hours above and twelve below, opposite hemispheres in turn (Basil, Bede, Rabanus, Honorius, Comestor; and R. Yoḥanan's two generals, each given his bound)."}, "divisio-nominis": {"label": "The dividing is the naming", "gloss": "There is no separate act of separation: 'and he divided' means by the calling of names (Ibn Ezra; entertained once by Augustine and dropped)."}, "divisio-est-ordinatio": {"label": "He did not make it but ordered it", "gloss": "God makes the forms and orders the privations, as a singer orders his rests and a painter his shadows, so that even a nothing has its place (Augustine)."}, "divisio-est-judicium": {"label": "The division is a judgement", "gloss": "A sentence passed, and irreversible: on the devil and his angels (Rupert, Hugh), or on the just and sinners by foreknowledge (Isidore)."}, "divisio-est-instantanea": {"label": "The division needed no second act", "gloss": "The two were never mixed: by the very fact that light was made, the division followed, as putting on a garment ends nakedness (Augustine, Hugh)."}, "formatum-ab-informi": {"label": "The formed from the unformed", "gloss": "The dividing is the distinction of the formed thing from the unformed, of the perfect from the imperfect and the distinct from the confused (Wigbod, Abelard, Honorius)."}, "bonum-approbatio": {"label": "'He saw' is approval, not discovery", "gloss": "God did not learn that the light was good: what pleased him to be made pleased him to remain (Alcuin, Comestor), or the seeing is in the thought (Ibn Ezra), or a good work attests itself when seen (Ambrose)."}, "bonum-withheld": {"label": "The approval is deliberately withheld", "gloss": "'It was good' is not repeated after the division, and the divine name is dropped from the naming of the night, so that the darkness should not be approved along with the light (Augustine, Wigbod; R. Elazar, R. Abahu)."}, "havdala-derived": {"label": "The verse is the source of the havdala rule", "gloss": "'He saw … and he divided' — one does not bless over the lamp until he has used its light (R. Ze'eira of Caesarea)."}, "lux-hivdil-set-aside": {"label": "He set the light aside", "gloss": "Va-yavdel means he separated it off — for himself (R. Yehuda bar Simon), or for the righteous in the time to come, like a king setting aside a fine portion for his son (the Rabbis)."}, "one-authority-singular-verb": {"label": "The verb is singular, so one maker", "gloss": "Not vaydaberu but vaydaber, not bare'u but bara — no one may say that two authorities created the world (Bereshit Rabbah 1:7; Ibn Ezra; and, to the opposite end, Abelard)."}, "elohim-is-plural-of-persons": {"label": "Eloim is plural: three persons", "gloss": "El is singular and Eloim plural, showing a diversity of persons each of which is God; the singular verb shows that they are one creator and their works undivided (Abelard)."}, "elohim-is-honorific-plural": {"label": "A plural of honour", "gloss": "Every language honours the great with a plural — adonim, be'alim, the king speaking of himself in Arabic — so Elohim is the plural of eloah and means nothing more (Ibn Ezra). This is his account of the NOUN. He refuses the same reading of the plural VERB at Gen 1:26, where Saadia offers it to him: see plural-of-majesty-refused."}, "elohim-is-plural-of-powers": {"label": "The force of all forces", "gloss": "El hem: the root el is force, and 'they' points to all the other forces, so Elohim is the master of them all — with a secret not disclosed (Ramban)."}, "trinity-in-the-triad": {"label": "Father, Beginning, Spirit", "gloss": "The three persons are named in order across the first two verses: God the Father, the Beginning who is the Son, the Spirit borne over the waters (Augustine, Basil, Ambrose, Bede, Bruno, Honorius, the Glossa)."}, "trinity-in-the-formula": {"label": "The threefold formula of the six days", "gloss": "God said — and it was so — and God made: the testimony is tripled everywhere because the creating Trinity works everywhere (Rupert; considered and refused by Augustine)."}, "trinity-is-brought-to-the-text": {"label": "The rule of faith comes first", "gloss": "The catholic faith is set out before the exposition begins, because heretics drag Scripture to their own opinion; the doctrine is what the chapter is read under (Augustine, De Genesi ad litteram imperfectus)."}, "spirit-is-holy-spirit": {"label": "The spirit of v. 2 is the Holy Spirit", "gloss": "Not the air and not a wind: Scripture reserved the name, and no other spirit is meant but the one who completes the Trinity (Basil, Ambrose)."}, "principium-is-the-son": {"label": "The Beginning is the Son", "gloss": "'I am the beginning, who also speak to you' (John 8:25) — though the Father too is a beginning, and not from a beginning (Wigbod, Remigius, Bruno)."}, "not-to-angels": {"label": "Not spoken to the angels", "gloss": "Whoever the 'let us' addresses, it is not angels: man was not created by angels, or there would be many creators and not one (Bruno)."}, "word-order-is-modesty": {"label": "God is named after his works", "gloss": "A mortal king proclaims his name and builds afterwards; the Holy One made the needs of his world and was named after — bereshit bara, and only then Elohim (R. Yudan in the name of Akilas; Ben Azzai)."}, "word-order-is-dangerous": {"label": "The word order had to be changed", "gloss": "The seventy-two elders wrote 'God created in the beginning' for Ptolemy, so that bereshit could not be read as the subject (b. Megillah 9a)."}, "should-have-begun-at-exodus": {"label": "It should have begun at Exodus 12:2", "gloss": "The Torah is Israel's law book and ought to have opened with the first commandment given to Israel; the creation account has to be accounted for (R. Isaac, in Rashi)."}, "claim-on-the-land": {"label": "Title to the land", "gloss": "'He declared to his people the power of his works, to give them the inheritance of the nations' (Ps 111:6) — so that Israel may answer the charge of robbery (Bereshit Rabbah 1:2; Rashi)."}, "do-not-expound-it": {"label": "It may not be expounded", "gloss": "Not before two, and not the four questions — what is above, what is below, what is before, what is after (m. Chagigah 2:1; Bereshit Rabbah 1:5 and 1:10)."}, "honour-of-the-maker": {"label": "For the honour of the Maker", "gloss": "Whoever has no care for the honour of his Maker, it were fitting he had not come into the world; and the concealed matters are not to be published for the expositor's own glory (m. Chagigah 2:1; Rav Huna in the name of Bar Kappara)."}, "the-bet-is-closed": {"label": "The bet is closed behind", "gloss": "The world was made with a bet, closed on three sides and open in front: you may ask only from the day of creation onward (R. Yona in the name of R. Levi)."}, "beginning-is-blessing": {"label": "Bet for blessing, not alef for curse", "gloss": "Made with the letter of berakhah rather than of arirah, so that the heretics could not say the world was created with a curse (Bereshit Rabbah 1:10)."}, "moses-is-a-witness": {"label": "Moses wrote as a witness", "gloss": "Not in the persuasion of human wisdom nor in the counterfeit disputations of philosophy, but in the showing of the Spirit and of power, as a witness of the divine work (Ambrose)."}, "against-the-philosophers": {"label": "Against the philosophers", "gloss": "Plato's three principles and the atomists' concourse are a spider's web; the divine mind alone contains the origins and causes of things (Ambrose)."}, "against-the-heretics": {"label": "Because the heretics attack it", "gloss": "The Manichees mock the Old Testament before the unlearned, so the first book must be defended, and defended plainly (Augustine)."}, "written-for-the-unlearned": {"label": "In plain speech, for the unlearned", "gloss": "Not with ornate and polished speech but with plain facts — the usual and simple speech the learned also understand (Augustine)."}, "the-work-shows-the-maker": {"label": "The work shows the worker", "gloss": "The world is a specimen of the divine working: like building and weaving, it shows the craftsman's skill even when the craftsman is silent (Ambrose)."}, "scripture-is-about-restoration": {"label": "Scripture is about restoration", "gloss": "The matter of all divine Scripture is the works of human restoration, completed not in six days but in six ages (Hugh of St Victor)."}, "foundation-is-for-secular-writings": {"label": "Foundation belongs to secular writings", "gloss": "The works of foundation are the matter of worldly writings; divine Scripture only descends through them on its way to the Incarnation (Hugh of St Victor)."}, "history-is-the-foundation": {"label": "History is the foundation", "gloss": "Scripture is a hall with foundation, wall and roof — history, allegory, tropology — and nothing can be built before the foundation is laid (Comestor)."}, "faciamus-is-the-trinity": {"label": "'Let us make' is the Trinity", "gloss": "The formula changes at this one verse — everywhere else 'let it be', here 'let us make' — to intimate a plurality of persons; the singular of v. 27 then gives the unity of the deity (Augustine, Bede, Alcuin, Wigbod, Remigius, the Glossa, Rupert, Abelard, Hugh, Comestor)."}, "faciamus-to-the-son": {"label": "The Father speaks to the Son", "gloss": "Not to himself, since the verb is not 'I shall make', and not to servants: the address is to the Son, who is the image (Basil, Ambrose, Comestor; refused by Augustine, since 'to our image' would then have to be 'to yours')."}, "faciamus-to-the-angels": {"label": "He said it to the angels", "gloss": "God took counsel with, or spoke to, the ministering angels — stated outright by Pseudo-Jonathan, argued by Rashi and Ibn Ezra, reported as an option by Remigius, taught with a moral by Hugh, printed at Gen 11:7 by the Glossa, and called a Jewish fiction by Basil."}, "image-of-the-whole-trinity": {"label": "To the image of the Trinity itself", "gloss": "Not to the image of the Father alone, or the Son alone, or the Spirit alone — and who would dare separate the Holy Spirit from that plurality? (Augustine, and the Gloss after him)."}, "counsel-with-the-household-above": {"label": "He took counsel with the household above", "gloss": "Be-mi nimlakh — with the ministering angels, the court that stands to right and left, out of the humility of the Holy One (Bereshit Rabbah 8:3 and 8:8, b. Sanhedrin 38b, Rashi)."}, "consilium-not-senate": {"label": "A soliloquy, not a senate", "gloss": "The counsel was held inwardly — be-libbo nimlakh, he took counsel with his heart; non tam senatu quam soliloquio — though the rabbinic bench draws from it that no second party was present and the Latin bench that three persons were (R. Ami, Rupert, Abelard)."}, "refutation-beside-the-claim": {"label": "The refutation is beside the opening", "gloss": "Wherever the verse gives the minim an opening, the answer stands next to it: 'let us make' answered by 'and he created', 'let us go down' by 'and the LORD came down' (R. Simlai, R. Yoḥanan, Rashi)."}, "dignity-of-the-creature": {"label": "The consultative form marks the creature's standing", "gloss": "A rational creature is made with counsel, so that its nobility may be shown — or, on the other bench, so that the great may learn to ask leave of the lesser (Alcuin, Bede, Hugh, Abelard; Bereshit Rabbah 8:8)."}, "plural-of-majesty-refused": {"label": "Not a plural of majesty", "gloss": "Saadia's reading of na'aseh as royal speech is refused and its proof texts parsed away one by one — 'these witnesses are false witnesses' (Ibn Ezra, against the Gaon, and against his own account of the plural noun at Gen 1:1)."}, "i-and-the-earth": {"label": "I and the earth", "gloss": "The plural has a second subject and it is the ground: the earth to bring forth the body from its elements, God to give the spirit (Ramban, crediting R. Yosef Kimḥi)."}}, "senses": {"literal": "Literal", "allegorical": "Allegorical", "spiritual": "Spiritual", "translation": "Translation"}};
const svg = d3.select('#map'), panel = document.getElementById('panel');
const g = svg.append('g');
const gRings = g.append('g'), gHubLinks = g.append('g'), gEdges = g.append('g'), gHubs = g.append('g'), gNodes = g.append('g'), gLabels = g.append('g');
let W = 800, H = 600, mode = 'answers';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const wn = D.witnesses.map(w => ({...w, kind: 'w'}));
const byId = Object.fromEntries(wn.map(n => [n.id, n]));
const ansKeys = Object.keys(D.answers), senseKeys = Object.keys(D.senses);
const hubsA = ansKeys.map(k => ({id: 'hub:' + k, kind: 'hub', key: k, label: D.answers[k].label, gloss: D.answers[k].gloss, facet: 'answers'}));
const hubsS = senseKeys.map(k => ({id: 'hub:' + k, kind: 'hub', key: k, label: D.senses[k], gloss: '', facet: 'sense'}));
const hubById = Object.fromEntries([...hubsA, ...hubsS].map(h => [h.id, h]));
const threads = D.threads.map(t => ({...t, source: byId[t.from], target: byId[t.to]})).filter(t => t.source && t.target);
const hubLinksA = wn.flatMap(w => w.answers.map(a => ({source: w, target: hubById['hub:' + a]})));
const hubLinksS = wn.flatMap(w => w.senses.map(s => ({source: w, target: hubById['hub:' + s]})));

let k = 1;
function applyScale() {
  nodeSel.attr('r', d => (d.slot ? 6 : 7) / k).attr('stroke-width', 2 / k);
  labelSel.attr('font-size', 11 / k + 'px').attr('dx', 10 / k).attr('dy', 4 / k);
  edgeSel.attr('stroke-width', d => (d.type === 'contests' ? 1.8 : d.type === 'parallel' ? 2 : 1.4) / k).attr('stroke-dasharray', d => d.type === 'echoes' ? `${5/k} ${4/k}` : d.type === 'parallel' ? `${2/k} ${4/k}` : null);
  if (hubSel) { hubSel.attr('r', 13 / k).attr('stroke-width', 1.5 / k); hubLblSel.selectAll('.hublbl').attr('font-size', 12 / k + 'px').attr('y', 30 / k); hubLblSel.selectAll('.hubsub').attr('font-size', 10.5 / k + 'px').attr('y', 43 / k); hubLinkSel.attr('stroke-width', 1 / k).attr('stroke-dasharray', `${1/k} ${3/k}`); }
  gRings.selectAll('text').attr('font-size', 10 / k + 'px'); gRings.selectAll('circle').attr('stroke-width', 1 / k);
}
svg.call(d3.zoom().scaleExtent([.5, 6]).on('zoom', e => { g.attr('transform', e.transform); if (e.transform.k !== k) { k = e.transform.k; applyScale(); } }));

// ---------- drawing
const edgeSel = gEdges.selectAll('path').data(threads).join('path').attr('class', d => 'edge ' + d.type)
  .on('mouseenter', (e, d) => showEdge(d, true)).on('mouseleave', (e, d) => showEdge(d, false)).on('click', (e, d) => { showEdge(d, true); e.stopPropagation(); });
const nodeSel = gNodes.selectAll('circle').data(wn).join('circle').attr('class', d => 'node ' + d.tradition + (d.slot ? ' slot' : '')).attr('r', d => d.slot ? 6 : 7)
  .on('click', (e, d) => { showWitness(d); e.stopPropagation(); }).on('mouseenter', (e, d) => focusNode(d, true)).on('mouseleave', (e, d) => focusNode(d, false))
  .call(d3.drag().on('start', (e, d) => { d.fx = d.x; d.fy = d.y; }).on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; sim.alpha(.3).restart(); }).on('end', (e, d) => { d.fx = null; d.fy = null; }));
const labelSel = gLabels.selectAll('text').data(wn).join('text').attr('class', 'lbl').text(d => d.short);
let hubSel, hubLblSel, hubLinkSel;

const sim = d3.forceSimulation().on('tick', tick);
function tick() {
  edgeSel.attr('d', d => { const {source: s, target: t} = d; const dx = t.x - s.x, dy = t.y - s.y, dr = Math.hypot(dx, dy) * 1.4; return `M${s.x},${s.y}A${dr},${dr} 0 0,1 ${t.x},${t.y}`; });
  nodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
  labelSel.attr('x', d => d.x).attr('y', d => d.y);
  if (hubSel) { hubSel.attr('cx', d => d.x).attr('cy', d => d.y); hubLblSel.attr('transform', d => `translate(${d.x},${d.y})`); hubLinkSel.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y); }
}

function size() { const r = svg.node().getBoundingClientRect(); W = r.width; H = r.height; }

function layout() {
  size(); const cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 40;
  gRings.selectAll('*').remove(); gHubs.selectAll('*').remove(); gHubLinks.selectAll('*').remove(); hubSel = null;
  const labelR = d => d.kind === 'hub' ? 46 : 12 + d.short.length * 2.4;
  sim.nodes(wn).force('charge', null).force('link', null).force('x', null).force('y', null).force('hublink', null).force('collide', d3.forceCollide(labelR).strength(.9));
  if (mode === 'answers' || mode === 'sense') {
    const hubs = mode === 'answers' ? hubsA : hubsS, links = mode === 'answers' ? hubLinksA : hubLinksS;
    hubs.forEach((h, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / hubs.length; h.fx = cx + Math.cos(a) * R * .9; h.fy = cy + Math.sin(a) * R * .9; h.x = h.fx; h.y = h.fy; });
    sim.nodes([...wn, ...hubs]);
    sim.force('charge', d3.forceManyBody().strength(d => d.kind === 'hub' ? -80 : -320))
       .force('hublink', d3.forceLink(links).distance(mode === 'answers' ? 120 : 150).strength(.6))
       .force('link', d3.forceLink(threads).distance(120).strength(.04))
       .force('x', d3.forceX(cx).strength(.03)).force('y', d3.forceY(cy).strength(.03));
    hubLinkSel = gHubLinks.selectAll('line').data(links).join('line').attr('class', 'hublink');
    hubSel = gHubs.selectAll('circle').data(hubs).join('circle').attr('class', 'hub').attr('r', 13).on('click', (e, d) => { showHub(d); e.stopPropagation(); });
    hubLblSel = gHubs.selectAll('g').data(hubs).join('g');
    hubLblSel.append('text').attr('class', 'hublbl').attr('text-anchor', 'middle').attr('y', 30).text(d => d.label);
    hubLblSel.append('text').attr('class', 'hubsub').attr('text-anchor', 'middle').attr('y', 43).text(d => (mode === 'answers' ? hubLinksA : hubLinksS).filter(l => l.target === d).length + ' witnesses');
  } else if (mode === 'time') {
    const dates = wn.map(d => d.date), d0 = Math.min(...dates), d1 = Math.max(...dates);
    const rOf = d => 50 + (d - d0) / (d1 - d0) * (R - 50);
    [0, 500, 1000].forEach(y => { gRings.append('circle').attr('class', 'ring').attr('cx', cx).attr('cy', cy).attr('r', rOf(y)); gRings.append('text').attr('class', 'ringlbl').attr('x', cx + 4).attr('y', cy - rOf(y) - 4).text(y === 0 ? 'year 1' : y); });
    gRings.append('text').attr('class', 'ringlbl').attr('x', cx + R * .7).attr('y', cy + R + 26).text('LATIN →').attr('text-anchor', 'middle');
    gRings.append('text').attr('class', 'ringlbl').attr('x', cx - R * .7).attr('y', cy + R + 26).text('← RABBINIC').attr('text-anchor', 'middle');
    const groups = {'greek-jewish': [], latin: [], rabbinic: []}; wn.forEach(w => groups[w.tradition].push(w));
    Object.values(groups).forEach(a => a.sort((p, q) => p.date - q.date));
    groups['greek-jewish'].forEach(w => { w.tx = cx; w.ty = cy - rOf(w.date); });
    groups.latin.forEach((w, i, a) => { const t = -Math.PI * .42 + (i / Math.max(1, a.length - 1)) * Math.PI * .84; w.tx = cx + Math.cos(t) * rOf(w.date); w.ty = cy + Math.sin(t) * rOf(w.date); });
    groups.rabbinic.forEach((w, i, a) => { const t = Math.PI + Math.PI * .42 - (i / Math.max(1, a.length - 1)) * Math.PI * .84; w.tx = cx + Math.cos(t) * rOf(w.date); w.ty = cy + Math.sin(t) * rOf(w.date); });
    sim.force('x', d3.forceX(d => d.tx).strength(.6)).force('y', d3.forceY(d => d.ty).strength(.6)).force('collide', d3.forceCollide(d => 8 + d.short.length * 1.6).strength(.8));
  } else if (mode === 'place') {
    const lons = wn.map(d => d.lon).filter(Number.isFinite), lats = wn.map(d => d.lat).filter(Number.isFinite);
    const sx = d3.scaleLinear().domain([Math.min(...lons) - 2, Math.max(...lons) + 2]).range([60, W - 120]);
    const sy = d3.scaleLinear().domain([Math.min(...lats) - 1, Math.max(...lats) + 1]).range([H - 50, 50]);
    const seen = new Set();
    wn.forEach(w => { w.tx = sx(w.lon); w.ty = sy(w.lat); if (!seen.has(w.place)) { seen.add(w.place); gRings.append('text').attr('class', 'placelbl').attr('x', w.tx + 12).attr('y', w.ty - 12).text(w.place); } });
    sim.force('x', d3.forceX(d => d.tx).strength(.5)).force('y', d3.forceY(d => d.ty).strength(.5)).force('collide', d3.forceCollide(d => 8 + d.short.length * 1.6).strength(.8));
  }
  applyScale();
  sim.alpha(1).restart();
}

// ---------- panel
function showHome() {
  const q = D.crux.question;
  panel.innerHTML = `<p class="eyebrow">Crux · Genesis 1:2</p><h2>${esc(q.en)}</h2><p class="la-q">${esc(q.la)}</p><p class="heb-q">${esc(q.he)}</p>
  <p>${esc(D.crux.summary)}</p><p>${esc(D.crux.finding)}</p>
  <p class="hint"><b>Answers</b> gathers witnesses around the reading they give; a witness between two hubs holds both. <b>Time</b> is a clock: distance from the centre is the date, Latin to the right, rabbinic to the left. <b>Places</b> is a map. <b>Senses</b> sorts by literal, allegorical, spiritual, translation. Threads keep their meaning in every arrangement. Click a node or a hub; hover a line; drag to pull the graph apart; scroll to zoom: zooming spreads the graph while dots and labels keep their size.</p>`;
}
function showWitness(w) {
  const lem = Object.entries(w.lemma || {}).filter(([k]) => k !== 'en').map(([k, v]) => `<span class="${k === 'he' || k === 'arc' ? 'heb' : 'lat'}" dir="${k === 'he' || k === 'arc' ? 'rtl' : 'ltr'}">${esc(v)}</span>`).join(' ');
  const ocls = (w.olang === 'he' || w.olang === 'arc') ? 'heb' : 'lat';
  const ans = (w.answers || []).map(a => `<span>${esc(D.answers[a]?.label || a)}</span>`).join('');
  const ins = threads.filter(t => t.target === w), outs = threads.filter(t => t.source === w);
  const rel = [...outs.map(t => `→ ${t.type} · ${esc(t.target.short)}`), ...ins.map(t => `← ${t.type} · ${esc(t.source.short)}`)].join('<br>');
  panel.innerHTML = `<p class="eyebrow">${esc(w.tradition.replace('-', ' '))} · ${esc(w.datelabel)} · ${esc(w.place)}</p><h2>${esc(w.author)}</h2><p class="meta">${esc(w.source)}</p>
  <p class="lem">${lem}</p><p>${esc(w.en)}</p><div class="orig ${ocls}">${esc(w.orig)}</div><div class="ans">${ans}</div><p class="note">${esc(w.notes)}</p>
  <p class="cred">${w.translator === 'claude-draft' ? 'Draft English (Claude), awaiting Wilson' : 'English: ' + esc(w.translator)}</p>${rel ? `<p class="cred">${rel}</p>` : ''}`;
  panel.scrollTop = 0;
}
function showHub(h) {
  const links = (h.facet === 'answers' ? hubLinksA : hubLinksS).filter(l => l.target === h);
  panel.innerHTML = `<p class="eyebrow">${h.facet === 'answers' ? 'Answer family' : 'Sense'}</p><h2>${esc(h.label)}</h2><p>${esc(h.gloss)}</p>
  <p class="cred">${links.map(l => esc(l.source.short) + ' · ' + esc(l.source.datelabel)).join('<br>')}</p>`;
  nodeSel.classed('dim', d => !links.some(l => l.source === d)); labelSel.classed('dim', d => !links.some(l => l.source === d));
}
function showEdge(t, on) {
  edgeSel.classed('on', d => on && d === t);
  nodeSel.classed('on', d => on && (d === t.source || d === t.target));
  if (on) { panel.innerHTML = `<p class="eyebrow">${esc(t.type)} · ${esc(t.source.short)} → ${esc(t.target.short)}</p><div class="ev">${esc(t.evidence)}</div>`; }
}
function focusNode(w, on) {
  edgeSel.classed('dim', d => on && d.source !== w && d.target !== w);
  nodeSel.classed('dim', d => on && d !== w && !threads.some(t => (t.source === w && t.target === d) || (t.target === w && t.source === d)));
  labelSel.classed('dim', d => on && d !== w && !threads.some(t => (t.source === w && t.target === d) || (t.target === w && t.source === d)));
}
svg.on('click', () => { nodeSel.classed('dim', false).classed('on', false); labelSel.classed('dim', false); edgeSel.classed('dim', false).classed('on', false); showHome(); });
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; document.querySelectorAll('.modes button').forEach(x => x.setAttribute('aria-pressed', x === b)); layout(); }));
document.querySelectorAll('#filters input').forEach(c => c.addEventListener('change', () => { const off = new Set([...document.querySelectorAll('#filters input')].filter(i => !i.checked).map(i => i.dataset.type)); edgeSel.classed('hidden', d => off.has(d.type)); }));
window.addEventListener('resize', () => layout());
size(); wn.forEach(w => { w.x = W / 2 + (Math.random() - .5) * 200; w.y = H / 2 + (Math.random() - .5) * 200; });
showHome(); layout();
</script>
